[workspace]
resolver = "2"
members = [
    "apps/latentd",
    "apps/latent-control",
    "apps/latent",
    "crates/latent-core",
    "crates/latent-manifest",
    "crates/latent-contracts",
    "crates/latent-artifacts",
    "crates/latent-oci",
    "crates/latent-signing",
    "crates/latent-policy",
    "crates/latent-routing",
    "crates/latent-admission",
    "crates/latent-scheduler",
    "crates/latent-activation",
    "crates/latent-executor",
    "crates/latent-wasmtime",
    "crates/latent-capabilities",
    "crates/latent-blobs",
    "crates/latent-commit",
    "crates/latent-identity",
    "crates/latent-ingress",
    "crates/latent-triggers",
    "crates/latent-state",
    "crates/latent-effects",
    "crates/latent-workflows",
    "crates/latent-wire",
    "crates/latent-wrpc",
    "crates/latent-node",
    "crates/latent-control-store",
    "crates/latent-telemetry",
    "crates/latent-audit",
    "crates/latent-testkit",
    "sdk/rust",
    "tools/toolchain-smoke",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
authors = ["Latent Service Fabric contributors"]
repository = "https://github.com/KirilsTurkins/latent-service-fabric"
homepage = "https://github.com/KirilsTurkins/latent-service-fabric"
description = "Interface-first architecture scaffold for the Latent Service Fabric"

[workspace.dependencies]
blake3 = "=1.8.5"
clap = { version = "=4.6.4", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
toml = { version = "=1.1.4+spec-1.1.0", default-features = false, features = ["display", "parse", "serde"] }
wasmtime = { version = "=47.0.3", default-features = false, features = ["component-model", "component-model-async", "cranelift", "runtime", "std", "wit-parser"] }
wit-bindgen = "=0.60.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
