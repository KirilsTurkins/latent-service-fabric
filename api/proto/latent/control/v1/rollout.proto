syntax = "proto3";

package latent.control.v1;

import "latent/control/v1/common.proto";
import "latent/control/v1/deployment.proto";
import "latent/control/v1/release.proto";

// Operator-controlled single-node stages. Every method requires an administrator and uses
// only the authenticated tenant. Omitted node enablement returns unimplemented.
service RolloutService {
  rpc StartRollout(StartRolloutRequest) returns (StartRolloutResponse);
  rpc ChangeRollout(ChangeRolloutRequest) returns (ChangeRolloutResponse);
  rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse);
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse);
  rpc GetRolloutOperation(GetRolloutOperationRequest) returns (GetRolloutOperationResponse);
  rpc EvaluateRollout(EvaluateRolloutRequest) returns (EvaluateRolloutResponse);
}

message RolloutOperationPrecondition {
  string operation_id = 1;
  // Required: zero for Start, positive for Change. Never unconditional.
  optional uint64 expected_revision = 2;
}

message StartRolloutRequest {
  string id = 1;
  string base_deployment_id = 2;
  // Required positive object version; the candidate ID must be absent.
  optional uint64 expected_base_generation = 3;
  // generation must be zero and route_weight must equal candidate_weights[0].
  Deployment candidate = 4;
  // Strictly increasing basis points, 1..10000, ending at 10000. Stage zero
  // is installed by Start. The supported cohort is exactly base + candidate.
  repeated uint32 candidate_weights = 5;
  RolloutOperationPrecondition operation = 6;
  // Absent preserves the manual profile. Present policies are immutable and
  // require at least two stages plus configured observation capacity.
  RolloutCanaryPolicy canary_policy = 7;
}

// Explicit thresholds, never a universal SLO or an observation proof.
message RolloutCanaryPolicy {
  uint32 format_version = 1;
  uint64 observation_millis = 2;
  uint64 minimum_candidate_samples = 3;
  // Presence is required; zero is a meaningful declared threshold.
  optional uint32 maximum_failure_basis_points = 4;
  // One of the eight fixed inclusive histogram upper bounds in microseconds.
  uint64 latency_threshold_micros = 5;
  optional uint32 maximum_slow_basis_points = 6;
}

message ChangeRolloutRequest {
  string id = 1;
  RolloutOperationPrecondition operation = 2;
  oneof command {
    AdvanceRollout advance = 10;
    Empty pause = 11;
    Empty resume = 12;
    Empty abort = 13;
    PromoteRollout promote = 14;
  }
}

message AdvanceRollout {
  // Must be exactly the next stage. No health-based promotion is implied.
  uint32 next_step = 1;
}

message PromoteRollout {
  // Exactly the next stage; authority comes from the coordinator's own sealed
  // observation, never a submitted healthy flag, counter, report or window ID.
  uint32 next_step = 1;
}

enum RolloutDurability {
  ROLLOUT_DURABILITY_UNSPECIFIED = 0;
  ROLLOUT_DURABILITY_CONFIRMED = 1;
  // The complete selected state is installed, but durable confirmation failed.
  // Reconcile by operation lookup; never infer that a retry is new work.
  ROLLOUT_DURABILITY_UNCERTAIN = 2;
}

message StartRolloutResponse {
  RolloutOperationReceipt receipt = 1;
  AuditAck audit_ack = 2;
  bool replayed = 3;
  RolloutDurability durability = 4;
  RolloutObservation observation = 5;
}

message ChangeRolloutResponse {
  RolloutOperationReceipt receipt = 1;
  AuditAck audit_ack = 2;
  bool replayed = 3;
  RolloutDurability durability = 4;
  RolloutObservation observation = 5;
}

enum RolloutObservationState {
  ROLLOUT_OBSERVATION_STATE_UNSPECIFIED = 0;
  ROLLOUT_OBSERVATION_STATE_COLLECTING = 1;
  ROLLOUT_OBSERVATION_STATE_AWAITING_EVALUATION = 2;
  ROLLOUT_OBSERVATION_STATE_UNAVAILABLE = 3;
  ROLLOUT_OBSERVATION_STATE_RETIRED = 4;
}

// Transient observation availability, independent of committed receipt success.
message RolloutObservation {
  RolloutObservationState state = 1;
  optional uint64 window_epoch = 2;
}

message EvaluateRolloutRequest {
  string id = 1;
  // Required positive current rollout revision. Evaluation may register a
  // missing fresh interval, but it never changes weights or returns authority.
  optional uint64 expected_revision = 2;
}

message EvaluateRolloutResponse {
  CanaryEvaluationReport report = 1;
}

enum CanaryVerdict {
  CANARY_VERDICT_UNSPECIFIED = 0;
  CANARY_VERDICT_COLLECTING = 1;
  CANARY_VERDICT_DRAINING = 2;
  CANARY_VERDICT_NO_DATA = 3;
  CANARY_VERDICT_INSUFFICIENT = 4;
  CANARY_VERDICT_INCOMPLETE = 5;
  CANARY_VERDICT_FAILED = 6;
  CANARY_VERDICT_HEALTHY = 7;
}

enum CanaryDecisionReason {
  CANARY_DECISION_REASON_UNSPECIFIED = 0;
  CANARY_DECISION_REASON_WINDOW_OPEN = 1;
  CANARY_DECISION_REASON_WINDOW_DRAINING = 2;
  CANARY_DECISION_REASON_NO_CANDIDATE_SAMPLES = 3;
  CANARY_DECISION_REASON_MINIMUM_CANDIDATE_SAMPLES = 4;
  CANARY_DECISION_REASON_CAPTURE_INCOMPLETE = 5;
  CANARY_DECISION_REASON_WINDOW_CLOSED_EARLY = 6;
  CANARY_DECISION_REASON_NO_ADMITTED_CANDIDATE = 7;
  CANARY_DECISION_REASON_NO_SUCCESSFUL_CANDIDATE = 8;
  CANARY_DECISION_REASON_FAILURE_RATE_EXCEEDED = 9;
  CANARY_DECISION_REASON_SLOW_RATE_EXCEEDED = 10;
  CANARY_DECISION_REASON_MISSING_CANDIDATE = 11;
  CANARY_DECISION_REASON_HEALTHY = 12;
}

// Diagnostic arithmetic only; Healthy is never a submitted promotion grant.
message CanaryAssessment {
  CanaryVerdict verdict = 1;
  CanaryDecisionReason reason = 2;
  uint64 selected = 3;
  uint64 admitted_terminal = 4;
  uint64 successes = 5;
  uint64 failures = 6;
  uint64 slow = 7;
}

message RolloutCanaryCounters {
  uint64 selected = 1;
  uint64 admitted = 2;
  uint64 admitted_terminal = 3;
  uint64 success = 4;
  uint64 domain_error = 5;
  uint64 platform_error = 6;
  uint64 deadline_exceeded = 7;
  uint64 cancelled = 8;
  // Exactly nine buckets: <=100,1000,5000,10000,50000,100000,1000000,
  // 10000000 microseconds, then overflow. No percentile interpolation.
  repeated uint64 latency_buckets = 9;
}

message CanaryRevisionReport {
  string revision = 1;
  string component_digest = 2;
  optional string package_digest = 3;
  RolloutCanaryCounters counters = 4;
}

message CanaryEvaluationReport {
  string rollout_id = 1;
  uint64 revision = 2;
  uint32 step = 3;
  uint64 route_generation = 4;
  string policy_digest = 5;
  optional uint64 window_epoch = 6;
  string candidate_revision = 7;
  // Declared observation duration, not request latency or recovered elapsed time.
  uint64 duration_millis = 8;
  RolloutObservation observation = 9;
  CanaryAssessment assessment = 10;
  uint64 starts = 11;
  uint64 selected = 12;
  uint64 admitted = 13;
  uint64 terminal = 14;
  uint64 live = 15;
  // The exact registered base/candidate pair, never an unbounded metric series.
  repeated CanaryRevisionReport revisions = 16;
  uint64 unattributed = 17;
  uint64 abandoned = 18;
}

message RolloutCanaryDecision {
  uint32 format_version = 1;
  string policy_digest = 2;
  string control_digest = 3;
  string evidence_digest = 4;
  uint64 window_epoch = 5;
  uint64 observed_millis = 6;
  RolloutCanaryCounters candidate = 7;
  RolloutCanaryCounters baseline = 8;
}

message GetRolloutRequest {
  string id = 1;
}

message GetRolloutResponse {
  optional RolloutStatus status = 1;
}

message ListRolloutsRequest {
  optional string service = 1;
  optional RolloutState state = 2;
  // Cursor binds tenant/filter, catalog state version and owner epoch.
  PageRequest page = 3;
}

message ListRolloutsResponse {
  repeated RolloutStatus rollouts = 1;
  PageResponse page = 2;
  uint64 state_version = 3;
}

message GetRolloutOperationRequest {
  string id = 1;
  string operation_id = 2;
}

enum RolloutOperationLookupDisposition {
  ROLLOUT_OPERATION_LOOKUP_DISPOSITION_UNSPECIFIED = 0;
  ROLLOUT_OPERATION_LOOKUP_DISPOSITION_FOUND = 1;
  // Includes rejected/missing work, foreign scope and evicted receipts. Unknown
  // never establishes that an operation was not started or that routes reverted.
  ROLLOUT_OPERATION_LOOKUP_DISPOSITION_UNKNOWN = 2;
  ROLLOUT_OPERATION_LOOKUP_DISPOSITION_UNCERTAIN = 3;
}

message GetRolloutOperationResponse {
  RolloutOperationLookupDisposition disposition = 1;
  optional RolloutOperationReceipt receipt = 2;
}

enum RolloutState {
  ROLLOUT_STATE_UNSPECIFIED = 0;
  ROLLOUT_STATE_RUNNING = 1;
  ROLLOUT_STATE_PAUSED = 2;
  ROLLOUT_STATE_COMPLETED = 3;
  ROLLOUT_STATE_ABORTED = 4;
  ROLLOUT_STATE_CONFLICTED = 5;
}

enum RolloutAction {
  ROLLOUT_ACTION_UNSPECIFIED = 0;
  ROLLOUT_ACTION_START = 1;
  ROLLOUT_ACTION_ADVANCE = 2;
  ROLLOUT_ACTION_PAUSE = 3;
  ROLLOUT_ACTION_RESUME = 4;
  ROLLOUT_ACTION_ABORT = 5;
  ROLLOUT_ACTION_PROMOTE = 6;
}

enum RolloutReason {
  ROLLOUT_REASON_UNSPECIFIED = 0;
  ROLLOUT_REASON_OPERATOR_REQUESTED = 1;
  ROLLOUT_REASON_STAGE_APPLIED = 2;
  ROLLOUT_REASON_COMPLETED = 3;
  ROLLOUT_REASON_GENERATION_CONFLICT = 4;
  ROLLOUT_REASON_COHORT_CHANGED = 5;
  ROLLOUT_REASON_RELEASE_INELIGIBLE = 6;
  ROLLOUT_REASON_INCOMPATIBLE_RELEASE = 7;
  ROLLOUT_REASON_RESOURCE_LIMIT = 8;
  ROLLOUT_REASON_RECOVERY_REQUIRED = 9;
  ROLLOUT_REASON_OUTCOME_UNCERTAIN = 10;
}

enum RolloutOperationOutcome {
  ROLLOUT_OPERATION_OUTCOME_UNSPECIFIED = 0;
  ROLLOUT_OPERATION_OUTCOME_COMMITTED = 1;
}

message RolloutRelease {
  string deployment_id = 1;
  string component_digest = 2;
  // Absent for a trusted-local source with no real package identity.
  optional string package_digest = 3;
}

message RolloutObjectVersion {
  string deployment_id = 1;
  uint64 generation = 2;
}

// Historical control state, never an execution or health authorization.
message RolloutStatus {
  string id = 1;
  string tenant = 2;
  string service = 3;
  uint64 revision = 4;
  RolloutState state = 5;
  RolloutReason reason = 6;
  uint32 current_step = 7;
  repeated uint32 candidate_weights = 8;
  RolloutRelease base = 9;
  RolloutRelease candidate = 10;
  repeated RolloutObjectVersion objects = 11;
  uint64 route_generation = 12;
  uint64 state_version = 13;
  string plan_digest = 14;
  uint64 previous_route_generation = 15;
  uint64 created_at_unix_millis = 16;
  uint64 updated_at_unix_millis = 17;
  uint64 retained_operation_floor = 18;
  RolloutCanaryPolicy canary_policy = 19;
}

// Only committed operations have durable receipts. Replay returns these exact
// fields; separate response flags describe replay and durability observations.
message RolloutOperationReceipt {
  string rollout_id = 1;
  string tenant = 2;
  string operation_id = 3;
  string request_digest = 4;
  ReleaseActor actor = 5;
  RolloutAction action = 6;
  uint64 expected_revision = 7;
  uint64 revision = 8;
  RolloutOperationOutcome outcome = 9;
  RolloutReason reason = 10;
  uint64 state_version = 11;
  uint64 route_generation = 12;
  RolloutState state = 13;
  uint32 step = 14;
  string plan_digest = 15;
  uint64 completed_at_unix_millis = 16;
  string receipt_digest = 17;
  RolloutCanaryDecision canary_decision = 18;
}
