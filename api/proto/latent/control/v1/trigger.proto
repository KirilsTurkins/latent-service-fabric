syntax = "proto3";

package latent.control.v1;

import "latent/control/v1/common.proto";
import "latent/control/v1/release.proto";

message TriggerTarget {
  string service = 1;
  string contract = 2;
  string function = 3;
  optional string route = 4;
  // Required for the buffered-v1 HTTP profile. Component digests are not selectors.
  PublicationRef publication = 5;
  optional string revision = 6;
  optional uint64 deployment_generation = 7;
}

message Trigger {
  string id = 1;
  ObjectMetadata metadata = 2;
  string kind = 3;
  TriggerTarget target = 4;
  map<string, string> configuration = 5;
  uint64 generation = 6;
}

message ApplyTriggerRequest {
  Trigger trigger = 1;
  optional uint64 expected_generation = 2;
  TriggerOperationPrecondition operation = 3;
}

message ApplyTriggerResponse {
  Trigger trigger = 1;
  repeated string warnings = 2;
  TriggerOperationReceipt receipt = 3;
  bool replayed = 4;
  TriggerDurability durability = 5;
  AuditAck audit_ack = 6;
}

message GetTriggerRequest {
  string id = 1;
}

message GetTriggerResponse {
  optional Trigger trigger = 1;
  uint64 state_version = 2;
  uint64 route_generation = 3;
  TriggerDurability durability = 4;
}

message ListTriggersRequest {
  optional string kind = 1;
  optional string target_service = 2;
  PageRequest page = 3;
}

message ListTriggersResponse {
  repeated Trigger triggers = 1;
  PageResponse page = 2;
  uint64 state_version = 3;
  uint64 route_generation = 4;
}

message DeleteTriggerRequest {
  string id = 1;
  optional uint64 expected_generation = 2;
  TriggerOperationPrecondition operation = 3;
}

message TriggerOperationPrecondition {
  string operation_id = 1;
  optional uint64 expected_state_version = 2;
}
enum TriggerDurability {
  TRIGGER_DURABILITY_UNSPECIFIED = 0;
  TRIGGER_DURABILITY_CONFIRMED = 1;
  TRIGGER_DURABILITY_UNCERTAIN = 2;
}
enum TriggerOperationAction {
  TRIGGER_OPERATION_ACTION_UNSPECIFIED = 0;
  TRIGGER_OPERATION_ACTION_APPLY = 1;
  TRIGGER_OPERATION_ACTION_DELETE = 2;
}
// Retained history is never current permission to route or execute a request.
message TriggerOperationReceipt {
  uint32 format_version = 1;
  string tenant = 2;
  ReleaseActor actor = 3;
  string operation_id = 4;
  TriggerOperationAction action = 5;
  string trigger_id = 6;
  string request_digest = 7;
  uint64 expected_state_version = 8;
  uint64 expected_generation = 9;
  uint64 object_generation = 10;
  uint64 state_version = 11;
  uint64 route_generation = 12;
  string manifest_digest = 13;
  PublicationRef publication = 14;
  string component_digest = 15;
  string deployment_id = 16;
  uint64 deployment_generation = 17;
  string revision = 18;
  uint64 completed_at_unix_millis = 19;
  string receipt_digest = 20;
}
message GetTriggerOperationRequest {
  string operation_id = 1;
}
enum TriggerOperationLookupDisposition {
  TRIGGER_OPERATION_LOOKUP_DISPOSITION_UNSPECIFIED = 0;
  TRIGGER_OPERATION_LOOKUP_DISPOSITION_FOUND = 1;
  // Absent or evicted; never proof that the operation did not run.
  TRIGGER_OPERATION_LOOKUP_DISPOSITION_UNKNOWN = 2;
  TRIGGER_OPERATION_LOOKUP_DISPOSITION_UNCERTAIN = 3;
}
message GetTriggerOperationResponse {
  TriggerOperationLookupDisposition disposition = 1;
  TriggerOperationReceipt receipt = 2;
  uint64 retained_floor = 3;
  uint64 high_watermark = 4;
}

service TriggerService {
  rpc ApplyTrigger(ApplyTriggerRequest) returns (ApplyTriggerResponse);
  rpc GetTrigger(GetTriggerRequest) returns (GetTriggerResponse);
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse);
  rpc DeleteTrigger(DeleteTriggerRequest) returns (Empty);
  rpc GetTriggerOperation(GetTriggerOperationRequest) returns (GetTriggerOperationResponse);
}
