syntax = "proto3";

package latent.control.v1;

import "latent/control/v1/common.proto";

message CapabilityGrant {
  string capability = 1;
  string policy = 2;
  repeated string operations = 3;
  map<string, string> constraints = 4;
}

message AvailabilityPolicy {
  uint32 minimum_cached_copies = 1;
  uint32 minimum_zones = 2;
}

message PlacementPolicy {
  string trust_class = 1;
  repeated string architectures = 2;
  repeated string regions = 3;
  repeated string zones = 4;
  repeated string required_features = 5;
}

message Deployment {
  string id = 1;
  ObjectMetadata metadata = 2;
  string service = 3;
  string release_digest = 4;
  uint32 route_weight = 5;
  repeated CapabilityGrant grants = 6;
  ResourceBudget resources = 7;
  AvailabilityPolicy availability = 8;
  PlacementPolicy placement = 9;
  // Output-only last-mutation version of this deployment, not the current route
  // generation. Unrelated writes leave it unchanged; delete/recreate never
  // reuses an old version. Adapters ignore this field on apply input.
  uint64 generation = 10;
}

message ApplyDeploymentRequest {
  Deployment deployment = 1;
  // Absent: unconditional upsert. Zero: require absence (create only).
  // Positive: require that exact existing deployment version at atomic commit.
  optional uint64 expected_generation = 2;
}

message ApplyDeploymentResponse {
  Deployment deployment = 1;
  repeated string warnings = 2;
  optional AuditAck audit_ack = 3;
}

message GetDeploymentRequest {
  // Resolved within the authenticated principal's tenant by the adapter.
  string id = 1;
}

message GetDeploymentResponse {
  optional Deployment deployment = 1;
}

message ListDeploymentsRequest {
  // Optional filter within the authenticated principal's tenant. Empty is invalid.
  optional string service = 1;
  // Tokens are opaque, tenant/filter-bound and expire after catalog publication
  // or repository reopen. A missing page or zero page_size selects the adapter's
  // configured positive default; omitted and explicit zero are indistinguishable.
  // The adapter enforces repository and whole-response byte limits.
  PageRequest page = 2;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  PageResponse page = 2;
}

message DeleteDeploymentRequest {
  // Resolved within the authenticated principal's tenant by the adapter.
  string id = 1;
  // Absent: delete the existing object. Positive: require its exact version.
  // Zero requires absence, so an existing object conflicts and an absent object
  // returns not-found. This is checked atomically, never by adapter read/check.
  optional uint64 expected_generation = 2;
}

message WatchDeploymentRequest {
  string id = 1;
  uint64 after_generation = 2;
}

message DeploymentEvent {
  string kind = 1;
  Deployment deployment = 2;
  uint64 occurred_at_unix_millis = 3;
}

service DeploymentService {
  // Phase 1 standalone: supported.
  rpc ApplyDeployment(ApplyDeploymentRequest) returns (ApplyDeploymentResponse);
  // Phase 1 standalone: supported.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  // Phase 1 standalone: supported.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // Phase 1 standalone: supported.
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (Empty);
  // Phase 2+ control-plane watch. A Phase 1 standalone adapter must return an
  // explicit unimplemented response.
  rpc WatchDeployment(WatchDeploymentRequest) returns (stream DeploymentEvent);
}
