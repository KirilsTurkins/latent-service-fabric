syntax = "proto3";

package latent.control.v1;

import "latent/control/v1/common.proto";

message ReleaseDescriptor {
  string digest = 1;
  // Server-assigned opaque locator only. A client must not provide a filesystem
  // path and the node must not interpret this value as one.
  string artifact_reference = 2;
  string service = 3;
  string semantic_version = 4;
  string world = 5;
  string publisher = 6;
  string media_type = 7;
  uint64 size_bytes = 8;
  uint64 created_at_unix_millis = 9;
  // Historical catalog admission, never a transferable authorization grant or
  // a promise of current eligibility after trust/clock changes.
  bool admitted = 10;
  map<string, string> annotations = 11;
  // Explicit scope of a catalog descriptor. Phase 1 RPC publication requires it
  // in the capsule manifest; reads return only the authenticated tenant.
  optional string tenant = 12;
}

// The Phase 1 locally trusted publish representation. All byte fields are
// subject to the request-size limits enforced by the adapter.
message CapsuleArtifactUpload {
  bytes capsule_manifest_json = 1;
  bytes component_bytes = 2;
  string component_digest = 3;
  string component_media_type = 4;
  // Versioned bounded export descriptors: {"format_version":1,"contracts":[...]}.
  // Uses the documented typed contract metadata codec, never human signature text.
  bytes contract_metadata_json = 5;
}

// Exact received package bytes. Paths associate layers with the verified package
// configuration; they are never interpreted as client-selected filesystem paths.
message PackageAdmissionLayer {
  string path = 1;
  bytes data = 2;
}

// One exact detached OCI evidence envelope, empty config, and payload. Association
// alone confers no authority; the configured node authority verifies every item.
message PackageAdmissionEvidence {
  bytes manifest = 1;
  bytes configuration = 2;
  bytes payload = 3;
}

// Bounded executable capsule admission. Publisher and tenant authority cannot be
// supplied as request flags: the node authenticates the tenant separately and
// verifies package semantics, publisher, builder, evidence, and configured policy.
message PackageAdmissionUpload {
  bytes manifest = 1;
  bytes configuration = 2;
  repeated PackageAdmissionLayer layers = 3;
  repeated PackageAdmissionEvidence signatures = 4;
  repeated PackageAdmissionEvidence provenance = 5;
  repeated PackageAdmissionEvidence sboms = 6;
}

message PublishReleaseRequest {
  // Optional legacy claims; forbidden with package admission.
  ReleaseDescriptor release = 1;
  // Explicitly trusted-local compatibility only; enforced catalogs reject it.
  CapsuleArtifactUpload artifact = 2;
  // Exactly one of artifact and package must be present. This additive field
  // preserves existing wire numbers without silently discarding either input.
  PackageAdmissionUpload package = 3;
}

message PublishReleaseResponse {
  ReleaseDescriptor release = 1;
  repeated string admission_warnings = 2;
}

message GetReleaseRequest {
  string digest = 1;
}

message GetReleaseResponse {
  optional ReleaseDescriptor release = 1;
}

message ListReleasesRequest {
  optional string service = 1;
  PageRequest page = 2;
}

message ListReleasesResponse {
  repeated ReleaseDescriptor releases = 1;
  PageResponse page = 2;
}

service ReleaseService {
  // Phase 1 standalone: supported.
  rpc PublishRelease(PublishReleaseRequest) returns (PublishReleaseResponse);
  // Phase 1 standalone: supported.
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
  // Phase 1 standalone: supported.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
}
