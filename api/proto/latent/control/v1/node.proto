syntax = "proto3";

package latent.control.v1;

import "latent/control/v1/common.proto";

message CellCapacity {
  string class = 1;
  uint32 total = 2;
  uint32 available = 3;
  bool observation_available = 4;
  bool accepting = 5;
  uint32 active = 6;
  uint32 quarantined = 7;
  uint32 queue_depth = 8;
  uint32 queue_capacity = 9;
  uint32 queued_tenants = 10;
  uint64 rejected = 11;
  uint64 cancellations = 12;
  uint64 expired = 13;
  uint64 granted = 14;
  uint64 total_wait_micros = 15;
  uint64 max_wait_micros = 16;
  uint64 oldest_lease_age_micros = 17;
}

message CacheEntry {
  string key = 1;
  string release_digest = 2;
  string tier = 3;
  uint64 size_bytes = 4;
  uint64 last_access_unix_millis = 5;
}

message NodeDescriptor {
  string id = 1;
  string architecture = 2;
  string operating_system = 3;
  repeated string cpu_features = 4;
  repeated string trust_classes = 5;
  optional string region = 6;
  optional string zone = 7;
  string endpoint = 8;
  string identity = 9;
  map<string, string> attributes = 10;
}

message NodeInventory {
  NodeDescriptor node = 1;
  repeated CellCapacity cell_capacity = 2;
  uint32 memory_pressure_milli = 3;
  uint64 queue_depth = 4;
  uint64 route_generation = 5;
  repeated CacheEntry cache_entries = 6;
  uint64 observed_at_unix_millis = 7;
  NodeCacheSummary cache_summary = 8;
  NodePressureObservation pressure = 9;
  NodeHealthObservation health = 10;
  NodeResourceTopology topology = 11;
  optional NodeQuotaSummary quotas = 12;
  // Conservative returned domain snapshot cost, not process RSS.
  uint64 retained_bytes = 13;
}

enum NodeHealthStatus {
  NODE_HEALTH_STATUS_UNSPECIFIED = 0;
  NODE_HEALTH_STATUS_HEALTHY = 1;
  NODE_HEALTH_STATUS_DEGRADED = 2;
  NODE_HEALTH_STATUS_UNHEALTHY = 3;
}

message NodeHealthObservation {
  NodeHealthStatus status = 1;
  bool ready = 2;
  bool healthy = 3;
  repeated string reasons = 4;
  uint64 observed_at_unix_millis = 5;
}

message NodePressureObservation {
  // False distinguishes unavailable pressure from a measured zero.
  bool load_available = 1;
  optional uint64 load_sample_age_millis = 2;
  uint32 cpu_pressure_milli = 3;
  uint32 memory_pressure_milli = 4;
  uint32 queue_pressure_milli = 5;
  uint32 cache_pressure_milli = 6;
}

message NodeCacheSummary {
  bool available = 1;
  uint64 entries = 2;
  uint64 maximum_entries = 3;
  uint64 source_bytes = 4;
  uint64 maximum_source_bytes = 5;
  uint64 metadata_bytes = 6;
  uint64 maximum_metadata_bytes = 7;
  uint64 compiled_image_bytes = 8;
  uint64 maximum_compiled_image_bytes = 9;
  uint64 preparing = 10;
  uint64 maximum_concurrent_preparations = 11;
  uint64 preparing_source_bytes = 12;
  uint64 preparing_metadata_bytes = 13;
  uint64 hits = 14;
  uint64 misses = 15;
  uint64 evictions = 16;
  uint64 invalidations = 17;
}

enum ResourceOwnership {
  RESOURCE_OWNERSHIP_UNSPECIFIED = 0;
  RESOURCE_OWNERSHIP_NODE_FIXED = 1;
  RESOURCE_OWNERSHIP_ACTIVATION_SCOPED = 2;
  RESOURCE_OWNERSHIP_SERVICE_RESIDENT = 3;
}

message NodeTopologyEntry {
  string name = 1;
  string kind = 2;
  ResourceOwnership ownership = 3;
  uint64 configured_count = 4;
  // Missing means unmeasured; zero is an actual observation.
  optional uint64 active_count = 5;
  map<string, string> attributes = 6;
}

message NodeResourceTopology {
  repeated NodeTopologyEntry entries = 1;
  bool available = 2;
  bool complete = 3;
}

message NodeQuotaUsage {
  uint32 active_activations = 1;
  uint32 queued_activations = 2;
  uint64 reserved_cpu_fuel = 3;
  uint64 reserved_memory_bytes = 4;
}

message NodeQuotaLimits {
  uint32 maximum_concurrent_activations = 1;
  uint32 maximum_queued_activations = 2;
  uint64 maximum_reserved_cpu_fuel = 3;
  uint64 maximum_reserved_memory_bytes = 4;
}

message NodeQuotaSummary {
  NodeQuotaUsage usage = 1;
  NodeQuotaLimits limits = 2;
  uint64 retained_tenants = 3;
}

message RegisterNodeRequest {
  NodeDescriptor node = 1;
}

message RegisterNodeResponse {
  uint64 accepted_route_generation = 1;
  uint64 heartbeat_interval_millis = 2;
}

message ReportInventoryRequest {
  NodeInventory inventory = 1;
}

message HeartbeatRequest {
  string node_id = 1;
  uint64 generation = 2;
  uint64 observed_at_unix_millis = 3;
  bool healthy = 4;
  map<string, string> attributes = 5;
}

message GetNodeRequest {
  string node_id = 1;
}

message GetNodeResponse {
  optional NodeInventory inventory = 1;
}

message ListNodesRequest {
  optional string trust_class = 1;
  optional string region = 2;
  optional string zone = 3;
  PageRequest page = 4;
}

message ListNodesResponse {
  repeated NodeInventory nodes = 1;
  PageResponse page = 2;
}

service NodeService {
  // Phase 2+ cluster registration. Explicitly unimplemented in Phase 1.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  // Phase 2+ cluster reporting. Explicitly unimplemented in Phase 1.
  rpc ReportInventory(ReportInventoryRequest) returns (Empty);
  // Phase 2+ cluster heartbeats. Explicitly unimplemented in Phase 1.
  rpc Heartbeat(HeartbeatRequest) returns (Empty);
  // Phase 1 standalone: returns the local node inventory only.
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  // Phase 1 standalone: returns the bounded local node list only.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // Tenant-scoped operator inspection. Never invokes, cancels or fetches results.
  rpc InspectActivationTree(InspectActivationTreeRequest) returns (InspectActivationTreeResponse);
}

enum DiagnosticStage {
  DIAGNOSTIC_STAGE_UNSPECIFIED = 0;
  DIAGNOSTIC_STAGE_ADMISSION = 1;
  DIAGNOSTIC_STAGE_QUEUE = 2;
  DIAGNOSTIC_STAGE_PREPARATION = 3;
  DIAGNOSTIC_STAGE_BINDING = 4;
  DIAGNOSTIC_STAGE_EXECUTION = 5;
  DIAGNOSTIC_STAGE_PROVIDER = 6;
  DIAGNOSTIC_STAGE_CLEANUP = 7;
  DIAGNOSTIC_STAGE_OUTPUT_VALIDATION = 8;
}

enum DiagnosticReason {
  DIAGNOSTIC_REASON_UNSPECIFIED = 0;
  DIAGNOSTIC_REASON_SIGNATURE_ALLOCATION_LIMIT = 1;
  DIAGNOSTIC_REASON_VALUE_ALLOCATION_LIMIT = 2;
  DIAGNOSTIC_REASON_UNSUPPORTED_COMPONENT_SURFACE = 3;
  DIAGNOSTIC_REASON_UNSUPPORTED_ENGINE_PROFILE = 4;
  DIAGNOSTIC_REASON_PROVIDER_ABSENT = 5;
  DIAGNOSTIC_REASON_BINDING_ABSENT = 6;
  DIAGNOSTIC_REASON_ADMISSION_DENIED = 7;
  DIAGNOSTIC_REASON_GRANT_DENIED = 8;
  DIAGNOSTIC_REASON_QUEUE_PRESSURE = 9;
  DIAGNOSTIC_REASON_GUEST_MEMORY_EXHAUSTED = 10;
  DIAGNOSTIC_REASON_GUEST_FUEL_EXHAUSTED = 11;
  DIAGNOSTIC_REASON_GUEST_RESOURCE_EXHAUSTED = 12;
  DIAGNOSTIC_REASON_PROVIDER_TIMEOUT = 13;
  DIAGNOSTIC_REASON_DEADLINE_EXCEEDED = 14;
  DIAGNOSTIC_REASON_CANCELLED = 15;
  DIAGNOSTIC_REASON_HTTP_RESPONSE_REJECTED = 16;
}

enum DiagnosticProfile {
  DIAGNOSTIC_PROFILE_UNSPECIFIED = 0;
  DIAGNOSTIC_PROFILE_WASMTIME_SERVICE_VALUES_V1 = 1;
  DIAGNOSTIC_PROFILE_WASMTIME_BUFFERED_WEB_VALUES_V1 = 2;
}

message ActivationDiagnostic {
  uint32 schema_version = 1;
  DiagnosticStage stage = 2;
  DiagnosticReason reason = 3;
  optional DiagnosticProfile profile = 4;
  // Exact producer profile SHA-256, lowercase hex; no user-supplied labels.
  optional string profile_digest = 5;
  optional uint64 configured_bound = 6;
  optional uint64 calculated_requirement = 7;
  optional uint64 fixed_bytes = 8;
  optional uint64 lifting_fuel = 9;
  optional uint64 lift_multiplier = 10;
}

message ActivationTreeNode {
  string activation_id = 1;
  optional string parent_activation_id = 2;
  string root_activation_id = 3;
  string phase = 4;
  optional string terminal_state = 5;
  uint64 last_updated_unix_millis = 6;
  optional ActivationDiagnostic diagnostic = 7;
  // Captured trusted caller class/service, excluding subject, claims and secrets.
  string principal_kind = 8;
  optional string caller_service = 9;
  // Absent before successful admission; zero is a real granted zero.
  optional ResourceBudget granted_budget = 10;
  optional uint64 effective_deadline_unix_millis = 11;
  // False means a caught broker observation, not the terminal failure cause.
  // Neither value proves physical provider cleanup or external disposition.
  bool diagnostic_is_terminal = 12;
}

message InspectActivationTreeRequest {
  // A retained authorized parent, root or child. IDs confer no authority.
  string activation_id = 1;
  // Maximum 128 nodes / 64 KiB. Zero selects 32. One page per request.
  PageRequest page = 2;
}

message InspectActivationTreeResponse {
  uint32 schema_version = 1;
  repeated ActivationTreeNode nodes = 2;
  PageResponse page = 3;
  // False for unknown, expired, evicted or unauthorized anchor, without
  // distinguishing foreign history. Absence never proves no external mutation.
  bool history_available = 4;
  bool cursor_expired = 5;
  // Always true: volatile bounded retention cannot certify a complete graph.
  bool retained_history_only = 6;
}
