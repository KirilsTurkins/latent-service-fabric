syntax = "proto3";

package latent.invocation.v1;

message InvocationTarget {
  string tenant = 1;
  string service = 2;
  string contract = 3;
  string function = 4;
  optional string route = 5;
}

message ResourceBudget {
  uint64 cpu_fuel = 1;
  uint64 memory_bytes = 2;
  // The former absolute persistent ceiling is intentionally never reused.
  reserved 3;
  reserved "wall_deadline_unix_millis";
  uint32 child_calls = 4;
  uint32 outbound_requests = 5;
  uint64 state_read_bytes = 6;
  uint64 state_write_bytes = 7;
  uint64 blob_read_bytes = 8;
  uint64 blob_write_bytes = 9;
  uint64 log_bytes = 10;
  uint32 effect_count = 11;
  // Relative to admission. Absent means this layer adds no wall-time ceiling;
  // zero means the activation receives no wall time.
  optional uint64 wall_time_limit_millis = 12;
}

message ErrorDetail {
  string kind = 1;
  map<string, string> fields = 2;
}

message InvokeRequest {
  optional string activation_id = 1;
  optional string parent_activation_id = 2;
  optional string root_activation_id = 3;
  InvocationTarget target = 4;
  bytes payload = 5;
  string media_type = 6;
  optional uint64 deadline_unix_millis = 7;
  uint32 priority = 8;
  optional string idempotency_key = 9;
  ResourceBudget budget = 10;
  map<string, string> metadata = 11;
}

message PlatformError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  // Preserve the legacy map field number/name so structured details cannot be
  // silently flattened or semantically repurposed.
  reserved 4;
  reserved "details";
  repeated ErrorDetail detail_items = 5;
}

message BudgetConsumption {
  uint64 cpu_fuel = 1;
  uint64 peak_memory_bytes = 2;
  uint64 wall_time_micros = 3;
  uint32 child_calls = 4;
  uint32 outbound_requests = 5;
  uint64 state_read_bytes = 6;
  uint64 state_write_bytes = 7;
  uint64 blob_read_bytes = 8;
  uint64 blob_write_bytes = 9;
  uint64 log_bytes = 10;
  uint32 effect_count = 11;
}

message InvokeResponse {
  string activation_id = 1;
  string revision_id = 2;
  string release_digest = 3;
  uint64 route_generation = 4;
  oneof result {
    Success success = 5;
    DeclaredError declared_error = 8;
    PlatformError platform_failure = 9;
  }
  // `error` previously collapsed domain and platform failures. Its field
  // number remains reserved rather than changing its meaning in place.
  reserved 6;
  reserved "error";
  BudgetConsumption consumption = 7;
}

message Success {
  bytes payload = 1;
  string media_type = 2;
  optional string committed_state_version = 3;
  repeated string effect_ids = 4;
  map<string, string> metadata = 5;
}

message DeclaredError {
  string code = 1;
  string message = 2;
  bytes payload = 3;
  string media_type = 4;
  map<string, string> metadata = 5;
}

message CancelRequest {
  string activation_id = 1;
  string reason = 2;
}

message CancelResponse {
  reserved 1;
  reserved "accepted";
  CancelDisposition disposition = 2;
  optional string terminal_state = 3;
}

enum CancelDisposition {
  CANCEL_DISPOSITION_UNSPECIFIED = 0;
  CANCEL_DISPOSITION_ACCEPTED = 1;
  CANCEL_DISPOSITION_ALREADY_TERMINAL = 2;
  CANCEL_DISPOSITION_NOT_FOUND = 3;
}

message GetActivationRequest {
  string activation_id = 1;
}

message ActivationStatus {
  string activation_id = 1;
  string phase = 2;
  optional string terminal_state = 3;
  uint64 last_updated_unix_millis = 4;
  map<string, string> metadata = 5;
  oneof terminal_outcome {
    ActivationSuccessSummary succeeded = 6;
    DeclaredError declared_error = 7;
    PlatformError platform_failure = 8;
  }
  // Present for every terminal activation, including failures.
  BudgetConsumption final_consumption = 9;
  optional uint64 terminal_at_unix_millis = 10;
}

message ActivationSuccessSummary {
  optional string committed_state_version = 1;
  repeated string effect_ids = 2;
  map<string, string> metadata = 3;
}

service InvocationService {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc GetActivation(GetActivationRequest) returns (ActivationStatus);
}
