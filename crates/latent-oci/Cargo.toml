[package]
name = "latent-oci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded authenticated OCI artifact distribution."

[lints]
workspace = true

[dependencies]
latent-core = { path = "../latent-core" }
latent-artifacts = { path = "../latent-artifacts" }
latent-network = { path = "../latent-network" }
base64.workspace = true
bytes = "=1.12.1"
http = "=1.5.0"
http-body.workspace = true
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
serde.workspace = true
serde_json.workspace = true
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
zeroize = "=1.9.0"

[dev-dependencies]
hickory-proto = "=0.26.3"
latent-packaging = { path = "../latent-packaging" }
latent-signing = { path = "../latent-signing" }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile.workspace = true
