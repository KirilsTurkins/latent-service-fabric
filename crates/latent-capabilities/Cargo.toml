[package]
name = "latent-capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded activation-scoped capability authority and provider ownership."

[lints]
workspace = true

[features]
# Explicit trusted fixture construction; never selected by node configuration.
test-support = []

[dependencies]
serde.workspace = true
latent-core = { path = "../latent-core" }
latent-activation = { path = "../latent-activation" }
latent-artifacts = { path = "../latent-artifacts" }
latent-audit = { path = "../latent-audit" }
latent-executor = { path = "../latent-executor" }
latent-policy = { path = "../latent-policy" }
latent-routing = { path = "../latent-routing" }
latent-telemetry = { path = "../latent-telemetry" }
sha2.workspace = true
zeroize = { version = "=1.9.0", features = ["alloc"] }
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["rand"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
getrandom = "=0.4.3"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
latent-manifest = { path = "../latent-manifest" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
