[package]
name = "latent-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded supply-chain admission policy and runtime authorization contracts."

[features]
development-test-host = ["latent-artifacts/development-test-host"]

[[example]]
name = "capsule_authoring"
path = "examples/capsule_authoring.rs"
test = true

[lints]
workspace = true

[dependencies]
latent-core = { path = "../latent-core" }
latent-manifest = { path = "../latent-manifest" }
latent-artifacts = { path = "../latent-artifacts" }
latent-packaging = { path = "../latent-packaging" }
latent-signing = { path = "../latent-signing" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process", "fs"] }

[dev-dependencies]
latent-oci = { path = "../latent-oci" }
tempfile.workspace = true
base64.workspace = true
wasm-encoder.workspace = true
