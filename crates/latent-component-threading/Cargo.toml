[package]
name = "latent-component-threading"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bounded source transforms and routing authentication for owned component continuations."

[lints]
workspace = true

[features]
# Explicit historical diagnostic host only; the default remains the normal catalogue.
rust-thread-diagnostic-legacy = []
# Source proof only; does not admit or enable a runtime profile.
rust-http-combined-preview-diagnostic = []

[dependencies]
# Preserve the source profile's parser/encoder and digest versions. Workspace
# runtime parser and SHA-2 pins remain independent.
wasm-encoder = { version = "=0.259.0", features = ["wasmparser"] }
wasmparser = "=0.262.0"
sha2 = "=0.11.0"

[build-dependencies]
# Same already-locked SHA-2 implementation used by the verifier.
sha2 = "=0.11.0"

[[bin]]
name = "c-context"
path = "src/bin/c-context.rs"
test = false
bench = false

[[bin]]
name = "rust-context"
path = "src/bin/rust-context.rs"
test = false
bench = false
