[package]
name = "latent-blobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Immutable blob contracts and bounded tenant-scoped local storage."

[lints]
workspace = true

[dependencies]
latent-core = { path = "../latent-core" }
latent-capabilities = { path = "../latent-capabilities" }
latent-policy = { path = "../latent-policy" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }
latent-http = { path = "../latent-http" }
getrandom = "=0.4.3"
quick-xml = { version = "=0.42.0", default-features = false }
ring = "=0.17.14"
time = { version = "=0.3.55", features = ["formatting", "macros"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[dev-dependencies]
latent-artifacts = { path = "../latent-artifacts" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
