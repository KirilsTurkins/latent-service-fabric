[package]
name = "latent-streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Gated activation-owned outbound streams with sealed endpoint authority and physical retirement."

[features]
# ADR-0061 requires review before production installation. Qualification is
# explicitly selected and does not change standalone node defaults.
default = []
development-outbound = []

[lints]
workspace = true

[dependencies]
latent-core = { path = "../latent-core" }
latent-network = { path = "../latent-network" }
latent-capabilities = { path = "../latent-capabilities" }
latent-policy = { path = "../latent-policy" }
latent-protected-files = { path = "../latent-protected-files" }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "=0.6.5"
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
hickory-proto = "=0.26.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
latent-artifacts = { path = "../latent-artifacts" }
latent-manifest = { path = "../latent-manifest" }
latent-executor = { path = "../latent-executor" }
latent-activation = { path = "../latent-activation" }
latent-routing = { path = "../latent-routing" }
latent-audit = { path = "../latent-audit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
