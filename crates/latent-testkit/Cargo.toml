[package]
name = "latent-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Conformance interfaces and deterministic utilities for Latent Service Fabric tests."

[lints]
workspace = true

[features]
default = ["runtime"]
# Low-level consumers use default-features = false. Preserve existing harness users.
runtime = ["dep:latent-activation", "dep:latent-executor", "dep:latent-node", "dep:latent-telemetry"]

[dependencies]
latent-core = { path = "../latent-core" }
latent-activation = { path = "../latent-activation", optional = true }
latent-executor = { path = "../latent-executor", optional = true }
latent-node = { path = "../latent-node", optional = true }
latent-telemetry = { path = "../latent-telemetry", optional = true }
tokio = { workspace = true, features = ["process", "io-util"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
latent-artifacts = { path = "../latent-artifacts" }
latent-routing = { path = "../latent-routing" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
