[package]
name = "latent-local-blobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Local immutable blob custody and capability capture."
publish = false

[lints]
workspace = true

[dependencies]
latent-core = { path = "../latent-core" }

[target.'cfg(target_os = "linux")'.dependencies]
latent-capabilities = { path = "../latent-capabilities" }
latent-policy = { path = "../latent-policy" }
latent-state = { path = "../latent-state" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
