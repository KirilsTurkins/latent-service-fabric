[package]
name = "latent-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Typed capability and ownership helpers for LSF WebAssembly guests."

[lints]
workspace = true

[features]
default = []
transaction = ["latent-component-bindings/guest-transaction"]
standard-logging = ["dep:latent-standard-stdio"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
latent-component-bindings = { path = "../../crates/latent-component-bindings" }
latent-standard-stdio = { path = "../rust-standard-stdio", optional = true }
zeroize = { version = "=1.9.1", features = ["alloc"] }
