buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.teavm:teavm-gradle-plugin:0.15.0' }
    configurations.classpath.resolutionStrategy.eachDependency {
        if (requested.group.startsWith('com.fasterxml.jackson')) useVersion '2.18.9'
        if (requested.group.startsWith('org.eclipse.jetty')) useVersion '12.1.10'
    }
}
apply plugin: 'java'
apply plugin: 'org.teavm'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
configurations.configureEach {
    resolutionStrategy.failOnDynamicVersions()
    resolutionStrategy.failOnChangingVersions()
    resolutionStrategy.eachDependency {
        if (requested.group.startsWith('com.fasterxml.jackson')) useVersion '2.18.9'
        if (requested.group.startsWith('org.eclipse.jetty')) useVersion '12.1.10'
    }
}
dependencies { implementation teavm.libs.interop }
teavm {
    c {
        mainClass = 'dev.latent.generated.Bindings'
        preservedClasses = ['dev.latent.generated.Bindings', 'dev.latent.app.Capsule']
        outputDir = layout.buildDirectory.dir('teavm-c').get().asFile
        minHeapSize = 1
        maxHeapSize = 4
        obfuscated = false
    }
}
