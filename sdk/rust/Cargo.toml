[package]
name = "latent-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Typed Rust SDK with an explicitly bounded shared RPC transport."

[features]
default = ["transport"]
transport = ["dep:latent-rpc", "dep:prost", "dep:tokio", "dep:tonic", "dep:http", "dep:http-body", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:zeroize"]

[lints]
workspace = true

[dependencies]
latent-core = { path = "../../crates/latent-core" }
latent-rpc = { path = "../../crates/latent-rpc", optional = true }
prost = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "io-util"], optional = true }
tonic = { workspace = true, optional = true }
http = { version = "=1.5.0", optional = true }
http-body = { workspace = true, optional = true }
hyper = { version = "=1.11.1", features = ["client", "http2"], optional = true }
hyper-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
zeroize = { version = "=1.9.0", optional = true }

[dev-dependencies]
latent-protected-files = { path = "../../crates/latent-protected-files" }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "test-util"] }

[[example]]
name = "provider_client"
required-features = ["transport"]

[[example]]
name = "provider_workflow"
required-features = ["transport"]
