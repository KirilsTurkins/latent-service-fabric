<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 864" role="img" aria-labelledby="package-delivery-title package-delivery-description">
  <title id="package-delivery-title">From reviewed build inputs to current execution authority</title>
  <desc id="package-delivery-description">Capture and review source, WIT and locked dependencies, separately approve executable build inputs, and compile offline. Publisher signatures and build evidence accompany the exact package, transferred directly or through OCI. The node checks its own trust and admission policy and selects an exact publication and route. Every use still requires current release, binding, caller and budget checks. Capsules and supported Angular SSR use fresh activations; admitted static GET and HEAD requests serve public files without a guest Store. Dormant deployments retain code and bounded metadata, not their own worker or listener.</desc>
  <defs>
    <marker id="package-delivery-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#F2CA68"/>
    </marker>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #F3EBDD; }
      .subtitle { font: 400 20px system-ui, sans-serif; fill: #C7BA9C; }
      .title { font: 700 24px system-ui, sans-serif; fill: #F3EBDD; }
      .copy { font: 400 20px system-ui, sans-serif; fill: #F3EBDD; }
      .note { font: 400 18px system-ui, sans-serif; fill: #C7BA9C; }
      .label { font: 600 16px system-ui, sans-serif; fill: #F2CA68; }
      .success { font: 400 20px system-ui, sans-serif; fill: #B9E8BD; }
      .warning { font: 400 20px system-ui, sans-serif; fill: #F8D586; }
    </style>
  </defs>
  <rect width="1440" height="864" rx="28" fill="#0D0D0B"/>
  <text x="72" y="98" class="heading">From reviewed inputs to an authorized publication</text>
  <text x="72" y="138" class="subtitle">Build provenance, publication eligibility and per-call authority remain separate.</text>
  <g data-card="Capture, review, compile">
  <rect x="72" y="202" width="384" height="294" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="104" y="246" class="label">1 / BUILD</text>
  <text x="104" y="286" class="title">Capture, review, compile</text>
  <text x="104" y="329" class="note">Source, WIT and locked inputs.</text>
  <text x="104" y="359" class="note">Record tools, profiles and output.</text>
  <text x="104" y="411" class="note">Approve executable inputs explicitly.</text>
  <text x="104" y="439" class="note">Build offline from captured bytes.</text>
  </g>
  <g data-card="Sign, admit and deploy">
  <rect x="528" y="202" width="384" height="294" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="560" y="246" class="label">2 / DELIVER</text>
  <text x="560" y="286" class="title">Sign, admit and deploy</text>
  <text x="560" y="329" class="note">Signed package and build evidence.</text>
  <text x="560" y="359" class="note">Direct or OCI content transfer.</text>
  <text x="560" y="411" class="note">Node verifies its own trust policy.</text>
  <text x="560" y="439" class="note">Pin publication and route generation.</text>
  </g>
  <g data-card="Authorize each use">
  <rect x="984" y="202" width="384" height="294" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="1016" y="246" class="label">3 / USE</text>
  <text x="1016" y="286" class="title">Authorize each use</text>
  <text x="1016" y="329" class="note">Check current release and bindings.</text>
  <text x="1016" y="359" class="note">Selected policy and resource limits.</text>
  <text x="1016" y="411" class="note">Warm code is not an execution grant.</text>
  <text x="1016" y="439" class="note">Inspect uncertain operation receipts.</text>
  </g>
  <path d="M 468 344 H 514" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#package-delivery-arrow)"/>
  <path d="M 924 344 H 970" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#package-delivery-arrow)"/>
  <!-- Serving public files and running a guest are distinct dispatch paths. -->
  <path d="M 1176 496 V 532 H 384 V 556" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#package-delivery-arrow)"/>
  <path d="M 1176 532 H 1056 V 556" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#package-delivery-arrow)"/>
  <g data-card="Capsule or supported SSR">
  <rect x="72" y="568" width="624" height="148" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="104" y="612" class="title">Capsule or supported SSR</text>
  <text x="104" y="652" class="copy">Fresh activation, current grants and limits.</text>
  <text x="104" y="684" class="note">Mutable guest state ends with the invocation.</text>
  </g>
  <g data-card="Static file delivery">
  <rect x="744" y="568" width="624" height="148" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="776" y="612" class="title">Static file delivery</text>
  <text x="776" y="652" class="copy">Admitted public files on configured routes.</text>
  <text x="776" y="684" class="note">GET/HEAD do not create a guest Store.</text>
  </g>
  <text x="72" y="788" class="note">Dormant deployments add code and bounded metadata; node workers and listeners stay shared.</text>
</svg>
