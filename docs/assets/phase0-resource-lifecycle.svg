<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="phase0-lifecycle-title phase0-lifecycle-description">
  <title id="phase0-lifecycle-title">Phase 0 activation resource lifecycle</title>
  <desc id="phase0-lifecycle-description">A prepared component is held in a bounded node-owned cache. An invocation leases a cell, creates fresh activation-owned execution state, and then releases or quarantines the cell after cleanup. No idle service owns a process, listener, socket, heap, or thread.</desc>
  <defs>
    <linearGradient id="phase0-lifecycle-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b102d"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="phase0-lifecycle-source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="phase0-lifecycle-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#bfdbfe"/>
    </marker>
    <filter id="phase0-lifecycle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#09090b" flood-opacity=".38"/>
    </filter>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #faf5ff; }
      .subheading { font: 400 18px system-ui, sans-serif; fill: #ddd6fe; }
      .box-title { font: 700 21px system-ui, sans-serif; fill: #f8fafc; }
      .box-copy { font: 400 15px system-ui, sans-serif; fill: #e0e7ff; }
      .small { font: 600 14px system-ui, sans-serif; fill: #c4b5fd; }
      .release { font: 700 18px system-ui, sans-serif; fill: #d1fae5; }
      .quarantine { font: 700 18px system-ui, sans-serif; fill: #fde68a; }
      .footer { font: 700 17px system-ui, sans-serif; fill: #e0e7ff; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="34" fill="url(#phase0-lifecycle-background)"/>
  <text x="74" y="88" class="heading">Activation state is temporary; node resources stay bounded</text>
  <text x="74" y="122" class="subheading">The Phase 0 lifecycle separates reusable node-owned resources from fresh activation-owned state.</text>

  <text x="74" y="190" class="small">NODE-OWNED, BOUNDED</text>
  <text x="692" y="190" class="small">ACTIVATION-OWNED, FRESH EACH INVOCATION</text>

  <g filter="url(#phase0-lifecycle-shadow)">
    <rect x="74" y="226" width="276" height="292" rx="24" fill="url(#phase0-lifecycle-source)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="110" y="278" class="box-title">Prepared component</text>
    <text x="110" y="314" class="box-copy">validated capsule and</text>
    <text x="110" y="338" class="box-copy">bounded preparation cache</text>
    <line x1="110" y1="370" x2="314" y2="370" stroke="#c4b5fd" stroke-width="1"/>
    <text x="110" y="408" class="small">reused only as node-owned</text>
    <text x="110" y="432" class="small">immutable prepared state</text>

    <rect x="426" y="226" width="208" height="292" rx="24" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="458" y="278" class="box-title">Cell lease</text>
    <text x="458" y="314" class="box-copy">fixed pool capacity</text>
    <text x="458" y="338" class="box-copy">bounded queue</text>
    <line x1="458" y1="370" x2="602" y2="370" stroke="#a5b4fc" stroke-width="1"/>
    <text x="458" y="408" class="small">one activation at a time</text>
    <text x="458" y="432" class="small">per leased cell</text>

    <rect x="710" y="226" width="326" height="292" rx="24" fill="#1e40af" stroke="#93c5fd" stroke-width="3"/>
    <text x="748" y="278" class="box-title">Fresh activation state</text>
    <text x="748" y="314" class="box-copy">store · host state · instance</text>
    <text x="748" y="338" class="box-copy">limiter · buffers · cancellation probe</text>
    <text x="748" y="362" class="box-copy">bounded logs and timing state</text>
    <line x1="748" y1="394" x2="998" y2="394" stroke="#93c5fd" stroke-width="1"/>
    <text x="748" y="432" class="small">all terminal outcomes stay local</text>
    <text x="748" y="456" class="small">before reuse or quarantine</text>

    <rect x="1112" y="226" width="254" height="132" rx="22" fill="#065f46" stroke="#34d399" stroke-width="3"/>
    <text x="1144" y="276" class="release">Release</text>
    <text x="1144" y="308" class="box-copy">cleanup proved safe</text>
    <text x="1144" y="332" class="box-copy">cell becomes reusable</text>

    <rect x="1112" y="386" width="254" height="132" rx="22" fill="#78350f" stroke="#fbbf24" stroke-width="3"/>
    <text x="1144" y="436" class="quarantine">Quarantine</text>
    <text x="1144" y="468" class="box-copy">cleanup cannot be proved</text>
    <text x="1144" y="492" class="box-copy">cell leaves reusable capacity</text>
  </g>

  <path d="M 352 372 H 416" stroke="#bfdbfe" stroke-width="5" marker-end="url(#phase0-lifecycle-arrow)"/>
  <path d="M 636 372 H 700" stroke="#bfdbfe" stroke-width="5" marker-end="url(#phase0-lifecycle-arrow)"/>
  <path d="M 1038 326 H 1102" stroke="#34d399" stroke-width="6" marker-end="url(#phase0-lifecycle-arrow)"/>
  <path d="M 1038 432 H 1102" stroke="#fbbf24" stroke-width="6" marker-end="url(#phase0-lifecycle-arrow)"/>

  <rect x="74" y="620" width="1292" height="58" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="104" y="656" class="footer">Idle services own no persistent process, listener, socket, heap, thread, connection pool, or activation state.</text>
</svg>
