<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="activation-lifecycle-title activation-lifecycle-description">
  <title id="activation-lifecycle-title">Fresh activation state, retained waits and explicit cell cleanup</title>
  <desc id="activation-lifecycle-description">A node shares fixed cells, caches and providers. Each invocation pins a release and policy, reserves its budget, prepares code and runs with a fresh Store in a fixed cell. An asynchronous wait yields a worker but retains the Store, cell and original budget; an accepted child uses a separate cell. Every terminal outcome enters cleanup. Only the backend cleanup proof permits cell reuse. Uncertain cleanup quarantines the cell. Retained result and native-memory owners remain charged until their actual backing retires, independently of the result or Store lifetime.</desc>
  <defs>
    <marker id="activation-lifecycle-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#F2CA68"/>
    </marker>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #F3EBDD; }
      .subtitle { font: 400 20px system-ui, sans-serif; fill: #C7BA9C; }
      .title { font: 700 24px system-ui, sans-serif; fill: #F3EBDD; }
      .copy { font: 400 20px system-ui, sans-serif; fill: #F3EBDD; }
      .note { font: 400 18px system-ui, sans-serif; fill: #C7BA9C; }
      .label { font: 600 16px system-ui, sans-serif; fill: #F2CA68; }
      .success { font: 400 20px system-ui, sans-serif; fill: #B9E8BD; }
      .warning { font: 400 20px system-ui, sans-serif; fill: #F8D586; }
    </style>
  </defs>
  <rect width="1440" height="960" rx="28" fill="#0D0D0B"/>
  <text x="72" y="98" class="heading">Fresh execution ends in a separate cleanup decision</text>
  <text x="72" y="138" class="subtitle">Waiting, returning a result and releasing physical memory are different events.</text>
  <!-- Shared infrastructure has no idle guest per deployment. -->
  <g data-card="Node owned: fixed cells, bounded code caches, policy and provider pools">
  <rect x="72" y="184" width="1296" height="72" rx="24" fill="#242017" stroke="#9F8C62" stroke-width="2"/>
  <text x="104" y="228" class="title">Node owned: fixed cells, bounded code caches, policy and provider pools</text>
  </g>
  <g data-card="Select and admit">
  <rect x="72" y="304" width="384" height="204" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="104" y="348" class="title">Select and admit</text>
  <text x="104" y="394" class="note">Pin release, principal and policy.</text>
  <text x="104" y="426" class="note">Reserve budget; prepare code.</text>
  <text x="104" y="474" class="label">ONE ORIGINAL DEADLINE</text>
  </g>
  <g data-card="Run in a fixed cell">
  <rect x="528" y="304" width="384" height="204" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="560" y="348" class="title">Run in a fixed cell</text>
  <text x="560" y="394" class="note">Fresh Store, instance and memory.</text>
  <text x="560" y="426" class="note">Host calls use current grants.</text>
  <text x="560" y="474" class="label">FRESH STATE EACH INVOCATION</text>
  </g>
  <g data-card="Retire the activation">
  <rect x="984" y="304" width="384" height="204" rx="24" fill="#191812" stroke="#9F8C62" stroke-width="2"/>
  <text x="1016" y="348" class="title">Retire the activation</text>
  <text x="1016" y="394" class="note">Return, trap, cancel or timeout.</text>
  <text x="1016" y="426" class="note">Destroy Store; assess cleanup.</text>
  <text x="1016" y="474" class="label">RESULT IS NOT A REUSE PROOF</text>
  </g>
  <path d="M 468 402 H 514" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#activation-lifecycle-arrow)"/>
  <path d="M 924 402 H 970" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#activation-lifecycle-arrow)"/>
  <!-- A wait is an ownership note, not a durable suspension phase. -->
  <path d="M 720 508 V 528" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#activation-lifecycle-arrow)" stroke-dasharray="8 6"/>
  <g data-card="Async waits keep the activation live">
  <rect x="72" y="540" width="840" height="124" rx="24" fill="#242017" stroke="#9F8C62" stroke-width="2"/>
  <text x="104" y="584" class="title">Async waits keep the activation live</text>
  <text x="104" y="615" class="note">Store, cell and budget stay owned while the worker yields.</text>
  <text x="104" y="641" class="note">A child call gets its own cell or a prompt capacity refusal.</text>
  </g>
  <path d="M 1176 508 V 684 H 384 V 704" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#activation-lifecycle-arrow)"/>
  <path d="M 1176 684 V 704" fill="none" stroke="#F2CA68" stroke-width="3" stroke-linejoin="round" marker-end="url(#activation-lifecycle-arrow)"/>
  <g data-card="Cleanup proved">
  <rect x="72" y="716" width="624" height="120" rx="24" fill="#15331F" stroke="#88BF8E" stroke-width="2"/>
  <text x="104" y="760" class="title">Cleanup proved</text>
  <text x="104" y="792" class="success">Reuse only under the backend cleanup proof.</text>
  <text x="104" y="819" class="note">Escaped memory keeps its original owner.</text>
  </g>
  <g data-card="Cleanup uncertain">
  <rect x="744" y="716" width="624" height="120" rx="24" fill="#35260B" stroke="#CFA546" stroke-width="2"/>
  <text x="776" y="760" class="title">Cleanup uncertain</text>
  <text x="776" y="792" class="warning">Quarantine the cell and unresolved owners.</text>
  <text x="776" y="819" class="note">A timeout is not physical retirement.</text>
  </g>
  <text x="72" y="884" class="note">Release retained-memory charges only after the actual backing retires, including retained results.</text>
</svg>
