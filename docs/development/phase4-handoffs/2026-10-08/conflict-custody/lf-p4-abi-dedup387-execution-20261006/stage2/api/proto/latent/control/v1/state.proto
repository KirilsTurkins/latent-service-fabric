syntax = "proto3";

package latent.control.v1;

import "latent/transaction/v1/transaction.proto";
import "latent/control/v1/release.proto";
import "latent/control/v1/common.proto";

message InspectNamespaceRequest {
  latent.transaction.v1.TransactionProfile profile = 1;
  latent.transaction.v1.NamespaceSelector namespace = 2;
  // A requested current target, not a grant or historical execution authority.
  // The existing publication/binding resolver checks its authenticated tenant,
  // installed exact service/publication and current state read/write policy.
  PublicationRef authorization_publication = 3;
}

enum NamespaceStatus {
  NAMESPACE_STATUS_UNSPECIFIED = 0;
  NAMESPACE_STATUS_ACTIVE = 1;
  NAMESPACE_STATUS_QUIESCING = 2;
  NAMESPACE_STATUS_RETIRED = 3;
  NAMESPACE_STATUS_TOMBSTONE = 4;
}

message NamespaceQuota {
  uint64 state_keys = 1;
  uint64 state_bytes = 2;
  uint64 result_rows = 3;
  uint64 result_bytes = 4;
  uint64 effect_rows = 5;
  uint64 effect_bytes = 6;
  uint64 payload_bytes = 7;
  uint64 recovery_bytes = 8;
}

message NamespaceConfiguration {
  string state_schema = 1;
  NamespaceQuota quota = 2;
}

message NamespaceInspection {
  latent.transaction.v1.ViewIdentity view = 1;
  uint64 encoded_state_bytes = 2;
  uint64 command_count = 3;
  uint64 pending_effect_count = 4;
  repeated latent.transaction.v1.LinkedRetention retained_formats = 5;
  string engine_profile = 6;
  string engine_profile_digest = 7;
  NamespaceStatus status = 8;
  NamespaceQuota quota = 9;
  uint64 generation = 10;
  // Captured configuration precondition only; this digest supplies no grant.
  string namespace_policy_digest = 11;
}

enum NamespaceMutationKind {
  NAMESPACE_MUTATION_KIND_UNSPECIFIED = 0;
  NAMESPACE_MUTATION_KIND_CREATE = 1;
  NAMESPACE_MUTATION_KIND_QUIESCE = 2;
  NAMESPACE_MUTATION_KIND_RETIRE = 3;
  NAMESPACE_MUTATION_KIND_DESTROY = 4;
  NAMESPACE_MUTATION_KIND_RECREATE = 5;
}

message MutateNamespaceRequest {
  InspectNamespaceRequest namespace = 1;
  string operation_id = 2;
  NamespaceMutationKind mutation = 3;
  // Create requires a present zero generation; transitions require positive.
  // The host preserves this original precondition through receipt recovery.
  optional uint64 expected_generation = 4;
  // Required only for create/recreate; no arbitrary state key/value editing.
  NamespaceConfiguration configuration = 5;
}

enum StateOperationDisposition {
  STATE_OPERATION_DISPOSITION_UNSPECIFIED = 0;
  STATE_OPERATION_DISPOSITION_COMMITTED = 1;
  STATE_OPERATION_DISPOSITION_CONFLICT = 2;
  STATE_OPERATION_DISPOSITION_REJECTED = 3;
  STATE_OPERATION_DISPOSITION_UNKNOWN = 4;
  STATE_OPERATION_DISPOSITION_RECOVERY_REQUIRED = 5;
}

message NamespaceOperationReceipt {
  string operation_id = 1;
  string receipt_id = 2;
  NamespaceMutationKind mutation = 3;
  latent.transaction.v1.NamespaceSelector namespace = 4;
  string authenticated_operator = 5;
  optional uint64 before_generation = 6;
  uint64 after_generation = 7;
  NamespaceStatus status = 8;
  string state_schema = 9;
  StateOperationDisposition disposition = 10;
}

message MutateNamespaceResponse {
  NamespaceOperationReceipt receipt = 1;
  bool replayed = 2;
  // A known operation outcome and audit persistence are independent facts.
  AuditAck audit_ack = 3;
}

message SelectEntityRequest {
  InspectNamespaceRequest namespace = 1;
  optional bytes prefix = 2;
  latent.transaction.v1.PageRequest page = 3;
}

message EntityInspection {
  string entity = 1;
  bytes version = 2;
}

message SelectEntityResponse {
  repeated EntityInspection entities = 1;
  latent.transaction.v1.PageResponse page = 2;
}

enum StateMutationKind {
  STATE_MUTATION_KIND_UNSPECIFIED = 0;
  STATE_MUTATION_KIND_RETRY_KNOWN_FAILED_EFFECT = 1;
  STATE_MUTATION_KIND_TERMINATE_EFFECT = 2;
  STATE_MUTATION_KIND_PURGE_EXPIRED_PAYLOAD = 3;
  STATE_MUTATION_KIND_CHECKPOINT_NAMESPACE = 4;
  STATE_MUTATION_KIND_RECONCILE_EFFECT = 5;
}

message PlanEffectMutationRequest {
  latent.transaction.v1.GetEffectRequest effect = 1;
  string operation_id = 2;
  StateMutationKind mutation = 3;
  // Exact supported durable row version, never refreshed automatically.
  bytes expected_version = 4;
  string expected_policy_digest = 5;
  string reason = 6;
  // Redrive only: 1..60000. Other actions require zero.
  uint64 retry_delay_millis = 7;
}

enum EffectPlanSafety {
  EFFECT_PLAN_SAFETY_UNSPECIFIED = 0;
  EFFECT_PLAN_SAFETY_KNOWN_NONEXECUTION = 1;
  EFFECT_PLAN_SAFETY_QUALIFIED_DEDUPLICATION = 2;
  EFFECT_PLAN_SAFETY_PROVIDER_RECEIPT_LOOKUP = 3;
  EFFECT_PLAN_SAFETY_ADMINISTRATOR_DECLARED = 4;
}

message EffectManagementPlan {
  // Immutable original selectors, including the original access publication.
  PlanEffectMutationRequest original = 1;
  bytes plan_digest = 2;
  // Bounded host management slot, distinct from zero-based staged intents.
  uint32 management_sequence = 3;
  // All zero for an undispatched row; otherwise the exact completed attempt.
  uint64 owner_epoch = 4;
  uint64 claim_generation = 5;
  uint32 dispatch_attempt = 6;
  uint64 expires_at_unix_millis = 7;
  uint64 prepared_at_unix_millis = 8;
  latent.transaction.v1.EffectDisposition before = 9;
  EffectPlanSafety safety = 10;
  optional uint64 dedup_valid_until_unix_millis = 11;
}

message PlanEffectMutationResponse {
  EffectManagementPlan plan = 1;
  bool replayed = 2;
  AuditAck audit_ack = 3;
}

enum EffectManagementFact {
  EFFECT_MANAGEMENT_FACT_UNSPECIFIED = 0;
  EFFECT_MANAGEMENT_FACT_REDRIVE_SCHEDULED = 1;
  EFFECT_MANAGEMENT_FACT_PROVIDER_CONFIRMED = 2;
  EFFECT_MANAGEMENT_FACT_ADMINISTRATOR_TERMINATED = 3;
}

message EffectManagementReceiptDetails {
  EffectManagementPlan original_plan = 1;
  latent.transaction.v1.EffectDisposition before = 2;
  latent.transaction.v1.EffectDisposition after = 3;
  EffectManagementFact fact = 4;
  // A provider observation and an administrator declaration are separate facts.
  optional string provider_receipt = 5;
  optional uint64 provider_observed_at_unix_millis = 6;
}

message MutateStateRequest {
  InspectNamespaceRequest namespace = 1;
  string operation_id = 2;
  StateMutationKind mutation = 3;
  optional string record_id = 4;
  bytes expected_version = 5;
  string expected_policy_digest = 6;
  string reason = 7;
  EffectManagementPlan effect_plan = 8;
}

message StateOperationReceipt {
  string operation_id = 1;
  string receipt_id = 2;
  StateMutationKind mutation = 3;
  latent.transaction.v1.NamespaceSelector namespace = 4;
  string authenticated_operator = 5;
  bytes before_version = 6;
  bytes after_version = 7;
  uint64 completed_at_unix_millis = 8;
  optional string record_id = 9;
  string policy_digest = 10;
  StateOperationDisposition disposition = 11;
  EffectManagementReceiptDetails effect = 12;
}

message GetStateOperationReceiptRequest {
  InspectNamespaceRequest namespace = 1;
  string operation_id = 2;
  // Historical original semantics remain unchanged after plan expiry. The
  // namespace above selects current read authority and may name a newer grant.
  EffectManagementPlan original_effect_plan = 3;
}

// All calls require management credentials; HTTP application routes and guest
// resources never carry this authority. Mutations require current fenced state.
service StateService {
  rpc MutateNamespace(MutateNamespaceRequest) returns (MutateNamespaceResponse);
  rpc InspectNamespace(InspectNamespaceRequest) returns (InspectNamespaceResponse);
  rpc SelectEntity(SelectEntityRequest) returns (SelectEntityResponse);
  rpc MutateState(MutateStateRequest) returns (MutateStateResponse);
  rpc PlanEffectMutation(PlanEffectMutationRequest) returns (PlanEffectMutationResponse);
  rpc GetStateOperationReceipt(GetStateOperationReceiptRequest) returns (GetStateOperationReceiptResponse);
}

message InspectNamespaceResponse {
  NamespaceInspection namespace = 1;
}

message MutateStateResponse {
  StateOperationReceipt receipt = 1;
  AuditAck audit_ack = 2;
  bool replayed = 3;
}

message GetStateOperationReceiptResponse {
  StateOperationReceipt receipt = 1;
  NamespaceOperationReceipt namespace_receipt = 2;
  AuditAck audit_ack = 3;
}
