<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Phase 0 activation lifecycle and cleanup boundary</title>
  <desc id="description">A request is admitted to a bounded queue, receives an affine cell lease, executes with fresh invocation state, and must pass cleanup before the cell is released. Failed cleanup quarantines the cell.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a2c"/>
      <stop offset="1" stop-color="#19334f"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cleanup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#bae6fd"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <style>
      .heading { fill: #f8fafc; font: 700 34px system-ui, sans-serif; letter-spacing: -.4px; }
      .subheading { fill: #bfdbfe; font: 400 19px system-ui, sans-serif; }
      .eyebrow { fill: #67e8f9; font: 700 14px system-ui, sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
      .box-title { fill: #f8fafc; font: 700 20px system-ui, sans-serif; }
      .box-copy { fill: #dbeafe; font: 400 15px system-ui, sans-serif; }
      .label { fill: #cbd5e1; font: 600 14px system-ui, sans-serif; }
      .note { fill: #cbd5e1; font: 400 16px system-ui, sans-serif; }
      .result { fill: #ecfeff; font: 700 18px system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#background)"/>
  <text x="72" y="82" class="eyebrow">Phase 0 ownership protocol</text>
  <text x="72" y="126" class="heading">An activation gets a cell only temporarily — reuse requires proof.</text>
  <text x="72" y="159" class="subheading">The finite spike makes queueing, execution, cleanup, and conservative quarantine observable.</text>

  <path d="M 260 317 H 314 M 482 317 H 536 M 704 317 H 758 M 926 317 H 980 M 1148 317 H 1202" stroke="#bae6fd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="242" width="188" height="150" rx="20" fill="#123a59" stroke="#38bdf8" stroke-width="2"/>
    <rect x="294" y="242" width="188" height="150" rx="20" fill="#12405f" stroke="#38bdf8" stroke-width="2"/>
    <rect x="516" y="242" width="188" height="150" rx="20" fill="url(#primary)" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="738" y="242" width="188" height="150" rx="20" fill="#173d62" stroke="#60a5fa" stroke-width="2"/>
    <rect x="960" y="242" width="188" height="150" rx="20" fill="url(#cleanup)" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="1182" y="242" width="186" height="150" rx="20" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <text x="94" y="285" class="box-title">1 · Request</text>
  <text x="94" y="315" class="box-copy">activation ID, input,</text>
  <text x="94" y="338" class="box-copy">deadline, cancellation</text>
  <text x="94" y="361" class="box-copy">registration</text>

  <text x="316" y="285" class="box-title">2 · Admit</text>
  <text x="316" y="315" class="box-copy">fixed capacity and</text>
  <text x="316" y="338" class="box-copy">bounded FIFO queue</text>
  <text x="316" y="361" class="box-copy">observe cancellation</text>

  <text x="538" y="285" class="box-title">3 · Lease</text>
  <text x="538" y="315" class="box-copy">affine cell ownership</text>
  <text x="538" y="338" class="box-copy">recheck deadline and</text>
  <text x="538" y="361" class="box-copy">cancellation</text>

  <text x="760" y="285" class="box-title">4 · Execute</text>
  <text x="760" y="315" class="box-copy">fresh store, host state,</text>
  <text x="760" y="338" class="box-copy">limits, guest instance,</text>
  <text x="760" y="361" class="box-copy">bounded logs</text>

  <text x="982" y="285" class="box-title">5 · Clean up</text>
  <text x="982" y="315" class="box-copy">drop invocation state</text>
  <text x="982" y="338" class="box-copy">and establish reusable</text>
  <text x="982" y="361" class="box-copy">or unsafe disposition</text>

  <text x="1204" y="285" class="box-title">6 · Report</text>
  <text x="1204" y="315" class="box-copy">terminal outcome and</text>
  <text x="1204" y="338" class="box-copy">pool observations after</text>
  <text x="1204" y="361" class="box-copy">cancellation removal</text>

  <path d="M 1054 422 V 470 H 866 V 526" stroke="#6ee7b7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1054 422 V 470 H 1212 V 526" stroke="#fdba74" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="884" y="457" class="label">cleanup proof: reusable</text>
  <text x="1076" y="457" class="label">cleanup uncertain</text>

  <g filter="url(#shadow)">
    <rect x="706" y="526" width="322" height="124" rx="20" fill="#14532d" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="1048" y="526" width="320" height="124" rx="20" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
  </g>
  <text x="732" y="569" class="result">Release to the fixed pool</text>
  <text x="732" y="594" class="note">Capacity returns after</text>
  <text x="732" y="617" class="note">affirmative cleanup.</text>
  <text x="1074" y="569" class="result">Quarantine the cell</text>
  <text x="1074" y="594" class="note">No silent reuse when</text>
  <text x="1074" y="617" class="note">cleanliness is unproven.</text>

  <rect x="72" y="526" width="572" height="124" rx="20" fill="#172554" stroke="#818cf8" stroke-width="2"/>
  <text x="98" y="565" class="box-title">Containment remains activation-local</text>
  <text x="98" y="594" class="note">Cancellation, deadline, memory/fuel exhaustion, trap, and runtime failure</text>
  <text x="98" y="618" class="note">become terminal outcomes; a healthy later activation must still be possible.</text>

  <text x="72" y="705" class="subheading">Phase 0 proves this local lifecycle for the recorded echo fixture; it is not the future retained-status or public invocation API.</text>
</svg>
