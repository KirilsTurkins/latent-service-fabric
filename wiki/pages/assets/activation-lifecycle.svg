<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="wiki-lifecycle-title wiki-lifecycle-description">
  <title id="wiki-lifecycle-title">Phase 0 activation lifecycle and cleanup boundary</title>
  <desc id="wiki-lifecycle-description">A request is admitted to a bounded queue, receives an affine cell lease, executes with fresh invocation state, and must pass cleanup before the cell is released. Failed cleanup quarantines the cell.</desc>
  <defs>
    <linearGradient id="wiki-lifecycle-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b102d"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="wiki-lifecycle-source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="wiki-lifecycle-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#bfdbfe"/>
    </marker>
    <filter id="wiki-lifecycle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#09090b" flood-opacity=".38"/>
    </filter>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #faf5ff; }
      .subheading { font: 400 18px system-ui, sans-serif; fill: #ddd6fe; }
      .box-title { font: 700 20px system-ui, sans-serif; fill: #f8fafc; }
      .box-copy { font: 400 15px system-ui, sans-serif; fill: #e0e7ff; }
      .small { font: 600 14px system-ui, sans-serif; fill: #c4b5fd; }
      .release { font: 700 18px system-ui, sans-serif; fill: #d1fae5; }
      .quarantine { font: 700 18px system-ui, sans-serif; fill: #fde68a; }
      .note { font: 400 16px system-ui, sans-serif; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="34" fill="url(#wiki-lifecycle-background)"/>
  <text x="74" y="88" class="heading">An activation gets a cell temporarily; reuse requires proof</text>
  <text x="74" y="122" class="subheading">The finite spike makes queueing, execution, cleanup, and conservative quarantine observable.</text>

  <g filter="url(#wiki-lifecycle-shadow)">
    <rect x="74" y="206" width="222" height="164" rx="22" fill="url(#wiki-lifecycle-source)" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="330" y="206" width="222" height="164" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="586" y="206" width="222" height="164" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="842" y="206" width="222" height="164" rx="22" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1098" y="206" width="222" height="164" rx="22" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <text x="106" y="258" class="box-title">1. Request</text>
  <text x="106" y="290" class="box-copy">activation ID + input</text>
  <text x="106" y="314" class="box-copy">deadline + cancellation</text>

  <text x="362" y="258" class="box-title">2. Admit</text>
  <text x="362" y="290" class="box-copy">fixed capacity</text>
  <text x="362" y="314" class="box-copy">bounded FIFO queue</text>

  <text x="618" y="258" class="box-title">3. Lease</text>
  <text x="618" y="290" class="box-copy">affine cell owner</text>
  <text x="618" y="314" class="box-copy">recheck cancellation</text>

  <text x="874" y="258" class="box-title">4. Execute</text>
  <text x="874" y="290" class="box-copy">fresh store + host state</text>
  <text x="874" y="314" class="box-copy">limits + bounded logs</text>

  <text x="1130" y="258" class="box-title">5. Clean up</text>
  <text x="1130" y="290" class="box-copy">drop invocation state</text>
  <text x="1130" y="314" class="box-copy">prove a disposition</text>

  <path d="M 298 288 H 320" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-lifecycle-arrow)"/>
  <path d="M 554 288 H 576" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-lifecycle-arrow)"/>
  <path d="M 810 288 H 832" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-lifecycle-arrow)"/>
  <path d="M 1066 288 H 1088" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-lifecycle-arrow)"/>

  <g filter="url(#wiki-lifecycle-shadow)">
    <rect x="74" y="496" width="616" height="128" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="760" y="496" width="280" height="128" rx="22" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <rect x="1086" y="496" width="280" height="128" rx="22" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <text x="106" y="540" class="box-title">Containment remains activation-local</text>
  <text x="106" y="572" class="note">Deadline, cancellation, trap, and resource pressure are</text>
  <text x="106" y="596" class="note">terminal outcomes; a healthy later activation stays possible.</text>

  <text x="790" y="540" class="release">Release</text>
  <text x="790" y="572" class="box-copy">cleanup proof holds</text>
  <text x="790" y="596" class="box-copy">cell becomes reusable</text>

  <text x="1116" y="540" class="quarantine">Quarantine</text>
  <text x="1116" y="572" class="box-copy">cleanup is uncertain</text>
  <text x="1116" y="596" class="box-copy">cell leaves capacity</text>

  <path d="M 1208 372 V 442 H 900 V 486" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#wiki-lifecycle-arrow)"/>
  <path d="M 1208 372 V 442 H 1226 V 486" fill="none" stroke="#fbbf24" stroke-width="5" marker-end="url(#wiki-lifecycle-arrow)"/>
  <text x="880" y="430" class="small">reusable cleanup</text>
  <text x="1174" y="430" class="small">uncertain</text>

  <text x="74" y="696" class="subheading">Phase 0 proves this local lifecycle for the recorded echo fixture; it is not a future public invocation API.</text>
</svg>
