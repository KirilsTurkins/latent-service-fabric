<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Phase 0 evidence and authorization gate</title>
  <desc id="description">A clean source tree supplies calibration, profiling, and resource soak evidence. A fresh baseline joins them in a fail-closed gate. Phase 1 remains blocked until the receipt explicitly says authorized.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b102d"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#bfdbfe"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#09090b" flood-opacity=".38"/>
    </filter>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #faf5ff; }
      .subheading { font: 400 18px system-ui, sans-serif; fill: #ddd6fe; }
      .box-title { font: 700 21px system-ui, sans-serif; fill: #f8fafc; }
      .box-copy { font: 400 15px system-ui, sans-serif; fill: #e0e7ff; }
      .small { font: 600 14px system-ui, sans-serif; fill: #c4b5fd; }
      .status { font: 800 22px system-ui, sans-serif; fill: #fde68a; }
    </style>
  </defs>
  <rect width="1440" height="760" rx="34" fill="url(#background)"/>
  <text x="74" y="88" class="heading">Phase 0 evidence is authorized only by a fresh, fail-closed receipt</text>
  <text x="74" y="122" class="subheading">Issue state, a passing aggregate, or a smoke check alone cannot authorize Phase 1.</text>

  <g filter="url(#shadow)">
    <rect x="74" y="206" width="270" height="300" rx="24" fill="url(#source)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="110" y="264" class="box-title">Clean source tree</text>
    <text x="110" y="298" class="box-copy">exact commit + tree</text>
    <text x="110" y="324" class="box-copy">fixture digest</text>
    <text x="110" y="350" class="box-copy">configuration + toolchain</text>
    <text x="110" y="376" class="box-copy">execution identity</text>
    <line x1="110" y1="406" x2="306" y2="406" stroke="#c4b5fd" stroke-width="1"/>
    <text x="110" y="438" class="small">Evidence must match the</text>
    <text x="110" y="462" class="small">measured execution path.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="168" width="245" height="142" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="482" y="216" class="box-title">Calibration</text>
    <text x="482" y="246" class="box-copy">native-Linux repeated</text>
    <text x="482" y="270" class="box-copy">runs + advisory bands</text>

    <rect x="450" y="334" width="245" height="142" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="482" y="382" class="box-title">Profiling</text>
    <text x="482" y="412" class="box-copy">CPU/allocation artifacts</text>
    <text x="482" y="436" class="box-copy">+ explicit decisions</text>

    <rect x="450" y="500" width="245" height="142" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="482" y="548" class="box-title">Resource soak</text>
    <text x="482" y="578" class="box-copy">raw lifecycle evidence</text>
    <text x="482" y="602" class="box-copy">+ plateau analysis</text>
  </g>

  <path d="M 346 290 H 442" stroke="#bfdbfe" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 346 355 H 404 V 405 H 442" fill="none" stroke="#bfdbfe" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 346 420 H 390 V 571 H 442" fill="none" stroke="#bfdbfe" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="805" y="234" width="270" height="330" rx="28" fill="#1e40af" stroke="#93c5fd" stroke-width="3"/>
    <text x="842" y="286" class="box-title">Completion gate</text>
    <text x="842" y="322" class="box-copy">verify archives, manifests,</text>
    <text x="842" y="346" class="box-copy">raw records, aggregates,</text>
    <text x="842" y="370" class="box-copy">identities, and baseline</text>
    <line x1="842" y1="404" x2="1037" y2="404" stroke="#93c5fd" stroke-width="1"/>
    <text x="842" y="440" class="small">`make phase0-gate`</text>
    <text x="842" y="472" class="small">requires an authorized receipt</text>
    <text x="842" y="504" class="small">and writes its blockers otherwise.</text>
  </g>
  <path d="M 697 240 H 795" stroke="#bfdbfe" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 697 405 H 795" stroke="#bfdbfe" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 697 570 H 755 V 534 H 795" fill="none" stroke="#bfdbfe" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1172" y="288" width="200" height="220" rx="24" fill="#78350f" stroke="#fbbf24" stroke-width="3"/>
    <text x="1208" y="344" class="box-title">Receipt</text>
    <text x="1208" y="382" class="status">AUTHORIZED?</text>
    <text x="1208" y="420" class="box-copy">Only `true` permits</text>
    <text x="1208" y="444" class="box-copy">the Phase 1 handoff.</text>
    <text x="1208" y="476" class="small">Otherwise: blocked.</text>
  </g>
  <path d="M 1077 399 H 1162" stroke="#fde68a" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="74" y="706" class="subheading">Current documentation should report the receipt’s actual status — never infer it from a closed issue.</text>
</svg>
