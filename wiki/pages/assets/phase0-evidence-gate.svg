<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="wiki-gate-title wiki-gate-description">
  <title id="wiki-gate-title">Phase 0 full completion-gate decision flow</title>
  <desc id="wiki-gate-description">The August 30 clean native-Linux receipt took the authorized branch for its canonical execution identity. Current execution identity, retained raw evidence, and a fresh baseline enter every full completion gate; a future execution-affecting change must revalidate before it can take the authorized branch.</desc>
  <defs>
    <linearGradient id="wiki-gate-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b102d"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="wiki-gate-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#bfdbfe"/>
    </marker>
    <filter id="wiki-gate-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#09090b" flood-opacity=".38"/>
    </filter>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #faf5ff; }
      .subheading { font: 400 18px system-ui, sans-serif; fill: #ddd6fe; }
      .box-title { font: 700 21px system-ui, sans-serif; fill: #f8fafc; }
      .box-copy { font: 400 15px system-ui, sans-serif; fill: #e0e7ff; }
      .small { font: 600 14px system-ui, sans-serif; fill: #c4b5fd; }
      .blocked { font: 800 22px system-ui, sans-serif; fill: #fde68a; }
      .authorized { font: 800 22px system-ui, sans-serif; fill: #d1fae5; }
      .current { font: 800 13px system-ui, sans-serif; fill: #a7f3d0; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="34" fill="url(#wiki-gate-background)"/>
  <text x="74" y="88" class="heading">The completion gate decides from evidence, not issue state</text>
  <text x="74" y="122" class="subheading">The August 30 native-Linux receipt is authorized for its canonical execution identity; execution changes must revalidate.</text>

  <g filter="url(#wiki-gate-shadow)">
    <rect x="74" y="184" width="310" height="132" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="108" y="232" class="box-title">Current execution identity</text>
    <text x="108" y="260" class="box-copy">clean tree &#183; fixture &#183; configuration</text>
    <text x="108" y="286" class="small">docs-only changes visible</text>

    <rect x="74" y="344" width="310" height="132" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="108" y="392" class="box-title">Retained raw evidence</text>
    <text x="108" y="420" class="box-copy">calibration &#183; profile &#183; soak</text>
    <text x="108" y="446" class="small">raw artifacts and aggregates</text>

    <rect x="74" y="504" width="310" height="132" rx="22" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="108" y="552" class="box-title">Fresh full baseline</text>
    <text x="108" y="580" class="box-copy">real executable baseline</text>
    <text x="108" y="606" class="small">matching inputs + toolchain</text>
  </g>

  <g filter="url(#wiki-gate-shadow)">
    <rect x="542" y="244" width="330" height="332" rx="28" fill="#1e40af" stroke="#93c5fd" stroke-width="3"/>
    <text x="582" y="300" class="box-title">Full completion gate</text>
    <text x="582" y="338" class="box-copy">1. extract and validate raw archives</text>
    <text x="582" y="366" class="box-copy">2. regenerate retained aggregates</text>
    <text x="582" y="394" class="box-copy">3. compare execution identities</text>
    <text x="582" y="422" class="box-copy">4. compare the fresh baseline</text>
    <line x1="582" y1="454" x2="832" y2="454" stroke="#93c5fd" stroke-width="1"/>
    <text x="582" y="492" class="small">`make phase0-gate` requires</text>
    <text x="582" y="518" class="small">`authorization_status: authorized`</text>
  </g>

  <path d="M 386 250 H 532" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-gate-arrow)"/>
  <path d="M 386 410 H 500 V 410 H 532" fill="none" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-gate-arrow)"/>
  <path d="M 386 570 H 468 V 510 H 532" fill="none" stroke="#bfdbfe" stroke-width="5" marker-end="url(#wiki-gate-arrow)"/>

  <g filter="url(#wiki-gate-shadow)">
    <rect x="1012" y="194" width="354" height="178" rx="24" fill="#78350f" stroke="#fbbf24" stroke-width="3"/>
    <text x="1050" y="246" class="blocked">IF A RUN BLOCKS</text>
    <text x="1050" y="282" class="box-copy">write the receipt and inspect</text>
    <text x="1050" y="306" class="box-copy">its `blockers` array</text>
    <text x="1050" y="338" class="small">Phase 1 handoff is not authorized.</text>

    <rect x="1012" y="444" width="354" height="178" rx="24" fill="#065f46" stroke="#34d399" stroke-width="3"/>
    <text x="1050" y="496" class="authorized">AUTHORIZED</text>
    <text x="1228" y="496" class="current">CURRENT RECORD</text>
    <text x="1050" y="532" class="box-copy">full receipt has no blockers</text>
    <text x="1050" y="556" class="box-copy">for the current execution path</text>
    <text x="1050" y="588" class="small">Phase 1 handoff may proceed.</text>
  </g>

  <path d="M 874 348 H 938 V 282 H 1002" fill="none" stroke="#fbbf24" stroke-width="6" marker-end="url(#wiki-gate-arrow)"/>
  <path d="M 874 474 H 938 V 532 H 1002" fill="none" stroke="#34d399" stroke-width="6" marker-end="url(#wiki-gate-arrow)"/>
  <text x="74" y="706" class="subheading">Smoke validation can exercise the path, but only the full gate can take the authorized branch.</text>
</svg>
