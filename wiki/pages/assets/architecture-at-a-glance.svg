<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="architecture-at-a-glance-title architecture-at-a-glance-description">
<title id="architecture-at-a-glance-title">Phase 2: package, control and invocation</title>
<desc id="architecture-at-a-glance-description">One Linux node; current eligibility and explicit ownership from publication through cleanup.</desc>
<defs><linearGradient id="architecture-at-a-glance-background" x2="1" y2="1"><stop stop-color="#1b102d"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient>
<marker id="architecture-at-a-glance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bfdbfe"/></marker></defs>
<rect width="1440" height="760" rx="24" fill="url(#architecture-at-a-glance-background)"/>
<g font-family="system-ui, sans-serif"><text x="72" y="82" font-size="34" fill="#faf5ff" font-weight="700">Phase 2: package, control and invocation</text><text x="72" y="117" font-size="18" fill="#e0e7ff" font-weight="400">One Linux node; current eligibility and explicit ownership from publication through cleanup.</text><rect x="72" y="155" width="392" height="130" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="94" y="192" font-size="21" fill="#f8fafc" font-weight="700">Package and verify</text><text x="94" y="225" font-size="16" fill="#e0e7ff" font-weight="400">Exact content and signed evidence</text><text x="94" y="251" font-size="16" fill="#e0e7ff" font-weight="400">Current trust + lifecycle authority</text><rect x="524" y="155" width="392" height="130" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="546" y="192" font-size="21" fill="#f8fafc" font-weight="700">Immutable route snapshot</text><text x="546" y="225" font-size="16" fill="#e0e7ff" font-weight="400">Tenant-scoped deterministic selection</text><text x="546" y="251" font-size="16" fill="#e0e7ff" font-weight="400">Generation pinned by each activation</text><rect x="976" y="155" width="392" height="130" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="998" y="192" font-size="21" fill="#f8fafc" font-weight="700">Fixed node resources</text><text x="998" y="225" font-size="16" fill="#e0e7ff" font-weight="400">Configured workers and class pools</text><text x="998" y="251" font-size="16" fill="#e0e7ff" font-weight="400">Bounded metadata and prepared caches</text><path d="M468 220 H516" stroke="#bfdbfe" stroke-width="3" fill="none" marker-end="url(#architecture-at-a-glance-arrow)"/><path d="M920 220 H968" stroke="#bfdbfe" stroke-width="3" fill="none" marker-end="url(#architecture-at-a-glance-arrow)"/><rect x="72" y="335" width="240" height="145" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="94" y="372" font-size="21" fill="#f8fafc" font-weight="700">Loopback RPC</text><text x="94" y="405" font-size="16" fill="#e0e7ff" font-weight="400">Explicit credentials</text><text x="94" y="431" font-size="16" fill="#e0e7ff" font-weight="400">Invoke / status / cancel</text><path d="M314 410 H330" stroke="#bfdbfe" stroke-width="3" fill="none" marker-end="url(#architecture-at-a-glance-arrow)"/><rect x="336" y="335" width="240" height="145" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="358" y="372" font-size="21" fill="#f8fafc" font-weight="700">Resolve / admit</text><text x="358" y="405" font-size="16" fill="#e0e7ff" font-weight="400">Pin revision + budget</text><text x="358" y="431" font-size="16" fill="#e0e7ff" font-weight="400">Finite running / queue</text><path d="M578 410 H594" stroke="#bfdbfe" stroke-width="3" fill="none" marker-end="url(#architecture-at-a-glance-arrow)"/><rect x="600" y="335" width="240" height="145" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="622" y="372" font-size="21" fill="#f8fafc" font-weight="700">Prepare / queue</text><text x="622" y="405" font-size="16" fill="#e0e7ff" font-weight="400">Checked code reuse</text><text x="622" y="431" font-size="16" fill="#e0e7ff" font-weight="400">Current start eligibility</text><path d="M842 410 H858" stroke="#bfdbfe" stroke-width="3" fill="none" marker-end="url(#architecture-at-a-glance-arrow)"/><rect x="864" y="335" width="240" height="145" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="886" y="372" font-size="21" fill="#f8fafc" font-weight="700">Fresh Store</text><text x="886" y="405" font-size="16" fill="#e0e7ff" font-weight="400">Generic WIT values</text><text x="886" y="431" font-size="16" fill="#e0e7ff" font-weight="400">Context / logs / clocks</text><path d="M1106 410 H1122" stroke="#bfdbfe" stroke-width="3" fill="none" marker-end="url(#architecture-at-a-glance-arrow)"/><rect x="1128" y="335" width="240" height="145" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="1150" y="372" font-size="21" fill="#f8fafc" font-weight="700">Account / reclaim</text><text x="1150" y="405" font-size="16" fill="#e0e7ff" font-weight="400">Owned terminal sample</text><text x="1150" y="431" font-size="16" fill="#e0e7ff" font-weight="400">Reuse or quarantine</text><text x="72" y="518" font-size="18" fill="#e0e7ff" font-weight="400">Dormant services own metadata and artifacts; no dedicated guest heap, process or listener.</text><rect x="72" y="552" width="1296" height="135" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="94" y="589" font-size="21" fill="#f8fafc" font-weight="700">Delivery boundary</text><text x="94" y="622" font-size="16" fill="#cbd5e1" font-weight="400">Phase 2 implemented: packages, trust, local AOT reuse, audit, rollouts, canaries and rollback. Gate #158 pending.</text><text x="94" y="648" font-size="16" fill="#cbd5e1" font-weight="400">Phase 3: 41 planned tickets for capability providers, HTTP/web hosting, SDK delivery and gates.</text><text x="72" y="722" font-size="16" fill="#d1fae5" font-weight="600">Current authority: development until release publication. Fixed topology does not mean constant catalog RSS.</text></g></svg>