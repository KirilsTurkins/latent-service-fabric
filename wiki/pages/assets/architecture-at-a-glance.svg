<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
      <title id="title">LSF architecture at a glance</title>
      <desc id="desc">Immutable releases become temporary, capability-scoped activations in a fixed pool.</desc>
      
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#06101d"/><stop offset=".55" stop-color="#0a1830"/><stop offset="1" stop-color="#11152d"/>
      </linearGradient>
      <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#40e0ff"/><stop offset="1" stop-color="#5b8cff"/>
      </linearGradient>
      <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c66cff"/><stop offset="1" stop-color="#ff718d"/>
      </linearGradient>
      <linearGradient id="greenAmber" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#58f0ae"/><stop offset="1" stop-color="#ffca6a"/>
      </linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#40e0ff" stop-opacity=".55"/><stop offset="1" stop-color="#40e0ff" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
        <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#17324d" stroke-width="1" opacity=".42"/>
      </pattern>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".42"/>
      </filter>
      <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#40e0ff"/>
      </marker>
      <marker id="arrowMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c66cff"/>
      </marker>
      <style>
        text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        .title { fill:#e9f5ff; font-size:28px; font-weight:750; letter-spacing:.2px; }
        .subtitle { fill:#92a9bd; font-size:14px; }
        .label { fill:#e9f5ff; font-size:14px; font-weight:700; }
        .small { fill:#92a9bd; font-size:11px; }
        .tiny { fill:#92a9bd; font-size:10px; }
        .box { fill:#0d1c30; stroke:#264966; stroke-width:1.4; }
        .box2 { fill:#102540; stroke:#315a7d; stroke-width:1.4; }
        .edge { fill:none; stroke:#40e0ff; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
        .edge2 { fill:none; stroke:#c66cff; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; }
        
      @keyframes dash { to { stroke-dashoffset: -38; } }
      @keyframes pulse { 0%,100% { opacity:.48; transform:scale(.96); } 50% { opacity:1; transform:scale(1.04); } }
      @keyframes glow { 0%,100% { opacity:.30; } 50% { opacity:.92; } }
      @keyframes scan { from { transform:translateX(-220px); } to { transform:translateX(1320px); } }
      .flow { stroke-dasharray: 10 12; animation: dash 1.6s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .glow { animation: glow 1.8s ease-in-out infinite; }
      .scan { animation: scan 7s linear infinite; }
      .cell-a { animation: glow 3.2s ease-in-out infinite; }
      .cell-b { animation: glow 3.2s .8s ease-in-out infinite; }
      .cell-c { animation: glow 3.2s 1.6s ease-in-out infinite; }
      .cell-d { animation: glow 3.2s 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow,.pulse,.glow,.scan,.cell-a,.cell-b,.cell-c,.cell-d { animation:none !important; }
      }
    
      </style>
    </defs>
    
      <rect width="1200" height="610" rx="24" fill="url(#bg)"/>
      <rect x="1" y="1" width="1198" height="608" rx="23" fill="none" stroke="#274461"/>
      <rect width="1200" height="610" rx="24" fill="url(#grid)" opacity=".43"/>
      <rect class="scan" x="-220" y="0" width="180" height="610" fill="url(#cyanBlue)" opacity=".035" transform="skewX(-14)"/>
      <text class="title" x="42" y="48">LSF architecture at a glance</text>
      <text class="subtitle" x="42" y="73">Immutable releases become temporary, capability-scoped activations in a fixed pool.</text>
      <rect x="38" y="90" width="292" height="28" rx="14" fill="#0b2b25" stroke="#2a7a61"/><text x="52" y="109" fill="#58f0ae" font-size="10.5" font-weight="800" letter-spacing=".35">DORMANT RELEASES · ZERO EXECUTION ALLOCATION</text>
      <g filter="url(#shadow)">
        <rect class="box" x="42" y="126" width="163" height="52" rx="14"/>
        <rect x="42" y="126" width="5" height="52" rx="2.5" fill="#58f0ae"/>
        <circle cx="187" cy="144" r="4" fill="#58f0ae" opacity=".85"/>
        <text class="label" x="58" y="154">Developer tooling</text>
        <text class="small" x="58" y="175">build + sign</text>
      </g>
    
      <g filter="url(#shadow)">
