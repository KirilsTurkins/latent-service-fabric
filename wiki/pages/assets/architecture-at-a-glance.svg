        <rect x="645" y="119" width="5" height="58" rx="2.5" fill="#ffca6a"/>
        <circle cx="817" cy="137" r="4" fill="#ffca6a" opacity=".85"/>
        <text class="label" x="661" y="147">Route snapshot</text>
        <text class="small" x="661" y="168">immutable generation</text>
      </g>
    
      <g filter="url(#shadow)">
        <rect class="box2" x="584" y="348" width="170" height="80" rx="14"/>
        <rect x="584" y="348" width="5" height="80" rx="2.5" fill="#40e0ff"/>
        <circle cx="736" cy="366" r="4" fill="#40e0ff" opacity=".85"/>
        <text class="label" x="600" y="376">Reusable cell pool</text>
        <text class="small" x="600" y="397">fixed node capacity</text>
      </g>
    <rect class="cell-a" x="605" y="386" width="24" height="24" rx="6" fill="#40e0ff" opacity="0.38" filter="url(#softGlow)"/><rect class="cell-b" x="641" y="386" width="24" height="24" rx="6" fill="#40e0ff" opacity="0.38" filter="url(#softGlow)"/><rect class="cell-c" x="677" y="386" width="24" height="24" rx="6" fill="#40e0ff" opacity="0.38" filter="url(#softGlow)"/><rect class="cell-d" x="713" y="386" width="24" height="24" rx="6" fill="#40e0ff" opacity="0.38" filter="url(#softGlow)"/>
      <g filter="url(#shadow)">
        <rect class="box2" x="812" y="348" width="180" height="80" rx="14"/>
        <rect x="812" y="348" width="5" height="80" rx="2.5" fill="#c66cff"/>
