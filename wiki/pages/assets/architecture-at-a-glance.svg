        <circle cx="187" cy="228" r="4" fill="#c66cff" opacity=".85"/>
        <text class="label" x="58" y="238">Management client</text>
        <text class="small" x="58" y="259">desired state</text>
      </g>
    
      <g filter="url(#shadow)">
        <rect class="box" x="42" y="362" width="163" height="52" rx="14"/>
