        <circle cx="500" cy="380" r="4" fill="#40e0ff" opacity=".85"/>
        <text class="label" x="344" y="390">Resolve + admit</text>
        <text class="small" x="344" y="411">snapshot · quota · deadline</text>
      </g>
    
