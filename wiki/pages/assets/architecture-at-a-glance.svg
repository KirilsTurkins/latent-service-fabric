        <text class="label" x="828" y="376">Temporary activation</text>
        <text class="small" x="828" y="397">fresh store + budget</text>
      </g>
    <circle class="pulse" cx="970" cy="368" r="8" fill="#ff718d" filter="url(#softGlow)"/>
      <g filter="url(#shadow)">
        <rect class="box" x="820" y="452" width="190" height="52" rx="14"/>
        <rect x="820" y="452" width="5" height="52" rx="2.5" fill="#58f0ae"/>
