      <g filter="url(#shadow)">
        <rect class="box" x="1020" y="520" width="160" height="52" rx="14"/>
        <rect x="1020" y="520" width="5" height="52" rx="2.5" fill="#ff718d"/>
        <circle cx="1162" cy="538" r="4" fill="#ff718d" opacity=".85"/>
        <text class="label" x="1036" y="548">Effect providers</text>
        <text class="small" x="1036" y="569">durable intents</text>
      </g>
