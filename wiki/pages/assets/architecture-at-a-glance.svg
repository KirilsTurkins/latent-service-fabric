        <text class="small" x="836" y="501">scoped handles</text>
      </g>
    
      <g filter="url(#shadow)">
        <rect class="box" x="810" y="520" width="190" height="52" rx="14"/>
        <rect x="810" y="520" width="5" height="52" rx="2.5" fill="#ffca6a"/>
        <circle cx="982" cy="538" r="4" fill="#ffca6a" opacity=".85"/>
        <text class="label" x="826" y="548">Result + accounting</text>
        <text class="small" x="826" y="569">output · trace · usage</text>
      </g>
    
      <g filter="url(#shadow)">
        <rect class="box" x="580" y="520" width="180" height="52" rx="14"/>
        <rect x="580" y="520" width="5" height="52" rx="2.5" fill="#5b8cff"/>
        <circle cx="742" cy="538" r="4" fill="#5b8cff" opacity=".85"/>
        <text class="label" x="596" y="548">State backend</text>
        <text class="small" x="596" y="569">transactional commit</text>
