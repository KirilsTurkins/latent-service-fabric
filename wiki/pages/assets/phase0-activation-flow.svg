<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Phase 0 executable activation flow</title>
  <desc id="description">A local echo capsule is prepared, admitted to a bounded generic cell pool, invoked in a fresh Wasmtime store, mapped to a terminal outcome, and cleaned up before the cell can be reused.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#12354b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #f8fafc; }
      .subheading { font: 400 18px system-ui, sans-serif; fill: #cbd5e1; }
      .box-title { font: 700 20px system-ui, sans-serif; fill: #eff6ff; }
      .box-copy { font: 400 15px system-ui, sans-serif; fill: #cbd5e1; }
      .note { font: 600 16px system-ui, sans-serif; fill: #d1fae5; }
      .step { font: 700 15px system-ui, sans-serif; fill: #082f49; }
    </style>
  </defs>
  <rect width="1440" height="760" rx="34" fill="url(#background)"/>
  <text x="74" y="88" class="heading">Phase 0: one local Component Model activation</text>
  <text x="74" y="122" class="subheading">A deliberately narrow feasibility path — not a public service listener or Phase 1 API.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="204" width="210" height="190" rx="22" fill="#143752" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="104" cy="240" r="20" fill="url(#accent)"/>
    <text x="99" y="246" class="step">1</text>
    <text x="104" y="286" class="box-title">Echo capsule</text>
    <text x="104" y="316" class="box-copy">WIT-generated Rust</text>
    <text x="104" y="340" class="box-copy">component + digest</text>
    <text x="104" y="364" class="box-copy">validated locally</text>

    <rect x="335" y="204" width="210" height="190" rx="22" fill="#143752" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="369" cy="240" r="20" fill="url(#accent)"/>
    <text x="364" y="246" class="step">2</text>
    <text x="369" y="286" class="box-title">Preparation</text>
    <text x="369" y="316" class="box-copy">bounded Wasmtime</text>
    <text x="369" y="340" class="box-copy">engine + cache</text>
    <text x="369" y="364" class="box-copy">before a cell lease</text>

    <rect x="600" y="204" width="210" height="190" rx="22" fill="#143752" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="634" cy="240" r="20" fill="url(#accent)"/>
    <text x="629" y="246" class="step">3</text>
    <text x="634" y="286" class="box-title">Fixed cell pool</text>
    <text x="634" y="316" class="box-copy">affine lease</text>
    <text x="634" y="340" class="box-copy">fixed capacity +</text>
    <text x="634" y="364" class="box-copy">bounded FIFO queue</text>

    <rect x="865" y="204" width="210" height="190" rx="22" fill="#143752" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="899" cy="240" r="20" fill="url(#accent)"/>
    <text x="894" y="246" class="step">4</text>
    <text x="899" y="286" class="box-title">Fresh invocation</text>
    <text x="899" y="316" class="box-copy">store, host state,</text>
    <text x="899" y="340" class="box-copy">limits, deadline,</text>
    <text x="899" y="364" class="box-copy">cancellation probe</text>

    <rect x="1130" y="204" width="240" height="190" rx="22" fill="#143752" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="1164" cy="240" r="20" fill="url(#accent)"/>
    <text x="1159" y="246" class="step">5</text>
    <text x="1164" y="286" class="box-title">Terminal result</text>
    <text x="1164" y="316" class="box-copy">success • domain error</text>
    <text x="1164" y="340" class="box-copy">trap • timeout • cancel</text>
    <text x="1164" y="364" class="box-copy">resource exhaustion</text>
  </g>

  <path d="M 282 300 H 330" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 547 300 H 595" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 812 300 H 860" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1077 300 H 1125" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="190" y="494" width="1060" height="128" rx="24" fill="#0f2d41" stroke="#34d399" stroke-width="2"/>
    <text x="238" y="542" class="box-title">Cleanup proof before reuse</text>
    <text x="238" y="574" class="box-copy">Drop the instance, store, host state, temporary buffers, and cancellation probe; publish bounded logs; then release only when cleanup is reusable — otherwise quarantine.</text>
    <text x="238" y="604" class="note">Measured topology: fixed runtime workers, one process, no listener/socket, fixed cell capacity.</text>
  </g>
  <path d="M 1250 394 C 1250 450 1175 458 1120 492" fill="none" stroke="#86efac" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1120" y="452" class="subheading">all terminal paths</text>
  <text x="74" y="700" class="subheading">Scope: local trusted fixture • observational evidence • no production SLO or dormant-service-density claim</text>
</svg>
