<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" role="img" aria-labelledby="title description">
  <title id="title">Latent Service Fabric delivery roadmap</title>
  <desc id="description">Phase 0 is an executable spike awaiting an authorized completion receipt. Phases 1 through 7 describe later planned product and research work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10231c"/>
      <stop offset="1" stop-color="#163b4a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#99f6e4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #f0fdf4; }
      .subheading { font: 400 18px system-ui, sans-serif; fill: #ccfbf1; }
      .phase { font: 800 17px system-ui, sans-serif; fill: #eff6ff; }
      .copy { font: 400 14px system-ui, sans-serif; fill: #d1fae5; }
      .status { font: 700 13px system-ui, sans-serif; fill: #fef3c7; }
    </style>
  </defs>
  <rect width="1440" height="680" rx="34" fill="url(#background)"/>
  <text x="74" y="86" class="heading">Delivery sequence and evidence boundary</text>
  <text x="74" y="120" class="subheading">Later phases are planned work; Phase 0’s implemented spike still needs a genuine authorization receipt.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="208" width="224" height="194" rx="22" fill="#7c2d12" stroke="#fbbf24" stroke-width="3"/>
    <text x="98" y="250" class="phase">Phase 0 · Spike</text>
    <text x="98" y="282" class="copy">Local echo capsule</text>
    <text x="98" y="306" class="copy">Wasmtime + fixed cells</text>
    <text x="98" y="330" class="copy">containment + evidence</text>
    <text x="98" y="370" class="status">GATE: PENDING AUTHORIZATION</text>

    <rect x="342" y="208" width="224" height="194" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
    <text x="370" y="250" class="phase">Phase 1 · Node</text>
    <text x="370" y="282" class="copy">single-node fabric</text>
    <text x="370" y="306" class="copy">generic invocation</text>
    <text x="370" y="330" class="copy">routing + telemetry</text>
    <text x="370" y="370" class="status">PLANNED</text>

    <rect x="614" y="208" width="224" height="194" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
    <text x="642" y="250" class="phase">Phase 2–3</text>
    <text x="642" y="282" class="copy">supply chain</text>
    <text x="642" y="306" class="copy">capabilities + policy</text>
    <text x="642" y="330" class="copy">auditing</text>
    <text x="642" y="370" class="status">PLANNED</text>

    <rect x="886" y="208" width="224" height="194" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
    <text x="914" y="250" class="phase">Phase 4–6</text>
    <text x="914" y="282" class="copy">state + effects</text>
    <text x="914" y="306" class="copy">cluster + identity</text>
    <text x="914" y="330" class="copy">durable workflows</text>
    <text x="914" y="370" class="status">PLANNED</text>

    <rect x="1158" y="208" width="212" height="194" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
    <text x="1186" y="250" class="phase">Phase 7</text>
    <text x="1186" y="282" class="copy">research candidates</text>
    <text x="1186" y="306" class="copy">promotion by evidence</text>
    <text x="1186" y="330" class="copy">and ADR decision</text>
    <text x="1186" y="370" class="status">PLANNED</text>
  </g>
  <path d="M 296 306 H 332" stroke="#99f6e4" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 568 306 H 604" stroke="#99f6e4" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 840 306 H 876" stroke="#99f6e4" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1112 306 H 1148" stroke="#99f6e4" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="184" y="498" width="1074" height="90" rx="22" fill="#0f3f3a" stroke="#5eead4" stroke-width="2"/>
    <text x="228" y="536" class="phase">Cross-phase rule</text>
    <text x="228" y="566" class="copy">Preserve bounded resources, explicit authorization, pinned identities, separated domain/platform errors, reproducible validation, and evidence-based claims.</text>
  </g>
  <text x="74" y="640" class="subheading">Phase names communicate planned scope, not delivery promises or production readiness.</text>
</svg>
