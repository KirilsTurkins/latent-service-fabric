<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="system-decomposition-title system-decomposition-description">
<title id="system-decomposition-title">Delivered features and the Phase 2 handoff</title>
<desc id="system-decomposition-description">The Phase 1 completion and extension retain their original evidence and measured limits.</desc>
<defs><linearGradient id="system-decomposition-background" x2="1" y2="1"><stop stop-color="#1b102d"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient>
<marker id="system-decomposition-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bfdbfe"/></marker></defs>
<rect width="1440" height="760" rx="24" fill="url(#system-decomposition-background)"/>
<g font-family="system-ui, sans-serif"><text x="72" y="82" font-size="34" fill="#faf5ff" font-weight="700">Delivered features and the Phase 2 handoff</text><text x="72" y="117" font-size="18" fill="#e0e7ff" font-weight="400">The Phase 1 completion and extension retain their original evidence and measured limits.</text><rect x="72" y="166" width="416" height="212" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="94" y="203" font-size="21" fill="#f8fafc" font-weight="700">Management and client</text><text x="94" y="236" font-size="16" fill="#e0e7ff" font-weight="400">latent: generated gRPC client</text><text x="94" y="262" font-size="16" fill="#e0e7ff" font-weight="400">Durable release/deployment catalogs</text><text x="94" y="288" font-size="16" fill="#e0e7ff" font-weight="400">Scoped management + inventory</text><text x="94" y="314" font-size="16" fill="#e0e7ff" font-weight="400">No automatic retries or pagination</text><rect x="512" y="166" width="416" height="212" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="534" y="203" font-size="21" fill="#f8fafc" font-weight="700">Bounded execution</text><text x="534" y="236" font-size="16" fill="#e0e7ff" font-weight="400">Pinned local route snapshots</text><text x="534" y="262" font-size="16" fill="#e0e7ff" font-weight="400">Budget ledger + tenant scheduling</text><text x="534" y="288" font-size="16" fill="#e0e7ff" font-weight="400">Bounded preparation and code cache</text><text x="534" y="314" font-size="16" fill="#e0e7ff" font-weight="400">Fresh activation Store and host state</text><rect x="952" y="166" width="416" height="212" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="974" y="203" font-size="21" fill="#f8fafc" font-weight="700">Lifecycle and telemetry</text><text x="974" y="236" font-size="16" fill="#e0e7ff" font-weight="400">Caller/server activation identity</text><text x="974" y="262" font-size="16" fill="#e0e7ff" font-weight="400">Bounded status and explicit cancel</text><text x="974" y="288" font-size="16" fill="#e0e7ff" font-weight="400">Fixed disconnect cleanup supervisor</text><text x="974" y="314" font-size="16" fill="#e0e7ff" font-weight="400">Redacted logs and final accounting</text><text x="72" y="420" font-size="18" fill="#e0e7ff" font-weight="400">Six SDK language interfaces have fixtures; they do not yet ship transports, serializers or retries.</text><rect x="72" y="462" width="416" height="155" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="94" y="499" font-size="21" fill="#f8fafc" font-weight="700">Phase 2: next</text><text x="94" y="532" font-size="16" fill="#cbd5e1" font-weight="400">OCI + signed supply chain</text><text x="94" y="558" font-size="16" fill="#cbd5e1" font-weight="400">Trusted AOT + rollout orchestration</text><rect x="512" y="462" width="416" height="155" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="534" y="499" font-size="21" fill="#f8fafc" font-weight="700">Phase 3 / 4</text><text x="534" y="532" font-size="16" fill="#cbd5e1" font-weight="400">General capabilities + HTTP ingress</text><text x="534" y="558" font-size="16" fill="#cbd5e1" font-weight="400">Transactional state + effect outbox</text><rect x="952" y="462" width="416" height="155" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="974" y="499" font-size="21" fill="#f8fafc" font-weight="700">Phase 5 / 6</text><text x="974" y="532" font-size="16" fill="#cbd5e1" font-weight="400">Cluster control + mTLS + placement</text><text x="974" y="558" font-size="16" fill="#cbd5e1" font-weight="400">Durable workflow state machines</text><text x="72" y="664" font-size="18" fill="#e0e7ff" font-weight="400">Actual Docker/Kubernetes comparisons are evidence, not clustered LSF feature delivery.</text><text x="72" y="702" font-size="18" fill="#e0e7ff" font-weight="400">Native warm calls were faster; LSF reduced dense-cohort leaf memory and startup costs.</text></g></svg>