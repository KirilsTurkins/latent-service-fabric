<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="system-decomposition-title system-decomposition-description">
<title id="system-decomposition-title">Phase 2 owners and planned capabilities</title>
<desc id="system-decomposition-description">Shared bounded owners; explicit operator actions; no worker or heap per dormant service.</desc>
<defs><linearGradient id="system-decomposition-background" x2="1" y2="1"><stop stop-color="#1b102d"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient>
<marker id="system-decomposition-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bfdbfe"/></marker></defs>
<rect width="1440" height="760" rx="24" fill="url(#system-decomposition-background)"/>
<g font-family="system-ui, sans-serif"><text x="72" y="82" font-size="34" fill="#faf5ff" font-weight="700">Phase 2 owners and planned capabilities</text><text x="72" y="117" font-size="18" fill="#e0e7ff" font-weight="400">Shared bounded owners; explicit operator actions; no worker or heap per dormant service.</text><rect x="72" y="166" width="416" height="212" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="94" y="203" font-size="21" fill="#f8fafc" font-weight="700">Packages and trust</text><text x="94" y="236" font-size="16" fill="#e0e7ff" font-weight="400">Portable packages + OCI evidence</text><text x="94" y="262" font-size="16" fill="#e0e7ff" font-weight="400">Publisher and builder authorization</text><text x="94" y="288" font-size="16" fill="#e0e7ff" font-weight="400">Current policy + lifecycle capabilities</text><text x="94" y="314" font-size="16" fill="#e0e7ff" font-weight="400">Raw cache is storage, not authority</text><rect x="512" y="166" width="416" height="212" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="534" y="203" font-size="21" fill="#f8fafc" font-weight="700">Bounded execution</text><text x="534" y="236" font-size="16" fill="#e0e7ff" font-weight="400">Pinned revision + fresh Store</text><text x="534" y="262" font-size="16" fill="#e0e7ff" font-weight="400">Budget ledger + tenant scheduling</text><text x="534" y="288" font-size="16" fill="#e0e7ff" font-weight="400">Isolated approved compiler jobs</text><text x="534" y="314" font-size="16" fill="#e0e7ff" font-weight="400">Authenticated local native reuse</text><rect x="952" y="166" width="416" height="212" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="974" y="203" font-size="21" fill="#f8fafc" font-weight="700">Durable operator control</text><text x="974" y="236" font-size="16" fill="#e0e7ff" font-weight="400">Atomic deployment operation receipts</text><text x="974" y="262" font-size="16" fill="#e0e7ff" font-weight="400">Explicit rollout and canary promotion</text><text x="974" y="288" font-size="16" fill="#e0e7ff" font-weight="400">Eligible-target rollback + new routes</text><text x="974" y="314" font-size="16" fill="#e0e7ff" font-weight="400">Bounded audit and exact recovery</text><text x="72" y="420" font-size="18" fill="#e0e7ff" font-weight="400">Six SDK language interfaces have fixtures; they do not yet ship transports, serializers or retries.</text><rect x="72" y="462" width="416" height="155" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="94" y="499" font-size="21" fill="#f8fafc" font-weight="700">Phase 3: 41 planned tickets</text><text x="94" y="532" font-size="16" fill="#cbd5e1" font-weight="400">Capability providers + HTTP/web</text><text x="94" y="558" font-size="16" fill="#cbd5e1" font-weight="400">SDKs + operator/security gates</text><rect x="512" y="462" width="416" height="155" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="534" y="499" font-size="21" fill="#f8fafc" font-weight="700">Phase 4</text><text x="534" y="532" font-size="16" fill="#cbd5e1" font-weight="400">Transactional guest state</text><text x="534" y="558" font-size="16" fill="#cbd5e1" font-weight="400">Explicit effect handling / outbox</text><rect x="952" y="462" width="416" height="155" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="974" y="499" font-size="21" fill="#f8fafc" font-weight="700">Phase 5 / 6</text><text x="974" y="532" font-size="16" fill="#cbd5e1" font-weight="400">Cluster control + mTLS + placement</text><text x="974" y="558" font-size="16" fill="#cbd5e1" font-weight="400">Durable workflow state machines</text><text x="72" y="664" font-size="18" fill="#e0e7ff" font-weight="400">Phase 2 complete; finite evidence and qualifications are recorded in the completion report.</text><text x="72" y="702" font-size="18" fill="#e0e7ff" font-weight="400">Control durability does not create guest transactions, general provider access or a clustered runtime.</text></g></svg>