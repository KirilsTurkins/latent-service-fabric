[package]
name = "latent-toolchain-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compile probes and generated component fixtures for the pinned toolchain."
publish = false

[[example]]
name = "echo-capsule"
path = "examples/echo_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

[[example]]
name = "oversized-log-capsule"
path = "examples/oversized_log_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

[[example]]
name = "containment-capsule"
path = "examples/containment_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

[[example]]
name = "generic-capsule"
path = "examples/generic_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

[[example]]
name = "capabilities-capsule"
path = "examples/capabilities_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

[[example]]
name = "optimization-capsule"
path = "examples/optimization_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

[dependencies]
latent-component-bindings = { path = "../../crates/latent-component-bindings" }
latent-optimization-workloads = { path = "../optimization-workloads" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blake3.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true
