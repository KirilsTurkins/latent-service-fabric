[package]
name = "latent-toolchain-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compile probes and generated component fixtures for the pinned toolchain."
publish = false

[[example]]
name = "echo-capsule"
path = "examples/echo_capsule/component.rs"
crate-type = ["cdylib"]
test = false
bench = false
doc = false

