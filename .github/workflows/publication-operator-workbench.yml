name: Publication native operator qualification
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths: [.github/workflows/publication-operator-workbench.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          ref: 2b94ea691acdf66d9fddd174670c055f7c40bf8b
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477
        with:
          prefix-key: lsf-ci-dependencies-v3-contract-profiles
          shared-key: host-contracts
          key: ubuntu-24.04
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
          cache-bin: false
          cache-workspace-crates: false
      - name: Reconstruct bounded reviewed source over the exact parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/publication-operator
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          out = root / 'target/publication-operator'
          repo = 'KirilsTurkins/latent-service-fabric'
          chunks = ['d3731b6ef070d8e1848e9bc334cfb2f99f476b5a','4d7ff9e79c7bd4b8a30d136c9f3235e8826cfde5','0a898b96c7a5f94abb065805441a265a26388cb3','52acace04c002eb58dff529b398995af0bc92220','20fa35df9b546c3bd301f84e5e2e1e49f585f06b','e3954584f2ec6a51bbdc6b748fab4543b0df81f8','c88d122b03903258d4016c2c46950b478a5c7243','e2a74ea45100432381e99b6ba6739524a7bbee61']
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          compressed = bytearray()
          for sha in chunks:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  record = json.loads(response.read(20000))
              data = base64.b64decode(record['content'])
              assert len(data) <= 6000 and blob(data) == sha
              compressed.extend(data)
          assert len(compressed) == 44596
          assert hashlib.sha256(compressed).hexdigest() == '9ec7d95ec8b2d154d33f103eb6f8c54c138e425d67bd195ab58d24ea1fb5e977'
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(compressed, max_length=512*1024)
          assert decoder.eof and not decoder.unused_data and len(raw) == 236500
          spec = json.loads(raw)
          assert set(spec) == {'base','manifest','patch','generated'}
          assert spec['base'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == '2b94ea691acdf66d9fddd174670c055f7c40bf8b'
          assert len(spec['manifest']) == 66 and spec['generated'] == ['sdk/typescript-client/src/node/protocol/generated.ts']
          seen = set()
          for row in spec['manifest']:
              path = pathlib.PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and row['path'] not in seen
              assert path.parts[0] in {'Cargo.lock','adr','api','apps','crates','docs','sdk','tools'}
              seen.add(row['path'])
              p = root / path
              assert not p.is_symlink()
              if row['before'] is None:
                  assert not p.exists()
              else:
                  assert blob(p.read_bytes()) == row['before'], row['path']
          (out/'transport.xz').write_bytes(compressed)
          (out/'manifest.json').write_text(json.dumps(spec['manifest'], indent=2)+'\n')
          (out/'source.patch').write_text(spec['patch'])
          subprocess.run(['git','apply','--check',str(out/'source.patch')], check=True)
          subprocess.run(['git','apply',str(out/'source.patch')], check=True)
          (out/'base.txt').write_text(spec['base']+'\n')
          PY
      - name: Apply exact owning-worker formatting without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          out=pathlib.Path('target/publication-operator')
          row={'path':'crates/latent-audit/src/durable/worker.rs','before':'979dfcd6fea8b7cc0523e19abd8ab09ece6d6b2a','after':'d38de036b44836707ab4cab2b5011716762e19de','sha256':'2472465338e30c876789c85e251bfada1367088986631b7f18249ca24699ebf6'}
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          path=pathlib.Path(row['path'])
          data=path.read_bytes()
          assert blob(data)==row['before']
          data=data.replace(b'        let bytes = heap.checked_add(std::mem::size_of::<AuditStoredRecord>())',b'        let bytes = heap\n            .checked_add(std::mem::size_of::<AuditStoredRecord>())')
          data=data.replace(b'            .and_then(|bytes| bytes.checked_mul(3)).ok_or_else(capacity)?;',b'            .and_then(|bytes| bytes.checked_mul(3))\n            .ok_or_else(capacity)?;')
          assert blob(data)==row['after'] and hashlib.sha256(data).hexdigest()==row['sha256']
          path.write_bytes(data)
          rows=json.loads((out/'manifest.json').read_text())
          assert len(rows)==66 and all(item['path']!=row['path'] for item in rows)
          rows.append(row)
          rows.sort(key=lambda item:item['path'])
          (out/'manifest.json').write_text(json.dumps(rows,indent=2)+'\n')
          (out/'format.patch').write_bytes(subprocess.check_output(['git','diff','--',row['path']]))
          PY
      - name: Generate the locked bounded protocol descriptor
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p latent-rpc 2>&1 | tee target/publication-operator/rpc-check.log
          PROTOC=$(find "$HOME/.cargo/registry/src" -path '*/protoc-bin-vendored-linux-x86_64-3.2.0/bin/protoc' -type f -print -quit)
          test -n "$PROTOC"
          python3 tools/generate_node_rpc.py --protoc "$PROTOC" 2>&1 | tee target/publication-operator/node-generation.log
      - name: Verify and publish exact ordinary source blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, tarfile, urllib.request
          out = pathlib.Path('target/publication-operator')
          rows = json.loads((out/'manifest.json').read_text())
          assert len(rows)==67
          entries = []
          with tarfile.open(out/'source.tar.gz','w:gz') as archive:
              for row in rows:
                  path = pathlib.Path(row['path'])
                  data = path.read_bytes()
                  sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  assert sha == row['after'] and hashlib.sha256(data).hexdigest() == row['sha256'], row['path']
                  archive.add(path, arcname=row['path'], recursive=False)
                  payload = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
                  request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs', data=payload, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
                  assert result['sha'] == sha
                  entries.append({'path':row['path'],'mode':'100644','type':'blob','sha':sha})
          (out/'tree-entries.json').write_text(json.dumps(entries,indent=2)+'\n')
          print('Verified and uploaded',len(entries),'ordinary source blobs; no refs changed')
          PY
      - name: Execute complete audit and artifact native suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p latent-audit --all-features --all-targets -- --test-threads=1 2>&1 | tee target/publication-operator/audit-tests.log
          cargo test --locked -p latent-artifacts --all-features --all-targets -- --test-threads=1 2>&1 | tee target/publication-operator/artifact-tests.log
      - name: Execute complete native control-store including physical resource gates
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p latent-control-store --all-features --lib -- --nocapture --test-threads=1 2>&1 | tee target/publication-operator/control-tests.log
      - name: Execute complete wire library and authenticated management integration
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p latent-wire --all-features --lib -- --test-threads=1 2>&1 | tee target/publication-operator/wire-library-tests.log
          cargo test --locked -p latent-wire --all-features --test management_service -- --test-threads=1 2>&1 | tee target/publication-operator/management-tests.log
      - name: Execute CLI library and real authenticated operator subprocesses
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p latent --all-features --lib -- --test-threads=1 2>&1 | tee target/publication-operator/cli-library-tests.log
          cargo test --locked -p latent --all-features --test publication_operator -- --test-threads=1 2>&1 | tee target/publication-operator/cli-native-tests.log
          cargo test --locked -p latent-rpc --all-targets -- --test-threads=1 2>&1 | tee target/publication-operator/rpc-tests.log
      - name: Check production composition formatting and unchanged warning policy
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p latentd --lib 2>&1 | tee target/publication-operator/standalone-check.log
          cargo check --locked -p latent-artifacts -p latent-audit -p latent-control-store -p latent-wire -p latent 2>&1 | tee target/publication-operator/default-check.log
          cargo fmt -p latent-artifacts -p latent-audit -p latent-control-store -p latent-wire -p latent -p latentd --check 2>&1 | tee target/publication-operator/format.log
          cargo clippy --locked -p latent-artifacts -p latent-audit -p latent-control-store -p latent-wire -p latent --all-features --all-targets 2>&1 | tee target/publication-operator/clippy.log
      - name: Verify exact native discovery against the complete registered inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          from tools.ci_suite_inventory import load
          out = pathlib.Path('target/publication-operator')
          suites = {s['id']:s for s in load()['suites']}
          targets = [('latent-audit.lib.latent-audit','latent-audit',['--lib']),('latent-control-store.lib.latent-control-store','latent-control-store',['--lib']),('latent-wire.lib.latent-wire','latent-wire',['--lib']),('latent-wire.test.management-service','latent-wire',['--test','management_service']),('latent.lib.latent','latent',['--lib']),('latent.test.publication-operator','latent',['--test','publication_operator'])]
          report = []
          for key,package,target in targets:
              command = ['cargo','test','--locked','-p',package,'--all-features',*target,'--','--list']
              run = subprocess.run(command,text=True,capture_output=True,check=True)
              (out/(key+'.list.log')).write_text(run.stdout+run.stderr)
              names = [line[:-6] for line in run.stdout.splitlines() if line.endswith(': test')]
              expected = suites[key]['expectedCases']
              assert len(names) == len(set(names)) and set(names) == set(expected), (key, sorted(set(names)^set(expected)))
              assert len(names) == suites[key]['minimumCases']
              report.append({'suite':key,'cases':len(names),'exact':True})
          (out/'discovery.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Validate source contracts generated surfaces and full documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          LSF_REQUIRE_NATIVE_PROCESS_TESTS=1 python3 -m unittest tools.tests.test_ci_suite_cases tools.tests.test_owned_runners tools.tests.test_ci_profile_sparse tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_ci_contracts 2>&1 | tee target/publication-operator/python-tests.log
          python3 tools/ci_coverage.py --receipt target/ci/publication-operator.json 2>&1 | tee target/publication-operator/ci-coverage.log
          cp target/ci/publication-operator.json target/publication-operator/ci-inventory.json
          python3 tools/validate_docs.py 2>&1 | tee target/publication-operator/docs.log
          python3 sdk/profile/generate.py --check 2>&1 | tee target/publication-operator/sdk-profile.log
          PROTOC=$(find "$HOME/.cargo/registry/src" -path '*/protoc-bin-vendored-linux-x86_64-3.2.0/bin/protoc' -type f -print -quit)
          python3 tools/generate_node_rpc.py --protoc "$PROTOC" --check 2>&1 | tee target/publication-operator/node-check.log
      - name: Retain exact source and diagnostics even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/publication-operator
          rustc --version --verbose > target/publication-operator/rustc.txt
          cargo --version > target/publication-operator/cargo.txt
          python3 - <<'PY'
          import hashlib,json,pathlib
          out=pathlib.Path('target/publication-operator')
          manifest=out/'manifest.json'
          if manifest.exists():
              rows=json.loads(manifest.read_text())
              observations=[]
              for row in rows:
                  path=pathlib.Path(row['path'])
                  data=path.read_bytes() if path.is_file() else b''
                  observations.append({'path':row['path'],'matches':hashlib.sha256(data).hexdigest()==row['sha256']})
              (out/'final-source-check.json').write_text(json.dumps(observations,indent=2)+'\n')
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file() and p.name!='SHA256SUMS.json'}
          (out/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: publication-native-operator-${{ github.sha }}
          path: target/publication-operator/
          retention-days: 7
          if-no-files-found: error
