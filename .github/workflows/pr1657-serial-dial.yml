name: PR 1657 serialized original HTTP dial candidate
on:
  push:
    branches: ['diag/pr1657-serial-dial-20261106']
permissions:
  contents: read
  actions: read
jobs:
  progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Add closed numeric host progress observations only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/progress"
          python3 -m pip install --requirement tools/requirements.lock
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path); data = p.read_text(); assert data.count(old) == 1, (path, old)
              p.write_text(data.replace(old, new))
          path = 'crates/latent-wasmtime/src/host/streaming_http/body.rs'
          replace(path, 'let rep = source.rep();', 'let rep = source.rep();\n                eprintln!("LSF1657 read-begin {} {}", rep, maximum);')
          replace(path, 'let result = value.read(maximum as usize).await;', 'let result = value.read(maximum as usize).await;\n                        eprintln!("LSF1657 read-ready {} {}", rep, u32::from(result.is_ok()));')
          replace(path, 'let chunk = pending.reservation.rep();', 'let chunk = pending.reservation.rep();\n                        eprintln!("LSF1657 read-return {} {}", rep, chunk);')
          replace(path, 'checkpoint(&mut store)?;\n                    let result = store\n', 'checkpoint(&mut store)?;\n                    eprintln!("LSF1657 chunk-bytes {}", value.rep());\n                    let result = store\n')
          path = 'tools/rust_thread_http_sibling_node.py'
          replace(path, '        process.close()\n', '        node.drain()\n        import re\n        trace = [line.decode("ascii") for line in bytes(node.buffers[1]).splitlines()\n                 if re.fullmatch(rb"LSF1657 [a-z-]+ [0-9]+(?: [0-9]+)?", line)]\n        require(len(trace) <= 256, "closed-progress-observation-bound")\n        write_json(output / "http-progress.json", trace)\n        process.close()\n')
          PY
          git diff --binary --full-index > "$RUNNER_TEMP/progress/diagnostic.patch"
      - name: Retrieve authenticated original compiler materials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_combined_http_materials.py --output "$RUNNER_TEMP/rust-combined-original"
      - name: Observe original signed sibling call with no gate changes
        env:
          SOURCE: ${{ github.sha }}
        run: python3 -B tools/qualify_rust_thread_http_combined.py --compiler-materials "$RUNNER_TEMP/rust-combined-original" --output "$RUNNER_TEMP/rust-combined-signed" --source-commit "$SOURCE"
      - name: Show bounded closed progress and terminal evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'rust-combined-signed/node'
          for name in ('http-progress.json','rust-thread-http-terminal.json','rust-thread-http-terminal-peer.json'):
              p=root/name
              if p.is_file():
                  assert p.stat().st_size < 65536
                  print('OBSERVATION', name, json.dumps(json.loads(p.read_bytes()), ensure_ascii=True))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-http-progress-${{ github.sha }}
          path: |
            ${{ runner.temp }}/progress/**
            ${{ runner.temp }}/rust-combined-signed/**
            ${{ runner.temp }}/rust-combined-original/retrieval.json
          retention-days: 3
          if-no-files-found: error
