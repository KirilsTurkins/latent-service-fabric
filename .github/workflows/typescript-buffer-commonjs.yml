name: TypeScript published CommonJS Buffer qualification

on:
  push:
    branches: ['feat/typescript-buffer-commonjs-20261024']
    paths:
      - '.github/workflows/typescript-buffer-commonjs.yml'
      - 'tools/qualify_typescript_buffer.py'
      - 'tools/qualify_typescript_buffer_commonjs.py'
      - 'tools/typescript_buffer_commonjs_fixture.py'
      - 'tools/prepare_typescript_commonjs_inputs.py'
      - 'tools/typescript_guest/borrow_signed_inputs.py'
      - 'tools/typescript_guest/buffer_profile.py'
      - 'tools/typescript_guest/build.py'
      - 'tools/typescript_guest/compiler.py'
      - 'tools/captured_compiler_isolation.py'
      - 'tools/tests/test_typescript_module_layout.py'
      - 'tools/typescript_guest/standard_global_types.py'
      - 'tools/tests/test_typescript_standard_global_types.py'
      - 'tools/tests/fixtures/npm-types-node-26.6.5.*'
      - 'sdk/typescript-guest/probes/node-buffer-commonjs/**'
      - 'tools/tests/test_typescript_buffer_commonjs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-buffer-commonjs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-commonjs-buffer:
    name: One normally captured compiled and signed six-case CommonJS component
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Fetch immutable normal host source for unchanged receipt verification
        run: |
          git fetch --no-tags --depth=1 origin 77bf0e3f3b68e17342b6146abd6f2de34a3efa00
          git fetch --no-tags --depth=1 origin be356d28f93267dc34078ce137d49ed28c28bf47
      - name: Check published input binding and normal capture/material boundaries
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_typescript_buffer_commonjs tools.tests.test_typescript_standard_global_types -v
      - name: Install the normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check real captured module layout and read-only typecheck namespace
        env:
          LSF_REQUIRE_COMPILER_ISOLATION: '1'
        run: python3 -B -m unittest tools.tests.test_typescript_module_layout -v
      - name: Install only the normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-buffer-tools"
      - name: Capture and review the exact native-locked published CommonJS closure
        run: python3 -B tools/typescript_buffer_commonjs_fixture.py --output "$RUNNER_TEMP/typescript-buffer-commonjs-capture"
      - name: Authenticate existing five-product host without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/java_phase_native_products.py --output "$RUNNER_TEMP/typescript-buffer-native"
      - name: Authenticate completed engine stage and original source splicer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/prepare_typescript_commonjs_inputs.py --output "$RUNNER_TEMP/typescript-buffer-compiler"
      - name: Typecheck compile package sign admit and execute six published cases
        run: |
          python3 -B tools/qualify_typescript_buffer_commonjs.py \
            --project "$RUNNER_TEMP/typescript-buffer-commonjs-capture/application" \
            --prepared-native "$RUNNER_TEMP/typescript-buffer-native" \
            --tools "$RUNNER_TEMP/typescript-buffer-tools" \
            --engine "$RUNNER_TEMP/typescript-buffer-compiler/products/engine" \
            --splicer "$RUNNER_TEMP/typescript-buffer-compiler/products/splicer" \
            --output "$RUNNER_TEMP/typescript-buffer"
      - name: Retain actual inputs commands signed receipts and physical retirement
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-buffer-commonjs-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/typescript-buffer-native/*.json
            ${{ runner.temp }}/typescript-buffer-compiler/*.json
            ${{ runner.temp }}/typescript-buffer-compiler/products/**
            ${{ runner.temp }}/typescript-buffer/*.json
            ${{ runner.temp }}/typescript-buffer-commonjs-capture/**
            ${{ runner.temp }}/typescript-buffer/build/*.json
            ${{ runner.temp }}/typescript-buffer/build/*.js
            ${{ runner.temp }}/typescript-buffer/build/*.wit
            ${{ runner.temp }}/typescript-buffer/build/*.wasm
            ${{ runner.temp }}/typescript-buffer/build/package/**
            ${{ runner.temp }}/typescript-buffer/build/logs/**
            ${{ runner.temp }}/typescript-buffer/node/*.json
            ${{ runner.temp }}/typescript-buffer/node/node-stderr.txt
            ${{ runner.temp }}/typescript-buffer/node/controls/**
            ${{ runner.temp }}/typescript-buffer/node/signed/**
