name: Prepare exact cross-origin inventory blob
on:
  pull_request:
    branches: [development]
    paths: ['.github/workflows/cross-origin-inventory-patch.yml']
permissions: {}
jobs:
  prepare:
    if: github.event.pull_request.number == 1561 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/660-publication-cross-origin-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # One-time, fixed-input catalogue edit. No checkout, PR code, artifacts,
      # user-supplied script, ref mutation, commit, merge, or secret output.
      - name: Create only the reviewed catalogue blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          root = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          request = urllib.request.Request(root + '/f2c06d93dba00affe87149a1ea6ce1c66506f933', headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              envelope = json.loads(response.read(2 * 1024 * 1024))
          original = base64.b64decode(envelope['content'])
          assert hashlib.sha256(original).hexdigest() == 'f6a0e5e887e2809561e9143e49d4cb32eec893397bbf2a66c71587dc198c5468'
          document = json.loads(original)
          cases = [
              'config::http::cross_origin::tests::cross_origin_configuration_enforces_all_three_independent_bounds',
              'config::http::cross_origin::tests::cross_origin_configuration_is_closed_default_empty_and_https_public_only',
              'config::http::cross_origin::tests::cross_origin_grants_reject_duplicates_foreign_ownership_and_bad_publications',
              'config::http::cross_origin::tests::cross_origin_origins_require_exact_ascii_https_serialization',
              'standalone::http::assets::cross_origin::metadata::tests::cross_origin_final_grant_requires_exact_publication_tenant_authority_and_credentials',
              'standalone::http::assets::cross_origin::metadata::tests::cross_origin_metadata_rejects_opaque_origins_navigation_no_cors_and_duplicates',
              'standalone::http::assets::cross_origin::metadata::tests::cross_origin_preflight_is_bounded_conditional_only_and_never_credentialed',
              'standalone::http::assets::cross_origin::metadata::tests::cross_origin_provisional_admission_preserves_defaults_and_allows_only_subresources',
              'standalone::http::assets::cross_origin::response::tests::cors_headers_are_exact_private_and_repeated_on_every_authorized_status',
              'standalone::http::assets::cross_origin::tests::cross_origin_native_credentials_origin_variants_and_strict_defaults_do_not_mix',
              'standalone::http::assets::cross_origin::tests::cross_origin_native_preflight_selects_exact_method_and_never_html_or_fallback',
              'standalone::http::assets::cross_origin::tests::cross_origin_native_static_get_head_304_and_errors_share_exact_current_authority',
              'standalone::http::assets::cross_origin::tests::lifecycle::cross_origin_native_disconnect_retains_the_actual_blocking_read_owner_until_completion',
              'standalone::http::assets::cross_origin::tests::lifecycle::cross_origin_native_grant_removal_restart_and_new_publication_never_inherit_permission',
              'standalone::http::assets::cross_origin::tests::lifecycle::cross_origin_native_read_capacity_has_no_queue_or_activation_fallback',
              'standalone::http::assets::cross_origin::tests::lifecycle::cross_origin_native_revocation_denies_cached_bodies_conditionals_and_preflights',
              'standalone::http::assets::cross_origin::tests::lifecycle::cross_origin_preflight_output_rechecks_revocation_on_every_write_poll',
          ]
          row = next(row for row in document['suites'] if row['id'] == 'latentd.lib.latentd')
          assert len(row['expectedCases']) == row['minimumCases'] == 475
          assert len(set(cases)) == 17 and not set(cases).intersection(row['expectedCases'])
          row['expectedCases'] = sorted(row['expectedCases'] + cases)
          row['minimumCases'] += len(cases)
          updated = (json.dumps(document, sort_keys=True, separators=(',', ':')) + '\n').encode()
          assert hashlib.sha256(updated).hexdigest() == 'c4a2eaf62258fd8dd0cfeb234b7c048f7434b7549ab97b425bb4ae80ab915397'
          expected = hashlib.sha1(b'blob ' + str(len(updated)).encode() + b'\0' + updated).hexdigest()
          assert expected == 'ccf3bd52fbf415a18b39e67f27de3a5c65fb7bec'
          payload = json.dumps({'content': updated.decode(), 'encoding': 'utf-8'}).encode()
          request = urllib.request.Request(root, data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read(4096))
          assert result['sha'] == expected
          print(json.dumps({'blob': expected, 'sha256': hashlib.sha256(updated).hexdigest(), 'addedCases': 17, 'minimumCases': 492, 'refsChanged': False}))
          PY
