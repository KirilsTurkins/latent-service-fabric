name: Publication operator build inputs
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths: [.github/workflows/publication-operator-inputs.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - name: Check the locked native wire and CLI dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/publication-operator-inputs
          cargo check --locked -p latent-wire -p latent 2>&1 | tee target/publication-operator-inputs/check.log
      - name: Retain public source inputs only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/publication-operator-inputs
          tar -czf target/publication-operator-inputs/cargo-registry.tar.gz -C "$HOME/.cargo" registry
          git rev-parse HEAD > target/publication-operator-inputs/source-commit.txt
          cp Cargo.lock target/publication-operator-inputs/Cargo.lock
          rustc --version --verbose > target/publication-operator-inputs/rustc.txt
          sha256sum target/publication-operator-inputs/cargo-registry.tar.gz > target/publication-operator-inputs/SHA256SUMS
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: publication-operator-inputs-${{ github.sha }}
          path: target/publication-operator-inputs/
          retention-days: 7
          if-no-files-found: error
