name: RustSec advisory baseline

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      controls-ref:
        description: Reviewed scanner revision, independent of the scan input
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: RustSec current change
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out scanner controls
        uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          path: controls
          persist-credentials: false
          ref: ${{ inputs.controls-ref }}
      - name: Check out scan input, never execute it
        uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          ref: ${{ inputs.source-ref }}
          path: source
          persist-credentials: false
      - name: Install digest-pinned cargo-audit outside the input checkout
        run: python3 controls/tools/security_install.py --tool cargo-audit --destination "$RUNNER_TEMP/security-tools"
      - name: Audit the unchanged or changed resolved lockfile against fresh RustSec data
        run: python3 controls/tools/security_scan.py rustsec --repo source --tools "$RUNNER_TEMP/security-tools" --scratch "$RUNNER_TEMP/security-scan"
