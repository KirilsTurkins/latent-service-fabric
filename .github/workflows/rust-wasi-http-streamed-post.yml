name: Rust ordinary streamed POST corrective runtime

on:
  push:
    branches: ['fix/rust-http-streamed-post-fixture-20261021']
    paths:
      - '.github/workflows/rust-wasi-http-streamed-post.yml'
      - 'tools/qualify_rust_wasi_http_runtime.py'
      - 'tools/rust_wasi_http_current_backend.py'
      - 'tools/tests/test_rust_wasi_http_async_runtime_replay.py'
      - 'tools/rust_wasi_http_runtime_fixture.py'
      - 'tools/rust_wasi_http_runtime_node.py'
      - 'tools/rust_wasi_http_root.py'
      - 'tools/rust_wasi_http_compose.py'
      - 'tools/activation_stack_native_products.py'
      - 'tools/activation_stack_native_source.py'
      - 'tools/tests/test_rust_wasi_http_runtime.py'
      - 'tools/tests/test_rust_wasi_http_runtime_fixture.py'
      - 'tools/tests/test_rust_wasi_http_profile.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-wasi-http-streamed-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-clients:
    name: One fresh captured guest and original finite two-client programme
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Prepare the normal captured compiler sandbox and pinned binding tool only
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/rust-http-tools"
          echo "$RUNNER_TEMP/rust-http-tools" >> "$GITHUB_PATH"
      - name: Fetch the exact historical native producer source without a host build
        run: |
          git fetch --no-tags --depth=1 origin c7134289f446cb3171eb0ffd800a94afc2a5209f
          git fetch --no-tags --depth=1 origin 52654f7b86ef0043a8250dea39093d955ee9f480
      - name: Check actual-source capture and refusal oracles without compiling a guest
        run: python3 -B -m unittest tools.tests.test_rust_wasi_http_runtime_fixture tools.tests.test_rust_wasi_http_runtime tools.tests.test_rust_wasi_http_profile tools.tests.test_rust_wasi_http_inputs_prepared tools.tests.test_rust_wasi_http_async_runtime_replay tools.tests.test_activation_stack_native_products tools.tests.test_activation_stack_native_source -q
      - name: Acquire only locked SDK sources for the unchanged compiler-owned forwarding root
        run: cargo fetch --locked --target wasm32-unknown-unknown --target x86_64-unknown-linux-gnu
      - name: Restore the exact already compiled current110 backend without rebuilding it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-wasi-http-runtime-52654f7b86ef0043a8250dea39093d955ee9f480
          run-id: '39606039445'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-http-original
      - name: Authenticate the original five products without building another host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/activation_stack_native_products.py --output "$RUNNER_TEMP/rust-http-native"
      - name: Compile one ordinary captured guest then sign and execute all strict cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_rust_wasi_http_runtime.py
          --native-products "$RUNNER_TEMP/rust-http-native"
          --http-runtime "$RUNNER_TEMP/rust-http-original/rust-http-current-backend"
          --retained-backend "$RUNNER_TEMP/rust-http-original"
          --output "$RUNNER_TEMP/rust-http-runtime-qualification"
      - name: Retain bounded public source build invocation and cleanup observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-wasi-http-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-runtime-qualification/qualification.json
            ${{ runner.temp }}/rust-http-runtime-qualification/FAILED.json
            ${{ runner.temp }}/rust-http-runtime-qualification/current-build.json
            ${{ runner.temp }}/rust-http-runtime-qualification/capture.json
            ${{ runner.temp }}/rust-http-runtime-qualification/source/candidate.json
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/Cargo.toml
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/Cargo.lock
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/latent.dependencies*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/cargo-resolved.lock.json
            ${{ runner.temp }}/rust-http-runtime-qualification/approval-required/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/approval-required/logs/**
            ${{ runner.temp }}/rust-http-runtime-qualification/build/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/build/*.wasm
            ${{ runner.temp }}/rust-http-runtime-qualification/build/logs/**
            ${{ runner.temp }}/rust-http-runtime-qualification/node/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/examples-controls/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/foreign-controls/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/provider-absence/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/provider-absence/controls/*.json
            ${{ runner.temp }}/rust-http-native/*.json
            ${{ runner.temp }}/rust-http-original/rust-http-current-backend/*.json
            ${{ runner.temp }}/rust-http-original/rust-http-current-backend/*.wasm
            ${{ runner.temp }}/rust-http-original/rust-http-current-backend/component-composer/wac
            ${{ runner.temp }}/rust-http-original/rust-http-current-backend/logs/*.stdout.txt
            ${{ runner.temp }}/rust-http-original/rust-http-current-backend/logs/*.stderr.txt
          if-no-files-found: warn
          retention-days: 3
