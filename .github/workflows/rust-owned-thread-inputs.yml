name: Owned Rust thread compiler inputs
on:
  workflow_dispatch:
    inputs:
      application-diagnostic:
        description: Compile one captured ordinary ThreadPool application core; graph remains unqualified
        type: boolean
        default: false
  push:
    branches: ['feat/rust-standard-thread-runtime-20261022']
    paths:
      - .github/workflows/rust-owned-thread-inputs.yml
      - tools/compile_rust_owned_thread_inputs.py
permissions:
  contents: read
concurrency:
  group: rust-owned-thread-inputs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-inputs:
    name: Compile exact Rust context utility and owned thread sysroot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@c1136b2d97fe79ef645e9508b2048a222f50a170 # v7.1.0 + upstream changes + LSF security fixes
        if: ${{ inputs.application-diagnostic }}
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Install existing pinned Python compiler recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        if: ${{ inputs.application-diagnostic }}
        with:
          version: 1.254.0
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        if: ${{ inputs.application-diagnostic }}
        with:
          version: '0.16.0'
      - name: Prepare the existing captured compiler isolation and binding tool
        if: ${{ inputs.application-diagnostic }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/rust-thread-tools"
          echo "$RUNNER_TEMP/rust-thread-tools" >> "$GITHUB_PATH"
      - name: Build the two exact owned compiler inputs once
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          APPLICATION_DIAGNOSTIC: ${{ inputs.application-diagnostic || false }}
        run: |
          arguments=()
          if [ "$APPLICATION_DIAGNOSTIC" = true ]; then
            arguments+=(--application-diagnostic)
          fi
          python3 -B tools/compile_rust_owned_thread_inputs.py \
            --expected-head "$EXPECTED_HEAD" \
            --rust-bin "$(dirname "$(rustup which rustc)")" \
            --output "$RUNNER_TEMP/rust-owned-thread-inputs" "${arguments[@]}"
      - name: Retain bounded source, tool, sysroot and actual failure logs
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-owned-thread-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/rust-owned-thread-inputs/**
          if-no-files-found: error
          retention-days: 3
