name: Rust HTTP current native controls

on:
  push:
    branches: ['fix/rust-http-current-native-20261109']
    paths:
      - '.github/workflows/rust-http-current-native.yml'
      - '.github/workflows/sdk-native-products.yml'
      - '.github/workflows/host-codec-memory.yml'
      - '.cargo/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'api/proto/**'
      - 'apps/**'
      - 'crates/**'
      - 'examples/echo-contract/**'
      - 'examples/package-format/**'
      - 'schemas/**'
      - 'sdk/rust/**'
      - 'tools/**'
      - 'wit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-http-current-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-controls:
    name: Current native producer and original Rust HTTP controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Restore compiled Rust dependencies
        uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Fetch only the original pinned control histories
        run: |
          git fetch --no-tags --depth=1 origin b606b1402961593dd918722a66fe293bfab9b319
          git fetch --no-tags --depth=1 origin c7134289f446cb3171eb0ffd800a94afc2a5209f
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Check current source and fail-closed control boundaries
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_rust_http_current_controls tools.tests.test_host_codec_native tools.tests.test_c_timed_current_products -q
      - name: Execute the current producer and original default-feature controls
        timeout-minutes: 23
        run: >-
          python3 -B tools/rust_http_current_controls.py
          --prepared "$RUNNER_TEMP/rust-http-current-native"
          --output "$RUNNER_TEMP/rust-http-current-controls"
          --revision "$GITHUB_SHA"
      - name: Retain bounded current-source and control observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-http-current-native-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-current-native/*.json
            ${{ runner.temp }}/rust-http-current-native/logs/*.txt
            ${{ runner.temp }}/rust-http-current-controls/*.json
            ${{ runner.temp }}/rust-http-current-controls/logs/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Retain the five verified and size-bounded native products
        if: success()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-http-current-native-products-${{ github.sha }}
          path: ${{ runner.temp }}/rust-http-current-native/native-binaries/**
          if-no-files-found: error
          retention-days: 7
