name: Signed original Rust default ThreadPool progress

on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-thread-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-original-thread-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-default-pools:
    name: One original Rust component and five signed default ThreadPool calls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0aa7f1b2061a76e0424bd22ac45be035ce42a6e # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Fetch the exact successful compiler and native source event
        run: |
          git fetch --no-tags --depth=1 origin cddfb5d016a6311ed0db4673e490dc9caad917dd b422af24d86344ac7abb8b8fa56c3782aab63915
      - name: Install locked Python dependencies and check finite replay and policy refusals
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_rust_thread_runtime -v
      - name: Authenticate five exact native products and the complete 200-control origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_thread_runtime_native_products.py --output "$RUNNER_TEMP/rust200-native"
      - name: Retain only four original compiler members with exact preimage pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_thread_compiler_materials.py --output "$RUNNER_TEMP/rust411272-materials"
      - name: Sign one retained component and run all five ordinary public calls
        run: >-
          python3 -B tools/qualify_rust_thread_runtime.py
          --prepared "$RUNNER_TEMP/rust200-native"
          --compiler-materials "$RUNNER_TEMP/rust411272-materials"
          --output "$RUNNER_TEMP/rust-thread-runtime"
      - name: Retain bounded public signing, invocation and physical retirement evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-thread-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-thread-runtime/**
            ${{ runner.temp }}/rust200-native/retrieval.json
            ${{ runner.temp }}/rust200-native/native-products.json
            ${{ runner.temp }}/rust200-native/source-inputs.json
            ${{ runner.temp }}/rust411272-materials/retrieval.json
          if-no-files-found: error
          retention-days: 7
