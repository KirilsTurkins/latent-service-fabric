name: Cargo recipe evaluation

on:
  push:
    branches: [feat/432-cargo-cache-evidence]
    paths:
      - .github/workflows/cargo-recipe-evaluation.yml
      - tools/ci_cargo*.py
      - tools/tests/test_ci_cargo*.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-recipe-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Isolated Cargo evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      LSF_REQUIRE_NATIVE_PROCESS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Validate recipe and cache observations with native process accounting
        run: python3 -m unittest tools.tests.test_ci_cargo tools.tests.test_ci_cargo_cache tools.tests.test_ci_cargo_observe
      - name: Exercise real Cargo freshness and cache faults without shared cache writes
        run: python3 tools/ci_cargo_probe.py --include-msrv --output "$RUNNER_TEMP/cargo-recipe-evaluation"
      - name: Retain bounded evaluation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-recipe-evaluation-${{ github.sha }}
          path: ${{ runner.temp }}/cargo-recipe-evaluation/
          if-no-files-found: error
          retention-days: 7
