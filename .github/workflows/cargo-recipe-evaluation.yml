name: Cargo recipe evaluation

on:
  workflow_dispatch:
    inputs:
      run_full_recipes:
        description: "Replay the complete reviewed Rust Cargo selection cold and twice dependency-warm"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cargo-recipe-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Isolated Cargo evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      LSF_REQUIRE_NATIVE_PROCESS_TESTS: "1"
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - name: Initialize attempt diagnostics before prerequisites
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-recipe-evaluation"
          git rev-parse HEAD > "$RUNNER_TEMP/cargo-recipe-evaluation/revision.txt"
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install pinned validation dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Install maintained MSRV for cache fault controls
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Validate recipe and cache observations with native process accounting
        run: |
          # Reviewed imported observer owner; not an additional runner:
          # tools/ci_cargo_observe.py
          set -o pipefail
          python3 -m unittest tools.tests.test_ci_cargo tools.tests.test_ci_cargo_cache tools.tests.test_ci_cargo_observe tools.tests.test_ci_cargo_evaluate 2>&1 | tee "$RUNNER_TEMP/cargo-recipe-evaluation/tests.log"
      - name: Exercise real Cargo freshness and cache faults without shared cache writes
        run: python3 tools/ci_cargo_probe.py --include-msrv --output "$RUNNER_TEMP/cargo-recipe-evaluation/probe"
      - name: Retain bounded evaluation diagnostics
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: cargo-recipe-evaluation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-recipe-evaluation/
          if-no-files-found: error
          retention-days: 7

  recipes:
    name: Rust recipes (${{ matrix.configuration }})
    if: inputs.run_full_recipes
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        configuration: [current, ci-correctness]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      LSF_REQUIRE_NATIVE_PROCESS_TESTS: "1"
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - name: Initialize recipe attempt diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-full-evaluation"
          git rev-parse HEAD > "$RUNNER_TEMP/cargo-full-evaluation/revision.txt"
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Reclaim unused Android SDK space for Cargo evaluation
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          unused_android=/usr/local/lib/android
          if [[ -d "$unused_android" && ! -L "$unused_android" && "$(realpath -e -- "$unused_android")" == "$unused_android" ]]; then
            sudo rm -rf --one-file-system -- "$unused_android"
          fi
          df -h "$RUNNER_TEMP"
      - name: Install pinned recipe prerequisites
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fish
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Install the pinned stream fixture compiler
        uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Prepare the fixed native stream component fixture
        id: stream_outer_fixture
        run: |
          set -euo pipefail
          python3 -c 'import tomllib; assert tomllib.load(open("tools/toolchain.toml", "rb"))["contracts"]["wasm-tools"] == "1.254.0"'
          wasm-tools --version | grep -E '^wasm-tools 1[.]254[.]0([[:space:]]|$)'
          wat=crates/latent-wasmtime/src/host/native-stream-outers.wat
          test -f "$wat" && test ! -L "$wat"
          git cat-file blob "${GITHUB_SHA}:$wat" | cmp - "$wat"
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/lsf-stream-outers.XXXXXXXX")"
          wasm-tools parse "$wat" -o "$fixture_dir/native-stream-outers.wasm"
          python3 - "$fixture_dir/native-stream-outers.wasm" <<'PY'
          import os
          from pathlib import Path
          import sys
          from tools.qualify_stream_outers import FIXTURE_ENV, WAT, fixture_identity

          assert WAT == 'crates/latent-wasmtime/src/host/native-stream-outers.wat'
          assert FIXTURE_ENV == 'LSF_TEST_STREAM_OUTERS_COMPONENT'
          fixture = Path(sys.argv[1])
          print('Fixed stream component:', fixture_identity(fixture))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={fixture}\n')
          PY

      - name: Replay the exact reviewed Rust recipes and revalidate every handoff
        env:
          LSF_TEST_STREAM_OUTERS_COMPONENT: ${{ steps.stream_outer_fixture.outputs.path }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: python3 tools/ci_cargo_evaluate.py --disposable-checkout --configuration "$CONFIGURATION" --output "$RUNNER_TEMP/cargo-full-evaluation/recipes"
      - name: Retain full recipe observations including failed attempts
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: cargo-full-evaluation-${{ matrix.configuration }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-full-evaluation/
          if-no-files-found: error
          retention-days: 7
