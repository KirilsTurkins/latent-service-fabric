name: Retained Java fiber fault observation

on:
  pull_request:
    paths:
      - .github/workflows/java-fiber-fault.yml
      - tools/java_fiber_fault_inputs.py
      - tools/tests/test_java_fiber_fault_inputs.py
      - tools/ci/contracts/workflows/java-fiber-fault.yml/**
      - crates/latent-wasmtime/src/**
      - crates/latent-wasmtime/tests/local_service/**

permissions:
  contents: read
  actions: read

concurrency:
  group: java-fiber-fault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-fault:
    if: github.event.pull_request.number == 2156 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/sdk-java-model-counts-20261118'
    name: Observe original signed Java fiber failure without rebuilding the guest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - name: Test immutable input and observation selection guards
        run: python3 -B -m unittest tools.tests.test_java_fiber_fault_inputs -v
      - name: Retrieve only the fixed original failed-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/java-fiber-origin"
          timeout 90s gh api repos/KirilsTurkins/latent-service-fabric/actions/runs/44518163237 | head -c 1048577 > "$RUNNER_TEMP/java-fiber-origin/run.json"
          timeout 90s gh api repos/KirilsTurkins/latent-service-fabric/actions/jobs/135539652265 | head -c 1048577 > "$RUNNER_TEMP/java-fiber-origin/job.json"
          timeout 90s gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/14527262956 | head -c 1048577 > "$RUNNER_TEMP/java-fiber-origin/artifact.json"
          timeout 120s gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/14527262956/zip | head -c 75006715 > "$RUNNER_TEMP/java-fiber-origin/artifact.zip"
      - name: Authenticate and stage four original component inputs without a compiler
        run: |
          python3 -B tools/java_fiber_fault_inputs.py \
            --metadata "$RUNNER_TEMP/java-fiber-origin" \
            --archive "$RUNNER_TEMP/java-fiber-origin/artifact.zip" \
            --output "$RUNNER_TEMP/java-fiber-fault"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Restore compiled Rust dependencies without publishing diagnostic products
        uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Run the unchanged signed test with the existing eight-frame numeric observer
        env:
          LSF_GUEST_SDK_LANGUAGE: java
          LSF_JAVA_FIBER_FIXTURE: ${{ runner.temp }}/java-fiber-fault
        shell: bash
        run: |
          set -euo pipefail
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime \
            --features java-checkpoint-gc-trap-diagnostic --test local_service \
            runtime::signed_java_threads_spin_join_and_thread_local_use_real_activation_fibers -- \
            --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/java-fiber-fault/numeric-fault.log"
      - name: Retain bounded original inputs and numeric fault evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: java-fiber-fault-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-fiber-fault/fault-inputs.json
            ${{ runner.temp }}/java-fiber-fault/FIBERS-COMPILE.json
            ${{ runner.temp }}/java-fiber-fault/numeric-fault.log
          if-no-files-found: warn
          retention-days: 7
