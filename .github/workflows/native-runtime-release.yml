name: Native runtime release gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact parent-approved new version and existing tag
        required: true
        type: string
      commit:
        description: Exact reviewed 40-character release commit
        required: true
        type: string
      ci_run:
        description: Successful maintained CI run for that exact commit
        required: true
        type: string
      predecessor_run:
        description: Release-workflow run for the committed compatible predecessor
        required: false
        default: ""
        type: string
      publish:
        description: Publish only after complete native VM evidence and environment review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-runtime-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate:
    name: Exact reviewed tag and CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      predecessor-version: ${{ steps.gate.outputs.predecessor-version }}
      predecessor-commit: ${{ steps.gate.outputs.predecessor-commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare private exact-source host workspace
        run: python3 tools/prepare_native_workspace.py
      - name: Require selected exact identity, successful CI and declared predecessor
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_VERSION: ${{ inputs.version }}
          REVIEWED_COMMIT: ${{ inputs.commit }}
          REVIEWED_CI_RUN: ${{ inputs.ci_run }}
          PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          cd "$NATIVE_WORKSPACE"
          arguments=()
          if test "$PUBLISH" = true; then arguments+=(--publish); fi
          python3 tools/native_release_gate.py --version "$NATIVE_VERSION" --commit "$REVIEWED_COMMIT" \
            --ci-run "$REVIEWED_CI_RUN" --predecessor-run "$PREDECESSOR_RUN" "${arguments[@]}" \
            --output "$PWD/target/native-release-decision.json" --github-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-release-decision-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-release-decision.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Exact-source authenticated native release artifact
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare private exact-source host workspace
        run: python3 tools/prepare_native_workspace.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Use maintained validation profile and pinned dependencies
        run: |
          python3 tools/ci_profile.py
          python3 -m pip install --requirement tools/requirements.lock
          python3 -m unittest tools.tests.test_native_runtime tools.tests.test_native_release_gate
          python3 tools/validate_workflow_actions.py
          python3 tools/validate_docs.py
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Build the three native executables, bootstrap, SBOM and provenance
        env:
          NATIVE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          cd "$NATIVE_WORKSPACE"
          python3 tools/build_native_runtime.py --commit "$GITHUB_SHA" --version "$NATIVE_VERSION" --output "$PWD/target/native-release"
          cargo +1.97.1 fmt --manifest-path tools/native-fixture/Cargo.toml -- --check
          cargo +1.97.1 build --locked --release --manifest-path tools/native-fixture/Cargo.toml \
            --target x86_64-unknown-linux-gnu --target-dir target/native-fixture-build --jobs 2
          install -D -m 0755 target/native-fixture-build/x86_64-unknown-linux-gnu/release/latent-native-vm-fixture target/native-test-tools/fixture-helper
      - name: Authenticate the exact checksum inventory and separate test helper
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.NATIVE_WORKSPACE }}/target/native-release/SHA256SUMS
            ${{ env.NATIVE_WORKSPACE }}/target/native-test-tools/fixture-helper
      - name: Retain disconnected verification material
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: install -m 0644 "$ATTESTATION_BUNDLE" "$NATIVE_WORKSPACE/target/native-release/SHA256SUMS.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-release-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-test-tools-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-test-tools/
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded build failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-release-build-failure-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-build-failure.*
          if-no-files-found: ignore
          retention-days: 14

  native-vm:
    name: Native release VM (${{ matrix.profile }})
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [local-experimental-v1, external-capsule-v1]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare private exact-source host workspace
        run: python3 tools/prepare_native_workspace.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-runtime-release-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-runtime-test-tools-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-test-tools
      - name: Provision host QEMU and independently installed verification roots
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
          PREDECESSOR_VERSION: ${{ needs.gate.outputs.predecessor-version }}
          PREDECESSOR_COMMIT: ${{ needs.gate.outputs.predecessor-commit }}
        run: |
          cd "$NATIVE_WORKSPACE"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client
          if test -c /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          gh --version
          gh attestation trusted-root > "$NATIVE_TRUST/trusted_root.jsonl"
          if test -n "$PREDECESSOR_RUN"; then
            gh run download "$PREDECESSOR_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "native-runtime-release-$PREDECESSOR_COMMIT" --dir target/native-predecessor
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.native_runtime.verify import publisher_policy, RELEASE_WORKFLOW, REPOSITORY
          policy = publisher_policy({"schemaVersion": "latent.native-publisher-policy.v1", "repository": REPOSITORY,
                                    "workflow": RELEASE_WORKFLOW, "sourceRef": "refs/tags/" + os.environ["PREDECESSOR_VERSION"],
                                    "sourceCommit": os.environ["PREDECESSOR_COMMIT"], "version": os.environ["PREDECESSOR_VERSION"],
                                    "purpose": "release"}, os.environ["PREDECESSOR_VERSION"])
          (Path(os.environ["NATIVE_TRUST"]) / "predecessor-policy.json").write_text(json.dumps(policy))
          PY
          fi
      - name: Native packaged execution, real reboot, preservation and selected upgrade
        env:
          NATIVE_VERSION: ${{ needs.gate.outputs.version }}
          NATIVE_PROFILE: ${{ matrix.profile }}
          PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          cd "$NATIVE_WORKSPACE"
          arguments=()
          if test -n "$PREDECESSOR_RUN"; then
            arguments+=(--predecessor-directory "$PWD/target/native-predecessor" --predecessor-policy "$NATIVE_TRUST/predecessor-policy.json")
          fi
          if test "$PUBLISH" = true; then arguments+=(--require-upgrade); fi
          python3 tools/run_native_vm.py --release-directory "$PWD/target/native-release" \
            --trusted-root "$NATIVE_TRUST/trusted_root.jsonl" --verifier "$(readlink -f "$(command -v gh)")" \
            --version "$NATIVE_VERSION" --commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --purpose release --profile "$NATIVE_PROFILE" --fixture-helper "$PWD/target/native-test-tools/fixture-helper" \
            --output "$PWD/target/native-vm/$NATIVE_PROFILE.json" "${arguments[@]}"
      - name: Retain compact redacted actual VM results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-release-vm-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-vm/*.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Reviewed native prerelease publication
    if: inputs.publish
    needs: [gate, build, native-vm]
    environment: native-runtime-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare private exact-source host workspace
        run: python3 tools/prepare_native_workspace.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-runtime-release-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-runtime-release-vm-*-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-vm
          merge-multiple: true
      - name: Revalidate live exact-head CI, both native VM receipts and offline publisher identity
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_VERSION: ${{ needs.gate.outputs.version }}
          REVIEWED_COMMIT: ${{ inputs.commit }}
          REVIEWED_CI_RUN: ${{ inputs.ci_run }}
          PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
        run: |
          cd "$NATIVE_WORKSPACE"
          python3 tools/native_release_gate.py --version "$NATIVE_VERSION" --commit "$REVIEWED_COMMIT" \
            --ci-run "$REVIEWED_CI_RUN" --predecessor-run "$PREDECESSOR_RUN" --publish \
            --receipts "$PWD/target/native-vm" --release-directory "$PWD/target/native-release" \
            --output "$PWD/target/native-release-acceptance.json"
          gh attestation trusted-root > "$NATIVE_TRUST/trusted_root.jsonl"
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from tools.native_runtime import verify
          decision = json.loads(Path("target/native-release-acceptance.json").read_text())
          trust = Path(os.environ["NATIVE_TRUST"])
          policy = trust / "publisher-policy.json"
          policy.write_text(json.dumps(decision["publisherPolicy"]))
          with verify.release(Path("target/native-release").resolve(), decision["version"],
                              verify.PublisherTrust(policy, trust / "trusted_root.jsonl", Path(shutil.which("gh")).resolve())):
              pass
          PY
      - name: Authenticate complete exact-artifact VM acceptance receipts
        id: acceptance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.NATIVE_WORKSPACE }}/target/native-release-acceptance.json
            ${{ env.NATIVE_WORKSPACE }}/target/native-vm/*.json
      - name: Publish selected existing tag only, without moving tags or overwriting releases
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_VERSION: ${{ needs.gate.outputs.version }}
          REVIEWED_COMMIT: ${{ inputs.commit }}
          ACCEPTANCE_BUNDLE: ${{ steps.acceptance.outputs.bundle-path }}
          REVIEWED_CI_RUN: ${{ inputs.ci_run }}
          PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
        run: |
          cd "$NATIVE_WORKSPACE"
          python3 tools/native_release_gate.py --publish-assets --version "$NATIVE_VERSION" --commit "$REVIEWED_COMMIT" \
            --ci-run "$REVIEWED_CI_RUN" --predecessor-run "$PREDECESSOR_RUN" \
            --release-directory "$PWD/target/native-release" --receipts "$PWD/target/native-vm" \
            --acceptance-bundle "$ACCEPTANCE_BUNDLE" --output "$PWD/target/native-publication-result.json"
      - name: Retain publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-publication-${{ github.sha }}
          path: |
            ${{ env.NATIVE_WORKSPACE }}/target/native-release-acceptance.json
            ${{ env.NATIVE_WORKSPACE }}/target/native-publication-result.json
          if-no-files-found: error
          retention-days: 90
