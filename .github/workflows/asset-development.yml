name: Temporary asset development validation
on:
  push:
    branches: [feat/231-immutable-browser-assets]
    paths: [.github/workflows/asset-development.yml]
permissions:
  contents: write
concurrency:
  group: temporary-asset-development
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/231-immutable-browser-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/231-immutable-browser-assets
          show-progress: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Use explicit fixture media types and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/latentd/src/standalone/http/assets/fixture.rs')
          s = p.read_text().replace('path.ends_with(".html")', 'path == "public/index.html"').replace('path.ends_with(".js")', 'path == "public/app.js"')
          p.write_text(s)
          PY
          cargo fmt --all
          git add apps/latentd/src/standalone/http/assets/fixture.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(assets): declare fixture media types without extension inference'
            git push origin HEAD:feat/231-immutable-browser-assets
          fi
          git rev-parse HEAD
          cargo fmt --all --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: lsf-asset-development-v1
          key: ubuntu-24.04
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: true
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: true
      - name: Compile all latentd targets
        id: compile
        run: |
          status=0
          cargo check -p latentd --all-targets --all-features --locked > /tmp/asset-check.log 2>&1 || status=$?
          tail -n 40 /tmp/asset-check.log
          exit "$status"
      - name: Check strict all-target lint
        if: success()
        run: |
          status=0
          cargo clippy -p latentd --all-targets --all-features --locked --no-deps -- -D warnings > /tmp/asset-clippy.log 2>&1 || status=$?
          tail -n 100 /tmp/asset-clippy.log
          exit "$status"
      - name: Run all HTTP and asset regressions
        if: always() && steps.compile.outcome == 'success'
        run: |
          status=0
          cargo test -p latentd --lib --all-features --locked standalone::http > /tmp/http-tests.log 2>&1 || status=$?
          tail -n 120 /tmp/http-tests.log
          exit "$status"
