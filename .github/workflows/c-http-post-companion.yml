{
  "name": "C ordinary HTTP POST companion",
  "on": {
    "workflow_dispatch": null,
    "push": {
      "branches": [
        "feat/sdk-690-c-http-post-20261031"
      ],
      "paths": [
        ".github/workflows/c-http-post-companion.yml",
        "tools/c_http_post_companion.py",
        "tools/c_thread_runtime_node.py",
        "sdk/c-guest/runtime-fixtures/libfetch/post-probe.c"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "c-http-post-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "CARGO_BUILD_JOBS": "2",
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "CARGO_PROFILE_DEV_DEBUG_ASSERTIONS": "true",
    "CARGO_PROFILE_TEST_DEBUG_ASSERTIONS": "true",
    "CARGO_PROFILE_DEV_OVERFLOW_CHECKS": "true",
    "CARGO_PROFILE_TEST_OVERFLOW_CHECKS": "true"
  },
  "jobs": {
    "ordinary-post": {
      "name": "Four signed ordinary C POST and cancellation cells",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Start the original finite C qualification clock",
          "run": "echo \"LSF_C_LIBFETCH_STARTED_NS=$(date +%s%N)\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb",
          "with": {
            "python-version": "3.13.5"
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Restore compiled Rust dependencies",
          "uses": "KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477",
          "with": {
            "prefix-key": "lsf-ci-dependencies-v2",
            "shared-key": "host-correctness",
            "key": "ubuntu-24.04",
            "cache-targets": true,
            "cache-bin": false,
            "cache-workspace-crates": false,
            "cache-all-crates": false,
            "cache-on-failure": false,
            "save-if": false
          }
        },
        {
          "uses": "KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53",
          "with": {
            "version": "1.254.0"
          }
        },
        {
          "uses": "KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a",
          "with": {
            "version": "0.16.0"
          }
        },
        {
          "name": "Prepare pinned bindings and existing compiler containment",
          "run": "python3 -m pip install --requirement tools/requirements.lock\npython3 tools/install_guest_bindgen.py \"$RUNNER_TEMP/guest-tools\"\necho \"$RUNNER_TEMP/guest-tools\" >> \"$GITHUB_PATH\"\nsudo apt-get update\nsudo apt-get install --yes bubblewrap\nsudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0\n"
        },
        {
          "name": "Build fresh ordinary products and execute four signed libfetch cells",
          "run": "python3 -B tools/c_http_post_companion.py --zig \"$(command -v zig)\" --wit-bindgen \"$(command -v wit-bindgen)\" --wasm-tools \"$(command -v wasm-tools)\" --output \"$RUNNER_TEMP/c-http-post\""
        },
        {
          "name": "Retain original bounded proof including failures",
          "if": "always()",
          "uses": "KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16",
          "with": {
            "name": "c-http-post-${{ github.run_id }}",
            "path": "${{ runner.temp }}/c-http-post/qualified.json\n${{ runner.temp }}/c-http-post/FAILED.json\n${{ runner.temp }}/c-http-post/logs/**\n${{ runner.temp }}/c-http-post/owner-inputs/**\n${{ runner.temp }}/c-http-post/project/**\n${{ runner.temp }}/c-http-post/build/**\n${{ runner.temp }}/c-http-post/native-build/logs/**\n${{ runner.temp }}/c-http-post/native-build/native/native-tuple.json\n${{ runner.temp }}/c-http-post/node/qualified.json\n${{ runner.temp }}/c-http-post/node/FAILED.json\n${{ runner.temp }}/c-http-post/node/signed/release-set.json\n${{ runner.temp }}/c-http-post/node/signed/c-thread-runtime/package/**\n${{ runner.temp }}/c-http-post/node/signed/c-thread-runtime/evidence/**\n${{ runner.temp }}/c-http-post/node/signed/c-thread-runtime/deployment.json\n${{ runner.temp }}/c-http-post/node/controls/**\n${{ runner.temp }}/c-http-post/node/commands/logs/**\n${{ runner.temp }}/c-http-post/node/invocation-*.json\n${{ runner.temp }}/c-http-post/node/barrier-*.json\n${{ runner.temp }}/c-http-post/node/peer-*.json\n${{ runner.temp }}/c-http-post/node/retirement-*.json\n${{ runner.temp }}/c-http-post/node/*.stdout\n${{ runner.temp }}/c-http-post/node/*.stderr",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "if": "github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/sdk-690-c-http-post-20261031' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')"
    }
  }
}
