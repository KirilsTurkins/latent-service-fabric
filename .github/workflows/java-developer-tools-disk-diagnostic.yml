name: Java developer tools disk qualification
on:
  push:
    branches: ['diag/java-dev-tools-space-20261105']
permissions:
  contents: read
  actions: read
jobs:
  guest-tools:
    if: ${{ !inputs.java_compiler_product && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feat/559-') || github.event.pull_request.head.repo.full_name != github.repository) }}
    name: Guest tool bundle and maintained application builds (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [java]
    env:
      LSF_DEV_LANGUAGE: ${{ matrix.language }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Reclaim unused Android SDK space for Java assembly
        if: matrix.language == 'java'
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          unused_android=/usr/local/lib/android
          if [[ -d "$unused_android" && ! -L "$unused_android" && "$(realpath -e -- "$unused_android")" == "$unused_android" ]]; then
            sudo rm -rf --one-file-system -- "$unused_android"
          fi
          df -h "$RUNNER_TEMP"
      - name: Select the runner-owned compiler archive cache
        run: printf 'LSF_DEV_COMPILER_CACHE=%s\n' "$RUNNER_TEMP/compiler-archives" >> "$GITHUB_ENV"
      - name: Restore untrusted pinned compiler archives
        id: compiler-cache
        uses: KirilsTurkins/lsf-cache/restore@2ff27e45011b8bcf31ef566ae84c1c923c8aea69 # v6.1.0 + upstream changes + LSF security fixes
        with:
          path: ${{ runner.temp }}/compiler-archives
          key: compiler-archives-v1-${{ runner.os }}-${{ matrix.language }}-${{ hashFiles('tools/build_dev_guest_tools.py', 'tools/dev_guest_tools.py', 'tools/dev_tool_distribution.py', 'tools/install_guest_bindgen.py', 'tools/dev_managed_distribution.py', 'tools/dev_go_distribution.py', 'tools/dev_typescript_distribution.py') }}
      - name: Stage the pinned relocatable Python prefix
        run: |
          image='python@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419'
          container=$(docker create "$image")
          trap 'docker rm "$container"' EXIT
          prefix="$RUNNER_TEMP/guest-tools-cpython"
          mkdir "$prefix"
          docker cp "$container:/usr/local/." "$prefix"
          printf 'LSF_DEV_PYTHON_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"
      - name: Restore untrusted source-pinned Java prepared inputs
        id: java-compiler-cache
        if: matrix.language == 'java'
        uses: KirilsTurkins/lsf-cache/restore@2ff27e45011b8bcf31ef566ae84c1c923c8aea69 # v6.1.0 + upstream changes + LSF security fixes
        with:
          path: ${{ runner.temp }}/compiler-archives/java-prepared
          key: java-prepared-compiler-v1-${{ runner.os }}-${{ hashFiles('tools/data/java-compiler-profile.json') }}
      - name: Acquire the source-pinned Java compiler build inputs
        if: matrix.language == 'java'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input=$(mktemp -d /tmp/latent-java-input.XXXXXXXX)
          rmdir "$input"
          python -B tools/java_guest/compiler_profile_distribution.py acquire --output "$input"
          printf 'LSF_DEV_JAVA_COMPILER_INPUT=%s\n' "$input" >> "$GITHUB_ENV"
      - name: Save only reverified Java prepared input bytes
        if: matrix.language == 'java' && steps.java-compiler-cache.outputs.cache-hit != 'true'
        uses: KirilsTurkins/lsf-cache/save@2ff27e45011b8bcf31ef566ae84c1c923c8aea69 # v6.1.0 + upstream changes + LSF security fixes
        with:
          path: ${{ runner.temp }}/compiler-archives/java-prepared
          key: ${{ steps.java-compiler-cache.outputs.cache-primary-key }}
      - name: Assemble pinned compiler tools and maintained templates
        env:
          LSF_DEV_COMPILER_CACHE: ${{ runner.temp }}/compiler-archives
        run: python tools/build_dev_guest_tools.py --language "$LSF_DEV_LANGUAGE" --output target/dev-tools --python-prefix "$LSF_DEV_PYTHON_PREFIX" --node-tests
      - name: Retain Java assembly logs
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-developer-tools-disk-${{ github.sha }}
          path: target/dev-tools/logs/
          if-no-files-found: warn
          retention-days: 7
