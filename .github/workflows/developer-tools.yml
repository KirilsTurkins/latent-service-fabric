name: Developer tools

on:
  push:
    branches: [feat/559-cross-platform-dev]
  pull_request:
    paths:
      - .github/workflows/developer-tools.yml
      - tools/dev_workflow/**
      - tools/latent_dev.py
      - tools/build_dev_frontend.py
      - tools/build_dev_bundle.py
      - tools/build_dev_rootfs.py
      - tools/build_dev_guest_tools.py
      - tools/dev_tool_distribution.py
      - tools/dev_guest_recipe.py
      - tools/dev_guest_tools.py
      - tools/dev_managed_*.py
      - tools/dev_go_distribution.py
      - tools/dev_typescript_distribution.py
      - tools/guest_runtime_profiles.py
      - tools/run_dev_guest_tools_tests.py
      - tools/dev_node_application_probe.py
      - tools/compare_dev_node_portable.py
      - tools/run_portable_guest_tests.py
      - tools/compare_portable_guest_tests.py
      - tools/c_capsule*.py
      - tools/c_guest/**
      - tools/java_capsule*.py
      - tools/java_guest/**
      - tools/dotnet_capsule.py
      - tools/dotnet_guest/**
      - tools/dotnet_guest_bindings.py
      - tools/go_capsule*.py
      - tools/go_guest/**
      - tools/typescript_capsule.py
      - tools/typescript_guest/**
      - tools/rust_capsule*.py
      - tools/rust_capsule.lock
      - tools/build_observation.py
      - tools/toolchain.toml
      - tools/install_guest_bindgen.py
      - tools/dev_distribution.py
      - tools/dev_rootfs_inventory.py
      - tools/dev_guest_smoke.py
      - packaging/dev/**
      - tools/native_runtime_build.py
      - tools/dev-frontend-windows.lock
      - tools/build_process*.py
      - tools/tests/test_dev_*.py
      - tools/portable-test-host/**
      - tools/run_portable_dev_tests.py
      - tools/portable_dev_provider_tests.py
      - tools/build_portable_dev_guests.py
      - tools/build_portable_c_guests.py
      - tools/run_portable_c_tests.py
      - tools/build_guest_capsules.py
      - sdk/rust-guest/**
      - sdk/c-guest/**
      - sdk/java-guest/**
      - sdk/dotnet-guest/**
      - sdk/go-guest/**
      - sdk/typescript-guest/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - tools/toolchain-smoke/**
      - wit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    # This branch also produces exact-source candidates on push. Its PR must
    # consume those checks without duplicating six compiler bundles and hosts.
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/559-cross-platform-dev' || github.event.pull_request.head.repo.full_name != github.repository
    name: Developer controller contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Exercise controller boundaries and actual owned subprocesses
        run: python -m unittest tools.tests.test_dev_workflow tools.tests.test_dev_contracts tools.tests.test_dev_build_cache tools.tests.test_dev_watch tools.tests.test_dev_tools tools.tests.test_dev_tool_install tools.tests.test_dev_node_policies tools.tests.test_build_process

  guest-tools:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/559-cross-platform-dev' || github.event.pull_request.head.repo.full_name != github.repository
    name: Guest tool bundle and maintained application builds (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [rust, c, java, dotnet, go, typescript]
    env:
      LSF_DEV_LANGUAGE: ${{ matrix.language }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Stage the pinned relocatable Python prefix
        run: |
          image='python@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419'
          container=$(docker create "$image")
          trap 'docker rm "$container"' EXIT
          prefix="$RUNNER_TEMP/guest-tools-cpython"
          mkdir "$prefix"
          docker cp "$container:/usr/local/." "$prefix"
          printf 'LSF_DEV_PYTHON_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"
      - name: Assemble pinned compiler tools and maintained templates
        run: python tools/build_dev_guest_tools.py --language "$LSF_DEV_LANGUAGE" --output target/dev-tools --python-prefix "$LSF_DEV_PYTHON_PREFIX" --node-tests
      - name: Compile actual projects with isolated tools and separate operator packaging
        run: python tools/run_dev_guest_tools_tests.py --language "$LSF_DEV_LANGUAGE" --payload target/dev-tools/payload --packager target/dev-tools/latent-test --source-node target/dev-tools/source-node --output "$RUNNER_TEMP/dev-projects"
      - name: Retain identical applications for both native execution hosts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-${{ matrix.language }}-applications-${{ github.sha }}
          path: ${{ runner.temp }}/dev-projects/
          if-no-files-found: error
          retention-days: 7
      - name: Compile maintained C provider fixtures for native execution
        if: matrix.language == 'c'
        run: |
          python tools/build_portable_c_guests.py --tool-root target/dev-tools/payload --output target/dev-c-portable/providers
          python -c "from pathlib import Path; import os,shutil; shutil.copytree(Path(os.environ['RUNNER_TEMP'])/'dev-projects', 'target/dev-c-portable/applications')"
      - name: Retain exact C components and shared scenarios
        if: matrix.language == 'c'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-c-portable-inputs-${{ github.sha }}
          path: target/dev-c-portable/
          if-no-files-found: error
          retention-days: 7
      - name: Attest guest tool candidate without release authority
        if: github.event_name != 'pull_request'
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/dev-tools/candidate/SHA256SUMS
      - name: Retain offline guest tool attestation
        if: github.event_name != 'pull_request'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: install -m 0644 "$BUNDLE_PATH" target/dev-tools/candidate/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-${{ matrix.language }}-tools-candidate-${{ github.sha }}
          path: target/dev-tools/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Retain compiler and application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-${{ matrix.language }}-builds-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dev-projects/
            target/dev-tools/logs/
            target/dev-tools/managed-dependencies/*.log
            target/dev-tools/managed-dependencies/*.json
            target/dev-tools/managed-dependencies/logs/
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows frontend and actual portable capsules
    needs: guest-tools
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Install exact hashed frontend build inputs
        run: python -m pip install --require-hashes -r tools/dev-frontend-windows.lock
      - name: Build native frontend and isolated Linux helper
        run: python tools/build_dev_frontend.py --output target/dev-candidate
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install pinned component manifest validator
        run: python -m pip install jsonschema==4.26.0
      - name: Build native portable host and maintained compiled Rust guests
        run: |
          cargo build -p latent-portable-test-host --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_echo_capsule.py --output-dir target/dev-echo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p latent-toolchain-smoke --example generic-capsule --target wasm32-unknown-unknown --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wasm-tools component new target/wasm32-unknown-unknown/release/examples/generic_capsule.wasm -o target/dev-generic.wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_portable_dev_guests.py --output target/dev-providers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native production Wasmtime and shared scenario assertions outside checkout
        run: python tools/run_portable_dev_tests.py --host target/release/latent-portable-test-host.exe --echo target/dev-echo --generic target/dev-generic.wasm --providers target/dev-providers --output target/dev-portable-smoke.json
      - name: Retrieve exact C components compiled by the maintained guest tool recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: developer-c-portable-inputs-${{ github.sha }}
          path: target/dev-c-portable/
      - name: Execute actual C applications and SDK providers natively
        run: python tools/run_portable_c_tests.py --host target/release/latent-portable-test-host.exe --providers target/dev-c-portable/providers --applications target/dev-c-portable/applications --output target/dev-portable-c-smoke.json
      - name: Retrieve identical maintained applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: developer-*-applications-${{ github.sha }}
          path: target/dev-applications/
      - name: Execute all maintained tutorial applications on Windows
        run: |
          foreach ($language in @('rust', 'c', 'java', 'dotnet', 'go', 'typescript')) {
            python tools/run_portable_guest_tests.py --host target/release/latent-portable-test-host.exe --language $language --applications "target/dev-applications/developer-$language-applications-$env:GITHUB_SHA" --output "target/dev-portable-$language-applications.json" --require-node-parity
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Record exact portable output for candidate assembly
        run: |
          python -c "from pathlib import Path; import shutil,subprocess; from tools.dev_distribution import file_digest; from tools.dev_workflow.common import encode; d=Path('target/dev-candidate/portable'); d.mkdir(); p=d/'latent-portable-test-host.exe'; shutil.copyfile('target/release/latent-portable-test-host.exe',p); p.with_suffix('.json').write_bytes(encode({'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sha256':file_digest(p)[0],'target':'windows-x86_64','profile':'release'}))"
      - name: Retain exact Windows distribution inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-windows-inputs-${{ github.sha }}
          path: |
            target/dev-candidate/dist/
            target/dev-candidate/portable/
            target/dev-candidate/licenses/
            target/dev-candidate/python-inventory.json
            target/dev-candidate/helper.pyz
            target/dev-candidate/build.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual native subset receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable-subset-${{ github.sha }}
          path: |
            target/dev-portable-smoke.json
            target/dev-portable-c-smoke.json
            target/dev-portable-*-applications.json
          if-no-files-found: error
          retention-days: 7

  linux-portable:
    name: Native Linux maintained tutorial execution
    needs: guest-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: developer-*-applications-${{ github.sha }}
          path: target/dev-applications/
      - name: Build native production component execution host
        run: cargo build -p latent-portable-test-host --release --locked
      - name: Execute all maintained tutorial applications on Linux
        run: |
          set -euo pipefail
          for language in rust c java dotnet go typescript; do
            python tools/run_portable_guest_tests.py --host target/release/latent-portable-test-host --language "$language" --applications "target/dev-applications/developer-$language-applications-$GITHUB_SHA" --output "target/dev-portable-$language-applications.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-portable-subset-${{ github.sha }}
          path: target/dev-portable-*-applications.json
          if-no-files-found: error
          retention-days: 7

  portable-differential:
    name: Native Windows and Linux tutorial equivalence
    needs: [windows, linux-portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-subset-${{ github.sha }}
          path: target/windows/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-portable-subset-${{ github.sha }}
          path: target/linux/
      - name: Compare component identities and actual typed success and error bytes
        run: |
          set -euo pipefail
          for language in rust c java dotnet go typescript; do
            python tools/compare_portable_guest_tests.py --windows "target/windows/dev-portable-$language-applications.json" --linux "target/linux/dev-portable-$language-applications.json" --output "target/$language-differential.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-differential-${{ github.sha }}
          path: target/*-differential.json
          if-no-files-found: error
          retention-days: 7

  wsl-image:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/559-cross-platform-dev' || github.event.pull_request.head.repo.full_name != github.repository
    name: Pinned WSL image candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Build reviewed image and observed package license inventory
        run: python tools/build_dev_rootfs.py --output target/dev-wsl
      - name: Attest image candidate without release authority
        if: github.event_name != 'pull_request'
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/dev-wsl/candidate/SHA256SUMS
      - name: Retain offline image attestation
        if: github.event_name != 'pull_request'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: install -m 0644 "$BUNDLE_PATH" target/dev-wsl/candidate/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-wsl-candidate-${{ github.sha }}
          path: target/dev-wsl/candidate/
          if-no-files-found: error
          retention-days: 7

  windows-bundle:
    name: Windows candidate inventory and provenance
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: developer-windows-inputs-${{ github.sha }}
          path: target/windows-input
      - name: Assemble Windows candidate using existing dependency inventory owner
        run: python tools/build_dev_bundle.py --frontend target/windows-input --portable target/windows-input/portable/latent-portable-test-host.exe --output target/dev-windows
      - name: Attest Windows candidate without release authority
        if: github.event_name != 'pull_request'
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/dev-windows/candidate/SHA256SUMS
      - name: Retain offline Windows attestation
        if: github.event_name != 'pull_request'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: install -m 0644 "$BUNDLE_PATH" target/dev-windows/candidate/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-windows-candidate-${{ github.sha }}
          path: target/dev-windows/candidate/
          if-no-files-found: error
          retention-days: 7

# These hosted checks prove contracts and native executable startup. They do not
# authorize publication or count as full managed-WSL2/portable clean-host qualification.
