name: Developer tools

on:
  pull_request:
    paths:
      - .github/workflows/developer-tools.yml
      - tools/dev_workflow/**
      - tools/latent_dev.py
      - tools/build_dev_frontend.py
      - tools/dev-frontend-windows.lock
      - tools/build_process*.py
      - tools/tests/test_dev_*.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Developer controller contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Exercise controller boundaries and actual owned subprocesses
        run: python -m unittest tools.tests.test_dev_workflow tools.tests.test_dev_contracts tools.tests.test_build_process

  windows:
    name: Packaged Windows frontend
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Install exact hashed frontend build inputs
        run: python -m pip install --require-hashes -r tools/dev-frontend-windows.lock
      - name: Build native frontend and isolated Linux helper
        run: python tools/build_dev_frontend.py --output target/dev-candidate

# These hosted checks prove contracts and native executable startup. They do not
# authorize publication or count as managed-WSL2/portable clean-host qualification.
