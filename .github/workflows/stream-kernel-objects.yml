      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Refuse mixed or unknown object profile inputs before acquisition or build
        env:
          NETLABEL_REQUEST: ${{ inputs.netlabel }}
          NETPORT_REQUEST: ${{ inputs.netport }}
          SIDCACHE_REQUEST: ${{ inputs.sidcache }}
          AVC_REQUEST: ${{ inputs.avc }}
          AUDIT_REQUEST: ${{ inputs.audit }}
        run: |
          python3 - <<'PY'
          import os
          values = [os.environ[name] for name in ('NETLABEL_REQUEST', 'NETPORT_REQUEST', 'SIDCACHE_REQUEST', 'AVC_REQUEST', 'AUDIT_REQUEST')]
          assert all(value in ('', 'true', 'false') for value in values)
          assert values.count('true') <= 1
          PY
      - name: Install the existing locked Python recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact config selection and private symbol oracles without a build
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_objects tools.tests.test_host_stream_kernel_netlabel tools.tests.test_host_stream_kernel_netport tools.tests.test_host_stream_kernel_sidcache tools.tests.test_host_stream_kernel_avc tools.tests.test_host_stream_kernel_audit_skb tools.tests.test_host_stream_kernel_audit -v
      - name: Install only normal upstream Kbuild prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make flex bison bc libelf-dev libssl-dev
      - name: Acquire only the exact maintained official source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.113.tar.xz \
            --output "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          echo "e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428  $RUNNER_TEMP/linux-6.12.113.tar.xz" | sha256sum --check --strict
      - name: Derive actual source preserve security config and compile twenty unlinked mandatory-audit and SKB objects
        run: >-
          python3 -B tools/qualify_host_stream_kernel_objects.py
          --archive "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          --output "$RUNNER_TEMP/stream-kernel-objects" --audit
      - name: Retain bounded configuration compiler objects and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-kernel-audit-objects-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-objects/qualification.json
            ${{ runner.temp }}/stream-kernel-objects/FAILED.json
            ${{ runner.temp }}/stream-kernel-objects/selection.json
            ${{ runner.temp }}/stream-kernel-objects/commands.json
            ${{ runner.temp }}/stream-kernel-objects/baseline.config
            ${{ runner.temp }}/stream-kernel-objects/selected.config
            ${{ runner.temp }}/stream-kernel-objects/commands/logs/*.txt
            ${{ runner.temp }}/stream-kernel-objects/objects/include/generated/autoconf.h
            ${{ runner.temp }}/stream-kernel-objects/objects/net/socket.o
            ${{ runner.temp }}/stream-kernel-objects/objects/fs/inode.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/core/sock.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/ipv4/af_inet.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/security.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/factory.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/netlabel.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/services.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/mls.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/ebitmap.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/netlabel/netlabel_kapi.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/ipv4/cipso_ipv4.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/netport.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/hooks.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/sidtab.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/avc.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/core/skbuff.o
            ${{ runner.temp }}/stream-kernel-objects/objects/kernel/audit.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/lsm_audit.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/netlink/af_netlink.o
          if-no-files-found: warn
          retention-days: 3
