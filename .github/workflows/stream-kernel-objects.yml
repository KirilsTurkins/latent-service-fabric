name: Stream maintained kernel object check
on:
  push:
    branches: ['test/stream-kernel-objects-20261021', 'feat/stream-kernel-netlabel-consumer-20261021', 'feat/stream-kernel-netport-objects-20261021', 'feat/stream-kernel-audit-owner-20261021', 'feat/stream-kernel-avc-consumer-20261021', 'feat/stream-kernel-audit-skb-20261021']
    paths:
      - '.github/workflows/stream-kernel-objects.yml'
      - 'tools/qualify_host_stream_kernel_objects.py'
      - 'tools/host_stream_kernel_protocol.py'
      - 'tools/host_stream_kernel_netlabel.py'
      - 'tools/host_stream_kernel_netport.py'
      - 'tools/host_stream_kernel_sidcache.py'
      - 'tools/host_stream_kernel_avc.py'
      - 'tools/host_stream_kernel_audit_skb.py'
      - 'tools/host_stream_kernel_audit.py'
      - 'research/standard-outbound/linux-6.12-lineage/**'
  workflow_dispatch:
    inputs:
      netlabel:
        description: Compile the closed nested Netlabel source profile instead of original six objects
        type: boolean
        default: false
      netport:
        description: Compile the closed Netport cache profile instead of the original object profiles
        type: boolean
        default: false
      sidcache:
        description: Compile the closed SID-cache and audit-string source profile
        type: boolean
        default: false
      avc:
        description: Compile the closed AVC with SID-cache source profile
        type: boolean
        default: false
      audit:
        description: Compile the closed mandatory audit and SKB source profile
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stream-kernel-objects-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selected-objects:
    if: ${{ inputs.audit != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-audit-skb-20261021') && (inputs.avc != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-avc-consumer-20261021') && (inputs.sidcache != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-audit-owner-20261021') && (!(github.event_name == 'push' && (github.ref_name == 'feat/stream-kernel-netlabel-consumer-20261021' || github.ref_name == 'feat/stream-kernel-netport-objects-20261021')) && inputs.netlabel != true && inputs.netport != true))) }}
    name: Six actual maintained objects with private code and SELinux enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install the existing locked Python recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact config selection and private symbol oracles without a build
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_objects -v
      - name: Install only normal upstream Kbuild prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make flex bison bc libelf-dev libssl-dev
      - name: Acquire only the exact maintained official source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.113.tar.xz \
            --output "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          echo "e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428  $RUNNER_TEMP/linux-6.12.113.tar.xz" | sha256sum --check --strict
      - name: Derive actual source preserve security config and compile six unlinked objects
        run: >-
          python3 -B tools/qualify_host_stream_kernel_objects.py
          --archive "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          --output "$RUNNER_TEMP/stream-kernel-objects"
      - name: Retain bounded configuration compiler objects and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-kernel-objects-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-objects/qualification.json
            ${{ runner.temp }}/stream-kernel-objects/FAILED.json
            ${{ runner.temp }}/stream-kernel-objects/selection.json
            ${{ runner.temp }}/stream-kernel-objects/commands.json
            ${{ runner.temp }}/stream-kernel-objects/baseline.config
            ${{ runner.temp }}/stream-kernel-objects/selected.config
            ${{ runner.temp }}/stream-kernel-objects/commands/logs/*.txt
            ${{ runner.temp }}/stream-kernel-objects/objects/include/generated/autoconf.h
            ${{ runner.temp }}/stream-kernel-objects/objects/net/socket.o
            ${{ runner.temp }}/stream-kernel-objects/objects/fs/inode.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/core/sock.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/ipv4/af_inet.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/security.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/factory.o
          if-no-files-found: warn
          retention-days: 3
  netlabel-objects:
    if: ${{ inputs.audit != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-audit-skb-20261021') && (inputs.avc != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-avc-consumer-20261021') && (inputs.sidcache != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-audit-owner-20261021') && (inputs.netport != true && ((github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-netlabel-consumer-20261021') || inputs.netlabel == true)))) }}
    name: Twelve actual maintained objects with nested Netlabel owners and SELinux enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
