            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/ebitmap.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/netlabel/netlabel_kapi.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/ipv4/cipso_ipv4.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/netport.o
