            ${{ runner.temp }}/stream-kernel-objects/objects/net/core/sock.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/ipv4/af_inet.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/security.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/factory.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/netlabel.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/services.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/mls.o
            ${{ runner.temp }}/stream-kernel-objects/objects/security/selinux/ss/ebitmap.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/netlabel/netlabel_kapi.o
            ${{ runner.temp }}/stream-kernel-objects/objects/net/ipv4/cipso_ipv4.o
          if-no-files-found: warn
          retention-days: 3
  netport-objects:
    if: ${{ inputs.audit != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-audit-skb-20261021') && (inputs.avc != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-avc-consumer-20261021') && (inputs.sidcache != true && !(github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-audit-owner-20261021') && ((github.event_name == 'push' && github.ref_name == 'feat/stream-kernel-netport-objects-20261021') || inputs.netport == true))) }}
    name: Fourteen actual maintained objects with Netport cache owners and SELinux enabled
