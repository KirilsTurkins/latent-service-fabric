      - name: Check exact config selection and private symbol oracles without a build
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_objects tools.tests.test_host_stream_kernel_netlabel -v
      - name: Install only normal upstream Kbuild prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make flex bison bc libelf-dev libssl-dev
      - name: Acquire only the exact maintained official source archive
        shell: bash
        run: |
          set -euo pipefail
