name: Retained Rust ThreadPool WAC parser comparison
on:
  push:
    branches: ['diag/rust-wac-threading-20261104', 'diag/rust-wac-threading-fix-20261104', 'diag/rust-wac-alias-20261104']
    paths:
      - '.github/workflows/rust-wac-threading-probe.yml'
      - 'tools/diagnose_rust_wac_threading.py'
      - 'tools/tests/test_rust_wac_threading_probe.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: rust-wac-threading-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    name: Compare exact old and new parsers on retained original preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Check fixed event, member and observation boundaries
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_rust_wac_threading_probe -v
      - name: Acquire the fixed WAC 0.11.0 diagnostic tool
        run: |
          mkdir -p "$RUNNER_TEMP/rust-wac-threading"
          curl --fail --location --max-time 180 https://github.com/bytecodealliance/wac/releases/download/v0.11.0/wac-cli-x86_64-unknown-linux-musl --output "$RUNNER_TEMP/rust-wac-threading/wac-0.11.0"
          printf '%s  %s\n' 83259349b630f79a60490322b068e7ad2dba784720b0d467decccc0aecc743b5 "$RUNNER_TEMP/rust-wac-threading/wac-0.11.0" | sha256sum --check --strict
          test "$(stat --format=%s "$RUNNER_TEMP/rust-wac-threading/wac-0.11.0")" -eq 22917648
          chmod 0700 "$RUNNER_TEMP/rust-wac-threading/wac-0.11.0"
      - name: Compare the exact retained preview without rebuilding or guest execution
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: >-
          timeout --signal=TERM --kill-after=10s 600s python3 -B tools/diagnose_rust_wac_threading.py
          --new-wac "$RUNNER_TEMP/rust-wac-threading/wac-0.11.0"
          --output "$RUNNER_TEMP/rust-wac-threading/result" --expected-head "$EXPECTED_HEAD"
      - name: Retain bounded parser outcomes and public components
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wac-threading-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-wac-threading/result/*.json
            ${{ runner.temp }}/rust-wac-threading/result/logs/*.stdout.txt
            ${{ runner.temp }}/rust-wac-threading/result/logs/*.stderr.txt
            ${{ runner.temp }}/rust-wac-threading/result/preview.wasm
            ${{ runner.temp }}/rust-wac-threading/result/new.wasm
            ${{ runner.temp }}/rust-wac-threading/result/identity.wac
          if-no-files-found: warn
          retention-days: 3
