name: Rust ordinary WASI HTTP signed runtime

on:
  push:
    branches: ['feat/rust-wasi-http-signed-20261021']
    paths: ['.github/workflows/rust-wasi-http-clients.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-wasi-http-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-clients:
    name: One fresh captured guest and original finite two-client programme
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Prepare the normal captured compiler sandbox and pinned binding tool only
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/rust-http-tools"
          echo "$RUNNER_TEMP/rust-http-tools" >> "$GITHUB_PATH"
      - name: Fetch the exact historical native producer source without a host build
        run: git fetch --no-tags --depth=1 origin 6fd19eab2c224fc31481d03de5008de4d3e4429e
      - name: Check actual-source capture and refusal oracles without compiling a guest
        run: python3 -B -m unittest tools.tests.test_rust_wasi_http_runtime_fixture tools.tests.test_rust_wasi_http_runtime -q
      - name: Restore the exact successful standard backend without recompilation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-wasi-http-backend-a6ec444c8cafe7380f6ae0e08016446ef80a6aba
          run-id: '39524005962'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-http-backend-origin
      - name: Authenticate the original five products without building another host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/rust-http-native"
      - name: Compile one ordinary captured guest then sign and execute all strict cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_rust_wasi_http_runtime.py
          --native-products "$RUNNER_TEMP/rust-http-native"
          --http-runtime "$RUNNER_TEMP/rust-http-backend-origin/rust-http-runtime"
          --output "$RUNNER_TEMP/rust-http-runtime-qualification"
      - name: Retain bounded public source build invocation and cleanup observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-wasi-http-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-runtime-qualification/qualification.json
            ${{ runner.temp }}/rust-http-runtime-qualification/FAILED.json
            ${{ runner.temp }}/rust-http-runtime-qualification/current-build.json
            ${{ runner.temp }}/rust-http-runtime-qualification/capture.json
            ${{ runner.temp }}/rust-http-runtime-qualification/source/candidate.json
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/Cargo.toml
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/Cargo.lock
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/latent.dependencies*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/source/application/cargo-resolved.lock.json
            ${{ runner.temp }}/rust-http-runtime-qualification/approval-required/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/approval-required/logs/**
            ${{ runner.temp }}/rust-http-runtime-qualification/build/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/build/*.wasm
            ${{ runner.temp }}/rust-http-runtime-qualification/build/logs/**
            ${{ runner.temp }}/rust-http-runtime-qualification/node/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/examples-controls/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/foreign-controls/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/provider-absence/*.json
            ${{ runner.temp }}/rust-http-runtime-qualification/node/provider-absence/controls/*.json
            ${{ runner.temp }}/rust-http-native/*.json
          if-no-files-found: warn
          retention-days: 3
