name: PR 2151 verified security integration
on:
  push:
    branches: [diagnostic/pr2151-integration-fanout-20261121]
    paths: [.github/workflows/pr2151-verified-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      LSF_PYTHON_POLICY_BASE: ce32c865a7f0870b488ea9d8651fddd68adbd1a4
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: Retain reviewed integration scripts outside the exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          git fetch --no-tags --depth=1 origin 380273dde76c1f401f356ac8276c0ee2e6414ceb
          python3 - <<'PY'
          import os,subprocess,yaml
          from pathlib import Path
          model=yaml.safe_load(subprocess.check_output(['git','show','380273dde76c1f401f356ac8276c0ee2e6414ceb:.github/workflows/pr2151-security-integration.yml']))
          names={'construct':'Integrate exact heads and preserve the Java regression superset','validate':'Validate combined source controls with pinned JDK','publish':'Publish only the validated exact-parent candidate on an isolated ref'}
          for key,name in names.items():
              scripts=[s['run'] for s in model['jobs']['integration']['steps'] if s.get('name')==name]
              assert len(scripts)==1
              script=scripts[0]
              if key=='construct':
                  old="git('checkout','--detach',commit)"
                  assert script.count(old)==1
                  script=script.replace(old,"git('checkout','--detach','--force',commit)\n"+"git('diff','--exit-code')")
              Path(os.environ['RUNNER_TEMP'],'pr2151-'+key+'.sh').write_text(script)
          PY
      - name: Materialize and authenticate the complete resolved integration worktree
        run: bash -euo pipefail "$RUNNER_TEMP/pr2151-construct.sh"
      - name: Run all reviewed validations on the clean integrated worktree
        run: bash -euo pipefail "$RUNNER_TEMP/pr2151-validate.sh"
      - name: Publish only the validated candidate on its isolated ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -euo pipefail "$RUNNER_TEMP/pr2151-publish.sh"
      - name: Retain input custody and full validation output
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-integration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr2151-merge-tree.txt
            ${{ runner.temp }}/pr2151-integrated-commit.txt
            ${{ runner.temp }}/pr2151-integration.json
            ${{ runner.temp }}/pr2151-whitespace.log
            ${{ runner.temp }}/pr2151-focused.log
            ${{ runner.temp }}/pr2151-sdk.log
            ${{ runner.temp }}/pr2151-repository.log
            ${{ runner.temp }}/pr2151-inventory.json
          retention-days: 7
          if-no-files-found: error
