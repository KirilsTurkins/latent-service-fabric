name: Focused canonical IP formatting
on:
  push:
    branches: ['feat/sdk-736-http-ip-format-20261027', 'feat/sdk-745-lift-result-memory-20261028', 'test/sdk-738-node-bootstrap-custody-20261028', 'test/sdk-738-node-capacity-facts-20261029', 'feat/sdk-736-call-parameter-closure-memory-20261028', 'feat/sdk-736-resource-table-memory-20261028', 'feat/sdk-736-call-result-channel-memory-20261028', 'feat/sdk-736-callback-memory-20261028', 'test/sdk-736-host-memory-baseline-20261029']
    paths:
      - '.github/workflows/canonical-stream-outers.yml'
      - 'crates/latent-capabilities/**'
      - 'crates/latent-http/**'
      - 'crates/latent-policy/**'
      - 'crates/latent-blobs/**'
      - 'crates/latent-streams/**'
      - 'crates/latent-wasmtime/**'
      - 'crates/vendor/wasmtime/**'
      - 'apps/latentd/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/toolchain.toml'
      - 'tools/qualify_stream_outers.py'
      - 'tools/host_codec_wasmtime.py'
      - 'tools/ci/suites.json'
permissions:
  contents: read
concurrency:
  group: canonical-stream-outers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stream-outers:
    name: Four canonical IP formatting controls
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.ref_name == 'feat/sdk-745-lift-result-memory-20261028' || github.ref_name == 'feat/sdk-736-call-parameter-closure-memory-20261028' || github.ref_name == 'feat/sdk-736-resource-table-memory-20261028' || github.ref_name == 'feat/sdk-736-call-result-channel-memory-20261028' || github.ref_name == 'feat/sdk-736-callback-memory-20261028' || github.ref_name == 'test/sdk-736-host-memory-baseline-20261029') && 25 || 45 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v3-contract-profiles
          shared-key: host-contracts
          key: ubuntu-24.04
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/wasm32-wasip2
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Build two exact lib targets and execute four canonical IP controls
        if: github.ref_name == 'feat/sdk-736-http-ip-format-20261027'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --http-ip-format
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build one exact vendor lib and execute four LiftResult controls
        if: github.ref_name == 'feat/sdk-745-lift-result-memory-20261028'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --lift-result-memory
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build two exact lib targets and execute four Node custody controls
        if: (github.ref_name == 'test/sdk-738-node-bootstrap-custody-20261028' || github.ref_name == 'test/sdk-738-node-capacity-facts-20261029')
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --node-bootstrap
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build one exact vendor lib and execute four parameter and closure controls
        if: github.ref_name == 'feat/sdk-736-call-parameter-closure-memory-20261028'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --call-parameter-closure-memory
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build one exact vendor lib and execute four resource backing controls
        if: github.ref_name == 'feat/sdk-736-resource-table-memory-20261028'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --resource-table-memory
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build one exact vendor lib and execute four call-result header controls
        if: github.ref_name == 'feat/sdk-736-call-result-channel-memory-20261028'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --call-result-channel-memory
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build one exact vendor lib and execute four borrowed callback controls
        if: github.ref_name == 'feat/sdk-736-callback-memory-20261028'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --callback-memory
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Build one actual host lib and execute eleven memory lifetime controls
        if: github.ref_name == 'test/sdk-736-host-memory-baseline-20261029'
        run: >-
          python3 -B tools/qualify_stream_outers.py
          --source-commit "${{ github.sha }}"
          --host-memory-baseline
          --output "$RUNNER_TEMP/canonical-stream-outers"
      - name: Retain four source-bound canonical IP outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: ${{ github.ref_name == 'test/sdk-736-host-memory-baseline-20261029' && 'host-memory-baseline' || github.ref_name == 'feat/sdk-736-callback-memory-20261028' && 'callback-memory' || github.ref_name == 'feat/sdk-736-call-result-channel-memory-20261028' && 'call-result-channel-memory' || github.ref_name == 'feat/sdk-736-resource-table-memory-20261028' && 'resource-table-memory' || github.ref_name == 'feat/sdk-736-call-parameter-closure-memory-20261028' && 'call-parameter-closure-memory' || (github.ref_name == 'test/sdk-738-node-bootstrap-custody-20261028' || github.ref_name == 'test/sdk-738-node-capacity-facts-20261029') && 'node-bootstrap-custody' || github.ref_name == 'feat/sdk-745-lift-result-memory-20261028' && 'canonical-lift-result' || 'canonical-ip-format' }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/canonical-stream-outers/receipt.json
            ${{ runner.temp }}/canonical-stream-outers/FAILED.json
            ${{ runner.temp }}/canonical-stream-outers/source-inputs.json
            ${{ runner.temp }}/canonical-stream-outers/commands.json
            ${{ runner.temp }}/canonical-stream-outers/commands/logs/*.txt
          if-no-files-found: warn
          retention-days: 3
