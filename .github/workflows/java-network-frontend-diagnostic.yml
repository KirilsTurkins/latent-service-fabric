name: Java owned network input C frontend diagnostic
on:
  push:
    branches: ['diag/java-network-c-frontend-20261105']
permissions:
  contents: read
concurrency:
  group: java-network-c-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  c-frontend:
    name: Capture the fixed SDK callback from the pinned C frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@5d910981b146bc2d4fd97fa349210f3e3d454039 # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: Emit the original and corrected compiler callback text
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/qualify_java_network_frontend.py --output "$RUNNER_TEMP/java-network-frontend"
      - name: Retain only bounded fixed SDK compiler observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-network-frontend-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/java-network-frontend/result.json
            ${{ runner.temp }}/java-network-frontend/commands.json
            ${{ runner.temp }}/java-network-frontend/commands/logs/**
            ${{ runner.temp }}/java-network-frontend/*-owned-callback.c
