name: Execute ordinary Go SMTP and guest STARTTLS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Go runtime profile
        type: choice
        required: true
        default: v5
        options: [v5, v7]
      program:
        description: SMTP workload
        type: choice
        required: true
        default: standard
        options: [standard, published]
  push:
    branches: ['feat/go-smtp-starttls-20261020', 'feat/go-smtp-v7-20261110', 'feat/go-published-smtp-v7-20261110']

permissions:
  contents: read

concurrency:
  group: go-smtp-tls-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Actual ordinary SMTP and verified guest TLS over declared TCP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Install captured Go compiler namespace for published client
        if: ${{ github.ref_name == 'feat/go-published-smtp-v7-20261110' || (github.event_name == 'workflow_dispatch' && inputs.program == 'published') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check exact input ownership cancellation and fail-closed selection
        run: python3 -m unittest tools.tests.test_go_smtp_tls_runtime tools.tests.test_go_network_runtime -v
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: true
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Authenticate the maintained compiler and official generator
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-smtp-tls-tools"
          test ! -e "$out"
          mkdir "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/go.tar.gz" -C "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/componentize-go.tar.gz" https://github.com/bytecodealliance/componentize-go/releases/download/v0.4.3/componentize-go-linux-amd64.tar.gz
          echo "1061d845f550df5d9477612a7d458a31b1e2b8bdc95823704e42e5064deb0c52  $out/componentize-go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/componentize-go.tar.gz" -C "$out" componentize-go
          echo "b41803a645e54845bc8eacef9a69e0eeb8c2c4a9a61964c831ed544e85c137cb  $out/componentize-go" | sha256sum --check --strict
          chmod 755 "$out/componentize-go"
          test "$("$out/componentize-go" --version)" = 'componentize-go 0.4.3'
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          python3 tools/go_guest/runtime.py --prepare-compiler "$out/go" --output "$out/go-async"
          echo "$out" >> "$GITHUB_PATH"
          echo "$out/go-async/bin" >> "$GITHUB_PATH"
      - name: Compile ordinary SMTP guest TLS then execute one targeted signed harness
        env:
          LSF_GO_SMTP_TLS_DISPATCH_PROFILE: ${{ inputs.profile }}
          LSF_GO_SMTP_TLS_DISPATCH_PROGRAM: ${{ inputs.program }}
        run: python3 tools/qualify_go_smtp_tls_runtime.py --reference-go "$RUNNER_TEMP/go-smtp-tls-tools/go/bin/go" --source-commit "${{ github.sha }}" --output "$RUNNER_TEMP/go-smtp-tls-runtime" --workflow-selection
      - name: Retain bounded compiler and owner evidence including failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-smtp-tls-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-smtp-tls-runtime/*.json
            ${{ runner.temp }}/go-smtp-tls-runtime/*.log
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/GO-SMTP-TLS-COMPILE.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/GO-SMTP-PUBLISHED-COMPILE.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/PUBLISHED-FAILED.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/project/go.mod
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/project/go.sum
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/project/go-resolved.lock.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/project/latent.dependencies.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/project/latent.dependencies.lock.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/project/dependency-inputs/objects/**
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/authoring/*.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/authoring/logs/**
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/go-runtime-transformations.json
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/logs/**
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/build/component.wasm
            ${{ runner.temp }}/go-smtp-tls-runtime/fixture/build/component.wit
          if-no-files-found: warn
          retention-days: 7
