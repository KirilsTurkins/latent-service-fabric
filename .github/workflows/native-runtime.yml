name: Native runtime candidate

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/native-runtime.yml
      - packaging/linux/**
      - tools/native_runtime/**
      - tools/native_runtime_build.py
      - tools/build_native_runtime.py
      - tools/tests/test_native_runtime.py
      - tools/run_native_vm.py
      - tools/native_vm_guest.py
      - tools/native-vm-profile.json

permissions:
  contents: read

concurrency:
  group: native-runtime-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Unsigned native Linux candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Select maintained CI profile
        run: python3 tools/ci_profile.py
      - name: Install pinned validation requirements
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Fast native artifact and installer safety checks
        run: |
          python3 -m unittest tools.tests.test_native_runtime
          python3 tools/validate_workflow_actions.py
          python3 tools/validate_docs.py
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: lsf-native-dependencies-v1
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/native-build/x86_64-unknown-linux-gnu/release/.fingerprint
            target/native-build/x86_64-unknown-linux-gnu/release/build
            target/native-build/x86_64-unknown-linux-gnu/release/deps
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Build exact-source unsigned candidate
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 tools/build_native_runtime.py --commit "$GITHUB_SHA" --version "$version" --output "$PWD/target/native-release"
      - name: Retain unsigned candidate, not a published release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-runtime-unsigned-${{ github.sha }}
          path: target/native-release/
          if-no-files-found: error
          retention-days: 14
