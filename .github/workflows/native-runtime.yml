name: Native runtime candidate

on:
  workflow_dispatch:
    inputs:
      development_test_node:
        description: Build a nonpublishing disposable-test runtime with explicit guest fixtures
        type: boolean
        default: false
      artifact_run:
        description: Optional prior native candidate run for VM-only diagnostics, never release authority
        type: string
        default: ""
  push:
    branches: ["**"]
    paths:
      - .github/workflows/native-runtime.yml
      - packaging/linux/**
      - tools/native_runtime/**
      - tools/native_runtime_build.py
      - tools/build_native_runtime.py
      - tools/tests/test_native_runtime.py
      - tools/run_native_vm.py
      - tools/native_vm_guest.py
      - tools/native-vm-profile.json
      - tools/native-fixture/**
      - tools/prepare_native_workspace.py
      - tools/native_release_gate.py
      - tools/tests/test_native_release_gate.py
      - tools/select_native_vm_artifact.py

permissions:
  contents: read

concurrency:
  group: native-runtime-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run == ''
    name: Exact-source native Linux candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare private exact-source host workspace without changing runner ACLs
        run: python3 tools/prepare_native_workspace.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Select maintained CI profile
        run: python3 tools/ci_profile.py
      - name: Install pinned validation requirements
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Fast native artifact and installer safety checks
        run: |
          python3 -m unittest tools.tests.test_native_runtime tools.tests.test_native_release_gate
          python3 tools/validate_workflow_actions.py
          python3 tools/validate_docs.py
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-native-dependencies-v1
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/native-build/x86_64-unknown-linux-gnu/release/.fingerprint
            target/native-build/x86_64-unknown-linux-gnu/release/build
            target/native-build/x86_64-unknown-linux-gnu/release/deps
          save-if: ${{ github.ref == 'refs/heads/development' }}
      - name: Select exact source version
        id: identity
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build exact-source unsigned candidate
        env:
          NATIVE_VERSION: ${{ steps.identity.outputs.version }}
          DEVELOPMENT_TEST_NODE: ${{ inputs.development_test_node || false }}
        run: |
          cd "$NATIVE_WORKSPACE"
          version="$NATIVE_VERSION"
          fixture_args=()
          if [ "$DEVELOPMENT_TEST_NODE" = true ]; then fixture_args=(--development-test-node); fi
          python3 tools/build_native_runtime.py --commit "$GITHUB_SHA" --version "$version" --output "$PWD/target/native-release" "${fixture_args[@]}"
      - name: Build separately authenticated public-only VM fixture helper
        run: |
          cd "$NATIVE_WORKSPACE"
          cargo +1.97.1 fmt --manifest-path tools/native-fixture/Cargo.toml -- --check
          cargo +1.97.1 build --locked --release --manifest-path tools/native-fixture/Cargo.toml \
            --target x86_64-unknown-linux-gnu --target-dir target/native-fixture-build --jobs 2
          install -D -m 0755 target/native-fixture-build/x86_64-unknown-linux-gnu/release/latent-native-vm-fixture target/native-test-tools/fixture-helper
      - name: Attest candidate checksum inventory, not release authority
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.NATIVE_WORKSPACE }}/target/native-release/SHA256SUMS
            ${{ env.NATIVE_WORKSPACE }}/target/native-test-tools/fixture-helper
      - name: Retain offline attestation material
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: install -m 0644 "$ATTESTATION_BUNDLE" "$NATIVE_WORKSPACE/target/native-release/SHA256SUMS.sigstore.json"
      - name: Retain authenticated candidate, not a published release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-candidate${{ inputs.development_test_node && '-development-test' || '' }}-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-release/
          if-no-files-found: error
          retention-days: 14
      - name: Retain test tooling separately from the runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-test-tools-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-test-tools/
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded build failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-build-failure-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-build-failure.*
          if-no-files-found: ignore
          retention-days: 7
  native-vm:
    name: Native VM (${{ matrix.profile }})
    if: ${{ !cancelled() && !inputs.development_test_node && (needs.candidate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run != '')) }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [local-experimental-v1, external-capsule-v1]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare private exact-source host workspace without changing runner ACLs
        run: python3 tools/prepare_native_workspace.py
      - name: Select exact real candidate artifact, independent of test-harness revision
        env:
          GH_TOKEN: ${{ github.token }}
          VM_ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: python3 tools/select_native_vm_artifact.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-runtime-candidate-${{ env.NATIVE_ARTIFACT_COMMIT }}
          run-id: ${{ env.NATIVE_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-runtime-test-tools-${{ env.NATIVE_ARTIFACT_COMMIT }}
          run-id: ${{ env.NATIVE_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-test-tools
      - name: Provision host QEMU and independent verification trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client
          if test -c /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          gh --version
          gh attestation trusted-root > "$NATIVE_TRUST/trusted_root.jsonl"
      - name: Boot clean native guest, invoke, reboot, retain and purge
        env:
          NATIVE_PROFILE: ${{ matrix.profile }}
        run: |
          cd "$NATIVE_WORKSPACE"
          python3 tools/run_native_vm.py --release-directory "$PWD/target/native-candidate" \
            --trusted-root "$NATIVE_TRUST/trusted_root.jsonl" --verifier "$(readlink -f "$(command -v gh)")" \
            --version "$NATIVE_VERSION" --commit "$NATIVE_ARTIFACT_COMMIT" --source-ref "$NATIVE_ARTIFACT_REF" \
            --purpose candidate --profile "$NATIVE_PROFILE" --fixture-helper "$PWD/target/native-test-tools/fixture-helper" \
            --output "$PWD/target/native-vm/$NATIVE_PROFILE.json"
      - name: Retain compact redacted real VM evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-runtime-vm-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ env.NATIVE_WORKSPACE }}/target/native-vm/*.json
          if-no-files-found: error
          retention-days: 14
