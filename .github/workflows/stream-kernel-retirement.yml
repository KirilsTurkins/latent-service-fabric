name: Stream maintained factory retirement object check
on:
  push:
    branches: ['feat/stream-kernel-recipient-retirement-20261022']
    paths:
      - '.github/workflows/stream-kernel-retirement.yml'
      - 'tools/qualify_host_stream_kernel_retirement.py'
      - 'tools/host_stream_kernel_device_retirement.py'
      - 'tools/tests/fixtures/host_stream_kernel_device_retirement.json'
      - 'tools/tests/test_host_stream_kernel_device_retirement.py'
      - 'tools/tests/test_host_stream_kernel_retirement.py'
permissions:
  contents: read
concurrency:
  group: stream-kernel-retirement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  factory-object:
    name: One actual maintained factory object with final-return source changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install the existing locked Python recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check final-return source and fixed one-object configuration guards
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_device_retirement tools.tests.test_host_stream_kernel_retirement -v
      - name: Install only normal upstream Kbuild prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make flex bison bc libelf-dev libssl-dev
      - name: Acquire only the exact maintained official source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.113.tar.xz \
            --output "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          echo "e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428  $RUNNER_TEMP/linux-6.12.113.tar.xz" | sha256sum --check --strict
      - name: Derive original source preserve security config and compile only the changed factory object
        run: >-
          python3 -B tools/qualify_host_stream_kernel_retirement.py
          --archive "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          --output "$RUNNER_TEMP/stream-kernel-retirement"
      - name: Retain bounded configuration compiler object and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-kernel-retirement-object-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-retirement/qualification.json
            ${{ runner.temp }}/stream-kernel-retirement/FAILED.json
            ${{ runner.temp }}/stream-kernel-retirement/selection.json
            ${{ runner.temp }}/stream-kernel-retirement/commands.json
            ${{ runner.temp }}/stream-kernel-retirement/baseline.config
            ${{ runner.temp }}/stream-kernel-retirement/selected.config
            ${{ runner.temp }}/stream-kernel-retirement/commands/logs/*.txt
            ${{ runner.temp }}/stream-kernel-retirement/objects/include/generated/autoconf.h
            ${{ runner.temp }}/stream-kernel-retirement/objects/net/factory.o
          if-no-files-found: warn
          retention-days: 3
