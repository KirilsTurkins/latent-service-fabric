name: CLI registry qualification

on:
  pull_request:
    paths:
      - '.github/workflows/registry-cli.yml'
      - 'apps/latent/src/package/**'
      - 'crates/latent-oci/**'
      - 'tools/harbor_registry/**'
      - 'tools/run_harbor_registry_tests.py'
      - 'tools/static-release/**'
      - 'schemas/cli-registry-profile.schema.json'
  push:
    branches: [development]
    paths:
      - '.github/workflows/registry-cli.yml'
      - 'apps/latent/src/package/**'
      - 'crates/latent-oci/**'
      - 'tools/harbor_registry/**'
      - 'tools/run_harbor_registry_tests.py'
      - 'tools/static-release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harbor:
    name: Real Harbor CLI authentication and package evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@34275fdec80b5be172c3327cadef76aa2f3b31c6 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - name: Build the exact CLI and check owned registry guards
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -m unittest tools.tests.test_harbor_registry_runner
          cargo build --locked --package latent --bin latent
      - name: Qualify the CLI against real Harbor
        run: |
          umask 077
          python3 tools/run_harbor_registry_tests.py --network --cli target/debug/latent --output "$RUNNER_TEMP/harbor-cli.json"
      - name: Retain sanitized registry qualification
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: harbor-cli-qualification
          path: ${{ runner.temp }}/harbor-cli.json
          if-no-files-found: warn
          retention-days: 14
