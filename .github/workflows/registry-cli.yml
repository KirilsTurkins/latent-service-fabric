name: CLI registry qualification

on:
  pull_request:
    paths:
      - '.github/workflows/registry-cli.yml'
      - 'apps/latent/src/package/**'
      - 'crates/latent-oci/**'
      - 'tools/harbor_registry/**'
      - 'tools/run_harbor_registry_tests.py'
      - 'tools/static-release/**'
      - 'schemas/cli-registry-profile.schema.json'
  push:
    branches: [development]
    paths:
      - '.github/workflows/registry-cli.yml'
      - 'apps/latent/src/package/**'
      - 'crates/latent-oci/**'
      - 'tools/harbor_registry/**'
      - 'tools/run_harbor_registry_tests.py'
      - 'tools/static-release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harbor:
    name: Real Harbor CLI authentication and package evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Build the exact CLI and check owned registry guards
        run: |
          python3 -m pip install --require-hashes --requirement tools/requirements.lock
          python3 -m unittest tools.tests.test_harbor_registry_runner
          cargo build --locked --package latent --bin latent
      - name: Qualify the CLI against real Harbor
        run: |
          umask 077
          python3 tools/run_harbor_registry_tests.py --network --cli target/debug/latent --output "$RUNNER_TEMP/harbor-cli.json"
      - name: Retain sanitized registry qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harbor-cli-qualification
          path: ${{ runner.temp }}/harbor-cli.json
          if-no-files-found: warn
          retention-days: 14
