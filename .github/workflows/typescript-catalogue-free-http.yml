name: TypeScript catalogue-free normal HTTP build
on:
  push:
    branches: ['feat/typescript-catalogue-free-http-20261020']
    paths:
      - '.github/workflows/typescript-catalogue-free-http.yml'
      - 'tools/typescript_catalogue_free_build.py'
      - 'tools/qualify_typescript_catalogue_free.py'
      - 'tools/tests/test_typescript_catalogue_free.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-catalogue-free-http-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalogue-free:
    name: Catalogue-free normal build and three signed default clients
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - name: Fetch the immutable native producer source object
        run: git fetch --no-tags --depth=1 origin 8f7780dd0a35e3375524d72e7dfaddf847deaa5c
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check complete isolated build closure and real peer controls
        run: python3 -B -m unittest tools.tests.test_typescript_catalogue_free tools.tests.test_http_tenant_native_products -v
      - name: Install the normal compiler namespace boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/catalogue-free-tools"
      - name: Acquire only the authenticated existing source-bound engine and splicer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_resource_runtime_inputs.py --output "$RUNNER_TEMP/catalogue-free-engine"
      - name: Acquire the exact operational HTTP authority native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/http_tenant_native_products.py --output "$RUNNER_TEMP/catalogue-free-native"
      - name: Capture and build without catalogue data then sign three ordinary clients
        run: |
          python3 -B tools/qualify_typescript_catalogue_free.py \
            --acquired "$RUNNER_TEMP/catalogue-free-engine" --native "$RUNNER_TEMP/catalogue-free-native" \
            --tools "$RUNNER_TEMP/catalogue-free-tools" --output "$RUNNER_TEMP/catalogue-free-http"
      - name: Retain exact staged source inventory normal construction and real signed outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-catalogue-free-http-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/catalogue-free-native/*.json
            ${{ runner.temp }}/catalogue-free-engine/acquisition.json
            ${{ runner.temp }}/catalogue-free-http/*.json
            ${{ runner.temp }}/catalogue-free-http/*.log
            ${{ runner.temp }}/catalogue-free-http/catalogue-free-build-source/BUILD-SOURCE-INVENTORY.json
            ${{ runner.temp }}/catalogue-free-http/build/*.json
            ${{ runner.temp }}/catalogue-free-http/build/*.wit
            ${{ runner.temp }}/catalogue-free-http/build/component.wasm
            ${{ runner.temp }}/catalogue-free-http/build/package/**
            ${{ runner.temp }}/catalogue-free-http/build/logs/**
            ${{ runner.temp }}/catalogue-free-http/node/*.json
            ${{ runner.temp }}/catalogue-free-http/node/*.log
            ${{ runner.temp }}/catalogue-free-http/node/controls/**
