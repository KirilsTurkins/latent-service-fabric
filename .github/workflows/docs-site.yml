name: Documentation website validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  website:
    name: Static site, examples and browser journeys
    runs-on: ubuntu-24.04
    # Keep diagnostic headroom for cold installations; all checks remain required.
    # Duration is measured from job timestamps rather than enforced by truncation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install the reviewed website dependency graph without lifecycle scripts
        run: |
          python3 -m unittest discover -s website/toolchain/tests -v
          python3 website/toolchain/prepare.py
          npm ci --prefix website/toolchain --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/website/toolchain/node_modules/.bin" >> "$GITHUB_PATH"
          node website/toolchain/node_modules/npm/bin/npm-cli.js ci --prefix website --ignore-scripts --no-audit --no-fund
      - name: Verify the selected package manager identity
        run: |
          test "$(npm --version)" = '11.19.1'
          node website/scripts/check-package-manager.mjs
      - name: Check metadata, source extraction, types and unit regressions
        working-directory: website
        run: |
          npm run check
          npm test
      - name: Build both supported static base paths
        working-directory: website
        run: |
          npm run build
          npm run build:root
      - name: Install the pinned test browser and its OS prerequisites
        working-directory: website
        run: |
          node node_modules/playwright/cli.js install-deps chromium
          npm run browser:install
      - name: Verify production pages, theme and source-backed controls
        working-directory: website
        run: |
          # The isolated two-version build owns separate outputs. Overlap it
          # with the production browser journeys, with at most two suites active.
          npm run test:versions &
          versions_pid=$!
          status=0
          npm run test:build || status=$?
          npm run test:theme || status=$?
          npm run test:examples || status=$?
          npm run test:discovery || status=$?
          wait "$versions_pid" || status=$?
          exit "$status"
      - name: Retain only the tested site and compact browser receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            website/build/project/
            website/.generated/build-evidence.json
            website/.generated/theme-review/evidence.json
            website/.generated/code-example-review/evidence.json
            website/.generated/version-review/evidence.json
            website/.generated/discovery-review/evidence.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
