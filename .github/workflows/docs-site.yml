name: Documentation website validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  website:
    name: Static site, examples and browser journeys
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    # Keep diagnostic headroom for cold installations; all checks remain required.
    # Duration is measured from job timestamps rather than enforced by truncation.
    timeout-minutes: 40
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - name: Trust only the checked-out repository inside the owned container
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create a private native compiler cache inside the owned container
        run: |
          native_cache=$(mktemp -d /tmp/lsf-swc-native.XXXXXX)
          printf 'SWC_NATIVE_BINDING_CACHE=%s\n' "$native_cache" >> "$GITHUB_ENV"
      - uses: KirilsTurkins/lsf-setup-node@c1136b2d97fe79ef645e9508b2048a222f50a170 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install the reviewed website dependency graph without lifecycle scripts
        run: |
          python3 -m unittest discover -s website/toolchain/tests -v
          python3 website/toolchain/prepare.py
          npm ci --prefix website/toolchain --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/website/toolchain/node_modules/.bin" >> "$GITHUB_PATH"
          node website/toolchain/node_modules/npm/bin/npm-cli.js ci --prefix website --ignore-scripts --no-audit --no-fund
      - name: Verify the selected package manager identity
        run: |
          test "$(npm --version)" = '11.19.1'
          node website/scripts/check-package-manager.mjs
      - name: Check metadata, source extraction, types and unit regressions
        working-directory: website
        run: |
          npm run check
          npm test
      - name: Build both supported static base paths
        working-directory: website
        run: |
          npm run build
          npm run build:root
      - name: Install the pinned test browser and its OS prerequisites
        working-directory: website
        # The matching pinned Noble image already contains the system libraries
        # and fonts. Keep the project's exact browser installation and all tests.
        run: npm run browser:install
      - name: Verify production pages, theme and source-backed controls
        working-directory: website
        run: |
          # Keep the long discovery audit away from the synthetic version build.
          # Both waves retain every suite and its original process deadline.
          npm run test:discovery &
          discovery_pid=$!
          npm run test:build &
          build_pid=$!
          status=0
          wait "$build_pid" || status=$?
          wait "$discovery_pid" || status=$?
          npm run test:versions &
          versions_pid=$!
          npm run test:theme &
          theme_pid=$!
          npm run test:examples &
          examples_pid=$!
          wait "$theme_pid" || status=$?
          wait "$examples_pid" || status=$?
          wait "$versions_pid" || status=$?
          exit "$status"
      - name: Retain only the tested site and compact browser receipts
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: docs-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            website/build/project/
            website/.generated/build-evidence.json
            website/.generated/theme-review/evidence.json
            website/.generated/code-example-review/evidence.json
            website/.generated/version-review/evidence.json
            website/.generated/discovery-review/evidence.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
