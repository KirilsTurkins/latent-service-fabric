name: Current stream kernel owner reference

on:
  workflow_dispatch: {}
  push:
    branches: ['feat/host-stream-kernel-tail-20261020', 'feat/host-stream-kernel-retirement-20261020']

permissions:
  contents: read

concurrency:
  group: host-stream-kernel-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Actual original-owner retention through kernel close tails
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: true
      - name: Reject invented retirement, private fields and partial evidence
        run: python3 -m unittest tools.tests.test_host_stream_kernel_observer tools.tests.test_host_stream_kernel_reference tools.tests.test_host_stream_tls_provider_reference -v
      - name: Observe one real provider pressure and kernel tail under original allowances
        run: python3 tools/qualify_host_stream_kernel.py --source-commit "${{ github.sha }}" --output "$RUNNER_TEMP/host-stream-kernel-reference"
      - name: Retain bounded numeric observations and exact source identities
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: host-stream-kernel-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/host-stream-kernel-reference/receipt.json
            ${{ runner.temp }}/host-stream-kernel-reference/cargo.stderr.log
            ${{ runner.temp }}/host-stream-kernel-reference/cargo-diagnostics.json
            ${{ runner.temp }}/host-stream-kernel-reference/tests.stdout.log
            ${{ runner.temp }}/host-stream-kernel-reference/tests.stderr.log
            ${{ runner.temp }}/host-stream-kernel-reference/list.stdout.log
            ${{ runner.temp }}/host-stream-kernel-reference/ignored.stdout.log
          if-no-files-found: warn
          retention-days: 7
