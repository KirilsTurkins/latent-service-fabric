name: Stream retained paid constructor source programme
on:
  workflow_dispatch:
  push:
    branches: ['feat/stream-kernel-cleanup-constructor-cancel-20261023']
    paths:
      - '.github/workflows/stream-kernel-cleanup-constructor.yml'
      - 'tools/qualify_host_stream_kernel_cleanup_constructor.py'
      - 'tools/host_stream_kernel_cleanup_constructor_*.py'
      - 'tools/tests/test_host_stream_kernel_cleanup_constructor_*.py'
      - 'tools/tests/fixtures/host_stream_kernel_cleanup_constructor_wait.json'
      - 'research/standard-outbound/linux-6.12-lineage/*cleanup-provider-constructor.c'
      - 'research/standard-outbound/linux-6.12-lineage/cleanup-constructor-wait-source-freeze-r1.json'
permissions:
  contents: read
concurrency:
  group: stream-kernel-cleanup-constructor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanup-constructor:
    name: Four actual defining objects and paid constructor layout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install existing locked recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check retained constructor source controls
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_cleanup_constructor_wait
          tools.tests.test_host_stream_kernel_cleanup_constructor_programme -v
      - name: Install normal upstream object prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make flex bison bc libelf-dev libssl-dev binutils
      - name: Acquire exact official maintained source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.113.tar.xz \
            --output "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          echo "e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428  $RUNNER_TEMP/linux-6.12.113.tar.xz" | sha256sum --check --strict
      - name: Run one finite four-object geometry programme
        run: >-
          python3 -B tools/qualify_host_stream_kernel_cleanup_constructor.py
          --archive "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          --output "$RUNNER_TEMP/stream-kernel-cleanup-constructor"
      - name: Retain bounded actual measurements and failure evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-kernel-cleanup-constructor-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/qualification.json
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/FAILED.json
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/selection.json
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/commands.json
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/baseline.config
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/selected.config
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/source-fixture.config
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/geometry/*.bin
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/commands/logs/*.txt
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/objects/include/generated/autoconf.h
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/objects/net/factory.o
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/objects/kernel/kthread.o
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/objects/kernel/workqueue.o
            ${{ runner.temp }}/stream-kernel-cleanup-constructor/objects/drivers/acpi/osl.o
          if-no-files-found: warn
          retention-days: 3
