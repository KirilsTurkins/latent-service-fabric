name: Go bounded write progress reference

on:
  workflow_dispatch:
  push:
    branches: ['feat/go-stream-write-progress-20261020']

permissions:
  contents: read

concurrency:
  group: go-write-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Exact production Write two old counterexamples and nine bounded controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact projection and strict counterexample reader
        run: python3 -m unittest tools.tests.test_go_write_progress tools.tests.test_go_network -v
      - name: Authenticate one official reference compiler
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-write-reference-tools"
          test ! -e "$out"
          mkdir "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/go.tar.gz" -C "$out"
          echo "$out/go/bin" >> "$GITHUB_PATH"
      - name: Execute original failure and corrected finite method controls
        run: python3 tools/qualify_go_write_progress.py --output "$RUNNER_TEMP/go-write-progress"
      - name: Retain bounded source and actual method reference evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-write-progress-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-write-progress/*.json
            ${{ runner.temp }}/go-write-progress/*.log
          if-no-files-found: warn
          retention-days: 7
