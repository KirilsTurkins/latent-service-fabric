name: Go bounded write progress reference

on:
  workflow_dispatch:
  push:
    branches: ['feat/go-stream-write-progress-20261020', 'fix/go-stream-deadline-20261109', 'fix/go-empty-read-deadline-20261110', 'fix/go-half-close-deadline-20261110', 'fix/go-deadline-clock-basis-20261110', 'fix/go-ascii-stream-endpoints-20261110', 'fix/go-write-reference-deadline-helper-20261110']

permissions:
  contents: read

concurrency:
  group: go-write-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Exact production Write and timeout references with old counterexamples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact projection and strict counterexample reader
        run: python3 -m unittest tools.tests.test_go_write_progress tools.tests.test_go_network tools.tests.test_go_network_deadline_set -v
      - name: Authenticate one official reference compiler
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-write-reference-tools"
          test ! -e "$out"
          mkdir "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.4.linux-amd64.tar.gz
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  $out/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/go.tar.gz" -C "$out"
          echo "$out/go/bin" >> "$GITHUB_PATH"
      - name: Execute original failures and corrected Write and timeout controls
        run: python3 tools/qualify_go_write_progress.py --output "$RUNNER_TEMP/go-write-progress"
      - name: Retain bounded source and actual method reference evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-write-progress-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-write-progress/*.json
            ${{ runner.temp }}/go-write-progress/*.log
          if-no-files-found: warn
          retention-days: 7
