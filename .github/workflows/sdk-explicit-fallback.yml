name: C and Go explicit application fallback
'on':
  push:
    branches:
    - feat/c-go-explicit-fallback-20261021
    paths:
    - .github/workflows/sdk-explicit-fallback.yml
    - tools/sdk_explicit_fallback_fixture.py
    - tools/sdk_explicit_fallback_node.py
    - tools/qualify_sdk_explicit_fallback.py
    - tools/tests/test_sdk_explicit_fallback.py
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk-explicit-fallback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fallback:
    name: Two normal components and eight exact fallback trap fresh outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.13.5
    - name: Fetch exact historical per-product sources without recompilation
      run: git fetch --no-tags --depth=1 origin f244b81f14abad5d4dc4984cb842aaf1d9076e23
        f6251df89851de98cb869784d095ad5cc2e5b385
    - name: Install only existing pinned Python dependencies
      run: python3 -m pip install --requirement tools/requirements.lock
    - name: Check seven exact native error fallback and cleanup source controls
      run: python3 -B -m unittest tools.tests.test_sdk_explicit_fallback -v
    - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      with:
        version: 1.254.0
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.16.0
    - name: Install the original pinned C binding generator
      run: 'python3 -B tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools"

        echo "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"'
    - name: Authenticate original Go1.27.3 and componentize-go0.4.3 and prepare the
        maintained async compiler
      run: 'set -euo pipefail

        out="$RUNNER_TEMP/go-http-tenant-tools"

        test ! -e "$out"

        mkdir "$out"

        curl --fail --location --proto ''=https'' --tlsv1.2 --max-time 180 --output
        "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz

        echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz"
        | sha256sum --check --strict

        tar -xzf "$out/go.tar.gz" -C "$out"

        curl --fail --location --proto ''=https'' --tlsv1.2 --max-time 180 --output
        "$out/componentize-go.tar.gz" https://github.com/bytecodealliance/componentize-go/releases/download/v0.4.3/componentize-go-linux-amd64.tar.gz

        echo "1061d845f550df5d9477612a7d458a31b1e2b8bdc95823704e42e5064deb0c52  $out/componentize-go.tar.gz"
        | sha256sum --check --strict

        tar -xzf "$out/componentize-go.tar.gz" -C "$out" componentize-go

        echo "b41803a645e54845bc8eacef9a69e0eeb8c2c4a9a61964c831ed544e85c137cb  $out/componentize-go"
        | sha256sum --check --strict

        chmod 755 "$out/componentize-go"

        test "$("$out/componentize-go" --version)" = ''componentize-go 0.4.3''

        test "$(wasm-tools --version | cut -d '' '' -f 1,2)" = ''wasm-tools 1.254.0''

        python3 -B tools/go_guest/runtime.py --prepare-compiler "$out/go" --output
        "$out/go-async"

        echo "$out" >> "$GITHUB_PATH"

        echo "$out/go-async/bin" >> "$GITHUB_PATH"

        '
    - name: Authenticate existing three plus two products without a host build
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B tools/c_thread_admission_native_products.py --output "$RUNNER_TEMP/fallback-native"
    - name: Capture compile package sign two ordinary guests and execute eight outcomes
      run: python3 -B tools/qualify_sdk_explicit_fallback.py --native-products "$RUNNER_TEMP/fallback-native"
        --output "$RUNNER_TEMP/sdk-explicit-fallback"
    - name: Retain bounded public compiler signing and actual failure evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sdk-explicit-fallback-${{ github.sha }}
        retention-days: 1
        if-no-files-found: warn
        path: '${{ runner.temp }}/sdk-explicit-fallback/*.json

          ${{ runner.temp }}/sdk-explicit-fallback/*/build/*.json

          ${{ runner.temp }}/sdk-explicit-fallback/*/build/*.wasm

          ${{ runner.temp }}/sdk-explicit-fallback/*/build/*.wit

          ${{ runner.temp }}/sdk-explicit-fallback/*/build/logs/**

          ${{ runner.temp }}/sdk-explicit-fallback/*/node/*.json

          ${{ runner.temp }}/sdk-explicit-fallback/*/node/controls/*.json

          ${{ runner.temp }}/sdk-explicit-fallback/*.stdout

          ${{ runner.temp }}/sdk-explicit-fallback/*.stderr

          ${{ runner.temp }}/sdk-explicit-fallback/logs/**

          ${{ runner.temp }}/sdk-explicit-fallback/*/build/wit/**'
