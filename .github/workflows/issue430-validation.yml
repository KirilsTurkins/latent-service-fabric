name: Issue 430 supported-host validation
# Temporary branch-only helper. Remove both helper files before opening the PR.
on:
  push:
    branches: [feat/430-metadata-working-set]
permissions:
  contents: write
concurrency:
  group: issue430-supported-host-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      OBSERVATIONS: /tmp/issue430-observations-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/430-metadata-working-set
          persist-credentials: false
          fetch-depth: 2
      - name: Publish the hash-verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/issue430-validation.py apply
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Apply pinned formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fmt -p latent-control-store
          python3 .github/issue430-validation.py format
          cargo fmt --all --check
      - name: Validate exact correctness, physical probe, retention controls and library
        run: python3 .github/issue430-validation.py run
      - name: Retain bounded logs and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue430-supported-host-observations
          path: ${{ env.OBSERVATIONS }}
          if-no-files-found: warn
      - name: Commit successful supported-host evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/issue430-validation.py record
