name: Positive native Go live node-stop reference

on:
  workflow_dispatch: {}
  push:
    branches: ['feat/go-node-stop-positive-timers-20261020']

permissions:
  contents: read
  actions: read

concurrency:
  group: go-node-stop-positive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-stop:
    name: Actual accepted timer wait SIGTERM retirement and fresh restart
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - name: Fetch only the authenticated native producer source object
        run: git fetch --no-tags --depth=1 origin 77bf0e3f3b68e17342b6146abd6f2de34a3efa00
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Reject false timer admission source drift and incomplete producer evidence
        run: python3 -m unittest tools.tests.test_go_node_stop tools.tests.test_go_node_stop_positive tools.tests.test_go_node_stop_v7 tools.tests.test_go_node_stop_timer_observer tools.tests.test_java_phase_native_products tools.tests.test_node_startup_observation tools.tests.test_go_node_stop_restart -v
      - name: Authenticate and restore the distinct V7 native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/java_phase_native_products.py --output "$RUNNER_TEMP/go-node-stop-v7-products"
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install the existing network-denied compiler namespace
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Authenticate the maintained Go compiler and official generator
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-node-stop-v7-tools"
          test ! -e "$out"
          mkdir "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/go.tar.gz" -C "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/componentize-go.tar.gz" https://github.com/bytecodealliance/componentize-go/releases/download/v0.4.3/componentize-go-linux-amd64.tar.gz
          echo "1061d845f550df5d9477612a7d458a31b1e2b8bdc95823704e42e5064deb0c52  $out/componentize-go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/componentize-go.tar.gz" -C "$out" componentize-go
          echo "b41803a645e54845bc8eacef9a69e0eeb8c2c4a9a61964c831ed544e85c137cb  $out/componentize-go" | sha256sum --check --strict
          chmod 755 "$out/componentize-go"
          test "$("$out/componentize-go" --version)" = 'componentize-go 0.4.3'
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          python3 tools/go_guest/runtime.py --prepare-compiler "$out/go" --output "$out/go-async"
          echo "$out" >> "$GITHUB_PATH"
          echo "$out/go-async/bin" >> "$GITHUB_PATH"
      - name: Compile one current Go fixture and require accepted timer wait before SIGTERM
        run: python3 tools/qualify_go_node_stop_v7.py --source-commit "${{ github.sha }}" --native-products "$RUNNER_TEMP/go-node-stop-v7-products" --output "$RUNNER_TEMP/go-node-stop-positive"
      - name: Retain bounded source timer and shutdown evidence including failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-node-stop-positive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-node-stop-v7-products/*.json
            ${{ runner.temp }}/go-node-stop-positive/*.json
            ${{ runner.temp }}/go-node-stop-positive/logs/**
            ${{ runner.temp }}/go-node-stop-positive/build/*.json
            ${{ runner.temp }}/go-node-stop-positive/build/logs/**
            ${{ runner.temp }}/go-node-stop-positive/build/component.wasm
            ${{ runner.temp }}/go-node-stop-positive/pending/*.json
            ${{ runner.temp }}/go-node-stop-positive/pending/controls/*.json
            ${{ runner.temp }}/go-node-stop-positive/drain/*.json
            ${{ runner.temp }}/go-node-stop-positive/drain/controls/*.json
          if-no-files-found: warn
          retention-days: 7
