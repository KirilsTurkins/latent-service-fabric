name: Audit journal lifecycle qualification

on:
  workflow_dispatch:
  push:
    branches: ['feat/audit-journal-lifecycle-990']

permissions:
  contents: read

concurrency:
  group: audit-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare pinned offline native qualification inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Retain bounded pinned native dependency closure and tracked source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audit-native-inputs"
          mkdir -p "$out/evidence"
          cargo +1.97.1 vendor --locked --versioned-dirs "$out/vendor" > "$out/evidence/vendor-config.toml"
          git rev-parse HEAD > "$out/evidence/source-sha.txt"
          sha256sum Cargo.lock > "$out/evidence/cargo-lock-sha256.txt"
          test "$(du -sm "$out/vendor" | cut -f1)" -le 2048
          tar -czf "$RUNNER_TEMP/audit-native-vendor.tar.gz" -C "$out" vendor evidence
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tarfile
          roots = {'.cargo', '.github', 'api', 'apps', 'crates', 'tools', 'docs', 'adr', 'sdk', 'wit', 'proto', 'schemas', 'examples', 'tests'}
          paths = [pathlib.Path(os.fsdecode(p)) for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p]
          paths = [p for p in paths if len(p.parts) == 1 or p.parts[0] in roots]
          if len(paths) > 100000 or sum(p.lstat().st_size for p in paths) > 256 * 1024 * 1024:
              raise SystemExit('native source exceeds finite snapshot allowance')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'audit-native-source.tar.gz'
          with tarfile.open(out, 'w:gz') as archive:
              for path in paths:
                  archive.add(path, recursive=False)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-native-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/audit-native-vendor.tar.gz
            ${{ runner.temp }}/audit-native-source.tar.gz
          if-no-files-found: error
          retention-days: 1
