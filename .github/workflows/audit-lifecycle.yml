name: Audit journal lifecycle qualification

on:
  workflow_dispatch:
  push:
    branches: ['feat/audit-journal-lifecycle-990']

permissions:
  contents: read

concurrency:
  group: audit-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare pinned offline audit development inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare finite low-level source and dependency closure
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audit-offline"
          mkdir -p "$out/workspace/crates" "$out/evidence"
          cp -a crates/latent-core crates/latent-audit "$out/workspace/crates/"
          cp Cargo.toml Cargo.lock "$out/workspace/"
          python3 - "$out/workspace/Cargo.toml" <<'PY'
          import pathlib
          import re
          import sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text()
          text = re.sub(r'(?ms)^members = \[.*?^\]', 'members = ["crates/latent-core", "crates/latent-audit"]', text, count=1)
          text = re.sub(r'(?m)^exclude = .*\n', '', text)
          p.write_text(text)
          PY
          cargo +1.97.1 vendor --manifest-path "$out/workspace/Cargo.toml" "$out/vendor" > "$out/evidence/vendor-config.toml"
          rustc +1.97.1 --version --verbose > "$out/evidence/rustc.txt"
          git rev-parse HEAD > "$out/evidence/source-sha.txt"
          test "$(du -sm "$out/vendor" | cut -f1)" -le 256
          toolchain="$(rustup toolchain list | awk '/^1.97.1-/ {print $1; exit}')"
          test -n "$toolchain"
          cp -a "$HOME/.rustup/toolchains/$toolchain" "$out/rust-toolchain"
          test "$(du -sm "$out/rust-toolchain" | cut -f1)" -le 2048
          tar -czf "$RUNNER_TEMP/audit-offline.tar.gz" -C "$out" rust-toolchain vendor workspace/Cargo.toml workspace/Cargo.lock evidence
          git archive --format=tar.gz --output="$RUNNER_TEMP/audit-protocol-source.tar.gz" HEAD api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/audit-offline.tar.gz
            ${{ runner.temp }}/audit-protocol-source.tar.gz
          if-no-files-found: error
          retention-days: 1
