name: Audit journal lifecycle qualification

on:
  workflow_dispatch:
  push:
    branches: ['feat/audit-journal-lifecycle-990']

# Temporary branch-only candidate builder. It creates immutable Git blobs;
# it never commits, updates a ref, opens a PR, or writes another branch.
permissions:
  contents: write

concurrency:
  group: audit-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/audit-journal-lifecycle-990'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare exact bounded wiring candidates
        run: python3 .github/audit-lifecycle-candidate.py prepare
      - name: Format candidate Rust files
        run: cargo +1.97.1 fmt --all
      - name: Publish immutable candidate blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/audit-lifecycle-candidate.py publish
      - name: Exercise maintained static release tooling
        shell: bash
        run: |
          node --test tools/static-release/*.test.mjs > "$RUNNER_TEMP/audit-node.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-node.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/audit-node.log"
      - name: Exercise native durable audit and CLI diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 test -p latent-audit --lib --all-features --locked > "$RUNNER_TEMP/audit-rust.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-rust.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/audit-rust.log"
          cargo +1.97.1 test -p latent --lib error::audit_tests --locked > "$RUNNER_TEMP/audit-cli.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-cli.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/audit-cli.log"
          cargo +1.97.1 test -p latent-wire --lib audit_byte_ownership_and_recovery_remain_visible_after_record_refund --locked > "$RUNNER_TEMP/audit-wire.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-wire.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/audit-wire.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/audit-*
          if-no-files-found: warn
          retention-days: 7
