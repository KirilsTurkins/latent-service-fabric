name: Audit journal lifecycle qualification

on:
  workflow_dispatch:
  push:
    branches: ['feat/audit-journal-lifecycle-990']

permissions:
  contents: read

concurrency:
  group: audit-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/audit-journal-lifecycle-990'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Temporary same-repository immutable blob publication only. No ref writes.
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare and format exact CLI and owner integration
        run: python3 .github/audit-lifecycle-candidate.py prepare
      - name: Publish immutable candidate blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/audit-lifecycle-candidate.py publish
      - name: Exercise full audit library including interruption boundaries
        shell: bash
        run: |
          cargo +1.97.1 test -p latent-audit --lib --all-features --locked > "$RUNNER_TEMP/audit-rust.log" 2>&1 || { tail -120 "$RUNNER_TEMP/audit-rust.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/audit-rust.log"
      - name: Exercise the native local-operator CLI workflow
        shell: bash
        run: |
          cargo +1.97.1 test -p latent --lib audit_maintenance --locked > "$RUNNER_TEMP/audit-cli.log" 2>&1 || { tail -140 "$RUNNER_TEMP/audit-cli.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/audit-cli.log"
      - name: Exercise maintained static release tooling
        shell: bash
        run: |
          node --test tools/static-release/*.test.mjs > "$RUNNER_TEMP/audit-node.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-node.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/audit-node.log"
      - name: Retain all fixed-scope Clippy diagnostics without truncating the first findings
        shell: bash
        run: |
          set +e
          cargo +1.97.1 clippy -p latent-audit -p latent --no-deps --all-targets --all-features --locked --message-format=json > "$RUNNER_TEMP/audit-clippy.jsonl" 2> "$RUNNER_TEMP/audit-clippy.log"
          status=$?
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = []
          for line in Path(os.environ['RUNNER_TEMP'], 'audit-clippy.jsonl').read_text().splitlines():
              try: item = json.loads(line)
              except ValueError: continue
              if item.get('reason') != 'compiler-message': continue
              message = item['message']
              if message['level'] not in ('warning', 'error'): continue
              spans = [span for span in message['spans'] if span.get('is_primary')]
              rows.append({'level':message['level'], 'code':message.get('code'), 'message':message['message'],
                  'locations':[(span['file_name'], span['line_start']) for span in spans]})
          if len(rows) > 1000: raise SystemExit('diagnostic-bound')
          for row in rows: print('CLIPPY=' + json.dumps(row, sort_keys=True))
          PY
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/audit-*
          if-no-files-found: warn
          retention-days: 7
