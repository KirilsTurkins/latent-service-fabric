name: Review Rust integration contract correction
on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-thread-contract-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          ref: 0ef909fda133933fddced7c52b17e2863ccf06a1
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: 3.13.5
      - name: Install reviewed validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Apply only the exact inherited guard expectation
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path('tools/tests/test_ci_contracts.py')
          raw = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '183984b75e6ee5dd3c728ee8b8c89b01fcc2e033'
          before = b"github.ref != 'refs/heads/feat/sdk-690-c-libucl-http-20261029' && (github.event_name != 'workflow_dispatch' || !inputs.replay-closed-filesystem ) }}"
          after = b"github.ref != 'refs/heads/feat/sdk-690-c-libucl-http-20261029' && github.ref != 'refs/heads/feat/sdk-690-c-outside-capture-20261031' && (github.event_name != 'workflow_dispatch' || !inputs.replay-closed-filesystem ) }}"
          assert raw.count(before) == 1
          path.write_bytes(raw.replace(before, after, 1))
          PY
          git diff --check
          git diff -- tools/tests/test_ci_contracts.py
      - name: Run complete affected contract and selector suites
        run: |
          mkdir -p "$RUNNER_TEMP/rust-contract-review"
          python3 -m unittest tools.tests.test_ci_contracts tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_c_closed_filesystem_qualification > "$RUNNER_TEMP/rust-contract-review/tests.log" 2>&1
          tail -n 12 "$RUNNER_TEMP/rust-contract-review/tests.log"
          python3 tools/ci_coverage.py --receipt "$RUNNER_TEMP/rust-contract-review/coverage.json"
      - name: Store the tested blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path('tools/tests/test_ci_contracts.py')
          raw = path.read_bytes()
          expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs',
              data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(raw).decode('ascii')}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected
          record = {'path': str(path), 'sha': expected, 'sha256': hashlib.sha256(raw).hexdigest(), 'source': '0ef909fda133933fddced7c52b17e2863ccf06a1'}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-contract-review'
          (out / 'tested-blob.json').write_text(json.dumps(record, indent=2) + '\n')
          (out / 'test_ci_contracts.py').write_bytes(raw)
          print(json.dumps(record))
          PY
      - name: Retain exact review evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: rust-thread-contract-review-${{ github.sha }}
          path: ${{ runner.temp }}/rust-contract-review/
          if-no-files-found: error
          retention-days: 3
