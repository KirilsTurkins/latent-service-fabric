name: Review Rust integration contract correction
on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-thread-contract-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: 0ef909fda133933fddced7c52b17e2863ccf06a1
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install reviewed validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Validate exact correction and retain data-only reviewed objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin 0b9f86335b1273790d227696649f8bad21370d8d
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, yaml
          raw = subprocess.check_output(['git', 'show', '0b9f86335b1273790d227696649f8bad21370d8d:.github/workflows/rust-thread-contract-review.yml'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '05da80bc9914afb1a7e115aaf1b86133ae8d0c3a'
          steps = yaml.safe_load(raw)['jobs']['review']['steps']
          selected = [s for s in steps if s.get('name') == 'Apply and test pinned corrections before storing their exact blobs']
          assert len(selected) == 1
          script = selected[0]['run']
          # Keep every validation stage. Only replace the failing transport.
          token = "    'Store exact tested blobs without changing a branch',\n"
          assert script.count(token) == 1
          subprocess.run(['bash', '-eu'], input=script.replace(token, '').encode(), check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-contract-review'
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          added = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          names = sorted(set(changed + added))
          assert len(names) == 21 and all(n.startswith(('tools/', '.github/workflows/')) for n in names)
          rows = []
          for name in names:
              path = pathlib.Path(name); assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes(); assert len(raw) <= 4 * 1024 * 1024
              identity = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              stored = subprocess.check_output(['git', 'hash-object', '-w', '--stdin'], input=raw).decode().strip()
              assert stored == identity
              rows.append({'path':name, 'sha':identity, 'bytes':len(raw), 'sha256':hashlib.sha256(raw).hexdigest()})
          (out / 'tested-blobs.json').write_text(json.dumps(rows, indent=2) + '\n')
          print(json.dumps(rows), flush=True)
          # This orphan ref has only opaque data blobs. No workflows or branch
          # code are installed by the job; integration uses an explicit API commit.
          index = out / 'data-only.index'; assert not index.exists()
          env = dict(os.environ, GIT_INDEX_FILE=str(index), GIT_AUTHOR_NAME='github-actions[bot]', GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com', GIT_COMMITTER_NAME='github-actions[bot]', GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          for row in rows:
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', '100644', row['sha'], 'reviewed/' + row['sha']], env=env, check=True)
          tree = subprocess.check_output(['git', 'write-tree'], env=env).decode().strip()
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-m', 'Retain tested PR 1371 integration data; no executable workflow'], env=env).decode().strip()
          credential = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
          ref = 'refs/heads/ci/pr1371-reviewed-data-20261104'
          subprocess.run(['git', 'push', 'origin', commit + ':' + ref], env=env, check=True, timeout=120)
          (out / 'data-ref.json').write_text(json.dumps({'ref':ref, 'commit':commit, 'tree':tree}) + '\n')
          PY
      - name: Retain exact review evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-thread-contract-review-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-contract-review/
          if-no-files-found: error
          retention-days: 3
