name: Review Rust integration contract correction
on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-thread-contract-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          ref: 0ef909fda133933fddced7c52b17e2863ccf06a1
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: 3.13.5
      - name: Install reviewed validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Apply exact preimage-bound reviewed edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, zlib
          encoded = ''''''
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'ed1aba70d7c2a9aa2fadbab19949e87fea4c501e157e6390a04b8bb8a6877822'
          records = json.loads(raw)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for row in records:
              path = pathlib.Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              assert blob(old) == row['before'] if row['before'] else not path.exists()
              text = old.decode()
              if 'replacements' in row:
                  for before, after in row['replacements']:
                      assert before in text
                      text = text.replace(before, after)
              else:
                  lines = text.splitlines(keepends=True)
                  for start, end, replacement in reversed(row['edits']):
                      lines[start:end] = replacement
                  text = ''.join(lines)
              result = text.encode()
              assert blob(result) == row['after'], row['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-contract-review'
          out.mkdir()
          (out / 'reviewed-edits.json').write_bytes(raw)
          PY
          git diff --check
          git diff --stat
      - name: Fetch every existing historical input and the exact matched Rust producer
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/rust-contract-review/history.sh"
          from pathlib import Path
          from tools.ci_lane_inventory import workflow_model
          model = workflow_model(Path('.github/workflows/ci.yml').read_text())
          steps = model['jobs']['contracts']['steps']
          selected = [s for s in steps if s.get('name') == 'Fetch exact historical source inputs for Python preservation controls']
          assert len(selected) == 1 and selected[0]['if'] == "matrix.lane == 'python'"
          print(selected[0]['run'])
          PY
          bash "$RUNNER_TEMP/rust-contract-review/history.sh"
      - name: Run complete affected preservation and regression suites
        run: |
          status=0
          python3 -m unittest tools.tests.test_ci_contracts tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_c_closed_filesystem_qualification tools.tests.test_owned_runners tools.tests.test_audit_memory_programme tools.tests.test_c_thread_minimal tools.tests.test_c_thread_ready_runtime tools.tests.test_java_scheduled_library tools.tests.test_rust_thread_runtime tools.tests.test_java_checkpoint_gc tools.tests.test_java_checkpoint_gc_retained tools.tests.test_java_dependency_checkpoints tools.tests.test_typescript_private_removed tools.tests.test_c_thread_runtime > "$RUNNER_TEMP/rust-contract-review/tests.log" 2>&1 || status=$?
          tail -n 100 "$RUNNER_TEMP/rust-contract-review/tests.log"
          test "$status" = 0
          python3 tools/ci_coverage.py --receipt target/ci/rust-thread-contract-review.json
          cp target/ci/rust-thread-contract-review.json "$RUNNER_TEMP/rust-contract-review/coverage.json"
      - name: Store only the exact tested blobs without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-contract-review'
          records = json.loads((out / 'reviewed-edits.json').read_text())
          result = []
          for row in records:
              path = pathlib.Path(row['path']); raw = path.read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert expected == row['after']
              request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(), headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  stored = json.load(response)
              assert stored['sha'] == expected
              result.append({'path':str(path),'sha':expected,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          (out / 'tested-blobs.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Retain exact review evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: rust-thread-contract-review-${{ github.sha }}
          path: ${{ runner.temp }}/rust-contract-review/
          if-no-files-found: error
          retention-days: 3
