name: Review Rust integration contract correction
on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-thread-contract-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          ref: 0ef909fda133933fddced7c52b17e2863ccf06a1
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: 3.13.5
      - name: Install reviewed validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Apply only the exact inherited guard expectation
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path('tools/tests/test_ci_contracts.py')
          raw = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '183984b75e6ee5dd3c728ee8b8c89b01fcc2e033'
          before = b"github.ref != 'refs/heads/feat/sdk-690-c-libucl-http-20261029' && (github.event_name != 'workflow_dispatch' || !inputs.replay-closed-filesystem ) }}"
          after = b"github.ref != 'refs/heads/feat/sdk-690-c-libucl-http-20261029' && github.ref != 'refs/heads/feat/sdk-690-c-outside-capture-20261031' && (github.event_name != 'workflow_dispatch' || !inputs.replay-closed-filesystem ) }}"
          assert raw.count(before) == 1
          path.write_bytes(raw.replace(before, after, 1))
          PY
          git diff --check
          git diff -- tools/tests/test_ci_contracts.py
      - name: Run complete affected contract and selector suites
        run: |
          mkdir -p "$RUNNER_TEMP/rust-contract-review"
          status=0
          python3 -m unittest tools.tests.test_ci_contracts tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_c_closed_filesystem_qualification > "$RUNNER_TEMP/rust-contract-review/tests.log" 2>&1 || status=$?
          tail -n 30 "$RUNNER_TEMP/rust-contract-review/tests.log"
          test "$status" = 0
          python3 tools/ci_coverage.py --receipt target/ci/rust-thread-contract-review.json
          cp target/ci/rust-thread-contract-review.json "$RUNNER_TEMP/rust-contract-review/coverage.json"
      - name: Store the tested blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path('tools/tests/test_ci_contracts.py')
          raw = path.read_bytes()
          expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs',
              data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(raw).decode('ascii')}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected
          record = {'path': str(path), 'sha': expected, 'sha256': hashlib.sha256(raw).hexdigest(), 'source': '0ef909fda133933fddced7c52b17e2863ccf06a1'}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-contract-review'
          (out / 'tested-blob.json').write_text(json.dumps(record, indent=2) + '\n')
          (out / 'test_ci_contracts.py').write_bytes(raw)
          print(json.dumps(record))
          PY
      - name: Read bounded original Python failure details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  target = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if target is not None:
                      target.remove_header('Authorization')
                  return target
          opener = urllib.request.build_opener(Redirect())
          job = 124675114467
          request = urllib.request.Request(f'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/actions/jobs/{job}/logs', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with opener.open(request, timeout=60) as response:
              raw = response.read(32 * 1024 * 1024 + 1)
          assert len(raw) <= 32 * 1024 * 1024
          lines = [re.sub(r'^\S+Z ', '', line) for line in raw.decode('utf-8-sig').splitlines()]
          starts = [i for i, line in enumerate(lines) if re.match(r'^(FAIL|ERROR):|^Ran \d+ tests|^FAILED \(', line)]
          excerpt = '\n'.join('\n'.join(line[:1200] for line in lines[i:i + 12]) for i in starts)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rust-contract-review'
          out.mkdir(exist_ok=True)
          (out / 'original-python.log').write_bytes(raw)
          (out / 'python-failures.txt').write_text(excerpt)
          print(excerpt[:40000])
          print(json.dumps({'job': job, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}))
          PY
      - name: Retain exact review evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: rust-thread-contract-review-${{ github.sha }}
          path: ${{ runner.temp }}/rust-contract-review/
          if-no-files-found: error
          retention-days: 3
