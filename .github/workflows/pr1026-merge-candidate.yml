name: PR 1026 bounded merge candidate
on:
  push:
    branches: [feat/go-http-context-20261016]
    paths: [.github/workflows/pr1026-merge-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ORIGINAL_HEAD: b8d858d84e948bd9955d09e95b56ee39a29d61dc
      BASE_HEAD: 8421308546a9080e39426ff9cc6a3eae74c6b6a1
      WORKFLOW_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compose exact parents and preserve every registered case
        shell: bash
        run: |
          python3 - <<'PY'
          import copy, json, os, pathlib, subprocess
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, capture_output=True, **kwargs).stdout
          ours, theirs, head = (os.environ[key] for key in ('ORIGINAL_HEAD', 'BASE_HEAD', 'WORKFLOW_HEAD'))
          control = '.github/workflows/pr1026-merge-candidate.yml'
          catalogue = 'tools/ci/suites.json'
          assert git('rev-parse', 'HEAD').decode().strip() == head
          assert git('rev-parse', 'HEAD^').decode().strip() == ours
          assert git('diff', '--name-only', ours, head).decode().splitlines() == [control]
          ancestor = git('merge-base', ours, theirs).decode().strip()
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  assert key not in value, 'duplicate-catalogue-key'
                  value[key] = item
              return value
          def document(ref):
              raw = git('show', ref + ':' + catalogue)
              assert len(raw) < 2 * 1024 * 1024
              return json.loads(raw, object_pairs_hook=unique)
          base, feature, development = map(document, (ancestor, ours, theirs))
          additions = [
              'runtime::go::signed_initializer_goroutines_waits_and_timers_start_inside_original_activation',
              'runtime::go::signed_published_retry_workers_and_default_timers_keep_original_activation_owners',
              'runtime::go::signed_standard_timers_contexts_and_rearm_keep_original_heap_owners',
          ]
          def target(value):
              rows = [row for row in value['suites'] if row['id'] == 'latent-wasmtime.test.local-service']
              assert len(rows) == 1
              return rows[0]
          def extend(value):
              row = target(value)
              assert row['minimumCases'] == len(row['expectedCases'])
              for field in ('expectedCases', 'expectedIgnored', 'ignoredLeaves'):
                  names = [name.rsplit('::', 1)[-1] for name in additions] if field == 'ignoredLeaves' else additions
                  assert len(row[field]) == len(set(row[field]))
                  assert not set(names).intersection(row[field])
                  row[field] = sorted(row[field] + names)
              row['minimumCases'] += len(additions)
          expected = copy.deepcopy(base)
          extend(expected)
          for value in (expected, feature):
              for field in ('expectedCases', 'expectedIgnored', 'ignoredLeaves'):
                  target(value)[field].sort()
          assert expected == feature, 'unexpected-feature-catalogue-delta'
          resolved = copy.deepcopy(development)
          extend(resolved)
          git('config', 'user.name', 'LSF PR integration validation')
          git('config', 'user.email', 'actions@users.noreply.github.com')
          merge = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', theirs], capture_output=True)
          conflicts = git('diff', '--name-only', '--diff-filter=U').decode().splitlines()
          print(json.dumps({'mergeStatus': merge.returncode, 'conflicts': conflicts}))
          assert merge.returncode in (0, 1)
          assert set(conflicts) <= {catalogue}, 'unexpected-merge-conflict'
          pathlib.Path(catalogue).write_text(json.dumps(resolved, indent=2) + '\n', encoding='utf-8')
          git('add', catalogue)
          git('rm', control)
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          from tools import ci_suite_inventory
          validated = ci_suite_inventory.load()
          tree = git('write-tree').decode().strip()
          report = {'originalHead': ours, 'baseHead': theirs, 'workflowHead': head,
                    'ancestor': ancestor, 'tree': tree, 'workflowRemoved': True,
                    'suiteCount': len(validated['suites']),
                    'localServiceCases': target(validated)['minimumCases'],
                    'addedCases': additions, 'qualification': 'source-merge-only'}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1026-merge-report.json'
          path.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - name: Validate exact merged Go controls and independent contracts
        shell: bash
        run: |
          python3 -m unittest tools.tests.test_go_runtime_overlay tools.tests.test_go_http_context tools.tests.test_go_application_dependencies tools.tests.test_go_capsule_authoring tools.tests.test_go_dependency_authoring
          python3 - <<'PY'
          import json
          from tools import ci_coverage
          result = ci_coverage.validate()
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Publish immutable candidate objects without updating any branch
        env:
          CANDIDATE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          report_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1026-merge-report.json'
          report = json.loads(report_path.read_text())
          ours, theirs, head = (report[key] for key in ('originalHead', 'baseHead', 'workflowHead'))
          assert git('write-tree').decode().strip() == report['tree']
          assert not git('diff', '--name-only').strip(), 'candidate-worktree-drift'
          repository = 'KirilsTurkins/latent-service-fabric'
          def api(path, value=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/' + path,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['CANDIDATE_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          assert api('git/ref/heads/feat/go-http-context-20261016')['object']['sha'] == head, 'head-moved'
          assert api('git/ref/heads/development')['object']['sha'] == theirs, 'base-moved'
          known = set()
          for ref in (head, theirs):
              known.update(git('ls-tree', '-r', '--format=%(objectname)', ref).decode().splitlines())
          index = {}
          for record in git('ls-files', '--stage', '-z').split(b'\0'):
              if not record: continue
              meta, path = record.split(b'\t', 1)
              mode, sha, stage = meta.decode().split()
              assert stage == '0'
              index[path.decode()] = (mode, sha)
          names = git('diff', '--cached', '--name-only', '--no-renames', '-z', head).decode().split('\0')
          names = [name for name in names if name]
          assert 1 <= len(names) <= 1024
          entries, uploaded = [], []
          for name in names:
              assert not name.startswith('/') and '..' not in name.split('/')
              if name not in index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index[name]
              assert mode in ('100644', '100755', '120000'), 'unexpected-tree-mode'
              if sha not in known:
                  raw = git('cat-file', 'blob', sha)
                  assert len(raw) <= 2 * 1024 * 1024
                  created = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(raw).decode()})
                  assert created['sha'] == sha, 'blob-identity-mismatch'
                  known.add(sha)
                  uploaded.append({'path': name, 'sha': sha, 'bytes': len(raw)})
                  assert len(uploaded) <= 64
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          base_tree = git('rev-parse', head + '^{tree}').decode().strip()
          tree = api('git/trees', {'base_tree': base_tree, 'tree': entries})
          assert tree['sha'] == report['tree'], 'tree-identity-mismatch'
          commit = api('git/commits', {'tree': tree['sha'], 'parents': [head, theirs],
              'message': 'Merge development into Go HTTP context branch without losing qualification cases\n\nRetain all existing Go, Java and native-thread cases. Resolve only the\nthree proven additive Go cases in the independent suite catalogue.\nRemove the one-shot merge workflow from the final source tree.\nExact merged Go source controls and CI contracts passed before publishing.\nFull signed runtime and HTTP qualification remain required.'})
          report.update({'candidateCommit': commit['sha'], 'uploadedBlobs': uploaded,
                         'changedPaths': names, 'branchUpdated': False, 'sourceControlsPassed': True})
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'candidateCommit': commit['sha'], 'tree': tree['sha'],
                            'branchUpdated': False, 'sourceControlsPassed': True}))
          PY
          git archive "$(git write-tree)" | gzip -1 > "$RUNNER_TEMP/pr1026-candidate-source.tar.gz"
      - name: Retain candidate identity and source for independent review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr1026-merge-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr1026-merge-report.json
            ${{ runner.temp }}/pr1026-candidate-source.tar.gz
          if-no-files-found: warn
          retention-days: 1
