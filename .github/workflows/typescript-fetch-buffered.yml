name: TypeScript emitted buffered bodies
on:
  push:
    branches: ['feat/typescript-fetch-buffered-limits-20261020']
    paths:
      - '.github/workflows/typescript-fetch-buffered.yml'
      - 'sdk/typescript-guest/probes/fetch-buffered-limits/**'
      - 'tools/typescript_fetch_buffered.py'
      - 'tools/qualify_typescript_fetch_conformance.py'
      - 'tools/tests/test_typescript_fetch_buffered.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-fetch-buffered-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch-conformance:
    name: Signed zero-contact buffered windows abandonment and limits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@c1136b2d97fe79ef645e9508b2048a222f50a170 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check pending-owner and exact standard Fetch controls
        run: python3 -B -m unittest tools.tests.test_typescript_fetch_buffered -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/fetch-buffered-tools"
      - name: Acquire exact historical import engine and original native tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_fetch_replay_inputs.py --output "$RUNNER_TEMP/fetch-buffered-original"
      - name: Build sign and execute actual standard Fetch programme
        run: python3 -B tools/qualify_typescript_fetch_conformance.py --acquired "$RUNNER_TEMP/fetch-buffered-original" --tools "$RUNNER_TEMP/fetch-buffered-tools" --output "$RUNNER_TEMP/fetch-buffered" --buffered-only
      - name: Retain exact source compiler results real contacts and physical ownership
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-fetch-buffered-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fetch-buffered-original/acquisition.json
            ${{ runner.temp }}/fetch-buffered/*.json
            ${{ runner.temp }}/fetch-buffered/build/*.json
            ${{ runner.temp }}/fetch-buffered/build/*.wit
            ${{ runner.temp }}/fetch-buffered/build/component.wasm
            ${{ runner.temp }}/fetch-buffered/build/package/**
            ${{ runner.temp }}/fetch-buffered/build/logs/
            ${{ runner.temp }}/fetch-buffered/node/*.json
            ${{ runner.temp }}/fetch-buffered/node/controls/
          if-no-files-found: warn
          retention-days: 7
