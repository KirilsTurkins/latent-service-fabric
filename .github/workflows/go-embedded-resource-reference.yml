name: Actual Go embedded resource reference

on:
  workflow_dispatch:
  push:
    branches: ['diagnostic/go-embedded-resources-20261020']

permissions:
  contents: read
  actions: read

concurrency:
  group: go-embedded-resource-reference-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  resources:
    name: Fresh Go embedded data original27 plus8 on authenticated normal products
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Check exact source closures original programme and resource failure guards
        run: python3 -B -m unittest tools.tests.test_embedded_resource_conformance tools.tests.test_go_embedded_resource_replay -v
      - name: Authenticate the successful producer before restoring any executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/replay_go_embedded_resources.py --record-producer --output "$RUNNER_TEMP/go-embedded-producer.json"
      - name: Restore only the authenticated public normal Go bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-scratch-prepared-94d0f8b0c1508df50e2830e6d678661c1e76bc36
          run-id: 39373374237
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/go-embedded-normal
      - name: Install the unchanged compiler namespace prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the existing pinned component compiler no native host build
        run: |
          set -euo pipefail
          cargo install --git https://github.com/bytecodealliance/componentize-go --rev 148dba505f8c6c64ad84db777cfde5e34e25098b --locked componentize-go
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          mkdir -p "$RUNNER_TEMP/go-embedded-tools"
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/go-embedded-tools/go.tar.gz" https://dl.google.com/go/go1.27.2.linux-amd64.tar.gz
          echo "ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5  $RUNNER_TEMP/go-embedded-tools/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/go-embedded-tools/go.tar.gz" -C "$RUNNER_TEMP/go-embedded-tools"
          python3 tools/go_guest/runtime.py --prepare-compiler "$RUNNER_TEMP/go-embedded-tools/go" --output "$RUNNER_TEMP/go-embedded-tools/go-async"
          echo "$RUNNER_TEMP/go-embedded-tools/go-async/bin" >> "$GITHUB_PATH"
      - name: Build one fresh greeting sign admit and require original27 plus8 resource calls
        run: python3 -B tools/replay_go_embedded_resources.py --normal-qualification "$RUNNER_TEMP/go-embedded-normal" --producer-receipt "$RUNNER_TEMP/go-embedded-producer.json" --output "$RUNNER_TEMP/go-embedded-resources"
      - name: Retain bounded public source identities actual results and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-embedded-resource-reference-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/go-embedded-producer.json
            ${{ runner.temp }}/go-embedded-resources/*.json
            ${{ runner.temp }}/go-embedded-resources/logs/**
            ${{ runner.temp }}/go-embedded-resources/build/*.json
            ${{ runner.temp }}/go-embedded-resources/build/logs/**
            ${{ runner.temp }}/go-embedded-resources/build/component.wasm
            ${{ runner.temp }}/go-embedded-resources/node/workflow.json
            ${{ runner.temp }}/go-embedded-resources/node/FAILED.json
            ${{ runner.temp }}/go-embedded-resources/node/controls/*.json
