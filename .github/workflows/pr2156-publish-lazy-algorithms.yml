name: PR2156 exact source blob publication
on:
  push:
    branches: [work/pr2156-lazy-algorithms-publish-20261121]
    paths: [.github/workflows/pr2156-publish-lazy-algorithms.yml]
permissions: {}
concurrency:
  group: pr2156-lazy-algorithms-publish-20261121
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/work/pr2156-lazy-algorithms-publish-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Authenticate inert edits and publish only exact Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request, zlib
          repository = 'KirilsTurkins/latent-service-fabric'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/work/pr2156-lazy-algorithms-publish-20261121'
          origin = 'https://api.github.com/repos/' + repository + '/git/blobs'
          def identity(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def request(sha=None, data=None):
              assert (sha is None) != (data is None)
              if sha is not None:
                  assert re.fullmatch('[0-9a-f]{40}', sha)
              payload = None if data is None else json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              req = urllib.request.Request(origin if sha is None else origin + '/' + sha, data=payload,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(1048577)
              assert len(raw) <= 1048576
              return json.loads(raw)
          def read_blob(sha):
              obj = request(sha=sha)
              assert obj['encoding'] == 'base64' and obj['sha'] == sha
              raw = base64.b64decode(obj['content'])
              assert identity(raw) == sha
              return raw
          parts = ['29ee7bde3d0ec057123557bc03af85353e57d0e4', '8c7eeb3076a313e2db8e458f7085dd531f3dcd9d', '853ca11301b84db86967f99ea99eaede4b15c948']
          encoded = b''.join(read_blob(sha) for sha in parts)
          assert len(encoded) == 12088
          decoder = zlib.decompressobj()
          edits_bytes = decoder.decompress(base64.b64decode(encoded, validate=True), 100000)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(edits_bytes) == 31214
          assert hashlib.sha256(edits_bytes).hexdigest() == 'eea9256d115cd0402325fb11f872b2840d6ac05fdc585773ebdd313c43c7f845'
          entries = json.loads(edits_bytes)
          assert len(entries) == 7 and len({item['path'] for item in entries}) == 7
          prepared = []
          for item in entries:
              assert re.fullmatch('[0-9a-f]{40}', item['after'])
              assert 0 < item['size'] < 70000
              before = read_blob(item['before']) if item['before'] is not None else b''
              lines = before.decode('utf-8').splitlines(keepends=True)
              previous = 0
              for first, last, replacement in item['edits']:
                  assert isinstance(first, int) and isinstance(last, int) and isinstance(replacement, str)
                  assert previous <= first <= last <= len(lines)
                  previous = last
              for first, last, replacement in reversed(item['edits']):
                  lines[first:last] = replacement.splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert len(after) == item['size'] and identity(after) == item['after']
              prepared.append((item['path'], item['after'], after))
          assert sum(len(data) for _, _, data in prepared) < 250000
          # No repository code is executed, and this publisher never writes a ref.
          result = []
          for path, sha, after in prepared:
              actual = request(data=after)
              assert actual['sha'] == sha
              result.append({'path': path, 'sha': sha, 'bytes': len(after)})
          print('PUBLISHED_BYTES=' + json.dumps(result, sort_keys=True))
          PY
