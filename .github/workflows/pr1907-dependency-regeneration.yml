name: PR 1907 dependency regeneration
on:
  push:
    branches: [ci/pr1907-dependency-regeneration-20261114]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: cc11bc216ca92f898edecb9015e3dcf76993dddd
          persist-credentials: false
      - name: Retain the exact reviewed source before generation
        run: |
          mkdir -p "$RUNNER_TEMP/pr1907-dependencies"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/pr1907-dependencies/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/pr1907-dependencies/source-revision.txt"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
      - name: Regenerate the four affected Rust locks without running project code
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1907-dependencies'
          cases = [('Cargo.toml', '1.1.5'),
                   ('crates/vendor/wasmtime/Cargo.toml', '1.1.4'),
                   ('crates/vendor/wasmtime-cache/Cargo.toml', '1.1.4'),
                   ('tools/native-fixture/Cargo.toml', '1.1.5')]
          report = []
          for manifest, old in cases:
              lock = pathlib.Path(manifest).with_name('Cargo.lock')
              before = lock.read_bytes()
              command = ['cargo', 'update', '--manifest-path', manifest,
                         '--package', 'rustix@' + old, '--precise', '1.1.6']
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      timeout=150, check=False)
              after = lock.read_bytes()
              target = out / 'generated' / lock
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(after)
              target.with_suffix('.log').write_bytes(result.stdout)
              row = dict(manifest=manifest, command=command, status=result.returncode,
                         beforeSha256=hashlib.sha256(before).hexdigest(),
                         afterSha256=hashlib.sha256(after).hexdigest())
              report.append(row)
              print(json.dumps(row))
          (out / 'rust-lock-report.json').write_text(json.dumps(report, indent=2) + '\n')
          (out / 'rust-locks.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          PY
      - name: Retain official dependency metadata for review
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1907-dependencies'
          urls = {
              'rustix-1.1.6.json': 'https://crates.io/api/v1/crates/rustix/1.1.6',
              'fast-xml-parser-5.12.0.json': 'https://registry.npmjs.org/fast-xml-parser/5.12.0',
              'dotnet-8-releases.json': 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json',
              'go-advisory.json': 'https://vuln.go.dev/ID/GO-2026-6859.json',
          }
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'LSF-dependency-repair-review'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read(8 * 1024 * 1024 + 1)
                  if len(data) > 8 * 1024 * 1024:
                      raise ValueError('metadata exceeds bounded input')
                  json.loads(data)
                  (out / name).write_bytes(data)
              except Exception as error:
                  (out / (name + '.error')).write_text(str(error) + '\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1907-dependency-regeneration
          path: ${{ runner.temp }}/pr1907-dependencies
          if-no-files-found: error
          retention-days: 3
