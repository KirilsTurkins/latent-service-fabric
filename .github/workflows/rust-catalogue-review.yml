name: Review retained Rust catalogue sources
on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-catalogue-review.yml', 'tools/rust_catalogue_review_generated.py']
permissions:
  contents: write
  actions: read
jobs:
  review-sources:
    name: Reproduce and store only independently reviewed catalogue blobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: 3.13.5
      - name: Fetch immutable source and install existing locked dependencies
        run: |
          git fetch --no-tags --depth=1 origin 72707ee61ce4784f7c866f2835f474554df8d922
          python3 -m pip install -r tools/requirements.lock
      - name: Download the exact retained failed compiler observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, urllib.error
          base = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          run = api('actions/runs/41219448914')
          assert run['head_sha'] == '72707ee61ce4784f7c866f2835f474554df8d922'
          assert run['event'] == 'push' and run['status'] == 'completed' and run['conclusion'] == 'failure'
          assert run['path'] == '.github/workflows/rust-owned-thread-inputs.yml' and run['run_attempt'] == 1
          row = api('actions/artifacts/13049262956')
          assert row['workflow_run']['id'] == run['id'] and not row['expired']
          assert row['size_in_bytes'] == 52711306
          digest = '1fb393cb5c05aa72852be342449bb0c12cff6923f32f76c79af6ac18f953c5ca'
          assert row['digest'] == 'sha256:' + digest
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base + 'actions/artifacts/13049262956/zip', headers=headers), timeout=30)
          except urllib.error.HTTPError as error:
              assert error.code == 302
              url = error.headers['Location']
          else:
              raise AssertionError('expected artifact redirect')
          assert url.startswith('https://')
          # The installation token is never forwarded to the artifact host.
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(52711307)
          assert len(raw) == 52711306 and hashlib.sha256(raw).hexdigest() == digest
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'catalogue-origin.zip').write_bytes(raw)
          PY
      - name: Verify all 239 Git inputs and regenerate outside the tracked tree
        run: >-
          python3 -B tools/rust_catalogue_review_generated.py
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP/catalogue-origin.zip"
          "$RUNNER_TEMP/catalogue-candidate" --check-git-source
      - name: Store only the ten pre-reviewed exact blobs without changing a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          prefix = 'crates/latent-component-threading/src/'
          expected = {
              'tools/rust_thread_host_catalogue.py': 'e637ac3dfebe280e8f300d84f9441a4d017f6973396bee8047c1d9f4fc7f6d67',
              prefix + 'rust_catalogue.rs': '22f15eaffd568c260c3e515fc294bb90fdd06bdf7c0f1ddf79c4e767ae47462d',
              prefix + 'rust_objects.rs': '98926b78f4d1e4e84032748b1664ed2dfa6e1fd9297936234b602cad1d61256b',
              prefix + 'rust_component.rs': '4a2fd98af2dd2c0f3d883c64907adf17b8ed5290cffeb9660174e1e44de8818d',
              prefix + 'rust_catalogue/original-body-image.bin': 'eca9883441a2e8ef0b4ea721c53932866d117503382c6e8805cb7d7661fd1b8b',
              prefix + 'rust_catalogue/catalogue-original-core.wasm': '8cd26a5f34ec90f23af43dfcb21b0b619b369ed2199a5368a24572bb96cbf177',
              prefix + 'rust_catalogue/catalogue-normal-component.wasm': '0d66c4828a608e9ec0048205ac6f38539e417f62dbdaeb6b7bdc245aa1c073c8',
              prefix + 'rust_catalogue/origin.json': '3496ab40d1dd467fe03a725bdf4899eec010e7c8f8cb238ad8abb9788dfaf77a',
              'tools/tests/test_rust_thread_host_catalogue.py': 'b73fd280415eb4a5446b9dab532b33b181b098115285e6190affd6730552b892',
              'tools/ci/contracts/python/test_rust_thread_host_catalogue.py.json': 'fe9f778f7bd143f8997103700c0c1262826b1ba58adea94c75e02c751b38f2c4',
          }
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'catalogue-candidate'
          inventory = json.loads((root / 'reviewed-files.json').read_bytes())
          assert set(inventory) == set(expected)
          contents = {name: (root / name).read_bytes() for name in expected}
          assert sum(map(len, contents.values())) <= 4 * 1024 * 1024
          for name, raw in contents.items():
              assert hashlib.sha256(raw).hexdigest() == expected[name], name
              assert inventory[name]['bytes'] == len(raw)
              assert inventory[name]['gitBlob'] == hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          stored = {}
          for name, raw in contents.items():
              data = json.dumps({'encoding': 'base64', 'content': base64.b64encode(raw).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs', data=data, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)
              assert value['sha'] == inventory[name]['gitBlob']
              stored[name] = value['sha']
          (root / 'stored-blobs.json').write_text(json.dumps(stored, indent=2) + '\n')
          print(json.dumps(stored, indent=2))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: rust-catalogue-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/catalogue-candidate/**
          retention-days: 3
          if-no-files-found: error
