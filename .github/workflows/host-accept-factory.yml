name: Host-to-host accept-factory native ownership
on:
  push:
    branches: ['feat/sdk-745-host-accept-factory-20261105']
    paths:
      - '.github/workflows/host-accept-factory.yml'
      - 'crates/vendor/wasmtime/**'
      - 'crates/latent-wasmtime/**'
      - 'tools/qualify_host_accept_factory.py'
      - 'tools/qualify_stream_outers.py'
      - 'tools/host_codec_wasmtime.py'
      - 'tools/ci_rust_artifacts.py'
      - 'tools/toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
permissions:
  contents: read
concurrency:
  group: host-accept-factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ownership:
    name: Check host accept factory admission and physical retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v3-contract-profiles
          shared-key: host-contracts
          key: ubuntu-24.04
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/wasm32-wasip2
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Run exact source-bound ownership controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_host_accept_factory_owner -v
          timeout --signal=TERM --kill-after=10s 2400s python3 -B tools/qualify_host_accept_factory.py --source-commit "${{ github.sha }}" --output "$RUNNER_TEMP/host-accept-factory"
      - name: Retain the finite ownership observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: host-accept-factory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/host-accept-factory/receipt.json
            ${{ runner.temp }}/host-accept-factory/FAILED.json
            ${{ runner.temp }}/host-accept-factory/source-inputs.json
            ${{ runner.temp }}/host-accept-factory/commands.json
            ${{ runner.temp }}/host-accept-factory/commands/logs/*.txt
            ${{ runner.temp }}/host-accept-factory/fixtures/native-stream-outers.wasm
          if-no-files-found: warn
          retention-days: 3
