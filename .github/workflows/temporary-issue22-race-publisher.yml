name: Publish Issue 22 runner race coverage

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write

concurrency:
  group: issue-22-runner-race-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-22-containment-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-containment-runner
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Materialize race tests and align documentation
        shell: bash
        run: |
          set -euo pipefail
          echo "0a766aaee99890626169d0f552e5fc4e1b79c9f8338642e3772e35b67199cb48  .github/issue22-race-tests-v2.rs.gz.b64" | sha256sum --check
          base64 --decode .github/issue22-race-tests-v2.rs.gz.b64 | gzip --decompress > crates/latent-node/tests/activation_runner_races.rs

          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/development/activation-containment.md")
          source = path.read_text(encoding="utf-8")
          old = (
              "Runner and containment unit tests additionally cover queue bias, "
              "cancellation/deadline versus completion, cancellation/deadline versus fuel "
              "exhaustion, registration removal, disposition failure precedence, "
              "first-stop-cause stickiness, and the memory-before-fuel-before-trap classifier."
          )
          new = (
              "Barrier-controlled runner integration tests cover the queue's cancellation-before-"
              "deadline-before-grant bias, cancellation and deadline at backend-result handoff for "
              "both completion and fuel exhaustion, cancellation accepted after handoff but before "
              "registration removal, and release/quarantine failure precedence with the mapped "
              "consumption preserved. Containment unit tests cover first-stop-cause stickiness and "
              "the memory-before-fuel-before-trap classifier."
          )
          if source.count(old) != 1:
              raise SystemExit("unexpected containment coverage sentence count")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          rm -f .github/lsf22-correction.patch.gz.b64
          rm -f .github/issue22-race-tests.rs.gz.b64
          rm -f .github/issue22-race-tests-v2.rs.gz.b64
          rm -f .github/workflows/temporary-issue22-race-fix.yml
          rm -f .github/workflows/temporary-issue22-race-publisher.yml
      - name: Format and validate runner races
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test -p latent-node --lib --locked
          cargo test -p latent-node --test activation_runner --locked
          cargo test -p latent-node --test activation_runner_races --locked
          cargo clippy -p latent-node --all-targets --locked
      - name: Publish validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test: cover activation runner precedence races"
          git push origin HEAD:feat/issue-22-containment-runner
