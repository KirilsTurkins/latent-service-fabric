name: Rust ordinary HTTP isolated owner limits

on:
  workflow_dispatch:
  push:
    branches: ['feat/rust-http-runtime-limits-20261021']
    paths:
      - '.github/workflows/rust-wasi-http-limits.yml'
      - 'tools/qualify_rust_wasi_http_limits.py'
      - 'tools/rust_wasi_http_limit_node.py'
      - 'tools/tests/test_rust_wasi_http_limits.py'
      - 'tools/tests/fixtures/rust-http-limit-model-inputs.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-wasi-http-limits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  individual-limits:
    name: Original guest with three isolated ceilings and fresh reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: '3.13'
      - name: Install only the existing pinned Python controller dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Fetch exact original compiler and native source objects without compilation
        run: >-
          git fetch --no-tags --depth=1 origin
          88b3c9c1d305eb8e308a7187600f782163bc6131
          c7134289f446cb3171eb0ffd800a94afc2a5209f
      - name: Check six strict limit and primary failure controls
        run: python3 -B -m unittest tools.tests.test_rust_wasi_http_limits -v
      - name: Restore only the fixed original public compiled guest artifact
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wasi-http-runtime-88b3c9c1d305eb8e308a7187600f782163bc6131
          run-id: '39623507324'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-http-original
      - name: Authenticate unchanged original native products without another host build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/activation_stack_native_products.py --output "$RUNNER_TEMP/rust-http-native"
      - name: Re-sign the original component and execute only nine isolated limit attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_rust_wasi_http_limits.py
          --original-artifact "$RUNNER_TEMP/rust-http-original"
          --native-products "$RUNNER_TEMP/rust-http-native"
          --output "$RUNNER_TEMP/rust-http-limits"
      - name: Retain exact ancestry and bounded original public outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wasi-http-limits-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-limits/*.json
            ${{ runner.temp }}/rust-http-limits/build/*.json
            ${{ runner.temp }}/rust-http-limits/build/*.wasm
            ${{ runner.temp }}/rust-http-limits/build/wit/**
            ${{ runner.temp }}/rust-http-limits/node/*.json
            ${{ runner.temp }}/rust-http-limits/node/*/*.json
            ${{ runner.temp }}/rust-http-limits/node/*/examples-controls/*.json
            ${{ runner.temp }}/rust-http-limits/node/*/foreign-controls/*.json
          if-no-files-found: warn
          retention-days: 1
