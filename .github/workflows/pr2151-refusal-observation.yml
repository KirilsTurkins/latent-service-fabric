name: PR 2151 refusal observation
on:
  push:
    branches: [diagnostic/pr2151-merge-20261122]
    paths: [.github/workflows/pr2151-refusal-observation.yml]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 3aabc54bf09040919f4b306f0009b5bcc1b5fb88
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce
        with:
          version: 1.254.0
      - name: Install original compiler prerequisites
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/fetch-tools"
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: typescript-fetch-native-input-3aabc54bf09040919f4b306f0009b5bcc1b5fb88
          path: ${{ runner.temp }}/fetch-native
          github-token: ${{ github.token }}
          run-id: 44895651909
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: typescript-fetch-engine-input-3aabc54bf09040919f4b306f0009b5bcc1b5fb88
          path: ${{ runner.temp }}/fetch-engine
          github-token: ${{ github.token }}
          run-id: 44895651909
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: typescript-source-splicer-input-3aabc54bf09040919f4b306f0009b5bcc1b5fb88
          path: ${{ runner.temp }}/fetch-splicer
          github-token: ${{ github.token }}
          run-id: 44895651909
      - name: Retain original programme failure with finite diagnostic detail only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from tools import qualify_typescript_fetch_runtime as run
          temp = Path(os.environ['RUNNER_TEMP'])
          original_project = run.project
          def diagnostic_project(directory):
              app = original_project(directory)
              path = app/'src/main.ts'
              source = path.read_text()
              before = hashlib.sha256(source.encode()).hexdigest()
              old = "throw new Error('abort-fanout-refusal-mutated-state');"
              assert source.count(old) == 1
              source = source.replace(old, "throw new Error(!abortDenied ? 'abort-fanout-refusal-missing' : 'abort-fanout-refusal-mutated-state');")
              old = "return `diagnostic:abort-fanout:${stage}:${cause}`;"
              assert source.count(old) == 1
              source = source.replace(old, "const allowed = ['abort-fanout-fill-boundary-missing', 'abort-fanout-refusal-missing', 'abort-fanout-refusal-mutated-state', 'activation-runtime-promise-native-register-denied:2']; const detail = error instanceof Error && allowed.includes(error.message) ? error.message : (error instanceof Error ? 'other-error' : 'non-error'); return `diagnostic:abort-fanout:${stage}:${cause}:${detail}`;")
              path.write_text(source)
              lock = json.loads((app/'sdk-lock.json').read_text())
              lock['template']['sourceDigest'] = run.digest(path.read_bytes())
              (app/'sdk-lock.json').write_text(json.dumps(lock, indent=2)+'\n')
              run.validate(run.snapshot(app))
              (temp/'diagnostic-source.json').write_text(json.dumps({'qualification':False,'originalSource':before,'diagnosticSource':hashlib.sha256(source.encode()).hexdigest(),'sourceChanges':'finite failure labels only; original control flow and budgets retained'})+'\n')
              return app
          run.project = diagnostic_project
          try:
              run.qualify(temp/'refusal-observation',temp/'fetch-tools',temp/'fetch-engine',temp/'fetch-splicer',prepared=temp/'fetch-native')
          except Exception as error:
              print('Diagnostic stopped:', type(error).__name__)
              raise
          finally:
              assert not os.system('git diff --exit-code --quiet')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        if: always()
        with:
          name: pr2151-refusal-observation
          path: |
            ${{ runner.temp }}/diagnostic-source.json
            ${{ runner.temp }}/refusal-observation/FAILED.json
            ${{ runner.temp }}/refusal-observation/node/FAILED.json
            ${{ runner.temp }}/refusal-observation/node/controls/fetch-abort-fanout*.json
            ${{ runner.temp }}/refusal-observation/node/after-failed-*.json
            ${{ runner.temp }}/refusal-observation/build/BUILD-*.json
            ${{ runner.temp }}/refusal-observation/build/compiler/*.log
            ${{ runner.temp }}/refusal-observation/build/logs/*.log
          if-no-files-found: warn
          retention-days: 3
