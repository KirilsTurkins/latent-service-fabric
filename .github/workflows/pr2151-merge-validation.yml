name: Isolated PR 2151 exact merge validation
on:
  push:
    branches: ['work/pr2151-merge-qualification-20261122']
    paths: ['.github/workflows/pr2151-merge-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      manifest_sha256: ${{ steps.validate.outputs.manifest_sha256 }}
      tree: ${{ steps.validate.outputs.tree }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: f881e760dfb527e341b2b43b60d99f217ad2d8ae
          fetch-depth: 0
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Install locked validator prerequisites
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Merge exact parents and validate source
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, sys, urllib.request, zlib
          repo = 'KirilsTurkins/latent-service-fabric'
          head = 'f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          dev = '5569a03df63cac133146eee2680223ea3a1a3dc7'
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr2151-validation'
          out.mkdir()
          encoded = ''
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '74246b21c81a4cbe24504d86926222b478745c412ee4eb7fd0c62111194ea56a'
          data = json.loads(raw)
          assert data['head'] == head and data['development'] == dev
          (out / 'resolution.json').write_bytes(raw)
          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check, capture_output=True).stdout
          def digest(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          def current(branch):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/ref/heads/' + branch,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)['object']['sha']
          assert current('fix/sdk-java-cached-idle-handoff-20261117') == head
          assert current('development') == dev
          assert git('rev-parse', 'HEAD').decode().strip() == head
          assert git('merge-base', head, dev).decode().strip() == data['commonAncestor']
          subprocess.run(['git', 'config', 'user.name', 'LSF merge validation'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'validation@localhost'], check=True)
          merge = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', dev], capture_output=True)
          (out / 'merge.log').write_bytes(merge.stdout + merge.stderr)
          print(merge.stdout.decode(errors='replace'), flush=True)
          assert merge.returncode in (0, 1), merge.stderr.decode(errors='replace')
          assert git('rev-parse', 'MERGE_HEAD').decode().strip() == dev
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').decode().splitlines())
          assert conflicts <= set(data['resolvedConflicts']), sorted(conflicts)
          for entry in data['entries']:
              name = entry['path']
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert entry['ref'] in (head, dev)
              before = git('show', entry['ref'] + ':' + name)
              assert digest(before) == entry['pre'], ('preimage', name, digest(before))
              lines = before.splitlines(keepends=True)
              offset, pieces = 0, []
              for start, end, encoded_insert in entry['ops']:
                  assert offset <= start <= end <= len(lines)
                  pieces += lines[offset:start]
                  pieces.append(base64.b64decode(encoded_insert, validate=True))
                  offset = end
              after = b''.join(pieces + lines[offset:])
              assert digest(after) == entry['post'], ('postimage', name)
              assert hashlib.sha256(after).hexdigest() == entry['sha256']
              target = root / name
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(after)
              git('add', '--', name)
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          for key, ref in [('preserveOurs', head), ('preserveDevelopment', dev)]:
              for name in data[key]:
                  assert (root / name).read_bytes() == git('show', ref + ':' + name), ('protected', name)
          git('diff', '--cached', '--check')
          (out / 'merge.patch').write_bytes(git('diff', '--cached', dev))
          expected_tree = git('write-tree').decode().strip()
          git('commit', '-m', 'Local exact-parent PR 2151 merge validation; not a production publication')
          assert git('show', '-s', '--format=%P', 'HEAD').decode().split() == [head, dev]
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == expected_tree
          os.environ['LSF_PYTHON_POLICY_BASE'] = dev
          for index, command in enumerate(data['validationCommands'] + [
                  [sys.executable, '-B', 'tools/validate_repository.py'],
                  [sys.executable, '-B', 'tools/ci_coverage.py']]):
              argv = [sys.executable if value == '{python}' else value for value in command]
              print('VALIDATION', index, argv[:6], flush=True)
              with (out / ('validation-%02d.log' % index)).open('wb') as log:
                  result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, timeout=600)
              text = (out / ('validation-%02d.log' % index)).read_text(errors='replace')
              print(text[-5000:], flush=True)
              assert result.returncode == 0, ('validation-failed', index)
              if index in (1, 2, 3):
                  assert 'skipped=' not in text, ('unexpected-skip', index)
          assert not git('diff', 'HEAD', '--').strip(), 'source changed during validation'
          assert current('fix/sdk-java-cached-idle-handoff-20261117') == head
          assert current('development') == dev
          entries = []
          changed = git('diff', '--name-only', '--no-renames', '-z', dev, 'HEAD').split(b'\0')
          for raw_name in changed:
              if not raw_name:
                  continue
              name = raw_name.decode()
              rows = git('ls-tree', 'HEAD', '--', name).decode().splitlines()
              if not rows:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, kind, sha = rows[0].split('\t')[0].split()
              assert kind == 'blob' and mode in ('100644', '100755')
              content = git('show', 'HEAD:' + name)
              assert digest(content) == sha
              entries.append({'path': name, 'mode': mode, 'type': kind, 'sha': sha,
                  'bytes': len(content), 'sha256': hashlib.sha256(content).hexdigest(),
                  'content': base64.b64encode(content).decode()})
          publication = {'schema': 1, 'head': head, 'development': dev,
              'baseTree': git('rev-parse', dev + '^{tree}').decode().strip(),
              'expectedTree': expected_tree, 'entries': entries, 'conflicts': sorted(conflicts)}
          wire = json.dumps(publication, separators=(',', ':')).encode()
          (out / 'publication.json').write_bytes(wire)
          print('VALIDATED_PUBLICATION', json.dumps({'tree': expected_tree, 'entries': len(entries),
              'bytes': len(wire), 'sha256': hashlib.sha256(wire).hexdigest(), 'conflicts': sorted(conflicts)}), flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('manifest_sha256=' + hashlib.sha256(wire).hexdigest(), file=output)
              print('tree=' + expected_tree, file=output)
      - name: Retain merge and validation evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-exact-merge
          path: ${{ runner.temp }}/pr2151-validation/
          retention-days: 7
          if-no-files-found: error
  publish-tree:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: pr2151-exact-merge
          path: ${{ runner.temp }}/pr2151-publication
      - name: Authenticate and publish only Git objects without executing repository code
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST: ${{ needs.validate.outputs.manifest_sha256 }}
          EXPECTED_TREE: ${{ needs.validate.outputs.tree }}
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          repo = 'KirilsTurkins/latent-service-fabric'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr2151-publication' / 'publication.json'
          raw = path.read_bytes()
          assert len(raw) < 2000000
          assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_MANIFEST']
          data = json.loads(raw)
          assert data['head'] == 'f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          assert data['development'] == '5569a03df63cac133146eee2680223ea3a1a3dc7'
          assert data['expectedTree'] == os.environ['EXPECTED_TREE']
          assert data['baseTree'] == '4ec97c17c33c01fe5ff723945765d57a2b85d67a'
          assert 1 <= len(data['entries']) <= 160
          api = 'https://api.github.com/repos/' + repo
          def call(endpoint, value=None):
              request = urllib.request.Request(api + endpoint,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert call('/git/ref/heads/fix/sdk-java-cached-idle-handoff-20261117')['object']['sha'] == data['head']
          assert call('/git/ref/heads/development')['object']['sha'] == data['development']
          seen, tree = set(), []
          for row in data['entries']:
              name = row['path']; p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and name not in seen
              seen.add(name)
              assert row['type'] == 'blob' and row['mode'] in ('100644', '100755')
              if row['sha'] is not None:
                  content = base64.b64decode(row['content'], validate=True)
                  assert len(content) == row['bytes'] and len(content) < 500000
                  assert hashlib.sha256(content).hexdigest() == row['sha256']
                  expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  assert expected == row['sha']
                  actual = call('/git/blobs', {'content': row['content'], 'encoding': 'base64'})['sha']
                  assert actual == expected
              tree.append({k: row[k] for k in ('path', 'mode', 'type', 'sha')})
          result = call('/git/trees', {'base_tree': data['baseTree'], 'tree': tree})
          assert result['sha'] == data['expectedTree'], ('tree mismatch', result['sha'])
          receipt = {k: data[k] for k in ('head','development','baseTree','expectedTree','conflicts')}
          receipt['entries'] = tree
          receipt['manifestSha256'] = os.environ['EXPECTED_MANIFEST']
          receipt['productionRefMoved'] = False
          path.with_name('published-tree.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('PUBLISHED_EXACT_TREE', json.dumps(receipt), flush=True)
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-published-tree
          path: ${{ runner.temp }}/pr2151-publication/published-tree.json
          retention-days: 7
          if-no-files-found: error
