name: Isolated PR 2151 exact merge validation
on:
  push:
    branches: ['work/pr2151-merge-qualification-20261122']
    paths: ['.github/workflows/pr2151-merge-validation.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: f881e760dfb527e341b2b43b60d99f217ad2d8ae
          fetch-depth: 0
          persist-credentials: false
      - name: Capture three immutable trees and actual conflict stages
        shell: python {0}
        run: |
          import hashlib, json, os, pathlib, subprocess
          head = 'f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          dev = '5569a03df63cac133146eee2680223ea3a1a3dc7'
          base = '57d4a349dbb70c2511be1cd15f41e5915d6ba5b9'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr2151-exact-inputs'
          out.mkdir()
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == head
          assert git('merge-base', head, dev).decode().strip() == base
          refs = {}
          for label, commit in [('head',head),('development',dev),('base',base)]:
              tree = git('rev-parse', commit + '^{tree}').decode().strip()
              raw = git('cat-file','commit',commit)
              assert hashlib.sha1(b'commit '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == commit
              (out / (label+'.commit')).write_bytes(raw)
              refs[label] = {'commit':commit,'tree':tree}
          with (out/'trees.pack').open('wb') as file:
              subprocess.run(['git','pack-objects','--stdout','--revs'],
                  input=('\n'.join(row['tree'] for row in refs.values())+'\n').encode(),
                  stdout=file, check=True, timeout=300)
          subprocess.run(['git','config','user.name','LSF merge input capture'],check=True)
          subprocess.run(['git','config','user.email','capture@localhost'],check=True)
          merge = subprocess.run(['git','merge','--no-commit','--no-ff',dev],capture_output=True)
          assert merge.returncode in (0,1)
          assert git('rev-parse','MERGE_HEAD').decode().strip() == dev
          (out/'merge.log').write_bytes(merge.stdout+merge.stderr)
          conflicts = git('ls-files','--unmerged','-z')
          (out/'conflicts.index').write_bytes(conflicts)
          (out/'merge-index.txt').write_bytes(git('ls-files','--stage','-z'))
          print((merge.stdout+merge.stderr).decode(errors='replace'))
          manifest={'schema':1,'refs':refs,'gitVersion':git('--version').decode().strip(),'files':{}}
          for path in sorted(out.iterdir()):
              h=hashlib.sha256()
              with path.open('rb') as file:
                  for block in iter(lambda:file.read(1024*1024),b''):h.update(block)
              manifest['files'][path.name]={'bytes':path.stat().st_size,'sha256':h.hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest),flush=True)
      - name: Retain exact source objects only
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-exact-inputs
          path: ${{ runner.temp }}/pr2151-exact-inputs/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
