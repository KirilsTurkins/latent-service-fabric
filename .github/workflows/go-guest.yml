      - tools/tests/test_go_proxy_tls.py
      - tools/tests/test_go_private_proxy.py
      - tools/tests/test_go_native_authoring.py
      - tools/tests/test_go_dependency_authoring.py
      - tools/guest_authoring_frontend.py
      - tools/go_dependency_fixture.py
      - tools/go_dependency_recovery.py
      - tools/tests/test_go_dependency_recovery.py
      - tools/application_dependenc*.py
      - tools/captured_compiler_isolation.py
      - tools/probe_go_authoring.py
      - tools/qualify_go_capsules.py
      - tools/qualify_go_activation.py
      - tools/qualify_go_http_context.py
      - tools/tests/test_go_http_context.py
      - tools/tests/test_go_managed_idle.py
      - docs/development/go-managed-idle.md
      - tools/tests/test_go_standard_http.py
      - tools/go_standard_http_node.py
      - tools/go_standard_http_project.py
      - tools/qualify_go_standard_http.py
      - tools/qualify_go_standard_logging.py
      - tools/go_standard_logging_probe.py
      - tools/tests/test_go_standard_logging.py
      - tools/qualify_go_http_libraries.py
      - tools/go_http_library_fixture.py
