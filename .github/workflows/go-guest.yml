            ${{ runner.temp }}/go-entropy-retained/current-host.json
            ${{ runner.temp }}/go-entropy-retained/current-latentd
            ${{ runner.temp }}/go-entropy-retained/capture.json
            ${{ runner.temp }}/go-entropy-retained/build/*.json
            ${{ runner.temp }}/go-entropy-retained/build/component.wasm
            ${{ runner.temp }}/go-entropy-retained/logs/**
            ${{ runner.temp }}/go-entropy-retained/node-normal/workflow.json
            ${{ runner.temp }}/go-entropy-retained/node-normal/FAILED.json
            ${{ runner.temp }}/go-entropy-retained/node-normal/controls/*.json
            ${{ runner.temp }}/go-entropy-retained/node-entropy/workflow.json
            ${{ runner.temp }}/go-entropy-retained/node-entropy/FAILED.json
            ${{ runner.temp }}/go-entropy-retained/node-entropy/controls/*.json
          if-no-files-found: warn
