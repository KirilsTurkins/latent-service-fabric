      - tools/tests/fixtures/go-standard-http/**
      - tools/tests/fixtures/go-http-context/**
      - tools/qualify_go_runtime_dependencies.py
      - tools/diagnose_go_timer_failure.py
      - tools/diagnose_go_entry.py
      - tools/tests/test_go_entry_differential.py
      - tools/diagnose_go_entry_frames.py
      - tools/tests/test_go_entry_frames.py
      - tools/qualify_go_runtime_dependencies.py
      - tools/qualify_rust_capsules.py
      - tools/*rust_capsule*.py
      - tools/guest_runtime_grants.py
      - tools/tests/test_go_capsule_authoring.py
      - tools/tests/test_go_application_dependencies.py
      - tools/tests/test_build_provenance_schemas.py
      - schemas/**
      - docs/component-development/go-authoring.md
      - docs/component-development/go-dependencies.md
      - docs/component-development/go-standard-logging.md
      - docs/development/go-capsule-qualification.md
      - docs/development/go-http-context-cancellation.md
      - crates/latent-wasmtime/**
      - crates/latent-control-store/**
      - crates/latent-artifacts/**
      - crates/latent-policy/**
      - crates/latent-packaging/**
      - .cargo/managed-guest.toml
      - tools/build_go_guest_capsules.py
      - apps/latentd/**
      - crates/latent-signing/**
      - crates/latent-wasmtime/examples/go_runtime_probe.rs
      - wit/**
      - tools/toolchain.toml
      - .github/workflows/go-guest.yml
  push:
    branches: [development]
    paths:
      - sdk/go-guest/**
      - sdk/transaction-contract/**
      - tools/qualify_transaction_contracts.py
      - 'tools/compile_transaction_guests.py'
      - 'tools/transaction_guest_project.py'
      - 'tools/transaction_guest_variants.py'
      - 'tools/tests/test_transaction_guest_authoring.py'
      - 'tools/tests/test_transaction_guest_compilers.py'
      - 'examples/rust-capsules/transactional-aggregate/**'
      - tools/go_guest/**
      - tools/go_capsule*.py
      - tools/go_application_dependencies.py
      - tools/go_dependency_authoring.py
      - tools/go_native_authoring.py
      - tools/go_proxy_tls.py
      - tools/go_private_proxy_fixture.py
      - tools/go_generator_fixture.py
      - tools/tests/test_go_generator_fixture.py
      - tools/tests/test_go_generator_authoring.py
      - tools/qualify_go_private_dependencies.py
      - tools/replay_go_dependencies.py
      - tools/tests/test_go_dependency_replay.py
      - docs/development/go-dependency-replay.md
      - tools/tests/test_go_proxy_tls.py
      - tools/tests/test_go_private_proxy.py
      - tools/tests/test_go_native_authoring.py
      - tools/tests/test_go_dependency_authoring.py
      - tools/guest_authoring_frontend.py
      - tools/go_dependency_fixture.py
      - tools/go_dependency_recovery.py
      - tools/tests/test_go_dependency_recovery.py
      - tools/application_dependenc*.py
      - tools/captured_compiler_isolation.py
      - tools/probe_go_authoring.py
      - tools/qualify_go_capsules.py
      - tools/qualify_go_activation.py
      - tools/qualify_go_http_context.py
      - tools/tests/test_go_http_context.py
      - tools/tests/test_go_managed_idle.py
      - docs/development/go-managed-idle.md
      - tools/tests/test_go_standard_http.py
      - tools/go_standard_http_node.py
      - tools/go_standard_http_project.py
      - tools/qualify_go_standard_http.py
      - tools/qualify_go_standard_logging.py
      - tools/go_standard_logging_probe.py
      - tools/tests/test_go_standard_logging.py
      - tools/qualify_go_http_libraries.py
      - tools/go_http_library_fixture.py
      - tools/go_http_library_reference.py
      - tools/tests/test_go_http_libraries.py
      - tools/tests/test_go_standard_http_gate.py
      - tools/tests/fixtures/go-standard-http/**
      - tools/tests/fixtures/go-http-context/**
      - tools/qualify_go_runtime_dependencies.py
      - tools/diagnose_go_timer_failure.py
      - tools/diagnose_go_entry.py
      - tools/tests/test_go_entry_differential.py
      - tools/diagnose_go_entry_frames.py
      - tools/tests/test_go_entry_frames.py
      - tools/qualify_go_runtime_dependencies.py
      - tools/qualify_rust_capsules.py
      - tools/*rust_capsule*.py
      - tools/guest_runtime_grants.py
      - tools/tests/test_go_capsule_authoring.py
      - tools/tests/test_go_application_dependencies.py
      - tools/tests/test_build_provenance_schemas.py
      - schemas/**
      - docs/component-development/go-authoring.md
      - docs/component-development/go-dependencies.md
      - docs/component-development/go-standard-logging.md
      - docs/development/go-capsule-qualification.md
      - docs/development/go-http-context-cancellation.md
      - crates/latent-wasmtime/**
      - crates/latent-control-store/**
      - crates/latent-artifacts/**
      - crates/latent-policy/**
      - crates/latent-packaging/**
      - .cargo/managed-guest.toml
      - tools/build_go_guest_capsules.py
      - apps/latentd/**
      - crates/latent-signing/**
      - crates/latent-wasmtime/examples/go_runtime_probe.rs
      - wit/**
      - tools/toolchain.toml
      - .github/workflows/go-guest.yml
  workflow_dispatch:
    inputs:
      fast_dependency_replay:
        description: Reuse only exact source-bound native products for a fresh dependency replay
        type: boolean
        default: false
      replay_campaign:
        description: Independent private-feed and approved-generator campaigns
        type: choice
        options: [both, private, generator]
        default: both

permissions:
  contents: read

concurrency:
  group: go-guest-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  upstream-probe:
    if: ${{ !inputs.fast_dependency_replay }}
    name: Go runtime and complete capsule qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture immutable qualification source inputs
        shell: bash
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/go-guest-source.tar.gz" HEAD -- \
            apps sdk/go-guest sdk/rust examples tools crates wit schemas docs .cargo \
            Cargo.toml Cargo.lock rust-toolchain.toml LICENSE NOTICE .github/workflows/go-guest.yml
          test "$(stat --format=%s "$RUNNER_TEMP/go-guest-source.tar.gz")" -le 134217728
          git rev-parse HEAD > "$RUNNER_TEMP/go-guest-source.sha"
      - name: Retain the exact reviewed command contract input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-guest-command-contract-${{ github.sha }}
          path: |
            tools/ci/contracts/
            ${{ runner.temp }}/go-guest-source.tar.gz
            ${{ runner.temp }}/go-guest-source.sha
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install captured Go compiler namespace
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install the locked compiler and generator
        run: |
          set -euo pipefail
          cargo install --git https://github.com/bytecodealliance/componentize-go --rev 148dba505f8c6c64ad84db777cfde5e34e25098b --locked componentize-go
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          mkdir -p "$RUNNER_TEMP/go-guest-tools"
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/go-guest-tools/go.tar.gz" https://dl.google.com/go/go1.27.2.linux-amd64.tar.gz
          echo "ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5  $RUNNER_TEMP/go-guest-tools/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/go-guest-tools/go.tar.gz" -C "$RUNNER_TEMP/go-guest-tools"
          python3 tools/go_guest/runtime.py --prepare-compiler "$RUNNER_TEMP/go-guest-tools/go" --output "$RUNNER_TEMP/go-guest-tools/go-async"
          echo "$RUNNER_TEMP/go-guest-tools/go-async/bin" >> "$GITHUB_PATH"
      - name: Retain pinned reproduction tools
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-guest-tools"
          cp "$HOME/.cargo/bin/componentize-go" "$(command -v wasm-tools)" "$out/"
          sha256sum "$out/componentize-go" "$out/wasm-tools" > "$out/tools.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-guest-tools-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-guest-tools/go.tar.gz
            ${{ runner.temp }}/go-guest-tools/componentize-go
            ${{ runner.temp }}/go-guest-tools/wasm-tools
            ${{ runner.temp }}/go-guest-tools/tools.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Generate and compile upstream and constrained LSF components
        run: python3 tools/go_guest/probe.py --output "$RUNNER_TEMP/go-guest-probe" --go "$RUNNER_TEMP/go-guest-tools/go-async/bin/go"
      - name: Qualify proposed transaction shapes and explicit owners with the maintained Go compiler
        run: python3 tools/qualify_transaction_contracts.py --language go --output "$RUNNER_TEMP/transaction-contract-go"
      - name: Compile the authored transaction aggregate and forbidden immediate HTTP variant
        run: python3 tools/compile_transaction_guests.py --language go --output "$RUNNER_TEMP/transaction-guests-go"
      - name: Execute the compiled runtime diagnostic without claiming admission
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml run --locked -p latent-wasmtime --example go_runtime_probe -- "$RUNNER_TEMP/go-guest-probe/lsf-candidate.wasm" 2>&1 | tee "$RUNNER_TEMP/go-guest-probe/runtime-diagnostic.log"
      - name: Check standalone project source boundaries and closed provenance
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -m unittest tools.tests.test_go_capsule_authoring tools.tests.test_build_provenance_schemas
      - name: Qualify standard Go activation ownership and result drain
        run: |
          python3 -m unittest tools.tests.test_go_runtime_overlay
          python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-activation"
          LSF_GUEST_SDK_LANGUAGE=go LSF_GO_ACTIVATION_FIXTURE="$RUNNER_TEMP/go-activation" cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::signed_standard_goroutines_sleep_and_drain_use_original_activation_owners -- --ignored --exact --nocapture
      - name: Qualify compiler checkpoints against unchanged CPU source and native Go
        run: |
          python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-checkpoints" --runtime-profile go-component-activation-v2 --fixture checkpoints
          python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-no-checkpoints" --runtime-profile go-component-activation-v1 --fixture checkpoints
          LSF_GUEST_SDK_LANGUAGE=go LSF_GO_CHECKPOINT_FIXTURE="$RUNNER_TEMP/go-checkpoints" LSF_GO_NO_CHECKPOINT_FIXTURE="$RUNNER_TEMP/go-no-checkpoints" cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::signed_compiler_checkpoints_progress_cpu_siblings_and_cancel_original_activation -- --ignored --exact --nocapture
      - name: Compile context-aware typed HTTP ownership without claiming default transport qualification
        run: |
          python3 -m unittest tools.tests.test_go_http_context
          python3 tools/qualify_go_http_context.py --output "$RUNNER_TEMP/go-http-context"
      - name: Compile ordinary default net/http sources through the finite typed backend
        run: |
          python3 -m unittest tools.tests.test_go_standard_http
          python3 tools/qualify_go_http_context.py --output "$RUNNER_TEMP/go-standard-http" --fixture standard-http-conformance
      - name: Qualify standard timer heap callbacks and physical readiness retirement
        id: standard_timers
        run: |
          python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-standard-timers" --runtime-profile go-component-activation-v3 --fixture timers
          LSF_GUEST_SDK_LANGUAGE=go LSF_GO_TIMER_FIXTURE="$RUNNER_TEMP/go-standard-timers" cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::signed_standard_timers_contexts_and_rearm_keep_original_heap_owners -- --ignored --exact --nocapture
      - name: Qualify ordinary module initialization under original activation ownership
        run: |
          python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-owned-initializers" --runtime-profile go-component-activation-v4 --fixture initializers
          LSF_GUEST_SDK_LANGUAGE=go LSF_GO_INITIALIZER_FIXTURE="$RUNNER_TEMP/go-owned-initializers" cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::signed_initializer_goroutines_waits_and_timers_start_inside_original_activation -- --ignored --exact --nocapture
      - name: Qualify original Go maintenance capacity and physical retirement
        run: |
          python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-managed-idle" --runtime-profile go-component-activation-v5 --fixture managed-idle
          LSF_GUEST_SDK_LANGUAGE=go LSF_GO_MANAGED_IDLE_FIXTURE="$RUNNER_TEMP/go-managed-idle" cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::managed_idle::signed_gc_workers_reserve_original_capacity_and_retire_only_after_application_drain -- --ignored --exact --nocapture
      - name: Test captured Go native graphs and namespace
        run: |
          LSF_REQUIRE_COMPILER_ISOLATION=1 python3 -m unittest tools.tests.test_go_application_dependencies tools.tests.test_captured_compiler_isolation
      - name: Qualify published retry workers and default timers in the captured namespace
        run: |
          python3 tools/qualify_go_runtime_dependencies.py --output "$RUNNER_TEMP/go-published-runtime"
          LSF_GUEST_SDK_LANGUAGE=go LSF_GO_PUBLISHED_FIXTURE="$RUNNER_TEMP/go-published-runtime" cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::signed_published_retry_workers_and_default_timers_keep_original_activation_owners -- --ignored --exact --nocapture
      - name: Qualify editable projects, all SDK owners, enforced node and printed guide
        id: normal_go_qualification
        run: |
          python3 tools/qualify_go_capsules.py --output "$RUNNER_TEMP/go-capsule-authoring"
      - name: Check ordinary Go standard logging installation and frozen products
        run: python3 -m unittest tools.tests.test_go_standard_logging -v
      - name: Qualify ordinary captured fmt log and os writes on the signed node
        run: python3 tools/qualify_go_standard_logging.py --native-qualification "$RUNNER_TEMP/go-capsule-authoring" --output "$RUNNER_TEMP/go-standard-logging"
      - name: Check captured ordinary HTTP fixture and frozen native product ownership
        run: |
          python3 -m unittest tools.tests.test_go_standard_http_gate -v
          python3 -m unittest tools.tests.test_go_entry_differential -v
          python3 -m unittest tools.tests.test_go_entry_frames -v
      - name: Qualify ordinary net/http contexts and disposal on the signed node
        run: python3 tools/qualify_go_standard_http.py --native-qualification "$RUNNER_TEMP/go-capsule-authoring" --output "$RUNNER_TEMP/go-standard-http-signed"
      - name: Check third-party client capture and frozen native product boundaries
        id: http_library_boundaries
        if: ${{ !cancelled() && steps.normal_go_qualification.outcome == 'success' }}
        run: python3 -m unittest tools.tests.test_go_http_libraries -v
      - name: Qualify two captured default clients and renamed private transitive workers
        if: ${{ !cancelled() && steps.normal_go_qualification.outcome == 'success' && steps.http_library_boundaries.outcome == 'success' }}
        run: python3 tools/qualify_go_http_libraries.py --native-qualification "$RUNNER_TEMP/go-capsule-authoring" --output "$RUNNER_TEMP/go-http-libraries"
      - name: Check private proxy trust, native capture and signed campaign boundaries
        id: private_go_boundaries
        if: ${{ !cancelled() && steps.normal_go_qualification.outcome == 'success' }}
        run: python3 -m unittest tools.tests.test_go_proxy_tls tools.tests.test_go_private_proxy -v
      - name: Qualify authenticated private Go graphs and offline signed lifecycle
        if: ${{ !cancelled() && steps.normal_go_qualification.outcome == 'success' && steps.private_go_boundaries.outcome == 'success' }}
        run: python3 tools/qualify_go_private_dependencies.py --native-qualification "$RUNNER_TEMP/go-capsule-authoring" --output "$RUNNER_TEMP/go-private-dependencies"
      - name: Diagnose signed Go entry with and without net/http initialization
        if: ${{ !cancelled() && failure() && steps.normal_go_qualification.outcome == 'success' }}
        run: python3 tools/diagnose_go_entry.py --native-qualification "$RUNNER_TEMP/go-capsule-authoring" --output "$RUNNER_TEMP/go-entry-differential"
      - name: Test reviewed module lifecycle and selected frontend
        run: |
          python3 -m unittest tools.tests.test_go_dependency_authoring tools.tests.test_guest_authoring_frontend
      - name: Test controlled native Go declaration and lock authoring
        run: python3 -m unittest tools.tests.test_go_native_authoring
      - name: Test captured library failure and cancellation observation fences
        run: python3 -m unittest tools.tests.test_go_dependency_recovery
      - name: Check exact Go generator approval, containment and source adoption
        run: LSF_REQUIRE_COMPILER_ISOLATION=1 python3 -m unittest tools.tests.test_go_generator_authoring tools.tests.test_go_generator_fixture -v
      - name: Qualify captured Go libraries in signed components
        run: |
          python3 tools/qualify_go_capsules.py --application-dependencies --approved-generator --output "$RUNNER_TEMP/go-capsule-dependencies"
      - name: Locate failed timer Wasm frames using private read-only source overlays
        if: ${{ failure() && steps.standard_timers.outcome == 'failure' }}
        run: |
          if test -f "$RUNNER_TEMP/go-standard-timers/GO-ACTIVATION-COMPILE.json"; then
            python3 tools/diagnose_go_timer_failure.py --fixture "$RUNNER_TEMP/go-standard-timers" --output "$RUNNER_TEMP/go-timer-diagnostic"
          fi
      - name: Observe private numeric frames for the unchanged Go integer entry
        if: ${{ !cancelled() && failure() && steps.normal_go_qualification.outcome == 'success' }}
        # Last native command: this target is diagnostic-only afterwards and
        # the existing Rust cache has save-if:false. No acceptance reuses it.
        run: python3 tools/diagnose_go_entry_frames.py --diagnostic "$RUNNER_TEMP/go-entry-differential" --native-qualification "$RUNNER_TEMP/go-capsule-authoring" --output "$RUNNER_TEMP/go-entry-private-frames"
      - name: Retain successful and failed upstream observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-guest-upstream-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-standard-logging/qualification.json
            ${{ runner.temp }}/go-standard-logging/FAILED.json
            ${{ runner.temp }}/go-standard-logging/capture.json
            ${{ runner.temp }}/go-standard-logging/build/BUILD-*.json
            ${{ runner.temp }}/go-standard-logging/build/component.wasm
            ${{ runner.temp }}/go-standard-logging/build/*-inputs.json
            ${{ runner.temp }}/go-standard-logging/build/application-dependencies.json
            ${{ runner.temp }}/go-standard-logging/build/go-runtime-transformations.json
            ${{ runner.temp }}/go-standard-logging/build/logs/**
            ${{ runner.temp }}/go-standard-logging/logs/**
            ${{ runner.temp }}/go-standard-logging/node/*.json
            ${{ runner.temp }}/go-standard-logging/node/controls/**
            ${{ runner.temp }}/go-http-libraries/qualification.json
            ${{ runner.temp }}/go-http-libraries/FAILED.json
            ${{ runner.temp }}/go-http-libraries/*/capture.json
            ${{ runner.temp }}/go-http-libraries/*/native-reference.json
