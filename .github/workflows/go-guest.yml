        with:
          version: 1.254.0
      - name: Install only existing locked Python and compiler namespace prerequisites
        run: |
          python3 -m pip install -r tools/requirements.lock
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check historical binding and fresh-host receipt controls
        run: python3 -B -m unittest tools.tests.test_go_entropy_retained tools.tests.test_go_standard_entropy tools.tests.test_go_entropy_replay -v
      - name: Read original pinned compiler and generator from the failed owning run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-guest-tools-72e693bc25fe269bb584feaaf4b7270fa81647df
          run-id: 39310234677
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/go-entropy-tools
      - name: Authenticate original Go archive and prepare only the maintained async compiler
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-entropy-tools"
          echo "ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5  $out/go.tar.gz" | sha256sum --check --strict
          python3 -B -c 'import os; from pathlib import Path; from tools.qualify_go_entropy_retained import compiler_inputs; compiler_inputs(Path(os.environ["RUNNER_TEMP"])/"go-entropy-tools")'
          test "$("$out/componentize-go" --version)" = 'componentize-go 0.4.3'
          tar -xzf "$out/go.tar.gz" -C "$out"
          python3 -B tools/go_guest/runtime.py --prepare-compiler "$out/go" --output "$out/go-async"
          echo "$out" >> "$GITHUB_PATH"
