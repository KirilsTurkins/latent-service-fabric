      - name: Build current ordinary host once then sign and execute normal27 and fresh entropy43
        run: python3 -B tools/qualify_go_entropy_retained.py --acquired "$RUNNER_TEMP/go-entropy-retained-inputs" --output "$RUNNER_TEMP/go-entropy-retained"
      - name: Retain distinct historical inputs current host fresh component and signed observations
