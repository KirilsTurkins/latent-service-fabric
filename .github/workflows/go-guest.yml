name: Go guest qualification

on:
  pull_request:
    paths:
      - sdk/go-guest/**
      - tools/go_guest/**
      - wit/**
      - tools/toolchain.toml
      - .github/workflows/go-guest.yml
  push:
    branches: [development]
    paths:
      - sdk/go-guest/**
      - tools/go_guest/**
      - wit/**
      - tools/toolchain.toml
      - .github/workflows/go-guest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-guest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-probe:
    name: Go upstream compatibility probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install the locked compiler and generator
        run: |
          set -euo pipefail
          cargo install --git https://github.com/bytecodealliance/componentize-go --rev 148dba505f8c6c64ad84db777cfde5e34e25098b --locked componentize-go
          cargo install --locked wasm-tools --version 1.254.0
          mkdir -p "$RUNNER_TEMP/go-guest-tools"
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/go-guest-tools/go.tbz" https://github.com/dicej/go/releases/download/go1.27.1-wasi-on-idle/go-linux-amd64-bootstrap.tbz
          echo "4b4fcbbab5b5b0a45433112aa51c64a54007b24f1efd05b67018ca2cf8633e2c  $RUNNER_TEMP/go-guest-tools/go.tbz" | sha256sum --check --strict
          tar -xjf "$RUNNER_TEMP/go-guest-tools/go.tbz" -C "$RUNNER_TEMP/go-guest-tools"
      - name: Retain exact qualification sources and offline prerequisites
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-guest-reproduction"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          git archive --format=tar HEAD | gzip -n > "$out/source.tar.gz"
          cargo fetch --locked
          tar -czf "$out/rust-toolchain.tar.gz" --exclude='share/doc' -C "$HOME/.rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu" bin lib
          tar -czf "$out/cargo-registry.tar.gz" -C "$CARGO_HOME" registry
          go="$RUNNER_TEMP/go-guest-tools/go-linux-amd64-bootstrap/bin/go"
          GOTOOLCHAIN=local "$go" mod download -json go.bytecodealliance.org/pkg@v0.2.3 > "$out/go-module.json"
          modcache="$(GOTOOLCHAIN=local "$go" env GOMODCACHE)"
          tar -czf "$out/go-module.tar.gz" -C "$modcache" go.bytecodealliance.org/pkg@v0.2.3 cache/download/go.bytecodealliance.org/pkg/@v
          sha256sum "$out/"*.tar.gz > "$out/archives.sha256"
          tar -cf "$RUNNER_TEMP/offline.tar" -C "$out" rust-toolchain.tar.gz cargo-registry.tar.gz
          split -b 268435456 -d "$RUNNER_TEMP/offline.tar" "$out/offline.part-"
          test "$(find "$out" -name 'offline.part-*' | wc -l)" -le 4
          rm "$out/rust-toolchain.tar.gz" "$out/cargo-registry.tar.gz" "$RUNNER_TEMP/offline.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-guest-reproduction-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-guest-reproduction/source.tar.gz
            ${{ runner.temp }}/go-guest-reproduction/go-module.tar.gz
            ${{ runner.temp }}/go-guest-reproduction/go-module.json
            ${{ runner.temp }}/go-guest-reproduction/revision.txt
            ${{ runner.temp }}/go-guest-reproduction/archives.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-guest-offline-0-${{ github.sha }}
          path: ${{ runner.temp }}/go-guest-reproduction/offline.part-00
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-guest-offline-1-${{ github.sha }}
          path: ${{ runner.temp }}/go-guest-reproduction/offline.part-01
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-guest-offline-2-${{ github.sha }}
          path: ${{ runner.temp }}/go-guest-reproduction/offline.part-02
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-guest-offline-3-${{ github.sha }}
          path: ${{ runner.temp }}/go-guest-reproduction/offline.part-03
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
      - name: Generate and compile upstream and constrained LSF components
        run: python3 tools/go_guest/probe.py --output "$RUNNER_TEMP/go-guest-probe" --go "$RUNNER_TEMP/go-guest-tools/go-linux-amd64-bootstrap/bin/go"
      - name: Retain successful and failed upstream observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-guest-upstream-${{ github.sha }}
          path: ${{ runner.temp }}/go-guest-probe/
          if-no-files-found: warn
          retention-days: 7
