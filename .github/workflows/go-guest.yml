  entropy-authority-replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay-entropy-authority && !inputs.qualify-entropy-retained && !inputs.entropy-only }}
    name: Same-component Go entropy explicit authority and retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install only existing locked Python dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact-source replay and finite entropy authority controls
        run: python3 -B -m unittest tools.tests.test_go_standard_entropy tools.tests.test_go_entropy_replay -v
      - name: Read fixed original public documents and binary products
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/go_entropy_replay_inputs.py --output "$RUNNER_TEMP/go-entropy-original-inputs"
      - name: Re-sign unchanged component and repeat all original and entropy outcomes
        run: python3 -B tools/replay_go_standard_entropy.py --acquired "$RUNNER_TEMP/go-entropy-original-inputs" --output "$RUNNER_TEMP/go-entropy-authority-replay"
      - name: Retain bounded same-component source and signed observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-entropy-authority-replay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-entropy-original-inputs/acquisition.json
            ${{ runner.temp }}/go-entropy-original-inputs/acquisition-failure.json
            ${{ runner.temp }}/go-entropy-authority-replay/qualification.json
            ${{ runner.temp }}/go-entropy-authority-replay/FAILED.json
            ${{ runner.temp }}/go-entropy-authority-replay/node/workflow.json
            ${{ runner.temp }}/go-entropy-authority-replay/node/FAILED.json
            ${{ runner.temp }}/go-entropy-authority-replay/node/controls/*.json
          if-no-files-found: warn
          retention-days: 7
  retained-cpu-checkpoints:
    name: Original signed CPU checkpoint cancellation and deadline controls
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify-entropy-retained && !inputs.replay-entropy-authority && !inputs.entropy-only }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Restore only locked dependency compilation cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Read exact failed-run compiler fixtures without recompilation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-guest-upstream-72e693bc25fe269bb584feaaf4b7270fa81647df
          run-id: 39310234677
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/go-checkpoint-retained
      - name: Execute the unchanged complete signed CPU case with the physical original-root witness
        env:
          LSF_GUEST_SDK_LANGUAGE: go
          LSF_GO_CHECKPOINT_FIXTURE: ${{ runner.temp }}/go-checkpoint-retained/go-checkpoints
          LSF_GO_NO_CHECKPOINT_FIXTURE: ${{ runner.temp }}/go-checkpoint-retained/go-no-checkpoints
        run: cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::go::signed_compiler_checkpoints_progress_cpu_siblings_and_cancel_original_activation -- --ignored --exact --nocapture
