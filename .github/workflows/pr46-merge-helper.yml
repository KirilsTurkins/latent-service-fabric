name: PR 46 completion-gate diagnostic

on:
  pull_request:
    branches:
      - automation/pr46-merge-base-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Reproduce Issue 25 smoke at PR 46 head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-36-contract-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install checked-in evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Run completion-gate smoke and capture complete output
        id: smoke
        shell: bash
        run: |
          set +e
          set -o pipefail
          unset CARGO_INCREMENTAL
          mkdir -p target/pr46-diagnostic
          make phase0-gate-smoke 2>&1 | tee target/pr46-diagnostic/phase0-gate-smoke.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" | tee target/pr46-diagnostic/result.txt
          exit "${status}"
      - name: Capture repository and generated state
        if: always()
        shell: bash
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "status:"
            git status --short
            echo "phase0 directories:"
            find target/phase0-gate -maxdepth 4 -type f -print 2>/dev/null | sort || true
          } > target/pr46-diagnostic/state.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr46-phase0-gate-diagnostic-${{ github.run_id }}
          path: |
            target/pr46-diagnostic/
            target/phase0-gate/
          if-no-files-found: warn
          retention-days: 1
