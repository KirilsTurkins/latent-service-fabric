name: PR 46 current bundle export

on:
  pull_request:
    branches:
      - automation/pr46-merge-base-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current development and PR 46 heads
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/heads/development:refs/remotes/origin/development" \
            "+refs/heads/feat/issue-36-contract-hardening:refs/remotes/origin/feat/issue-36-contract-hardening"
          mkdir -p export
          development_sha="$(git rev-parse refs/remotes/origin/development)"
          feature_sha="$(git rev-parse refs/remotes/origin/feat/issue-36-contract-hardening)"
          git bundle create export/latent-service-fabric-current.bundle \
            refs/remotes/origin/development \
            refs/remotes/origin/feat/issue-36-contract-hardening
          cat > export/metadata.json <<EOF
          {
            "schema": "latent.pr46.current-bundle.v1",
            "development_sha": "${development_sha}",
            "feature_sha": "${feature_sha}"
          }
          EOF
          sha256sum export/latent-service-fabric-current.bundle > export/latent-service-fabric-current.bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pr46-current-bundle-${{ github.run_id }}
          path: export/
          if-no-files-found: error
          retention-days: 1
