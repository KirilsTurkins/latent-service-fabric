name: PR 1794 isolated merge inputs
on:
  push:
    branches: [ci/pr1794-conflict-repair-20261115]
    paths: [.github/workflows/pr1794-conflict-repair.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          ref: b9af367ea1126b7cbee4820d45b40ace42e6fa01
      - name: Capture exact trees and three-way conflicts without writing a branch
        shell: bash
        env:
          BASE: 7138b817a5b94c900f741b845458ab9643238c99
          HEAD: b9af367ea1126b7cbee4820d45b40ace42e6fa01
          DEV: 14738dc3de79881c549d8371e9933c08a92fda27
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD" "$DEV"
          mkdir -p "$RUNNER_TEMP/pr1794-inputs"
          out="$RUNNER_TEMP/pr1794-inputs"
          set +e
          git merge-tree --write-tree --merge-base="$BASE" "$HEAD" "$DEV" > "$out/merge-tree.txt"
          status=$?
          set -e
          test "$status" -le 1
          cat "$out/merge-tree.txt"
          tree="$(head -n 1 "$out/merge-tree.txt")"
          git cat-file -e "$tree^{tree}"
          { printf '%s\n' "$BASE" "$HEAD" "$DEV"; git rev-list --objects "$BASE^{tree}" "$HEAD^{tree}" "$DEV^{tree}" "$tree" | cut -d ' ' -f1; } | sort -u > "$out/objects.txt"
          git pack-objects --stdout < "$out/objects.txt" > "$out/inputs.pack"
          test "$(stat --format=%s "$out/inputs.pack")" -le 268435456
          printf '%s\n' "$BASE" "$HEAD" "$DEV" > "$out/shallow"
          printf 'base=%s\nhead=%s\ndevelopment=%s\nmerge_tree=%s\n' "$BASE" "$HEAD" "$DEV" "$tree" > "$out/identity.txt"
          (cd "$out" && sha256sum inputs.pack merge-tree.txt identity.txt > SHA256SUMS)
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr1794-exact-merge-inputs
          path: ${{ runner.temp }}/pr1794-inputs/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
