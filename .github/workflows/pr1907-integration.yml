name: PR 1907 integration qualification
on:
  push:
    branches: [ci/pr1907-followup-20261115]
    paths: [.github/workflows/pr1907-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - name: Reconstruct the reviewed merge without publishing a ref
        run: |
          set -euo pipefail
          cp .github/pr1907-reconcile.py "$RUNNER_TEMP/reconcile.py"
          git fetch --no-tags --depth=4 origin b5e25076abc98c6a57f7078bdc335a5e916c5851 35ab1b776df07f0fa1c1bb64d3699915afffb38b
          git checkout --detach b5e25076abc98c6a57f7078bdc335a5e916c5851
          test "$(git merge-base HEAD 35ab1b776df07f0fa1c1bb64d3699915afffb38b)" = 14738dc3de79881c549d8371e9933c08a92fda27
          git config user.name 'PR 1907 qualification'
          git config user.email 'qualification@localhost'
          set +e
          git merge --no-commit --no-ff 35ab1b776df07f0fa1c1bb64d3699915afffb38b
          status=$?
          set -e
          test "$status" = 1
          python3 "$RUNNER_TEMP/reconcile.py"
          git fetch --no-tags --depth=1 origin 955da9c7465b88541e39b043203abb92782ae26a fb79a7ab6ea86f53baec78ee341aca075c14a2ef
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: clippy,rustfmt
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          save-if: false
          cache-bin: false
      - name: Preserve bounded public Java resolver diagnostics
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 - <<'PY'
          from pathlib import Path
          from tools import ci_contracts
          root = Path.cwd()
          workflow = '.github/workflows/java-guest-feasibility.yml'
          path = root / workflow
          source = path.read_text()
          needle = '            ${{ runner.temp }}/java-published-http/FAILED.json\n'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '            ${{ runner.temp }}/java-published-http/commands/logs/*.txt\n')
          path.write_text(source)
          proposal = ci_contracts.propose(root, 'job', workflow, 'compiler-component', root / 'target/ci/proposals/pr1907-java',
              'Retain the bounded published-client resolver logs on failure; all execution steps, pins, deadlines and required commands are unchanged.')
          target = root / 'tools/ci/contracts/workflows/java-guest-feasibility.yml/jobs/compiler-component.json'
          target.write_bytes(proposal.read_bytes())
          PY
      - name: Format the combined startup and exercise source regressions
        run: |
          set -euo pipefail
          cargo fmt --package latentd
          git add -u
          git diff --cached --check
          python3 -m unittest tools.tests.test_go_write_progress tools.tests.test_go_deadline_provider_contract tools.tests.test_node_providers_schema tools.tests.test_qualify_local_payload_recovery tools.tests.test_java_owner_admission tools.tests.test_dotnet_exact_composition tools.tests.test_java_published_http tools.tests.test_java_published_replay -v
          python3 - <<'PY'
          from tools.dev_workflow.composition_contract import changed_matrix_sources
          assert not changed_matrix_sources(), changed_matrix_sources()
          PY
      - name: Test actual protected startup including inbox custody
        run: |
          cargo test -p latentd --lib --all-features --locked standalone::state:: -- --test-threads=2
      - name: Qualify real linked payloads and the later custody scan
        run: python3 tools/qualify_local_payload_recovery.py
      - name: Test native scoped inbox retry and terminal writer ownership
        run: |
          cargo test -p latent-commit --lib --all-features --locked atomic::tests::inbox_scope_fence
          cargo test -p latent-node --lib --all-features --locked transaction_runtime::tests::response::inbox
      - name: Check startup lint without relaxing warnings
        run: cargo clippy -p latentd --lib --all-features --locked --no-deps -- -D warnings
      - name: Retain exact reviewed source objects and metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr1907-integrated"
          git diff --cached --binary HEAD > "$RUNNER_TEMP/pr1907-integrated/integration.patch"
          git diff --cached --raw --no-abbrev HEAD > "$RUNNER_TEMP/pr1907-integrated/changes.txt"
          git write-tree | tee "$RUNNER_TEMP/pr1907-integrated/tree.txt"
          python3 - <<'PY'
          import os, json, subprocess
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'])/'pr1907-integrated'
          rows = []
          for row in subprocess.check_output(['git','diff','--cached','--raw','--no-abbrev','HEAD'],text=True).splitlines():
              fields, name = row.split('\t',1)
              old_mode, mode, old, sha, status = fields.split()
              assert status in ('A','M','D')
              rows.append({'path':name, 'mode':mode, 'sha':sha, 'old':old, 'status':status})
              if status != 'D':
                  path = output/'files'/name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(subprocess.check_output(['git','cat-file','blob',sha]))
          (output/'entries.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        if: always()
        with:
          name: pr1907-integrated-sources
          path: ${{ runner.temp }}/pr1907-integrated/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error
