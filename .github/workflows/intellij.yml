name: IntelliJ project

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: IDE metadata (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Export review-only IDE metadata
        id: export
        run: |
          # Reviewed delegated owners: tools/intellij.sh tools/intellij_windows.py
          python tools/intellij.py --export "$RUNNER_TEMP/intellij-review"
      - name: Check committed IDE metadata
        id: check
        run: python tools/intellij.py --check
      - name: Test IDE project and launcher contracts
        id: tests
        if: always()
        run: python -m unittest tools.tests.test_intellij tools.tests.test_intellij_windows -v
      - name: Exercise the unified Python help entry on every host
        id: unified_help
        run: python tools/intellij.py run help
      - name: Select the website Node runtime for native Windows execution
        if: runner.os == 'Windows'
        uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version-file: website/package.json
          package-manager-cache: false
      - name: Exercise Windows terminal helper and unified locked website preparation
        id: windows_launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LSF_IDE_PYTHON = (Get-Command python).Source
          cmd.exe /d /c tools\intellij.cmd help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/intellij.py run website-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain review proposal, not machine settings
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: intellij-review-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/intellij-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
