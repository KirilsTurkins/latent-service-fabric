name: IntelliJ project

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: IDE metadata (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        id: setup_python
        continue-on-error: ${{ runner.os == 'Windows' }}
        with:
          python-version: 3.13.5
      - name: Recover the verified Windows Python asset
        if: runner.os == 'Windows' && steps.setup_python.outcome == 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/intellij-python-3.13.5.zip"
          gh api -H 'Accept: application/octet-stream' repos/actions/python-versions/releases/assets/263151870 | head -c 28549021 > "$archive"
          unset GH_TOKEN
          test "$(wc -c < "$archive")" -eq 28549020
          printf '%s  %s\n' 83953e399a4ed65460d7fa99fa53d2a91a0da742ffb744ebb2fb999c7b880e91 "$archive" | sha256sum --check --strict
      - name: Install the verified Windows Python tool cache
        if: runner.os == 'Windows' && steps.setup_python.outcome == 'failure'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'intellij-python-3.13.5.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'intellij-python-3.13.5'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory -ErrorAction Stop
          Push-Location -LiteralPath $directory -ErrorAction Stop
          try { & .\setup.ps1 } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = if ($env:AGENT_TOOLSDIRECTORY) { $env:AGENT_TOOLSDIRECTORY } else { $env:RUNNER_TOOL_CACHE }
          $python = Join-Path $cache 'Python\3.13.5\x64\python.exe'
          if (!(Test-Path -LiteralPath (Join-Path $cache 'Python\3.13.5\x64.complete'))) { throw 'Python tool cache is incomplete' }
          if ((& $python --version) -ne 'Python 3.13.5') { throw 'Python version mismatch' }
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        if: runner.os == 'Windows' && steps.setup_python.outcome == 'failure'
        with:
          python-version: 3.13.5
      - name: Export review-only IDE metadata
        id: export
        run: |
          # Reviewed delegated owners: tools/intellij.sh tools/intellij_windows.py
          python tools/intellij.py --export "$RUNNER_TEMP/intellij-review"
      - name: Check committed IDE metadata
        id: check
        run: python tools/intellij.py --check
      - name: Test IDE project and launcher contracts
        id: tests
        if: always()
        run: python -m unittest tools.tests.test_intellij tools.tests.test_intellij_windows -v
      - name: Exercise the unified Python help entry on every host
        id: unified_help
        run: python tools/intellij.py run help
      - name: Select the website Node runtime for native Windows execution
        if: runner.os == 'Windows'
        uses: KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version-file: website/package.json
          package-manager-cache: false
      - name: Exercise Windows terminal helper and unified locked website preparation
        id: windows_launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LSF_IDE_PYTHON = (Get-Command python).Source
          cmd.exe /d /c tools\intellij.cmd help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/intellij.py run website-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain review proposal, not machine settings
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: intellij-review-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/intellij-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
