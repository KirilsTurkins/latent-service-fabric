name: Stream actual constructor VM
on:
  workflow_dispatch:
  push:
    branches: ['feat/stream-kernel-vm-qualification-20261023']
    paths:
      - '.github/workflows/stream-kernel-constructor-vm.yml'
      - 'tools/qualify_host_stream_kernel_vm.py'
      - 'tools/host_stream_kernel_vm_image.py'
      - 'tools/tests/test_host_stream_kernel_vm_image.py'
      - 'tools/host_stream_kernel_constructor_failure.py'
      - 'tools/tests/test_host_stream_kernel_constructor_failure.py'
      - 'tools/host_stream_kernel_stack_alignment.py'
      - 'tools/tests/test_host_stream_kernel_stack_alignment.py'
      - 'research/standard-outbound/linux-6.12-lineage/constructor-vm-init.c'
permissions:
  contents: read
concurrency:
  group: stream-kernel-constructor-vm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  constructor-vm:
    name: Link and boot one isolated real constructor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install existing locked recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check image boundaries and current native source projection
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_vm_image
          tools.tests.test_host_stream_kernel_cleanup_native
          tools.tests.test_host_stream_kernel_constructor_failure
          tools.tests.test_host_stream_kernel_stack_alignment -v
      - name: Install upstream compiler and isolated emulator prerequisites
        run: |
          sudo timeout --signal=TERM --kill-after=30s 180s apt-get update
          sudo timeout --signal=TERM --kill-after=30s 900s apt-get install --yes --no-install-recommends gcc make flex bison bc libelf-dev libssl-dev binutils qemu-system-x86 seabios
      - name: Acquire exact official maintained source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.113.tar.xz \
            --output "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          echo "e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428  $RUNNER_TEMP/linux-6.12.113.tar.xz" | sha256sum --check --strict
      - name: Link candidate kernel and exercise actual constructor in isolated VM
        run: >-
          python3 -B tools/qualify_host_stream_kernel_vm.py
          --archive "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          --output "$RUNNER_TEMP/stream-kernel-constructor-vm"
      - name: Retain bounded image identities, observations and original failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-kernel-constructor-vm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-constructor-vm/qualification.json
            ${{ runner.temp }}/stream-kernel-constructor-vm/FAILED.json
            ${{ runner.temp }}/stream-kernel-constructor-vm/selection.json
            ${{ runner.temp }}/stream-kernel-constructor-vm/commands.json
            ${{ runner.temp }}/stream-kernel-constructor-vm/baseline.config
            ${{ runner.temp }}/stream-kernel-constructor-vm/selected.config
            ${{ runner.temp }}/stream-kernel-constructor-vm/source-fixture.config
            ${{ runner.temp }}/stream-kernel-constructor-vm/constructor-bzImage
            ${{ runner.temp }}/stream-kernel-constructor-vm/constructor-init
            ${{ runner.temp }}/stream-kernel-constructor-vm/constructor-init.c
            ${{ runner.temp }}/stream-kernel-constructor-vm/constructor-initramfs.list
            ${{ runner.temp }}/stream-kernel-constructor-vm/constructor-initramfs.cpio
            ${{ runner.temp }}/stream-kernel-constructor-vm/firmware/*
            ${{ runner.temp }}/stream-kernel-constructor-vm/commands/logs/*.txt
            ${{ runner.temp }}/stream-kernel-constructor-vm/objects/include/generated/autoconf.h
          if-no-files-found: warn
          retention-days: 3
