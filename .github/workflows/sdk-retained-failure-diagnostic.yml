name: SDK retained failure evidence review
on:
  push:
    branches: ['diag/sdk-java-guard-20261105']
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk-retained-failures-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    name: Authenticate retained Java guard failure
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Capture and classify the exact retained failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/sdk_retained_failure_diagnostic.py --output "$RUNNER_TEMP/sdk-retained-failures"
      - name: Retain bounded public summary
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: sdk-retained-failures-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/sdk-retained-failures/summary.json
