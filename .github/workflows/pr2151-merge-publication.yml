name: Isolated PR 2151 merge preparation
on:
  push:
    branches: ['maintenance/pr2151-merge-publication-20261122']
    paths: ['.github/workflows/pr2151-merge-publication.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LSF_PYTHON_POLICY_BASE: 702bd725f259a241a9b92aecde9b1a5787b94f94
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: f881e760dfb527e341b2b43b60d99f217ad2d8ae
          fetch-depth: 100
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Install existing validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Fetch exact merge parent
        run: git fetch --no-tags --depth=100 origin 702bd725f259a241a9b92aecde9b1a5787b94f94
      - name: Resolve authenticated inputs and validate complete checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          HEAD = 'f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          DEV = '702bd725f259a241a9b92aecde9b1a5787b94f94'
          BASE = '57d4a349dbb70c2511be1cd15f41e5915d6ba5b9'
          OUT = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr2151-prepared'
          OUT.mkdir()
          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          def text(*args):
              return git(*args).stdout.decode().strip()
          def blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert text('rev-parse', 'HEAD') == HEAD
          assert text('merge-base', HEAD, DEV) == BASE
          assert not text('status', '--porcelain')
          git('config', 'user.name', 'Kirils Turkins')
          git('config', 'user.email', 'turkinskirils@gmail.com')
          result = git('merge', '--no-commit', '--no-ff', DEV, check=False)
          (OUT / 'merge.log').write_bytes(result.stdout + result.stderr)
          assert result.returncode in (0, 1), result.stderr.decode()
          assert text('rev-parse', 'MERGE_HEAD') == DEV
          rows = json.loads(r'''[
            {"path":"sdk/java-guest/README.md","base":"f881e760dfb527e341b2b43b60d99f217ad2d8ae","preimage":"5e61426b330274724fe2b9ddb93fbe380cd71227","postimage":"9fb2375f680e8f44120be28530b24a4a4537f609","edits":[[44,54,"Managed activation builds retain the **64 KiB C stack at the start of linear\nmemory**, including the guarded Date link path. Before preprocessing and sealing,\nthe compiler authenticates TeaVM's exception header and reuses automatic exception\ndescriptors only across disjoint handler lifetimes. Nested and recursive handlers\nkeep independent storage; setjmp, catch, restore and rethrow semantics are unchanged.\nThis replaces the earlier 128 KiB backing workaround without a larger caller grant.\nPlacing the downward-growing stack below static data prevents its underflow from\nsilently overwriting activation-owner registries; an out-of-bounds access traps the\nactivation instead. The 64 MiB linker maximum, Java heap limits and host ownership\nbudgets are unchanged, as is the non-fiber compiler command. See the\n[exception-slot lifetime controls](../../docs/testing/java-exception-slot-lifetimes.md).\nFinite regression controls do not promise arbitrary recursion or every library fits;\nsigned execution and physical cleanup still require source-matched qualification.\n"]]},
            {"path":"sdk/typescript-guest/README.md","base":"f881e760dfb527e341b2b43b60d99f217ad2d8ae","preimage":"68d59950a0e09541556e862309fef5dee188c080","postimage":"8328d7aea0e8b04ea25aa59d345a2563c2e37ad3","edits":[[133,135,"intervening Promise allocation. Listener insertion uses the same checkpoint while\nits inputs are rooted, after discarding its lookup cursor and before staging any\ncaptures. Individual graph\nadmissions remain non-collecting so staged callbacks and weak-set iterators cannot\nbe invalidated. Empty AbortSignal algorithm-list storage is allocated only on first\nuse, with independent container and algorithm ownership before publication.\n"]]},
            {"path":"sdk/typescript-guest/activation/native_engine.cpp","base":"f881e760dfb527e341b2b43b60d99f217ad2d8ae","preimage":"07d02a6142c7c9d610717af7c5479c2724c11857","postimage":"07d02a6142c7c9d610717af7c5479c2724c11857","edits":[]},
            {"path":"sdk/typescript-guest/activation/native_objects.h","base":"702bd725f259a241a9b92aecde9b1a5787b94f94","preimage":"ea0fd0215b2edfd6ae1a5050f2c253b7e3ca6f49","postimage":"ea0fd0215b2edfd6ae1a5050f2c253b7e3ca6f49","edits":[]},
            {"path":"tools/java_guest/date_link_guard.py","base":"f881e760dfb527e341b2b43b60d99f217ad2d8ae","preimage":"74354dd0655050b29ad819d54e1ec65bea28cd05","postimage":"d31c359c1e7599846fd769564c8414e892e61cd1","edits":[[109,109,"    # Keep the fixed downward-growing C stack below static data. An overflow\n    # must trap at the memory boundary, not overwrite allocator/bridge state.\n"]]},
            {"path":"tools/java_guest/enum_guard.py","base":"702bd725f259a241a9b92aecde9b1a5787b94f94","preimage":"8ce4ad27744c082481ed4389ac62ecbcc233c377","postimage":"7a4f9edbd67135157a45a2eb3efbdd60a780cbf2","edits":[[18,18,"# Reuse disjoint TeaVM exception descriptors before sealing generated input.\n# Retain the original 64 KiB stack, below static data so downward overflow\n# cannot overwrite activation-owner registries.\nACTIVATION_C_STACK_BYTES = 64 * 1024\nACTIVATION_C_STACK_FLAGS = ('-Wl,--stack-first', f'-Wl,-z,stack-size={ACTIVATION_C_STACK_BYTES}')\n"],[452,453,"            '-mexec-model=reactor', '-Wl,--no-entry', '-Wl,--export-memory', *ACTIVATION_C_STACK_FLAGS,\n"],[460,460,"    receipt['cStack'] = {'bytes': ACTIVATION_C_STACK_BYTES, 'layout': 'stack-first'}\n"]]},
