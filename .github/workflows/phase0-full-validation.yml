name: Phase 0 full validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation profile to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

jobs:
  phase0-validation:
    name: Clean-checkout Phase 0 ${{ inputs.mode }} gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install retained-evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Run the clean-checkout Phase 0 gate
        env:
          PHASE0_MODE: ${{ inputs.mode }}
        run: |
          unset CARGO_INCREMENTAL
          tools/run_phase0_gate.sh "${PHASE0_MODE}"
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-${{ inputs.mode }}-validation-${{ github.sha }}
          path: target/phase0-gate
          if-no-files-found: warn
          retention-days: 14
