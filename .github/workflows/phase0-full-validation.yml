name: Phase 0 full validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation profile to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

jobs:
  phase0-validation:
    name: Clean-checkout Phase 0 ${{ inputs.mode }} gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: sdk/go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.425
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install retained-evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - name: Run the clean-checkout Phase 0 gate
        env:
          PHASE0_MODE: ${{ inputs.mode }}
        run: |
          unset CARGO_INCREMENTAL
          tools/run_phase0_gate.sh "${PHASE0_MODE}"
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-${{ inputs.mode }}-validation-${{ github.sha }}
          path: target/phase0-gate
          if-no-files-found: warn
          retention-days: 14
