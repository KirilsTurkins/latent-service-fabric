name: Original C timed numeric trap observation

on:
  push:
    branches: [diag/c-timed-original-trap-20261109]
    paths:
      - '.github/workflows/c-timed-original-trap.yml'
      - 'tools/c_timed_original_trap.py'
      - 'tools/tests/test_c_timed_original_trap.py'
      - 'tools/aot_test_inputs.py'
      - 'tools/tests/test_aot_test_inputs.py'
      - 'crates/latent-wasmtime/src/c_timed_original_fault.rs'
      - 'crates/latent-wasmtime/src/backend.rs'
      - 'crates/latent-wasmtime/src/config.rs'
      - 'crates/latent-wasmtime/src/lib.rs'
      - 'crates/latent-wasmtime/tests/isolated_aot/prepared.rs'
      - 'crates/latent-wasmtime/Cargo.toml'
      - 'apps/latentd/src/config/runtime.rs'
      - 'apps/latentd/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c-timed-original-trap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/diag/c-timed-original-trap-20261109'
    name: Replay unchanged C component on the signed diagnostic node
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.97.1'
      RUSTUP_AUTO_INSTALL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        timeout-minutes: 1
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        timeout-minutes: 2
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        timeout-minutes: 1
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Check bounded diagnostic controls
        timeout-minutes: 2
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_timed_original_trap tools.tests.test_aot_test_inputs.ProfileAgreement -v
      - name: Acquire and authenticate the original retained artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 90s gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13638659294/zip > "$RUNNER_TEMP/c-timed-original.zip"
          test "$(stat --format=%s "$RUNNER_TEMP/c-timed-original.zip")" = 2280201
          printf '%s  %s\n' 4f28a85e0308d829af4ae5b8680dd947e5320f6b5987f8cac43fe11e01029e37 "$RUNNER_TEMP/c-timed-original.zip" | sha256sum --check --strict
      - name: Build the dedicated host and replay the original assertions
        timeout-minutes: 26
        run: >-
          python3 -B tools/c_timed_original_trap.py
          --archive "$RUNNER_TEMP/c-timed-original.zip"
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/c-timed-original-observation"
      - name: Retain the bounded observation and original owner failures
        if: always()
        timeout-minutes: 2
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-timed-original-trap-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-timed-original-observation/public/**
            ${{ runner.temp }}/c-timed-original-observation/node/FAILED.json
            ${{ runner.temp }}/c-timed-original-observation/node/invocation-c-thread-timed-sleep.json
            ${{ runner.temp }}/c-timed-original-observation/commands/logs/*.stderr.txt
          if-no-files-found: warn
          retention-days: 7
