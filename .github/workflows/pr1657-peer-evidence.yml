name: PR 1657 retained peer evidence
on:
  push:
    branches: ['diag/pr1657-peer-evidence-20261106']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - name: Inspect bounded canonical wait source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('crates/vendor/wasmtime/src/runtime/component/concurrent.rs')
          lines=p.read_text().splitlines()
          print('SOURCE',p,'LINES',len(lines))
          for i,line in enumerate(lines):
              if re.search(r'(fn .*waitable|fn .*event|struct WaitableSet|fn .*wake)',line):
                  print('INDEX',i+1,line)
          selected=set()
          for i,line in enumerate(lines):
              if re.search(r'fn waitable_set_wait\(|fn waitable_set_poll\(|struct WaitableSet|fn wait_for_event\(',line):
                  selected.update(range(max(0,i-8),min(len(lines),i+140)))
          assert len(selected)<700
          for i in sorted(selected):print(f'{i+1}: {lines[i]}')
          PY
