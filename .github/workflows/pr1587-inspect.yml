name: PR 1587 inspection
on:
  push:
    branches: [diag/dotnet-original-v3-trap-20261031]
    paths: [.github/workflows/pr1587-inspect.yml]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diag/dotnet-original-v3-trap-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.97.1'
      RUSTUP_AUTO_INSTALL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: 5b2c002eed0ae74c143e0fad38e85e44cd2a16a8
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Install locked validation dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Materialize the reviewed bounded validation phases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, yaml
          sha = 'abead7600aed0679b4315f0df6cc635329381c70'
          response = subprocess.check_output(['gh','api',f'repos/KirilsTurkins/latent-service-fabric/git/blobs/{sha}'],timeout=30)
          blob = json.loads(response)
          assert blob['encoding'] == 'base64'
          raw = base64.b64decode(blob['content'])
          assert len(raw) <= 131072
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
          steps = yaml.safe_load(raw)['jobs']['inspect']['steps']
          names = [
              'Restore the exact reviewed repair recipe and preserve authentic output bytes',
              'Recheck retained evidence and complete fixture copies',
              'Compile the shared fixture in its actual node test crate',
              'Require exact default and observer-feature Rust inventories and six package controls',
              'Stage only validated source blobs without changing commits or refs',
          ]
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1587-recipe'
          out.mkdir()
          for index, name in enumerate(names):
              source, = [step['run'] for step in steps if step.get('name') == name]
              if index == 0:
                  old = 'whitespace=blank-at-eol,space-before-tab'
                  assert source.count(old) == 1
                  source = source.replace(old,'whitespace=-blank-at-eof')
              (out/f'{index}.sh').write_text(source)
          PY
      - name: Restore reviewed source and check all new files without altering receipt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-recipe/0.sh"
      - name: Validate the Python controls and CI coverage
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-recipe/1.sh"
      - name: Compile the shared fixture in its actual node test crate
        timeout-minutes: 10
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-recipe/2.sh"
      - name: Check both complete Rust inventories and execute all six pure packaging controls
        timeout-minutes: 11
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-recipe/3.sh"
      - name: Stage validated public source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-recipe/4.sh"
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        if: always()
        with:
          name: pr1587-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/pr1587-inspect/
          retention-days: 2
          if-no-files-found: error
