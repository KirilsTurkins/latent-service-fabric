name: TypeScript factory fence repair
on:
  push:
    branches: ['fix/1852-agent2-abort-engine-audit']
    paths: ['.github/workflows/typescript-factory-fence-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 2
      - name: Stage exact locally tested factory source and regression controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9a7743e260554fbda150e973ba2cc5ed83a3f99b
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, (path, before)
              p.write_text(text.replace(before, after, 1))
          source = 'tools/typescript_guest/abort_engine.py'
          replace(source, '  if (!text) return nullptr;', '  // A rooted string result is not permission to look up a mutable constructor\n  // with a pending exception. Preserve the failure before any possible reentry.\n  if (!text || JS_IsExceptionPending(cx)) return nullptr;')
          fixture = 'tools/tests/fixtures/typescript_abort_factory_failure.cpp'
          replace(fixture, '  bool invalid_slot = false;', '  bool invalid_slot = false, lookup_with_pending = false;')
          replace(fixture, '  state.text.text = text;', '  if (state.phase == 11) cx->pending = 111; // pointer does not imply a clean context\n  state.text.text = text;')
          replace(fixture, '  assert(!cx->pending);\n  ++state.lookups;', '  state.lookup_with_pending |= cx->pending != 0;\n  ++state.lookups;')
          replace(fixture, '    {"string-oom", 1, 101, 0, 0},', '    {"string-pending-abort", 11, 111, 0, 0}, {"string-pending-timeout", 11, 111, 0, 0},\n    {"string-oom", 1, 101, 0, 0},')
          replace(fixture, '!std::strcmp(argv[1], "success-timeout")', 'std::strstr(argv[1], "timeout") != nullptr')
          replace(fixture, 'state.constructs == selected.constructs && !state.invalid_slot &&', 'state.constructs == selected.constructs && !state.invalid_slot && !state.lookup_with_pending &&')
          replace('tools/tests/test_typescript_event_ownership.py', "for case in ('success-abort', 'success-timeout', 'string-oom',", "for case in ('success-abort', 'success-timeout', 'string-oom',\n                     'string-pending-abort', 'string-pending-timeout',")
          Path('docs/testing/typescript-abort-factory-pending.md').write_text('''# Abort factory pending-exception fence

          Continuation of #1934 on 2026-11-11, after the parent CI repairs.

          The separate AbortError/TimeoutError helper checked a null string result but
          not a pending exception before looking up the mutable DOMException constructor.
          The shared DOMException factory already guards both conditions. The abort helper
          now does the same, preserving the original exception before possible reentry.

          The emitted-factory fault double supplies a non-null string with a pending
          exception. Both AbortError and TimeoutError cases reproduced a forbidden
          constructor lookup before the change, and pass after it. This is defensive
          native failure-boundary evidence, not a claim that an ordinary string allocation
          has been observed to return this combination in the real pinned engine.
          The existing factory controls still cover null/OOM, native false/no-pending,
          constructor reentry, wrong native class, first failure and slot-write ordering.

          GCC and Clang ASan/UBSan each passed the 37-test selection comprising
          `test_typescript_event_ownership`, `test_typescript_dom_exception_ownership` and
          `test_typescript_abort_any_ownership`. Leak detection and halt-on-error remained
          enabled. These are finite JSAPI controls plus the existing real Wasm trap
          witness; they are not a linked SpiderMonkey collector or signed LSF execution.

          No native owner kind, admission budget, exception identity, signed success
          predicate or public support status is changed. Final integrated linked/signed
          qualification and failed-decommit custody remain separate open obligations.
          ''')
          PY
          git add tools/typescript_guest/abort_engine.py tools/tests/fixtures/typescript_abort_factory_failure.cpp tools/tests/test_typescript_event_ownership.py docs/testing/typescript-abort-factory-pending.md
          git rm --cached .github/workflows/typescript-factory-fence-repair.yml
          test "$(git write-tree)" = 955b41f95a081213e9ff648b823a7674dadb2885
          git reset HEAD -- .github/workflows/typescript-factory-fence-repair.yml
          git diff --cached --check
      - name: Validate emitted factories before publication
        env:
          LSF_TYPESCRIPT_RECORD_CXX: ./tools/typescript_runtime_sanitizer_cxx.sh
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 -B -m unittest tools.tests.test_typescript_event_ownership.AbortFailureControls tools.tests.test_typescript_dom_exception_ownership -v
      - name: Publish source changes only with a normal push
        run: |
          git config user.name 'Kirils Turkins'
          git config user.email 'turkinskirils@gmail.com'
          git commit -m 'fix(typescript): fence pending abort factory string failures before lookup'
          git push origin HEAD:refs/heads/fix/1852-agent2-abort-engine-audit
