name: Verify local test entrypoint continuation
on:
  push:
    branches: [feat/435-complete-local-test-workflows]
    paths: [.github/workflows/verify-local-test-entrypoint.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Apply only the byte-verified reviewed continuation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/local-test-validation"
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = [Path('.github/lsf435.delta.' + str(i)) for i in range(1, 4)]
          encoded = ''.join(path.read_text().strip() for path in parts)
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a6525113289e57a1c8369bd2c786b4e87c1b335f06980991eb22e9f4c5bbce98'
          changes = json.loads(raw)
          allowed = {'.github/workflows/ci.yml', 'docs/development/local-tests.md',
                     'tools/ci/commands.json', 'tools/ci/suites.json', 'tools/ci_lane_worker.py',
                     'tools/ci_rust_artifacts.py', 'tools/ci_suite_inventory.py', 'tools/local_tests.py',
                     'tools/phase3_security_artifacts.py', 'tools/prepared_test_harness.py',
                     'tools/run_angular_renderer_tests.py', 'tools/test_run.py',
                     'tools/tests/test_local_tests.py', 'tools/tests/test_owned_runners.py',
                     'tools/validate_contracts.sh'}
          assert len(changes) == len(allowed) and {item['path'] for item in changes} == allowed
          for item in changes:
              path = Path(item['path'])
              assert path.is_file() and not path.is_symlink()
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == item['before'], path
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == item['after'], path
              path.write_bytes(after)
              print('Verified', path, item['after'])
          for path in parts:
              path.unlink()
          Path('.github/workflows/verify-local-test-entrypoint.yml').unlink()
          PY
      - name: Install pinned validation dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Require native ownership and entrypoint regressions
        env:
          LSF_REQUIRE_NATIVE_PROCESS_TESTS: '1'
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest tools.tests.test_local_tests tools.tests.test_owned_runners tools.tests.test_owned_test_process tools.tests.test_ci_suite_inventory tools.tests.test_ci_suite_discovery tools.tests.test_ci_rust_artifacts tools.tests.test_ci_coverage tools.tests.test_ci_browser_artifacts tools.tests.test_ci_lane_inventory tools.tests.test_ci_lanes tools.tests.test_ci_cargo tools.tests.test_oci_registry_runner tools.tests.test_run_aot_tests tools.tests.test_angular_build_runner -v 2>&1 | tee "$RUNNER_TEMP/local-test-validation/python-tests.log"
          python3 tools/ci_coverage.py
          python3 tools/validate_docs.py
          python3 tools/validate_repository.py
          git diff --check
      - name: Commit the exact clean candidate locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git -c commit.gpgsign=false commit -m 'feat(testing): complete prepared local test workflows (#435)'
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee "$RUNNER_TEMP/local-test-validation/revision.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/local-test-validation/tree.txt"
      - name: Execute actual prepared Rust through the same local interface
        shell: bash
        run: |
          set -o pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          out="$RUNNER_TEMP/local-test-validation"
          suite=latent-core.lib.latent-core
          case=digest::tests::canonical_sha256_text_round_trips_in_each_identity_domain
          inventory=target/local-tests/core.jsonl
          set +e
          python3 tools/test.py check --suite "$suite" --output json > "$out/missing.json"
          status=$?
          set -e
          test "$status" -eq 3
          python3 tools/test.py prepare --suite "$suite" --case "$case" --inventory "$inventory" --output json > "$out/prepare.json"
          python3 tools/test.py check --suite "$suite" --case "$case" --inventory "$inventory" --output json > "$out/check.json"
          python3 tools/test.py run --suite "$suite" --case "$case" --inventory "$inventory" --output json > "$out/exact.json"
          python3 tools/test.py prepare --suite "$suite" --case "$case" --inventory "$inventory" --output json > "$out/reuse.json"
          python3 tools/test.py run --suite "$suite" --case "$case" --inventory "$inventory" --output json > "$out/reused-exact.json"
          python3 tools/test.py run --suite "$suite" --inventory "$inventory" --output json > "$out/whole-suite.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'local-test-validation'
          for name, expected in [('exact.json', 1), ('reused-exact.json', 1), ('whole-suite.json', 89)]:
              value = json.loads((out / name).read_text())
              assert value['outcome'] == 'passed', value
              assert value['requiredCaseCount'] == expected == value['completedCaseCount'], value
              assert value['source']['observed'] and not value['source']['dirty'], value
              assert not value['cleanupFailures'], value
              print(name, 'passed', expected, 'cases', value['source']['revision'])
          assert json.loads((out / 'reuse.json').read_text())['reused'] is True
          PY
          test -z "$(git status --porcelain)"
      - name: Store the validated Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def api(method, path, value=None):
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + path,
                  data=None if value is None else json.dumps(value).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          base = api('GET', '/git/commits/' + parent)
          entries = []
          for line in git('diff', '--name-status', parent, 'HEAD').splitlines():
              status, path = line.split('\t')
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  assert status == 'M', line
                  mode, _, _ = git('ls-files', '--stage', path).split(None, 2)
                  blob = api('POST', '/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(Path(path).read_bytes()).decode()})
                  assert blob['sha'] == git('hash-object', path), path
                  entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          tree = api('POST', '/git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          assert tree['sha'] == git('rev-parse', 'HEAD^{tree}')
          fields = git('show', '-s', '--format=%an%n%ae%n%aI%n%cn%n%ce%n%cI').splitlines()
          message = subprocess.check_output(['git', 'show', '-s', '--format=%B']).decode().rstrip('\n') + '\n'
          commit = api('POST', '/git/commits', {'tree': tree['sha'], 'parents': [parent], 'message': message,
              'author': dict(zip(('name', 'email', 'date'), fields[:3])),
              'committer': dict(zip(('name', 'email', 'date'), fields[3:]))})
          result = {'parent': parent, 'commit': commit['sha'], 'localCommit': git('rev-parse', 'HEAD'), 'tree': tree['sha'],
                    'files': [entry['path'] for entry in entries], 'branchChanged': False}
          destination = Path(os.environ['RUNNER_TEMP']) / 'local-test-validation/git-objects.json'
          destination.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          assert commit['sha'] == result['localCommit'], 'GitHub commit representation differs; tree equality retained'
          PY
      - name: Retain actual validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-test-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local-test-validation/
            target/test-diagnostics/
          if-no-files-found: error
          retention-days: 3
