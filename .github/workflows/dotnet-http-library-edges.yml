name: Ordinary managed client response boundaries
on:
  push:
    branches: ['feat/dotnet-http-library-edges-20261020']
    paths: ['.github/workflows/dotnet-http-library-edges.yml', 'tools/dotnet_http_library_edges_node.py', 'tools/qualify_dotnet_http_library_edges.py', 'tools/dotnet_http_library_edges_fixture.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dotnet-http-library-edges-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-boundaries:
    name: Fresh normal Flurl Refit application response-boundary programme
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Fetch the exact successful native producer source
        run: git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b 7e3de703bc7666cee9407ff15205b9d5809a9c20
      - name: Install existing locked reader dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check original archive and native provenance boundaries
        run: python3 -B -m unittest tools.tests.test_dotnet_published_http_replay tools.tests.test_sdk_native_products_reader -v
      - name: Check original and corrected normal application source boundaries
        run: python3 -B -m unittest tools.tests.test_dotnet_http_library_edges_fixture -v
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare the pinned compiler and current small closed-runtime adapters
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/edges-bindgen"
          export PATH="$RUNNER_TEMP/edges-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/edges-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/edges-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Authenticate five original native products without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/edges-native"
      - name: Build one application and execute twelve signed library response boundaries
        run: python3 -B tools/qualify_dotnet_http_library_edges.py --native "$RUNNER_TEMP/edges-native" --tools "$RUNNER_TEMP/edges-tools" --output "$RUNNER_TEMP/http-library-edges"
      - name: Retain bounded public original build and library evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-http-library-edges-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/edges-native/*.json
            ${{ runner.temp }}/edges-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/edges-tools/runtime-inputs.json
            ${{ runner.temp }}/edges-tools/wasi-sdk.json
            ${{ runner.temp }}/edges-tools/logs/**
            ${{ runner.temp }}/http-library-edges/*.json
            ${{ runner.temp }}/http-library-edges/generator-approval-required/*.json
            ${{ runner.temp }}/http-library-edges/generator-approval-required/compiler.*.txt
            ${{ runner.temp }}/http-library-edges/build/*.json
            ${{ runner.temp }}/http-library-edges/build/compiler.*.txt
            ${{ runner.temp }}/http-library-edges/build/component.wasm
            ${{ runner.temp }}/http-library-edges/build/derived-*.dll
            ${{ runner.temp }}/http-library-edges/build/executable-input-outputs/**
            ${{ runner.temp }}/http-library-edges/build/package/**
            ${{ runner.temp }}/http-library-edges/build/logs/**
            ${{ runner.temp }}/http-library-edges/outside/compiler-*/logs/**
            ${{ runner.temp }}/http-library-edges/node/*.json
            ${{ runner.temp }}/http-library-edges/node/controls/*.json
