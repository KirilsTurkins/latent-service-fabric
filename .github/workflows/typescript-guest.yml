name: TypeScript guest qualification

on:
  pull_request:
    paths:
      - 'sdk/typescript-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/qualify_transaction_contracts.py'
      - 'tools/compile_transaction_guests.py'
      - 'tools/transaction_guest_project.py'
      - 'tools/transaction_guest_variants.py'
      - 'tools/tests/test_transaction_guest_authoring.py'
      - 'tools/tests/test_transaction_guest_compilers.py'
      - 'examples/rust-capsules/transactional-aggregate/**'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe.rs'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe/**'
      - 'tools/typescript_guest/**'
      - 'tools/typescript_capsule.py'
      - 'tools/typescript*dependencies.py'
      - 'tools/typescript_dependency_authoring.py'
      - 'tools/npm_lock_authoring.py'
      - 'tools/typescript_generator_authoring.py'
      - 'tools/typescript_generator_fixture.py'
      - 'tools/tests/test_typescript_generator_authoring.py'
      - 'tools/tests/test_typescript_generator_fixture.py'
      - 'tools/typescript_registry_tls.py'
      - 'tools/npm_private_registry_fixture.py'
      - 'tools/qualify_npm_private_dependencies.py'
      - 'tools/tests/test_typescript_registry_tls.py'
      - 'tools/tests/test_npm_private_registry.py'
      - 'tools/tests/test_typescript_dependency_authoring.py'
      - 'tools/tests/test_npm_lock_authoring.py'
      - 'tools/guest_authoring_frontend.py'
      - 'tools/typescript_dependency_fixture.py'
      - 'tools/application_dependenc*.py'
      - 'tools/captured_compiler_isolation.py'
      - 'tools/build_typescript_guest_capsules.py'
      - 'tools/build_typescript_promise_library.py'
      - 'tools/build_typescript_native_engine.py'
      - 'tools/build_typescript_source_splicer.py'
      - 'tools/tests/test_typescript_splicer_build.py'
      - 'tools/tests/test_typescript_native_build.py'
      - 'tools/tests/test_typescript_promise_library.py'
      - 'tools/qualify_typescript_capsules.py'
      - 'tools/qualify_typescript_standard_clocks.py'
      - 'tools/typescript_standard_clock*.py'
      - 'tools/tests/test_typescript*clock*.py'
      - 'docs/component-development/typescript-standard-clocks.md'
      - tools/qualify_typescript_standard_entropy.py
      - tools/typescript_entropy_probe.py
      - tools/tests/test_typescript_entropy.py
      - tools/tests/test_typescript_entropy_campaign.py
      - docs/component-development/typescript-standard-entropy.md
      - 'tools/qualify_typescript_dependencies.py'
      - 'tools/qualify_typescript_dependency_refusals.py'
      - 'tools/tests/test_typescript_dependency_refusals.py'
      - 'tools/qualify_typescript_fetch_component.py'
      - 'tools/tests/test_typescript_fetch_component.py'
      - 'tools/qualify_typescript_fetch_runtime.py'
      - 'tools/tests/test_typescript_fetch_runtime.py'
      - 'tools/tests/test_typescript_application_dependencies.py'
      - 'tools/*rust_capsule*.py'
      - 'crates/latent-wasmtime/tests/**'
      - 'crates/latent-signing/**'
      - 'crates/latent-packaging/**'
      - 'apps/latentd/**'
      - '.cargo/managed-guest.toml'
      - 'docs/component-development/typescript-authoring.md'
      - 'docs/component-development/typescript-dependencies.md'
      - 'examples/typescript-capsules/**'
      - 'wit/platform/**'
      - 'tools/toolchain.toml'
      - 'examples/renderer-profile/package*.json'
      - '.github/workflows/typescript-guest.yml'
  push:
    branches: [development]
    paths:
      - 'sdk/typescript-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/qualify_transaction_contracts.py'
      - 'tools/compile_transaction_guests.py'
      - 'tools/transaction_guest_project.py'
      - 'tools/transaction_guest_variants.py'
      - 'tools/tests/test_transaction_guest_authoring.py'
      - 'tools/tests/test_transaction_guest_compilers.py'
      - 'examples/rust-capsules/transactional-aggregate/**'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe.rs'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe/**'
      - 'tools/typescript_guest/**'
      - 'tools/typescript_capsule.py'
      - 'tools/typescript*dependencies.py'
      - 'tools/typescript_dependency_authoring.py'
      - 'tools/npm_lock_authoring.py'
      - 'tools/typescript_generator_authoring.py'
      - 'tools/typescript_generator_fixture.py'
      - 'tools/tests/test_typescript_generator_authoring.py'
      - 'tools/tests/test_typescript_generator_fixture.py'
      - 'tools/typescript_registry_tls.py'
      - 'tools/npm_private_registry_fixture.py'
      - 'tools/qualify_npm_private_dependencies.py'
      - 'tools/tests/test_typescript_registry_tls.py'
      - 'tools/tests/test_npm_private_registry.py'
      - 'tools/tests/test_typescript_dependency_authoring.py'
      - 'tools/tests/test_npm_lock_authoring.py'
      - 'tools/guest_authoring_frontend.py'
      - 'tools/typescript_dependency_fixture.py'
      - 'tools/application_dependenc*.py'
      - 'tools/captured_compiler_isolation.py'
      - 'tools/build_typescript_guest_capsules.py'
      - 'tools/build_typescript_promise_library.py'
      - 'tools/build_typescript_native_engine.py'
      - 'tools/build_typescript_source_splicer.py'
      - 'tools/tests/test_typescript_splicer_build.py'
      - 'tools/tests/test_typescript_native_build.py'
      - 'tools/tests/test_typescript_promise_library.py'
      - 'tools/qualify_typescript_capsules.py'
      - 'tools/qualify_typescript_standard_clocks.py'
      - 'tools/typescript_standard_clock*.py'
      - 'tools/tests/test_typescript*clock*.py'
      - 'docs/component-development/typescript-standard-clocks.md'
      - tools/qualify_typescript_standard_entropy.py
      - tools/typescript_entropy_probe.py
      - tools/tests/test_typescript_entropy.py
      - tools/tests/test_typescript_entropy_campaign.py
      - docs/component-development/typescript-standard-entropy.md
      - 'tools/qualify_typescript_dependencies.py'
      - 'tools/qualify_typescript_dependency_refusals.py'
      - 'tools/tests/test_typescript_dependency_refusals.py'
      - 'tools/qualify_typescript_fetch_component.py'
      - 'tools/tests/test_typescript_fetch_component.py'
      - 'tools/qualify_typescript_fetch_runtime.py'
      - 'tools/tests/test_typescript_fetch_runtime.py'
      - 'tools/tests/test_typescript_application_dependencies.py'
      - 'tools/*rust_capsule*.py'
      - 'crates/latent-wasmtime/tests/**'
      - 'crates/latent-signing/**'
      - 'crates/latent-packaging/**'
      - 'apps/latentd/**'
      - '.cargo/managed-guest.toml'
      - 'docs/component-development/typescript-authoring.md'
      - 'docs/component-development/typescript-dependencies.md'
      - 'examples/typescript-capsules/**'
      - 'wit/platform/**'
      - 'tools/toolchain.toml'
      - 'examples/renderer-profile/package*.json'
      - '.github/workflows/typescript-guest.yml'
  workflow_dispatch:
    inputs:
      observe-failed-fetch:
        description: Replay the authenticated d412 Fetch failure with bounded private frames
        type: boolean
        default: false
      observe-fetch-boundaries:
        description: Compile only new boundary probes using authenticated d412 SDK products
        type: boolean
        default: false
      replay-entropy-policy:
        description: Re-sign unchanged02f components and qualify the explicit zero-input policy ceiling
        type: boolean
        default: false
      qualify-standard-clocks:
        description: Build two ordinary clock probes using original engine and native products
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: typescript-guest-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  source-splicer:
    if: ${{ !inputs.observe-failed-fetch && !inputs.observe-fetch-boundaries && !inputs.replay-entropy-policy && !inputs.qualify-standard-clocks }}
    name: Source-owned asynchronous import compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip1
      - name: Check compiler closure ownership and source-splicer input identities
        run: python3 -m unittest tools.tests.test_typescript_splicer_build tools.tests.test_typescript_splicer_input tools.tests.test_typescript_import_source -v
      - name: Install the original locked compiler namespace
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-splicer-tools"
      - name: Compile and transpile the actual derived source splicer
        run: python3 tools/build_typescript_source_splicer.py --tools "$RUNNER_TEMP/typescript-splicer-tools" --output "$RUNNER_TEMP/typescript-source-splicer"
      - name: Freeze reusable source compiler products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-source-splicer-input-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-source-splicer/*.json
            ${{ runner.temp }}/typescript-source-splicer/splicer/**
            ${{ runner.temp }}/typescript-source-splicer/licenses/**
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual source compiler products and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-source-splicer-${{ github.sha }}
          path: |
            tools/ci/contracts/
            ${{ runner.temp }}/typescript-source-splicer/*.json
            ${{ runner.temp }}/typescript-source-splicer/*.log
            ${{ runner.temp }}/typescript-source-splicer/componentize.archive
            ${{ runner.temp }}/typescript-source-splicer/spidermonkey-embedding-splicer.wasm
            ${{ runner.temp }}/typescript-source-splicer/splicer/**
            ${{ runner.temp }}/typescript-source-splicer/licenses/**
          if-no-files-found: error
          retention-days: 7
  promise-library:
    name: Patched SpiderMonkey intrinsic Promise library
    needs: [source-splicer]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip1
      - name: Check pinned source acquisition and archive boundaries
        run: python3 -m unittest tools.tests.test_typescript_promise_library -v
      - name: Install normal SpiderMonkey build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 lld-18 autoconf2.13 m4 libffi-dev python3-dev
      - name: Compile the actual patched intrinsic Promise implementation
        run: python3 tools/build_typescript_promise_library.py --output "$RUNNER_TEMP/typescript-promise-library"
      - name: Check normal engine library and header ownership boundaries
        run: python3 -m unittest tools.tests.test_typescript_native_build -v
      - name: Install the exact maintained engine bindings generator
        run: python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/typescript-promise-tools"
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Link the actual source-owned Promise and clock engine
        run: python3 tools/build_typescript_native_engine.py --library "$RUNNER_TEMP/typescript-promise-library" --output "$RUNNER_TEMP/typescript-native-engine" --wit-bindgen "$RUNNER_TEMP/typescript-promise-tools/wit-bindgen"
      - name: Read the completed source compiler products from this exact run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-source-splicer-input-${{ github.sha }}
          path: ${{ runner.temp }}/typescript-source-splicer-input
      - name: Link the explicit source-owned asynchronous import engine
        run: python3 tools/build_typescript_native_engine.py --library "$RUNNER_TEMP/typescript-promise-library" --source-splicer-build "$RUNNER_TEMP/typescript-source-splicer-input" --output "$RUNNER_TEMP/typescript-native-import-engine" --wit-bindgen "$RUNNER_TEMP/typescript-promise-tools/wit-bindgen"
      - name: Freeze the exact engine for actual Fetch component construction
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-fetch-engine-input-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-native-import-engine/engine.wasm
            ${{ runner.temp }}/typescript-native-import-engine/engine-input.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain source identities, normal products and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-promise-library-${{ github.sha }}
          path: |
            tools/ci/contracts/
            tools/typescript_guest/promise_library.py
            tools/typescript_guest/promise_engine.py
            sdk/typescript-guest/activation/promise_hooks.h
            ${{ runner.temp }}/typescript-promise-library/*.json
            ${{ runner.temp }}/typescript-promise-library/*.log
            ${{ runner.temp }}/typescript-promise-library/mozconfig
            ${{ runner.temp }}/typescript-promise-library/licenses/**
            ${{ runner.temp }}/typescript-promise-library/obj/**/libjs_static.a
            ${{ runner.temp }}/typescript-promise-library/obj/dist/include/**
            ${{ runner.temp }}/typescript-promise-library/obj/config.log
            ${{ runner.temp }}/typescript-promise-library/obj/config.status
            ${{ runner.temp }}/typescript-native-engine/*.json
            ${{ runner.temp }}/typescript-native-engine/*.log
            ${{ runner.temp }}/typescript-native-engine/engine.wasm
            ${{ runner.temp }}/typescript-native-engine/licenses/**
            ${{ runner.temp }}/typescript-native-engine/build/CMakeCache.txt
            ${{ runner.temp }}/typescript-native-engine/build/compile_commands.json
            ${{ runner.temp }}/typescript-native-engine/build/starling-raw.wasm/Cargo.lock
            ${{ runner.temp }}/typescript-native-engine/build/starling-raw.wasm/Cargo.toml
            ${{ runner.temp }}/typescript-native-engine/jobs-generated/**
            ${{ runner.temp }}/typescript-native-engine/clocks-generated/**
            ${{ runner.temp }}/typescript-native-import-engine/*.json
            ${{ runner.temp }}/typescript-native-import-engine/*.log
            ${{ runner.temp }}/typescript-native-import-engine/engine.wasm
            ${{ runner.temp }}/typescript-native-import-engine/licenses/**
            ${{ runner.temp }}/typescript-native-import-engine/build/CMakeCache.txt
            ${{ runner.temp }}/typescript-native-import-engine/build/starling-raw.wasm/builtins.incl
            ${{ runner.temp }}/typescript-native-import-engine/build/compile_commands.json
            ${{ runner.temp }}/typescript-native-import-engine/jobs-generated/**
            ${{ runner.temp }}/typescript-native-import-engine/clocks-generated/**
          if-no-files-found: error
          retention-days: 7
  fetch-component:
    name: Actual source-owned Fetch component construction
    needs: [source-splicer, promise-library]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Check exact Fetch compiler handoff and qualification boundaries
        run: python3 -m unittest tools.tests.test_typescript_fetch_component -v
      - name: Install the existing isolated compiler boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the original locked compiler namespace
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-fetch-tools"
      - name: Read the source compiler from this exact run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-source-splicer-input-${{ github.sha }}
          path: ${{ runner.temp }}/typescript-fetch-splicer
      - name: Read the actual import engine from this exact run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-fetch-engine-input-${{ github.sha }}
          path: ${{ runner.temp }}/typescript-fetch-engine
      - name: Compile actual default-global Fetch with the source-owned async engine
        run: python3 tools/qualify_typescript_fetch_component.py --tools "$RUNNER_TEMP/typescript-fetch-tools" --engine "$RUNNER_TEMP/typescript-fetch-engine" --splicer "$RUNNER_TEMP/typescript-fetch-splicer" --output "$RUNNER_TEMP/typescript-fetch-component"
      - name: Retain actual component, input identities and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-fetch-component-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-fetch-component/*.json
            ${{ runner.temp }}/typescript-fetch-component/logs/**
            ${{ runner.temp }}/typescript-fetch-component/compiled/*.json
            ${{ runner.temp }}/typescript-fetch-component/compiled/*.wit
            ${{ runner.temp }}/typescript-fetch-component/compiled/application.mjs
            ${{ runner.temp }}/typescript-fetch-component/compiled/component.wasm
          if-no-files-found: warn
          retention-days: 7
  boundary:
    if: ${{ !inputs.observe-failed-fetch && !inputs.observe-fetch-boundaries && !inputs.replay-entropy-policy && !inputs.qualify-standard-clocks }}
    name: TypeScript guest value and ownership boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture immutable qualification source inputs
        shell: bash
        run: |
          # Retain every input used below, including the pinned compiler lock.
          # Historical benchmark archives are not inputs to this runtime lane.
          git archive --format=tar.gz --output "$RUNNER_TEMP/typescript-guest-source.tar.gz" HEAD -- \
            apps sdk/typescript-guest sdk/rust examples tools crates wit schemas docs .cargo \
            Cargo.toml Cargo.lock rust-toolchain.toml LICENSE NOTICE .github/workflows/typescript-guest.yml
          test "$(stat --format=%s "$RUNNER_TEMP/typescript-guest-source.tar.gz")" -le 134217728
          git rev-parse HEAD > "$RUNNER_TEMP/typescript-guest-source.sha"
      - name: Retain the exact reviewed command contract input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-guest-command-contract-${{ github.sha }}
          path: |
            tools/ci/contracts/
            ${{ runner.temp }}/typescript-guest-source.tar.gz
            ${{ runner.temp }}/typescript-guest-source.sha
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript-guest/tools/package-lock.json
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Install captured JavaScript compiler namespace
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the reviewed JavaScript compiler inputs
        run: |
          python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-guest-tools"
      - name: Test the explicit strict console and activation module initialization
        run: LSF_TYPESCRIPT_FRONTEND="$RUNNER_TEMP/typescript-guest-tools" python3 -m unittest tools.tests.test_typescript_console -v
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install pinned component validator
        run: test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
      - name: Qualify proposed transaction shapes with the maintained stackful TypeScript compiler
        run: python3 tools/qualify_transaction_contracts.py --language typescript --tools "$RUNNER_TEMP/typescript-guest-tools" --output "$RUNNER_TEMP/transaction-contract-typescript"
      - name: Compile the authored transaction aggregate and forbidden immediate HTTP variant
        run: python3 tools/compile_transaction_guests.py --language typescript --tools "$RUNNER_TEMP/typescript-guest-tools" --output "$RUNNER_TEMP/transaction-guests-typescript"
      - name: Compile the real async-boundary diagnostic
