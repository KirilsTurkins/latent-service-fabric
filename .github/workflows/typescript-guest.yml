name: TypeScript guest qualification

on:
  pull_request:
    paths:
      - 'sdk/typescript-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/qualify_transaction_contracts.py'
      - 'tools/compile_transaction_guests.py'
      - 'tools/transaction_guest_project.py'
      - 'tools/transaction_guest_variants.py'
      - 'tools/tests/test_transaction_guest_authoring.py'
      - 'tools/tests/test_transaction_guest_compilers.py'
      - 'examples/rust-capsules/transactional-aggregate/**'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe.rs'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe/**'
      - 'tools/typescript_guest/**'
      - 'tools/typescript_capsule.py'
      - 'tools/build_typescript_guest_capsules.py'
      - 'tools/qualify_typescript_capsules.py'
      - 'tools/*rust_capsule*.py'
      - 'crates/latent-wasmtime/tests/**'
      - 'crates/latent-signing/**'
      - 'crates/latent-packaging/**'
      - 'apps/latentd/**'
      - '.cargo/managed-guest.toml'
      - 'docs/component-development/typescript-authoring.md'
      - 'examples/typescript-capsules/**'
      - 'wit/platform/**'
      - 'tools/toolchain.toml'
      - 'examples/renderer-profile/package*.json'
      - '.github/workflows/typescript-guest.yml'
  push:
    branches: [development]
    paths:
      - 'sdk/typescript-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/qualify_transaction_contracts.py'
      - 'tools/compile_transaction_guests.py'
      - 'tools/transaction_guest_project.py'
      - 'tools/transaction_guest_variants.py'
      - 'tools/tests/test_transaction_guest_authoring.py'
      - 'tools/tests/test_transaction_guest_compilers.py'
      - 'examples/rust-capsules/transactional-aggregate/**'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe.rs'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe/**'
      - 'tools/typescript_guest/**'
      - 'tools/typescript_capsule.py'
      - 'tools/build_typescript_guest_capsules.py'
      - 'tools/qualify_typescript_capsules.py'
      - 'tools/*rust_capsule*.py'
      - 'crates/latent-wasmtime/tests/**'
      - 'crates/latent-signing/**'
      - 'crates/latent-packaging/**'
      - 'apps/latentd/**'
      - '.cargo/managed-guest.toml'
      - 'docs/component-development/typescript-authoring.md'
      - 'examples/typescript-capsules/**'
      - 'wit/platform/**'
      - 'tools/toolchain.toml'
      - 'examples/renderer-profile/package*.json'
      - '.github/workflows/typescript-guest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-guest-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  boundary:
    name: TypeScript guest value and ownership boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture immutable qualification source inputs
        shell: bash
        run: |
          # Retain every input used below, including the pinned compiler lock.
          # Historical benchmark archives are not inputs to this runtime lane.
          git archive --format=tar.gz --output "$RUNNER_TEMP/typescript-guest-source.tar.gz" HEAD -- \
            apps sdk/typescript-guest sdk/rust examples tools crates wit schemas docs .cargo \
            Cargo.toml Cargo.lock rust-toolchain.toml LICENSE NOTICE .github/workflows/typescript-guest.yml
          test "$(stat --format=%s "$RUNNER_TEMP/typescript-guest-source.tar.gz")" -le 134217728
          git rev-parse HEAD > "$RUNNER_TEMP/typescript-guest-source.sha"
      - name: Retain the exact reviewed command contract input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-guest-command-contract-${{ github.sha }}
          path: |
            tools/ci/contracts/
            ${{ runner.temp }}/typescript-guest-source.tar.gz
            ${{ runner.temp }}/typescript-guest-source.sha
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript-guest/tools/package-lock.json
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Install the reviewed JavaScript compiler inputs
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-guest-tools"
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install pinned component validator
        run: test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
      - name: Qualify proposed transaction shapes with the maintained stackful TypeScript compiler
        run: python3 tools/qualify_transaction_contracts.py --language typescript --tools "$RUNNER_TEMP/typescript-guest-tools" --output "$RUNNER_TEMP/transaction-contract-typescript"
      - name: Compile the authored transaction aggregate and forbidden immediate HTTP variant
        run: python3 tools/compile_transaction_guests.py --language typescript --tools "$RUNNER_TEMP/typescript-guest-tools" --output "$RUNNER_TEMP/transaction-guests-typescript"
      - name: Compile the real async-boundary diagnostic
        run: python3 tools/typescript_guest/probe.py --output "$RUNNER_TEMP/typescript-guest-probe" --node "$(command -v node)" --wasm-tools "$(command -v wasm-tools)" --compiler "$RUNNER_TEMP/typescript-guest-tools/node_modules/@bytecodealliance/componentize-js/src/componentize.js"
      - name: Execute the compiled async-boundary diagnostic
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml run --locked -p latent-wasmtime --example typescript_runtime_probe -- "$RUNNER_TEMP/typescript-guest-probe/component.wasm" 2>&1 | tee "$RUNNER_TEMP/typescript-guest-probe/runtime.log"
      - name: Execute supplementary value and ownership models
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/typescript-guest-runtime
          node "$RUNNER_TEMP/typescript-guest-tools/node_modules/typescript/bin/tsc" --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --lib ES2022 --outDir target/typescript-guest-runtime sdk/typescript-guest/runtime/*.ts sdk/typescript-guest/tests/model/*.ts
          printf '{"type":"module"}\n' > target/typescript-guest-runtime/package.json
          LSF_TYPESCRIPT_RUNTIME="$PWD/target/typescript-guest-runtime/tests/model" node --test sdk/typescript-guest/tests/runtime.test.mjs 2>&1 | tee target/typescript-guest-runtime/runtime-tests.log
      - name: Check captured sources and actual generated-resource owners
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/requirements.lock
          python3 -m unittest tools.tests.test_typescript_capsule_authoring tools.tests.test_build_provenance_schemas
          node "$RUNNER_TEMP/typescript-guest-tools/node_modules/typescript/bin/tsc" --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --lib ES2022 --outDir target/typescript-owner-tests sdk/typescript-guest/capabilities/owner.ts sdk/typescript-guest/capabilities/result.ts
          printf '{"type":"module"}\n' > target/typescript-owner-tests/package.json
          LSF_TYPESCRIPT_OWNERS="$PWD/target/typescript-owner-tests" node --test sdk/typescript-guest/tests/owner.test.mjs sdk/typescript-guest/tests/signed64.test.mjs 2>&1 | tee target/typescript-guest-runtime/owner-tests.log
      - name: Qualify captured projects, all SDK owners, enforced node and printed guide
        run: python3 tools/qualify_typescript_capsules.py --output "$RUNNER_TEMP/typescript-capsule-authoring" --tools "$RUNNER_TEMP/typescript-guest-tools"
      - name: Preserve attempted runtime test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-guest-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/transaction-guests-typescript/**/report.json
            ${{ runner.temp }}/transaction-guests-typescript/**/source-inputs.json
            ${{ runner.temp }}/transaction-guests-typescript/**/recipe-inputs.json
            ${{ runner.temp }}/transaction-guests-typescript/**/source.tar.gz
            ${{ runner.temp }}/transaction-guests-typescript/**/component.wasm
            ${{ runner.temp }}/transaction-guests-typescript/**/component.wit
            ${{ runner.temp }}/transaction-guests-typescript/**/compiler-inputs.json
            ${{ runner.temp }}/transaction-guests-typescript/**/logs/**
            ${{ runner.temp }}/transaction-guests-typescript/**/compiler/*.log
            ${{ runner.temp }}/transaction-guests-typescript/**/compiler/*.command.json
            ${{ runner.temp }}/transaction-guests-typescript/**/compiled/generated/**
            ${{ runner.temp }}/transaction-guests-typescript/**/compiled/bindings/**
            ${{ runner.temp }}/transaction-guests-typescript/**/bindings/**
            ${{ runner.temp }}/transaction-guests-typescript/**/compiled/raw-generated-bindings.json
            ${{ runner.temp }}/transaction-contract-typescript/report.json
            ${{ runner.temp }}/transaction-contract-typescript/source.tar.gz
            ${{ runner.temp }}/transaction-contract-typescript/component.wit
            ${{ runner.temp }}/transaction-contract-typescript/preparation.json
            ${{ runner.temp }}/transaction-contract-typescript/compiler-inputs.json
            ${{ runner.temp }}/transaction-contract-typescript/logs/**
            ${{ runner.temp }}/transaction-contract-typescript/compiler/*.log
            ${{ runner.temp }}/transaction-contract-typescript/compiler/*.command.json
            ${{ runner.temp }}/transaction-contract-typescript/compiled/component.wasm
            ${{ runner.temp }}/transaction-contract-typescript/compiled/component.wit
            ${{ runner.temp }}/transaction-contract-typescript/compiled/bindings/**
            ${{ runner.temp }}/transaction-contract-typescript/compiled/generated/**
            ${{ runner.temp }}/transaction-contract-typescript/compiled/raw-generated-bindings.json
            ${{ runner.temp }}/transaction-contract-typescript/bindings/**
            ${{ runner.temp }}/transaction-contract-typescript/component.wasm
            target/typescript-guest-runtime/runtime-tests.log
            target/typescript-guest-runtime/owner-tests.log
            ${{ runner.temp }}/typescript-guest-probe/
            ${{ runner.temp }}/typescript-capsule-authoring/
          if-no-files-found: warn
          retention-days: 7
