name: PR 2151 native graph pressure validation
on:
  push:
    branches: [diag/pr2151-native-pressure-20261121]
    paths: [.github/workflows/pr2151-native-pressure-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: fb0feebc63b302c63c0e37791da735ca476607c8
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - name: Apply only the authenticated six-file repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          patch = gzip.decompress(base64.b64decode(''.replace('JkoWYEl', 'JkoWEl'), validate=True))
          assert len(patch) == 23693 and hashlib.sha256(patch).hexdigest() == '481b5ce00b0b14b85c18e4734eba890a338ec80f04e781ffd4741062d4012c85'
          rows = [
            ['sdk/typescript-guest/activation/native_engine.cpp','64bcb5c77a49ad34ccccc1bf61ea4a7d5c8e4244','07d02a6142c7c9d610717af7c5479c2724c11857'],
            ['sdk/typescript-guest/activation/native_objects.h','0769f2b27b8a47dd9713e6bd899dc42f82fe65af','6760ce6d8d3c6869ead95b32f6c78354c3ae6225'],
            ['tools/typescript_guest/event_engine.py','913cbf5cbebbb941f27913a6ec590c78ded712de','2f880bc37e46d715bd46f1c4781170244c780325'],
            ['tools/tests/test_typescript_event_ownership.py','33839447fed52a7c1d0d1cb82157acaac9e004ad','d045d49bff32861351605150f2646fbcba9ee150'],
            ['tools/tests/fixtures/typescript_graph_pressure.cpp',None,'e51b18e2b7e9d2ba1a04e706a22896411ef3794c'],
            ['sdk/typescript-guest/README.md','359944fc26b9f388e4a3bf99605ac73d869ef3e3','68d59950a0e09541556e862309fef5dee188c080']]
          def blob(p):
              b = p.read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == 'fb0feebc63b302c63c0e37791da735ca476607c8'
          for name, before, after in rows:
              p = pathlib.Path(name)
              assert blob(p) == before if before else not p.exists(), name
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'pressure-postimages'
          for name, before, after in rows:
              p = pathlib.Path(name)
              assert blob(p) == after, name
              dest = output/name
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(p.read_bytes())
          (output/'manifest.json').write_text(json.dumps(rows, indent=2)+'\n')
          subprocess.run(['git','add','--',*[r[0] for r in rows]], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()) == {r[0] for r in rows}
          print(json.dumps({'source':'fb0feebc63b302c63c0e37791da735ca476607c8','postimages':rows}))
          PY
      - name: Run original source ownership and finite collector controls
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_typescript_event_ownership tools.tests.test_typescript_abort_any_ownership tools.tests.test_typescript_record_retirement tools.tests.test_typescript_native_build -v 2>&1 | tee "$RUNNER_TEMP/pressure-focused.log"
          python3 -B tools/validate_repository.py 2>&1 | tee "$RUNNER_TEMP/pressure-repository.log"
      - name: Run finite native graph controls with address and undefined-behavior sanitizers
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexec g++ -fsanitize=address,undefined -fno-omit-frame-pointer "$@"\n' > "$RUNNER_TEMP/pressure-cxx"
          chmod +x "$RUNNER_TEMP/pressure-cxx"
          LSF_TYPESCRIPT_RECORD_CXX="$RUNNER_TEMP/pressure-cxx" python3 -B -m unittest tools.tests.test_typescript_event_ownership.NativeGraphPressureControls -v 2>&1 | tee "$RUNNER_TEMP/pressure-sanitizers.log"
      - name: Retain exact tested postimages
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pressure-postimages
          path: ${{ runner.temp }}/pressure-postimages
          if-no-files-found: error
          retention-days: 3
      - name: Retain validation logs
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pressure-validation-logs
          path: ${{ runner.temp }}/pressure-*.log
          if-no-files-found: warn
          retention-days: 3
  blobs:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: pressure-postimages
          path: postimages
          digest-mismatch: error
      - name: Publish only validated Git blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          expected = {
            'sdk/typescript-guest/activation/native_engine.cpp':'07d02a6142c7c9d610717af7c5479c2724c11857',
            'sdk/typescript-guest/activation/native_objects.h':'6760ce6d8d3c6869ead95b32f6c78354c3ae6225',
            'tools/typescript_guest/event_engine.py':'2f880bc37e46d715bd46f1c4781170244c780325',
            'tools/tests/test_typescript_event_ownership.py':'d045d49bff32861351605150f2646fbcba9ee150',
            'tools/tests/fixtures/typescript_graph_pressure.cpp':'e51b18e2b7e9d2ba1a04e706a22896411ef3794c',
            'sdk/typescript-guest/README.md':'68d59950a0e09541556e862309fef5dee188c080'}
          root=pathlib.Path('postimages')
          rows=json.loads((root/'manifest.json').read_text())
          assert {p:h for p,_,h in rows} == expected and len(rows) == 6
          material={}
          for path, sha in expected.items():
              p=root/path
              assert p.is_file() and not p.is_symlink()
              data=p.read_bytes()
              assert len(data) < 100000
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
              material[path]=data
          observed=[]
          for path,data in material.items():
              request=urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              assert result['sha'] == expected[path]
              observed.append({'path':path,'sha':result['sha']})
          result={'source':'fb0feebc63b302c63c0e37791da735ca476607c8','blobs':observed,'refsMoved':False,'signedQualification':False}
          pathlib.Path('published-blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pressure-published-blobs
          path: published-blobs.json
          if-no-files-found: error
          retention-days: 3
