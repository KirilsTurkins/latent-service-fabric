name: PR 1657 exact signed-witness artifact inspection
on:
  push:
    branches: ['diag/pr1657-witness-inspection-20261106']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - name: Verify exact public archive and summarize progress and retirement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/pr1657_read_witness.py
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-witness-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/pr1657-witness-inspection.json
          if-no-files-found: warn
          retention-days: 7
