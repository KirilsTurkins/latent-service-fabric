permissions:
  contents: read

concurrency:
  group: c-once-current-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'

jobs:
  once:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/feat/c-root-drain-signed-20261108') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Current-source signed ordinary C once interleaving
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Start the finite C once qualification clock
        run: echo "LSF_C_ONCE_STARTED_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Restore compiled Rust dependencies
        uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        with:
          version: '0.16.0'
      - name: Prepare pinned bindings and compiler containment
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools"
          echo "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build current products and qualify signed once and root-drain activations
        run: |
          python3 -B -m unittest tools.tests.test_c_once_runtime
          python3 -B tools/qualify_c_once_runtime.py --zig "$(command -v zig)" --wit-bindgen "$(command -v wit-bindgen)" --wasm-tools "$(command -v wasm-tools)" --output "$RUNNER_TEMP/c-once-runtime"
      - name: Retain bounded once proof including failures
        if: ${{ !cancelled() }}
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-once-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/c-once-runtime/qualified.json
            ${{ runner.temp }}/c-once-runtime/FAILED.json
            ${{ runner.temp }}/c-once-runtime/logs/**
            ${{ runner.temp }}/c-once-runtime/owner-inputs/**
            ${{ runner.temp }}/c-once-runtime/project/**
            ${{ runner.temp }}/c-once-runtime/build/**
            ${{ runner.temp }}/c-once-runtime/native-build/logs/**
            ${{ runner.temp }}/c-once-runtime/native-build/native/native-tuple.json
            ${{ runner.temp }}/c-once-runtime/node/qualified.json
            ${{ runner.temp }}/c-once-runtime/node/FAILED.json
            ${{ runner.temp }}/c-once-runtime/node/signed/release-set.json
            ${{ runner.temp }}/c-once-runtime/node/signed/c-thread-runtime/package/**
            ${{ runner.temp }}/c-once-runtime/node/signed/c-thread-runtime/evidence/**
            ${{ runner.temp }}/c-once-runtime/node/signed/c-thread-runtime/deployment.json
            ${{ runner.temp }}/c-once-runtime/node/controls/**
            ${{ runner.temp }}/c-once-runtime/node/commands/**
            ${{ runner.temp }}/c-once-runtime/node/invocation-*.json
            ${{ runner.temp }}/c-once-runtime/node/retirement-*.json
            ${{ runner.temp }}/c-once-runtime/node/*.stdout
            ${{ runner.temp }}/c-once-runtime/node/*.stderr
          if-no-files-found: warn
          retention-days: 7
