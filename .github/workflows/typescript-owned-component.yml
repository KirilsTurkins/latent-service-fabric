name: TypeScript canonical OWN diagnostic

on:
  push:
    branches: ['feat/typescript-owned-canonical-source-20261024']
    paths:
      - '.github/workflows/typescript-owned-component.yml'
      - 'tools/qualify_typescript_owned_component.py'
      - 'tools/typescript_guest/owned_component_controls.py'
      - 'tools/typescript_guest/owned_result_component.py'
      - 'tools/typescript_guest/owned_result_fixture.*'
      - 'tools/typescript_guest/borrow_signed_inputs.py'
      - 'tools/tests/test_typescript_owned_component.py'
      - 'tools/tests/test_typescript_owned_fixture.py'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe*'
      - 'crates/latent-wasmtime/examples/typescript_runtime_probe/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Closed diagnostic profile using the exact completed normal producer
        type: choice
        default: canonical-own
        options: [canonical-own, late-backing]

permissions:
  contents: read

concurrency:
  group: typescript-canonical-own-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-own:
    name: Actual canonical OWN disposal and bounded payload reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Start the single setup acquisition build and execution deadline
        run: python3 -c 'import os,time;open(os.environ["GITHUB_ENV"],"a").write("LSF_OWN_COMPONENT_STARTED_NS="+str(time.time_ns())+"\n")'
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@c1136b2d97fe79ef645e9508b2048a222f50a170 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Make the exact successful producer source available for immutable checks
        run: git fetch --no-tags --depth=1 origin 6d834e502beea33fbae9347fbaf23ff8c37223b3
      - name: Install normal isolated compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the normal pinned public compiler
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-own-canonical-tools"
      - name: Acquire the one exact successful fresh OWN input artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -c 'import os;from pathlib import Path;from tools.typescript_guest.borrow_signed_inputs import prepare;prepare(Path(os.environ["RUNNER_TEMP"])/"typescript-own-canonical-inputs")'
      - name: Run mandatory source controls and the selected actual component cases
        env:
          LSF_OWN_COMPONENT_PROFILE: ${{ inputs.profile || 'canonical-own' }}
        run: |
          python3 tools/qualify_typescript_owned_component.py \
            --tools "$RUNNER_TEMP/typescript-own-canonical-tools" \
            --prepared-products "$RUNNER_TEMP/typescript-own-canonical-inputs/products" \
            --profile "$LSF_OWN_COMPONENT_PROFILE" \
            --output "$RUNNER_TEMP/typescript-own-canonical"
      - name: Retain actual component source probe observations and failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-own-canonical-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-own-canonical-inputs/ACQUIRED.json
            ${{ runner.temp }}/typescript-own-canonical-inputs/products/**
            ${{ runner.temp }}/typescript-own-canonical/*.json
            ${{ runner.temp }}/typescript-own-canonical/logs/**
            ${{ runner.temp }}/typescript-own-canonical/fixture/**
            ${{ runner.temp }}/typescript-own-canonical/compiled/**
            ${{ runner.temp }}/typescript-own-canonical/cargo-target/debug/examples/typescript_runtime_probe
          if-no-files-found: warn
          retention-days: 7
