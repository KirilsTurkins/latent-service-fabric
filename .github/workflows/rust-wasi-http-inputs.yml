name: Rust default WASI HTTP compiler inputs

on:
  push:
    branches: ['feat/rust-wasi-http-inputs-20261021']
    paths: ['.github/workflows/rust-wasi-http-inputs.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-wasi-http-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler-inputs:
    name: Capture two ordinary clients and observe actual compiler imports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        with:
          version: '0.16.0'
      - name: Prepare only the normal captured compiler boundary and pinned binding tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/rust-http-tools"
          echo "$RUNNER_TEMP/rust-http-tools" >> "$GITHUB_PATH"
      - name: Fetch the frozen native producer source for exact verification
        run: git fetch --no-tags --depth=1 origin fc9b44a6b8dce9effd6b490f1a169a7ad8edbf12
      - name: Check unchanged clients and exact source and executable-input refusal controls
        run: python3 -B -m unittest tools.tests.test_rust_wasi_http_inputs -q
      - name: Authenticate existing Wasmtime48.0.7 products without building a host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wasmtime_48_0_7_native_products.py --output "$RUNNER_TEMP/rust-http-native"
      - name: Capture and compile one developer-owned crate and retain actual imports without HTTP pass credit
        run: >-
          python3 -B tools/qualify_rust_wasi_http_inputs.py
          --native-products "$RUNNER_TEMP/rust-http-native"
          --output "$RUNNER_TEMP/rust-http-inputs"
      - name: Retain bounded public input and original build observations including failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wasi-http-inputs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-inputs/observation.json
            ${{ runner.temp }}/rust-http-inputs/FAILED.json
            ${{ runner.temp }}/rust-http-inputs/capture.json
            ${{ runner.temp }}/rust-http-inputs/component-wit.json
            ${{ runner.temp }}/rust-http-inputs/logs/**
            ${{ runner.temp }}/rust-http-inputs/source/candidate.json
            ${{ runner.temp }}/rust-http-inputs/source/application/Cargo.toml
            ${{ runner.temp }}/rust-http-inputs/source/application/Cargo.lock
            ${{ runner.temp }}/rust-http-inputs/source/application/latent.dependencies*.json
            ${{ runner.temp }}/rust-http-inputs/source/application/cargo-resolved.lock.json
            ${{ runner.temp }}/rust-http-inputs/approval-required/*.json
            ${{ runner.temp }}/rust-http-inputs/approval-required/logs/**
            ${{ runner.temp }}/rust-http-inputs/build/*.json
            ${{ runner.temp }}/rust-http-inputs/build/logs/**
            ${{ runner.temp }}/rust-http-inputs/build/raw-core.wasm
            ${{ runner.temp }}/rust-http-inputs/build/component.wasm
            ${{ runner.temp }}/rust-http-native/*.json
          if-no-files-found: warn
          retention-days: 3
