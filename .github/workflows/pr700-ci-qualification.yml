name: PR 700 CI qualification

on:
  push:
    branches: [fix/pr700-ci-qualification-20260930]
    paths: [.github/workflows/pr700-ci-qualification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 484c46aef9b36e41b436c03dbc6be5493872a25d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - name: Prepare the exact merge candidate without publishing repository changes
        env:
          PR_HEAD: 484c46aef9b36e41b436c03dbc6be5493872a25d
          BASE_HEAD: 711c5773eab56487270b95d395bb6e4879394ea7
        run: |
          git config user.name 'PR 700 qualification'
          git config user.email 'qualification@localhost'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          root = pathlib.Path.cwd()
          head, base = os.environ['PR_HEAD'], os.environ['BASE_HEAD']
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == head
          assert git('merge-base', head, base).decode().strip() == '40271d0e6bc31a239f2878ee62346d395900ab8e'
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', base])
          assert result.returncode in (0, 1), result.returncode
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').decode().splitlines())
          expected = {'.github/workflows/ci.yml', 'docs/development/workflow-action-pins.md',
                      'tools/ci/contracts/workflows/ci.yml/jobs/msrv.json'}
          assert conflicts <= expected, sorted(conflicts)
          for name in sorted(expected):
              incoming = git('show', f'{base}:{name}').decode()
              assert '1.94.1' in incoming, name
              if name.endswith('.json'):
                  record = json.loads(incoming)
                  # Historical commands are immutable obligations, not the
                  # current minimum. Change only the current job definition.
                  record['definition'] = json.loads(json.dumps(record['definition']).replace('1.94.1', '1.95.0'))
                  record['reviewReason'] = ('Preserve historical command coverage and incoming explicit MSRV installation; '
                                             'check the updated dependency graph with declared Rust 1.95.0.')
                  incoming = json.dumps(record, indent=2, sort_keys=True) + '\n'
              else:
                  incoming = incoming.replace('1.94.1', '1.95.0')
              (root / name).write_text(incoming)
              subprocess.run(['git', 'add', '--', name], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          from tools import ci_contracts
          name = 'tools/tests/test_dev_build_cache.py'
          path = root / 'tools/ci/contracts/python/test_dev_build_cache.py.json'
          old = json.loads(path.read_text())
          observed = ci_contracts.python_expectations(root)[name]
          assert set(old['cases']) <= set(observed['cases'])
          assert len(set(observed['cases']) - set(old['cases'])) == 8
          assert all(old['guards'][case] == observed['guards'][case] for case in old['cases'])
          old.update(observed)
          old['reviewReason'] = ('Retain all existing build-attempt obligations and skip guards; add eight '
                                 'managed SDK entry-boundary and independent byte/depth/link/special-file regressions.')
          path.write_text(json.dumps(old, indent=2, sort_keys=True) + '\n')
          subprocess.run(['git', 'add', '--', str(path)], check=True)
          rust = 'crates/latent-wasmtime/tests/phase3_resource/observation.rs'
          checkpoint = 'crates/latent-wasmtime/tests/phase3_resource.rs'
          source = (root / rust).read_text()
          assert source.count('512 * 1024 * 1024') == 2
          before = '''pub fn file_digest(path: &Path) -> String {
              let mut file = fs::File::open(path).unwrap();
              assert!(file.metadata().unwrap().len() <= 512 * 1024 * 1024);
              let mut hasher = Sha256::new();'''
          after = '''// Provenance includes unstripped test executables, not only small guest files.
          // Keep both the metadata and streamed-byte limits, with a 64 KiB buffer.
          const MAX_FILE_DIGEST_BYTES: u64 = 2 * 1024 * 1024 * 1024;

          pub fn file_digest(path: &Path) -> String {
              file_digest_with_limit(path, MAX_FILE_DIGEST_BYTES)
          }

          fn file_digest_with_limit(path: &Path, maximum: u64) -> String {
              let file = fs::File::open(path).unwrap();
              assert!(file.metadata().unwrap().len() <= maximum);
              digest_reader(file, maximum)
          }

          fn digest_reader(mut file: impl Read, maximum: u64) -> String {
              let mut hasher = Sha256::new();'''
          assert source.count(before) == 1
          source = source.replace(before, after).replace('observed_bytes <= 512 * 1024 * 1024', 'observed_bytes <= maximum')
          regression = '''// Run within the existing registered checkpoint so every ordinary invocation
          // checks exact-boundary hashing and both independent overflow guards.
          pub fn check_file_digest_bounds() {
              use std::{io::Cursor, panic::catch_unwind};

              let directory = tempfile::tempdir().unwrap();
              let path = directory.path().join("digest-boundary");
              let payload = b"artifact";
              fs::write(&path, payload).unwrap();
              let expected = format!(
                  "sha256:{:x}",
                  latent_core::digest::HexDigest(Sha256::digest(payload))
              );
              assert_eq!(file_digest_with_limit(&path, 8), expected);
              assert_eq!(digest_reader(Cursor::new(payload), 8), expected);
              assert_eq!(
                  digest_reader(Cursor::new([]), 0),
                  format!(
                      "sha256:{:x}",
                      latent_core::digest::HexDigest(Sha256::digest([]))
                  )
              );
              // Reject a known oversized file before reading and reject a reader
              // that grows beyond the allowed length independently of metadata.
              assert!(catch_unwind(|| file_digest_with_limit(&path, 7)).is_err());
              assert!(catch_unwind(|| digest_reader(Cursor::new(payload), 7)).is_err());
          }

          '''
          assert source.count('pub fn publish(') == 1
          source = source.replace('pub fn publish(', regression + 'pub fn publish(')
          (root / rust).write_text(source)
          source = (root / checkpoint).read_text()
          marker = 'fn phase3_resource_small_provider_ownership_checkpoint() {\n'
          assert source.count(marker) == 1
          (root / checkpoint).write_text(source.replace(marker, marker + '    observation::check_file_digest_bounds();\n'))
          edition = str(tomllib.loads((root / 'Cargo.toml').read_text())['workspace']['package']['edition'])
          subprocess.run(['rustfmt', '--edition', edition, rust, checkpoint], check=True)
          subprocess.run(['git', 'add', '--', rust, checkpoint], check=True)
          inventory = json.loads((root / '.github/security/inventory.json').read_text())
          entry = next(e for e in inventory['manifests'] if e['path'] == 'tools/native-fixture/Cargo.toml')
          assert entry['manifest_sha256'] == hashlib.sha256((root / entry['path']).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
          changed = git('diff', '--cached', '--name-only', head).decode().splitlines()
          allowed = expected | {rust, checkpoint, 'tools/ci/contracts/python/test_dev_build_cache.py.json',
              '.github/workflows/developer-packaged-qualification.yml', '.github/workflows/developer-tools.yml',
              '.github/workflows/docs-pages.yml', '.github/workflows/docs-site.yml',
              '.github/workflows/registry-cli.yml', '.github/workflows/typescript-guest.yml'}
          assert set(changed) <= allowed, changed
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr700-evidence'
          out.mkdir()
          manifest = {'head': head, 'base': base, 'tree': git('write-tree').decode().strip(), 'files': []}
          for name in changed:
              payload = (root / name).read_bytes()
              dest = out / 'files' / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(payload)
              manifest['files'].append({'path': name, 'sha256': hashlib.sha256(payload).hexdigest(),
                  'blob': git('hash-object', name).decode().strip()})
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (out / 'candidate.patch').write_bytes(git('diff', '--cached', '--binary', head))
          print(json.dumps(manifest, indent=2))
          PY
      - name: Install the repository's pinned validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Validate candidate contracts and regressions
        run: |
          set -o pipefail
          {
            git diff --cached --check
            python3 -m unittest -v tools.tests.test_dev_build_cache tools.tests.test_ci_contracts tools.tests.test_ci_coverage
            python3 tools/ci_coverage.py
            python3 tools/validate_docs.py
            python3 tools/validate_repository.py
            python3 tools/validate_foundation.py
          } 2>&1 | tee "$RUNNER_TEMP/pr700-evidence/validation.txt"
      - name: Retain exact candidate source and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr700-ci-qualification
          path: ${{ runner.temp }}/pr700-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
