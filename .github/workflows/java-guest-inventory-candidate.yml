# Temporary branch-only blob transport; creates no commit or ref update.
# Delete in the same commit that applies the independently reviewed candidates.
name: Java guest inventory candidate
on:
  push:
    branches: ['feat/java-guest-capsules-548']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/java-guest-capsules-548'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - run: |
          python3 -m pip install --only-binary=:all: --no-deps --require-hashes --requirement .github/security/requirements.txt
      - name: Prepare but never apply the exact reviewed inventory delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, difflib, hashlib, json, os
          from pathlib import Path
          import urllib.request
          from tools import ci_coverage
          git_hash = lambda b: hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          original = Path('tools/ci/commands.json').read_bytes()
          assert git_hash(original) == '5cf5fa5aa23b343f57ce134700524509e87e0bc7'
          workflow = '.github/workflows/java-guest-feasibility.yml'
          text = Path(workflow).read_text()
          assert text.count(' --bootstrap-dependencies') == 1
          text = text.replace(' --bootstrap-dependencies', '')
          assert hashlib.sha256(text.encode()).hexdigest() == '8c716f98d551898d6543192b5d8c64b28f2b3e227ecc9b03109344a04391b90e'
          owner = 'sdk/java-guest/tools/feasibility.py'
          source = Path(owner).read_text()
          before = "shutil.copytree(ROOT / 'sdk/java-guest/feasibility', project)"
          assert source.count(before) == 1
          source = source.replace(before, "shutil.copytree(ROOT / 'sdk/java-guest/feasibility', project,\n                    ignore=shutil.ignore_patterns('build', '.gradle', '__pycache__'))")
          assert hashlib.sha256(source.encode()).hexdigest() == '362fe2675dc42bb426a7e4d4079b73e9f5eae95be234d24752aa78da059cbd19'
          data = json.loads(original)
          additions = ci_coverage.workflow_commands(workflow, text)
          assert not (data['after'].keys() & additions.keys())
          data['after'].update(additions)
          assert workflow not in data['workflowIdentities']
          data['workflowIdentities'][workflow] = hashlib.sha256(text.encode()).hexdigest()
          owners = ci_coverage.delegated_owners(Path.cwd(), data['after'])
          assert all(owners[k] == v for k, v in data['delegatedOwners'].items())
          assert set(owners) - set(data['delegatedOwners']) == {owner}
          data['delegatedOwners'][owner] = {'sha256': hashlib.sha256(source.encode()).hexdigest()}
          candidate = (json.dumps(data, indent=2) + '\n').encode()
          diff = ''.join(difflib.unified_diff(original.decode().splitlines(True), candidate.decode().splitlines(True)))
          assert len(diff.splitlines()) < 100
          print(diff)
          out = Path(os.environ['RUNNER_TEMP']) / 'java-inventory-review'
          out.mkdir()
          (out / 'commands.json').write_bytes(candidate)
          payload = json.dumps({'content': base64.b64encode(candidate).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          assert blob['sha'] == git_hash(candidate)
          result = {'path': 'tools/ci/commands.json', 'sha': blob['sha'], 'sha256': hashlib.sha256(candidate).hexdigest(), 'applied': False, 'requiredRemoval': '.github/workflows/java-guest-inventory-candidate.yml'}
          (out / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-inventory-review-${{ github.sha }}
          path: ${{ runner.temp }}/java-inventory-review/
          if-no-files-found: error
          retention-days: 7
