# Temporary branch-only transport of independently reviewed, checksum-bound
# candidates. This job creates blobs only, never commits or ref updates. Remove
# this workflow in the same commit that applies the reviewed candidate set.
name: Java guest inventory candidate
on:
  push:
    branches: ['feat/java-guest-capsules-548']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/java-guest-capsules-548'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - run: |
          python3 -m pip install --only-binary=:all: --no-deps --require-hashes --requirement .github/security/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-guest-feasibility-31e17f29abb0d0d9a6b64916fe2d098b28514cae
          run-id: 35873112971
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/java-observed-inputs
      - name: Prepare checksum-bound candidates without applying them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, difflib, hashlib, json, os
          from pathlib import Path
          import urllib.request
          from tools import ci_coverage
          git_hash = lambda b: hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          candidates = {}
          observed = Path(os.environ['RUNNER_TEMP']) / 'java-observed-inputs'
          for name, expected, target in [
              ('dependencies.candidate.json', 'd199394c3834df378da8946712c4103582d2f744ab1fc615819ac984715827c8', 'sdk/java-guest/feasibility/dependencies.lock.json'),
              ('verification-metadata.candidate.xml', 'a5a6c598357fd25f6eeb1df908a2d207ebbdaf91082fba251616400adc29ceac', 'sdk/java-guest/feasibility/gradle/verification-metadata.xml'),
              ('report.json', 'ad59362bb1b9930740b00114b44133f6c48e68ead52a7089ec0b7ae2a4c77d09', 'sdk/java-guest/evidence/2026-09-23-teavm-c/report.json'),
              ('c-to-wasm.log', 'eb401693b3c6e64d7f217362d3814649b6afbb653a1d981d4348902e698a3337', 'sdk/java-guest/evidence/2026-09-23-teavm-c/c-to-wasm.log'),
          ]:
              value = (observed / name).read_bytes()
              assert hashlib.sha256(value).hexdigest() == expected, 'observed evidence changed'
              candidates[target] = value
          workflow = '.github/workflows/java-guest-feasibility.yml'
          text = Path(workflow).read_text()
          assert text.count(' --bootstrap-dependencies') == 1
          text = text.replace(' --bootstrap-dependencies', '')
          candidates[workflow] = text.encode()
          owner = 'sdk/java-guest/tools/feasibility.py'
          source = Path(owner).read_text()
          before = "shutil.copytree(ROOT / 'sdk/java-guest/feasibility', project)"
          assert source.count(before) == 1
          source = source.replace(before, "shutil.copytree(ROOT / 'sdk/java-guest/feasibility', project,\n                    ignore=shutil.ignore_patterns('build', '.gradle', '__pycache__'))")
          candidates[owner] = source.encode()
          path = Path('tools/ci/commands.json')
          original = path.read_bytes()
          assert git_hash(original) == '5cf5fa5aa23b343f57ce134700524509e87e0bc7', 'base inventory changed'
          data = json.loads(original)
          additions = ci_coverage.workflow_commands(workflow, text)
          assert not (data['after'].keys() & additions.keys()), 'not additive'
          data['after'].update(additions)
          assert workflow not in data['workflowIdentities']
          data['workflowIdentities'][workflow] = hashlib.sha256(candidates[workflow]).hexdigest()
          owners = ci_coverage.delegated_owners(Path.cwd(), data['after'])
          assert all(owners[k] == v for k, v in data['delegatedOwners'].items()), 'existing owner changed'
          assert set(owners) - set(data['delegatedOwners']) == {owner}
          data['delegatedOwners'][owner] = hashlib.sha256(candidates[owner]).hexdigest()
          candidates[str(path)] = (json.dumps(data, indent=2) + '\n').encode()
          java_test = 'tools/tests/test_java_toolchain.py'
          text = Path(java_test).read_text()
          before = 'self.assertEqual(java_workflows, ["ci.yml"])'
          assert text.count(before) == 1
          candidates[java_test] = text.replace(before, 'self.assertEqual(java_workflows, ["ci.yml", "java-guest-feasibility.yml"])').encode()
          policy = '.github/security/inventory.json'
          text = Path(policy).read_text()
          needle = '    {"path": "sdk/java-client/settings.gradle.kts"'
          assert text.count(needle) == 1
          build = 'sdk/java-guest/feasibility/build.gradle'
          settings = 'sdk/java-guest/feasibility/settings.gradle'
          entries = [
              {'path': build, 'kind': 'maven-locked', 'lock': 'sdk/java-guest/feasibility/dependencies.lock.json', 'manifest_sha256': hashlib.sha256(Path(build).read_bytes()).hexdigest(), 'absent_when_directory_missing': 'sdk/java-guest/feasibility'},
              {'path': settings, 'kind': 'no-external-packages', 'sha256': hashlib.sha256(Path(settings).read_bytes()).hexdigest(), 'absent_when_directory_missing': 'sdk/java-guest/feasibility'},
          ]
          candidates[policy] = text.replace(needle, ''.join('    ' + json.dumps(e) + ',\n' for e in entries) + needle).encode()
          out = Path(os.environ['RUNNER_TEMP']) / 'java-inventory-review'
          out.mkdir()
          receipts = []
          for target, candidate in candidates.items():
              destination = out / target
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(candidate)
              if Path(target).exists():
                  diff = ''.join(difflib.unified_diff(Path(target).read_text().splitlines(True), candidate.decode().splitlines(True), fromfile='before/' + target, tofile='after/' + target))
                  assert len(diff.splitlines()) < 100, 'unrelated candidate churn'
                  print(diff)
              payload = json.dumps({'content': base64.b64encode(candidate).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == git_hash(candidate)
              receipts.append({'path': target, 'sha': blob['sha'], 'sha256': hashlib.sha256(candidate).hexdigest()})
          result = {'files': receipts, 'checkout': os.environ['GITHUB_SHA'], 'applied': False, 'requiredRemoval': '.github/workflows/java-guest-inventory-candidate.yml'}
          (out / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-inventory-review-${{ github.sha }}
          path: ${{ runner.temp }}/java-inventory-review/
          if-no-files-found: error
          retention-days: 7
