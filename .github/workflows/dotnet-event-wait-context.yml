name: .NET event wait host context

on:
  pull_request:
    paths:
      - 'sdk/dotnet-guest/tools/http-errors/**'
      - 'sdk/dotnet-guest/tests/fixtures/task-wait-finite-il-control/**'
      - 'sdk/dotnet-guest/probes/smoke/**'
      - 'sdk/dotnet-guest/global.json'
      - 'sdk/dotnet-guest/nuget.config'
      - 'tools/dotnet_guest/**'
      - 'tools/probe_dotnet_event_wait_context.py'
      - '.github/workflows/dotnet-event-wait-context.yml'
  push:
    branches: ['feat/sdk-dotnet-manual-reset-wait-20261118']
    paths:
      - '.github/workflows/dotnet-event-wait-context.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-event-wait-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emitted-context:
    name: Pinned emitted event-wait context on CLR
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-setup-dotnet@2382c9e63a3b678b643c7e715d023e7fa42fbbef # v6.0.0 + upstream changes + LSF security fixes
        with:
          dotnet-version: '10.0.100'
      - name: Check pinned receipts and actual emitted host projections
        id: host-context
        run: python3 -B tools/probe_dotnet_event_wait_context.py --output "$RUNNER_TEMP/dotnet-event-wait-host"
      - name: Retain host-only results and bounded failure diagnostics
        id: evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: dotnet-event-wait-host-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dotnet-event-wait-host/HOST-COMPLETE.json
            ${{ runner.temp }}/dotnet-event-wait-host/HOST-FAILED.json
            ${{ runner.temp }}/dotnet-event-wait-host/receipt-validation.json
            ${{ runner.temp }}/dotnet-event-wait-host/infinite.json
            ${{ runner.temp }}/dotnet-event-wait-host/finite.json
            ${{ runner.temp }}/dotnet-event-wait-host/aggregate.json
            ${{ runner.temp }}/dotnet-event-wait-host/logs/*.stdout.txt
            ${{ runner.temp }}/dotnet-event-wait-host/logs/*.stderr.txt
