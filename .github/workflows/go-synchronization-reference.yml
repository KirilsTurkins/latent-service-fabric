name: Actual Go synchronization reference

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Finite actual Go runtime programme
        type: choice
        required: true
        default: synchronization
        options: [synchronization, admission, queued, managed-timers]
  push:
    branches: ['feat/go-runtime-retirement-20261020', 'feat/go-runtime-admission-20261020', 'feat/go-runtime-queued-ownership-20261020', 'feat/go-v5-standard-timers-20261020']

permissions:
  contents: read

concurrency:
  group: go-synchronization-reference-${{ github.ref }}
  cancel-in-progress: true

env:
  LSF_GO_REFERENCE_CAMPAIGN: ${{ inputs.campaign || (github.ref_name == 'feat/go-v5-standard-timers-20261020' && 'managed-timers' || github.ref_name == 'feat/go-runtime-queued-ownership-20261020' && 'queued' || github.ref_name == 'feat/go-runtime-admission-20261020' && 'admission' || 'synchronization') }}
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'

jobs:
  synchronization:
    name: Actual signed Go condition, lock, select and retirement controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install pinned repository source controls
        run: python3 -m pip install -r tools/requirements.lock
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: true
      - name: Check finite source and fail-closed execution contracts
        run: python3 -m unittest tools.tests.test_go_synchronization tools.tests.test_go_managed_idle -v
      - name: Check exact cross-tenant admission evidence controls
        run: python3 -m unittest tools.tests.test_go_admission -v
      - name: Check exact queued-root reservation and original-deadline evidence controls
        run: python3 -m unittest tools.tests.test_go_queued -v
      - name: Check exact managed-v5 standard timer and GC evidence controls
        run: python3 -m unittest tools.tests.test_go_managed_timers -v
      - name: Install captured compiler namespace
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install the exact maintained compiler and generator
        run: |
          set -euo pipefail
          cargo install --git https://github.com/bytecodealliance/componentize-go --rev 148dba505f8c6c64ad84db777cfde5e34e25098b --locked componentize-go
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          mkdir -p "$RUNNER_TEMP/go-synchronization-tools"
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/go-synchronization-tools/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $RUNNER_TEMP/go-synchronization-tools/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/go-synchronization-tools/go.tar.gz" -C "$RUNNER_TEMP/go-synchronization-tools"
          python3 tools/go_guest/runtime.py --prepare-compiler "$RUNNER_TEMP/go-synchronization-tools/go" --output "$RUNNER_TEMP/go-synchronization-tools/go-async"
          echo "$RUNNER_TEMP/go-synchronization-tools/go-async/bin" >> "$GITHUB_PATH"
      - name: Compile ordinary synchronization with the actual v5 runtime and native reference
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'synchronization'
        run: python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-synchronization" --runtime-profile go-component-activation-v5 --fixture synchronization
      - name: Compile the identical source without compiler checkpoints
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'synchronization'
        run: python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-synchronization-negative" --runtime-profile go-component-activation-v1 --fixture synchronization
      - name: Run the one real signed synchronization and retirement target
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'synchronization'
        run: python3 tools/qualify_go_synchronization.py --source-commit "${{ github.sha }}" --fixture "$RUNNER_TEMP/go-synchronization" --no-checkpoints "$RUNNER_TEMP/go-synchronization-negative" --output "$RUNNER_TEMP/go-synchronization-result"
      - name: Compile the unchanged managed Go fixture for shared-cell admission
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'admission' || env.LSF_GO_REFERENCE_CAMPAIGN == 'queued'
        run: python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-admission" --runtime-profile go-component-activation-v5 --fixture managed-idle
      - name: Run actual signed cross-tenant cell ownership and retirement
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'admission'
        run: python3 tools/qualify_go_synchronization.py --campaign admission --source-commit "${{ github.sha }}" --fixture "$RUNNER_TEMP/go-admission" --output "$RUNNER_TEMP/go-admission-result"
      - name: Run actual signed ordinary queue ownership and original ingress deadlines
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'queued'
        run: python3 tools/qualify_go_synchronization.py --campaign queued --source-commit "${{ github.sha }}" --fixture "$RUNNER_TEMP/go-admission" --output "$RUNNER_TEMP/go-queued-result"
      - name: Compile unchanged standard timers with actual v5 and seventeen native references
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'managed-timers'
        run: python3 tools/qualify_go_activation.py --output "$RUNNER_TEMP/go-managed-timers" --runtime-profile go-component-activation-v5 --fixture timers
      - name: Run all forty-three original timer outcomes under managed-v5 ownership
        if: env.LSF_GO_REFERENCE_CAMPAIGN == 'managed-timers'
        run: python3 tools/qualify_go_synchronization.py --campaign managed-timers --source-commit "${{ github.sha }}" --fixture "$RUNNER_TEMP/go-managed-timers" --output "$RUNNER_TEMP/go-managed-timers-result"
      - name: Retain bounded actual results and compiler source identities
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-synchronization-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-synchronization-result/receipt.json
            ${{ runner.temp }}/go-synchronization-result/signed.stdout.log
            ${{ runner.temp }}/go-synchronization-result/signed.stderr.log
            ${{ runner.temp }}/go-synchronization/GO-ACTIVATION-COMPILE.json
            ${{ runner.temp }}/go-synchronization/GO-ACTIVATION-FAILED.json
            ${{ runner.temp }}/go-synchronization/logs/
            ${{ runner.temp }}/go-synchronization-negative/GO-ACTIVATION-COMPILE.json
            ${{ runner.temp }}/go-synchronization-negative/GO-ACTIVATION-FAILED.json
            ${{ runner.temp }}/go-synchronization-negative/logs/
            ${{ runner.temp }}/go-admission/GO-ACTIVATION-COMPILE.json
            ${{ runner.temp }}/go-admission/GO-ACTIVATION-FAILED.json
            ${{ runner.temp }}/go-admission/logs/
            ${{ runner.temp }}/go-admission-result/receipt.json
            ${{ runner.temp }}/go-admission-result/signed.stdout.log
            ${{ runner.temp }}/go-admission-result/signed.stderr.log
            ${{ runner.temp }}/go-queued-result/receipt.json
            ${{ runner.temp }}/go-queued-result/signed.stdout.log
            ${{ runner.temp }}/go-queued-result/signed.stderr.log
            ${{ runner.temp }}/go-managed-timers/GO-ACTIVATION-COMPILE.json
            ${{ runner.temp }}/go-managed-timers/GO-ACTIVATION-FAILED.json
            ${{ runner.temp }}/go-managed-timers/logs/
            ${{ runner.temp }}/go-managed-timers-result/receipt.json
            ${{ runner.temp }}/go-managed-timers-result/signed.stdout.log
            ${{ runner.temp }}/go-managed-timers-result/signed.stderr.log
          if-no-files-found: warn
          retention-days: 7
