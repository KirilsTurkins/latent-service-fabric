name: PR 1380 pinned development merge inspection
on:
  push:
    branches: [ci/audit-1380-helper-validation]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Inspect only the pinned merge and bounded conflicting regions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=128 origin 99a5bb10633df4280c32228367908381c8f36c34 0ca8e0f574b3b8829c4691aa0d830e648f073a5e
          git checkout --detach 99a5bb10633df4280c32228367908381c8f36c34
          git config user.name 'LSF CI repair'
          git config user.email 'ci-repair@users.noreply.github.com'
          python3 - <<'PY'
          import pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=60)
          outcome = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', '0ca8e0f574b3b8829c4691aa0d830e648f073a5e'], capture_output=True, text=True, timeout=120)
          assert outcome.returncode in (0, 1)
          print(outcome.stdout[-12000:])
          names = git('diff', '--name-only', '--diff-filter=U').splitlines()
          print('CONFLICTS', names, flush=True)
          assert len(names) <= 16
          for name in names:
              lines = pathlib.Path(name).read_text().splitlines()
              selected = set()
              start = None
              for index, line in enumerate(lines):
                  if line.startswith('<<<<<<< '): start = index
                  if line.startswith('>>>>>>> ') and start is not None:
                      selected.update(range(max(0, start-4), min(len(lines), index+5)))
                      start = None
              output = '\n'.join(f'{index+1}: {lines[index]}' for index in sorted(selected))
              assert len(output) <= 24000, (name, len(output))
              print('FILE', name, '\n'+output, flush=True)
          for name in ('tools/build_dev_frontend.py', 'tools/tests/test_build_source_capacity.py', 'tools/tests/test_dev_tools.py'):
              result = git('diff', '0dd0facf0ac9548c41f2d755655fd37e347eefd7', '0ca8e0f574b3b8829c4691aa0d830e648f073a5e', '--', name)
              print('DEVELOPMENT DELTA', name, '\n'+result[:20000], flush=True)
          PY
