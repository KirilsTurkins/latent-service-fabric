name: PR 1657 read-only final source and signed validation
on:
  push:
    branches: ['diag/pr1657-final-readonly-20261107']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - name: Obtain exact compiler and compiled-guest observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 180 gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13573560784/zip > "$RUNNER_TEMP/pr1657-fresh-compiler.zip"
          timeout 120 gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13572652895/zip > "$RUNNER_TEMP/sequential.zip"
      - name: Prepare reviewed candidate and nonoverlapping current development changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr1657-final-helpers" "$RUNNER_TEMP/pr1657-final"
          cp .github/pr1657_final_catalogue.py .github/pr1657_final_guidance.py .github/pr1657_store_final.py "$RUNNER_TEMP/pr1657-final-helpers/"
          git fetch --depth=1 origin 1255d094ea0d793d5e421672120b4513ebac77bf
          for part in catalogue package controls; do
            git show "1255d094ea0d793d5e421672120b4513ebac77bf:.github/pr1657_refresh_${part}.py" > "$RUNNER_TEMP/pr1657-final-helpers/pr1657_refresh_${part}.py"
          done
          git fetch --depth=1 origin 9ad0b456609ad32c3d9fd932673d99e8c39453ff
          git checkout --detach 1d81c35ca6b206bafba113b6214de09bc6781bdb
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B "$RUNNER_TEMP/pr1657-final-helpers/pr1657_final_catalogue.py"
          python3 -B "$RUNNER_TEMP/pr1657-final-helpers/pr1657_final_guidance.py"
          git restore --source=9ad0b456609ad32c3d9fd932673d99e8c39453ff -- crates/latent-commit/src/atomic/tests.rs crates/latent-commit/src/atomic/tests/supported_formats.rs crates/latent-commit/src/atomic/writer.rs crates/latent-node/src/transaction_runtime/factory/admission.rs crates/latent-node/src/transaction_runtime/factory/pre_host_conflict/tests.rs
          rustfmt --edition 2024 crates/latent-component-threading/src/rust_component.rs crates/latent-component-threading/src/rust_original_delta.rs crates/latent-packaging/src/semantics/wasm/tests.rs crates/latent-wasmtime/src/component_threading.rs tools/toolchain-smoke/examples/rust_http_pump_control.rs
          git diff --check
      - name: Validate source lineage, rejection controls and physical retirement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest tools.tests.test_rust_thread_http_combined_node tools.tests.test_rust_thread_http_sibling tools.tests.test_rust_combined_diagnostic_envelope tools.tests.test_rust_wasi_http_profile tools.tests.test_rust_wasi_http_inputs_prepared tools.tests.test_ci_suite_fragments tools.tests.test_native_loader_boundary -v 2>&1 | tee "$RUNNER_TEMP/pr1657-final/python.log"
          python3 -B -c 'from tools.ci_coverage import validate; validate(); print("Complete maintained CI contracts passed")' | tee "$RUNNER_TEMP/pr1657-final/contracts.log"
          rustc --edition=2021 -D warnings --test sdk/wasi-http-runtime/retirement.rs -o "$RUNNER_TEMP/retirement-tests"
          "$RUNNER_TEMP/retirement-tests" --test-threads=1 | tee "$RUNNER_TEMP/pr1657-final/retirement.log"
          rustc --edition=2021 --test sdk/wasi-http-runtime/pump.rs -o "$RUNNER_TEMP/pump-tests"
          "$RUNNER_TEMP/pump-tests" --test-threads=1 | tee "$RUNNER_TEMP/pr1657-final/pump.log"
      - name: Retain exact source and create only a local test commit
        run: python3 -B "$RUNNER_TEMP/pr1657-final-helpers/pr1657_store_final.py"
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: pr1657-final-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr1657-final/**
          if-no-files-found: error
          retention-days: 7
      - name: Authenticate exact original compiler and selected public input members
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_combined_http_materials.py --output "$RUNNER_TEMP/pr1657-selected-compiler"
      - name: Independently reconstruct the graph and reject changed or historical material
        shell: bash
        run: |
          set -euo pipefail
          cargo --config .cargo/managed-guest.toml --config profile.dev.opt-level=1 --config profile.test.opt-level=1 --config profile.dev.package.latent-component-threading.opt-level=3 test --locked -p latent-component-threading --lib --features rust-http-combined-preview-diagnostic rust_component::tests::combined_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/pr1657-final/proof.log"
          grep -F 'test rust_component::tests::combined_embedded_proof_rejects_changed_material_before_reconstruction ... ok' "$RUNNER_TEMP/pr1657-final/proof.log"
      - name: Execute original signed four-request witness with unchanged limits and gates
        run: >-
          python3 -B tools/qualify_rust_thread_http_combined.py
          --compiler-materials "$RUNNER_TEMP/pr1657-selected-compiler"
          --output "$RUNNER_TEMP/pr1657-final-signed"
          --source-commit "$FINAL_HEAD"
      - name: Record bounded actual terminal category
        if: always()
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']) / 'pr1657-final-signed'
          for name in ('FAILED.json','node/FAILED.json','node/rust-thread-http-terminal.json','witness.json'):
              p=root/name
              if p.is_file() and p.stat().st_size<16*1024*1024:
                  d=json.loads(p.read_bytes())
                  if name.endswith('terminal.json'):
                      r=d.get('response',{});d={'exitCode':d.get('exitCode'),'outcomeKnown':r.get('outcomeKnown'),'terminalState':r.get('data',{}).get('terminalState'),'consumption':r.get('data',{}).get('consumption')}
                  else:
                      d={k:d.get(k) for k in ('status','stage','errorCategory','actualSignedSiblingProgress')}
                  print(name,json.dumps(d))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-final-execution-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr1657-final/**
            ${{ runner.temp }}/pr1657-final-signed/**
            ${{ runner.temp }}/pr1657-selected-compiler/retrieval.json
          if-no-files-found: error
          retention-days: 7
