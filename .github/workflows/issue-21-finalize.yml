name: Issue 21 finalize

on:
  push:
    branches:
      - feat/issue-21-wasmtime-echo

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-21-wasmtime-echo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Apply the remaining reviewed corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/latent-wasmtime/src/backend.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one backend match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'use crate::host::{ActivationHostContext, BoundedLogSink, HostState};\n',
              'use crate::host::{\n    hostcall_fuel_limit, ActivationHostContext, BoundedLogSink, HostState,\n};\n',
          )
          replace_once(
              '"component-model=1;component-model-async=1;fuel=1;epoch=1;max-component={};\\\n             max-memory={};max-fuel={};wasm-stack={};async-stack={};cache-entries={};\\\n',
              '"component-model=1;component-model-async=1;fuel=1;epoch=1;aggregate-memory=1;\\\n             hostcall-fuel=v1-bounded-log-payload;max-component={};max-memory={};\\\n             max-fuel={};wasm-stack={};async-stack={};cache-entries={};\\\n',
          )
          replace_once(
              '        configuration.insert("epoch-interruption".to_owned(), "enabled".to_owned());\n',
              '        configuration.insert("epoch-interruption".to_owned(), "enabled".to_owned());\n'
              '        configuration.insert(\n'
              '            "memory-accounting".to_owned(),\n'
              '            "aggregate-linear-memory".to_owned(),\n'
              '        );\n'
              '        configuration.insert(\n'
              '            "hostcall-fuel".to_owned(),\n'
              '            "per-invocation-bounded-log-payload".to_owned(),\n'
              '        );\n',
          )
          replace_once(
              '        let mut store = Store::new(&self.engine, host_state);\n        store.limiter(|state| &mut state.limiter);\n',
              '        let mut store = Store::new(&self.engine, host_state);\n'
              '        store.set_hostcall_fuel(hostcall_fuel_limit(\n'
              '            self.config.invocation_log_maximum_bytes,\n'
              '            request.budget.log_bytes,\n'
              '        ));\n'
              '        store.limiter(|state| &mut state.limiter);\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

          git fetch origin development
          git checkout origin/development -- .github/workflows/ci.yml Cargo.lock
          git rm -- .github/workflows/issue-21-finalize.yml
          git rm -- tools/patch_issue19_self_contained.py

      - name: Minimally refresh the lockfile
        run: cargo check -p latent-wasmtime --all-targets --all-features
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Validate contracts and end-to-end Wasmtime fixtures
        run: tools/validate_contracts.sh
      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/ci.yml \
            Cargo.toml \
            Cargo.lock \
            tools/toolchain.toml \
            tools/toolchain-smoke/Cargo.toml \
            tools/toolchain-smoke/examples/oversized_log_capsule/component.rs \
            crates/latent-wasmtime/Cargo.toml \
            crates/latent-wasmtime/src/backend.rs \
            crates/latent-wasmtime/src/host.rs \
            crates/latent-wasmtime/tests/echo_backend.rs \
            docs/development/toolchain.md \
            docs/development/phase-0-wasmtime.md \
            tools/validate_contracts.sh
          git diff --cached --check
          git status --short
          git commit -m 'fix: address Phase 0 Wasmtime audit findings'
          git push origin HEAD:feat/issue-21-wasmtime-echo
