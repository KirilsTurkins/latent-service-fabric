name: Issue 21 finalize

on:
  push:
    branches:
      - feat/issue-21-wasmtime-echo

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-21-wasmtime-echo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Refresh only the changed lockfile metadata
        shell: bash
        run: |
          git fetch origin development
          git checkout origin/development -- Cargo.lock
          cargo check -p latent-wasmtime --all-targets --all-features
      - name: Format and validate the touched implementation
        id: validate
        shell: bash
        run: |
          set +e
          LOG=tools/issue21-validation.log
          : > "${LOG}"
          rustfmt --edition 2021 \
            crates/latent-wasmtime/src/bindings.rs \
            crates/latent-wasmtime/src/host.rs \
            crates/latent-wasmtime/tests/echo_backend.rs \
            tools/toolchain-smoke/examples/oversized_log_capsule/component.rs

          status=0
          run_gate() {
            printf '\n$ %q' "$1" >> "${LOG}"
            shift
            printf ' %q' "$@" >> "${LOG}"
            printf '\n' >> "${LOG}"
            "$@" 2>&1 | tee -a "${LOG}"
            rc=${PIPESTATUS[0]}
            if [[ ${rc} -ne 0 ]]; then
              status=${rc}
            fi
          }

          run_gate check cargo check -p latent-wasmtime --all-targets --all-features --locked
          run_gate clippy cargo clippy -p latent-wasmtime --all-targets --all-features --locked -- -D warnings
          run_gate test cargo test -p latent-wasmtime --all-targets --all-features --locked
          run_gate contracts tools/validate_contracts.sh

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Commit generated lockfile, formatting, and validation evidence
        shell: bash
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/issue-21-finalize.yml
          if [[ "${VALIDATION_STATUS}" == "0" ]]; then
            rm -f tools/issue21-validation.log
          else
            git add -- tools/issue21-validation.log
          fi
          git add -- \
            Cargo.lock \
            crates/latent-wasmtime/src/bindings.rs \
            crates/latent-wasmtime/src/host.rs \
            crates/latent-wasmtime/tests/echo_backend.rs \
            tools/toolchain-smoke/examples/oversized_log_capsule/component.rs
          git diff --cached --check
          git commit -m 'fix: finalize Phase 0 Wasmtime audit corrections'
          git push origin HEAD:feat/issue-21-wasmtime-echo
          exit "${VALIDATION_STATUS}"
