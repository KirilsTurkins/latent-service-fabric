name: Actual stream operator node configuration checks

on:
  push:
    branches: ['feat/stream-operator-node-refusal-20261023']
    paths:
      - '.github/workflows/stream-operator-node-check.yml'
      - 'tools/qualify_stream_operator_node.py'
      - 'tools/stream_operator_frontend_products.py'
      - 'tools/tests/test_stream_operator_node.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stream-operator-node-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-check:
    name: Actual frozen operator and native277 configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Fetch only the immutable compiled source closures
        run: git fetch --depth=1 origin 277c8104499d414053573bce066b5e9091e74a20 380c7df8f26ec3f0f6e54d616e8d08b80cb5cc73
      - name: Exercise four new origin and refusal-classification controls
        run: python -S -B -m unittest tools.tests.test_stream_operator_node
      - name: Reuse authenticated products and observe actual configuration-only refusals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -S -B tools/qualify_stream_operator_node.py --output target/stream-operator-node-check
      - name: Retain only redacted public configuration outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-operator-node-check-${{ github.sha }}
          path: target/stream-operator-node-check/result.json
          if-no-files-found: error
          retention-days: 7
