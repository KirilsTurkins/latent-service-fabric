name: Rust standard WASI HTTP backend

on:
  push:
    branches: ['feat/rust-wasi-http-profile-20261021', 'diag/rust-http-combined-host-20261105']
    paths:
      - '.github/workflows/rust-wasi-http-runtime.yml'
      - 'sdk/wasi-http-runtime/**'
      - 'tools/rust_wasi_http_inputs.py'
      - 'tools/toolchain-smoke/examples/rust_wasi_http_runtime.rs'
      - 'tools/toolchain-smoke/examples/rust_http_pump_probe.rs'
      - 'tools/toolchain-smoke/examples/rust_http_pump_control.rs'
      - 'tools/toolchain-smoke/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-wasi-http-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standard-backend:
    name: Compile exact standard WASI backend and bounded resource controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Check source ownership, original whole WIT and private bridge guards
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_rust_wasi_http_profile tools.tests.test_rust_wasi_http_inputs_prepared -v
      - name: Execute only the actual bounded options and fields implementation controls
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test tools/fixtures/wasi-http-request-options/control.rs -o "$RUNNER_TEMP/rust-http-resource-controls"
          "$RUNNER_TEMP/rust-http-resource-controls" --test-threads=1 | tee "$RUNNER_TEMP/rust-http-resource-controls.txt"
      - name: Execute callback-safe readiness, cancellation and bounded waiter controls
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test sdk/wasi-http-runtime/pump.rs -o "$RUNNER_TEMP/rust-http-pump-controls"
          "$RUNNER_TEMP/rust-http-pump-controls" | tee "$RUNNER_TEMP/rust-http-pump-controls.txt"
      - name: Acquire only locked SDK compiler sources before offline compilation
        run: cargo fetch --locked --target wasm32-unknown-unknown --target x86_64-unknown-linux-gnu
      - name: Compile and authenticate only the selected WASI backend
        run: >-
          python3 -B tools/rust_wasi_http_inputs.py
          --output "$RUNNER_TEMP/rust-http-runtime"
      - name: Execute the actual compiled guest with independently held imports
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --offline -p latent-toolchain-smoke --target wasm32-unknown-unknown --example rust-http-pump-probe --features rust-wasi-http-cooperative --release
          wasm-tools component new target/wasm32-unknown-unknown/release/examples/rust_http_pump_probe.wasm -o "$RUNNER_TEMP/rust-http-pump-probe.wasm"
          wasm-tools validate --features all "$RUNNER_TEMP/rust-http-pump-probe.wasm"
          cargo --config .cargo/managed-guest.toml --config profile.dev.opt-level=1 run --locked --offline -p latent-toolchain-smoke --example rust-http-pump-control -- "$RUNNER_TEMP/rust-http-pump-probe.wasm" 2>&1 | tee "$RUNNER_TEMP/rust-http-pump-guest.txt"
      - name: Retain bounded compiler observations without build cache or signer credentials
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wasi-http-backend-${{ github.sha }}
          path: |-
            ${{ runner.temp }}/rust-http-resource-controls.txt
            ${{ runner.temp }}/rust-http-runtime/INSTALL-COMPLETE.json
            ${{ runner.temp }}/rust-http-runtime/INSTALL-FAILED.json
            ${{ runner.temp }}/rust-http-runtime/source-inputs.json
            ${{ runner.temp }}/rust-http-runtime/reference.wit.json
            ${{ runner.temp }}/rust-http-runtime/adapter.wit.json
            ${{ runner.temp }}/rust-http-runtime/raw-runtime.wasm
            ${{ runner.temp }}/rust-http-runtime/rust-wasi-http-runtime.wasm
            ${{ runner.temp }}/rust-http-runtime/component-composer/wac
            ${{ runner.temp }}/rust-http-runtime/logs/*.stdout.txt
            ${{ runner.temp }}/rust-http-runtime/logs/*.stderr.txt
            ${{ runner.temp }}/rust-http-pump-controls.txt
            ${{ runner.temp }}/rust-http-pump-guest.txt
            ${{ runner.temp }}/rust-http-pump-probe.wasm
          if-no-files-found: warn
          retention-days: 3
