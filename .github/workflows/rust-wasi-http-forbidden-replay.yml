name: Rust retained exact forbidden-header reader replay

on:
  workflow_dispatch:
  push:
    branches: ['diag/rust-wasi-http-forbidden-node-replay-20261021', 'diag/rust-wasi-http-capacity-observation-20261021']
    paths:
      - '.github/workflows/rust-wasi-http-forbidden-replay.yml'
      - 'tools/replay_rust_wasi_http_forbidden_runtime.py'
      - 'tools/rust_wasi_http_runtime_node.py'
      - 'tools/tests/test_rust_wasi_http_forbidden_runtime_replay.py'
      - 'tools/tests/test_rust_wasi_http_runtime.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-wasi-http-forbidden-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retained-guest:
    name: Authenticate the original compiled guest and execute only its full node programme
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PRESSURE_OBSERVATION_ONLY: ${{ github.ref_name == 'diag/rust-wasi-http-capacity-observation-20261021' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install only the existing pinned Python controller dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Fetch exact original compiler and native source objects without compilation
        run: >-
          git fetch --no-tags --depth=1 origin
          88b3c9c1d305eb8e308a7187600f782163bc6131
          c7134289f446cb3171eb0ffd800a94afc2a5209f
      - name: Check the exact original ancestry and corrected exact header-error and compact summary reader
        run: python3 -B -m unittest tools.tests.test_rust_wasi_http_forbidden_runtime_replay tools.tests.test_rust_wasi_http_runtime -q
      - name: Restore only the fixed original public compiled-guest artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-wasi-http-runtime-88b3c9c1d305eb8e308a7187600f782163bc6131
          run-id: '39623507324'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-http-original
      - name: Authenticate unchanged original native products without another host build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/activation_stack_native_products.py --output "$RUNNER_TEMP/rust-http-native"
      - name: Re-sign the original component for its full programme or nonqualifying pressure observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PRESSURE_OBSERVATION_ONLY" in
            true) selection=(--pressure-observation-only) ;;
            false) selection=() ;;
            *) exit 2 ;;
          esac
          python3 -B tools/replay_rust_wasi_http_forbidden_runtime.py \
            --original-artifact "$RUNNER_TEMP/rust-http-original" \
            --native-products "$RUNNER_TEMP/rust-http-native" \
            --output "$RUNNER_TEMP/rust-http-node-replay" "${selection[@]}"
      - name: Retain exact ancestry and bounded public invocation and cleanup observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-wasi-http-forbidden-node-replay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-node-replay/*.json
            ${{ runner.temp }}/rust-http-node-replay/build/*.json
            ${{ runner.temp }}/rust-http-node-replay/build/*.wasm
            ${{ runner.temp }}/rust-http-node-replay/build/wit/**
            ${{ runner.temp }}/rust-http-node-replay/node/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/examples-controls/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/foreign-controls/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/provider-absence/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/provider-absence/controls/*.json
            ${{ runner.temp }}/rust-http-native/*.json
          if-no-files-found: warn
          retention-days: 3
