name: Rust capsule authoring

on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/rust-capsule-authoring.yml'
      - 'sdk/rust-guest/**'
      - 'sdk/transaction-contract/**'
      - 'crates/**'
      - 'apps/**'
      - 'examples/**'
      - 'schemas/**'
      - 'tools/**'
      - 'wit/**'
      - 'Cargo.*'
      - 'docs/component-development/rust-authoring.md'
  push:
    branches: [development]
    paths:
      - '.github/workflows/rust-capsule-authoring.yml'
      - 'sdk/rust-guest/**'
      - 'sdk/transaction-contract/**'
      - 'crates/**'
      - 'apps/**'
      - 'examples/**'
      - 'schemas/**'
      - 'tools/**'
      - 'wit/**'
      - 'Cargo.*'
      - 'docs/component-development/rust-authoring.md'

permissions:
  contents: read

concurrency:
  group: rust-capsule-authoring-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  authoring:
    name: Standalone Rust capsule authoring
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Install pinned validation and guest tools
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools"
          echo "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
          cargo fetch --locked
      - name: Test standalone validation and process ownership
        run: python3 -m unittest tools.tests.test_rust_capsule_authoring tools.tests.test_build_process
      - name: Qualify proposed transaction shapes with the maintained Rust compiler and HTTP preparation
        env:
          LSF_TRANSACTION_PREPARATION_REPORT: ${{ runner.temp }}/transaction-contract-rust/preparation.json
        run: |
          python3 tools/generate_transaction_contracts.py --check
          python3 tools/qualify_transaction_contracts.py --language rust --output "$RUNNER_TEMP/transaction-contract-rust"
          cargo test --locked -p latent-wasmtime --lib values::tests::transactions -- --nocapture
      - name: Compile the authored transaction aggregate and forbidden immediate HTTP variant
        run: python3 tools/compile_transaction_guests.py --language rust --output "$RUNNER_TEMP/transaction-guests-rust"
      - name: Execute complete outside-checkout authoring qualification
        run: python3 tools/qualify_rust_capsules.py --output "$RUNNER_TEMP/rust-capsule-authoring"
      - name: Exercise developer cache with the actual operator and compiled Rust package inputs
        run: >-
          python3 tools/run_dev_build_cache_tests.py --packager target/debug/latent
          --inputs "$RUNNER_TEMP/rust-capsule-authoring/builds/greeting"
          --output "$RUNNER_TEMP/dev-build-cache"
      - name: Test contract derivation and isolated provenance approvals
        if: success() || failure()
        run: |
          cargo test --locked -p latent-packaging semantics::authoring
          cargo test --locked -p latent-signing --test guest_provenance
      - name: Retain source-bound authoring evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-capsule-authoring-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/transaction-guests-rust/**/report.json
            ${{ runner.temp }}/transaction-guests-rust/**/source-inputs.json
            ${{ runner.temp }}/transaction-guests-rust/**/recipe-inputs.json
            ${{ runner.temp }}/transaction-guests-rust/**/source.tar.gz
            ${{ runner.temp }}/transaction-guests-rust/**/component.wasm
            ${{ runner.temp }}/transaction-guests-rust/**/component.wit
            ${{ runner.temp }}/transaction-guests-rust/**/compiler-inputs.json
            ${{ runner.temp }}/transaction-guests-rust/**/logs/**
            ${{ runner.temp }}/transaction-guests-rust/**/compiler/*.log
            ${{ runner.temp }}/transaction-guests-rust/**/compiler/*.command.json
            ${{ runner.temp }}/transaction-guests-rust/**/compiled/generated/**
            ${{ runner.temp }}/transaction-guests-rust/**/compiled/bindings/**
            ${{ runner.temp }}/transaction-guests-rust/**/bindings/**
            ${{ runner.temp }}/transaction-guests-rust/**/compiled/raw-generated-bindings.json
            ${{ runner.temp }}/transaction-contract-rust/report.json
            ${{ runner.temp }}/transaction-contract-rust/source.tar.gz
            ${{ runner.temp }}/transaction-contract-rust/component.wit
            ${{ runner.temp }}/transaction-contract-rust/preparation.json
            ${{ runner.temp }}/transaction-contract-rust/compiler-inputs.json
            ${{ runner.temp }}/transaction-contract-rust/logs/**
            ${{ runner.temp }}/transaction-contract-rust/compiler/*.log
            ${{ runner.temp }}/transaction-contract-rust/compiler/*.command.json
            ${{ runner.temp }}/transaction-contract-rust/compiled/component.wasm
            ${{ runner.temp }}/transaction-contract-rust/compiled/component.wit
            ${{ runner.temp }}/transaction-contract-rust/compiled/bindings/**
            ${{ runner.temp }}/transaction-contract-rust/compiled/generated/**
            ${{ runner.temp }}/transaction-contract-rust/compiled/raw-generated-bindings.json
            ${{ runner.temp }}/transaction-contract-rust/bindings/**
            ${{ runner.temp }}/transaction-contract-rust/component.wasm
            ${{ runner.temp }}/dev-build-cache/
            ${{ runner.temp }}/rust-capsule-authoring/*.json
            ${{ runner.temp }}/rust-capsule-authoring/*.log
            ${{ runner.temp }}/rust-capsule-authoring/*.stdout
            ${{ runner.temp }}/rust-capsule-authoring/*.stderr
            ${{ runner.temp }}/rust-capsule-authoring/logs/**
            ${{ runner.temp }}/rust-capsule-authoring/builds/**
            ${{ runner.temp }}/rust-capsule-authoring/ownership/*.json
            ${{ runner.temp }}/rust-capsule-authoring/ownership/*.jsonl
            ${{ runner.temp }}/rust-capsule-authoring/ownership/*.stderr.txt
            ${{ runner.temp }}/rust-capsule-authoring/node/**
            ${{ runner.temp }}/rust-capsule-authoring/releases/**
            ${{ runner.temp }}/rust-capsule-authoring/guide/guide.json
            ${{ runner.temp }}/rust-capsule-authoring/guide/guide.sh
            ${{ runner.temp }}/rust-capsule-authoring/guide/logs/**
            ${{ runner.temp }}/rust-capsule-authoring/guide/projects/results/**
          if-no-files-found: warn
          retention-days: 3
