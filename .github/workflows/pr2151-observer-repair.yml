name: PR 2151 private observer repair
on:
  push:
    branches: [diagnostic/pr2151-integration-fanout-20261121]
    paths: [.github/workflows/pr2151-observer-repair.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
      - name: Reproduce the original E0282 before changing the private projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from tools.diagnose_go_timer_failure import private_backtrace_source
          root=Path(os.environ['RUNNER_TEMP']);source='use std::num::NonZeroUsize;\nstruct Engine; impl Engine { fn wasm_backtrace_max_frames(&mut self, value: Option<NonZeroUsize>) { assert_eq!(value.unwrap().get(), 32); } }\nfn main() { let mut engine_config = Engine; let backtrace_limit = None; engine_config.wasm_backtrace_max_frames(backtrace_limit); }\n'
          p=root/'observer-before.rs';p.write_text(private_backtrace_source(source))
          result=subprocess.run(['rustc','--edition=2024','--crate-name','observer_before',str(p),'-o',str(root/'observer-before')],text=True,capture_output=True)
          assert result.returncode!=0 and 'E0282' in result.stderr,result
          (root/'observer-before.log').write_text(result.stderr)
          (root/'observer-rust-source.txt').write_text(source)
          print('Original private projection reproduced Rust E0282')
          PY
      - name: Apply only the reviewed helper and regression postimages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          originals={'tools/diagnose_go_timer_failure.py':'5af52a8f25d7c71ab3aa218186e43e99a852aeda0f0c511895f0f5d84d9a0ac2','tools/tests/test_go_entry_frames.py':'babf691107b925d63b3d8407173ce9b381cc9d666c168d1862d512a8d32d28f5'}
          expected={'tools/diagnose_go_timer_failure.py':'10c75500b34225376a9648767124b2eac214c4c9d0f7214071e572379e676188','tools/tests/test_go_entry_frames.py':'4e1898d3fb1fd47624a2c10a30fb9e6008ef89c5bafdb7d56e9e59db3c56080e'}
          texts={name:Path(name).read_text() for name in originals}
          for name,data in texts.items(): assert hashlib.sha256(data.encode()).hexdigest()==originals[name],name
          def replace(name,old,new):
              assert texts[name].count(old)==1,(name,old)
              texts[name]=texts[name].replace(old,new)
          replace('tools/diagnose_go_timer_failure.py',
              "def private_backtrace_source(text):\n    return once(text, backtrace_call(text),\n                'wasm_backtrace_max_frames(std::num::NonZeroUsize::new(32))')",
              "def private_backtrace_source(text):\n    original = backtrace_call(text)\n    value = 'std::num::NonZeroUsize::new(32)'\n    if original == 'wasm_backtrace_max_frames(backtrace_limit)':\n        # The original call supplies the type of a cfg-selected `None` binding.\n        # Preserve that type use in the private copy; replacing it outright\n        # leaves the ordinary no-trace branch uninferrable (Rust E0282).\n        value = ('{ let _: Option<std::num::NonZeroUsize> = backtrace_limit; '\n                 + value + ' }')\n    return once(text, original, 'wasm_backtrace_max_frames(' + value + ')')")
          replace('tools/tests/test_go_entry_frames.py',
              "            self.assertEqual(engine.replace('wasm_backtrace_max_frames(std::num::NonZeroUsize::new(32))',\n                frames.host.backtrace_call(originals[frames.PATHS[1]].decode())).encode(), originals[frames.PATHS[1]])\n            for call in ('wasm_backtrace_max_frames(None)', 'wasm_backtrace_max_frames(backtrace_limit)'):\n                self.assertEqual(frames.host.private_backtrace_source(call),\n                    'wasm_backtrace_max_frames(std::num::NonZeroUsize::new(32))')",
              "            original_call = frames.host.backtrace_call(originals[frames.PATHS[1]].decode())\n            self.assertEqual(engine.replace(frames.host.private_backtrace_source(original_call),\n                original_call).encode(), originals[frames.PATHS[1]])\n            self.assertEqual(frames.host.private_backtrace_source('wasm_backtrace_max_frames(None)'),\n                'wasm_backtrace_max_frames(std::num::NonZeroUsize::new(32))')\n            self.assertEqual(frames.host.private_backtrace_source('wasm_backtrace_max_frames(backtrace_limit)'),\n                'wasm_backtrace_max_frames({ let _: Option<std::num::NonZeroUsize> = backtrace_limit; '\n                'std::num::NonZeroUsize::new(32) })')")
          replace('tools/tests/test_go_entry_frames.py',
              "\n    def test_numeric_parser_drops_raw_stderr_and_refuses_names_unknown_fields_and_bad_numbers(self):",
              "\n    def test_private_limit_preserves_the_type_use_of_each_original_policy_binding(self):\n        for value in ('None', 'std::num::NonZeroUsize::new(16)'):\n            with self.subTest(binding=value):\n                source = ('let backtrace_limit = ' + value + ';\\n'\n                          'engine_config.wasm_backtrace_max_frames(backtrace_limit);')\n                derived = frames.host.private_backtrace_source(source)\n                self.assertTrue(derived.startswith('let backtrace_limit = ' + value + ';\\n'))\n                self.assertEqual(derived.count('Option<std::num::NonZeroUsize> = backtrace_limit;'), 1)\n                self.assertEqual(derived.count('std::num::NonZeroUsize::new(32)'), 1)\n                self.assertEqual(derived.count('wasm_backtrace_max_frames('), 1)\n\n    def test_numeric_parser_drops_raw_stderr_and_refuses_names_unknown_fields_and_bad_numbers(self):")
          for name,data in texts.items():
              assert hashlib.sha256(data.encode()).hexdigest()==expected[name],name
              Path(name).write_text(data)
          Path(os.environ['RUNNER_TEMP'],'observer-postimages.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Compile and execute both original-policy bindings with the repaired private projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os,subprocess
          from pathlib import Path
          from tools.diagnose_go_timer_failure import private_backtrace_source
          root=Path(os.environ['RUNNER_TEMP']);source=(root/'observer-rust-source.txt').read_text()
          for index,binding in enumerate(('None','std::num::NonZeroUsize::new(16)')):
              p=root/f'observer-after-{index}.rs';out=root/f'observer-after-{index}'
              p.write_text(private_backtrace_source(source.replace('let backtrace_limit = None;','let backtrace_limit = '+binding+';')))
              subprocess.run(['rustc','--edition=2024','--crate-name','observer_after',str(p),'-o',str(out)],check=True)
              subprocess.run([str(out)],check=True)
          print('Both private policy projections compile and execute with the original 32-frame limit')
          PY
          python3 -B -m unittest tools.tests.test_go_entry_frames tools.tests.test_typescript_fetch_failure tools.tests.test_typescript_fetch_failure_evidence -v 2>&1 | tee "$RUNNER_TEMP/observer-tests.log"
          git diff --check
      - name: Publish only the two validated postimage blobs without moving a production ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          expected=json.loads(Path(os.environ['RUNNER_TEMP'],'observer-postimages.json').read_text());rows=[]
          changes=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changes)==set(expected),changes
          for name,sha in expected.items():
              data=Path(name).read_bytes();assert hashlib.sha256(data).hexdigest()==sha
              payload=json.dumps({'content':data.decode(),'encoding':'utf-8'})
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/KirilsTurkins/latent-service-fabric/git/blobs','--input','-'],input=payload,text=True))
              oid=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert result['sha']==oid
              rows.append({'path':name,'mode':'100644','type':'blob','sha':oid,'sha256':sha})
          result={'status':'validated','base':'4a9e488359a7c40e0fc3309260c0d09c4a9d8f76','files':rows,'productionBranchUpdated':False}
          Path(os.environ['RUNNER_TEMP'],'observer-published.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Retain reproduction, validation, and exact publication identities
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-observer-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/observer-before.log
            ${{ runner.temp }}/observer-tests.log
            ${{ runner.temp }}/observer-postimages.json
            ${{ runner.temp }}/observer-published.json
          retention-days: 7
          if-no-files-found: error
