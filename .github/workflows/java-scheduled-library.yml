name: Unchanged published Java scheduled semaphore through the normal signed node
on:
  workflow_call:
  push:
    branches: ['feat/java-scheduled-executor-20261026', 'feat/java-cf-shutdown-now-20261028', 'feat/java-future-queue-20261028', 'feat/java-timer-start-refusal-20261109']
    paths:
      - '.github/workflows/java-scheduled-library.yml'
      - 'tools/qualify_java_scheduled_library.py'
      - 'tools/qualify_java_retained_fibers.py'
      - 'tools/qualify_java_fibers.py'
      - 'tools/java_fiber_library_inputs.py'
      - 'tools/java_dependency_resolution.py'
      - 'tools/java_registry_tls.py'
      - 'sdk/java-guest/fibers/**'
      - 'tools/qualify_java_published_workers.py'
      - 'tools/java_guest/compiler.py'
      - 'tools/java_guest/compiler_profile_distribution.py'
      - 'tools/tests/test_java_scheduled_library.py'
      - 'crates/latent-wasmtime/tests/local_service/runtime.rs'
permissions:
  contents: read
  actions: read
concurrency:
  group: java-scheduled-library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scheduled-library:
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'feat/java-scheduled-executor-20261026' ||
       github.ref_name == 'feat/java-cf-shutdown-now-20261028' ||
       github.ref_name == 'feat/java-future-queue-20261028' ||
       github.ref_name == 'feat/java-timer-start-refusal-20261109' ||
       (github.ref_name == 'development' &&
        github.workflow_ref == 'KirilsTurkins/latent-service-fabric/.github/workflows/java-scheduled-development.yml@refs/heads/development'))
    name: One scheduled component and eighteen signed calls
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.ref_name == 'feat/java-scheduled-executor-20261026' || github.ref_name == 'feat/java-timer-start-refusal-20261109' || github.ref_name == 'development') && 45 || 25 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install normal source-validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - uses: KirilsTurkins/lsf-setup-java@63c7977881fc344a6ed464f7ed5e242aedc8d56c # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v3-contract-profiles
          shared-key: host-contracts
          key: ubuntu-24.04
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/wasm32-wasip2
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Select the existing runner-owned compiler archive cache
        run: printf 'LSF_DEV_COMPILER_CACHE=%s\n' "$RUNNER_TEMP/compiler-archives" >> "$GITHUB_ENV"
      - name: Restore untrusted source-pinned Java prepared inputs
        uses: KirilsTurkins/lsf-cache/restore@ec176dce9471270c8a9be1289040c0a8fd6aa708 # v6.1.0 + upstream changes + LSF security fixes
        with:
          path: ${{ runner.temp }}/compiler-archives/java-prepared
          key: java-prepared-compiler-v1-${{ runner.os }}-${{ hashFiles('tools/data/java-compiler-profile.json') }}
      - name: Capture and compile the scheduled component then run eighteen signed calls
        if: github.ref_name == 'feat/java-scheduled-executor-20261026' || github.ref_name == 'feat/java-timer-start-refusal-20261109' || github.ref_name == 'development'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_java_scheduled_library.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/java-scheduled-library"
      - name: Qualify ordinary shutdownNow ownership with four signed calls
        if: github.ref_name == 'feat/java-cf-shutdown-now-20261028'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_java_scheduled_library.py
          --shutdown-now --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/java-scheduled-library"
      - name: Qualify ordinary FutureTask queue copies with one Result and four signed calls
        if: github.ref_name == 'feat/java-future-queue-20261028'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_java_scheduled_library.py
          --future-queue --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/java-scheduled-library"
      - name: Retain only bounded public observations and source identities
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-scheduled-library-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-scheduled-library/receipt.json
            ${{ runner.temp }}/java-scheduled-library/FAILED.json
            ${{ runner.temp }}/java-scheduled-library/source-inputs.json
            ${{ runner.temp }}/java-scheduled-library/commands.json
            ${{ runner.temp }}/java-scheduled-library/normal-product.json
            ${{ runner.temp }}/java-scheduled-library/component/src/Capsule.java
            ${{ runner.temp }}/java-scheduled-library/component/wit/service.wit
            ${{ runner.temp }}/java-scheduled-library/component/build/component.wasm
            ${{ runner.temp }}/java-scheduled-library/component/FIBERS-COMPILE.json
            ${{ runner.temp }}/java-scheduled-library/component/compiler-inputs.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/receipts/capture.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/receipts/java-classpath.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/candidate.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/application/java-dependencies.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/application/java-resolved.lock.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/application/latent.dependencies.json
            ${{ runner.temp }}/java-scheduled-library/component/library-inputs/application/latent.dependencies.lock.json
            ${{ runner.temp }}/java-scheduled-library/libraries/*.jar
            ${{ runner.temp }}/java-scheduled-library/compiler/*.log
            ${{ runner.temp }}/java-scheduled-library/compiler/*.command.json
            ${{ runner.temp }}/java-scheduled-library/commands/logs/*.txt
          if-no-files-found: warn
          retention-days: 3
