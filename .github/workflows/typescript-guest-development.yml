name: TypeScript guest development inputs

on:
  push:
    branches:
      - feat/546-typescript-guest-sdk

permissions:
  contents: read

concurrency:
  group: typescript-guest-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-inputs:
    name: Fetch locked native dependency inputs (not runtime conformance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Fetch exact native build dependencies without executing their code
        run: |
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/typescript-native-inputs"
          tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/typescript-native-inputs/registry.tar.gz" registry
          sha256sum "$RUNNER_TEMP/typescript-native-inputs/registry.tar.gz" > "$RUNNER_TEMP/typescript-native-inputs/registry.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/typescript-native-inputs/revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-native-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/typescript-native-inputs/
          if-no-files-found: error
          retention-days: 2
