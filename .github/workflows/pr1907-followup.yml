name: PR 1907 follow-up diagnostics
on:
  push:
    branches: [ci/pr1907-followup-20261115]
    paths: [.github/workflows/pr1907-followup.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retain bounded changed sources from the exact inspected merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: KirilsTurkins/latent-service-fabric
        run: |
          set -euo pipefail
          timeout 180s gh run download 43720314823 -n pr1907-followup-sources -D "$RUNNER_TEMP/pr1907-source"
          unset GH_TOKEN
          python3 - <<'PY'
          import os, pathlib, re, shutil, tarfile
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1907-source'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1907-small'
          output.mkdir()
          for path in source.iterdir():
              if path.is_file() and path.suffix in ('.txt', '.bin', '.diff', '.patch', '.log'):
                  assert path.stat().st_size <= 32 * 1024 * 1024
                  shutil.copyfile(path, output / path.name)
          shutil.copytree(source / 'conflict-stages', output / 'conflict-stages')
          paths = set((source / 'conflicts.txt').read_text().splitlines())
          for line in (source / 'auto-merge.patch').read_text().splitlines():
              if line.startswith('diff --git a/'):
                  paths.add(line.split(' b/', 1)[1])
          with tarfile.open(source / 'merged-source.tar.gz', 'r:gz') as archive:
              for member in archive:
                  if member.name not in paths:
                      continue
                  assert member.isfile() and member.size <= 4 * 1024 * 1024
                  target = output / 'selected-files' / member.name
                  assert '..' not in pathlib.PurePosixPath(member.name).parts and not member.name.startswith('/')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          for name in ('java-failures.txt', 'publications-failures.txt', 'conflicts.txt'):
              print('\n=== ' + name + ' ===\n' + (output / name).read_text(), flush=True)
          print('SELECTED_FILES=' + str(len(paths)), flush=True)
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        if: always()
        with:
          name: pr1907-followup-small
          path: ${{ runner.temp }}/pr1907-small/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
