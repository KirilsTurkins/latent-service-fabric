name: PR 1657 third request completion diagnosis
on:
  push:
    branches: ['diag/pr1657-third-request-20261107']
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Download exact reviewed candidate source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 120 gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13572615460/zip > "$RUNNER_TEMP/candidate.zip"
      - name: Restore checked source and install bounded trace
        run: |
          cp .github/pr1657_third_request_trace.py "$RUNNER_TEMP/trace.py"
          git checkout --detach 27164664b222bc52c88371a2225d147b3f8c020e
          git config user.name 'Kirils Turkins'
          git config user.email 'turkinskirils@gmail.com'
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B "$RUNNER_TEMP/trace.py"
      - name: Verify corrected compiler input identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_combined_http_materials.py --output "$RUNNER_TEMP/pr1657-compiler"
      - name: Run original signed witness once with unchanged limits
        run: python3 -B tools/qualify_rust_thread_http_combined.py --compiler-materials "$RUNNER_TEMP/pr1657-compiler" --output "$RUNNER_TEMP/pr1657-signed" --source-commit "$(git rev-parse HEAD)"
      - name: Print only bounded numeric observations
        if: always()
        run: |
          python3 -B - <<'PY'
          import os, json
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pr1657-signed'
          p = root / 'node/third-request-trace.json'
          if p.is_file():
              assert p.stat().st_size < 128 * 1024
              print(p.read_text())
          for name in ('FAILED.json', 'node/FAILED.json'):
              p = root / name
              if p.is_file():
                  d = json.loads(p.read_bytes())
                  print(name, {k: d.get(k) for k in ('status', 'stage', 'errorCategory')})
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-third-request-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr1657-signed/**
            ${{ runner.temp }}/pr1657-third-trace/**
          if-no-files-found: error
          retention-days: 7
