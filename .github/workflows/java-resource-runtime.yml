name: Java joined resources and standard facilities

on:
  push:
    branches: ['feat/java-resource-runtime-20261020']
    paths: ['.github/workflows/java-resource-runtime.yml']
  pull_request:
    branches: [development]
    paths:
      - 'examples/java-resource-runtime/**'
      - 'tools/java_resource_runtime_*.py'
      - 'tools/java_resource_timer_observer.py'
      - 'tools/qualify_java_resource_runtime.py'
      - 'tools/tests/test_java_joined*.py'
      - '.github/workflows/java-resource-runtime.yml'
  workflow_dispatch:
    inputs:
      replay_retained_component:
        description: Re-sign the exact retained Java component and run all original13 cases
        type: boolean
        default: false
      diagnose_retained_component:
        description: Observe only retained fresh, clear and parallel paths; never qualify original13
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: java-resource-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  joined-facilities:
    if: ${{ (github.event_name == 'workflow_dispatch' && !(inputs.replay_retained_component || inputs.diagnose_retained_component)) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/java-resource-runtime-20261020') || github.head_ref == 'feat/java-resource-runtime-20261020' }}
    name: Fresh Java resources across ordinary timer callbacks and two tenants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Fetch only the exact authenticated native observer source
        run: git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b
      - name: Check resource capture, explicit authority and actual pending refusal controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_joined_resources tools.tests.test_java_joined_runtime tools.tests.test_java_joined_owners tools.tests.test_sdk_native_products_reader -v
      - name: Authenticate the five retained native products without rebuilding them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/java-resource-native"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install the existing pinned Java guest compiler tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 -B tools/install_guest_bindgen.py "$RUNNER_TEMP/java-resource-bindgen"
          echo "$RUNNER_TEMP/java-resource-bindgen" >> "$GITHUB_PATH"
      - name: Capture two ordinary JARs and sign one fresh joined Java component
        run: |
          python3 -B tools/qualify_java_resource_runtime.py \
            --native "$RUNNER_TEMP/java-resource-native" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" \
            --output "$RUNNER_TEMP/java-resource-runtime"
      - name: Retain public compiler identities and bounded node outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-resource-runtime-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/java-resource-native/*.json
            ${{ runner.temp }}/java-resource-runtime/*.json
            ${{ runner.temp }}/java-resource-runtime/commands/logs/**
            ${{ runner.temp }}/java-resource-runtime/compiler/compiler-cache-selection.json
            ${{ runner.temp }}/java-resource-runtime/build/*.json
            ${{ runner.temp }}/java-resource-runtime/build/compiler-logs/**
            ${{ runner.temp }}/java-resource-runtime/build/component.wasm
            ${{ runner.temp }}/java-resource-runtime/build/capsule.json
            ${{ runner.temp }}/java-resource-runtime/build/package/**
            ${{ runner.temp }}/java-resource-runtime/node/*.json
            ${{ runner.temp }}/java-resource-runtime/node/node-stderr.txt
            ${{ runner.temp }}/java-resource-runtime/node/commands/logs/**
            ${{ runner.temp }}/java-resource-runtime/node/examples-controls/*.json
            ${{ runner.temp }}/java-resource-runtime/node/foreign-controls/*.json
            ${{ runner.temp }}/java-resource-runtime/node/signed/my-greeting/build-observation.json
            ${{ runner.temp }}/java-resource-runtime/node/signed/release-set.json

  retained-component:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.replay_retained_component || inputs.diagnose_retained_component) }}
    name: Sign unchanged Java component or diagnose closed modes explicitly
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Fetch exact original Java compiler and native observer sources
        run: |
          git fetch --no-tags --depth=1 origin 063be0a52eac35d6d0acf836089479437c9ce07b
          git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b
      - name: Check public-output, retained-build and pending-owner refusal controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_joined_resources tools.tests.test_java_joined_runtime tools.tests.test_java_joined_owners tools.tests.test_java_resource_replay tools.tests.test_java_resource_diagnostic tools.tests.test_sdk_native_products_reader -v
      - name: Authenticate the same five retained native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/java-resource-native"
      - name: Restore only the immutable original public Java build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-resource-runtime-063be0a52eac35d6d0acf836089479437c9ce07b
          run-id: 39482057326
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/java-resource-original
      - name: Authenticate all original members and run only fresh signing and joined cases
        if: ${{ !inputs.diagnose_retained_component }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/replay_java_resource_runtime.py \
            --native "$RUNNER_TEMP/java-resource-native" \
            --retained "$RUNNER_TEMP/java-resource-original" \
            --output "$RUNNER_TEMP/java-resource-replay"
      - id: diagnose-retained-java
        name: Observe exact fresh, clear and parallel outcomes without qualification
        if: ${{ inputs.diagnose_retained_component }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/replay_java_resource_runtime.py \
            --native "$RUNNER_TEMP/java-resource-native" \
            --retained "$RUNNER_TEMP/java-resource-original" \
            --output "$RUNNER_TEMP/java-resource-replay" --diagnostic
      - name: Retain bounded public original identities and fresh node results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-resource-runtime-replay-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/java-resource-native/*.json
            ${{ runner.temp }}/java-resource-original/java-resource-runtime/FAILED.json
            ${{ runner.temp }}/java-resource-original/java-resource-runtime/build/**
            ${{ runner.temp }}/java-resource-replay/*.json
            ${{ runner.temp }}/java-resource-replay/node/*.json
            ${{ runner.temp }}/java-resource-replay/node/node-stderr.txt
            ${{ runner.temp }}/java-resource-replay/node/commands/logs/**
            ${{ runner.temp }}/java-resource-replay/node/examples-controls/*.json
            ${{ runner.temp }}/java-resource-replay/node/foreign-controls/*.json
            ${{ runner.temp }}/java-resource-replay/node/signed/my-greeting/build-observation.json
            ${{ runner.temp }}/java-resource-replay/node/signed/release-set.json
