          ${{ runner.temp }}/dotnet-compiler-diagnostics/build/closed-filesystem-port.json
          ${{ runner.temp }}/dotnet-compiler-diagnostics/build/internal-io-port.json
          ${{ runner.temp }}/dotnet-compiler-diagnostics/build/closed-runtime-coverage.json
