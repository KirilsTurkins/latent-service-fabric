name: PR2163 exact merge blob publication
on:
  push:
    branches: ['work/pr2163-merge-blobs-20261122']
    paths: ['.github/workflows/pr2163-merge-blobs.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'KirilsTurkins/latent-service-fabric'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Authenticate and publish seven tested blobs without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          REPO = "KirilsTurkins/latent-service-fabric"
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/work/pr2163-merge-blobs-20261122"
          PATCHES = json.loads(r'''[{"path":"docs/testing/typescript-event-native-pressure.md","base":"da8d0086681f365811eea11a1cb7d7800d4596dd","sha":"81ba87941fd4085a2393f8e55041ee7878bbcd90","sha256":"2d874466db2370d28dfa438ca9f1faffcc9de2f950be329e94c85f4dff89a3e5","edits":[[165,165,"\n## Private task completion and rooted abort retry\n\n\nSigned run `44701843668` at `afad3f21` passed compilation and ordinary fan-out,\nthen returned `diagnostic:abort-fanout:checkpoint:native-admission`. Artifact\n`14618760997` retains that failed signed attempt. Its cleanup observation does\nnot prove physical retirement.\n\nA replay of the retained engine with finite diagnostic broker imports narrows\nthe failure beyond the returned diagnostic. The filler listener is actually\nremoved and its original owner acknowledged at the next collection. The graph\nand generated task still retain 63 native owners. The recovery Promise takes\nthe final slot, so its reaction cannot be admitted. Raising the ceiling or\nrefunding still-live Promises would conceal this boundary.\n\nThe selected source-splicer path now derives a lazy **private task completion\ncapability**. Construction retains the original exit capability, task queues,\nmetadata, and settlement handler. The completion Promise and its resolving\nfunctions are created on the first `completionPromise()` observation, or at\n`onResolve` entry before detaching any original handler. The same real Promise\nis retained thereafter. Settlement creates it even without observers, preserving\nthenable assimilation and unhandled-rejection reporting rather than buffering\nresults or substituting a custom Promise implementation. The factory must\nsucceed before publishing either field. The original completion handler drops\nits resolver captures only after they are no longer needed; their native owners\nstill require actual physical retirement and acknowledgement.\n\nThe derivation checks the exact rewritten AST shapes and use counts, rejects\nextra private uses, reserved-name collisions and repeated adaptation, and leaves\nunrelated task methods unchanged. The ordinary compiler path is not adapted.\nBoth derivation files were already included in the captured compiler recipe.\n\nDeferring completion alone admits the awaited checkpoint but still reaches the\nlimit on the resumed job's explicit abort retry. `AbortSignal::abort` therefore\nuses the existing pressure preflight after its pending-exception and\nalready-aborted checks, **before** the default exception factory, weak-set\ncursors or fan-out staging. Its signal and reason are rooted handles. This\ncollects only dead earlier-job owners; the live nine-dependent graph remains\ncharged. Low-level admission remains non-collecting, and failed preparation\ncannot publish reasons, allocate the fan-out vector, or dispatch callbacks.\n\nThe diagnostic rebuilds the real generated bindings with the retained engine.\nIts abort preflight is a private insertion of that engine's existing compiled\ncollection/checkpoint code, not a fresh C++ engine build. The diagnostic fails\nwith only the completion change, and returns the original success value with\nboth changes at the same 64-owner ceiling.\nThe latter still observes both required refusals before recovery. Replays of the\nother non-network event, abort and combinator cases also retain their original\nresults. These are diagnostic broker observations, not signed-node or original\nactivation-ledger qualification. The guest probe, same-root retry, positive\nfiller, budgets, deadlines and strict signed-result assertions are unchanged.\n\n\n## Combined development integration\n\nThe merge of development `8f87f81f` into the event-wait branch retains both\nreductions: empty algorithm containers remain absent, and unobserved private\ntask completion capabilities remain lazy. The rooted abort pressure preflight\nis retained; low-level admission is still non-collecting. No allocation is\nunaccounted or refunded early, and the 64-owner ceiling is unchanged.\n\nThe emitted fan-out regression includes absent algorithm storage with a\nrefused preflight: no default reason, vector reservation, callback or graph\npublication may occur. All prior empty-storage, factory-failure, first-use\ncontainer ownership and task-completion controls remain required.\n\nBefore this merge, event-wait head `4923f54a` passed signed Fetch run\n`44894162810`, including all 24 expected results, refusal/recovery, default\nreentry and fresh state. The retained artifact `14705778588` has SHA-256\n`c4b6fb3e21d2d9fc5095cefd91a05025ccb05399539af23b0cffeeb9b21647b5`.\nThat is predecessor evidence, not signed execution of the combined source.\nFresh combined-head engine construction and signed retirement checks remain\nrequired; full-ticket and whole-runtime accounting claims are unchanged.\n"]]},{"path":"tools/tests/fixtures/typescript_abort_failure.cpp","base":"d3fe8398c752c8ef49c7685309ec73fe15ea9c01","sha":"393a981d5689f0edc681372264dc6a3f5ef8eb1b","sha256":"3a7861b631b598eb94aad1f62c86a9a7a94eec627fe77df62805a66785b76ae5","edits":[[117,118,"  bool aborted = false, algorithm_storage_absent = false;\n"],[296,297,"  static AlgorithmList* algorithms(Signal* signal) {\n    return signal->algorithm_storage_absent ? nullptr : &signal->algorithms;\n  }\n"],[339,339,"  if (is(\"fanout-empty-algorithms\") || is(\"fanout-empty-algorithms-pressure-refusal\")) {\n    graph.root.algorithms.clear(); graph.root.algorithm_storage_absent = true;\n    for (auto& signal : graph.dependents) {\n      signal.algorithms.clear(); signal.algorithm_storage_absent = true;\n    }\n  }\n"],[347,347,"  if (is(\"fanout-empty-algorithms-pressure-refusal\")) {\n    const int destroyed_before = state.destroyed;\n    state.refuse_prepare = true;\n    const bool ok = AbortSignal::abort(&cx, &graph.root, 0);\n    auto untouched = [](const Signal& signal) {\n      return !signal.aborted && !signal.reason && signal.algorithm_storage_absent &&\n          signal.algorithms.empty();\n    };\n    bool unchanged = untouched(graph.root) && graph.root.dependents.values.size() == graph.count;\n    for (size_t i = 0; i < graph.count; ++i)\n      unchanged &= untouched(graph.dependents[i]) && graph.root.dependents.values[i] == &graph.dependents[i];\n    return !ok && cx.pending == 808 && cx.stack == 8080 && unchanged &&\n        state.preparations == 1 && !state.default_reasons && !state.reserve_attempts &&\n        !state.admitted && !state.dispatches && state.destroyed == destroyed_before;\n  }\n"],[454,455,"  } else if (is(\"fanout-inline\") || is(\"fanout-heap\") || is(\"fanout-ack-refusal\") || is(\"fanout-empty-algorithms\")) {\n"]]},{"path":"tools/tests/test_typescript_event_ownership.py","base":"cf7e9d9b52087bb1e019fdb532fe1740887a2273","sha":"44b2654c390294ca41c7cb94d33a45879cbb9944","sha256":"94b91cda31a9c964b753d93fa1b1897f4de4605fc09a03f8c79ac50d1131a1db","edits":[[347,348,"                     'explicit-reason', 'already-aborted', 'fanout-inline', 'fanout-heap',\n                     'fanout-empty-algorithms', 'fanout-empty-algorithms-pressure-refusal',\n                     'fanout-pressure-refusal', 'fanout-entry-exception', 'fanout-aborted-no-preflight',\n"]]},{"path":"tools/tests/test_local_tests.py","base":"cf70e611841029d7a2ecf73dbc126034e453c327","sha":"4536df80e1dbf08d36b47e011f87b05c969ee11f","sha256":"e2c26518b37448fdc3dd3ce22f7555834c9e5b24d67c20254949b7f8edf817b5","edits":[[677,677,"            # This workspace is outside ROOT: retain the repository toolchain\n            # rather than silently using the runner's unrelated Cargo layout.\n            (repo / \"rust-toolchain.toml\").write_bytes((ROOT / \"rust-toolchain.toml\").read_bytes())\n"]]},{"path":"tools/tests/test_java_enum_guard.py","base":"34d178311ca81ff9ece20f874f2573ab9ebe9248","sha":"ce6fde5d99a75be4b936bc068c689f8f7a210ba2","sha256":"0258f8be0780f269dd6f4831118eb15dd9a94ecd01f3cee3655fe004c7782412","edits":[[10,10,"from tools.tests.test_java_exception_slots import HEADER, function\n"],[87,88,"        (generated / 'all.c').write_bytes((self.root / 'all.c').read_bytes()\n                                          + b'#include \"lifetime.c\"\\n')\n"],[89,89,"        (generated / 'exceptions.h').write_bytes(HEADER.read_bytes())\n        (generated / 'lifetime.c').write_bytes(function())\n"],[105,106,"                         ['-Wl,-z,stack-size=65536'])\n"],[108,109,"        self.assertEqual(receipt['exceptionSlots']['schemaVersion'], 'latent.java.exception-slots.v1')\n        self.assertEqual(receipt['exceptionSlots']['regions'], 2)\n        self.assertEqual(receipt['exceptionSlots']['slots'], 1)\n        self.assertIn(b'LSF_TEAVM_TRY_SLOT', (generated / 'lifetime.c').read_bytes())\n"],[114,114,"        # A new link attempt starts with freshly generated compiler inputs.\n        (generated / 'exceptions.h').write_bytes(HEADER.read_bytes())\n        (generated / 'lifetime.c').write_bytes(function())\n"]]},{"path":"tools/tests/test_java_date_link_guard.py","base":"1e7575863836ea7b6ac5bca7f3878c86f92bcb82","sha":"a3786c1d8729f20b1579b4b869143ccbd75b0d7d","sha256":"e273cb9ee7e1b89865a9fd316ddab03e7541c4801d3f3b6c1f65138154402095","edits":[[67,68,"                             ['-Wl,-z,stack-size=65536'])\n"]]},{"path":"tools/tests/test_native_fixture_toolchain.py","base":"5b3e0c959fce4bccb18d7daccb41797f88082d18","sha":"ebc8952e0baa886ad99f61bf5f75b4661be075ff","sha256":"8efb344e867dec329592f74095516027fffe50f1a8de1762b0f16134bd650a54","edits":[[3,3,"import os\nimport tomllib\n"],[20,20,"                pin = tomllib.loads(observed[-1].decode())['toolchain']['channel']\n                self.assertEqual(kwargs['env']['RUSTUP_TOOLCHAIN'], pin)\n                self.assertEqual(kwargs['env']['CARGO_NET_OFFLINE'], 'true')\n                self.assertEqual(os.environ['RUSTUP_TOOLCHAIN'], 'unrelated-ambient-toolchain')\n"],[28,29,"        with patch.dict(os.environ, {\"RUSTUP_TOOLCHAIN\": \"unrelated-ambient-toolchain\"}), \\\n                patch.object(subprocess, \"check_output\", side_effect=command), \\\n"]]}]''')
          assert len(PATCHES) == 7
          
          def git_hash(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          
          def request(path, payload=None):
              assert path.startswith("git/blobs"), path
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request("https://api.github.com/repos/" + REPO + "/" + path,
                  data=body, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json", "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024 + 1)
              assert len(raw) <= 2 * 1024 * 1024
              return json.loads(raw)
          
          prepared = []
          for row in PATCHES:
              src = request("git/blobs/" + row["base"])
              assert src["encoding"] == "base64" and src["sha"] == row["base"]
              data = base64.b64decode(src["content"])
              assert len(data) <= 1024 * 1024 and git_hash(data) == row["base"]
              lines = data.decode("utf-8").splitlines(keepends=True)
              end = 0
              for start, stop, text in row["edits"]:
                  assert end <= start <= stop <= len(lines) and isinstance(text, str)
                  end = stop
              for start, stop, text in reversed(row["edits"]):
                  lines[start:stop] = [text]
              result = "".join(lines).encode("utf-8")
              assert len(result) <= 1024 * 1024
              assert git_hash(result) == row["sha"]
              assert hashlib.sha256(result).hexdigest() == row["sha256"]
              prepared.append((row, result))
          
          published = []
          for row, result in prepared:
              response = request("git/blobs", {"content": base64.b64encode(result).decode(), "encoding": "base64"})
              assert response["sha"] == row["sha"]
              published.append({"path": row["path"], "base": row["base"], "sha": row["sha"],
                  "sha256": row["sha256"], "bytes": len(result)})
          print(json.dumps({"status": "published", "refUpdates": False, "executedRepositoryCode": False,
              "files": published}, indent=2))
          PY
