name: Refresh issue 3 lockfile and validate

on:
  push:
    branches:
      - feat/issue-3-manifest-codecs

permissions:
  contents: write

jobs:
  refresh-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install repository validation dependencies
        run: python -m pip install --requirement tools/requirements.lock

      - name: Refresh lockfile and remove bootstrap
        run: |
          cargo metadata --format-version 1 >/dev/null
          rm .github/workflows/issue-3-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/issue-3-lock.yml
          git commit -m "chore: refresh manifest codec lockfile"
          git push

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Validate repository contracts
        run: |
          python tools/validate_repository.py
          python -m unittest discover -s tools/tests

      - name: Check minimum supported Rust version
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 check --workspace --all-targets --all-features --locked
