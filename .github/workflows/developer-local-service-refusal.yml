name: Ordinary local-service first refusal

on:
  push:
    branches: ['fix/local-service-registry-retirement-20261025']

permissions:
  contents: read

concurrency:
  group: local-service-refusal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install the maintained Python validator closure
        run: python -m pip install --disable-pip-version-check -r tools/requirements.lock
      - name: Stage the unchanged pinned Python prefix
        run: |
          image='python@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419'
          container=$(docker create "$image")
          trap 'docker rm "$container"' EXIT
          prefix="$RUNNER_TEMP/local-service-cpython"
          mkdir "$prefix"
          docker cp "$container:/usr/local/." "$prefix"
          printf 'LSF_LOCAL_PYTHON_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"
      - name: Diagnose only the original local-service fixture
        env:
          LSF_LOCAL_OUTPUT: ${{ runner.temp }}/local-service-refusal
        run: python tools/run_dev_local_service_refusal_ci.py --python-prefix "$LSF_LOCAL_PYTHON_PREFIX" --output "$LSF_LOCAL_OUTPUT"
      - name: Preserve original failure and bounded command evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: local-service-refusal-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-service-refusal/public/NODE-LOCAL-SERVICE-REFUSAL.json
            ${{ runner.temp }}/local-service-refusal/public/commands/*.stdout
            ${{ runner.temp }}/local-service-refusal/public/commands/*.stderr
            ${{ runner.temp }}/local-service-refusal/public/fixture/observation.json
            ${{ runner.temp }}/local-service-refusal/public/fixture/node/probe.json
            ${{ runner.temp }}/local-service-refusal/public/fixture/node/node-tests.json
            ${{ runner.temp }}/local-service-refusal/public/source-node.json
          if-no-files-found: error
          retention-days: 3
