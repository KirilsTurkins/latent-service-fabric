name: Prepare exact CORS catalogue merge
on:
  push:
    branches: ['ci/660-merge-inventory']
    paths: ['.github/workflows/cross-origin-merge-inventory.yml']
permissions: {}
jobs:
  prepare:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/660-merge-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # Fixed, reviewed Git data only. No checkout, repository script execution,
      # ref update, commit, PR merge, or credential output.
      - name: Create exact additive merge blob without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, copy, hashlib, json, os, urllib.request
          root = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def read(sha):
              request = urllib.request.Request(root + '/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  encoded = response.read(2 * 1024 * 1024 + 1)
              assert len(encoded) <= 2 * 1024 * 1024
              data = base64.b64decode(json.loads(encoded)['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              return json.loads(data)
          base = read('f2c06d93dba00affe87149a1ea6ce1c66506f933')
          ours = read('ccf3bd52fbf415a18b39e67f27de3a5c65fb7bec')
          current = read('fd0b5906752180744b7963b0e4630b66a233a58f')
          def row(document):
              matches = [item for item in document['suites'] if item['id'] == 'latentd.lib.latentd']
              assert len(matches) == 1
              return matches[0]
          before, added, latest = row(base), row(ours), row(current)
          assert before['minimumCases'] == len(before['expectedCases']) == 475
          additions = sorted(set(added['expectedCases']) - set(before['expectedCases']))
          assert len(additions) == 17 and all('cross_origin' in name or 'cors_headers' in name for name in additions)
          assert set(before['expectedCases']) <= set(added['expectedCases'])
          control = copy.deepcopy(ours)
          row(control).update(expectedCases=before['expectedCases'], minimumCases=before['minimumCases'])
          assert control == base
          assert not set(additions).intersection(latest['expectedCases'])
          assert latest['minimumCases'] == len(latest['expectedCases'])
          output = copy.deepcopy(current)
          target = row(output)
          target['expectedCases'] = sorted(latest['expectedCases'] + additions)
          target['minimumCases'] += len(additions)
          preserved = copy.deepcopy(output)
          row(preserved).update(expectedCases=latest['expectedCases'], minimumCases=latest['minimumCases'])
          assert preserved == current
          data = (json.dumps(output, sort_keys=True, separators=(',', ':')) + '\n').encode()
          assert len(data) <= 1024 * 1024
          sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          request = urllib.request.Request(root, data=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read(4096))
          assert result['sha'] == sha
          print(json.dumps({'blob': sha, 'sha256': hashlib.sha256(data).hexdigest(), 'addedCases': additions, 'minimumCases': target['minimumCases'], 'refsChanged': False}))
          PY
