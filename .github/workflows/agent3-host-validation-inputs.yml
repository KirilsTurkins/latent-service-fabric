name: Agent 3 host validation inputs
on:
  push:
    branches: ['fix/typescript-745-activation-resource-ownership']
    paths: ['.github/workflows/agent3-host-validation-inputs.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - name: Retain complete immutable source and exact formatter
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/agent3-complete-inputs"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/commit.txt"
          git archive --format=tar HEAD | gzip -n > "$output/source.tar.gz"
          rustc +1.97.1 -Vv > "$output/rustc.txt"
          rustfmt +1.97.1 --version > "$output/rustfmt.txt"
          tar -czf "$output/formatter.tar.gz" -C "$(rustc +1.97.1 --print sysroot)" bin/rustfmt bin/cargo-fmt
          (cd "$output" && sha256sum source.tar.gz formatter.tar.gz > archives.sha256)
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: agent3-complete-source-${{ github.sha }}
          path: ${{ runner.temp }}/agent3-complete-inputs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
