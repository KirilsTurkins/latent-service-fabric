name: PR 1657 retained-native peer investigation
on:
  push:
    branches: ['diag/pr1657-peer-observation-20261106']
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - name: Retrieve the exact already-built diagnostic products
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13523774023/zip > "$RUNNER_TEMP/original.zip"
      - name: Observe the original gates and bounded native demand
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B .github/pr1657_peer_observation.py
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-peer-observation-${{ github.sha }}
          path: ${{ runner.temp }}/peer-observation/**
          retention-days: 3
          if-no-files-found: error
