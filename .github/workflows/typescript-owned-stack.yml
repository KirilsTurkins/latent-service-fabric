name: TypeScript original activation stack accounting
on:
  push:
    branches: ['feat/typescript-owned-stack-20261021']
    paths:
      - '.github/workflows/typescript-owned-stack.yml'
      - 'tools/typescript_tracking_component.py'
      - 'tools/qualify_typescript_owned_stack.py'
      - 'tools/qualify_typescript_runtime_limits.py'
      - 'tools/tests/test_typescript_tracking_component.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-owned-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-ledger:
    name: Same TypeScript component and ceilings with activation-owned root stacks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check original boundaries and refuse mixed or changed component provenance
        run: python3 -B -m unittest tools.tests.test_typescript_runtime_limits tools.tests.test_typescript_tracking_component -v
      - name: Acquire the immutable previously built TypeScript component
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_tracking_component.py --output "$RUNNER_TEMP/typescript-original-component"
      - name: Acquire the same reviewed C and RootOnly native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import os, subprocess
          from pathlib import Path
          from tools import activation_stack_native_products as native
          subprocess.check_call(['git','fetch','--no-tags','--depth=1','origin',native.SOURCE])
          native.prepare(Path(os.environ['RUNNER_TEMP'])/'typescript-owned-stack-native')
          PY
      - name: Sign and replay the unchanged fifteen actual guest invocations
        run: >-
          python3 -B tools/qualify_typescript_owned_stack.py
          --acquired "$RUNNER_TEMP/typescript-original-component"
          --prepared "$RUNNER_TEMP/typescript-owned-stack-native"
          --output "$RUNNER_TEMP/typescript-owned-stack"
      - name: Retain actual results and physical owner retirement
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-owned-stack-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-original-component/acquisition.json
            ${{ runner.temp }}/typescript-owned-stack-native/*.json
            ${{ runner.temp }}/typescript-owned-stack/*.json
            ${{ runner.temp }}/typescript-owned-stack/node/*.json
            ${{ runner.temp }}/typescript-owned-stack/node/*/*.json
            ${{ runner.temp }}/typescript-owned-stack/node/*/controls/
          if-no-files-found: warn
          retention-days: 7
