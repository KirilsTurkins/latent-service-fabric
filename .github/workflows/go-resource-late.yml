name: Go accepted late resource callback completion
'on':
  push:
    branches:
    - feat/go-resource-late-completion-20261021
    paths:
    - .github/workflows/go-resource-late.yml
    - tools/go_resource_runtime_fixture.py
    - tools/go_resource_runtime_build.py
    - tools/qualify_go_resource_runtime.py
    - tools/resource_runtime_node.py
    - tools/qualify_typescript_resource_runtime.py
    - tools/go_resource_late.py
    - tools/tests/test_go_resource_late.py
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: go-resource-late-${{ github.ref }}
  cancel-in-progress: false
jobs:
  joined-resources:
    name: Running AfterFunc Stop false retains real facility callbacks and fresh tenant state
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
    - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
      with:
        persist-credentials: false
        fetch-depth: 1
    - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
      with:
        python-version: 3.13.5
    - name: Fetch the exact successful current SDK5 producer before validation
      run: git fetch --no-tags --depth=1 origin 357eecbd7744bbc026741d241b679966d14b0e95
    - name: Install original locked reader dependencies
      run: python3 -m pip install -r tools/requirements.lock
    - name: Preserve Go profile and original TypeScript retirement and pending-witness boundaries
      run: python3 -B -m unittest tools.tests.test_go_resource_late tools.tests.test_go_resource_runtime tools.tests.test_typescript_resource_runtime tools.tests.test_sdk_native_products_reader tools.tests.test_rust_http_installed_native_products -v
    - name: Install captured Go compiler namespace
      run: 'sudo apt-get update

        sudo apt-get install --yes bubblewrap

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

        '
    - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
      with:
        version: 1.254.0
    - name: Authenticate original Go1.27.3 and componentize-go0.4.3 and prepare the maintained v5 compiler
      run: 'set -euo pipefail

        out="$RUNNER_TEMP/go-http-tenant-tools"

        test ! -e "$out"

        mkdir "$out"

        curl --fail --location --proto ''=https'' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz

        echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz" | sha256sum --check --strict

        tar -xzf "$out/go.tar.gz" -C "$out"

        curl --fail --location --proto ''=https'' --tlsv1.2 --max-time 180 --output "$out/componentize-go.tar.gz" https://github.com/bytecodealliance/componentize-go/releases/download/v0.4.3/componentize-go-linux-amd64.tar.gz

        echo "1061d845f550df5d9477612a7d458a31b1e2b8bdc95823704e42e5064deb0c52  $out/componentize-go.tar.gz" | sha256sum --check --strict

        tar -xzf "$out/componentize-go.tar.gz" -C "$out" componentize-go

        echo "b41803a645e54845bc8eacef9a69e0eeb8c2c4a9a61964c831ed544e85c137cb  $out/componentize-go" | sha256sum --check --strict

        chmod 755 "$out/componentize-go"

        test "$("$out/componentize-go" --version)" = ''componentize-go 0.4.3''

        test "$(wasm-tools --version | cut -d '' '' -f 1,2)" = ''wasm-tools 1.254.0''

        python3 -B tools/go_guest/runtime.py --prepare-compiler "$out/go" --output "$out/go-async"

        echo "$out" >> "$GITHUB_PATH"

        echo "$out/go-async/bin" >> "$GITHUB_PATH"

        '
    - name: Retrieve exactly five authenticated SDK5 products without rebuilding the host
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -B tools/rust_http_installed_native_products.py --output "$RUNNER_TEMP/go-resource-native"
    - name: Build one ordinary Go component and require six signed late-callback and fresh outcomes
      run: python3 -B tools/qualify_go_resource_runtime.py --native "$RUNNER_TEMP/go-resource-native" --output "$RUNNER_TEMP/go-resource-runtime" --late-completion
    - name: Retain bounded original construction and actual outcomes including failures
      if: always()
      uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
      with:
        name: go-resource-late-${{ github.sha }}
        retention-days: 3
        if-no-files-found: warn
        path: '${{ runner.temp }}/go-resource-native/*.json

          ${{ runner.temp }}/go-resource-runtime/*.json

          ${{ runner.temp }}/go-resource-runtime/build/*.json

          ${{ runner.temp }}/go-resource-runtime/build/component.wasm

          ${{ runner.temp }}/go-resource-runtime/build/component.wit

          ${{ runner.temp }}/go-resource-runtime/build/package/**

          ${{ runner.temp }}/go-resource-runtime/build/logs/**

          ${{ runner.temp }}/go-resource-runtime/node/*.json

          ${{ runner.temp }}/go-resource-runtime/node/*.log

          ${{ runner.temp }}/go-resource-runtime/node/commands/**

          ${{ runner.temp }}/go-resource-runtime/node/examples-controls/*.json

          ${{ runner.temp }}/go-resource-runtime/node/foreign-controls/*.json'
