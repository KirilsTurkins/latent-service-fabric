name: Stream kernel original owner controls

on:
  workflow_dispatch: {}
  push:
    branches: [feat/stream-kernel-platform-factory-20261021]
    paths:
      - '.github/workflows/stream-kernel-owners.yml'
      - 'crates/latent-capabilities/src/broker/pools.rs'
      - 'crates/latent-capabilities/src/broker/pools/**'
      - 'crates/latent-streams/src/connection.rs'
      - 'tools/qualify_stream_kernel_owners.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: stream-kernel-owners-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owners:
    name: Exact original broker I/O owners and selected stream source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Restore compiled Rust dependencies
        uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Execute exact broker owners and compile stream integration
        run: python3 tools/qualify_stream_kernel_owners.py --output "$RUNNER_TEMP/stream-kernel-owners"
      - name: Retain bounded owner execution and compile failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-kernel-owners-${{ github.sha }}
          path: ${{ runner.temp }}/stream-kernel-owners/
          if-no-files-found: warn
          retention-days: 7
