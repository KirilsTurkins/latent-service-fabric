name: PR 1380 repair preparation
on:
  push:
    branches: [ci/audit-1380-repair-e82a505]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'KirilsTurkins/latent-service-fabric'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Prepare the exact reviewed merge without changing the PR branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/maintenance/repair-audit-1380.py "$RUNNER_TEMP/repair-audit-1380.py"
          git fetch --no-tags --depth=128 origin e82a505f78209a60c57a869065e06714d343a23d 0dd0facf0ac9548c41f2d755655fd37e347eefd7 9fc52a857c4040f2a9e8a8b10e4a5b0e9bc459ca
          git config user.name 'LSF CI repair'
          git config user.email 'ci-repair@users.noreply.github.com'
          git checkout --detach e82a505f78209a60c57a869065e06714d343a23d
          python3 -m pip install --requirement tools/requirements.lock
          mkdir -p "$RUNNER_TEMP/audit-1380-evidence"
          python3 "$RUNNER_TEMP/repair-audit-1380.py" | tee "$RUNNER_TEMP/audit-1380-evidence/preparation.txt"
          git diff e82a505f78209a60c57a869065e06714d343a23d HEAD --binary > "$RUNNER_TEMP/audit-1380-evidence/repair.patch"
      - name: Execute source capacity, receipt, contract and route regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_static_audit_lifecycle tools.tests.test_build_source_capacity tools.tests.test_build_snapshot tools.tests.test_build_process tools.tests.test_ci_contracts > "$RUNNER_TEMP/audit-1380-evidence/python.txt" 2>&1 || { tail -n 180 "$RUNNER_TEMP/audit-1380-evidence/python.txt"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/audit-1380-evidence/python.txt"
          python3 tools/ci_coverage.py --receipt target/ci/observed-inventory.json
          node --test tools/static-release/*.test.mjs > "$RUNNER_TEMP/audit-1380-evidence/node.txt" 2>&1 || { tail -n 120 "$RUNNER_TEMP/audit-1380-evidence/node.txt"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/audit-1380-evidence/node.txt"
      - name: Store tested objects only on this isolated preparation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          test "$(git show -s --format=%P HEAD)" = 'e82a505f78209a60c57a869065e06714d343a23d 0dd0facf0ac9548c41f2d755655fd37e347eefd7'
          test -z "$(git status --porcelain --untracked-files=normal)"
          retained=$(printf '%s\n' 'Retain tested PR 1380 merge objects without updating its branch' | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$candidate")
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$retained:refs/heads/ci/audit-1380-repair-e82a505"
          unset auth GH_TOKEN
          printf '{"candidate":"%s","tree":"%s","head":"e82a505f78209a60c57a869065e06714d343a23d","development":"0dd0facf0ac9548c41f2d755655fd37e347eefd7","preparationBranch":"ci/audit-1380-repair-e82a505","prBranchUpdated":false}\n' "$candidate" "$tree" | tee "$RUNNER_TEMP/audit-1380-evidence/result.json"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/audit-1380-evidence/tested-source.tar.gz"
      - name: Retain bounded preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audit-1380-repair-evidence
          path: |
            ${{ runner.temp }}/audit-1380-evidence/
            target/ci/observed-inventory.json
          retention-days: 3
          if-no-files-found: warn
