name: PR 703 upgrade workbench
on:
  push:
    branches: [fix/pr-703-upgrade-workbench]
    paths: [.github/workflows/pr-703-upgrade-workbench.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 711c5773eab56487270b95d395bb6e4879394ea7
          persist-credentials: false
      - name: Acquire only authenticated npm input archives without executing them
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, tarfile
          spec = importlib.util.spec_from_file_location('npm_prepare', 'website/toolchain/prepare.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          pins = json.loads(pathlib.Path('website/toolchain/source.json').read_text())
          pins['patches'][0]['version'] = '10.7.2'
          pins['patches'][0]['integrity'] = 'sha512-7H/2gFSIitxc0hG3nOI1glS8QLo/EHBFFLk8vEUjXY/xu0AdL8jZ9U1IzO2PUm0d2D/ofQcAifb0g6OBkt8U7w=='
          pins['patches'].append({'name':'brace-expansion', 'from':'5.0.9', 'version':'5.0.12', 'integrity':'sha512-YovQ3rzhaLMIrDjNDMkNS01tea93qhEhG5xy8f6+R0l+dw3Ki+5sCoIoI942iuLZTHWogWktgwVDhU09iNEimQ=='})
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          cache = root / 'npm-inputs'
          for pin in [pins['base'], *pins['patches']]:
              raw = module.acquire(pin, cache, False)
              manifest = module.package(module.unpack(raw))
              assert manifest['name'] == pin['name'] and manifest['version'] == pin['version']
              print(pin['name'], pin['version'], module.integrity(raw), manifest.get('dependencies', {}))
          with tarfile.open(root / 'pr703-npm-inputs.tar.gz', 'w:gz') as archive:
              for path in sorted(cache.iterdir()):
                  archive.add(path, arcname=path.name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr703-npm-inputs
          path: ${{ runner.temp }}/pr703-npm-inputs.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
