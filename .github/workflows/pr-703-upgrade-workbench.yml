name: PR 703 upgrade workbench
on:
  push:
    branches: [fix/pr-703-upgrade-workbench]
    paths: [.github/workflows/pr-703-upgrade-workbench.yml]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controls
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 711c5773eab56487270b95d395bb6e4879394ea7
          path: source
          persist-credentials: false
      - name: Reconstruct and verify the complete candidate source tree
        working-directory: source
        run: |
          set -euo pipefail
          for sha in aaa4191436ef07e5a8739f411f63a1a85f99701f 7aa1ae07c7ceed1c6ab32b6cdeb5b46ba31f750e 0ad80497604b2815487e4e5c870aa8fa1f1a0a61; do
            git fetch --no-tags --depth=1 origin "$sha"
          done
          python3 ../controls/.github/pr703_assemble.py
      - name: Store only content-addressed blobs for the authorized connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controls/.github/pr703_assemble.py --store-blobs
