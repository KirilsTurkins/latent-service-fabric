name: Issue 1596 implementation checks
on:
  push:
    branches: [ci/1596-dynamic-test-discovery]
    paths: [.github/workflows/ci-1596-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          ref: 816b806d61c3479b3e138fa55466c22250818f07
          persist-credentials: false
      - name: Export exact tracked inputs without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/issue-1596-source" "$RUNNER_TEMP/issue-1596-git" "$RUNNER_TEMP/issue-1596-rust"
          git rev-parse HEAD > "$RUNNER_TEMP/issue-1596-source/revision.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/issue-1596-source/source.tar.gz"
          git bundle create "$RUNNER_TEMP/issue-1596-git/source.bundle" HEAD
          cp .git/shallow "$RUNNER_TEMP/issue-1596-git/shallow"
          toolchain="$(dirname "$(dirname "$(rustup which --toolchain stable rustc)")")"
          cd "$toolchain"
          tar -czf "$RUNNER_TEMP/issue-1596-rust/rust.tar.gz" bin/rustc bin/rustdoc bin/cargo lib/*.so* lib/rustlib/x86_64-unknown-linux-gnu/lib
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: issue-1596-tracked-source
          path: ${{ runner.temp }}/issue-1596-source/
          if-no-files-found: error
          retention-days: 3
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: issue-1596-source-objects
          path: ${{ runner.temp }}/issue-1596-git/
          if-no-files-found: error
          retention-days: 3
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: issue-1596-test-compiler
          path: ${{ runner.temp }}/issue-1596-rust/
          if-no-files-found: error
          retention-days: 3
