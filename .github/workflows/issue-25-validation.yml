name: Issue 25 Phase 0 completion gate

on:
  pull_request:
    branches:
      - development
    paths:
      - ".github/workflows/issue-25-validation.yml"
      - "Makefile"
      - "README.md"
      - "VALIDATION.md"
      - "apps/latentd/**"
      - "benchmarks/phase0/**"
      - "crates/latent-activation/**"
      - "crates/latent-executor/**"
      - "crates/latent-node/**"
      - "crates/latent-scheduler/**"
      - "crates/latent-wasmtime/**"
      - "docs/architecture/overview.md"
      - "docs/phase-0-baselines.md"
      - "docs/phase-0-completion.md"
      - "docs/phase-0-spike.md"
      - "docs/roadmap.md"
      - "docs/testing/invariants.md"
      - "examples/echo-contract/**"
      - "tools/build_echo_capsule.py"
      - "tools/run_phase0_baselines.sh"
      - "tools/run_phase0_gate.sh"
      - "tools/run_phase0_spike.sh"
      - "tools/toolchain-smoke/**"
      - "tools/validate_contracts.sh"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-gate:
    name: Clean-checkout Phase 0 gate smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Run the clean-checkout Phase 0 gate
        run: make phase0-gate-smoke
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-gate-smoke-${{ github.sha }}
          path: target/phase0-gate/smoke
          if-no-files-found: warn
          retention-days: 14
