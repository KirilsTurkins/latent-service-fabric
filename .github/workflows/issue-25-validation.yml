name: Issue 25 Phase 0 completion gate

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-gate:
    name: Clean-checkout Phase 0 gate smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate independently resolves every retained source commit/tree.
          # A shallow checkout cannot establish that evidence applicability.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install checked-in evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Remove generated Zig cache from source-validation scope
        run: rm -rf .zig-cache
      - name: Run the clean-checkout Phase 0 smoke sequence
        run: |
          unset CARGO_INCREMENTAL
          make phase0-gate-smoke
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-gate-smoke-${{ github.sha }}
          path: target/phase0-gate
          if-no-files-found: warn
          retention-days: 14
