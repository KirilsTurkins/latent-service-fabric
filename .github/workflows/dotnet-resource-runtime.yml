name: Managed resource callback lifecycle

on:
  push:
    branches: ['feat/dotnet-resource-runtime-20261020']
    paths: ['.github/workflows/dotnet-resource-runtime.yml']
  workflow_dispatch:
    inputs:
      late_facilities:
        description: One fresh ordinary managed component for accepted callbacks after DisposeAsync
        type: boolean
        default: false
      replay_late_facilities:
        description: Reuse the exact completed df4 AOT package after its managed-profile reader repair
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: dotnet-resource-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resource-runtime:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.late_facilities && !inputs.replay_late_facilities) }}
    name: Signed managed resources tasks clocks entropy and logging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-dotnet@f5bcdac7f26977ef44527f837688dd86faf648ec # v6.0.0 + upstream changes + LSF security fixes
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Fetch only the immutable producer source before its verification
        run: git fetch --no-tags --depth=1 origin 77bf0e3f3b68e17342b6146abd6f2de34a3efa00
      - name: Check finite authority pending-owner and compiler-material boundaries
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_resource_runtime_fixture tools.tests.test_dotnet_resource_timer_observer tools.tests.test_dotnet_resource_runtime -v
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare the pinned compiler and small current closed-runtime adapters
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/dotnet-resource-bindgen"
          export PATH="$RUNNER_TEMP/dotnet-resource-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/dotnet-resource-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/dotnet-resource-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Authenticate the original V7 products without a native host rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/java_phase_native_products.py --output "$RUNNER_TEMP/dotnet-resource-native"
      - name: Capture one fresh offline NativeAOT component and run the joined programme
        run: |
          python3 -B tools/qualify_dotnet_resource_runtime.py \
            --native "$RUNNER_TEMP/dotnet-resource-native" --tools "$RUNNER_TEMP/dotnet-resource-tools" \
            --output "$RUNNER_TEMP/dotnet-resource-runtime"
      - name: Retain bounded public build identities and raw lifecycle outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: dotnet-resource-runtime-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dotnet-resource-native/*.json
            ${{ runner.temp }}/dotnet-resource-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/dotnet-resource-tools/runtime-inputs.json
            ${{ runner.temp }}/dotnet-resource-tools/wasi-sdk.json
            ${{ runner.temp }}/dotnet-resource-tools/logs/**
            ${{ runner.temp }}/dotnet-resource-runtime/*.json
            ${{ runner.temp }}/dotnet-resource-runtime/build/*.json
            ${{ runner.temp }}/dotnet-resource-runtime/build/component.wasm
            ${{ runner.temp }}/dotnet-resource-runtime/build/native-aot-original.wasm
            ${{ runner.temp }}/dotnet-resource-runtime/build/derived-*.dll
            ${{ runner.temp }}/dotnet-resource-runtime/build/package/**
            ${{ runner.temp }}/dotnet-resource-runtime/build/logs/**
            ${{ runner.temp }}/dotnet-resource-runtime/node/*.json
            ${{ runner.temp }}/dotnet-resource-runtime/node/node-stderr.txt
            ${{ runner.temp }}/dotnet-resource-runtime/node/commands/logs/**
            ${{ runner.temp }}/dotnet-resource-runtime/node/examples-controls/*.json
            ${{ runner.temp }}/dotnet-resource-runtime/node/foreign-controls/*.json
            ${{ runner.temp }}/dotnet-resource-runtime/node/signed/my-greeting/build-observation.json
            ${{ runner.temp }}/dotnet-resource-runtime/node/signed/release-set.json

  late-facilities:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.late_facilities && !inputs.replay_late_facilities }}
    name: Accepted managed Timer facilities after pending DisposeAsync and fresh two tenants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-dotnet@f5bcdac7f26977ef44527f837688dd86faf648ec # v6.0.0 + upstream changes + LSF security fixes
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Fetch only the immutable producer source before its verification
        run: git fetch --no-tags --depth=1 origin 6fd19eab2c224fc31481d03de5008de4d3e4429e
      - name: Check finite authority pending-owner and compiler-material boundaries
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_resource_late_facilities tools.tests.test_resource_late_workflows tools.tests.test_java_http_release_preparation tools.tests.test_dotnet_resource_runtime_fixture tools.tests.test_dotnet_resource_timer_observer tools.tests.test_dotnet_resource_runtime -v
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare the pinned compiler and small current closed-runtime adapters
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/dotnet-resource-bindgen"
          export PATH="$RUNNER_TEMP/dotnet-resource-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/dotnet-resource-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/dotnet-resource-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Authenticate the frozen 6fd products without a native host rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/dotnet-resource-native"
      - name: Check the exact ordinary callback source on the reference CLR
        run: python3 -B tools/resource_late_reference_controls.py --language dotnet --output "$RUNNER_TEMP/dotnet-resource-late-reference"
      - name: Capture one fresh offline NativeAOT component and run only late facilities
        run: |
          python3 -B tools/qualify_resource_late_facilities.py --language dotnet \
            --native "$RUNNER_TEMP/dotnet-resource-native" --tools "$RUNNER_TEMP/dotnet-resource-tools" \
            --output "$RUNNER_TEMP/dotnet-resource-late"
      - name: Retain bounded public build identities and raw lifecycle outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: dotnet-resource-late-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dotnet-resource-native/*.json
            ${{ runner.temp }}/dotnet-resource-late-reference/*.json
            ${{ runner.temp }}/dotnet-resource-late-reference/*.stdout
            ${{ runner.temp }}/dotnet-resource-late-reference/*.stderr
            ${{ runner.temp }}/dotnet-resource-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/dotnet-resource-tools/runtime-inputs.json
            ${{ runner.temp }}/dotnet-resource-tools/wasi-sdk.json
            ${{ runner.temp }}/dotnet-resource-tools/logs/**
            ${{ runner.temp }}/dotnet-resource-late/*.json
            ${{ runner.temp }}/dotnet-resource-late/build/*.json
            ${{ runner.temp }}/dotnet-resource-late/build/component.wasm
            ${{ runner.temp }}/dotnet-resource-late/build/native-aot-original.wasm
            ${{ runner.temp }}/dotnet-resource-late/build/derived-*.dll
            ${{ runner.temp }}/dotnet-resource-late/build/package/**
            ${{ runner.temp }}/dotnet-resource-late/build/logs/**
            ${{ runner.temp }}/dotnet-resource-late/node/*.json
            ${{ runner.temp }}/dotnet-resource-late/node/node-stderr.txt
            ${{ runner.temp }}/dotnet-resource-late/node/commands/logs/**
            ${{ runner.temp }}/dotnet-resource-late/node/examples-controls/*.json
            ${{ runner.temp }}/dotnet-resource-late/node/foreign-controls/*.json
            ${{ runner.temp }}/dotnet-resource-late/node/signed/my-greeting/build-observation.json
            ${{ runner.temp }}/dotnet-resource-late/node/signed/release-set.json

  replay-late-facilities:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_late_facilities && !inputs.late_facilities }}
    name: Reuse the authenticated df4 component for late managed facilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Fetch only the two immutable source objects used by authentication
        run: |
          git fetch --no-tags --depth=1 origin 6fd19eab2c224fc31481d03de5008de4d3e4429e
          git fetch --no-tags --depth=1 origin df4f5628add1a9ba9b1562ee00353fad57e4f7d5
      - name: Check the exact current reader and preserved late-callback boundaries
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_resource_runtime tools.tests.test_resource_late_facilities tools.tests.test_resource_late_workflows tools.tests.test_replay_dotnet_resource_late -v
      - name: Authenticate the same frozen 6fd products without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/dotnet-resource-late-replay-native"
      - name: Authenticate the complete failed df4 artifact and completed AOT package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/replay_dotnet_resource_late.py acquire --output "$RUNNER_TEMP/dotnet-resource-late-replay-inputs"
      - name: Sign and execute only the original two denials and four late-fresh calls
        run: |
          python3 -B tools/replay_dotnet_resource_late.py run --prepared "$RUNNER_TEMP/dotnet-resource-late-replay-inputs" \
            --native "$RUNNER_TEMP/dotnet-resource-late-replay-native" --output "$RUNNER_TEMP/dotnet-resource-late-replay"
      - name: Retain the original failure and bounded new node outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: dotnet-resource-late-replay-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dotnet-resource-late-replay-native/*.json
            ${{ runner.temp }}/dotnet-resource-late-replay-inputs/artifact.zip
            ${{ runner.temp }}/dotnet-resource-late-replay-inputs/retrieval.json
            ${{ runner.temp }}/dotnet-resource-late-replay/*.json
            ${{ runner.temp }}/dotnet-resource-late-replay/node/*.json
            ${{ runner.temp }}/dotnet-resource-late-replay/node/node-stderr.txt
            ${{ runner.temp }}/dotnet-resource-late-replay/node/commands/logs/**
            ${{ runner.temp }}/dotnet-resource-late-replay/node/examples-controls/*.json
            ${{ runner.temp }}/dotnet-resource-late-replay/node/foreign-controls/*.json
            ${{ runner.temp }}/dotnet-resource-late-replay/node/signed/my-greeting/build-observation.json
            ${{ runner.temp }}/dotnet-resource-late-replay/node/signed/release-set.json
