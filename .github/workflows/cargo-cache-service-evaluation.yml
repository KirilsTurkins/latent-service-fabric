name: Cargo cache service evaluation

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/cargo-cache-service-evaluation.yml
      - .github/workflows/cargo-cache-service-sample.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: cargo-cache-service-${{ github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  cold:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [baseline, recipe]
    uses: $/.github/workflows/cargo-cache-service-sample.yml
    with:
      kind: ${{ matrix.kind }}
      state: cold
      experiment: ${{ github.run_id }}-${{ github.run_attempt }}

  warm-1:
    needs: cold
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [baseline, recipe]
    uses: $/.github/workflows/cargo-cache-service-sample.yml
    with:
      kind: ${{ matrix.kind }}
      state: warm-1
      experiment: ${{ github.run_id }}-${{ github.run_attempt }}

  warm-2:
    needs: warm-1
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kind: [baseline, recipe]
    uses: $/.github/workflows/cargo-cache-service-sample.yml
    with:
      kind: ${{ matrix.kind }}
      state: warm-2
      experiment: ${{ github.run_id }}-${{ github.run_attempt }}

  report:
    name: Reconcile completed cache service observations
    if: always()
    needs: [cold, warm-1, warm-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389 # v8.0.2 + upstream changes + LSF security fixes
        with:
          pattern: cargo-service-*-sample-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-service-samples/
      - name: Require complete jobs, actual cache bytes and equivalent suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_cargo_service.py collect --reports "$RUNNER_TEMP/cargo-service-samples" --output "$RUNNER_TEMP/cargo-service-comparison/comparison.json"
      - name: Retain measured comparison and failed reconciliation inputs
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: cargo-service-comparison-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cargo-service-comparison/
            ${{ runner.temp }}/cargo-service-samples/
          if-no-files-found: error
          retention-days: 7
