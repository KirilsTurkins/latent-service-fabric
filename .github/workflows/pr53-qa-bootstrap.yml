name: PR 53 QA remediation bootstrap

on:
  push:
    branches:
      - feat/issue-13-shared-telemetry-inventory
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr53-qa-remediation-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/issue-13-shared-telemetry-inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-13-shared-telemetry-inventory
          fetch-depth: 0

      - name: Merge Issue 36 dependency and apply the QA remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            development \
            feat/issue-36-contract-hardening \
            feat/issue-13-shared-telemetry-inventory
          git merge --no-commit --no-ff -X theirs \
            origin/feat/issue-36-contract-hardening
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${unresolved}" ]]; then
            printf 'unresolved merge paths:\n%s\n' "${unresolved}" >&2
            exit 1
          fi
          cat .qa/pr53-remediation.b64.* \
            | tr -d '[:space:]' \
            | base64 --decode > "${RUNNER_TEMP}/pr53-remediation.zip"
          echo "825e66db11ffd41399b22f7d508abfa908c9058e3d22bea287ffdf0579989812  ${RUNNER_TEMP}/pr53-remediation.zip" \
            | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pr53-remediation"
          unzip -q "${RUNNER_TEMP}/pr53-remediation.zip" \
            -d "${RUNNER_TEMP}/pr53-remediation"
          python3 \
            "${RUNNER_TEMP}/pr53-remediation/pr53-qa-remediation/apply.py" \
            .
          python3 .qa/pr53-fixups.py
          chmod +x tools/validate_pr53_observability.sh

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.lock

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown

      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0

      - name: Normalize and validate the resulting merge tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          unset CARGO_INCREMENTAL
          tools/validate_pr53_observability.sh
          rustup toolchain install 1.94.1
          cargo +1.94.1 check --locked --all-targets --all-features \
            -p latent-telemetry \
            -p latent-node \
            -p latent-testkit \
            -p latent-wasmtime \
            -p latentd

      - name: Commit the validated remediation to PR 53
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qa/pr53-remediation.b64.* .qa/pr53-fixups.py
          rmdir .qa 2>/dev/null || true
          rm -f .github/workflows/pr53-qa-bootstrap.yml
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "remediation produced no commit" >&2
            exit 1
          fi
          git commit -m "fix: complete shared observability runtime integration"
          git push origin HEAD:refs/heads/feat/issue-13-shared-telemetry-inventory
