name: Consumer poll-factory native ownership
on:
  push:
    branches: ['feat/sdk-745-consumer-poll-factory-20261105']
    paths:
      - '.github/workflows/consumer-poll-factory.yml'
      - 'crates/vendor/wasmtime/**'
      - 'crates/latent-wasmtime/**'
      - 'tools/qualify_consumer_poll_factory.py'
      - 'tools/qualify_stream_outers.py'
      - 'tools/host_codec_wasmtime.py'
      - 'tools/ci_rust_artifacts.py'
      - 'tools/toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
permissions:
  contents: read
concurrency:
  group: consumer-poll-factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ownership:
    name: Check consumer factory admission and physical retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v3-contract-profiles
          shared-key: host-contracts
          key: ubuntu-24.04
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/wasm32-wasip2
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Run exact source-bound ownership controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_consumer_poll_factory_owner -v
          timeout --signal=TERM --kill-after=10s 2400s python3 -B tools/qualify_consumer_poll_factory.py --source-commit "${{ github.sha }}" --output "$RUNNER_TEMP/consumer-poll-factory"
      - name: Retain the finite ownership observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: consumer-poll-factory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/consumer-poll-factory/receipt.json
            ${{ runner.temp }}/consumer-poll-factory/FAILED.json
            ${{ runner.temp }}/consumer-poll-factory/source-inputs.json
            ${{ runner.temp }}/consumer-poll-factory/commands.json
            ${{ runner.temp }}/consumer-poll-factory/commands/logs/*.txt
            ${{ runner.temp }}/consumer-poll-factory/fixtures/native-stream-outers.wasm
          if-no-files-found: warn
          retention-days: 3
