name: TypeScript native security remediation
on:
  push:
    branches: [ci/typescript-security-refresh-20261113]
    paths: [.github/workflows/ts-native-security-worker.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ runner.temp }}/native-target
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 68bd53e20eeeae109f7816c8e81a1f959158a93b
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Acquire exact remediation driver and patched toolchains
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 https://raw.githubusercontent.com/KirilsTurkins/latent-service-fabric/8db5d1dc1cade8cb9645dd446631d51a140e725b/tools/ci_native_security_refresh_20261113.py -o "$RUNNER_TEMP/native-refresh.py"
          echo "74a00ed959ea2aeedd52bd33a6de72528e176fbe67678ee0acbce5f95d7ce667  $RUNNER_TEMP/native-refresh.py" | sha256sum --check --strict
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 https://dl.google.com/go/go1.27.4.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  $RUNNER_TEMP/go.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/go-original"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" --no-same-owner -C "$RUNNER_TEMP/go-original"
          echo "$RUNNER_TEMP/go-original/go/bin" >> "$GITHUB_PATH"
          echo "LSF_VERIFIED_GOROOT=$RUNNER_TEMP/go-original/go" >> "$GITHUB_ENV"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 240 https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.428/dotnet-sdk-8.0.428-linux-x64.tar.gz -o "$RUNNER_TEMP/dotnet.tar.gz"
          echo "33212bb99a2bf003973d41106c7e8fe94208a12958ff601d4a476be379403c85a7dc9183a6ec64dfb44ded7102965be09f35add1758e68e9251bae7891d7b7bf  $RUNNER_TEMP/dotnet.tar.gz" | sha512sum --check --strict
          mkdir "$RUNNER_TEMP/dotnet"
          tar -xzf "$RUNNER_TEMP/dotnet.tar.gz" --no-same-owner -C "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install -r tools/requirements.lock
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: Resolve narrow security updates and refresh authenticated postimages
        run: python "$RUNNER_TEMP/native-refresh.py" prepare
      - name: Verify unchanged scheduler source preimages in Go 1.27.4
        run: |
          python - <<'PY'
          import os, pathlib
          from tools.go_guest.runtime import prepare_compiler
          source=pathlib.Path(os.environ['LSF_VERIFIED_GOROOT'])
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'go-async-verified'
          prepare_compiler(source,output)
          print('Actual Go 1.27.4 archive passed every selected scheduler preimage and postimage check.')
          PY
      - name: Execute source, host, SDK, compiler and native library controls
        run: python "$RUNNER_TEMP/native-refresh.py" validate
      - name: Capture precise candidate even on validation refusal
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-security-evidence';out.mkdir(exist_ok=True)
          patch=subprocess.check_output(['git','diff','--binary','--full-index'])
          (out/'patch.patch').write_bytes(patch)
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          with tarfile.open(out/'changed-files.tar.gz','w:gz') as archive:
            for name in paths:
              if (root/name).is_file():archive.add(root/name,arcname=name,recursive=False)
          identities={name:{'sha256':hashlib.sha256((root/name).read_bytes()).hexdigest(),'bytes':(root/name).stat().st_size} for name in paths if (root/name).is_file()}
          (out/'postimages.json').write_text(json.dumps(identities,indent=2)+'\n')
          print('Captured',len(paths),'changed paths; no branch refs changed.')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: native-security-candidate
          path: ${{ runner.temp }}/native-security-evidence/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
  actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect fresh action build receipts from public maintained forks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'action-results';root.mkdir()
          results=[]
          for role in ['cache','deploy-pages','download-artifact','rust-cache','setup-dotnet','setup-go','setup-java','setup-node','setup-python','setup-zig','upload-artifact']:
            repo='KirilsTurkins/lsf-'+role
            result={'role':role,'repository':repo}
            try:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?branch=fix%2Ffastxml-20261113&per_page=5'],text=True))
              runs=[r for r in data['workflow_runs'] if r['path']=='.github/workflows/lsf-fastxml-refresh.yml']
              run=runs[0];result.update(run=run['id'],head=run['head_sha'],status=run['status'],conclusion=run['conclusion'])
              jobs=json.loads(subprocess.check_output(['gh','api',run['jobs_url']],text=True));result['jobs']=[{'id':j['id'],'name':j['name'],'conclusion':j['conclusion']} for j in jobs['jobs']]
              artifacts=json.loads(subprocess.check_output(['gh','api',run['artifacts_url']],text=True));result['artifacts']=artifacts['artifacts']
              for artifact in artifacts['artifacts']:
                if artifact['name']=='action-security-'+role:
                  target=root/(role+'.zip')
                  with target.open('wb') as out:subprocess.run(['gh','api',artifact['archive_download_url']],stdout=out,check=True)
            except Exception as error:result['captureError']=str(error)
            results.append(result)
          (root/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps([{k:v for k,v in r.items() if k!='artifacts'} for r in results],indent=2))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: action-security-collected
          path: ${{ runner.temp }}/action-results/
          retention-days: 7
          if-no-files-found: error
