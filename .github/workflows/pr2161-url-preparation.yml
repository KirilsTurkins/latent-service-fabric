name: PR 2161 URL dependency preparation
on:
  push:
    branches: ['chore/pr2161-url-preparation-20261122']
    paths: ['.github/workflows/pr2161-url-preparation.yml']
permissions:
  contents: read
concurrency:
  group: pr2161-url-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/chore/pr2161-url-preparation-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + LSF fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + LSF fixes
        with:
          python-version: '3.13.5'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          toolchain: '1.97.1'
          components: clippy,rustfmt
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Authenticate the exact candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/url-preparation"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'Cargo.lock': '091ae7ccf48cad8e26aab20175323acb2dd93f354bdab14a59b80c81aee40978',
              'crates/latent-http/Cargo.toml': '6b7ba1352a314d1da2bbf6cb6027ee87adb2f1876a65367ab69cff011b8e0e3d',
              'crates/latent-http/src/tests/validation.rs': '2894f7310bed92d03b36113c38d65de9f36ae842866824500b728e949999fb3b',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Resolve only the patched URL package with pinned Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo update --package url --precise 2.5.9 2>&1 | tee "$RUNNER_TEMP/url-preparation/cargo-update.log"
          cp Cargo.lock "$RUNNER_TEMP/url-preparation/Cargo.lock"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, tomllib
          before = tomllib.loads(subprocess.check_output(['git', 'show', 'HEAD:Cargo.lock'], text=True))
          raw = Path('Cargo.lock').read_bytes()
          after = tomllib.loads(raw.decode())
          old = {p['name'] + '@' + p['version']: p for p in before['package']}
          new = {p['name'] + '@' + p['version']: p for p in after['package']}
          assert len(before['package']) == len(after['package'])
          assert set(old) - set(new) == {'url@2.5.8', 'form_urlencoded@1.2.2'}
          assert set(new) - set(old) == {'url@2.5.9', 'form_urlencoded@1.2.3'}
          for key in set(old) & set(new):
              assert old[key] == new[key], key
          assert new['url@2.5.9']['checksum'] == 'f00cd2407bb42c0ef17be88d4cf020f5cceffd121665bac9b8b9493a369b3b1a'
          assert new['form_urlencoded@1.2.3']['checksum'] == 'afa489199eaffb1211795df1c6236ce1ad0d41a6fa45250add73e3b02420f06e'
          for name, previous, current in (('url', '2.5.8', '2.5.9'), ('form_urlencoded', '1.2.2', '1.2.3')):
              expected = dict(old[name + '@' + previous])
              expected.update(version=current, checksum=new[name + '@' + current]['checksum'])
              assert expected == new[name + '@' + current], name
          digest = hashlib.sha256(raw).hexdigest()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          report = {'source': os.environ['GITHUB_SHA'], 'sha256': digest, 'gitBlob': blob, 'bytes': len(raw), 'packages': len(after['package'])}
          Path(os.environ['RUNNER_TEMP'], 'url-preparation', 'lock-identity.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          assert digest == '60508c03d66494b72ce74b5c4fea903b7cd2bbc61d9162b50e3d1d3c10f3ecc5'
          assert blob == 'acfbd75288fd28e0d567e7bf1bdf3c55a23ff6d4'
          PY
      - name: Check formatting and execute actual HTTP provider unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package latent-http -- --check 2>&1 | tee "$RUNNER_TEMP/url-preparation/fmt.log"
          cargo test --locked --package latent-http --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/url-preparation/http-tests.log"
          git diff --check
          test "$(git diff --name-only)" = Cargo.lock
      - name: Retain generated lock and native execution evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + LSF fixes
        with:
          name: pr2161-url-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/url-preparation/
          if-no-files-found: error
          retention-days: 7
  store-reviewed-blob:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389 # pinned LSF artifact reader
        with:
          name: pr2161-url-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/url-preparation
      - name: Authenticate data and store only its Git blob without changing refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/url-preparation"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          raw = Path('Cargo.lock').read_bytes()
          assert len(raw) == 113076
          assert hashlib.sha256(raw).hexdigest() == '60508c03d66494b72ce74b5c4fea903b7cd2bbc61d9162b50e3d1d3c10f3ecc5'
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == 'acfbd75288fd28e0d567e7bf1bdf3c55a23ff6d4'
          Path('payload.json').write_text(json.dumps({'content': raw.decode('utf-8'), 'encoding': 'utf-8'}))
          PY
          gh api --method POST repos/KirilsTurkins/latent-service-fabric/git/blobs --input payload.json > blob.json
          unset GH_TOKEN
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('blob.json').read_text())
          assert result['sha'] == 'acfbd75288fd28e0d567e7bf1bdf3c55a23ff6d4'
          print(json.dumps({'storedBlob': result['sha'], 'refsChanged': False}))
          PY
