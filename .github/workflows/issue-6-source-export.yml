name: Issue 6 source export

on:
  push:
    branches:
      - feat/issue-6-resource-budget-accounting
    paths:
      - .github/workflows/issue-6-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package source checkout
        run: tar --exclude=.git -czf /tmp/lsf-issue6-source.tgz .
      - name: Upload source checkout
        uses: actions/upload-artifact@v4
        with:
          name: lsf-issue6-source-${{ github.sha }}
          path: /tmp/lsf-issue6-source.tgz
          if-no-files-found: error
          retention-days: 1
