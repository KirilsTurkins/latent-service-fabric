name: Consumer inner-future original failure report
on:
  push:
    branches: ['diag/sdk-745-consumer-failure-20261105']
    paths:
      - '.github/workflows/consumer-inner-future-failure-report.yml'
      - 'tools/report_consumer_inner_failure.py'
permissions:
  actions: read
  contents: read
concurrency:
  group: consumer-inner-future-original-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    name: Inspect original source-bound owner failure
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Report bounded original failure evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/report_consumer_inner_failure.py ]; then
            echo '::error title=Original failure reporter::stage=checkout-unavailable'
            exit 1
          fi
          set +e
          timeout --signal=TERM --kill-after=5s 180s python3 -B tools/report_consumer_inner_failure.py
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo '::error title=Original failure reporter::stage=timeout'
          fi
          exit "$status"
