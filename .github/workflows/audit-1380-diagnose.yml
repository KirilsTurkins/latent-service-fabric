name: PR 1380 secondary qualification diagnosis
on:
  push:
    branches: [ci/audit-1380-diagnose-f1dd3bc]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read bounded error context from the three original failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,urllib.request,urllib.error
          base='https://api.github.com/repos/KirilsTurkins/latent-service-fabric'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'lsf-ci-diagnosis'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          for job in (120980289873,120992103528,120980289348):
              request=urllib.request.Request(base+'/actions/jobs/'+str(job)+'/logs',headers=headers)
              try:
                  response=urllib.request.build_opener(NoRedirect).open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  assert error.code in (301,302,303,307,308)
                  location=error.headers['Location'];assert location.startswith('https://')
                  response=urllib.request.urlopen(location,timeout=30)
              with response: data=response.read(32*1024*1024+1)
              assert len(data)<=32*1024*1024
              lines=re.sub(r'\x1b\[[0-9;]*m','',data.decode('utf-8-sig')).splitlines()
              hits=[i for i,line in enumerate(lines) if re.search(r'panicked at|FAIL:|test .*FAILED|error\[|error:|\[error\]|failed:|Error:|Traceback',line)]
              positions=sorted({n for i in hits[-8:] for n in range(max(0,i-4),min(len(lines),i+14))})
              text='\n'.join(lines[i] for i in positions)
              print('JOB',job,'\n'+text[-20000:],flush=True)
          PY
