name: PR 1380 inventory repair validation
on:
  push:
    branches: [ci/audit-1380-diagnose-f1dd3bc]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - name: Select exact feature source and prepare reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          cp .github/maintenance/audit-1380-inventory-repair.py "$RUNNER_TEMP/repair.py"
          git fetch --no-tags --depth=1 origin f1dd3bc1c6ed68d2b4e5a0ed0c75d8bcf3e7f588
          git checkout --detach f1dd3bc1c6ed68d2b4e5a0ed0c75d8bcf3e7f588
          python3 -m pip install --requirement tools/requirements.lock
          python3 "$RUNNER_TEMP/repair.py"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: false
      - name: Commit exact candidate and check Python consumers and contracts
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 apps/latentd/tests/standalone_node/startup.rs
          git diff --check
          git config user.name 'LSF CI repair'
          git config user.email 'ci-repair@users.noreply.github.com'
          git add apps/latentd/tests/standalone_node/startup.rs tools/phase2_gate_resource_profile.py tools/tests/test_phase2_gate_resource.py tools/ci/contracts/python/test_phase2_gate_resource.py.json
          git commit -m 'fix(audit): qualify the explicit journal topology without weakening inventory bounds'
          echo "INVENTORY_CANDIDATE=$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/audit-inventory"
          python3 -m unittest discover -s tools/tests -p 'test_phase2_gate*.py' > "$RUNNER_TEMP/audit-inventory/python.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-inventory/python.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/audit-inventory/python.log"
          python3 -m unittest tools.tests.test_ci_contracts tools.tests.test_build_source_capacity > "$RUNNER_TEMP/audit-inventory/contracts.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-inventory/contracts.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/audit-inventory/contracts.log"
          python3 tools/ci_coverage.py --receipt target/ci/audit-inventory-coverage.json
          cp target/ci/audit-inventory-coverage.json "$RUNNER_TEMP/audit-inventory/coverage.json"
      - name: Preserve candidate after Python and contract checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = f1dd3bc1c6ed68d2b4e5a0ed0c75d8bcf3e7f588
          test -z "$(git status --porcelain --untracked-files=normal)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/ci/audit-1380-inventory-f1dd3bc
          unset auth GH_TOKEN
          git show --stat --oneline HEAD
          git diff HEAD^ HEAD > "$RUNNER_TEMP/audit-inventory/repair.patch"
      - name: Run the exact failing real node startup and restart test
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p latentd --test standalone_node --all-features --locked listener_authentication_inventory_restart_and_clean_shutdown -- --exact --nocapture > "$RUNNER_TEMP/audit-inventory/startup.log" 2>&1 || { tail -100 "$RUNNER_TEMP/audit-inventory/startup.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/audit-inventory/startup.log"
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audit-1380-inventory-validation
          path: ${{ runner.temp }}/audit-inventory/
          retention-days: 7
          if-no-files-found: warn
