name: Cargo cache service sample

on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      state:
        required: true
        type: string
      experiment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sample:
    name: Cache sample (${{ inputs.kind }} / ${{ inputs.state }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      LSF_REQUIRE_NATIVE_PROCESS_TESTS: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.kind == 'recipe' && '1' || '0' }}
      CARGO_PROFILE_TEST_DEBUG: ${{ inputs.kind == 'recipe' && '1' || '0' }}
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Reclaim unused Android SDK space for Cargo evaluation
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          unused_android=/usr/local/lib/android
          if [[ -d "$unused_android" && ! -L "$unused_android" && "$(realpath -e -- "$unused_android")" == "$unused_android" ]]; then
            sudo rm -rf --one-file-system -- "$unused_android"
          fi
          df -h "$RUNNER_TEMP"
      - name: Install pinned prerequisites
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fish
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Identify isolated experimental namespace
        id: identity
        env:
          KIND: ${{ inputs.kind }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: python3 tools/ci_cargo_service.py identity --kind "$KIND" --experiment "$EXPERIMENT" --output "$RUNNER_TEMP/cargo-service/identity.json" --github-output "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        id: dependencies
        uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: ${{ steps.identity.outputs.prefix }}
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-provider: github
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && inputs.state == 'cold' }}
      - name: Install the pinned stream fixture compiler
        uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Prepare the fixed native stream component fixture
        id: stream_outer_fixture
        run: |
          set -euo pipefail
          python3 -c 'import tomllib; assert tomllib.load(open("tools/toolchain.toml", "rb"))["contracts"]["wasm-tools"] == "1.254.0"'
          wasm-tools --version | grep -E '^wasm-tools 1[.]254[.]0([[:space:]]|$)'
          wat=crates/latent-wasmtime/src/host/native-stream-outers.wat
          test -f "$wat" && test ! -L "$wat"
          git cat-file blob "${GITHUB_SHA}:$wat" | cmp - "$wat"
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/lsf-stream-outers.XXXXXXXX")"
          wasm-tools parse "$wat" -o "$fixture_dir/native-stream-outers.wasm"
          python3 - "$fixture_dir/native-stream-outers.wasm" <<'PY'
          import os
          from pathlib import Path
          import sys
          from tools.qualify_stream_outers import FIXTURE_ENV, WAT, fixture_identity

          assert WAT == 'crates/latent-wasmtime/src/host/native-stream-outers.wat'
          assert FIXTURE_ENV == 'LSF_TEST_STREAM_OUTERS_COMPONENT'
          fixture = Path(sys.argv[1])
          print('Fixed stream component:', fixture_identity(fixture))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={fixture}\n')
          PY

      - name: Execute every reviewed Cargo invocation
        env:
          LSF_TEST_STREAM_OUTERS_COMPONENT: ${{ steps.stream_outer_fixture.outputs.path }}
          CONFIGURATION: ${{ steps.identity.outputs.configuration }}
          SAMPLE_STATE: ${{ inputs.state }}
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit || 'false' }}
        run: python3 tools/ci_cargo_evaluate.py --disposable-checkout --configuration "$CONFIGURATION" --service-state "$SAMPLE_STATE" --service-hit "$CACHE_HIT" --output "$RUNNER_TEMP/cargo-service/recipes"
      - name: Seal completed single sample
        run: python3 tools/ci_cargo_service.py sample-report --identity "$RUNNER_TEMP/cargo-service/identity.json" --evaluation "$RUNNER_TEMP/cargo-service/recipes/evaluation.json" --output "$RUNNER_TEMP/cargo-service/service-sample.json"
      - name: Retain original recipe observations including failed attempts
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: cargo-service-${{ inputs.kind }}-${{ inputs.state }}-recipes-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-service/
          if-no-files-found: error
          retention-days: 7
      - name: Retain completed sample for read-only comparison
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: cargo-service-${{ inputs.kind }}-${{ inputs.state }}-sample-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cargo-service/service-sample.json
          if-no-files-found: error
          retention-days: 7
