name: PR 700 npm bundle qualification
on:
  push:
    branches: [fix/pr700-npm-bundle-qualification-20260930]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Run the pinned qualification recipe with the fully patched brace release
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', 'e5ab04674c363802550f683aa2678f209c635b15:.github/workflows/pr700-bundle-qualification.yml'], text=True)
          begin = source.index('          set -euo pipefail\n')
          end = source.index('      - uses: actions/upload-artifact@', begin)
          script = textwrap.dedent(source[begin:end])
          assert script.count('5.0.11') == 4
          script = script.replace('5.0.11', '5.0.12')
          script = script.replace("['{' + '{a},'.repeat(7000)", "['{a}' + '}'.repeat(128000) + ',z}', '{' + '{a},'.repeat(7000)")
          subprocess.run(['bash', '-euo', 'pipefail'], input=script, text=True, check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr700-qualified-npm-bundle
          path: ${{ runner.temp }}/pr700-candidate
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
