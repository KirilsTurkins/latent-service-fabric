name: PR 700 npm bundle qualification
on:
  push:
    branches: [fix/pr700-npm-bundle-qualification-20260930]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5ab04674c363802550f683aa2678f209c635b15
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.5
      - name: Install the reviewed scanner prerequisite
        run: python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/security/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Qualify the exact existing graph and fully patched bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, textwrap
          source = subprocess.check_output(['git', 'show', 'e5ab04674c363802550f683aa2678f209c635b15:.github/workflows/pr700-bundle-qualification.yml'], text=True)
          begin = source.index('          set -euo pipefail\n')
          end = source.index('      - uses: actions/upload-artifact@', begin)
          script = textwrap.dedent(source[begin:end])
          assert script.count('5.0.11') == 4
          script = script.replace('5.0.11', '5.0.12')
          script = re.sub(r'(?<!\^)4\.0\.2', '4.0.4', script)
          script = script.replace("['{' + '{a},'.repeat(7000)", "['{a}' + '}'.repeat(128000) + ',z}', '{' + '{a},'.repeat(7000)")
          before = "subprocess.run(['npm', 'install', '--package-lock-only'"
          assert script.count(before) == 1
          script = script.replace(before, "old_lock = json.loads((here / 'package-lock.json').read_text())\n(here / 'package-lock.json').unlink()\n" + before)
          before = "assert lock['packages']['node_modules/npm']['integrity'] == actual"
          after = before + "\nassert set(lock['packages']) == set(old_lock['packages']), 'bundled graph membership drift'\n"
          after += "for path, row in old_lock['packages'].items():\n"
          after += "    if path not in {'node_modules/npm', 'node_modules/npm/node_modules/ip-address', 'node_modules/npm/node_modules/brace-expansion'}:\n"
          after += "        assert lock['packages'][path] == row, ('unrelated bundled package changed', path)"
          assert script.count(before) == 1
          script = script.replace(before, after)
          subprocess.run(['bash', '-euo', 'pipefail'], input=script, text=True, check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr700-qualified-npm-bundle
          path: ${{ runner.temp }}/pr700-candidate
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  stage-objects:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Retrieve only this run's qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: KirilsTurkins/latent-service-fabric
        run: gh run download "$GITHUB_RUN_ID" --name pr700-qualified-npm-bundle --dir "$RUNNER_TEMP/candidate"
      - name: Stage five verified blobs and a tree without committing or updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate'
          allowed = ['website/toolchain/source.json', 'website/toolchain/prepare.py', 'website/toolchain/tests/test_prepare.py', 'website/toolchain/package-lock.json', '.github/security/inventory.json']
          assert json.loads((root / 'manifest.json').read_text()) == allowed
          assert {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()} == set(allowed) | {'manifest.json', 'changes.patch'}
          payloads = {}
          for name in allowed:
              path = root / name
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size < 131072
              payloads[name] = path.read_bytes()
              payloads[name].decode('utf-8')
          policy = json.loads(payloads['.github/security/inventory.json'])
          profile = next(row['derived_bundle'] for row in policy['manifests'] if row['path'] == 'website/toolchain/package.json')
          for field, name in [('source_sha256', allowed[0]), ('builder_sha256', allowed[1]), ('lock_sha256', allowed[3])]:
              assert hashlib.sha256(payloads[name].replace(b'\r\n', b'\n')).hexdigest() == profile[field]
          expected = 'sha512-ySSFxdQfhW9AgEREi1eqjw13uObuDcOWUyUv8O3dCVnUjBxMQVkroPAdz3Cq0wWWiWxr/VyVuzrMI5h7GDKlXQ=='
          assert profile['integrity'] == expected
          lock = json.loads(payloads[allowed[3]])
          assert lock['packages']['node_modules/npm']['integrity'] == expected
          assert lock['packages']['node_modules/npm/node_modules/ip-address']['version'] == '10.7.1'
          assert lock['packages']['node_modules/npm/node_modules/brace-expansion']['version'] == '5.0.12'
          api = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('API redirect rejected')
          opener = urllib.request.build_opener(NoRedirect())
          def request(path, value=None):
              body = None if value is None else json.dumps(value).encode()
              req = urllib.request.Request(api + path, data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with opener.open(req, timeout=30) as response:
                  raw = response.read(8 * 1024 * 1024 + 1)
              assert len(raw) <= 8 * 1024 * 1024
              return json.loads(raw)
          base = '2af2e8ba26c779dc74ed57ce9063769cdb7d8975'
          tree = request('/git/trees/' + base + '?recursive=1')
          assert not tree.get('truncated')
          entries = {row['path']: row for row in tree['tree']}
          changes = []
          for name in allowed:
              raw = payloads[name]
              original = entries[name]
              assert original['type'] == 'blob' and original['mode'] in {'100644', '100755'}
              result = request('/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              expected_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert result['sha'] == expected_sha
              changes.append({'path': name, 'mode': original['mode'], 'type': 'blob', 'sha': expected_sha})
          staged = request('/git/trees', {'base_tree': base, 'tree': changes})
          summary = {'base_commit': '35ca8628f011264d47bae957a7286fffb020cda9', 'tree': staged['sha'], 'files': changes, 'qualified_run': os.environ['GITHUB_RUN_ID']}
          print('QUALIFIED_GIT_OBJECTS ' + json.dumps(summary, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Qualified immutable Git objects; no commit or branch update performed.\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
