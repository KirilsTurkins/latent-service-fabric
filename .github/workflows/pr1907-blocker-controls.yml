name: PR 1907 blocker controls
on:
  push:
    branches: [ci/pr1907-blocker-controls-20261115]
permissions:
  contents: read
jobs:
  operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: b5e25076abc98c6a57f7078bdc335a5e916c5851
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt,clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - name: Instrument only resource-error hashes in the isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/latent-wire/src/management/errors.rs')
          s=p.read_text()
          needle='pub(super) fn platform_status(error: PlatformError, limits: &ManagementLimits) -> Status {\n'
          assert s.count(needle)==1
          extra='''    if error.code == PlatformErrorCode::ResourceExhausted {
                  use std::io::Write;
                  let hash = error.message.bytes().fold(14695981039346656037_u64,
                      |hash, byte| (hash ^ u64::from(byte)).wrapping_mul(1099511628211));
                  if let Ok(mut file) = std::fs::OpenOptions::new().create(true).append(true).open("/tmp/pr1907-resource-codes") {
                      let _ = writeln!(file, "{hash}");
                  }
              }
          '''
          p.write_text(s.replace(needle,needle+extra))
          PY
      - name: Build with original limits and explicit operator fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --all-features -p latent -p latentd
          LSF_OPERATOR_FIXTURE_ROOT="$RUNNER_TEMP/operator-inputs" cargo test --locked --all-features -p latent-policy --lib supply_chain::tests::support::operator_fixture::export_operator_workflow_fixture -- --exact --ignored
          test -d "$RUNNER_TEMP/operator-inputs"
          docker pull ghcr.io/project-zot/zot-minimal-linux-amd64@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
      - name: Reproduce and match hashes only to repository literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import contextlib,io,json,os,re,subprocess,sys
          from pathlib import Path
          from tools import run_phase2_operator_workflow as workflow
          def fnv(value):
              h=14695981039346656037
              for byte in value.encode(): h=((h^byte)*1099511628211)&((1<<64)-1)
              return h
          source={}
          for name in subprocess.check_output(['git','ls-files','*.rs'],text=True).splitlines():
              for num,line in enumerate(Path(name).read_text().splitlines(),1):
                  for literal in re.findall(r'"([^"\\]*)"',line):
                      source.setdefault(fnv(literal),[]).append((name,num,literal))
          path=Path('/tmp/pr1907-resource-codes')
          for attempt in range(6):
              path.unlink(missing_ok=True)
              sys.argv=['run_phase2_operator_workflow.py','--cli',str(Path('target/debug/latent').resolve()),'--node',str(Path('target/debug/latentd').resolve()),'--fixture-root',os.environ['RUNNER_TEMP']+'/operator-inputs','--source-commit','b5e25076abc98c6a57f7078bdc335a5e916c5851']
              out=io.StringIO()
              with contextlib.redirect_stdout(out): status=workflow.main()
              receipt=json.loads(out.getvalue())
              print('ATTEMPT',attempt,'EXIT',status,'RECEIPT',json.dumps(receipt),flush=True)
              if path.exists():
                  for value in path.read_text().splitlines():
                      print('STATIC_RESOURCE_REASON',json.dumps(source.get(int(value), [('unmatched',0,value)])),flush=True)
          PY
