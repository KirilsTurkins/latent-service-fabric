name: C project qualification workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-projects.yml]
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - name: Install pinned validation dependencies
        run: python3 -m pip install PyYAML==6.0.2 jsonschema==4.25.1
      - name: Apply reviewed final C integration
        run: |
          test "$GITHUB_REF" = refs/heads/feat/545-c-capsule-authoring
          python3 -m tools.c_guest._final_corrections
          python3 -m tools.c_guest._final_integration
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sdk/c-guest/tests/containment/component.c')
          text = p.read_text()
          old = '__asm__ volatile("" : : "r"(bytes) : "memory");'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '__asm__ volatile("" ::: "memory");'))
          PY
          python3 -m unittest tools.tests.test_c_guest_authoring tools.tests.test_ci_coverage
          python3 tools/ci_suite_inventory.py
          python3 tools/validate_repository.py
          python3 tools/validate_foundation.py
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: c-guest-authoring-runtime
          cache-on-failure: true
      - name: Format actual Rust integration
        run: cargo fmt --all
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.16.0"
      - name: Install verified guest binding generator
        run: python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
      - name: Qualify ownership teaching projects and containment capsule
        run: python3 -m tools.c_guest.qualify --output "$RUNNER_TEMP/c-projects" --update-bindings
      - name: Diagnose only authored containment C source
        if: failure()
        run: |
          d="$RUNNER_TEMP/c-projects/build-containment/compiled/bindings"
          if test -f "$d/probe.h"; then
            timeout 120 zig cc -std=c11 -target wasm32-wasi -Wall -Wextra -Werror -fsyntax-only -I "$d" -I sdk/c-guest/include sdk/c-guest/tests/containment/component.c
          fi
      - name: Commit reviewed complete source and normal CI integration
        run: |
          test "$GITHUB_REF" = refs/heads/feat/545-c-capsule-authoring
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/c-guest tools/c_guest tools/tests/test_c_guest_authoring.py tools/validate_contracts.sh tools/ci/suites.json tools/ci/commands.json crates/latent-wasmtime/tests/c_guest_authoring.rs docs/component-development docs/reference/build-provenance.md .github/workflows/c-guest-authoring-bootstrap.yml .github/workflows/c-guest-authoring-projects.yml
          git diff --cached --stat
          git commit -m 'feat(c-guest): complete required source-to-node qualification and ownership gates'
          git push origin HEAD:refs/heads/feat/545-c-capsule-authoring
      - name: Build current CLI and node
        run: cargo build -p latent -p latentd --all-features --locked
      - name: Export independently signed current authored packages
        env:
          LSF_C_AUTHORING_BUILD_ROOT: ${{ runner.temp }}/c-projects
          LSF_C_AUTHORING_FIXTURE_ROOT: ${{ runner.temp }}/c-fixture
        run: cargo test --locked -p latent-wasmtime --test c_guest_authoring -- --ignored --nocapture
      - name: Execute real node fault recovery fresh state and cleanup
        run: python3 -m tools.c_guest.node --cli "$PWD/target/debug/latent" --node "$PWD/target/debug/latentd" --fixture "$RUNNER_TEMP/c-fixture" --output "$RUNNER_TEMP/c-node"
      - name: Verify Rust formatting and strict lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p latent-wasmtime --test c_guest_authoring -- -D warnings
      - name: Verify registered Python suite
        run: python3 -m unittest discover -s tools/tests
      - name: Retain completed qualification and scoped node measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c-authoring-final-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-projects/qualification.json
            ${{ runner.temp }}/c-node/receipt.json
          if-no-files-found: warn
          retention-days: 7
