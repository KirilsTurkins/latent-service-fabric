name: TypeScript cleanup continuation inputs
on:
  push:
    branches: [fix/typescript-745-activation-resource-ownership]
    paths: [.github/workflows/typescript-cleanup-source.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/fix/typescript-745-activation-resource-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - name: Acquire unchanged locked dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path crates/vendor/wasmtime/Cargo.toml --locked
          git diff --exit-code -- crates/vendor/wasmtime/Cargo.lock Cargo.lock
          mkdir -p "$RUNNER_TEMP/decommit-inputs"
          tar -czf "$RUNNER_TEMP/decommit-inputs/registry.tar.gz" -C "$CARGO_HOME" registry/cache registry/index
          git rev-parse HEAD > "$RUNNER_TEMP/decommit-inputs/source-head.txt"
          sha256sum crates/vendor/wasmtime/Cargo.lock Cargo.lock > "$RUNNER_TEMP/decommit-inputs/locks.sha256"
          rustc --version --verbose > "$RUNNER_TEMP/decommit-inputs/rustc.txt"
          cd "$RUNNER_TEMP/decommit-inputs"
          sha256sum registry.tar.gz > SHA256SUMS
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: typescript-decommit-registry-${{ github.sha }}
          path: ${{ runner.temp }}/decommit-inputs/
          retention-days: 3
          if-no-files-found: error
