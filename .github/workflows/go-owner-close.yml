name: Go shared owner concurrent close control
on:
  push:
    branches: ['diag/go-owner-close-20261105']
permissions:
  contents: read
concurrency:
  group: go-owner-close-${{ github.ref }}
  cancel-in-progress: false
jobs:
  alias-close:
    name: Concurrent aliases keep one destructor
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GO111MODULE: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-go@3f9b437aa6b8f8b1f8c7d851365be125c6b21d9e # v7.0.0 + upstream changes + LSF security fixes
        with:
          go-version: 1.27.3
          cache: false
      - name: Check ordinary concurrent close and the existing ownership contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-owner-close"
          sha256sum sdk/go-guest/ownership/owner.go sdk/go-guest/ownership/owner_test.go > "$RUNNER_TEMP/go-owner-close/source.sha256"
          go version | tee "$RUNNER_TEMP/go-owner-close/go-version.log"
          go test -race -count=1 -v ./sdk/go-guest/ownership 2>&1 | tee "$RUNNER_TEMP/go-owner-close/owner-tests.log"
          grep -F -- '--- PASS: TestConcurrentAliasCloseIsIdempotent' "$RUNNER_TEMP/go-owner-close/owner-tests.log"
          sha256sum --check --strict "$RUNNER_TEMP/go-owner-close/source.sha256"
      - name: Retain bounded native-control evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-owner-close-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/go-owner-close/*
