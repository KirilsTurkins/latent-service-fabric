name: Authenticated fixed kernel bank reclamation
on:
  push:
    branches: ['feat/kernel-bank-reclamation-20261025']
    paths:
      - '.github/workflows/stream-kernel-bank-vm.yml'
      - 'crates/latent-streams/**'
      - 'crates/latent-stream-factory-native/**'
      - 'crates/latent-capabilities/src/broker/pools/**'
      - 'tools/*host_stream_kernel*'
      - 'tools/tests/test_kernel_bank_reclamation_vm.py'
      - 'tools/ci/suites.d/kernel-bank-reclamation-vm.json'
permissions:
  contents: read
concurrency:
  group: stream-kernel-bank-vm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-bank:
    name: Twenty native controls and one bank consumer on the qualified kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04-kernel-bank
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: false
      - name: Check closed image selection and bank observation refusal controls
        run: python3 -B -m unittest tools.tests.test_kernel_bank_reclamation_vm -v
      - name: Install only the normal static linker and isolated emulator prerequisites
        run: |
          sudo timeout --signal=TERM --kill-after=30s 180s apt-get update
          sudo timeout --signal=TERM --kill-after=30s 900s apt-get install --yes --no-install-recommends gcc libc6-dev qemu-system-x86 seabios
      - name: Reuse the authenticated kernel and execute one new bank consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_bank_vm.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/stream-kernel-bank-vm"
      - name: Retain actual current consumer and unchanged kernel provenance
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-kernel-bank-vm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-bank-vm/receipt.json
            ${{ runner.temp }}/stream-kernel-bank-vm/FAILED.json
            ${{ runner.temp }}/stream-kernel-bank-vm/commands.json
            ${{ runner.temp }}/stream-kernel-bank-vm/source-inputs.json
            ${{ runner.temp }}/stream-kernel-bank-vm/native-init
            ${{ runner.temp }}/stream-kernel-bank-vm/bank-consumer-initramfs.cpio
            ${{ runner.temp }}/stream-kernel-bank-vm/kernel/origin.json
            ${{ runner.temp }}/stream-kernel-bank-vm/kernel/qualified-observation-image.zip
            ${{ runner.temp }}/stream-kernel-bank-vm/commands/logs/*.txt
          if-no-files-found: warn
          retention-days: 3
