name: Apply issue 6 reservation report fix

on:
  push:
    branches:
      - feat/issue-6-resource-budget-accounting
    paths:
      - .github/workflows/issue-6-reservation-report-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-6-resource-budget-accounting
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Apply accounting correction and regressions
