name: Apply issue 6 reservation report fix

on:
  push:
    branches:
      - feat/issue-6-resource-budget-accounting
    paths:
      - .github/workflows/issue-6-reservation-report-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-6-resource-budget-accounting
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt

      - name: Apply accounting correction and regressions
        env:
          PATCH_B64: 
        run: |
          python -c 'import base64, os, zlib; exec(zlib.decompress(base64.b64decode(os.environ["PATCH_B64"])).decode())'
          rm .github/workflows/issue-6-reservation-report-fix.yml

      - name: Format
        run: cargo fmt --all

      - name: Check focused crates
        run: cargo check -p latent-core -p latent-node --all-targets --locked

      - name: Clippy focused crates
        run: cargo clippy -p latent-core -p latent-node --all-targets --locked -- -D warnings

      - name: Test focused crates
        run: cargo test -p latent-core -p latent-node --all-targets --locked

      - name: Validate patch cleanliness
        run: |
          cargo fmt --all -- --check
          git diff --check
          test ! -e .github/workflows/issue-6-reservation-report-fix.yml

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latent-core/src/budget.rs \
                  crates/latent-node/src/budgeted_activation.rs \
                  docs/runtime/resource-budgets.md \
                  .github/workflows/issue-6-reservation-report-fix.yml
          git commit -m "fix: separate reservations from terminal reports"
          git push origin HEAD:feat/issue-6-resource-budget-accounting
