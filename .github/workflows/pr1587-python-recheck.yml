name: PR 1587 Python recheck
on:
  push:
    branches: [diag/dotnet-original-v3-trap-20261031]
    paths: [.github/workflows/pr1587-python-recheck.yml]
permissions:
  contents: write
  actions: read
jobs:
  recheck:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diag/dotnet-original-v3-trap-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: 8f5ae699ee6849036af6e9c129e6cb47c4b21b15
          fetch-depth: 0
          filter: blob:none
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install reviewed Python dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Restore the validated archive repair and apply exact fixture fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, tarfile, zipfile
          from tools import ci_contracts
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1587-python-recheck'
          out.mkdir()
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == '8f5ae699ee6849036af6e9c129e6cb47c4b21b15'
          original = subprocess.run(['gh','api','repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13082010538/zip'],capture_output=True,check=True,timeout=60).stdout
          assert len(original) == 18594
          assert hashlib.sha256(original).hexdigest() == '5f67eebfae20d8640ba3dccae668d9763da0389e647ba255b64bcef080646674'
          names = {
              'docs/testing/dotnet-original-v3-trap.md',
              'tools/ci/contracts/owners/tools/dotnet_original_fault.py.json',
              'tools/ci/contracts/python/test_dotnet_original_fault.py.json',
              'tools/dotnet_original_fault.py',
              'tools/tests/test_dotnet_original_fault.py',
          }
          with zipfile.ZipFile(io.BytesIO(original)) as archive:
              objects = json.loads(archive.read('objects.json'))
              assert objects['testedBase'] == '8f5ae699ee6849036af6e9c129e6cb47c4b21b15'
              assert len(objects['entries']) == len(names) and {row['path'] for row in objects['entries']} == names
              entries = {row['path']:row for row in objects['entries']}
              with tarfile.open(fileobj=io.BytesIO(archive.read('validated-source.tar.gz')),mode='r:gz') as source:
                  members = source.getmembers()
                  assert len(members) == len(names) and {member.name for member in members} == names
                  for member in members:
                      assert member.isfile() and member.size <= 131072
                      raw = source.extractfile(member).read()
                      row = entries[member.name]
                      assert hashlib.sha256(raw).hexdigest() == row['sha256']
                      assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == row['sha']
                      (root/member.name).write_bytes(raw)
              (out/'archive-regression.json').write_bytes(archive.read('archive-regression.json'))
          preimages = {
              'tools/tests/test_ci_profile.py':'7faf2e5019f37138cbdb4933ada49369480ab824',
              'tools/tests/test_java_scheduled_library.py':'f3a37e65610e8cdf8942062fd1a42728a6a328b5',
              'docs/testing/dotnet-original-v3-trap.md':'d83c549ea19befab9a96926831fd396880e4d4e7',
          }
          for name, sha in preimages.items():
              raw = (root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha, name
          before = subprocess.run(['python3','-m','unittest','tools.tests.test_java_scheduled_library.TaskShutdownNowSourceCapture'],capture_output=True,timeout=60)
          (out/'capacity-before.stderr.txt').write_bytes(before.stderr)
          assert before.returncode == 1 and b'tools/overflow.py' in before.stderr
          sha = 'cec3cb8ace5b1a29300fbb3a32dfd2acef5f5662'
          response = subprocess.check_output(['gh','api',f'repos/KirilsTurkins/latent-service-fabric/git/blobs/{sha}'],timeout=30)
          blob = json.loads(response)
          assert blob['encoding'] == 'base64'
          raw = base64.b64decode(blob['content'])
          assert len(raw) == 8554 and hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
          for extra in (['--check'], []):
              subprocess.run(['git','apply',*extra,'-'],input=raw,check=True)
          expected = ci_contracts.python_expectations(root)
          for name in ('test_ci_profile.py','test_java_scheduled_library.py','test_dotnet_original_fault.py'):
              prior = ci_contracts.semantic_record(json.loads((root/f'tools/ci/contracts/python/{name}.json').read_text()))
              actual = expected[f'tools/tests/{name}']
              assert prior['cases'] == actual['cases'] and prior['guards'] == actual['guards'], name
          names.update(preimages)
          (out/'paths.json').write_text(json.dumps(sorted(names))+'\n')
          PY
      - name: Validate complete focused suites and unchanged CI requirements
        run: |
          set -o pipefail
          python3 -m unittest tools.tests.test_dotnet_original_fault tools.tests.test_dotnet_original_evidence tools.tests.test_ci_contracts tools.tests.test_ci_coverage tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_owned_runners tools.tests.test_ci_suite_cases tools.tests.test_ci_suite_inventory tools.tests.test_java_scheduled_library 2>&1 | tee "$RUNNER_TEMP/pr1587-python-recheck/tests.txt"
          python3 tools/ci_coverage.py 2>&1 | tee "$RUNNER_TEMP/pr1587-python-recheck/coverage.txt"
          git diff --check
      - name: Reject inherited Git object stores and stage only validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1587-python-recheck'
          environment = dict(os.environ, GIT_DIR='/nonexistent/pr1587.git', GIT_WORK_TREE='/nonexistent/pr1587', GIT_OBJECT_DIRECTORY='/nonexistent/objects', GIT_ALTERNATE_OBJECT_DIRECTORIES='/nonexistent/alternate')
          result = subprocess.run(['python3','-m','unittest','tools.tests.test_ci_profile.ClassificationTests.test_sparse_profile_and_result_checkouts_load_complete_catalogue'],env=environment,capture_output=True,timeout=60)
          (out/'isolated-git.stderr.txt').write_bytes(result.stderr)
          assert result.returncode == 0, result.stderr.decode(errors='replace')
          paths = json.loads((out/'paths.json').read_text())
          assert sorted(subprocess.check_output(['git','diff','--name-only']).decode().splitlines()) == paths
          entries = []
          with tarfile.open(out/'validated-source.tar.gz','w:gz') as archive:
              for name in paths:
                  raw = (root/name).read_bytes()
                  assert len(raw) <= 131072
                  reply = subprocess.run(['gh','api','--method','POST','repos/KirilsTurkins/latent-service-fabric/git/blobs','--input','-'],input=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),capture_output=True,check=True,timeout=30)
                  sha = json.loads(reply.stdout)['sha']
                  assert sha == hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':sha,'sha256':hashlib.sha256(raw).hexdigest()})
                  archive.add(root/name,arcname=name)
          (out/'objects.json').write_text(json.dumps({'testedBase':'8f5ae699ee6849036af6e9c129e6cb47c4b21b15','entries':entries},indent=2)+'\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        if: always()
        with:
          name: pr1587-python-recheck-${{ github.sha }}
          path: ${{ runner.temp }}/pr1587-python-recheck/
          retention-days: 2
          if-no-files-found: error
