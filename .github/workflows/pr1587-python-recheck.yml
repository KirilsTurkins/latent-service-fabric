name: PR 1587 Python recheck
on:
  push:
    branches: [diag/dotnet-original-v3-trap-20261031]
    paths: [.github/workflows/pr1587-python-recheck.yml]
permissions:
  contents: write
  actions: read
jobs:
  recheck:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diag/dotnet-original-v3-trap-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: 8f5ae699ee6849036af6e9c129e6cb47c4b21b15
          fetch-depth: 0
          filter: blob:none
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install reviewed Python dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Materialize the pinned reviewed repair and update its explicit owner fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, yaml
          sha = '12fd12bba4a437ce0b0e69f64b3f427bf5468c73'
          response = subprocess.check_output(['gh','api',f'repos/KirilsTurkins/latent-service-fabric/git/blobs/{sha}'],timeout=30)
          blob = json.loads(response)
          assert blob['encoding'] == 'base64'
          raw = base64.b64decode(blob['content'])
          assert len(raw) <= 131072
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
          steps = yaml.safe_load(raw)['jobs']['recheck']['steps']
          names = [
              'Apply only the reviewed snapshot repair and demonstrate its regression',
              'Validate parser evidence and unchanged CI preservation requirements',
              'Verify real original archive replacement and stage validated source blobs',
          ]
          directory = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1587-snapshot-recipe'
          directory.mkdir()
          for index, name in enumerate(names):
              script, = [step['run'] for step in steps if step.get('name') == name]
              if index == 0:
                  needle = 'preimages = {\n'
                  assert script.count(needle) == 1
                  script = script.replace(needle, needle+"    'tools/ci/contracts/owners/tools/dotnet_original_fault.py.json': 'cf807ec6b768d2c3cb5640711bf24f376b989248',\n")
              (directory/f'{index}.sh').write_text(script)
          subprocess.run(['bash','-e','-o','pipefail',str(directory/'0.sh')],check=True,timeout=90)
          root = pathlib.Path.cwd()
          path = root/'tools/ci/contracts/owners/tools/dotnet_original_fault.py.json'
          value = json.loads(path.read_text())
          assert value['sha256'] == '648ef16f0ea6f7f935e954b25f4b03c347c4803f4444edfb932626c9b68b7594'
          actual = hashlib.sha256((root/'tools/dotnet_original_fault.py').read_bytes()).hexdigest()
          assert actual == 'ef12cb634cc07390c9ce6819d6ceec75a44a0275bf00e525666ac187f974cdd0'
          value['sha256'] = actual
          value['reviewReason'] = 'Preserve the bounded original .NET observer and its original identity, admission and payload requirements. Parse the single authenticated byte snapshot instead of reopening its pathname after verification; no guest, authority, budget or qualification change.'
          path.write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Validate parser evidence and unchanged CI preservation requirements
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-snapshot-recipe/1.sh"
      - name: Verify real original archive replacement and stage validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e -o pipefail "$RUNNER_TEMP/pr1587-snapshot-recipe/2.sh"
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        if: always()
        with:
          name: pr1587-python-recheck-${{ github.sha }}
          path: ${{ runner.temp }}/pr1587-python-recheck/
          retention-days: 2
          if-no-files-found: error
