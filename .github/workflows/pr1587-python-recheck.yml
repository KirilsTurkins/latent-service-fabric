name: PR 1587 Python recheck
on:
  push:
    branches: [diag/dotnet-original-v3-trap-20261031]
    paths: [.github/workflows/pr1587-python-recheck.yml]
permissions:
  contents: write
  actions: read
jobs:
  recheck:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diag/dotnet-original-v3-trap-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: 8f5ae699ee6849036af6e9c129e6cb47c4b21b15
          fetch-depth: 0
          filter: blob:none
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install reviewed Python dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Apply only the reviewed snapshot repair and demonstrate its regression
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from tools import ci_contracts
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1587-python-recheck'
          out.mkdir()
          preimages = {
              'tools/dotnet_original_fault.py': 'd9ddcae83e28cdb1b7017b3e57db20fcbde79439',
              'tools/tests/test_dotnet_original_fault.py': 'cd90effabd77bc05cf68c1faeada0bd29b0c0d6d',
              'tools/ci/contracts/python/test_dotnet_original_fault.py.json': 'cf31514b8995b601a0220289e39caa3b04c42ffc',
              'docs/testing/dotnet-original-v3-trap.md': '5fcf9a9ec1720c14d6ea199749cd083ba82d00fe',
          }
          for name, sha in preimages.items():
              raw = (root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha, name
          test = root/'tools/tests/test_dotnet_original_fault.py'
          method = '''
              def test_archive_path_replacement_after_read_cannot_replace_verified_bytes(self):
                  # A synthetic authenticated envelope exercises byte ownership only. It
                  # deliberately stops at the closed admission schema, before restoration.
                  import hashlib
                  import io
                  from unittest.mock import patch
                  import zipfile

                  buffer = io.BytesIO()
                  with zipfile.ZipFile(buffer, "w", compression=zipfile.ZIP_DEFLATED) as source:
                      source.writestr("ADMISSION.json", b"{}")
                  original = buffer.getvalue()
                  metadata = dict(selected.ORIGINAL, bytes=len(original), members=1,
                                  sha256=hashlib.sha256(original).hexdigest(), admittedBytes=0,
                                  admissionSha256=hashlib.sha256(b"{}").hexdigest())
                  read = selected.read_file
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      archive, destination = root / "original.zip", root / "restored"
                      for mutation in ("replace", "unlink"):
                          with self.subTest(mutation=mutation):
                              archive.write_bytes(original)

                              def replace_after_read(path, maximum):
                                  self.assertEqual((path, maximum), (archive, len(original)))
                                  raw = read(path, maximum)
                                  if mutation == "replace":
                                      archive.write_bytes(b"unverified replacement")
                                  else:
                                      archive.unlink()
                                  return raw

                              with patch.object(selected, "ORIGINAL", metadata), \\
                                      patch.object(selected, "read_file", side_effect=replace_after_read) as checked:
                                  with self.assertRaisesRegex(WorkflowError, "dotnet-original-admission-fields"):
                                      selected.restore(archive, destination, time.monotonic() + 10)
                                  checked.assert_called_once_with(archive, len(original))
                              self.assertFalse(destination.exists())
          '''
          import textwrap
          method = '\n'+textwrap.indent(textwrap.dedent(method).strip('\n'), '    ')+'\n'
          old = test.read_text()
          marker = "\n\nif __name__ == '__main__':"
          assert old.count(marker) == 1
          test.write_text(old.replace(marker, '\n'+method+marker))
          result = subprocess.run(['python3','-m','unittest','tools.tests.test_dotnet_original_fault.OriginalDotnetFaultTests.test_archive_path_replacement_after_read_cannot_replace_verified_bytes'],capture_output=True,timeout=30)
          (out/'regression-before.stdout.txt').write_bytes(result.stdout)
          (out/'regression-before.stderr.txt').write_bytes(result.stderr)
          assert result.returncode == 1 and b'BadZipFile' in result.stderr and b'FileNotFoundError' in result.stderr
          path = root/'tools/dotnet_original_fault.py'
          old = path.read_text()
          assert old.count('with zipfile.ZipFile(archive) as source:') == 1
          path.write_text(old.replace('import hashlib\n','import hashlib\nimport io\n',1).replace(
              '    with zipfile.ZipFile(archive) as source:',
              '    # Parse the bounded bytes whose complete archive identity was checked above.\n'
              '    # Reopening the path would allow a replacement between verification and use.\n'
              '    with zipfile.ZipFile(io.BytesIO(raw)) as source:'))
          path = root/'tools/ci/contracts/python/test_dotnet_original_fault.py.json'
          physical = json.loads(path.read_text())
          prior = ci_contracts.semantic_record(physical)
          actual = ci_contracts.python_expectations(root)['tools/tests/test_dotnet_original_fault.py']
          added = {'OriginalDotnetFaultTests.test_archive_path_replacement_after_read_cannot_replace_verified_bytes'}
          assert set(actual['cases']) == set(prior['cases']) | added
          assert all(prior['guards'][name] == actual['guards'][name] for name in prior['cases'])
          for case in added:
              same = next(name for name in prior['cases'] if prior['guards'][name] == actual['guards'][case])
              physical['guards'][case] = physical['guards'][same]
          physical['guards'] = dict(sorted(physical['guards'].items()))
          physical['reviewReason'] = 'Retain all eleven original-v3 parser/archive cases and every existing guard. Add an unignored byte-ownership regression proving that replacing or unlinking an archive pathname after its checked read cannot replace the verified bytes parsed by the loader; no runtime qualification is added.'
          assert ci_contracts.semantic_record(physical)['guards'] == actual['guards']
          path.write_text(json.dumps(physical,indent=2)+'\n')
          with (root/'docs/testing/dotnet-original-v3-trap.md').open('a') as output:
              output.write('\nThe original archive is parsed directly from the bounded byte snapshot whose\ncomplete length and SHA-256 identity have already been checked. The loader does\nnot reopen the pathname after verification. A synthetic regression replaces or\nunlinks that pathname after the initial read and requires parsing to continue\nfrom the verified snapshot, with all existing admission and payload checks still\nenforced. This closes a verification/use race; it does not relax any identity\npin or turn archive restoration into runtime qualification.\n')
          (out/'paths.json').write_text(json.dumps(sorted(preimages))+'\n')
          PY
      - name: Validate parser evidence and unchanged CI preservation requirements
        run: |
          set -o pipefail
          python3 -m unittest tools.tests.test_dotnet_original_fault tools.tests.test_dotnet_original_evidence tools.tests.test_ci_contracts tools.tests.test_ci_coverage tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_owned_runners tools.tests.test_ci_suite_cases tools.tests.test_ci_suite_inventory 2>&1 | tee "$RUNNER_TEMP/pr1587-python-recheck/tests.txt"
          python3 tools/ci_coverage.py 2>&1 | tee "$RUNNER_TEMP/pr1587-python-recheck/coverage.txt"
          git diff --check
      - name: Verify real original archive replacement and stage validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile, tempfile, time
          from unittest.mock import patch
          from tools import dotnet_original_fault as selected
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1587-python-recheck'
          original = subprocess.run(['gh','api','repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13038749267/zip'],capture_output=True,check=True,timeout=90).stdout
          assert len(original) == selected.ORIGINAL['bytes']
          assert hashlib.sha256(original).hexdigest() == selected.ORIGINAL['sha256']
          summaries = []
          for mode in ('unchanged','replace','unlink'):
              with tempfile.TemporaryDirectory() as temporary:
                  directory = pathlib.Path(temporary)
                  archive = directory/'normal.zip'
                  archive.write_bytes(original)
                  read = selected.read_file
                  def mutate(path, limit):
                      raw = read(path,limit)
                      if mode == 'replace': path.write_bytes(b'unverified replacement')
                      if mode == 'unlink': path.unlink()
                      return raw
                  with patch.object(selected,'read_file',side_effect=mutate) as captured:
                      result = selected.restore(archive,directory/'restored',time.monotonic()+30)
                  assert captured.call_count == 1
                  for name, expected in selected.RESTORED_INPUTS.items():
                      path = directory/'restored'/'build'/name
                      if not path.exists(): path = directory/'restored'/name
                      assert selected.identity(path.read_bytes()) == {key:expected[key] for key in ('bytes','sha256')}
                  summaries.append({'mutation':mode,'restoredInputs':16,'boundedReads':1,'runtimeQualification':False})
          (out/'archive-regression.json').write_text(json.dumps(summaries,indent=2)+'\n')
          paths = json.loads((out/'paths.json').read_text())
          assert sorted(subprocess.check_output(['git','diff','--name-only']).decode().splitlines()) == paths
          entries = []
          with tarfile.open(out/'validated-source.tar.gz','w:gz') as archive:
              for name in paths:
                  raw = (root/name).read_bytes()
                  assert len(raw) <= 131072
                  reply = subprocess.run(['gh','api','--method','POST','repos/KirilsTurkins/latent-service-fabric/git/blobs','--input','-'],input=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),capture_output=True,check=True,timeout=30)
                  sha = json.loads(reply.stdout)['sha']
                  assert sha == hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':sha,'sha256':hashlib.sha256(raw).hexdigest()})
                  archive.add(root/name,arcname=name)
          (out/'objects.json').write_text(json.dumps({'testedBase':'8f5ae699ee6849036af6e9c129e6cb47c4b21b15','entries':entries},indent=2)+'\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        if: always()
        with:
          name: pr1587-python-recheck-${{ github.sha }}
          path: ${{ runner.temp }}/pr1587-python-recheck/
          retention-days: 2
          if-no-files-found: error
