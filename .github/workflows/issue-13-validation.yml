name: Issue 13 shared observability

on:
  pull_request:
    paths:
      - ".github/workflows/issue-13-validation.yml"
      - "apps/latentd/**"
      - "crates/latent-activation/**"
      - "crates/latent-core/**"
      - "crates/latent-executor/**"
      - "crates/latent-node/**"
      - "crates/latent-scheduler/**"
      - "crates/latent-telemetry/**"
      - "crates/latent-testkit/**"
      - "crates/latent-wasmtime/**"
      - "docs/operations/shared-telemetry-and-inventory.md"
      - "tools/validate_pr53_observability.sh"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - development
    paths:
      - ".github/workflows/issue-13-validation.yml"
      - "apps/latentd/**"
      - "crates/latent-activation/**"
      - "crates/latent-core/**"
      - "crates/latent-executor/**"
      - "crates/latent-node/**"
      - "crates/latent-scheduler/**"
      - "crates/latent-telemetry/**"
      - "crates/latent-testkit/**"
      - "crates/latent-wasmtime/**"
      - "docs/operations/shared-telemetry-and-inventory.md"
      - "tools/validate_pr53_observability.sh"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    name: Runtime, telemetry, inventory, and CLI evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Validate PR-head observability behavior
        run: tools/validate_pr53_observability.sh

  msrv:
    name: Rust MSRV 1.94.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Check affected packages at MSRV
        run: >-
          cargo +1.94.1 check --locked --all-targets --all-features
          -p latent-telemetry
          -p latent-node
          -p latent-testkit
          -p latent-wasmtime
          -p latentd
