name: Stream native factory descriptor ownership
# Exact feature push is the owning entry while this workflow is absent from
# the default branch's manual-dispatch registry; release remains untouched.
on:
  workflow_dispatch:
  push:
    branches: ['feat/stream-kernel-native-factory-owner-20261023', 'feat/kernel-native-constructor-vm-20261024', 'feat/kernel-native-close-20261024', 'feat/sdk-738-q35-node-boot-20261029', 'feat/sdk-738-q35-pci-identity-20261104', 'feat/sdk-738-q35-node-pci-prefix-20261104', 'feat/sdk-738-q35-pci-setup-20261104', 'feat/sdk-738-q35-pci-fixup-20261104', 'feat/sdk-738-q35-pci-intx-20261105', 'feat/sdk-738-q35-bar3-20261108']
    paths:
      - '.github/workflows/stream-native-factory-owner.yml'
      - 'apps/**'
      - 'crates/latent-streams/**'
      - 'crates/latent-component-threading/**'
      - 'examples/renderer-profile/package.json'
      - 'examples/renderer-profile/package-lock.json'
      - 'crates/latent-capabilities/src/broker/pools/control.rs'
      - 'crates/latent-capabilities/src/broker/pools.rs'
      - 'crates/latent-capabilities/src/broker/pools/tests.rs'
      - 'crates/latent-capabilities/src/broker/pools/tests/close_observation.rs'
      - 'tools/qualify_host_stream_native.py'
      - 'tools/qualify_host_stream_kernel_native_vm.py'
      - 'tools/host_stream_kernel_native_vm.py'
      - 'tools/host_stream_kernel_native_vm_inputs.py'
      - 'tools/tests/test_kernel_native_constructor_vm.py'
      - 'tools/ci_tool_graph.py'
      - 'tools/tests/test_ci_contracts.py'
      - 'tools/ci/suites.json'
      - 'tools/ci/suites.d/outbound-streams.json'
      - 'research/standard-outbound/linux-6.12-lineage/native-constructor-vm-init.c'
      - 'research/standard-outbound/linux-6.12-lineage/node-boot/**'
      - 'research/standard-outbound/linux-6.12-lineage/node-constructor-bridge/**'
      - 'research/standard-outbound/linux-6.12-lineage/node-pci-prefix/**'
      - 'research/standard-outbound/linux-6.12-lineage/node-pci-setup/**'
      - 'research/standard-outbound/linux-6.12-lineage/node-pci-fixup/**'
      - 'research/standard-outbound/linux-6.12-lineage/node-pci-intx/**'
      - 'research/standard-outbound/linux-6.12-lineage/node-pci-bar3/**'
      - 'tools/q35_intx_owner.py'
      - 'tools/q35_intx_trace.py'
      - 'tools/q35_bar3_trace.py'
      - 'tools/q35_node_no_stapsdt.ld'
      - 'tools/tests/test_q35_bar3.py'
      - 'tools/tests/fixtures/q35-bar3.c'
permissions:
  contents: read
concurrency:
  group: stream-native-factory-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-owner:
    if: github.ref_name != 'feat/kernel-native-constructor-vm-20261024' && github.ref_name != 'feat/kernel-native-close-20261024' && github.ref_name != 'feat/sdk-738-q35-node-boot-20261029' && github.ref_name != 'feat/sdk-738-q35-pci-identity-20261104' && github.ref_name != 'feat/sdk-738-q35-node-pci-prefix-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-setup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-fixup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-intx-20261105' && github.ref_name != 'feat/sdk-738-q35-bar3-20261108'
    name: Thirteen actual descriptor and original node quota controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: true
      - name: Check finite source and collector controls
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_cleanup_native -v
      - name: Execute only native descriptor ownership controls
        run: >-
          python3 -B tools/qualify_host_stream_native.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/stream-native-factory-owner"
      - name: Retain actual outcomes and compiler failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-native-factory-owner-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-native-factory-owner/*.log
            ${{ runner.temp }}/stream-native-factory-owner/receipt.json
          if-no-files-found: warn
          retention-days: 3
  native-kernel-vm:
    if: github.ref_name == 'feat/kernel-native-constructor-vm-20261024' || github.ref_name == 'feat/kernel-native-close-20261024' || github.ref_name == 'feat/sdk-738-q35-node-boot-20261029' || github.ref_name == 'feat/sdk-738-q35-pci-identity-20261104' || github.ref_name == 'feat/sdk-738-q35-node-pci-prefix-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-setup-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-fixup-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-intx-20261105' || github.ref_name == 'feat/sdk-738-q35-bar3-20261108'
    name: Actual native close observation in the qualified isolated kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Start the original q35 setup and execution clock
        if: github.ref_name == 'feat/sdk-738-q35-node-boot-20261029' || github.ref_name == 'feat/sdk-738-q35-pci-identity-20261104' || github.ref_name == 'feat/sdk-738-q35-node-pci-prefix-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-setup-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-fixup-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-intx-20261105' || github.ref_name == 'feat/sdk-738-q35-bar3-20261108'
        run: python3 -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("LSF_Q35_STARTED_MONOTONIC="+repr(time.monotonic())+"\n")'
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        if: github.ref_name != 'feat/sdk-738-q35-node-boot-20261029' && github.ref_name != 'feat/sdk-738-q35-pci-identity-20261104' && github.ref_name != 'feat/sdk-738-q35-node-pci-prefix-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-setup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-fixup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-intx-20261105' && github.ref_name != 'feat/sdk-738-q35-bar3-20261108'
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334 # v2.9.3 + upstream changes + LSF security fixes
        if: github.ref_name != 'feat/sdk-738-q35-node-boot-20261029' && github.ref_name != 'feat/sdk-738-q35-pci-identity-20261104' && github.ref_name != 'feat/sdk-738-q35-node-pci-prefix-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-setup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-fixup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-intx-20261105' && github.ref_name != 'feat/sdk-738-q35-bar3-20261108'
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04-native-constructor-static
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: false
      - name: Check closed image source bindings and real observation refusal controls
        if: github.ref_name != 'feat/sdk-738-q35-node-boot-20261029' && github.ref_name != 'feat/sdk-738-q35-pci-identity-20261104' && github.ref_name != 'feat/sdk-738-q35-node-pci-prefix-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-setup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-fixup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-intx-20261105' && github.ref_name != 'feat/sdk-738-q35-bar3-20261108'
        run: python3 -B -m unittest tools.tests.test_kernel_native_constructor_vm -v
      - name: Install only the normal host linker and isolated emulator
        if: github.ref_name != 'feat/sdk-738-q35-node-boot-20261029' && github.ref_name != 'feat/sdk-738-q35-pci-identity-20261104' && github.ref_name != 'feat/sdk-738-q35-node-pci-prefix-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-setup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-fixup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-intx-20261105' && github.ref_name != 'feat/sdk-738-q35-bar3-20261108'
        run: |
          sudo timeout --signal=TERM --kill-after=30s 180s apt-get update
          sudo timeout --signal=TERM --kill-after=30s 600s apt-get install --yes --no-install-recommends gcc binutils libc6-dev qemu-system-x86
      - name: Compile the real native caller and join it to the immutable qualified kernel
        if: github.ref_name != 'feat/sdk-738-q35-node-boot-20261029' && github.ref_name != 'feat/sdk-738-q35-pci-identity-20261104' && github.ref_name != 'feat/sdk-738-q35-node-pci-prefix-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-setup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-fixup-20261104' && github.ref_name != 'feat/sdk-738-q35-pci-intx-20261105' && github.ref_name != 'feat/sdk-738-q35-bar3-20261108'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_native_vm.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/stream-native-kernel-vm"
      - name: Build and boot the original-Node q35 KVM preparation image
        if: github.ref_name == 'feat/sdk-738-q35-node-boot-20261029' || github.ref_name == 'feat/sdk-738-q35-pci-identity-20261104' || github.ref_name == 'feat/sdk-738-q35-node-pci-prefix-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-setup-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-fixup-20261104' || github.ref_name == 'feat/sdk-738-q35-pci-intx-20261105' || github.ref_name == 'feat/sdk-738-q35-bar3-20261108'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_native_vm.py --node-boot
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/stream-native-kernel-vm"
      - name: Retain the actual inputs observations and original failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-native-kernel-vm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-native-kernel-vm/receipt.json
            ${{ runner.temp }}/stream-native-kernel-vm/FAILED.json
            ${{ runner.temp }}/stream-native-kernel-vm/commands.json
            ${{ runner.temp }}/stream-native-kernel-vm/native-source-inputs.json
            ${{ runner.temp }}/stream-native-kernel-vm/native-init
            ${{ runner.temp }}/stream-native-kernel-vm/native-init.rejected.elf
            ${{ runner.temp }}/stream-native-kernel-vm/constructor-init
            ${{ runner.temp }}/stream-native-kernel-vm/constructor-init.c
            ${{ runner.temp }}/stream-native-kernel-vm/native-constructor-initramfs.cpio
            ${{ runner.temp }}/stream-native-kernel-vm/kernel/original-image.zip
            ${{ runner.temp }}/stream-native-kernel-vm/kernel/origin.json
            ${{ runner.temp }}/stream-native-kernel-vm/commands/logs/*.txt
            ${{ runner.temp }}/stream-native-kernel-vm/node-bzImage
            ${{ runner.temp }}/stream-native-kernel-vm/node-initramfs.cpio
            ${{ runner.temp }}/stream-native-kernel-vm/boot.config
            ${{ runner.temp }}/stream-native-kernel-vm/selected-before.config
            ${{ runner.temp }}/stream-native-kernel-vm/derived-inputs.json
            ${{ runner.temp }}/stream-native-kernel-vm/projection-proof.json
            ${{ runner.temp }}/stream-native-kernel-vm/qemu-source.json
          if-no-files-found: warn
          retention-days: 3
