name: Stream native factory descriptor ownership
# Exact feature push is the owning entry while this workflow is absent from
# the default branch's manual-dispatch registry; release remains untouched.
on:
  workflow_dispatch:
  push:
    branches: ['feat/stream-kernel-native-factory-owner-20261023']
    paths:
      - '.github/workflows/stream-native-factory-owner.yml'
      - 'crates/latent-streams/**'
      - 'crates/latent-capabilities/src/broker/pools/control.rs'
      - 'tools/qualify_host_stream_native.py'
permissions:
  contents: read
concurrency:
  group: stream-native-factory-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-owner:
    name: Ten actual descriptor and original node quota controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: true
      - name: Check finite source and collector controls
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_cleanup_native -v
      - name: Execute only native descriptor ownership controls
        run: >-
          python3 -B tools/qualify_host_stream_native.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/stream-native-factory-owner"
      - name: Retain actual outcomes and compiler failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-native-factory-owner-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-native-factory-owner/*.log
            ${{ runner.temp }}/stream-native-factory-owner/receipt.json
          if-no-files-found: warn
          retention-days: 3
