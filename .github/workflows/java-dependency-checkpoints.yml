name: Java published dependency checkpoints
on:
  push:
    branches: ['feat/java-runtime-next-20261023']
    paths:
      - 'tools/fixtures/java-dependency-checkpoints/**'
      - 'tools/java_dependency_checkpoint_*.py'
      - 'tools/qualify_java_dependency_checkpoints.py'
      - 'tools/tests/test_java_dependency_checkpoints.py'
      - 'sdk/java-guest/fibers/conformance/compiler/DependencyCheckpointControl.java'
      - '.github/workflows/java-dependency-checkpoints.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: java-dependency-checkpoints-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dependency-checkpoints:
    name: One captured Commons loop with actual Java sibling progress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Fetch the immutable native producer source without rebuilding
        run: git fetch --no-tags --depth=1 origin b422af24d86344ac7abb8b8fa56c3782aab63915
      - uses: KirilsTurkins/lsf-setup-java@5d910981b146bc2d4fd97fa349210f3e3d454039 # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install the maintained exact compiler tools and focused controller checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_dependency_checkpoints -v
          curl --fail --location --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          timeout --signal=KILL 180s curl --fail --location \
            --retry 3 --retry-all-errors --retry-delay 1 --max-time 60 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/java-bindgen"
          echo "$RUNNER_TEMP/java-bindgen" >> "$GITHUB_PATH"
      - name: Authenticate the five existing 193-control native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_thread_native_products.py --output "$RUNNER_TEMP/java-checkpoint-native"
      - name: Reference and actual compiler IR controls then one fresh signed checkpoint target
        run: |
          python3 -B tools/qualify_java_dependency_checkpoints.py \
            --native "$RUNNER_TEMP/java-checkpoint-native" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" \
            --output "$RUNNER_TEMP/java-checkpoints"
      - name: Retain bounded source compiler and actual runtime evidence without keys
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-dependency-checkpoints-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/java-checkpoint-native/*.json
            ${{ runner.temp }}/java-checkpoints/*.json
            ${{ runner.temp }}/java-checkpoints/commands/logs/**
            ${{ runner.temp }}/java-checkpoints/controls/controls.json
            ${{ runner.temp }}/java-checkpoints/controls/reference-commands.json
            ${{ runner.temp }}/java-checkpoints/controls/reference-commands/logs/**
            ${{ runner.temp }}/java-checkpoints/project/candidate.json
            ${{ runner.temp }}/java-checkpoints/project/receipts/*.json
            ${{ runner.temp }}/java-checkpoints/project/application/java-dependencies.json
            ${{ runner.temp }}/java-checkpoints/project/application/latent.dependencies*.json
            ${{ runner.temp }}/java-checkpoints/compiler/compiler-cache-selection.json
            ${{ runner.temp }}/java-checkpoints/compiler/compiler-acquisition/*.json
            ${{ runner.temp }}/java-checkpoints/build/*.json
            ${{ runner.temp }}/java-checkpoints/build/component.wasm
            ${{ runner.temp }}/java-checkpoints/build/checkpoint-generated/**
            ${{ runner.temp }}/java-checkpoints/build/compiler-logs/*-java-to-c.log
            ${{ runner.temp }}/java-checkpoints/build/compiler-logs/*-java-coroutine-*.log
            ${{ runner.temp }}/java-checkpoints/build/compiler-logs/*-c-to-wasm.log
            ${{ runner.temp }}/java-checkpoints/node/*.json
            ${{ runner.temp }}/java-checkpoints/node/commands/logs/**
            ${{ runner.temp }}/java-checkpoints/node/examples-controls/**
            ${{ runner.temp }}/java-checkpoints/node/foreign-controls/**
