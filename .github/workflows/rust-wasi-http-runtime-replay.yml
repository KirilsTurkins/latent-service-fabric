name: Rust retained ordinary WASI HTTP runtime

on:
  workflow_dispatch:
  push:
    branches: ['diag/rust-wasi-http-node-replay-20261021']
    paths: ['.github/workflows/rust-wasi-http-runtime-replay.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-wasi-http-runtime-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retained-guest:
    name: Authenticate the original compiled guest and execute only its full node programme
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install only the existing pinned Python controller dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Fetch exact original compiler and native source objects without compilation
        run: >-
          git fetch --no-tags --depth=1 origin
          8f1d08257e724dca71b0c20aeff547524cba7076
          6fd19eab2c224fc31481d03de5008de4d3e4429e
      - name: Check the exact original ancestry and corrected counter reader
        run: python3 -B -m unittest tools.tests.test_rust_wasi_http_runtime_replay tools.tests.test_rust_wasi_http_runtime -q
      - name: Restore only the fixed original public compiled-guest artifact
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wasi-http-runtime-8f1d08257e724dca71b0c20aeff547524cba7076
          run-id: '39532447535'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rust-http-original
      - name: Authenticate unchanged original native products without another host build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/rust-http-native"
      - name: Re-sign the exact original component and execute all original64 attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/replay_rust_wasi_http_runtime.py
          --original-artifact "$RUNNER_TEMP/rust-http-original"
          --native-products "$RUNNER_TEMP/rust-http-native"
          --output "$RUNNER_TEMP/rust-http-node-replay"
      - name: Retain exact ancestry and bounded public invocation and cleanup observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-wasi-http-node-replay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rust-http-node-replay/*.json
            ${{ runner.temp }}/rust-http-node-replay/build/*.json
            ${{ runner.temp }}/rust-http-node-replay/build/*.wasm
            ${{ runner.temp }}/rust-http-node-replay/build/wit/**
            ${{ runner.temp }}/rust-http-node-replay/node/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/examples-controls/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/foreign-controls/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/provider-absence/*.json
            ${{ runner.temp }}/rust-http-node-replay/node/provider-absence/controls/*.json
            ${{ runner.temp }}/rust-http-native/*.json
          if-no-files-found: warn
          retention-days: 3
