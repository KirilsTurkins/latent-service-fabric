name: AOT input validation

on:
  push:
    branches: [feat/429-prepared-aot-test-inputs]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: true
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
      - name: Build exact AOT products once
        run: |
          mkdir -p "$RUNNER_TEMP/aot-observations"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          start = time.monotonic_ns()
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aot-observations'
          with (root / 'inventory.jsonl').open('wb') as output:
              status = subprocess.call(['cargo', 'test', '-p', 'latent-wasmtime', '--all-features', '--locked', '--no-run', '--test', 'aot_supervisor', '--test', 'isolated_aot', '--test', 'native_aot_cache', '--test', 'aot_sandbox', '--message-format=json,json-render-diagnostics'], stdout=output)
          (root / 'build.json').write_text(json.dumps({'elapsed_ns':time.monotonic_ns()-start, 'status':status}) + '\n')
          raise SystemExit(status)
          PY
      - name: Prepare immutable copies and compare equal case sets
        run: |
          python3 tools/aot_test_inputs.py prepare --inventory "$RUNNER_TEMP/aot-observations/inventory.jsonl" --output "$RUNNER_TEMP/aot-inputs"
          python3 tools/run_aot_tests.py --manifest "$RUNNER_TEMP/aot-inputs/manifest.json" --report-dir "$RUNNER_TEMP/aot-observations/comparison" --compare
      - name: Execute unchanged production sandbox tests
        run: cargo test -p latent-wasmtime --all-features --locked --test aot_sandbox
      - name: Formatting and focused Clippy
        if: always()
        run: |
          cargo fmt --all --check
          cargo clippy -p latent-wasmtime --all-features --locked --test aot_supervisor --test isolated_aot --test native_aot_cache --bin latent-aot-compiler --no-deps
      - name: Retain bounded observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aot-input-observations
          path: ${{ runner.temp }}/aot-observations
          if-no-files-found: error
          retention-days: 7
