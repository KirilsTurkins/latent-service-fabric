name: Agent 1 pinned abort investigation inputs

on:
  push:
    branches: ['fix/typescript-abort-fanout-refusal-1852-agent1']
    paths: ['.github/workflows/agent1-abort-inputs.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          fetch-depth: 32
      - name: Preserve exact branch history and pinned source archive
        run: |
          mkdir -p "$RUNNER_TEMP/agent1-inputs"
          git bundle create "$RUNNER_TEMP/agent1-inputs/agent1.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/agent1-inputs/head.txt"
          curl --fail --location --retry 2 --max-time 120 'https://codeload.github.com/bytecodealliance/ComponentizeJS/tar.gz/4b8d6eb465b5cded6b97c67aaf6fdaa8b62001e2' -o "$RUNNER_TEMP/agent1-inputs/componentize.archive"
          echo '2a6ce6a343cb8547a41ed1d0c96ce916be3d754ba8d993bc755334f234e2cdc5  '"$RUNNER_TEMP/agent1-inputs/componentize.archive" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/agent1-inputs/componentize.archive")" = 165706
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: agent1-pinned-abort-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/agent1-inputs/
          if-no-files-found: error
          retention-days: 2
