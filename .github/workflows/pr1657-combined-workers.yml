name: PR 1657 authenticated combined worker candidate
on:
  push:
    branches: ['diag/pr1657-combined-workers-20261106']
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          ref: 3fc286a0218d0a77dbb9c8a51df13eeaaa081dc9
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Verify exact source and formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3fc286a0218d0a77dbb9c8a51df13eeaaa081dc9
          test "$(git rev-parse HEAD^{tree})" = 2bac4e3605f245c7bbdabaccbd7fe9114cc192d9
          mkdir -p "$RUNNER_TEMP/pr1657-worker-stage"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/pr1657-worker-stage/source-commit.txt"
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/ci_cargo.py run format
          python3 -B -c 'from tools.ci_coverage import validate; validate(); print("CI contracts passed")'
      - name: Compile and execute ordinary and combined stack controls
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr1657-worker-stage"
          cargo test --locked -p latent-wasmtime --lib native_stacks:: -- --nocapture --test-threads=1 2>&1 | tee "$out/stacks-ordinary.log"
          cargo test --locked -p latent-wasmtime --lib --features development-rust-http-combined native_stacks:: -- --nocapture --test-threads=1 2>&1 | tee "$out/stacks-combined.log"
          cargo clippy --locked -p latent-wasmtime --lib --tests --features development-rust-http-combined -- -D warnings 2>&1 | tee "$out/clippy.log"
      - name: Retrieve authenticated original compiler inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/rust_combined_http_materials.py --output "$RUNNER_TEMP/rust-combined-original"
      - name: Execute the exact committed candidate signed witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qualify_rust_thread_http_combined.py --compiler-materials "$RUNNER_TEMP/rust-combined-original" --output "$RUNNER_TEMP/rust-combined-signed" --source-commit "$(git rev-parse HEAD)"
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-worker-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr1657-worker-stage/**
            ${{ runner.temp }}/rust-combined-signed/**
            ${{ runner.temp }}/rust-combined-original/retrieval.json
          if-no-files-found: error
          retention-days: 2
