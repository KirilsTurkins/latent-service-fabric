name: Signed Go v7 stack ceiling and initializer retirement

on:
  workflow_dispatch:
  push:
    branches: ['feat/go-stack-ceiling-v7-20261024']

permissions:
  contents: read

concurrency:
  group: go-stack-ceiling-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Seven source-bound signed Go v7 stack attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact input ownership cancellation and fail-closed selection
        run: |
          python3 -B - <<'PY'
          import json, sys, unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tools.tests.test_go_stack_ceiling_runtime')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          counts = dict(testsRun=result.testsRun, skipped=len(result.skipped), failures=len(result.failures), errors=len(result.errors))
          print(json.dumps(counts))
          sys.exit(0 if counts == dict(testsRun=4, skipped=0, failures=0, errors=0) else 1)
          PY
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-bin: false
          cache-workspace-crates: false
          cache-targets: true
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Authenticate the maintained compiler and official generator
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-stack-ceiling-tools"
          test ! -e "$out"
          mkdir "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/go.tar.gz" -C "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/componentize-go.tar.gz" https://github.com/bytecodealliance/componentize-go/releases/download/v0.4.3/componentize-go-linux-amd64.tar.gz
          echo "1061d845f550df5d9477612a7d458a31b1e2b8bdc95823704e42e5064deb0c52  $out/componentize-go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/componentize-go.tar.gz" -C "$out" componentize-go
          echo "b41803a645e54845bc8eacef9a69e0eeb8c2c4a9a61964c831ed544e85c137cb  $out/componentize-go" | sha256sum --check --strict
          chmod 755 "$out/componentize-go"
          test "$("$out/componentize-go" --version)" = 'componentize-go 0.4.3'
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          python3 tools/go_guest/runtime.py --prepare-compiler "$out/go" --output "$out/go-async"
          echo "$out" >> "$GITHUB_PATH"
          echo "$out/go-async/bin" >> "$GITHUB_PATH"
      - name: Build two normal Go v7 sources and a source-matched signer then execute seven attempts
        run: python3 tools/qualify_go_stack_ceiling_runtime.py --source-commit "${{ github.sha }}" --output "$RUNNER_TEMP/go-stack-ceiling-runtime"
      - name: Retain bounded compiler and owner evidence including failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-stack-ceiling-runtime-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/go-stack-ceiling-runtime/*.json
            ${{ runner.temp }}/go-stack-ceiling-runtime/*.log
            ${{ runner.temp }}/go-stack-ceiling-runtime/applications/**
            ${{ runner.temp }}/go-stack-ceiling-runtime/go-stack-ordinary/**
            ${{ runner.temp }}/go-stack-ceiling-runtime/go-stack-initializer-cap/**
            ${{ runner.temp }}/go-stack-ceiling-runtime/reference/project/main.go
            ${{ runner.temp }}/go-stack-ceiling-runtime/reference/project/go.mod
            ${{ runner.temp }}/go-stack-ceiling-runtime/reference/logs/**
            ${{ runner.temp }}/go-stack-ceiling-runtime/reference/not-executed.wasm
          if-no-files-found: warn
          retention-days: 7
