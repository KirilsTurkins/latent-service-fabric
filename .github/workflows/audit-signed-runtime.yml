name: Connected Audit signed retirement
on:
  push:
    branches: ['feat/audit-signed-retirement-20261023']
    paths: ['.github/workflows/audit-signed-runtime.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-signed-retirement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-signed:
    name: Three signed original Audit owner and retirement cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Fetch the three exact separate original source origins
        run: |
          git fetch --no-tags --depth=1 origin 277c8104499d414053573bce066b5e9091e74a20
          git fetch --no-tags --depth=1 origin b422af24d86344ac7abb8b8fa56c3782aab63915
          git fetch --no-tags --depth=1 origin 02478e6e4354323d9a30f7fa1b46240b96a8bcff
      - name: Install locked Python dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Refuse changed hosts, captured guest or Audit authority interpretation
        run: >-
          python3 -B -m unittest tools.tests.test_audit_memory_native_products
          tools.tests.test_audit_c36_component tools.tests.test_audit_signed_runtime -v
      - name: Reuse the exact hosts and captured guest for three signed cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/qualify_audit_signed_runtime.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/audit-signed-runtime"
      - name: Retain bounded exact inputs, actual outcomes and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-signed-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/audit-signed-runtime/
          if-no-files-found: error
          retention-days: 7
