name: Publication fixture preservation
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths: ['.github/workflows/publication-fixture-workbench.yml']
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: '3.13.5'
      - name: Verify and publish only the exact reviewed fixture source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          out = root / 'target/publication-fixture-preservation'
          out.mkdir(parents=True, exist_ok=True)
          api = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def call(path, data=None):
              req = urllib.request.Request(api + path, data=None if data is None else json.dumps(data).encode(), headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          record = call('/git/blobs/2ea15336050fef832ad14d38fc4f2abcb6e47f63')
          assert record['encoding'] == 'base64'
          compressed = base64.b64decode(record['content'])
          assert len(compressed) == 2796
          assert hashlib.sha256(compressed).hexdigest() == '955c128aa64542e1f3b3fafd1f68c259aef68e0028a021682b2b8e638732fb37'
          decoder = lzma.LZMADecompressor(memlimit=64 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=65536)
          assert decoder.eof and not decoder.unused_data
          payload = json.loads(raw)
          rows = payload['files']
          expected = {'tools/tests/test_owned_runners.py', 'tools/ci/contracts/python/test_owned_runners.py.json'}
          assert len(rows) == 2 and {row['path'] for row in rows} == expected
          for row in rows:
              path = root / row['path']
              assert path.is_file() and not path.is_symlink()
              assert blob(path.read_bytes()) == row['before'], row['path']
          patch = payload['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          entries = []
          for row in rows:
              raw = (root / row['path']).read_bytes()
              assert len(raw) == row['size'] and blob(raw) == row['after']
              uploaded = call('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(raw).decode()})
              assert uploaded['sha'] == row['after']
              entries.append({'path': row['path'], 'mode': '100644', 'type': 'blob', 'sha': uploaded['sha']})
              target = out / 'source' / row['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          (out / 'files.json').write_text(json.dumps(rows, indent=2) + '\n')
          (out / 'tree-entries.json').write_text(json.dumps(entries, indent=2) + '\n')
          (out / 'reviewed.patch').write_bytes(patch)
          (out / 'source-commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          for name in ('publication-native-workbench.yml', 'publication-fixture-workbench.yml'):
              path = root / '.github/workflows' / name
              if path.exists():
                  (out / name).write_bytes(path.read_bytes())
                  path.unlink()
          print('Verified both exact fixture sources; no refs changed.')
          PY
      - name: Install reviewed validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock > target/publication-fixture-preservation/install.log 2>&1
      - name: Exercise native runner ownership and exact synthetic inventory
        run: |
          LSF_REQUIRE_NATIVE_PROCESS_TESTS=1 python3 -m unittest tools.tests.test_owned_test_process tools.tests.test_owned_runners tools.tests.test_ci_rust_artifacts tools.tests.test_oci_registry_runner tools.tests.test_ci_cargo_observe > target/publication-fixture-preservation/native-controls.log 2>&1
      - name: Validate unchanged CI obligations and reviewed fixture hash
        run: |
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_ci_profile_sparse tools.tests.test_ci_result tools.tests.test_ci_suite_cases tools.tests.test_ci_contracts > target/publication-fixture-preservation/python-controls.log 2>&1
          python3 tools/ci_coverage.py --receipt target/ci/publication-fixture-preservation.json > target/publication-fixture-preservation/coverage.log 2>&1
          cp target/ci/publication-fixture-preservation.json target/publication-fixture-preservation/ci-inventory.json
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: publication-fixture-preservation-${{ github.sha }}
          path: target/publication-fixture-preservation/
          if-no-files-found: error
          retention-days: 7
