name: Issue 24 Phase 0 baselines

on:
  pull_request:
    branches:
      - development
    paths:
      - "apps/latentd/**"
      - "crates/latent-activation/**"
      - "crates/latent-node/**"
      - "crates/latent-scheduler/**"
      - "crates/latent-wasmtime/**"
      - "benchmarks/phase0/**"
      - "docs/phase-0-baselines.md"
      - "examples/echo-contract/**"
      - "tools/toolchain-smoke/**"
      - "tools/build_echo_capsule.py"
      - "tools/run_phase0_baselines.sh"
      - "tools/validate_contracts.sh"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-smoke:
    name: Deterministic retained-process baseline smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Check benchmark formatting
        run: cargo fmt --all --check
      - name: Compile benchmark with strict Clippy
        run: cargo clippy -p latentd --bin phase0-baseline --all-features --locked --no-deps -- -D warnings
      - name: Run deterministic Phase 0 baseline smoke
        run: tools/run_phase0_baselines.sh smoke "${RUNNER_TEMP}/phase0-baseline"
      - name: Upload raw measurements and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-baseline-smoke
          path: ${{ runner.temp }}/phase0-baseline
          if-no-files-found: error
          retention-days: 14
