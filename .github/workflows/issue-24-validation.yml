name: Issue 24 Phase 0 baselines

on:
  pull_request:
    branches:
      - development
    paths:
      - "apps/latentd/**"
      - "crates/latent-activation/**"
      - "crates/latent-executor/**"
      - "crates/latent-node/**"
      - "crates/latent-scheduler/**"
      - "crates/latent-wasmtime/**"
      - "benchmarks/phase0/**"
      - "docs/phase-0-baselines.md"
      - "docs/phase-0-completion.md"
      - "docs/phase-0-hot-path-profiling.md"
      - "VALIDATION.md"
      - "examples/echo-contract/**"
      - "tools/toolchain-smoke/**"
      - "tools/build_echo_capsule.py"
      - "tools/run_phase0_baselines.sh"
      - "tools/run_phase0_calibration.sh"
      - "tools/aggregate_phase0_calibration.py"
      - "tools/aggregate_phase0_hot_path_profiles.py"
      - "tools/run_phase0_hot_path_profiles.sh"
      - "tools/reassemble_phase0_hot_path_profile_archive.py"
      - "tools/tests/test_aggregate_phase0_calibration.py"
      - "tools/tests/test_aggregate_phase0_hot_path_profiles.py"
      - "tools/tests/test_reassemble_phase0_hot_path_profile_archive.py"
      - "tools/run_phase0_resource_soak.sh"
      - "tools/aggregate_phase0_resource_soak.py"
      - "tools/tests/test_aggregate_phase0_resource_soak.py"
      - "tools/validate_contracts.sh"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches:
      - benchmark/phase0-baselines
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline-smoke:
    name: Deterministic executable and retained baseline smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install checked-in evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Check benchmark formatting
        run: cargo fmt --all --check
      - name: Check complete workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Compile benchmark harnesses with strict Clippy
        run: cargo clippy -p latentd --bin phase0-baseline --bin phase0-soak --all-features --locked --no-deps -- -D warnings
      - name: Test Phase 0 aggregation rules
        run: >-
          python -m unittest
          tools.tests.test_aggregate_phase0_calibration
          tools.tests.test_aggregate_phase0_hot_path_profiles
          tools.tests.test_reassemble_phase0_hot_path_profile_archive
          tools.tests.test_aggregate_phase0_resource_soak
      - name: Run deterministic Phase 0 baseline smoke
        run: |
          unset CARGO_INCREMENTAL
          tools/run_phase0_baselines.sh smoke "${RUNNER_TEMP}/phase0-baseline"
      - name: Upload raw measurements and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-baseline-smoke
          path: ${{ runner.temp }}/phase0-baseline
          if-no-files-found: error
          retention-days: 14

  refresh-reference-evidence:
    name: Refresh checked-in full-profile evidence
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/benchmark/phase0-baselines' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    needs: baseline-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benchmark/phase0-baselines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Generate full reference evidence
        run: |
          unset CARGO_INCREMENTAL
          tools/run_phase0_baselines.sh full benchmarks/phase0
      - name: Commit generated evidence to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/phase0/BASELINE.md benchmarks/phase0/raw-results.json
          if git diff --cached --quiet; then
            echo "Reference evidence is already current."
            exit 0
          fi
          git commit -m "benchmark: refresh Phase 0 reference evidence [skip ci]"
          git push origin HEAD:benchmark/phase0-baselines
