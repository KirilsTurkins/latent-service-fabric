name: Publication history implementation verification
on:
  push:
    branches:
      - ci/662-publication-history-deletion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    name: Prepare pinned native validation tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Prepare locked public dependency inputs
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Export compiler and dependency inputs, never credentials
        run: |
          mkdir -p "$RUNNER_TEMP/publication-history-tools"
          rustc --version --verbose > "$RUNNER_TEMP/publication-history-tools/rustc.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/publication-history-tools/source.txt"
          tar -C "$HOME/.rustup/toolchains" -czf "$RUNNER_TEMP/publication-history-tools/toolchain.tar.gz" 1.97.1-x86_64-unknown-linux-gnu
          tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/publication-history-tools/registry.tar.gz" registry
          (cd "$RUNNER_TEMP/publication-history-tools" && sha256sum toolchain.tar.gz registry.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-history-native-tools-${{ github.sha }}
          path: ${{ runner.temp }}/publication-history-tools/
          if-no-files-found: error
          retention-days: 1
