name: PR 2151 bounded observer and compiler acquisition validation
on:
  push:
    branches: [diag/pr2151-native-pressure-20261121]
    paths: [.github/workflows/pr2151-followup-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: f881e760dfb527e341b2b43b60d99f217ad2d8ae
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          key: ubuntu-24.04
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
      - name: Authenticate five-file patch and retain the exact formatted test inputs
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,tomllib
          patch=gzip.decompress(base64.b64decode(''.replace('AK9WRP/2He/n3EP','AK9WRP/2He/n1EP'),validate=True))
          assert len(patch)==16364 and hashlib.sha256(patch).hexdigest()=='1a575cda7ccacfa0308a49b7debed62e17ca5a148506a167fa0b39812e9a9469'
          rows=[
            ['crates/latent-streams/src/tests/lifecycle.rs','665bd6698518f06bf3993e5b9b0a2f8ab9d28729','0c23e3d24412980076134724654e0e5720c34484'],
            ['crates/latent-streams/src/tests/fixture.rs','963442ce9ee52d8b2cd13cd0a08cdacb0dff41ea','11083d148a86a9b93198c7e606d85a44dff5def6'],
            ['crates/latent-streams/src/tests/sockets.rs','c0968c99e03cc1076788409dc516cb28c374201e','379b5945ef4588d32c88d7312e1da9d9d849eb40'],
            ['tools/java_standard_http_library.py','b3873add36535afdfeb9b92a038a25fae0d64edd','d6d59e6f1f87db14c70367e181796a82d429a971'],
            ['tools/tests/test_java_compiler_acquisition.py','b100909805e93eecb9a4c2bec0cf8d468d35b354','cdc29fd6469ea8e137063247d522b7d0326f7e71']]
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          for name,before,_ in rows:assert blob(pathlib.Path(name).read_bytes())==before,name
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,_,after in rows:assert blob(pathlib.Path(name).read_bytes())==after,name
          assert tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['edition']=='2021'
          subprocess.run(['rustfmt','--edition','2021',*[r[0] for r in rows[:3]]],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={r[0] for r in rows}
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'followup-postimages'
          observed=[]
          for name,before,patched in rows:
              raw=pathlib.Path(name).read_bytes()
              dest=output/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
              observed.append({'path':name,'before':before,'patched':patched,'after':blob(raw),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          receipt={'source':'f881e760dfb527e341b2b43b60d99f217ad2d8ae','patchSha256':hashlib.sha256(patch).hexdigest(),'files':observed}
          (output/'manifest.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Run complete native provider suite and repeat both original failure cases
        run: |
          set -euo pipefail
          cargo test --locked --all-features -p latent-streams --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/followup-native.log"
          for attempt in 1 2 3 4 5; do
            cargo test --locked --all-features -p latent-streams --lib tests::lifecycle::last_output_copy_keeps_original_connection_charge_during_retirement -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/followup-repeated.log"
            cargo test --locked --all-features -p latent-streams --lib tests::sockets::connect_cancellation_before_registration_refuses_handoff -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/followup-repeated.log"
          done
      - name: Require acquisition boundaries and complete SDK controls under the pinned JDK
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_compiler_acquisition tools.tests.test_java_dependency_suite tools.tests.test_java_resource_runtime tools.tests.test_java_standard_http_ownership tools.tests.test_java_teavm_failure_trace -v 2>&1 | tee "$RUNNER_TEMP/followup-acquisition.log"
          python3 -B -m unittest discover -s sdk/java-guest/tests -v 2>&1 | tee "$RUNNER_TEMP/followup-sdk.log"
          python3 -B tools/validate_repository.py 2>&1 | tee "$RUNNER_TEMP/followup-repository.log"
      - name: Require the tested source to equal every retained postimage
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'followup-postimages'
          rows=json.loads((root/'manifest.json').read_text())['files']
          for row in rows:assert pathlib.Path(row['path']).read_bytes()==(root/row['path']).read_bytes(),row['path']
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={r['path'] for r in rows}
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: followup-postimages
          path: ${{ runner.temp }}/followup-postimages
          if-no-files-found: error
          retention-days: 3
      - if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: followup-validation-logs
          path: ${{ runner.temp }}/followup-*.log
          if-no-files-found: warn
          retention-days: 3
  blobs:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: followup-postimages
          path: postimages
          digest-mismatch: error
      - name: Publish only the five validated blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          expected={
            'crates/latent-streams/src/tests/lifecycle.rs':'665bd6698518f06bf3993e5b9b0a2f8ab9d28729',
            'crates/latent-streams/src/tests/fixture.rs':'963442ce9ee52d8b2cd13cd0a08cdacb0dff41ea',
            'crates/latent-streams/src/tests/sockets.rs':'c0968c99e03cc1076788409dc516cb28c374201e',
            'tools/java_standard_http_library.py':'b3873add36535afdfeb9b92a038a25fae0d64edd',
            'tools/tests/test_java_compiler_acquisition.py':'b100909805e93eecb9a4c2bec0cf8d468d35b354'}
          root=pathlib.Path('postimages');receipt=json.loads((root/'manifest.json').read_text());rows=receipt['files']
          assert receipt['source']=='f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          assert receipt['patchSha256']=='1a575cda7ccacfa0308a49b7debed62e17ca5a148506a167fa0b39812e9a9469'
          assert len(rows)==5 and {r['path']:r['before'] for r in rows}==expected
          material={}
          for row in rows:
              p=root/row['path'];assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes();assert len(raw)==row['bytes'] and len(raw)<100000
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert sha==row['after'] and hashlib.sha256(raw).hexdigest()==row['sha256']
              material[row['path']]=(raw,sha)
          observed=[]
          for name,(raw,sha) in material.items():
              request=urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs',data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              assert result['sha']==sha;observed.append({'path':name,'sha':sha})
          pathlib.Path('published-blobs.json').write_text(json.dumps({'source':receipt['source'],'blobs':observed,'refsMoved':False},indent=2)+'\n')
          print(json.dumps(observed))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: followup-published-blobs
          path: published-blobs.json
          if-no-files-found: error
          retention-days: 3
