name: Focused published Java worker qualification
on:
  push:
    branches: ['fix/java-string-amplifier-20261106']
permissions:
  contents: read
concurrency:
  group: java-worker-compiler-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  compiler:
    name: Unchanged published workers through the maintained signed node
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@63c7977881fc344a6ed464f7ed5e242aedc8d56c # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install the normal pinned compiler product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          curl --fail --location --retry 3 --max-time 180 https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          compiler_root=$(mktemp -d /tmp/latent-java-worker.XXXXXXXX)
          timeout --signal=TERM --kill-after=5 1195 python3 -B tools/java_guest/compiler_profile_distribution.py stage --root "$compiler_root" --output "$RUNNER_TEMP/java-normal-compiler-product.json" > "$RUNNER_TEMP/java-normal-compiler-path.txt"
          compiler_sdk=$(cat "$RUNNER_TEMP/java-normal-compiler-path.txt")
          test "$compiler_sdk" = "$compiler_root/work/installed/wasi-sdk"
          printf 'LSF_JAVA_WASI_SDK=%s\n' "$compiler_sdk" >> "$GITHUB_ENV"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/java-bindgen"
          echo "$RUNNER_TEMP/java-bindgen" >> "$GITHUB_PATH"
      - name: Compile the unchanged public libraries with the production compiler
        run: python3 -B tools/qualify_java_fibers.py --fixture worker-libraries --output "$RUNNER_TEMP/java-worker-libraries" --wasi-sdk "$LSF_JAVA_WASI_SDK"
      - name: Execute original signed worker-library qualification
        env:
          LSF_GUEST_SDK_LANGUAGE: java
          LSF_JAVA_WORKER_LIBRARIES_FIXTURE: ${{ runner.temp }}/java-worker-libraries
        run: |
          set -euo pipefail
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service runtime::signed_java_published_libraries_use_unchanged_default_workers -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/java-worker-libraries/signed-runtime.log"
      - name: Retain checked public products and bounded compiler observations
        if: always()
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from tools.qualify_java_published_workers import retain
          from tools.rust_capsule_project import read_file, write_json
          temporary = Path(os.environ['RUNNER_TEMP'])
          prepared = temporary / 'java-worker-libraries'
          output = temporary / 'java-worker-retained'
          output.mkdir()
          report = retain(prepared, output)
          for name in ('signed-runtime.log',):
              source = prepared / name
              if source.is_file():
                  (output / name).write_bytes(read_file(source, 16 * 1024 * 1024))
          write_json(output / 'retained.json', {'revision': os.environ['GITHUB_SHA'], 'files': report})
          PY
      - name: Upload public evidence without keys or compiler caches
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-worker-qualification-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/java-worker-retained/
