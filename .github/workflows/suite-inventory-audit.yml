name: Suite inventory audit
on:
  push:
    branches: [feat/427-exact-suite-inventory]
    paths: ['.github/ci-transfer/*.b64']
permissions:
  contents: write
  actions: read
jobs:
  inventory:
    if: >-
      github.event.head_commit.message == 'chore(ci): assemble verified implementation objects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - run: python3 -m pip install --requirement tools/requirements.lock
      - name: Verify implementation and create Git objects without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_SHA256: b1d837a11a31466fd95ac3333b964c53814b307b106f7c60c370d869c0b0e4fe
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, sys, urllib.request, zipfile
          ROOT = pathlib.Path.cwd()
          REPO = 'KirilsTurkins/latent-service-fabric'
          BASELINE = '50f003dd006e0786494936c49e55dc683cf26fd6'
          TEMP_WORKFLOWS = {'suite-inventory-audit.yml', 'suite-transfer-receipt.yml'}
          def derive(data, raw):
              from tools import ci_coverage as c
              discovery = json.loads(raw)
              seed = data['inventorySeed']
              targets = {(r['manifest'], r['target'], r['kind']): r for r in discovery['targets']}
              for suite in seed['suites']:
                  row = targets[suite['manifest'], suite['target'], suite['kind']]
                  if suite['mode'] != 'custom':
                      suite['expectedCases'] = sorted(line[:-6] for line in row['list'].splitlines() if line.endswith(': test'))
                      suite['expectedIgnored'] = sorted(line[:-6] for line in row['ignoredList'].splitlines() if line.endswith(': test'))
              (ROOT/'tools/ci').mkdir(exist_ok=True)
              (ROOT/'tools/ci/suites.json').write_text(json.dumps(seed,indent=2,sort_keys=True)+'\n')
              before = {}
              for name in subprocess.check_output(['git','ls-tree','--name-only','HEAD:.github/workflows'],text=True).splitlines():
                  if name in TEMP_WORKFLOWS: continue
                  path = '.github/workflows/'+name
                  before.update(c.workflow_commands(path,subprocess.check_output(['git','show','HEAD:'+path],text=True)))
              after = c.commands(ROOT)
              coverage = {}
              for key, record in before.items():
                  assert key in after
                  disposition = 'unchanged' if record == after[key] else 'extended'
                  reason = 'The exact command and its triggering conditions are retained.'
                  if disposition == 'extended':
                      reason = 'Full-profile validation is retained. Inventory/discovery/aggregation checks are added; host-only source contracts and MSRV receive same-change replacements. Runtime, security, release and resource gates remain required when affected.'
                  coverage[key] = {'after': key, 'disposition': disposition, 'reason': reason}
              contract = {'schemaVersion':c.SCHEMA,'baselineRevision':BASELINE,'before':before,'after':after,'coverage':coverage,
                          'delegatedOwners':c.delegated_owners(ROOT,after),'workflowIdentities':c.workflow_identities(ROOT),
                          'pythonCases':c.python_cases(ROOT),
                          'pythonTestModules':sorted(p.relative_to(ROOT).as_posix() for p in (ROOT/'tools/tests').glob('test_*.py'))}
              (ROOT/'tools/ci/commands.json').write_text(json.dumps(contract,indent=2,sort_keys=True)+'\n')
              (ROOT/'tools/ci/evidence').mkdir(exist_ok=True)
              (ROOT/'tools/ci/evidence/baseline-discovery.json').write_bytes(raw)
          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path, data=payload,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/feat/427-exact-suite-inventory'
          chunks = [(ROOT/f'.github/ci-transfer/part-{i}.b64').read_text().strip() for i in range(4)]
          repairs = ROOT/'.github/ci-transfer/repairs.b64'
          if repairs.is_file():
              for index, repair in json.loads(repairs.read_text()).items():
                  number = int(index)
                  assert hashlib.sha256(chunks[number].encode()).hexdigest() == repair['sha256']
                  for start, end, replacement in reversed(repair['edits']):
                      chunks[number] = chunks[number][:start] + replacement + chunks[number][end:]
          compressed = base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(compressed).hexdigest() == os.environ['PAYLOAD_SHA256']
          raw = gzip.GzipFile(fileobj=io.BytesIO(compressed)).read(2*1024*1024+1)
          assert len(raw) <= 2*1024*1024
          data = json.loads(raw)
          data['delete'].append('.github/workflows/suite-transfer-receipt.yml')
          if repairs.is_file(): data['delete'].append('.github/ci-transfer/repairs.b64')
          patch = pathlib.Path(os.environ['RUNNER_TEMP'])/'implementation.patch'
          patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          reused = api('git/blobs/'+data['reusedBlob'])
          source = base64.b64decode(reused['content']).decode()
          source = source.replace('(["lib"], ["test"])','(["lib"], ["test"], ["bin"], ["example"], ["cdylib"])')
          source = source.replace('                require(executable.is_file() and executable.is_relative_to(executable_root),',
              '                owned_root = target_root / "debug/examples" if kinds == ["example"] else executable_root\n                require(executable.is_file() and executable.is_relative_to(owned_root),')
          (ROOT/'tools/phase3_security_artifacts.py').write_text(source)
          for name in data['delete']:
              (ROOT/name).unlink()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          request = urllib.request.Request('https://api.github.com/repos/'+REPO+'/actions/artifacts/10607076270/zip',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              urllib.request.build_opener(NoRedirect).open(request,timeout=60)
              raise RuntimeError('expected artifact redirect')
          except urllib.error.HTTPError as response:
              assert response.code == 302
              location = response.headers['Location']
              assert location.startswith('https://')
          with urllib.request.urlopen(location,timeout=60) as response:
              archive = response.read(2*1024*1024+1)
          assert len(archive) <= 2*1024*1024
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              assert source.getinfo('discovery.json').file_size <= 1024*1024
              raw_discovery = source.read('discovery.json')
          sys.path.insert(0,str(ROOT))
          derive(data,raw_discovery)
          for path, expected in data['expectedBlobs'].items():
              actual = subprocess.check_output(['git','hash-object','--',path],text=True).strip()
              assert actual == expected, (path,actual,expected)
          subprocess.run(['git','add','-N','--',*data['expectedBlobs']],check=True)
          subprocess.run([sys.executable,'-m','unittest','tools.tests.test_ci_profile','tools.tests.test_ci_rust_artifacts',
                          'tools.tests.test_ci_suite_inventory','tools.tests.test_ci_suite_discovery',
                          'tools.tests.test_ci_result','tools.tests.test_ci_coverage','tools.tests.test_validate_docs','-q'],check=True)
          subprocess.run([sys.executable,'tools/ci_coverage.py'],check=True)
          subprocess.run([sys.executable,'tools/validate_docs.py'],check=True)
          subprocess.run([sys.executable,'tools/validate_repository.py'],check=True)
          subprocess.run([sys.executable,'tools/validate_foundation.py'],check=True)
          entries = []
          for path, expected in data['expectedBlobs'].items():
              content = (ROOT/path).read_bytes()
              result = api('git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              assert result['sha'] == expected
              mode = subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':expected})
          entries.extend({'path':path,'mode':'100644','type':'blob','sha':None} for path in data['delete'])
          parent = os.environ['GITHUB_SHA']
          base = api('git/commits/'+parent)['tree']['sha']
          tree = api('git/trees',{'base_tree':base,'tree':entries})
          result = {'parentSha':parent,'treeSha':tree['sha'],'blobCount':len(data['expectedBlobs']),'payloadSha256':os.environ['PAYLOAD_SHA256']}
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'ci-implementation-objects.json'
          output.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-implementation-objects
          path: ${{ runner.temp }}/ci-implementation-objects.json
          if-no-files-found: error
          retention-days: 3
