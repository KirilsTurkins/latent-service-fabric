{
  "name": "C ordinary HTTP Stat and Range qualification",
  "on": {
    "workflow_dispatch": null,
    "push": {
      "branches": [
        "development"
      ],
      "paths": [
        ".github/workflows/c-http-stat-qualification.yml",
        "tools/c_http_stat_qualification.py",
        "tools/c_libfetch_stat_control.py",
        "tools/tests/test_c_http_stat_qualification.py",
        "tools/tests/fixtures/c-libfetch-stat/**",
        "tools/tests/fixtures/c-libfetch-range/**",
        "tools/c_thread_runtime_node.py",
        "tools/standard_http/**",
        "sdk/c-guest/runtime-fixtures/libfetch/stat-probe.c",
        "sdk/c-guest/src/libfetch/http.c",
        "sdk/c-guest/runtime/**",
        "tools/c_guest/threading.py",
        "crates/latent-component-threading/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "c-http-stat-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "CARGO_BUILD_JOBS": "2",
    "CARGO_INCREMENTAL": "0",
    "CARGO_PROFILE_DEV_DEBUG": "0",
    "CARGO_PROFILE_TEST_DEBUG": "0",
    "CARGO_PROFILE_DEV_DEBUG_ASSERTIONS": "true",
    "CARGO_PROFILE_TEST_DEBUG_ASSERTIONS": "true",
    "CARGO_PROFILE_DEV_OVERFLOW_CHECKS": "true",
    "CARGO_PROFILE_TEST_OVERFLOW_CHECKS": "true"
  },
  "jobs": {
    "ordinary-stat": {
      "name": "Thirteen signed ordinary C HTTP outcomes",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Start the original finite C qualification clock",
          "run": "echo \"LSF_C_LIBFETCH_STARTED_NS=$(date +%s%N)\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13", # v7.0.1 + upstream changes + LSF security fixes
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee", # v7.1.0 + upstream changes + LSF security fixes
          "with": {
            "python-version": "3.13.5"
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5", # 1.97.1
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Restore compiled Rust dependencies",
          "uses": "KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334", # v2.9.3 + upstream changes + LSF security fixes
          "with": {
            "prefix-key": "lsf-ci-dependencies-v2",
            "shared-key": "host-correctness",
            "key": "ubuntu-24.04",
            "cache-targets": true,
            "cache-bin": false,
            "cache-workspace-crates": false,
            "cache-all-crates": false,
            "cache-on-failure": false,
            "save-if": false
          }
        },
        {
          "name": "Install the verified wasm-tools release asset",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\narchive=\"$RUNNER_TEMP/c-http-wasm-tools.tar.gz\"\nbindir=\"$RUNNER_TEMP/c-http-wasm-tools-bin\"\nmkdir \"$bindir\"\ntimeout 90s gh api -H 'Accept: application/octet-stream' repos/bytecodealliance/wasm-tools/releases/assets/483720667 | head -c 5862465 > \"$archive\"\nunset GH_TOKEN\ntest \"$(stat --format=%s \"$archive\")\" = 5862464\nprintf '%s  %s\\n' d0efb16c9c859137b7ab3e99151c299cd47caee106ed4594561002f7a04945bd \"$archive\" | sha256sum --check --strict\ntar -xOzf \"$archive\" wasm-tools-1.254.0-x86_64-linux/wasm-tools > \"$bindir/wasm-tools\"\ntest \"$(stat --format=%s \"$bindir/wasm-tools\")\" = 20231696\nprintf '%s  %s\\n' cc1f862d69363aac2d4a88f01c414a2dcf10858632d0c0a45e93ff60503979d6 \"$bindir/wasm-tools\" | sha256sum --check --strict\nchmod 755 \"$bindir/wasm-tools\"\ntest \"$(\"$bindir/wasm-tools\" --version)\" = 'wasm-tools 1.254.0 (bb58fdf91 2026-07-20)'\nprintf '%s\\n' \"$bindir\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "uses": "KirilsTurkins/lsf-setup-zig@adb5ed78414674f693e8fe00982f83df9badcdb3", # v2.2.1 + upstream changes + LSF security fixes
          "with": {
            "version": "0.16.0"
          }
        },
        {
          "uses": "KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a", # v7.1.0 + upstream changes + LSF security fixes
          "with": {
            "node-version": "24.19.0"
          }
        },
        {
          "name": "Prepare pinned bindings and existing compiler containment",
          "run": "python3 -m pip install --requirement tools/requirements.lock\npython3 tools/install_guest_bindgen.py \"$RUNNER_TEMP/guest-tools\"\necho \"$RUNNER_TEMP/guest-tools\" >> \"$GITHUB_PATH\"\nsudo apt-get update\nsudo apt-get install --yes bubblewrap\nsudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0\n"
        },
        {
          "name": "Build fresh ordinary products and execute thirteen signed libfetch HTTP outcomes",
          "run": "python3 -B -m unittest tools.tests.test_c_http_stat_qualification\npython3 -B tools/c_libfetch_stat_control.py --wasm32 --zig \"$(command -v zig)\" --node \"$(command -v node)\"\npython3 -B tools/c_http_stat_qualification.py --zig \"$(command -v zig)\" --wit-bindgen \"$(command -v wit-bindgen)\" --wasm-tools \"$(command -v wasm-tools)\" --output \"$RUNNER_TEMP/c-http-stat\""
        },
        {
          "name": "Retain original bounded proof including failures",
          "if": "always()",
          "uses": "KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc", # v7.0.2 + upstream changes + LSF security fixes
          "with": {
            "name": "c-http-stat-${{ github.run_id }}",
            "path": "${{ runner.temp }}/c-http-stat/qualified.json\n${{ runner.temp }}/c-http-stat/FAILED.json\n${{ runner.temp }}/c-http-stat/logs/**\n${{ runner.temp }}/c-http-stat/owner-inputs/**\n${{ runner.temp }}/c-http-stat/project/**\n${{ runner.temp }}/c-http-stat/build/**\n${{ runner.temp }}/c-http-stat/native-build/logs/**\n${{ runner.temp }}/c-http-stat/native-build/native/native-tuple.json\n${{ runner.temp }}/c-http-stat/node/qualified.json\n${{ runner.temp }}/c-http-stat/node/FAILED.json\n${{ runner.temp }}/c-http-stat/node/signed/release-set.json\n${{ runner.temp }}/c-http-stat/node/signed/c-thread-runtime/package/**\n${{ runner.temp }}/c-http-stat/node/signed/c-thread-runtime/evidence/**\n${{ runner.temp }}/c-http-stat/node/signed/c-thread-runtime/deployment.json\n${{ runner.temp }}/c-http-stat/node/controls/**\n${{ runner.temp }}/c-http-stat/node/commands/logs/**\n${{ runner.temp }}/c-http-stat/node/invocation-*.json\n${{ runner.temp }}/c-http-stat/node/barrier-*.json\n${{ runner.temp }}/c-http-stat/node/peer-*.json\n${{ runner.temp }}/c-http-stat/node/retirement-*.json\n${{ runner.temp }}/c-http-stat/node/missing-provider/**\n${{ runner.temp }}/c-http-stat/node/*.stdout\n${{ runner.temp }}/c-http-stat/node/*.stderr",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "if": "github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')"
    }
  }
}
