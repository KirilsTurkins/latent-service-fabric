name: TypeScript threading source-proof repair
on:
  push:
    branches: [feat/typescript-runtime-745]
    paths: [.github/workflows/typescript-threading-source-repair.yml]
permissions:
  contents: write
concurrency:
  group: typescript-threading-source-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/typescript-runtime-745'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - name: Apply exact tested source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          root = Path('crates/latent-component-threading/src')
          expected = {
              'admission.rs': ('59b12cd443aa78c247a9957b10ec73cec8ac286e', 'd5f9d6a383600fa0ea87b21a5bb1c2fad15cc112'),
              'rust_objects.rs': ('2b2e13341dc6d664d0260aeb2f344e15539f9fd3', 'd00686437fcd217cafdbce77bcc741a5e71f961b'),
          }
          for path, sha in {
              'admission/derived_names.rs': '0f62280627c2938bdb8f4c59d3ebe8ee75ff7474',
              'admission/tests/names.rs': 'd0a6e06c5a7a4fd2826f350689e5354da32c6710',
          }.items():
              assert blob((root/path).read_bytes()) == sha, path
          source = {}
          for path, (before, _) in expected.items():
              data = (root/path).read_bytes()
              assert blob(data) == before, path
              source[path] = data.decode()
          def replace(path, old, new):
              assert source[path].count(old) == 1, (path, old)
              source[path] = source[path].replace(old, new)
          replace('admission.rs', 'use wasmparser::{ElementItems, ElementKind};',
                  'use wasmparser::{ElementItems, ElementKind};\n\nmod derived_names;')
          replace('admission.rs', '    references: u64,\n}',
                  '    references: u64,\n    derived_names: bool,\n}')
          replace('admission.rs', '    fn parse_function_section(\n', '''    fn parse_custom_name_subsection(
                  &mut self,
                  names: &mut wasm_encoder::NameSection,
                  section: wasmparser::Name<'_>,
              ) -> Result<(), reencode::Error<Self::Error>> {
                  if self.derived_names {
                      derived_names::subsection(self, names, section)
                  } else {
                      reencode::utils::parse_custom_name_subsection(self, names, section)
                  }
              }
          ''' + '    fn parse_function_section(\n')
          replace('admission.rs', '    let original_digest = Sha256::digest(input).into();', '''    transform(input, expected_preimage, false)
          }

          // Only the authenticated original-object derivation may retain the historical
          // name-row order of its own intermediate. This is not a guest-selectable mode.
          pub(super) fn transform_derived_thread_admission(
              input: &[u8],
              expected_preimage: [u8; 32],
          ) -> Result<(Vec<u8>, AdmissionReceipt), &'static str> {
              transform(input, expected_preimage, true)
          }

          fn transform(
              input: &[u8],
              expected_preimage: [u8; 32],
              derived_names: bool,
          ) -> Result<(Vec<u8>, AdmissionReceipt), &'static str> {
              let original_digest = Sha256::digest(input).into();''')
          replace('admission.rs', '        references: 0,\n', '        references: 0,\n        derived_names,\n')
          replace('admission.rs', 'mod tests {\n    use super::*;', 'mod tests {\n    mod names;\n\n    use super::*;')
          replace('rust_objects.rs', '    let (derived, _) = super::transform_owned_thread_admission(&rooted, root.derived_digest)?;',
                  '    let (derived, _) =\n        super::admission::transform_derived_thread_admission(&rooted, root.derived_digest)?;')
          for path, (_, after) in expected.items():
              data = source[path].encode()
              assert blob(data) == after, (path, blob(data), after)
              (root/path).write_bytes(data)
          PY
      - name: Format only the changed source family
        run: |
          rustfmt --edition 2021 --config-path rustfmt.toml crates/latent-component-threading/src/admission.rs crates/latent-component-threading/src/rust_objects.rs
          git diff --check
      - name: Default source proof
        run: cargo test -p latent-component-threading --lib --locked
      - name: All-feature historical source proof
        run: cargo test -p latent-component-threading --lib --all-features --locked
      - name: Combined preview source proof
        run: cargo test -p latent-component-threading --lib --features rust-http-combined-preview-diagnostic --locked
      - name: Commit verified implementation and remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'crates/latent-component-threading/src/admission.rs',
              'crates/latent-component-threading/src/rust_objects.rs',
              'crates/latent-component-threading/src/admission/derived_names.rs',
              'crates/latent-component-threading/src/admission/tests/names.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= expected, sorted(changed - expected)
          assert {'crates/latent-component-threading/src/admission.rs', 'crates/latent-component-threading/src/rust_objects.rs'} <= changed
          PY
          test "$(git ls-remote origin refs/heads/feat/typescript-runtime-745 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/typescript-threading-source-repair.yml
          git add crates/latent-component-threading/src/admission.rs crates/latent-component-threading/src/rust_objects.rs crates/latent-component-threading/src/admission/derived_names.rs crates/latent-component-threading/src/admission/tests/names.rs
          git diff --cached --check
          git commit -m 'fix(threading): preserve authenticated derived name maps' -m 'Keep public parsing strict and all frozen source/component bytes unchanged. Validate function domains, duplicates, inner maps and syntax on the private original-object path. Default, all-feature and combined-preview library suites passed with the repository locked dependencies. No runtime profile or budget is promoted.'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/feat/typescript-runtime-745
