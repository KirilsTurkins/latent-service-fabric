name: Java self-loop checkpoint control
on:
  push:
    branches: ['fix/java-checkpoint-self-loop-20261105', 'feat/java-network-borrows-20261104']
permissions:
  contents: read
concurrency:
  group: java-self-loop-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkpoint-model:
    name: Pinned TeaVM self-edge and real Java loop controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@63c7977881fc344a6ed464f7ed5e242aedc8d56c # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: Exercise the actual selected plugin and loop controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/qualify_java_self_loop.py --output "$RUNNER_TEMP/java-self-loop"
      - name: Retain bounded plugin model observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-self-loop-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/java-self-loop/result.json
            ${{ runner.temp }}/java-self-loop/commands.json
            ${{ runner.temp }}/java-self-loop/commands/logs/**
