name: PR1371 integration review
on:
  push:
    branches: [ci/pr1371-integration-review-20261101]
    paths: [.github/workflows/pr1371-integration-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          ref: 0ef909fda133933fddced7c52b17e2863ccf06a1
          persist-credentials: false
      - name: Export only historical Git objects absent from the reviewed head
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1371-history'
          out.mkdir()
          text = (root / '.github/workflows/ci.yml').read_text()
          block = text.split('      - name: Fetch exact historical source inputs for Python preservation controls\n', 1)[1].split('      - name: Install Python validator dependencies\n', 1)[0]
          refs = list(dict.fromkeys(re.findall(r'\b[0-9a-f]{40}\b', block) + ['cddfb5d016a6311ed0db4673e490dc9caad917dd', '72fb8969352b37eb5c9f4f9cd0cfec9845fc9f1a']))
          assert len(refs) == 30
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', *refs], check=True, timeout=240)
          selected = subprocess.check_output(['git', 'rev-list', '--objects', '--no-object-names', *refs, '^HEAD'], timeout=60)
          objects = sorted(set(selected.splitlines()))
          assert 0 < len(objects) <= 100000
          with (out / 'history.pack').open('wb') as dest:
              subprocess.run(['git', 'pack-objects', '--stdout'], input=b'\n'.join(objects) + b'\n', stdout=dest, check=True, timeout=120)
          assert (out / 'history.pack').stat().st_size <= 512 * 1024**2
          (out / 'shallow').write_bytes((root / '.git/shallow').read_bytes())
          for name in ('tools/c_thread_runtime_node.py', 'sdk/c-guest/src/closed-file-abi.c'):
              raw = subprocess.check_output(['git', 'show', refs[-1] + ':' + name], timeout=30)
              (out / name.replace('/', '_')).write_bytes(raw)
          report = {'base': '0ef909fda133933fddced7c52b17e2863ccf06a1', 'refs': refs, 'objects': len(objects), 'packBytes': (out / 'history.pack').stat().st_size, 'packSha256': hashlib.file_digest((out / 'history.pack').open('rb'), 'sha256').hexdigest()}
          (out / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: pr1371-historical-inputs
          path: ${{ runner.temp }}/pr1371-history/
          if-no-files-found: error
          retention-days: 3
