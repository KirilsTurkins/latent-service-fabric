name: PR1371 integration review
on:
  push:
    branches: [ci/pr1371-integration-review-20261101]
    paths: [.github/workflows/pr1371-integration-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retain exact failing-run diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr1371-review"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1371-review'
          api = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric'
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  assert urllib.parse.urlsplit(newurl).scheme == 'https'
                  new = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if urllib.parse.urlsplit(newurl).netloc != urllib.parse.urlsplit(req.full_url).netloc:
                      new.remove_header('Authorization')
                      new.remove_header('Accept')
                  return new
          opener = urllib.request.build_opener(Redirect())
          def get(path):
              request = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with opener.open(request, timeout=60) as response:
                  data = response.read(32 * 1024 * 1024 + 1)
                  assert len(data) <= 32 * 1024 * 1024
                  return data
          summaries = {}
          for run_id in (41247721989, 41247721977):
              run = json.loads(get(f'/actions/runs/{run_id}'))
              assert run['head_sha'] == '0ef909fda133933fddced7c52b17e2863ccf06a1'
              jobs = json.loads(get(f'/actions/runs/{run_id}/jobs?per_page=100'))['jobs']
              report = []
              for job in jobs:
                  if job['conclusion'] != 'failure':
                      continue
                  raw = get(f"/actions/jobs/{job['id']}/logs")
                  (root / f"{job['id']}.log").write_bytes(raw)
                  lines = raw.decode('utf-8-sig').splitlines()
                  relevant = []
                  for i, line in enumerate(lines):
                      if re.search(r'\b(?:FAIL|ERROR): |^\S+ (?:FAILED \(|Ran \d+ tests|.*[Aa]ssertionError:|.*[Ee]rror:)', line):
                          relevant.extend(x[:700] for x in lines[max(0,i-1):min(len(lines),i+9)])
                  entry = {'job': job['id'], 'name': job['name'], 'logSha256': hashlib.sha256(raw).hexdigest(), 'diagnostics': list(dict.fromkeys(relevant))}
                  report.append(entry)
                  print(json.dumps(entry))
              summaries[str(run_id)] = report
          (root / 'summary.json').write_text(json.dumps(summaries, indent=2))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: pr1371-integration-failure-logs
          path: ${{ runner.temp }}/pr1371-review/
          if-no-files-found: error
          retention-days: 3
