name: Issue 22 validation

on:
  push:
    branches:
      - feat/issue-22-containment-runner
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Workspace and containment crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check complete workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Run Clippy on complete workspace
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Run scheduler tests explicitly
        run: cargo test -p latent-scheduler --all-targets --locked
      - name: Run complete workspace tests
        run: cargo test --workspace --all-targets --all-features --locked

  real-containment:
    name: Real Component Model containment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install repository validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Build and execute real containment fixtures
        run: tools/validate_contracts.sh
