name: Issue 22 validation

on:
  push:
    branches:
      - feat/issue-22-containment-runner

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Format sources
        run: cargo fmt --all
      - name: Refresh lockfile
        run: cargo generate-lockfile
      - name: Check containment crates
        run: cargo check -p latent-executor -p latent-wasmtime -p latent-node --all-targets
      - name: Test containment crates
        run: cargo test -p latent-executor -p latent-wasmtime -p latent-node --all-targets
      - name: Commit generated validation changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates
          git commit -m "build: format issue 22 and refresh the lockfile"
          git push
