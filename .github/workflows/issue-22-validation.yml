name: Issue 23 bootstrap via pull request

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-check:
    name: Materialize and compile Issue 23
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Materialize the implementation bundle
        run: |
          cat .github/issue-23-staging/part-* | base64 --decode > /tmp/issue-23.tar.gz
          tar --extract --gzip --file /tmp/issue-23.tar.gz --directory .
          rm -rf .github/issue-23-staging .github/workflows/issue-23-bootstrap.yml
          git fetch origin development
          git checkout origin/development -- .github/workflows/issue-22-validation.yml
          cargo fmt --all
          cargo generate-lockfile
      - name: Compile the executable composition root
        run: cargo check -p latentd --all-targets --locked
      - name: Publish the implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: compose the Phase 0 executable spike"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
