name: Physical result owner retirement

on:
  push:
    branches: ['feat/result-box-retirement-20261023', 'development']
    paths:
      - 'crates/vendor/bytes/**'
      - 'crates/latent-core/src/result_payload.rs'
      - 'crates/latent-core/src/native_capacity.rs'
      - 'crates/latent-core/src/native_capacity/**'
      - 'crates/latent-http/src/protocol.rs'
      - 'crates/latent-http/src/protocol/**'
      - 'crates/latent-http/src/deferred/request.rs'
      - 'crates/latent-http/src/tests/protocol.rs'
      - 'crates/latent-capabilities/src/broker/pools.rs'
      - 'crates/latent-capabilities/src/broker/pools/**'
      - 'crates/latent-capabilities/src/broker/network.rs'
      - 'crates/latent-capabilities/src/broker/session.rs'
      - 'crates/latent-capabilities/src/broker/session/**'
      - 'crates/latent-capabilities/src/broker/tests/fixture.rs'
      - 'crates/latent-core/src/budget.rs'
      - 'crates/latent-core/src/budget/**'
      - 'crates/latent-streams/src/connection.rs'
      - 'crates/latent-manifest/tests/fixtures/valid-capsule-v1alpha1.json'
      - 'tools/stream_scope_retirement_witness.py'
      - 'tools/stream_scope_retirement_witness.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/latent-blobs/src/s3/provider/handles.rs'
      - 'crates/latent-blobs/src/s3/provider/remote.rs'
      - 'crates/latent-blobs/src/s3/provider/seal.rs'
      - 'tools/protocol_page_retirement_witness.py'
      - 'tools/protocol_page_retirement_witness.rs'
      - 'tools/native_capacity_retirement_witness.rs'
      - '.github/workflows/result-owner-retirement.yml'
  pull_request:
    paths:
      - 'crates/vendor/bytes/**'
      - 'crates/latent-core/src/result_payload.rs'
      - 'crates/latent-core/src/native_capacity.rs'
      - 'crates/latent-core/src/native_capacity/**'
      - 'crates/latent-http/src/protocol.rs'
      - 'crates/latent-http/src/protocol/**'
      - 'crates/latent-http/src/deferred/request.rs'
      - 'crates/latent-http/src/tests/protocol.rs'
      - 'crates/latent-capabilities/src/broker/pools.rs'
      - 'crates/latent-capabilities/src/broker/pools/**'
      - 'crates/latent-capabilities/src/broker/network.rs'
      - 'crates/latent-capabilities/src/broker/session.rs'
      - 'crates/latent-capabilities/src/broker/session/**'
      - 'crates/latent-capabilities/src/broker/tests/fixture.rs'
      - 'crates/latent-core/src/budget.rs'
      - 'crates/latent-core/src/budget/**'
      - 'crates/latent-streams/src/connection.rs'
      - 'crates/latent-manifest/tests/fixtures/valid-capsule-v1alpha1.json'
      - 'tools/stream_scope_retirement_witness.py'
      - 'tools/stream_scope_retirement_witness.rs'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/latent-blobs/src/s3/provider/handles.rs'
      - 'crates/latent-blobs/src/s3/provider/remote.rs'
      - 'crates/latent-blobs/src/s3/provider/seal.rs'
      - 'tools/protocol_page_retirement_witness.py'
      - 'tools/protocol_page_retirement_witness.rs'
      - 'tools/native_capacity_retirement_witness.rs'
      - '.github/workflows/result-owner-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: result-owner-retirement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-owner:
    name: Actual owner allocation and final-clone retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Compile only the std-only bytes crate and allocator observer
        shell: bash
        run: |
          rustc --edition=2021 --crate-name=bytes --crate-type=rlib --cfg 'feature="std"' \
            crates/vendor/bytes/src/lib.rs -o "$RUNNER_TEMP/libbytes.rlib"
          rustc --edition=2021 --test crates/vendor/bytes/tests/test_owner_retirement.rs \
            --extern "bytes=$RUNNER_TEMP/libbytes.rlib" -o "$RUNNER_TEMP/result-owner-tests"
      - name: Observe actual allocation frees through clones, copies, races and unwind
        shell: bash
        run: '"$RUNNER_TEMP/result-owner-tests" --test-threads=1'
  protocol-page-owner:
    name: Actual protocol page allocation retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Observe managed and legacy protocol page allocations
        run: python3 tools/protocol_page_retirement_witness.py
  stream-scope-owner:
    name: Actual stream scope allocation retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Observe managed and legacy stream scope allocations
        run: python3 tools/stream_scope_retirement_witness.py
