name: TypeScript tracking retirement resource limits
on:
  push:
    branches: ['feat/typescript-tracking-limits-20261021']
    paths:
      - '.github/workflows/typescript-tracking-limits.yml'
      - 'sdk/typescript-guest/probes/runtime-limits/**'
      - 'tools/typescript_runtime_limits.py'
      - 'tools/typescript_tracking_replay_inputs.py'
      - 'tools/qualify_typescript_runtime_limits.py'
      - 'tools/tests/test_typescript_runtime_limits.py'
      - 'tools/tests/test_typescript_tracking_replay_inputs.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-tracking-limits-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch-conformance:
    name: Signed independent task queue native timer and memory boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@34275fdec80b5be172c3327cadef76aa2f3b31c6 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check independent resource-limit evidence controls
        run: python3 -B -m unittest tools.tests.test_typescript_runtime_limits tools.tests.test_typescript_tracking_replay_inputs -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/runtime-limits-tools"
      - name: Fetch the immutable native producer source
        run: git fetch --no-tags --depth=1 origin 357eecbd7744bbc026741d241b679966d14b0e95
      - name: Acquire successful tracking engine jobs and exact native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_tracking_replay_inputs.py --output "$RUNNER_TEMP/runtime-limits-original"
      - name: Build sign and execute ordinary JavaScript resource boundaries
        run: python3 -B tools/qualify_typescript_runtime_limits.py --tracking-retirement --acquired "$RUNNER_TEMP/runtime-limits-original" --tools "$RUNNER_TEMP/runtime-limits-tools" --output "$RUNNER_TEMP/runtime-limits"
      - name: Retain exact source compiler results real contacts and physical ownership
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-tracking-limits-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-limits-original/acquisition.json
            ${{ runner.temp }}/runtime-limits-original/native/*.json
            ${{ runner.temp }}/runtime-limits/*.json
            ${{ runner.temp }}/runtime-limits/build/*.json
            ${{ runner.temp }}/runtime-limits/build/*.wit
            ${{ runner.temp }}/runtime-limits/build/component.wasm
            ${{ runner.temp }}/runtime-limits/build/package/**
            ${{ runner.temp }}/runtime-limits/build/logs/
            ${{ runner.temp }}/runtime-limits/node/*.json
            ${{ runner.temp }}/runtime-limits/node/*/*.json
            ${{ runner.temp }}/runtime-limits/node/*/controls/
          if-no-files-found: warn
          retention-days: 7
