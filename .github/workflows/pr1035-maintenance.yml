name: PR 1035 integration workspace
on:
  push:
    branches: [feat/sdk-go-dependency-lifecycle-20261016]
    paths: [.github/workflows/pr1035-maintenance.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install pinned validation prerequisites
        run: python -m pip install -r tools/requirements.lock
      - name: Reproduce the exact locally reviewed integration tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess, yaml
          # Reuse the already reviewed, content-addressed merge recipe. Its
          # exact-tree assertion remains mandatory before any object export.
          sha = '387999c0d4d5dae3a0cf4f8969776b4cbc464d32'
          raw = subprocess.check_output(['git', 'cat-file', 'blob', sha])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
          steps = yaml.safe_load(raw)['jobs']['prepare']['steps']
          selected = [step['run'] for step in steps if step.get('name') == 'Prepare the locally reviewed merge without write credentials']
          assert len(selected) == 1
          subprocess.run(['bash', '-euo', 'pipefail', '-c', selected[0]], check=True)
          PY
      - name: Validate reviewed command coverage and action policy
        run: |
          python tools/ci_coverage.py
          python tools/validate_workflow_actions.py
      - name: Test Go authoring and controller contracts with pinned Python
        run: |
          python -m unittest tools.tests.test_go_application_dependencies tools.tests.test_go_capsule_authoring tools.tests.test_go_dependency_authoring tools.tests.test_go_dependency_recovery tools.tests.test_go_dependency_watch tools.tests.test_go_frontend_dependencies tools.tests.test_go_generator_authoring tools.tests.test_go_native_authoring tools.tests.test_go_runtime_overlay tools.tests.test_dev_contracts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr1035-reviewed-tree
          path: ${{ runner.temp }}/pr1035-reviewed-tree.json
          retention-days: 1
          if-no-files-found: error
  store-objects:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr1035-reviewed-tree
          path: ${{ runner.temp }}/pr1035-reviewed-tree
      - name: Store verified Git objects without changing commits branches or checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          expected = 'f05898f07eb9f7fc3eeb5fe25f2ed43be6ade3eb'
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr1035-reviewed-tree/pr1035-reviewed-tree.json').read_text())
          assert data['tree'] == expected and data['base'] == '8421308546a9080e39426ff9cc6a3eae74c6b6a1'
          assert data['head'] == 'abce74a96c79c923f72ddd8c122351dbe4db1c13' and len(data['entries']) == 32
          endpoint = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/'
          def create(kind, body):
              assert kind in {'blobs', 'trees'}
              request = urllib.request.Request(endpoint + kind, data=json.dumps(body).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for item in data['entries']:
              raw = base64.b64decode(item['content'], validate=True)
              assert len(raw) < 1048576 and item['mode'] == '100644' and item['type'] == 'blob'
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == item['sha']
              result = create('blobs', {'content': item['content'], 'encoding': 'base64'})
              assert result['sha'] == item['sha']
              entries.append({key: item[key] for key in ('path', 'mode', 'type', 'sha')})
          result = create('trees', {'base_tree': '3f1f94bff5cb28b23b082cd6a3f9f3e73bc43224', 'tree': entries})
          assert result['sha'] == expected
          receipt = {'tree': expected, 'base': data['base'], 'parent': os.environ['GITHUB_SHA'], 'branchesChanged': False}
          (Path(os.environ['RUNNER_TEMP']) / 'pr1035-integration-tree.json').write_text(json.dumps(receipt))
          print('Stored reviewed tree:', expected)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr1035-integration-tree
          path: ${{ runner.temp }}/pr1035-integration-tree.json
          retention-days: 1
          if-no-files-found: error
