name: PR 1035 integration workspace
on:
  push:
    branches: [feat/sdk-go-dependency-lifecycle-20261016]
    paths: [.github/workflows/pr1035-maintenance.yml]
permissions:
  contents: read
jobs:
  source-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export only tracked integration inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pr1035-integration"
          base=$(git merge-base HEAD origin/development)
          git rev-parse HEAD origin/development "$base" > "$RUNNER_TEMP/pr1035-integration/refs.txt"
          git rev-parse 'HEAD^{tree}' 'origin/development^{tree}' "$base^{tree}" > "$RUNNER_TEMP/pr1035-integration/trees.txt"
          git pack-objects --revs --stdout < "$RUNNER_TEMP/pr1035-integration/trees.txt" > "$RUNNER_TEMP/pr1035-integration/sources.pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1035-integration-objects
          path: ${{ runner.temp }}/pr1035-integration/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
