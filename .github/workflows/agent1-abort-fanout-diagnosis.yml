name: Agent 1 abort fan-out reproduction inputs

on:
  push:
    branches: ['fix/typescript-abort-fanout-refusal-1852-agent1']
    paths: ['.github/workflows/agent1-abort-fanout-diagnosis.yml']

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-node@34275fdec80b5be172c3327cadef76aa2f3b31c6
        with:
          node-version: '24.19.0'
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce
        with:
          version: '1.254.0'
      - name: Capture checkout without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/agent1-inputs"
          tar -czf "$RUNNER_TEMP/agent1-inputs/checkout.tar.gz" .
      - name: Install pinned frontend and capture executables
        run: |
          python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/agent1-tools"
          mkdir -p "$RUNNER_TEMP/agent1-tools/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/agent1-tools/bin/node"
          cp "$(command -v wasm-tools)" "$RUNNER_TEMP/agent1-tools/bin/wasm-tools"
          tar -czf "$RUNNER_TEMP/agent1-inputs/frontend.tar.gz" -C "$RUNNER_TEMP/agent1-tools" .
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: agent1-abort-fanout-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/agent1-inputs/*.tar.gz
          if-no-files-found: error
          retention-days: 7
