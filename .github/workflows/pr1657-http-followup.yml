name: PR 1657 HTTP continuation preparation and regression
on:
  push:
    branches: ['diag/pr1657-http-followup-20261106']
permissions:
  contents: read
concurrency:
  group: pr1657-http-followup-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source:
    name: Prepare only the reviewed continuation on the exact PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Apply the seven bounded changes without carrying preparation files into the PR
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pr1657-http-followup"
          mkdir -p "$stage"
          cp .github/pr1657_http_followup.py "$stage/apply.py"
          cp .github/pr1657-http-tests.rs "$stage/http-tests.rs"
          cp .github/pr1657-capacity-tests.py "$stage/capacity-tests.py"
          git fetch --no-tags --depth=1 origin 46156d8dd5f6f2954b175108ce8d2d1a96d11c00
          git checkout --detach 46156d8dd5f6f2954b175108ce8d2d1a96d11c00
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B "$stage/apply.py" apply
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          from tools.ci_cargo import format_command
          command = format_command(Path.cwd())
          assert command[-1] == '--check' and '--all' not in command
          subprocess.run(command[:-1], check=True)
          subprocess.run(command, check=True)
          PY
          git diff --check
          python3 -B -c 'from tools.ci_coverage import validate; validate(); print("CI contracts passed")'
          python3 -B -m unittest tools.tests.test_rust_thread_http_combined_node tools.tests.test_rust_thread_http_sibling -v
      - name: Publish exact source objects without updating any branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B "$RUNNER_TEMP/pr1657-http-followup/apply.py" publish
      - name: Retain candidate source and identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pr1657-http-followup"
          git diff HEAD --binary > "$stage/continuation.patch"
          if test -f "$stage/paths.json"; then
            python3 -B - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          stage = Path(os.environ['RUNNER_TEMP']) / 'pr1657-http-followup'
          with tarfile.open(stage / 'source.tar.gz', 'w:gz') as archive:
              for name in json.loads((stage / 'paths.json').read_bytes()):
                  archive.add(name, arcname=name)
          PY
          fi
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-http-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr1657-http-followup/
          retention-days: 7
          if-no-files-found: error
  regression:
    name: Original pool and HTTP regressions on the published candidate
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Exercise all pool and HTTP library cases and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr1657-http-regression"
          mkdir -p "$out"
          git rev-parse HEAD | tee "$out/source.txt"
          cargo test --locked -p latent-capabilities --lib broker::pools:: -- --nocapture --test-threads=1 2>&1 | tee "$out/pools.log"
          cargo test --locked -p latent-http --lib -- --nocapture --test-threads=1 2>&1 | tee "$out/http.log"
          cargo clippy --locked -p latent-capabilities -p latent-http --lib --tests -- -D warnings 2>&1 | tee "$out/clippy.log"
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-http-regression-${{ needs.source.outputs.sha }}
          path: ${{ runner.temp }}/pr1657-http-regression/
          retention-days: 7
          if-no-files-found: warn
