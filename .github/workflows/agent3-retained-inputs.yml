name: Agent 3 retained diagnostic inputs
on:
  push:
    branches: ['fix/typescript-745-activation-resource-ownership']
    paths: ['.github/workflows/agent3-retained-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: agent3-retained-inputs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and verify original artifact bytes without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent3-inputs"
          cd "$RUNNER_TEMP/agent3-inputs"
          gh api /repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13637415610/zip > original.zip
          echo '6e8464acdacb41dfd205c897bf06355302f0874d73190691d277cbf346570bde  original.zip' | sha256sum --check
          test "$(stat -c %s original.zip)" = 567105665
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('original.zip') as archive:
              rows = [{'path': item.filename, 'bytes': item.file_size} for item in archive.infolist()]
          Path('inventory.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY
          split -b 285000000 -d -a 1 original.zip runtime-part-
          sha256sum runtime-part-* > parts.sha256
          curl --fail --location --retry 2 --max-time 600 --output wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          echo '0507679dff16814b74516cd969a9b16d2ced1347388024bc7966264648c78bfb  wasi-sdk.tar.gz' | sha256sum --check
          test "$(stat -c %s wasi-sdk.tar.gz)" = 119449290
      - name: Retain original first half
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: agent3-runtime-part-0
          path: ${{ runner.temp }}/agent3-inputs/runtime-part-0
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain original second half
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: agent3-runtime-part-1
          path: ${{ runner.temp }}/agent3-inputs/runtime-part-1
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain pinned compiler and inventory
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: agent3-wasi-sdk-and-inventory
          path: |
            ${{ runner.temp }}/agent3-inputs/wasi-sdk.tar.gz
            ${{ runner.temp }}/agent3-inputs/inventory.json
            ${{ runner.temp }}/agent3-inputs/parts.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
