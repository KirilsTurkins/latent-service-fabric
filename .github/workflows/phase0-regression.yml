name: Phase 0 runtime regression

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Executable and invariant smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install Python validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install retained-evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - name: Check Phase 0 runner syntax
        run: >-
          bash -n
          tools/run_phase0_baselines.sh
          tools/run_phase0_gate.sh
          tools/run_phase0_outcome_matrix.sh
          tools/run_phase0_spike.sh
      - name: Run deterministic runtime baseline
        run: |
          unset CARGO_INCREMENTAL
          tools/run_phase0_baselines.sh smoke "${RUNNER_TEMP}/phase0-regression/baseline"
      - name: Run executable outcome and recovery matrix
        run: bash tools/run_phase0_outcome_matrix.sh
      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase0-runtime-regression-${{ github.sha }}
          path: ${{ runner.temp }}/phase0-regression
          if-no-files-found: warn
          retention-days: 14
