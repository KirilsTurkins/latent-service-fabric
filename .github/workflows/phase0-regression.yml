name: Phase 0 runtime regression

on:
  pull_request:
    branches:
      - development
    paths:
      - ".github/workflows/phase0-regression.yml"
      - ".cargo/**"
      - "apps/latentd/**"
      - "crates/latent-activation/**"
      - "crates/latent-artifacts/**"
      - "crates/latent-component-bindings/**"
      - "crates/latent-core/**"
      - "crates/latent-executor/**"
      - "crates/latent-manifest/**"
      - "crates/latent-node/**"
      - "crates/latent-routing/**"
      - "crates/latent-scheduler/**"
      - "crates/latent-wasmtime/**"
      - "benchmarks/phase0/**"
      - "examples/echo-contract/**"
      - "wit/**"
      - "tools/toolchain-smoke/**"
      - "tools/aggregate_phase0_calibration.py"
      - "tools/aggregate_phase0_hot_path_profiles.py"
      - "tools/aggregate_phase0_resource_soak.py"
      - "tools/build_echo_capsule.py"
      - "tools/phase0_build_environment.sh"
      - "tools/phase0_collector_identity.py"
      - "tools/phase0_evidence.py"
      - "tools/reassemble_phase0_hot_path_profile_archive.py"
      - "tools/run_phase0_baselines.sh"
      - "tools/tests/test_aggregate_phase0_calibration.py"
      - "tools/tests/test_aggregate_phase0_hot_path_profiles.py"
      - "tools/tests/test_aggregate_phase0_resource_soak.py"
      - "tools/tests/test_reassemble_phase0_hot_path_profile_archive.py"
      - "tools/toolchain.toml"
      - "tools/requirements.lock"
      - "tools/validate_contracts.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Executable and invariant smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install Python validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Install retained-evidence archive verifier
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Run deterministic runtime baseline
        run: |
          unset CARGO_INCREMENTAL
          tools/run_phase0_baselines.sh smoke "${RUNNER_TEMP}/phase0-regression/baseline"
      - name: Run executable outcome and recovery matrix
        run: |
          target_root="${CARGO_TARGET_DIR:-${GITHUB_WORKSPACE}/target}"
          if [[ "${target_root}" != /* ]]; then
            target_root="${GITHUB_WORKSPACE}/${target_root}"
          fi
          test -f "${target_root}/capsules/echo/capsule.json"
          test -f "${target_root}/capsules/containment/containment-capsule.wasm"
          LSF_ECHO_CAPSULE="${target_root}/capsules/echo/capsule.json" \
          LSF_CONTAINMENT_COMPONENT="${target_root}/capsules/containment/containment-capsule.wasm" \
            cargo test -p latentd --test phase0_spike_e2e --locked -- --ignored --nocapture
      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-runtime-regression-${{ github.sha }}
          path: ${{ runner.temp }}/phase0-regression
          if-no-files-found: warn
          retention-days: 14
