name: PR 1587 repair validation

on:
  push:
    branches: [diag/dotnet-original-v3-trap-20261031]
    paths: [.github/workflows/pr1587-repair-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diag/dotnet-original-v3-trap-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - name: Install locked validation requirements
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Apply only the reviewed repairs and preserve historical obligations
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, shutil, subprocess, zlib
          from tools import ci_contracts
          root = pathlib.Path.cwd()
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^']).decode().strip() == 'dc4b2f31af5f1dc3e0afec022c61cea89ecff744'
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5791b0dc29d0c87ba48de9e1657cf5e78ad028aca8ea6d7eba80383ba72e970e'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          (root / '.github/workflows/pr1587-repair-validation.yml').unlink()
          for job in ('profile', 'result'):
              proposal = ci_contracts.propose(root, 'job', '.github/workflows/ci.yml', job,
                  root / 'target/ci/proposals', 'Restore the complete sparse-checkout suite loader and owner-local case fragments. Preserve every selected job, command, trigger and historical comparison.')
              shutil.copyfile(proposal, root / ci_contracts.DIRECTORY / proposal.relative_to(root / 'target/ci/proposals'))
          proposal = ci_contracts.propose(root, 'python', 'tools/tests/test_ci_profile.py', None,
              root / 'target/ci/proposals', 'Add an unignored isolated local-Git sparse-checkout regression for both selection and aggregation; compare complete catalogue identities and exercise success and failure without inherited Python paths.')
          shutil.copyfile(proposal, root / ci_contracts.DIRECTORY / proposal.relative_to(root / 'target/ci/proposals'))
          with (root / 'docs/testing/dotnet-original-v3-trap.md').open('a') as out:
              out.write('\nRun 41217608479 at `dc4b2f31af5f1dc3e0afec022c61cea89ecff744`\n(artifact 13048078525) stopped while compiling the diagnostic host: the admission\ncontrol referenced `ActivationOutcome` from `latent_core` instead of its owning\n`latent_activation` crate. Neither original mode executed. The correction changes\nonly that type path; it does not alter admission, guest code, authority or limits.\n\nThe CI selector and result aggregator also need the suite-case loader and\n`tools/ci/suites.cases.d/` in their sparse checkouts. Their regression uses actual\nlocal Git sparse checkouts and isolated Python processes, compares the complete\ncatalogue with the full checkout, and checks both successful and rejected result\naggregation. It does not waive missing tests or fall back to a full checkout.\n')
          PY
      - name: Check Rust formatting and focused regressions
        run: |
          mkdir -p "$RUNNER_TEMP/pr1587-repair"
          rustfmt --edition 2021 --config skip_children=true --check crates/latent-wasmtime/tests/local_service.rs
          set -o pipefail
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_ci_contracts tools.tests.test_ci_coverage tools.tests.test_dotnet_original_fault tools.tests.test_validate_workflow_actions tools.tests.test_ci_suite_inventory 2>&1 | tee "$RUNNER_TEMP/pr1587-repair/tests.txt"
          python3 tools/ci_coverage.py --receipt "$RUNNER_TEMP/pr1587-repair/coverage.json"
          git diff --check
      - name: Stage only validated public source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1587-repair'
          paths = ['.github/workflows/ci.yml', 'crates/latent-wasmtime/tests/local_service.rs', 'docs/testing/dotnet-original-v3-trap.md', 'tools/ci/contracts/python/test_ci_profile.py.json', 'tools/ci/contracts/workflows/ci.yml/jobs/profile.json', 'tools/ci/contracts/workflows/ci.yml/jobs/result.json', 'tools/tests/test_ci_profile.py']
          removed = '.github/workflows/pr1587-repair-validation.yml'
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert sorted(changed) == sorted(paths + [removed]), changed
          entries = []
          for name in paths:
              raw = (root / name).read_bytes()
              assert len(raw) <= 131072
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/KirilsTurkins/latent-service-fabric/git/blobs', '--input', '-'], input=json.dumps({'content': raw.decode(), 'encoding': 'utf-8'}).encode(), check=True, capture_output=True, timeout=30)
              sha = json.loads(result.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha, 'sha256': hashlib.sha256(raw).hexdigest()})
          (output / 'objects.json').write_text(json.dumps({'head': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip(), 'entries': entries}, indent=2) + '\n')
          (output / 'validated.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          with tarfile.open(output / 'changed-source.tar.gz', 'w:gz') as archive:
              for name in paths + ['tools/tests/test_dotnet_original_fault.py', 'tools/ci/contracts/python/test_dotnet_original_fault.py.json']:
                  archive.add(root / name, arcname=name)
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        if: always()
        with:
          name: pr1587-repair-${{ github.sha }}
          path: ${{ runner.temp }}/pr1587-repair/
          if-no-files-found: warn
          retention-days: 2
