name: PR 1587 repair validation
on:
  push:
    branches: [diag/dotnet-original-v3-trap-20261031]
    paths: [.github/workflows/pr1587-repair-validation.yml]
permissions:
  contents: write
  actions: read
jobs:
  validate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diag/dotnet-original-v3-trap-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - name: Install locked validation requirements
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Restore exact previously tested repairs and add reviewed replay controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr1587-repair"
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, subprocess, zipfile
          from tools import ci_contracts
          root = pathlib.Path.cwd()
          subprocess.run(['git', 'merge-base', '--is-ancestor', '9c2b67a26ffbe587f73942f3b645ef7bb793a95e', 'HEAD'], check=True)
          archive = subprocess.run(['gh', 'api', 'repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13053635410/zip'], capture_output=True, check=True, timeout=90).stdout
          assert len(archive) == 52548
          assert hashlib.sha256(archive).hexdigest() == 'd1ee7ec4040e8674c5438d33bac40d9d97b8424df9ecc18f9b55c1bcf13caf9b'
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              patch = source.read('validated.patch')
          for extra in (['--check'], []):
              subprocess.run(['git', 'apply', '--exclude=.github/workflows/pr1587-repair-validation.yml', *extra, '-'], input=patch, check=True)
          result = subprocess.run(['gh', 'api', 'repos/KirilsTurkins/latent-service-fabric/git/blobs/3fbd702618a51255e0a7e3882054db4c324f72ac'], capture_output=True, check=True, timeout=30)
          blob = json.loads(result.stdout)
          assert blob['encoding'] == 'base64'
          patch = base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob ' + str(len(patch)).encode() + b'\0' + patch).hexdigest() == '3fbd702618a51255e0a7e3882054db4c324f72ac'
          for extra in (['--check'], []):
              subprocess.run(['git', 'apply', *extra, '-'], input=patch, check=True)
          (root / '.github/workflows/pr1587-repair-validation.yml').unlink()
          path = root / 'tools/ci/contracts/python/test_dotnet_task_runtime.py.json'
          physical = json.loads(path.read_text())
          prior = ci_contracts.semantic_record(physical)
          actual = ci_contracts.python_expectations(root)['tools/tests/test_dotnet_task_runtime.py']
          added = {
              'RootReturnSupplementalControls.test_join_replay_rejects_unreviewed_fixture_identity_before_package_restore',
              'RootReturnSupplementalControls.test_join_replay_source_gate_preserves_complete_protected_membership',
          }
          assert set(actual['cases']) == set(prior['cases']) | added
          assert all(prior['guards'][name] == actual['guards'][name] for name in prior['cases'])
          assert (physical.get('storageCases') == 'guard-keys') != ('cases' in physical)
          for case in added:
              same = next(name for name in prior['cases'] if prior['guards'][name] == actual['guards'][case])
              physical['guards'][case] = physical['guards'][same]
          physical['guards'] = dict(sorted(physical['guards'].items()))
          if 'cases' in physical:
              physical['cases'] = sorted(physical['guards'])
          physical['reviewReason'] = 'Preserve the exact historical replay pins, all existing cases and every existing guard. Add unignored source-identity controls that reject duplicate, missing, altered and mode-changed inputs before package restoration; no runtime or qualification claim is added.'
          semantic = ci_contracts.semantic_record(physical)
          assert semantic['cases'] == actual['cases'] and semantic['guards'] == actual['guards']
          path.write_text(json.dumps(physical, separators=(',', ':')) + '\n')
          with (root / 'docs/testing/dotnet-original-v3-trap.md').open('a') as out:
              out.write('\nThe older flat-u32 join replay retains its original producer/current fixture\nidentities. The evolving original-v3 diagnostic fixture is not silently admitted\nto that historical replay. Its source gate is exercised independently: the frozen\nreviewed pair is accepted, while byte changes, executable-mode changes, duplicate\ninputs, missing inputs and changes to other protected sources fail before package\nrestoration. This replaces a test that incorrectly required the live fixture to\nremain byte-identical forever; it does not refresh historical pins, weaken the\nnormal fifteen-outcome receipt, or grant runtime qualification.\n')
          PY
      - name: Check Rust formatting, focused regressions and exact CI coverage
        run: |
          set -o pipefail
          rustfmt --edition 2021 --config skip_children=true --check crates/latent-wasmtime/tests/local_service.rs
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_ci_contracts tools.tests.test_ci_coverage tools.tests.test_dotnet_original_fault tools.tests.test_validate_workflow_actions tools.tests.test_ci_suite_inventory tools.tests.test_dotnet_task_runtime tools.tests.test_dotnet_task_wait 2>&1 | tee "$RUNNER_TEMP/pr1587-repair/tests.txt"
          python3 tools/ci_coverage.py 2>&1 | tee "$RUNNER_TEMP/pr1587-repair/coverage.txt"
          git diff --check
      - name: Stage validated public source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr1587-repair'
          paths = ['.github/workflows/ci.yml', 'crates/latent-wasmtime/tests/local_service.rs', 'docs/testing/dotnet-original-v3-trap.md', 'tools/ci/contracts/python/test_ci_profile.py.json', 'tools/ci/contracts/workflows/ci.yml/jobs/profile.json', 'tools/ci/contracts/workflows/ci.yml/jobs/result.json', 'tools/tests/test_ci_profile.py', 'tools/dotnet_root_return.py', 'tools/tests/test_dotnet_task_runtime.py', 'tools/ci/contracts/python/test_dotnet_task_runtime.py.json']
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert sorted(changed) == sorted(paths + ['.github/workflows/pr1587-repair-validation.yml']), changed
          entries = []
          for name in paths:
              raw = (root / name).read_bytes()
              assert len(raw) <= 131072
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/KirilsTurkins/latent-service-fabric/git/blobs', '--input', '-'], input=json.dumps({'content': raw.decode(), 'encoding': 'utf-8'}).encode(), check=True, capture_output=True, timeout=30)
              sha = json.loads(result.stdout)['sha']
              assert sha == hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha, 'sha256': hashlib.sha256(raw).hexdigest()})
          (output / 'objects.json').write_text(json.dumps({'head': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip(), 'entries': entries}, indent=2) + '\n')
          with tarfile.open(output / 'changed-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  archive.add(root / name, arcname=name)
          PY
      - name: Retain bounded validation diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr1587-repair"
          git diff > "$RUNNER_TEMP/pr1587-repair/validated.patch"
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        if: always()
        with:
          name: pr1587-repair-${{ github.sha }}
          path: ${{ runner.temp }}/pr1587-repair/
          if-no-files-found: warn
          retention-days: 2
