  task-reference:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task_runtime_replay }}
    name: Focused managed Task runtime with authenticated native products
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.13.5
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.100
    - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      with:
        targets: wasm32-unknown-unknown
        components: rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        prefix-key: lsf-ci-dependencies-v2
        shared-key: host-correctness
        key: ubuntu-24.04
        cache-targets: true
        cache-bin: false
        cache-workspace-crates: false
        cache-all-crates: false
        cache-on-failure: false
        save-if: false
    - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      with:
        version: 1.254.0
    - name: Check managed task authority and retirement controls
      run: |
        python3 -m pip install -r tools/requirements.lock
        python3 -m unittest tools.tests.test_dotnet_task_runtime tools.tests.test_dotnet_task_wait -v
    - name: Check published Polly source and strict outcome controls
      run: python3 -B -m unittest tools.tests.test_dotnet_published_tasks -v
    - name: Retrieve only exact source-bound native products and companion packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git fetch --no-tags --depth=1 origin e97d44ddc744c9bd738d9b3b7a7d8b7234133e36
        python3 tools/replay_dotnet_tasks.py --prepare --output "$RUNNER_TEMP/task-prepared"
    - name: Install captured NativeAOT namespace and loader inputs
      run: |
        sudo apt-get update
        sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install the pinned native compiler and closed runtime
      shell: bash
      run: |
        curl --fail --location --max-time 180 \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
          --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
        printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
        python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/dotnet-authoring-bindgen"
        export PATH="$RUNNER_TEMP/dotnet-authoring-bindgen:$PATH"
        printf '%s\n' "$RUNNER_TEMP/dotnet-authoring-bindgen" >> "$GITHUB_PATH"
        python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/dotnet-authoring-tools" \
          --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
    - name: Build one fresh NativeAOT component, sign and execute ordinary managed Tasks
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 tools/replay_dotnet_tasks.py --prepared "$RUNNER_TEMP/task-prepared" --host "$RUNNER_TEMP/task-prepared/selected-host" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --output "$RUNNER_TEMP/dotnet-task-runtime"
    - name: Retain bounded source, compiler, component and node evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dotnet-tasks-focused-${{ github.sha }}
        path: |-
          ${{ runner.temp }}/task-prepared/retrieval.json
          ${{ runner.temp }}/task-prepared/selected-host/host-retrieval.json
          ${{ runner.temp }}/dotnet-task-runtime/qualified.json
          ${{ runner.temp }}/dotnet-task-runtime/FAILED.json
          ${{ runner.temp }}/dotnet-task-runtime/replay-materials.json
          ${{ runner.temp }}/dotnet-task-runtime/logs/**
          ${{ runner.temp }}/dotnet-task-runtime/outside/evidence/**
          ${{ runner.temp }}/dotnet-task-runtime/build/*.json
          ${{ runner.temp }}/dotnet-task-runtime/build/component.wasm
          ${{ runner.temp }}/dotnet-task-runtime/build/logs/**
          ${{ runner.temp }}/dotnet-task-runtime/node/public-workflow.json
          ${{ runner.temp }}/dotnet-task-runtime/node/workflow.json
          ${{ runner.temp }}/dotnet-task-runtime/node/FAILED.json
          ${{ runner.temp }}/dotnet-task-runtime/node/controls/dotnet-ordinary-tasks-*.json
        if-no-files-found: warn
        retention-days: 3
