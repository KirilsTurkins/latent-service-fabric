name: .NET guest qualification

on:
  pull_request:
    paths:
      - 'sdk/dotnet-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/qualify_transaction_contracts.py'
      - 'tools/compile_transaction_guests.py'
      - 'tools/transaction_guest_project.py'
      - 'tools/transaction_guest_variants.py'
      - 'tools/tests/test_transaction_guest_authoring.py'
      - 'tools/tests/test_transaction_guest_compilers.py'
      - 'examples/rust-capsules/transactional-aggregate/**'
      - 'tools/dotnet_guest*'
      - 'tools/dotnet_guest/**'
      - 'examples/dotnet-standard-http/**'
      - 'tools/dotnet_standard_http*.py'
      - 'tools/dotnet_internal_io_port.py'
      - 'tools/qualify_dotnet_standard_http.py'
      - 'tools/dotnet_standard_entropy*.py'
      - 'tools/qualify_dotnet_standard_entropy.py'
      - 'tools/dotnet_task_runtime*.py'
      - 'tools/qualify_dotnet_task_runtime.py'
      - 'tools/tests/test_dotnet_task_runtime.py'
      - 'tools/tests/test_dotnet_secure_entropy.py'
      - 'tools/tests/test_dotnet_managed_entropy.py'
      - 'tools/dotnet_standard_console*.py'
      - 'tools/qualify_dotnet_standard_console.py'
      - 'tools/tests/test_dotnet_standard_console.py'
      - 'docs/component-development/dotnet-standard-console.md'
      - 'tools/standard_http/**'
      - 'tools/dotnet_capsule.py'
      - 'tools/dotnet_application_dependencies.py'
      - 'tools/dotnet_registry_tls.py'
      - 'tools/dotnet_private_feed_fixture.py'
      - 'tools/qualify_dotnet_private_dependencies.py'
      - 'tools/tests/test_dotnet_private_feeds.py'
      - 'tools/tests/test_dotnet_private_lifecycle.py'
      - 'tools/tests/fixtures/nuget-public-ca.pem'
      - 'docs/testing/dotnet-private-feed-lifecycle.md'
      - 'tools/dotnet_dependency_authoring.py'
      - 'tools/dotnet_dependency_fixture.py'
      - 'tools/dotnet_dependency_recovery.py'
      - 'tools/dotnet_reflection_fixture.py'
      - 'tools/qualify_dotnet_reflection.py'
      - 'tools/qualify_dotnet_reflection_boundaries.py'
      - 'tools/dotnet_catalogue_free_build.py'
      - 'tools/tests/test_dotnet_reflection_boundaries.py'
      - 'docs/testing/dotnet-reflection-boundaries.md'
      - 'tools/tests/test_dotnet_reflection.py'
      - 'docs/testing/dotnet-reflection-qualification.md'
      - 'tools/tests/test_dotnet_dependency_recovery.py'
      - 'tools/dotnet_compiler_isolation.py'
      - 'tools/application_dependenc*.py'
      - 'tools/captured_compiler_isolation.py'
      - 'tools/*dotnet*guest*capsules.py'
      - 'tools/*dotnet_capsule*.py'
      - 'tools/*rust_capsule*.py'
      - 'tools/guest_runtime_grants.py'
      - 'tools/wait_capsule_audit_idle.py'
      - 'tools/tests/test_dotnet_capsule_authoring.py'
      - 'tools/tests/test_dotnet_http_errors.py'
      - 'tools/probe_dotnet_http_errors.py'
      - 'tools/tests/test_dotnet_application_dependencies.py'
      - 'tools/tests/test_dotnet_dependency_authoring.py'
      - 'docs/component-development/dotnet-authoring.md'
      - 'docs/component-development/dotnet-dependencies.md'
      - 'crates/latent-signing/**'
      - 'crates/latent-packaging/**'
      - 'crates/latent-policy/**'
      - 'apps/latentd/**'
      - '.cargo/managed-guest.toml'
      - 'tools/toolchain-smoke/**'
      - 'wit/**'
      - 'crates/latent-wasmtime/**'
      - '.github/workflows/dotnet-guest.yml'
  workflow_dispatch:
    inputs:
      task_runtime_replay:
        type: boolean
        default: false
        description: Run only the bounded real Task runtime campaign with authenticated historical native products

permissions:
  contents: read

concurrency:
  group: dotnet-guest-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  toolchain:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.task_runtime_replay }}
    name: NativeAOT component qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture immutable qualification source inputs
        shell: bash
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/dotnet-guest-source.tar.gz" HEAD -- \
            apps sdk/dotnet-guest sdk/rust examples tools crates wit schemas docs .cargo \
            Cargo.toml Cargo.lock rust-toolchain.toml LICENSE NOTICE .github/workflows/dotnet-guest.yml
          test "$(stat --format=%s "$RUNNER_TEMP/dotnet-guest-source.tar.gz")" -le 134217728
          git rev-parse HEAD > "$RUNNER_TEMP/dotnet-guest-source.sha"
      - name: Retain the exact reviewed command contract input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-guest-command-contract-${{ github.sha }}
          path: |
            tools/ci/contracts/
            ${{ runner.temp }}/dotnet-guest-source.tar.gz
            ${{ runner.temp }}/dotnet-guest-source.sha
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Test contract projection, output ownership and drift rejection
        run: python3 -m unittest discover -s sdk/dotnet-guest/tests -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Retain exact inputs and check the clock contract
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet-guest"
          git rev-parse HEAD > "$RUNNER_TEMP/dotnet-guest/revision.txt"
          cmp wit/platform/clock/package.wit sdk/dotnet-guest/runtime/wit/deps/latent-clock.wit
      - name: Install captured NativeAOT namespace and loader inputs
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the pinned native compiler and closed runtime
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/dotnet-authoring-bindgen"
          export PATH="$RUNNER_TEMP/dotnet-authoring-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/dotnet-authoring-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/dotnet-authoring-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Qualify proposed transaction shapes with the maintained NativeAOT compiler
        run: python3 tools/qualify_transaction_contracts.py --language dotnet --tools "$RUNNER_TEMP/dotnet-authoring-tools" --output "$RUNNER_TEMP/transaction-contract-dotnet"
      - name: Compile the authored transaction aggregate and forbidden immediate HTTP variant
        run: python3 tools/compile_transaction_guests.py --language dotnet --tools "$RUNNER_TEMP/dotnet-authoring-tools" --output "$RUNNER_TEMP/transaction-guests-dotnet"
      - name: Check independent editable projects and closed provenance profiles
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -m unittest tools.tests.test_dotnet_capsule_authoring tools.tests.test_build_provenance_schemas
      - name: Preserve bounded errors in the actual captured WASI BCL
        run: |
          python3 -m unittest tools.tests.test_dotnet_http_errors
          python3 tools/probe_dotnet_http_errors.py \
            --tools "$RUNNER_TEMP/dotnet-authoring-tools" \
            --output "$RUNNER_TEMP/dotnet-http-error-port"
      - name: Test exact NuGet authoring and transactional review
        run: python3 -m unittest tools.tests.test_dotnet_dependency_authoring
      - name: Test captured NuGet selection and compiler isolation
        run: |
          LSF_REQUIRE_COMPILER_ISOLATION=1 python3 -m unittest tools.tests.test_dotnet_application_dependencies tools.tests.test_captured_compiler_isolation
      - name: Generate and independently check current typed guest bindings
        run: |
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/dotnet-guest/tools"
          python3 tools/stage_runtime_wit.py target/dotnet-binding-wit --source wit/platform/runtime-phase3-blobs
          export LSF_WIT_BINDGEN="$RUNNER_TEMP/dotnet-guest/tools/wit-bindgen" LSF_WASM_TOOLS=wasm-tools
          python3 tools/dotnet_guest_bindings.py c-sharp target/dotnet-binding-wit --world capsule --runtime native-aot --with-wit-results --out-dir "$RUNNER_TEMP/dotnet-guest/generated"
          python3 tools/dotnet_guest_bindings.py c-sharp target/dotnet-binding-wit --world capsule --runtime native-aot --with-wit-results --out-dir "$RUNNER_TEMP/dotnet-guest/generated" --check
      - name: Compile the actual C# probe and measure build costs
        working-directory: sdk/dotnet-guest
        shell: bash
        run: |
          set -o pipefail
          probe="$RUNNER_TEMP/dotnet-probe-source"
          mkdir "$probe"
          cp probes/smoke/Smoke.csproj probes/smoke/Operations.cs \
            probes/smoke/component.wit probes/smoke/packages.lock.json \
            global.json nuget.config "$probe/"
          cd "$probe"
          dotnet --info > "$RUNNER_TEMP/dotnet-guest/dotnet-info.txt"
          dotnet restore Smoke.csproj --configfile nuget.config --locked-mode 2>&1 | tee "$RUNNER_TEMP/dotnet-guest/restore.log"
          export LSF_WIT_BINDGEN="$RUNNER_TEMP/dotnet-guest/tools/wit-bindgen" LSF_WASM_TOOLS=wasm-tools
          /usr/bin/time -f '{"wallSeconds":%e,"maxRssKiB":%M,"exitCode":%x}' -o "$RUNNER_TEMP/dotnet-guest/compilation-cost.json" dotnet build Smoke.csproj -c Release --no-restore -p:WasiSdkRoot="$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" -p:WitBindgenExe="python3 $GITHUB_WORKSPACE/tools/dotnet_guest_bindings.py" 2>&1 | tee "$RUNNER_TEMP/dotnet-guest/build.log"
          cp packages.lock.json "$RUNNER_TEMP/dotnet-guest/packages.lock.json"
      - name: Pair private blocking I/O function types without changing original core bytes
        run: |
          cp "$RUNNER_TEMP/dotnet-probe-source/bin/Release/net10.0/wasi-wasm/publish/Smoke.wasm" "$RUNNER_TEMP/dotnet-guest/original-raw.wasm"
          python3 tools/dotnet_internal_io_port.py --raw "$RUNNER_TEMP/dotnet-guest/original-raw.wasm" --adapter "$RUNNER_TEMP/dotnet-authoring-tools/runtime.wasm" --output "$RUNNER_TEMP/dotnet-guest/internal-io-port"
          cp "$RUNNER_TEMP/dotnet-guest/internal-io-port/component.wasm" "$RUNNER_TEMP/dotnet-probe-source/bin/Release/net10.0/wasi-wasm/publish/Smoke.wasm"
      - name: Compose capability-constrained compiler support
        shell: bash
        run: |
          set -o pipefail
          cargo build --quiet --locked -p latent-toolchain-smoke --example dotnet-closed-runtime --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/examples/dotnet_closed_runtime.wasm -o "$RUNNER_TEMP/dotnet-guest/runtime.wasm"
          tools="$HOME/.nuget/packages/bytecodealliance.componentize.dotnet.wasm.sdk/0.8.0-preview00011/tools/linux-x64"
          cp "$RUNNER_TEMP/dotnet-probe-source/bin/Release/net10.0/wasi-wasm/publish/Smoke.wasm" "$RUNNER_TEMP/dotnet-guest/raw.wasm"
          "$tools/wac" plug "$RUNNER_TEMP/dotnet-guest/raw.wasm" --plug "$RUNNER_TEMP/dotnet-guest/runtime.wasm" -o "$RUNNER_TEMP/dotnet-guest/component.wasm"
          wasm-tools validate "$RUNNER_TEMP/dotnet-guest/component.wasm"
          wasm-tools component wit "$RUNNER_TEMP/dotnet-guest/component.wasm" | tee "$RUNNER_TEMP/dotnet-guest/admitted.wit"
      - name: Validate reviewed resource-alias composer
        run: |
          "$RUNNER_TEMP/dotnet-authoring-tools/component-composer/wac" plug "$RUNNER_TEMP/dotnet-guest/raw.wasm" --plug "$RUNNER_TEMP/dotnet-guest/runtime.wasm" -o "$RUNNER_TEMP/dotnet-guest/reviewed-composer.wasm"
          wasm-tools validate "$RUNNER_TEMP/dotnet-guest/reviewed-composer.wasm"
      - name: Execute LSF authority and fresh-heap qualification
        env:
          LSF_DOTNET_PROBE: ${{ runner.temp }}/dotnet-guest
        shell: bash
        run: |
          set -o pipefail
          cargo test --quiet -p latent-wasmtime --test dotnet_guest --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/dotnet-guest/execution.log"
      - name: Qualify captured projects, all SDK owners, enforced node and printed guide
        run: |
          python3 tools/qualify_dotnet_capsules.py --output "$RUNNER_TEMP/dotnet-capsule-authoring" --tools "$RUNNER_TEMP/dotnet-authoring-tools"
      - name: Qualify ordinary default HttpClient, JSON parsing, disposal and cancellation
        run: |
          python3 tools/qualify_dotnet_standard_http.py --output "$RUNNER_TEMP/dotnet-standard-http" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --native-qualification "$RUNNER_TEMP/dotnet-capsule-authoring"
      - name: Qualify signed ordinary synchronous HttpClient.Send and pending cancellation
        run: |
          python3 tools/qualify_dotnet_standard_http.py --synchronous-send --output "$RUNNER_TEMP/dotnet-standard-http-send" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --native-qualification "$RUNNER_TEMP/dotnet-capsule-authoring"
      - name: Qualify captured NuGet libraries and embedded resources
        run: |
          python3 -m unittest tools.tests.test_dotnet_dependency_recovery
          python3 -m unittest tools.tests.test_dotnet_resources
          python3 tools/qualify_dotnet_resources.py --dotnet "$(command -v dotnet)" --output "$RUNNER_TEMP/dotnet-standard-resources"
          python3 tools/qualify_dotnet_capsules.py --output "$RUNNER_TEMP/dotnet-capsule-dependencies" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --application-dependencies
      - name: Qualify signed asynchronous HttpClient pre-cancellation without dispatch
        run: |
          python3 tools/qualify_dotnet_standard_http.py --pre-cancelled-async --output "$RUNNER_TEMP/dotnet-standard-http-async-cancel" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --native-qualification "$RUNNER_TEMP/dotnet-capsule-authoring"
      - name: Test descriptor-selected reflection and closed signed failure boundaries
        run: python3 -m unittest tools.tests.test_dotnet_reflection -v
      - name: Qualify ordinary captured descriptor reflection and dynamic loading refusal
        run: |
          python3 tools/qualify_dotnet_reflection.py --prepared-qualification "$RUNNER_TEMP/dotnet-capsule-dependencies" --output "$RUNNER_TEMP/dotnet-reflection" --tools "$RUNNER_TEMP/dotnet-authoring-tools"
      - name: Test private NuGet trust and bounded lifecycle controls
        run: python3 -m unittest tools.tests.test_dotnet_private_feeds tools.tests.test_dotnet_private_lifecycle
      - name: Qualify authenticated private NuGet capture and signed offline lifecycle
        run: |
          python3 tools/qualify_dotnet_private_dependencies.py --prepared-qualification "$RUNNER_TEMP/dotnet-capsule-dependencies" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --output "$RUNNER_TEMP/dotnet-private-dependencies"
      - name: Test catalogue-free source and explicit unsupported reflection boundaries
        run: python3 -m unittest tools.tests.test_dotnet_reflection_boundaries -v
      - name: Qualify JIT and unrepresentable reflection refusal without optional catalogue data
        run: |
          python3 tools/qualify_dotnet_reflection_boundaries.py --prepared-qualification "$RUNNER_TEMP/dotnet-capsule-dependencies" --output "$RUNNER_TEMP/dotnet-reflection-boundaries" --tools "$RUNNER_TEMP/dotnet-authoring-tools"
      - name: Check real closed adapter synchronous types and exact core preservation
        run: python3 -B -m unittest tools.tests.test_dotnet_closed_io -v
      - name: Qualify captured ordinary Console and strict bounded logging
        run: |
          python3 -m unittest tools.tests.test_dotnet_standard_console
          python3 tools/qualify_dotnet_standard_console.py --output "$RUNNER_TEMP/dotnet-standard-console" --tools "$RUNNER_TEMP/dotnet-authoring-tools" --native-qualification "$RUNNER_TEMP/dotnet-capsule-authoring"
      - name: Check native PAL secure entropy behavior and explicit scalar authority
        run: python3 -m unittest tools.tests.test_dotnet_secure_entropy -v
      - name: Validate exact managed RNG derivation and private NativeAOT references
        run: python3 -m unittest tools.tests.test_dotnet_managed_entropy -v
      - name: Qualify captured ordinary RandomNumberGenerator and typed source denial
        run: >-
          python3 tools/qualify_dotnet_standard_entropy.py --output "$RUNNER_TEMP/dotnet-standard-entropy"
          --tools "$RUNNER_TEMP/dotnet-authoring-tools" --native-qualification "$RUNNER_TEMP/dotnet-capsule-authoring"
      - name: Check ordinary managed task authority and retirement gates
        run: python3 -m unittest tools.tests.test_dotnet_task_runtime tools.tests.test_dotnet_task_wait -v
      - name: Qualify captured default Task and ThreadPool progress without HTTP
        run: >-
          python3 tools/qualify_dotnet_task_runtime.py --output "$RUNNER_TEMP/dotnet-task-runtime"
          --tools "$RUNNER_TEMP/dotnet-authoring-tools" --native-qualification "$RUNNER_TEMP/dotnet-capsule-authoring"
      - name: Retain output and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-guest-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dotnet-task-runtime/qualified.json
            ${{ runner.temp }}/dotnet-task-runtime/FAILED.json
            ${{ runner.temp }}/dotnet-task-runtime/logs/**
            ${{ runner.temp }}/dotnet-task-runtime/outside/evidence/**
            ${{ runner.temp }}/dotnet-task-runtime/build/*.json
            ${{ runner.temp }}/dotnet-task-runtime/build/logs/**
            ${{ runner.temp }}/dotnet-task-runtime/build/component.wasm
            ${{ runner.temp }}/dotnet-task-runtime/node/workflow.json
            ${{ runner.temp }}/dotnet-task-runtime/node/public-workflow.json
            ${{ runner.temp }}/dotnet-task-runtime/node/FAILED.json
            ${{ runner.temp }}/dotnet-standard-entropy/qualified.json
            ${{ runner.temp }}/dotnet-standard-entropy/FAILED.json
            ${{ runner.temp }}/dotnet-standard-entropy/logs/**
            ${{ runner.temp }}/dotnet-standard-entropy/outside/evidence/**
            ${{ runner.temp }}/dotnet-standard-entropy/build/BUILD-COMPLETE.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/BUILD-FAILED.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/build-observation.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/source-inputs.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/recipe-inputs.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/compiler-inputs.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/nuget-build-inputs.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/noncrypto-entropy*.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/managed-entropy*.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/noncrypto-entropy.o
            ${{ runner.temp }}/dotnet-standard-entropy/build/compatibility*.json
            ${{ runner.temp }}/dotnet-standard-entropy/build/component.wasm
            ${{ runner.temp }}/dotnet-standard-entropy/build/logs/**
            ${{ runner.temp }}/dotnet-standard-entropy/node/public-workflow.json
            ${{ runner.temp }}/dotnet-standard-entropy/node/controls/dotnet-ordinary-tasks-*.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/qualification.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/FAILED.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/capture.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/catalogue-free-source.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/BUILD-COMPLETE.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/BUILD-FAILED.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/source-inputs.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/recipe-inputs.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/build-observation.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/nuget-build-inputs.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/build/compiler-containment.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/node/workflow.json
            ${{ runner.temp }}/dotnet-reflection-boundaries/node/FAILED.json
            ${{ runner.temp }}/dotnet-standard-console/qualified.json
            ${{ runner.temp }}/dotnet-standard-console/FAILED.json
            ${{ runner.temp }}/dotnet-standard-console/logs/**
            ${{ runner.temp }}/dotnet-standard-console/outside/evidence/**
            ${{ runner.temp }}/dotnet-standard-console/build/BUILD-COMPLETE.json
            ${{ runner.temp }}/dotnet-standard-console/build/BUILD-FAILED.json
            ${{ runner.temp }}/dotnet-standard-console/build/build-observation.json
            ${{ runner.temp }}/dotnet-standard-console/build/source-inputs.json
            ${{ runner.temp }}/dotnet-standard-console/build/recipe-inputs.json
            ${{ runner.temp }}/dotnet-standard-console/build/compiler-inputs.json
            ${{ runner.temp }}/dotnet-standard-console/build/nuget-build-inputs.json
            ${{ runner.temp }}/dotnet-standard-console/build/compatibility*.json
            ${{ runner.temp }}/dotnet-standard-console/build/component.wasm
            ${{ runner.temp }}/dotnet-standard-console/build/logs/**
            ${{ runner.temp }}/dotnet-standard-console/node/public-workflow.json
            ${{ runner.temp }}/dotnet-standard-console/node/controls/dotnet-console-*.json
            ${{ runner.temp }}/dotnet-reflection/qualification.json
            ${{ runner.temp }}/dotnet-reflection/FAILED.json
            ${{ runner.temp }}/dotnet-reflection/capture.json
            ${{ runner.temp }}/dotnet-reflection/build/BUILD-COMPLETE.json
