name: .NET guest qualification

on:
  push:
    branches: [feat/549-dotnet-guest-workflow]
  pull_request:
    paths:
      - 'sdk/dotnet-guest/**'
      - 'tools/dotnet_guest*'
      - 'tools/toolchain-smoke/**'
      - 'wit/**'
      - 'crates/latent-wasmtime/**'
      - '.github/workflows/dotnet-guest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-guest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: NativeAOT component qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Retain exact inputs and check the clock contract
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet-guest"
          git rev-parse HEAD > "$RUNNER_TEMP/dotnet-guest/revision.txt"
          cmp wit/platform/clock/package.wit sdk/dotnet-guest/runtime/wit/deps/latent-clock.wit
      - name: Generate current typed guest bindings
        run: |
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/dotnet-guest/tools"
          python3 tools/stage_runtime_wit.py target/dotnet-binding-wit --source wit/platform/runtime-phase3-blobs
          LSF_WIT_BINDGEN="$RUNNER_TEMP/dotnet-guest/tools/wit-bindgen" LSF_WASM_TOOLS=wasm-tools python3 tools/dotnet_guest_bindings.py c-sharp target/dotnet-binding-wit --world capsule --runtime native-aot --with-wit-results --out-dir "$RUNNER_TEMP/dotnet-guest/generated"
      - name: Compile the actual C# probe
        working-directory: sdk/dotnet-guest
        shell: bash
        run: |
          set -o pipefail
          dotnet --info > "$RUNNER_TEMP/dotnet-guest/dotnet-info.txt"
          dotnet restore probes/smoke/Smoke.csproj --configfile nuget.config 2>&1 | tee "$RUNNER_TEMP/dotnet-guest/restore.log"
          dotnet build probes/smoke/Smoke.csproj -c Release --no-restore 2>&1 | tee "$RUNNER_TEMP/dotnet-guest/build.log"
          cp probes/smoke/packages.lock.json "$RUNNER_TEMP/dotnet-guest/packages.lock.json"
      - name: Compose capability-constrained compiler support
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked -p latent-toolchain-smoke --example dotnet-closed-runtime --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/examples/dotnet_closed_runtime.wasm -o "$RUNNER_TEMP/dotnet-guest/runtime.wasm"
          tools="$HOME/.nuget/packages/bytecodealliance.componentize.dotnet.wasm.sdk/0.8.0-preview00011/tools/linux-x64"
          cp sdk/dotnet-guest/probes/smoke/bin/Release/net10.0/wasi-wasm/publish/Smoke.wasm "$RUNNER_TEMP/dotnet-guest/raw.wasm"
          "$tools/wac" plug "$RUNNER_TEMP/dotnet-guest/raw.wasm" --plug "$RUNNER_TEMP/dotnet-guest/runtime.wasm" -o "$RUNNER_TEMP/dotnet-guest/component.wasm"
          wasm-tools validate "$RUNNER_TEMP/dotnet-guest/component.wasm"
          wasm-tools component wit "$RUNNER_TEMP/dotnet-guest/component.wasm" | tee "$RUNNER_TEMP/dotnet-guest/admitted.wit"
      - name: Execute LSF authority and fresh-heap qualification
        env:
          LSF_DOTNET_PROBE: ${{ runner.temp }}/dotnet-guest
        shell: bash
        run: |
          set -o pipefail
          cargo test -p latent-wasmtime --test dotnet_guest --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/dotnet-guest/execution.log"
      - name: Retain output and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-guest-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/dotnet-guest/
          if-no-files-found: error
          retention-days: 7
