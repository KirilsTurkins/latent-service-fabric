name: PR 1587 blocker validation
on:
  push:
    branches: [ci/pr1587-blocker-validation-20261104]
    paths: [.github/workflows/pr1587-blocker-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/pr1587-blocker-validation-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: b76bfd7357a3f34cceac96ee61d9008ec135102f
      - name: Read exact failure causes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, urllib.request, urllib.error, zipfile
          api='https://api.github.com/repos/KirilsTurkins/latent-service-fabric/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def read(path,limit):
              request=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try: response=opener.open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code != 302: raise
                  response=urllib.request.urlopen(error.headers['Location'],timeout=90)
              with response: raw=response.read(limit+1)
              assert len(raw)<=limit,path
              return raw
          result=subprocess.run(['git','grep','-n','-E','onCancel|on-cancel','--','*.mjs','*.js','*.rs','*.py','*.wit'],capture_output=True,text=True)
          print('GLOBAL_IMPORT_SOURCE',result.stdout[:20000])
          for ident,size,digest,kind in ((13128394251,47459,'3cc798622a8257f91a5f3cba0d33a2c102a5cbabed8c74a60435496eb26396e7','ts'),(13132360193,5954062,'80662a5c726a949c037a3b7f57ffd35778786e1dcdc2b7db0b1b3e251193b5c2','dotnet'),(13130055422,106557782,'bea09db67efa2807cdfd858e0461ac6a5f598ca4d0f9f474c789782865ad8fb9','java')):
              raw=read(f'actions/artifacts/{ident}/zip',size)
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  if kind=='java':
                      print('JAVA_PROMOTION',z.read('java-http-composition/http/controls/244.json').decode())
                      print('JAVA_HTTP_RECORDS',[n for n in z.namelist() if n.startswith('java-http-composition/http/') and n.endswith('.json') and '/controls/' not in n][-30:])
                  if kind=='dotnet':
                      data=json.loads(z.read('dotnet-task-runtime/node/FAILED.json'))
                      print('DOTNET_NODE_KEYS',list(data))
                      for key in ('stage','reason','runtimeProbe','diagnostics','invocations','error','errorCategory'):
                          if key in data: print('DOTNET_FIELD',key,json.dumps(data[key])[:16000])
                      print('DOTNET_RECORD_PATHS',[n for n in z.namelist() if '/node/' in n][:100])
                      def visit(value,path=''):
                          if isinstance(value,dict):
                              if any(k in value for k in ('activationId','decoded','diagnostic')):
                                  print('DOTNET_RECORD',path,json.dumps(value)[:16000]); return
                              for k,v in value.items():
                                  if k not in ('inputs','source','binaries','materials','sourceBefore','sourceAfter'): visit(v,path+'/'+k)
                          elif isinstance(value,list):
                              for i,v in enumerate(value): visit(v,path+'/'+str(i))
                      visit(data)
                  if kind=='ts':
                      print('TS_PATHS',z.namelist())
                      for n in z.namelist():
                          if n.endswith(('.js','.mjs','.stderr.log','.command.json')) and z.getinfo(n).file_size<131072:
                              text=z.read(n).decode(errors='replace')
                              if n.endswith('.command.json') or 'available' in text or 'SyntaxError' in text: print('TS_SOURCE',n,text[:22000])
          PY
