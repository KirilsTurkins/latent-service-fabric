name: PR 1587 blocker validation
on:
  push:
    branches: [ci/pr1587-blocker-validation-20261104]
    paths: [.github/workflows/pr1587-blocker-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/pr1587-blocker-validation-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect bounded authenticated failure records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, urllib.error, zipfile
          api='https://api.github.com/repos/KirilsTurkins/latent-service-fabric/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def read(path,limit=2097152):
              request=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try: response=opener.open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code != 302: raise
                  assert error.headers['Location'].startswith('https://')
                  response=urllib.request.urlopen(error.headers['Location'],timeout=90)
              with response: raw=response.read(limit+1)
              assert len(raw)<=limit,path
              return raw
          for job in (125202412424,125173685150):
              lines=read(f'actions/jobs/{job}/logs',33554432).decode('utf-8-sig').splitlines()
              matches=[i for i,s in enumerate(lines) if any(t in s for t in ('guest result mismatch:','control diagnostics:','control command failed:','java-canary-promote','"error"','promotion failed'))]
              print('TARGET_LOG',job)
              selected=set()
              for i in matches[-7:]: selected.update(range(max(0,i-2),min(len(lines),i+5)))
              print('\n'.join(lines[i] for i in sorted(selected))[-22000:])
          raw=read('actions/artifacts/13128394251/zip',47459)
          assert hashlib.sha256(raw).hexdigest()=='3cc798622a8257f91a5f3cba0d33a2c102a5cbabed8c74a60435496eb26396e7'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  if name.endswith(('host-world.wit','package.json','lock.json')):
                      assert z.getinfo(name).file_size<131072
                      print('TYPESCRIPT_INPUT',name,z.read(name).decode()[:14000])
          raw=read('actions/artifacts/13132360193/zip',5954062)
          assert hashlib.sha256(raw).hexdigest()=='80662a5c726a949c037a3b7f57ffd35778786e1dcdc2b7db0b1b3e251193b5c2'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  if name=='dotnet-task-runtime/guard-node.json':
                      assert z.getinfo(name).file_size<131072
                      print('DOTNET_GUARD',z.read(name).decode()[:20000])
          for workflow in (365190352,365042590,365237284):
              value=json.loads(read(f'actions/workflows/{workflow}'))
              path=value['path']
              print('WORKFLOW',workflow,path)
              record=json.loads(read('contents/'+path+'?ref=460b2b969437b68b3f893afe36160afdb09cf85a'))
              text=base64.b64decode(record['content']).decode()
              print('LIMITS',[(i+1,s) for i,s in enumerate(text.splitlines()) if any(t in s for t in ('timeout','concurrency','cancel-in-progress'))])
          PY
