name: PR 1587 blocker validation
on:
  push:
    branches: [ci/pr1587-blocker-validation-20261104]
    paths: [.github/workflows/pr1587-blocker-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/pr1587-blocker-validation-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: b76bfd7357a3f34cceac96ee61d9008ec135102f
      - name: Locate exact compiler and qualification source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, urllib.request, urllib.error, zipfile
          api='https://api.github.com/repos/KirilsTurkins/latent-service-fabric/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def read(path,limit):
              request=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try: response=opener.open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code != 302: raise
                  response=urllib.request.urlopen(error.headers['Location'],timeout=90)
              with response: raw=response.read(limit+1)
              assert len(raw)<=limit,path
              return raw
          for pattern in ('onCancel','java-canary-promote','dotnetTaskRuntime','shim.js'):
              result=subprocess.run(['git','grep','-l','-F',pattern,'--','tools','sdk'],capture_output=True,text=True)
              print('SOURCE_PATHS',pattern,result.stdout[:9000])
          for path in ('tools/tests/test_dotnet_task_runtime.py','tools/dotnet_task_runtime_fixture.py'):
              text=pathlib.Path(path).read_text(); print('SOURCE',path,text[:30000])
          raw=read('actions/artifacts/13128394251/zip',47459)
          assert hashlib.sha256(raw).hexdigest()=='3cc798622a8257f91a5f3cba0d33a2c102a5cbabed8c74a60435496eb26396e7'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in ('compiled/raw-generated-bindings.json','logs/14-componentize.stderr.txt','compiled/imports.json','compiler-inputs.json'):
                  raw=z.read(name);print('TS_RECORD',name,raw.decode()[:22000])
          import yaml
          workflow=yaml.safe_load(pathlib.Path('.github/workflows/dotnet-guest.yml').read_text())
          for name,job in workflow['jobs'].items():
              if any('qualify_dotnet_task_runtime' in str(s) for s in job['steps']):
                  print('DOTNET_JOB',name,json.dumps(job)[:28000])
          PY
