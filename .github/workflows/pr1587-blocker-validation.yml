name: PR 1587 blocker validation
on:
  push:
    branches: [ci/pr1587-blocker-validation-20261104]
    paths: [.github/workflows/pr1587-blocker-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/pr1587-blocker-validation-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
          ref: b76bfd7357a3f34cceac96ee61d9008ec135102f
      - name: Trace compiler-owned imports and bounded failed records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, urllib.request, urllib.error, zipfile
          api='https://api.github.com/repos/KirilsTurkins/latent-service-fabric/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def read(path,limit):
              request=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try: response=opener.open(request,timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code != 302: raise
                  response=urllib.request.urlopen(error.headers['Location'],timeout=90)
              with response: raw=response.read(limit+1)
              assert len(raw)<=limit,path
              return raw
          grep=subprocess.run(['git','grep','-n','-E','onCancel|on-cancel|available.*wasi|wasi.*available','--','tools/typescript_guest','sdk/typescript-guest','tools/tests/test_typescript*'],capture_output=True,text=True)
          print('IMPORT_SOURCES',grep.stdout[:16000])
          print('TS_TESTS',subprocess.check_output(['git','ls-files','tools/tests/*typescript*']).decode())
          for ident,size,digest,kind in ((13128394251,47459,'3cc798622a8257f91a5f3cba0d33a2c102a5cbabed8c74a60435496eb26396e7','ts'),(13132360193,5954062,'80662a5c726a949c037a3b7f57ffd35778786e1dcdc2b7db0b1b3e251193b5c2','dotnet'),(13130055422,106557782,'bea09db67efa2807cdfd858e0461ac6a5f598ca4d0f9f474c789782865ad8fb9','java')):
              raw=read(f'actions/artifacts/{ident}/zip',size)
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names=z.namelist()
                  print('PATHS',kind,[(n,z.getinfo(n).file_size) for n in names if ('FAILED' in n or 'guard' in n or 'host-world' in n or '244' in n or 'diagnostic' in n or 'taskrt' in n)][:80])
                  for n in names:
                      show=(kind=='ts' and n.endswith('.wit')) or (kind=='dotnet' and ('guard-node' in n or 'taskrt-' in n or 'invocation-diagnostic' in n))
                      if show and z.getinfo(n).file_size<65536:
                          print('RECORD',kind,n,z.read(n).decode(errors='replace')[:14000])
                      if kind=='java' and 'composition' in n and n.endswith('FAILED.json'):
                          data=json.loads(z.read(n)); print('JAVA_FAILED_KEYS',list(data))
                          for key,val in data.items():
                              if key in ('before','after','materials','nativeInputs','inputs','builds'): continue
                              print('JAVA_FIELD',key,json.dumps(val)[:22000])
          PY
