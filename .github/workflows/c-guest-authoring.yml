name: C guest authoring

on:
  pull_request:
    branches: [development]
    paths:
      - 'sdk/c-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/**'
      - 'crates/**'
      - 'wit/**'
      - 'schemas/**'
      - 'Cargo.*'
      - 'docs/component-development/c-authoring.md'
      - '.github/workflows/c-guest-authoring.yml'
  push:
    branches: [development]
    paths:
      - 'sdk/c-guest/**'
      - 'sdk/transaction-contract/**'
      - 'tools/**'
      - 'crates/**'
      - 'wit/**'
      - 'schemas/**'
      - 'Cargo.*'
      - 'docs/component-development/c-authoring.md'
      - '.github/workflows/c-guest-authoring.yml'

permissions:
  contents: read

concurrency:
  group: c-guest-authoring-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  runtime:
    name: Admitted C capability ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Install pinned validation and bindings
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools"
          echo "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
      - name: Qualify proposed transaction shapes with the maintained async C compiler
        run: python3 tools/qualify_transaction_contracts.py --language c --output "$RUNNER_TEMP/transaction-contract-c"
      - name: Build and execute signed C and Rust capability packages
        env:
          LSF_GUEST_CAPSULES: ${{ runner.temp }}/c-guest-capsules
        run: |
          set -o pipefail
          python3 tools/build_guest_capsules.py --output "$LSF_GUEST_CAPSULES" 2>&1 | tee "$RUNNER_TEMP/c-guest-build.log"
          cargo test --locked -p latent-wasmtime --test guest_sdk -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/c-guest-runtime.log"
          cargo test --locked -p latent-signing --test guest_provenance 2>&1 | tee "$RUNNER_TEMP/c-guest-provenance.log"
          cargo test --locked -p latent-control-store --lib managed_lease_failure_never_mutates_or_renews_a_historical_replay 2>&1 | tee "$RUNNER_TEMP/c-guest-control-lease.log"
          cargo test --locked -p latent-policy --lib mutation_renewal_persists_a_full_window_even_before_the_sampler_margin 2>&1 | tee "$RUNNER_TEMP/c-guest-clock-window.log"
      - name: Qualify standalone C projects and the printed guide
        run: |
          python3 -m unittest tools.tests.test_c_capsule_authoring
          python3 tools/qualify_c_capsules.py --output "$RUNNER_TEMP/c-capsule-authoring"
      - name: Qualify captured C libraries with enforced compiler isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          LSF_REQUIRE_COMPILER_ISOLATION=1 python3 -m unittest tools.tests.test_c_application_dependencies tools.tests.test_captured_compiler_isolation
          python3 tools/qualify_c_capsules.py --application-dependencies --output "$RUNNER_TEMP/c-application-library"
      - name: Retain compiler and ownership results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-guest-ownership-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/transaction-contract-c/report.json
            ${{ runner.temp }}/transaction-contract-c/source.tar.gz
            ${{ runner.temp }}/transaction-contract-c/component.wit
            ${{ runner.temp }}/transaction-contract-c/preparation.json
            ${{ runner.temp }}/transaction-contract-c/compiler-inputs.json
            ${{ runner.temp }}/transaction-contract-c/logs/**
            ${{ runner.temp }}/transaction-contract-c/compiler/*.log
            ${{ runner.temp }}/transaction-contract-c/compiler/*.command.json
            ${{ runner.temp }}/transaction-contract-c/compiled/component.wasm
            ${{ runner.temp }}/transaction-contract-c/compiled/component.wit
            ${{ runner.temp }}/transaction-contract-c/compiled/bindings/**
            ${{ runner.temp }}/transaction-contract-c/compiled/generated/**
            ${{ runner.temp }}/transaction-contract-c/compiled/raw-generated-bindings.json
            ${{ runner.temp }}/transaction-contract-c/bindings/**
            ${{ runner.temp }}/transaction-contract-c/component.wasm
            ${{ runner.temp }}/c-guest-*.log
            ${{ runner.temp }}/c-guest-capsules/BUILD-COMPLETE.json
            ${{ runner.temp }}/c-guest-capsules/c-*/*.json
            ${{ runner.temp }}/c-capsule-authoring/*.json
            ${{ runner.temp }}/c-capsule-authoring/logs/**
            ${{ runner.temp }}/c-capsule-authoring/builds/**
            ${{ runner.temp }}/c-capsule-authoring/node/**
            ${{ runner.temp }}/c-capsule-authoring/releases/**
            ${{ runner.temp }}/c-capsule-authoring/guide/guide.json
            ${{ runner.temp }}/c-capsule-authoring/guide/guide.sh
            ${{ runner.temp }}/c-capsule-authoring/guide/logs/**
            ${{ runner.temp }}/c-capsule-authoring/guide/projects/results/**
            ${{ runner.temp }}/c-application-library/**
          if-no-files-found: warn
          retention-days: 7
