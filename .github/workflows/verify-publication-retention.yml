name: Publication retention development validation
on:
  push:
    branches: [ci/662-publication-retention-deletion]
    paths: [.github/workflows/verify-publication-retention.yml]
permissions:
  contents: read
jobs:
  native-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Prepare bounded offline native validation inputs
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/retention-native-inputs"
          mkdir -p "$out" "$RUNNER_TEMP/retention-vendor"
          # Only public compiler/dependency content is exported. No home,
          # Git credentials, signing inputs, or repository secrets are copied.
          cargo vendor --locked --versioned-dirs "$RUNNER_TEMP/retention-vendor/vendor" > "$RUNNER_TEMP/retention-vendor/config.toml"
          tar -czf "$out/vendor.tar.gz" -C "$RUNNER_TEMP/retention-vendor" vendor config.toml
          sysroot="$(rustc --print sysroot)"
          tar -czf "$out/toolchain.tar.gz" -C "$sysroot" bin lib libexec
          rustc -vV > "$out/rustc.txt"
          cargo -vV > "$out/cargo.txt"
          git rev-parse HEAD > "$out/revision.txt"
          (cd "$out" && sha256sum vendor.tar.gz toolchain.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retention-native-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/retention-native-inputs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
