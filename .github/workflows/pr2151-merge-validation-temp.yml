name: Isolated PR 2151 merge validation
on:
  push:
    branches: ['diag/pr2151-merge-validation-20261122']
    paths: ['.github/workflows/pr2151-merge-validation-temp.yml']
permissions:
  contents: read
concurrency:
  group: pr2151-merge-validation-temp
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LSF_PYTHON_POLICY_BASE: '5569a03df63cac133146eee2680223ea3a1a3dc7'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          path: controls
          persist-credentials: false
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          path: source
          ref: f881e760dfb527e341b2b43b60d99f217ad2d8ae
          fetch-depth: 0
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: '3.13.5'
      - name: Authenticate the original local resolution data
        working-directory: source
        shell: bash
        run: |
          git fetch --no-tags origin 5e24b3d01574b1fa94cc4fb472633d0cb185e037
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          raw=subprocess.check_output(['git','show','5e24b3d01574b1fa94cc4fb472633d0cb185e037:.github/workflows/pr2151-merge-validation-temp.yml']).decode()
          line=next(line for line in raw.splitlines() if line.strip().startswith('RESOLUTION_PAYLOAD:'))
          value=line.split(':',1)[1].strip().strip("'")
          # Repair the transcription error, then require the independently
          # computed digest of the original supplied and tested local payload.
          value=value.replace('OnbbrmrI3giQ','OnbbrmrbrI3giQ')
          assert hashlib.sha256(value.encode()).hexdigest()=='eff52f939cc2387306dd8184243c1ea19f4a944e7a386579b2ff3f28803a9074'
          assert len(json.loads(zlib.decompress(base64.b64decode(value))))==15
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('RESOLUTION_PAYLOAD='+value+'\n')
          PY
      - name: Resolve both development merges without publishing refs
        working-directory: source
        run: python3 ../controls/tools/pr2151_merge_validation_temp.py
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: '1.97.1'
      - name: Validate the exact combined source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_enum_guard tools.tests.test_java_date_link_guard tools.tests.test_java_exception_slots tools.tests.test_java_linear_stack tools.tests.test_typescript_event_ownership tools.tests.test_typescript_abort_lazy_algorithms tools.tests.test_typescript_native_object_pressure -v 2>&1 | tee "$RUNNER_TEMP/pr2151-integration/core.log"
          python3 -B -m unittest tools.tests.test_java_compiler_acquisition tools.tests.test_java_dependency_suite tools.tests.test_java_resource_runtime tools.tests.test_java_standard_http_ownership tools.tests.test_java_teavm_failure_trace tools.tests.test_typescript_abort_any_ownership tools.tests.test_typescript_abort_stack_integration tools.tests.test_typescript_record_retirement tools.tests.test_typescript_abort_declarations tools.tests.test_typescript_native_task_meta tools.tests.test_native_fixture_toolchain -v 2>&1 | tee "$RUNNER_TEMP/pr2151-integration/adjacent.log"
          python3 -B -m unittest discover -s sdk/java-guest/tests -v 2>&1 | tee "$RUNNER_TEMP/pr2151-integration/sdk.log"
          python3 -B tools/validate_repository.py 2>&1 | tee "$RUNNER_TEMP/pr2151-integration/repository.log"
          python3 -B tools/ci_coverage.py --receipt "$RUNNER_TEMP/pr2151-integration/ci-inventory.json" 2>&1 | tee "$RUNNER_TEMP/pr2151-integration/ci.log"
          git diff --exit-code
          git diff --cached --check
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/pr2151-integration/candidate-tree.txt")"
      - name: Export exact validated Git objects as data
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr2151-integration'
          info=json.loads((out/'parents.json').read_text())
          def git(*a): return subprocess.check_output(['git',*a])
          def entries(ref):
              result={}
              for row in git('ls-tree','-rz',ref).split(b'\0'):
                  if not row: continue
                  meta,path=row.split(b'\t',1); mode,kind,sha=meta.decode().split()
                  assert kind=='blob'
                  result[path.decode()]={'mode':mode,'sha':sha}
              return result
          before=entries(info['development']); after=entries(info['tree']); changes=[]
          for path in sorted(before.keys()|after.keys()):
              if before.get(path)==after.get(path): continue
              if path not in after: changes.append({'path':path,'sha':None}); continue
              item=after[path]; raw=git('cat-file','blob',item['sha'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==item['sha']
              changes.append({'path':path,**item,'content':base64.b64encode(raw).decode()})
          info['baseTree']=git('rev-parse',info['development']+'^{tree}').decode().strip()
          info['changes']=changes; info['validated']=True
          (out/'publication.json').write_text(json.dumps(info))
          print('Validated tree',info['tree'],'changed paths',len(changes))
          PY
      - name: Retain merge and validation evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-integration-validation
          path: ${{ runner.temp }}/pr2151-integration/**
          if-no-files-found: warn
          retention-days: 7
  publish-objects:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: pr2151-integration-validation
          path: input
      - name: Publish verified objects only; never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          p=json.loads(pathlib.Path('input/publication.json').read_text())
          assert p['validated'] is True
          assert p['head']=='f881e760dfb527e341b2b43b60d99f217ad2d8ae'
          assert p['development']=='5569a03df63cac133146eee2680223ea3a1a3dc7'
          assert len(p['changes'])<150
          root='https://api.github.com/repos/KirilsTurkins/latent-service-fabric'
          def post(route,body):
              req=urllib.request.Request(root+route,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          elements=[]; seen=set()
          for item in p['changes']:
              path=item['path']; pp=pathlib.PurePosixPath(path)
              assert not pp.is_absolute() and '..' not in pp.parts and '.git' not in pp.parts and path not in seen
              assert 'pr2151_merge_validation_temp' not in path and 'pr2151-merge-validation-temp' not in path
              seen.add(path)
              if item['sha'] is None:
                  elements.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
              raw=base64.b64decode(item['content'],validate=True)
              assert len(raw)<2_000_000 and item['mode'] in ('100644','100755','120000')
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==item['sha']
              result=post('/git/blobs',{'content':item['content'],'encoding':'base64'})
              assert result['sha']==item['sha']
              elements.append({'path':path,'mode':item['mode'],'type':'blob','sha':item['sha']})
          result=post('/git/trees',{'base_tree':p['baseTree'],'tree':elements})
          assert result['sha']==p['tree'], (result['sha'],p['tree'])
          pathlib.Path('published.json').write_text(json.dumps({'head':p['head'],'development':p['development'],'tree':p['tree'],'paths':len(elements)}))
          print('VERIFIED_TREE='+p['tree'])
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-published-tree
          path: published.json
          retention-days: 7
