name: Java checkpoint context compiler control
on:
  push:
    branches: ['feat/java-checkpoint-context-20261023']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: java-checkpoint-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-context:
    name: Original and corrected pinned JVM compiler control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: One JVM-only compiler probe without guest or native compilation
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/qualify_java_checkpoint_context.py --output "$RUNNER_TEMP/checkpoint-context"
      - name: Retain bounded original and corrected compiler observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-checkpoint-context-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/checkpoint-context/result.json
            ${{ runner.temp }}/checkpoint-context/commands.json
            ${{ runner.temp }}/checkpoint-context/commands/logs/**
