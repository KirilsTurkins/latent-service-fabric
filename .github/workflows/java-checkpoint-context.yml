name: Java checkpoint context compiler control
on:
  push:
    branches: ['feat/java-checkpoint-context-20261023']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: java-checkpoint-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-context:
    name: Original and corrected pinned JVM compiler control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@5d910981b146bc2d4fd97fa349210f3e3d454039 # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: One JVM-only compiler probe without guest or native compilation
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/qualify_java_checkpoint_context.py --output "$RUNNER_TEMP/checkpoint-context"
      - name: Retain bounded original and corrected compiler observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-checkpoint-context-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/checkpoint-context/result.json
            ${{ runner.temp }}/checkpoint-context/commands.json
            ${{ runner.temp }}/checkpoint-context/commands/logs/**
