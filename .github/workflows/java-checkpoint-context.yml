name: Java checkpoint context compiler control
on:
  push:
    branches: ['feat/java-checkpoint-context-20261023']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: java-checkpoint-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-context:
    name: Original and corrected pinned JVM compiler control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@f041d6677134ada73c077d0c012bd78164b251a7 # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: One JVM-only compiler probe without guest or native compilation
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/qualify_java_checkpoint_context.py --output "$RUNNER_TEMP/checkpoint-context"
      - name: Retain bounded original and corrected compiler observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-checkpoint-context-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/checkpoint-context/result.json
            ${{ runner.temp }}/checkpoint-context/commands.json
            ${{ runner.temp }}/checkpoint-context/commands/logs/**
