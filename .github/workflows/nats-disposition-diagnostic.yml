name: NATS disposition diagnostic
on:
  push:
    branches: [diag/nats-durable-disposition-20261105]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
      - name: Repeat the existing full deferred suite with state diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nats-disposition"
          git rev-parse HEAD > "$RUNNER_TEMP/nats-disposition/source.txt"
          for attempt in 1 2 3; do
            if python3 -B tools/run_nats_deferred_tests.py > "$RUNNER_TEMP/nats-disposition/attempt-$attempt.log" 2>&1; then
              echo "Attempt $attempt passed"
            else
              echo "Attempt $attempt failed; showing retained diagnostic"
              cat "$RUNNER_TEMP/nats-disposition/attempt-$attempt.log"
              exit 1
            fi
          done
      - name: Retain diagnostic output
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: nats-disposition-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/nats-disposition/
          if-no-files-found: warn
          retention-days: 7
