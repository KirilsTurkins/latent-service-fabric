name: Packaged developer qualification

on:
  workflow_dispatch:
    inputs:
      policies:
        description: Independently approved developer and runtime candidate policy JSON
        required: true
        type: string
      developer_run:
        description: Successful exact-source Developer tools run ID
        required: true
        type: string
      runtime_run:
        description: Successful exact-source development-test native candidate run ID
        required: true
        type: string
      policy_approved:
        description: The maintainer independently approved these exact candidate policies and owned provisioning
        type: boolean
        default: false
        required: true
  push:
    branches: [feat/559-packaged-qualification]
    paths:
      - .github/workflows/developer-packaged-qualification.yml
      - tools/dev_packaged_*.py
      - tools/prepare_dev_packaged_probe.py
      - tools/tests/test_dev_packaged_probe.py
      - packaging/dev/qualification.Dockerfile

permissions:
  contents: read
  actions: read

jobs:
  conductor-contracts:
    name: Packaged qualification conductor contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Check archive rejection and bounded conductor processes
        run: python -m unittest tools.tests.test_dev_packaged_probe

  support:
    name: Prepare independently selected qualification inputs
    if: github.event_name == 'workflow_dispatch' && inputs.policy_approved && github.repository == 'KirilsTurkins/latent-service-fabric'
    needs: conductor-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage only conductor, pinned verifier and independent trust files
        env:
          LSF_APPROVED_POLICIES: ${{ inputs.policies }}
          LSF_DEVELOPER_RUN: ${{ inputs.developer_run }}
          LSF_RUNTIME_RUN: ${{ inputs.runtime_run }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/prepare_dev_packaged_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-qualification-support
          path: ${{ runner.temp }}/packaged-support/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Actual packaged Windows and WSL2 schedule
    needs: support
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-qualification-support
          path: ${{ runner.temp }}/packaged-support
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Download only selected exact-source candidate inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Support = Join-Path $env:RUNNER_TEMP 'packaged-support'
          $Selection = Get-Content (Join-Path $Support 'selection.json') -Raw | ConvertFrom-Json -AsHashtable
          $Artifacts = Join-Path $env:RUNNER_TEMP 'packaged-candidates'
          New-Item -ItemType Directory -Path $Artifacts | Out-Null
          $Sha = $Selection.sourceCommit
          if ($Sha -notmatch '^[a-f0-9]{40}$') { throw 'Exact candidate source required.' }
          $Names = [ordered]@{ windows="developer-windows-candidate-$Sha"; wsl="developer-wsl-candidate-$Sha" }
          foreach ($Language in @('rust','c','java','dotnet','go','typescript')) {
              $Names[$Language] = "developer-$Language-tools-candidate-$Sha"
          }
          $Selection.artifacts = @{}
          foreach ($Name in $Names.Keys) {
              $Destination = Join-Path $Artifacts $Name
              & gh run download $Selection.candidateRuns.developer.id --repo KirilsTurkins/latent-service-fabric --name $Names[$Name] --dir $Destination
              if ($LASTEXITCODE -ne 0) { throw "Candidate download failed: $Name" }
              $Selection.artifacts[$Name] = $Destination
          }
          $Destination = Join-Path $Artifacts 'native'
          & gh run download $Selection.candidateRuns.runtime.id --repo KirilsTurkins/latent-service-fabric --name "native-runtime-candidate-development-test-$Sha" --dir $Destination
          if ($LASTEXITCODE -ne 0) { throw 'Native candidate download failed.' }
          $Selection.artifacts.native = $Destination
          $Selection.trust = @{
              developerPolicy=(Join-Path $Support 'developer-policy.json'); runtimePolicy=(Join-Path $Support 'runtime-policy.json');
              trustedRoot=(Join-Path $Support 'trusted_root.jsonl'); trustedRootSha256=$Selection.verificationInputs.trustedRootSha256;
              hostVerifier=(Join-Path $Support 'gh.exe'); hostVerifierSha256=$Selection.verificationInputs.verifierSha256.windows;
              guestVerifier=(Join-Path $Support 'gh-linux'); guestVerifierSha256=$Selection.verificationInputs.verifierSha256.linux
          }
          $Selection.faultProbe = Join-Path $Support 'dev_node_fault_probe.py'
          $Selection | ConvertTo-Json -Depth 15 | Set-Content (Join-Path $Support 'inputs.json') -Encoding utf8
      - name: Exercise packaged frontend with host SDKs and Python absent from its PATH
        shell: pwsh
        run: |
          $Support = Join-Path $env:RUNNER_TEMP 'packaged-support'
          $Observation = Join-Path $env:RUNNER_TEMP 'packaged-observation'
          Set-Location $Support
          python -I -B dev_packaged_probe.py --inputs (Join-Path $Support 'inputs.json') --output $Observation
          if ($LASTEXITCODE -ne 0) { throw 'Packaged schedule failed; retain the original attempt.' }
      - name: Retain bounded public success or failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-windows-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packaged-observation/observation.json
            ${{ runner.temp }}/packaged-support/selection.json
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Actual packaged direct Linux and explicit SSH schedule
    needs: support
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-qualification-support
          path: ${{ runner.temp }}/packaged-support
      - name: Download only selected Linux, Rust and native candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess
          support = Path(os.environ['RUNNER_TEMP']) / 'packaged-support'
          selected = json.loads((support / 'selection.json').read_bytes())
          sha = selected['sourceCommit']
          assert re.fullmatch(r'[a-f0-9]{40}', sha)
          target = Path(os.environ['RUNNER_TEMP']) / 'packaged-candidates'
          target.mkdir()
          selected['artifacts'] = {}
          for name, kind, artifact in (
              ('linux', 'developer', 'developer-linux-candidate-' + sha),
              ('rust', 'developer', 'developer-rust-tools-candidate-' + sha),
              ('native', 'runtime', 'native-runtime-candidate-development-test-' + sha)):
              destination = target / name
              subprocess.run(['gh', 'run', 'download', str(selected['candidateRuns'][kind]['id']),
                  '--repo', 'KirilsTurkins/latent-service-fabric', '--name', artifact, '--dir', str(destination)],
                  check=True, timeout=300)
              selected['artifacts'][name] = str(destination)
          (support / 'gh-linux').chmod(0o700)
          selected['trust'] = {
              'developerPolicy': str(support / 'developer-policy.json'),
              'runtimePolicy': str(support / 'runtime-policy.json'),
              'trustedRoot': str(support / 'trusted_root.jsonl'),
              'trustedRootSha256': selected['verificationInputs']['trustedRootSha256'],
              'hostVerifier': str(support / 'gh-linux'), 'guestVerifier': str(support / 'gh-linux'),
              'hostVerifierSha256': selected['verificationInputs']['verifierSha256']['linux'],
              'guestVerifierSha256': selected['verificationInputs']['verifierSha256']['linux']}
          (support / 'inputs.json').write_text(json.dumps(selected), encoding='utf-8')
          PY
      - name: Run the authenticated packages in a clean compiler-free disconnected Ubuntu container
        run: |
          cd "$RUNNER_TEMP/packaged-support"
          python3 -I -B dev_packaged_linux_host.py --inputs inputs.json --output "$RUNNER_TEMP/packaged-linux"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Execute the generated terminal devcontainer against a separate explicit SSH peer
        run: |
          cd "$RUNNER_TEMP/packaged-support"
          python3 -I -B dev_packaged_container_host.py --inputs inputs.json \
            --linux-output "$RUNNER_TEMP/packaged-linux" --output "$RUNNER_TEMP/packaged-devcontainer"
      - name: Retain bounded public Linux success or failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-linux-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packaged-linux/host-observation.json
            ${{ runner.temp }}/packaged-linux/observation.json
            ${{ runner.temp }}/packaged-devcontainer/host-observation.json
            ${{ runner.temp }}/packaged-devcontainer/observation.json
            ${{ runner.temp }}/packaged-support/selection.json
          if-no-files-found: error
          retention-days: 7
