name: Phase 1 measurements

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Full includes 100k scale/soak; smoke only validates collectors
        type: choice
        default: smoke
        options:
          - smoke
          - full
      kind:
        description: Measurement suite to execute
        type: choice
        default: all
        options:
          - all
          - scale
          - soak
          - benchmark

permissions:
  contents: read

jobs:
  measurements:
    name: Phase 1 ${{ inputs.profile }} ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(inputs.kind == 'all' && '["scale","soak","benchmark"]' || format('["{0}"]', inputs.kind)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Build required guest fixtures
        run: |
          unset CARGO_INCREMENTAL
          bash tools/build_phase1_measurement_fixtures.sh
      - name: Run measurements with bounded owned collectors
        env:
          MEASUREMENT_PROFILE: ${{ inputs.profile }}
          MEASUREMENT_KIND: ${{ matrix.kind }}
        run: |
          unset CARGO_INCREMENTAL
          python3 tools/run_phase1_measurements.py --profile "$MEASUREMENT_PROFILE" --kind "$MEASUREMENT_KIND"
      - name: Retain measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-${{ inputs.profile }}-${{ matrix.kind }}-${{ github.sha }}
          path: target/phase1-measurements/
          if-no-files-found: warn
          retention-days: 30
