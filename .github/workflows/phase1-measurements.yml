name: Phase 1 measurements

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Full includes 100k scale/soak; smoke only validates collectors
        type: choice
        default: smoke
        options:
          - smoke
          - full
      kind:
        description: Measurement suite to execute
        type: choice
        default: all
        options:
          - all
          - scale
          - soak
          - benchmark

permissions:
  contents: read

jobs:
  measurements:
    name: Phase 1 ${{ inputs.profile }} ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(inputs.kind == 'all' && '["scale","soak","benchmark"]' || format('["{0}"]', inputs.kind)) }}
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Build required guest fixtures
        run: |
          unset CARGO_INCREMENTAL
          bash tools/build_phase1_measurement_fixtures.sh
      - name: Run measurements with bounded owned collectors
        env:
          MEASUREMENT_PROFILE: ${{ inputs.profile }}
          MEASUREMENT_KIND: ${{ matrix.kind }}
        run: |
          unset CARGO_INCREMENTAL
          python3 tools/run_phase1_measurements.py --profile "$MEASUREMENT_PROFILE" --kind "$MEASUREMENT_KIND"
      - name: Retain measurements and failure diagnostics
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: phase1-${{ inputs.profile }}-${{ matrix.kind }}-${{ github.sha }}
          path: target/phase1-measurements/
          if-no-files-found: warn
          retention-days: 30
