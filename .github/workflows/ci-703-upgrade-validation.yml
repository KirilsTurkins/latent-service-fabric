name: PR 703 upgrade validation
on:
  push:
    branches: [fix/ci-703-upgrade-validation]
    paths: [.github/workflows/ci-703-upgrade-validation.yml, .github/pr703-assemble.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Assemble reviewed runtime upgrade while retaining development tooling
        run: python3 .github/pr703-assemble.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr703-integration-inspection
          path: ${{ runner.temp }}/703-evidence/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
