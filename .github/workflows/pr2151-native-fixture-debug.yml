name: PR 2151 native fixture diagnosis
on:
  push:
    branches: ['diagnostic/pr2151-native-fixture-20261119']
permissions:
  contents: read
jobs:
  fixture:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/diagnostic/pr2151-native-fixture-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
      LSF_REQUIRE_NATIVE_PROCESS_TESTS: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - name: Install the same parser dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Run the unchanged native fixture and expose captured setup output
        run: |
          python3 - <<'PY'
          import subprocess, unittest
          class Report(unittest.TextTestResult):
              def addError(self, test, error):
                  cause = error[1]
                  if isinstance(cause, subprocess.CalledProcessError):
                      print('FAILED COMMAND:', cause.cmd, flush=True)
                      print('CAPTURED OUTPUT:', cause.output, flush=True)
                      print('CAPTURED STDERR:', cause.stderr, flush=True)
                  super().addError(test, error)
          suite = unittest.defaultTestLoader.loadTestsFromName('tools.tests.test_local_tests.NativeEntrypointTests.test_real_rust_independent_additions_merge_and_run_through_local_owner')
          result = unittest.TextTestRunner(verbosity=2, resultclass=Report).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Record installed components after the exact test
        if: always()
        run: |
          rustup toolchain list
          rustup component list --toolchain 1.97.1 --installed
          rustup target list --toolchain 1.97.1 --installed
