name: TypeScript canonical borrow release controls

on:
  push:
    branches: ['feat/typescript-borrow-release-source-20261024']
    paths:
      - '.github/workflows/typescript-borrow-release.yml'
      - 'tools/qualify_typescript_borrow_release.py'
      - 'tools/typescript_borrow_splicer_inputs.py'
      - 'tools/typescript_guest/**'
      - 'tools/tests/test_typescript_import_cancellation.py'
      - 'tools/tests/test_typescript_borrow_controls.py'
      - 'sdk/typescript-guest/activation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-borrow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-controls:
    name: One source-built library and engine with native borrow controls
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Make the pinned pre-feature ABI baseline available in shallow checkout
        run: git fetch --no-tags --depth=1 origin 5e465f8c534ee31d407dbb9720fdec35cb9da71d
      - name: Check owning-evidence refusal controls
        run: python3 -m unittest tools.tests.test_typescript_borrow_controls -v
      - name: Authenticate and acquire only the unchanged source splicer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/typescript_borrow_splicer_inputs.py --output "$RUNNER_TEMP/typescript-borrow-splicer"
      - name: Install normal SpiderMonkey source build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 lld-18 autoconf2.13 m4 libffi-dev python3-dev
      - name: Install the normal locked public compiler and exact maintained bindgen
        run: |
          python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-borrow-public-tools"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/typescript-borrow-bindgen-tools"
      - name: Build one normal library and import engine then run all native cases
        run: |
          python3 tools/qualify_typescript_borrow_release.py \
            --tools "$RUNNER_TEMP/typescript-borrow-public-tools" \
            --source-splicer-build "$RUNNER_TEMP/typescript-borrow-splicer/splicer" \
            --wit-bindgen "$RUNNER_TEMP/typescript-borrow-bindgen-tools/wit-bindgen" \
            --output "$RUNNER_TEMP/typescript-borrow-controls"
      - name: Retain actual products source identities commands and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-borrow-controls-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-borrow-splicer/acquisition.json
            ${{ runner.temp }}/typescript-borrow-splicer/splicer.zip
            ${{ runner.temp }}/typescript-borrow-splicer/splicer/**
            ${{ runner.temp }}/typescript-borrow-controls/*.json
            ${{ runner.temp }}/typescript-borrow-controls/*.log
            ${{ runner.temp }}/typescript-borrow-controls/*.wasm
            ${{ runner.temp }}/typescript-borrow-controls/control-includes/**
            ${{ runner.temp }}/typescript-borrow-controls/library/*.json
            ${{ runner.temp }}/typescript-borrow-controls/library/*.log
            ${{ runner.temp }}/typescript-borrow-controls/library/mozconfig
            ${{ runner.temp }}/typescript-borrow-controls/library/licenses/**
            ${{ runner.temp }}/typescript-borrow-controls/library/obj/js/src/build/libjs_static.a
            ${{ runner.temp }}/typescript-borrow-controls/library/obj/dist/include/**
            ${{ runner.temp }}/typescript-borrow-controls/engine/*.json
            ${{ runner.temp }}/typescript-borrow-controls/engine/*.log
            ${{ runner.temp }}/typescript-borrow-controls/engine/engine.wasm
            ${{ runner.temp }}/typescript-borrow-controls/engine/spidermonkey/**
            ${{ runner.temp }}/typescript-borrow-controls/engine/jobs-generated/**
            ${{ runner.temp }}/typescript-borrow-controls/engine/clocks-generated/**
            ${{ runner.temp }}/typescript-borrow-controls/engine/licenses/**
          if-no-files-found: warn
          retention-days: 7
