name: Minimal ordinary C child diagnostic

on:
  push:
    branches: ['diag/c-thread-minimal-20261022']
    paths:
      - '.github/workflows/c-thread-minimal-diagnostic.yml'
      - 'tools/c_thread_minimal_fixture.py'
      - 'tools/diagnose_c_thread_minimal.py'
      - 'tools/tests/test_c_thread_minimal.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: c-thread-minimal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimal-child:
    name: One normal C build and five diagnostic observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Fetch exact unchanged native source object
        run: git fetch --no-tags --depth=1 origin 7b6365ee39dea9770591a931b96711965f8a1aaf
      - name: Check source-only minimal and original diagnostic controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_thread_minimal tools.tests.test_c_thread_prefix -v
      - name: Authenticate all five unchanged native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/host_codec_native_products.py --output "$RUNNER_TEMP/c-minimal-native"
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        with:
          version: '0.16.0'
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install only normal captured C compiler prerequisites
        run: |
          python3 -B tools/install_guest_bindgen.py "$RUNNER_TEMP/c-minimal-bindgen"
          echo "$RUNNER_TEMP/c-minimal-bindgen" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build one diagnostic component and observe exactly five calls
        run: python3 -B tools/diagnose_c_thread_minimal.py --prepared "$RUNNER_TEMP/c-minimal-native" --output "$RUNNER_TEMP/c-thread-minimal"
      - name: Retain bounded public source, build, call and cleanup observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-thread-minimal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-thread-minimal/*.json
            ${{ runner.temp }}/c-thread-minimal/*.txt
            ${{ runner.temp }}/c-thread-minimal/controls/*.json
            ${{ runner.temp }}/c-thread-minimal/commands/logs/*.txt
            ${{ runner.temp }}/c-thread-minimal/application/src/main.c
            ${{ runner.temp }}/c-thread-minimal/application/wit/**
            ${{ runner.temp }}/c-thread-minimal/build/*.json
            ${{ runner.temp }}/c-thread-minimal/build/component.wasm
            ${{ runner.temp }}/c-thread-minimal/build/logs/*.txt
            ${{ runner.temp }}/c-thread-minimal/build/wit/**
          retention-days: 7
