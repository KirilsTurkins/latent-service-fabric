name: Published managed HTTP clients
on:
  push:
    branches: ['feat/dotnet-published-http-20261020']
    paths: ['.github/workflows/dotnet-published-http.yml']
  workflow_dispatch:
    inputs:
      fresh_component:
        description: Compile a new component instead of replaying the authenticated successful build
        type: boolean
        default: false
      mixed_content:
        description: One fresh default HttpClient content and accepted-work component without a native rebuild
        type: boolean
        default: false
      owner_capacity:
        description: One fresh managed owner capacity component on the authenticated native6fd products
        type: boolean
        default: false
      periodic_diagnostic:
        description: One diagnostic-only normal AOT with closed original TimerHandler cause projection
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: dotnet-published-http-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mixed-content:
    if: github.event_name == 'workflow_dispatch' && inputs.mixed_content && !inputs.owner_capacity && !inputs.periodic_diagnostic
    name: Default HttpClient streamed content and accepted managed work
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Fetch the immutable native producer source before authentication
        run: git fetch --no-tags --depth=1 origin 6fd19eab2c224fc31481d03de5008de4d3e4429e
      - name: Check exact managed fixture ownership and refusal controls
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_http_mixed -v
      - name: Check the selected private managed ownership contract
        run: python3 -B -m unittest tools.tests.test_dotnet_managed_work -v
      - name: Execute actual CLR Task state controls with explicit test ports
        run: python3 -B tools/dotnet_managed_work_controls.py --dotnet "$(command -v dotnet)" --output "$RUNNER_TEMP/managed-work-state-controls"
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare the pinned compiler and current closed-runtime adapters
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/mixed-bindgen"
          export PATH="$RUNNER_TEMP/mixed-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/mixed-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/mixed-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute actual failed-request cleanup RED and GREEN controls
        run: python3 -B tools/dotnet_managed_work_controls.py --dotnet "$(command -v dotnet)" --http-abort-tools "$RUNNER_TEMP/mixed-tools" --output "$RUNNER_TEMP/http-abort-controls"
      - name: Authenticate the exact five historical products and all 134 native materials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/mixed-native"
      - name: Compile one ordinary default-client component and execute all finite mixed cases
        run: python3 -B tools/qualify_dotnet_http_mixed.py --native "$RUNNER_TEMP/mixed-native" --tools "$RUNNER_TEMP/mixed-tools" --output "$RUNNER_TEMP/managed-http-mixed"
      - name: Retain bounded public source build and actual physical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-http-mixed-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mixed-native/*.json
            ${{ runner.temp }}/managed-work-state-controls/state-controls.json
            ${{ runner.temp }}/managed-work-state-controls/logs/**
            ${{ runner.temp }}/http-abort-controls/abort-controls.json
            ${{ runner.temp }}/http-abort-controls/rewrite.json
            ${{ runner.temp }}/http-abort-controls/logs/**
            ${{ runner.temp }}/mixed-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/mixed-tools/runtime-inputs.json
            ${{ runner.temp }}/mixed-tools/wasi-sdk.json
            ${{ runner.temp }}/mixed-tools/logs/**
            ${{ runner.temp }}/managed-http-mixed/*.json
            ${{ runner.temp }}/managed-http-mixed/reference/reference.json
            ${{ runner.temp }}/managed-http-mixed/reference/logs/**
            ${{ runner.temp }}/managed-http-mixed/build/*.json
            ${{ runner.temp }}/managed-http-mixed/build/compiler.*.txt
            ${{ runner.temp }}/managed-http-mixed/build/component.wasm
            ${{ runner.temp }}/managed-http-mixed/build/native-aot-raw.wasm
            ${{ runner.temp }}/managed-http-mixed/build/native-aot-original.wasm
            ${{ runner.temp }}/managed-http-mixed/build/derived-*.dll
            ${{ runner.temp }}/managed-http-mixed/build/package/**
            ${{ runner.temp }}/managed-http-mixed/build/wit/**
            ${{ runner.temp }}/managed-http-mixed/build/logs/**
            ${{ runner.temp }}/managed-http-mixed/node/*.json
            ${{ runner.temp }}/managed-http-mixed/node/controls/*.json
            ${{ runner.temp }}/managed-http-mixed/node/controls/*-partial.stdout
            ${{ runner.temp }}/managed-http-mixed/node/controls/*-partial.stderr
            ${{ runner.temp }}/managed-http-mixed/tenants/*.json
            ${{ runner.temp }}/managed-http-mixed/tenants/examples-controls/*.json
            ${{ runner.temp }}/managed-http-mixed/tenants/examples-controls/*-partial.stdout
            ${{ runner.temp }}/managed-http-mixed/tenants/examples-controls/*-partial.stderr
            ${{ runner.temp }}/managed-http-mixed/tenants/foreign-controls/*.json
            ${{ runner.temp }}/managed-http-mixed/tenants/foreign-controls/*-partial.stdout
            ${{ runner.temp }}/managed-http-mixed/tenants/foreign-controls/*-partial.stderr
  published-http:
    if: github.event_name == 'workflow_dispatch' && inputs.fresh_component && !inputs.mixed_content && !inputs.owner_capacity && !inputs.periodic_diagnostic
    name: Signed ordinary Flurl Refit and outside NuGet clients
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Fetch the exact successful native producer source
        run: git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b
      - name: Check immutable capture real peer and compiler boundaries
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_published_http_fixture tools.tests.test_dotnet_reflection_boundaries tools.tests.test_sdk_native_products_reader -v
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare the pinned compiler and current small closed-runtime adapters
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/published-bindgen"
          export PATH="$RUNNER_TEMP/published-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/published-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/published-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Authenticate the five frozen products without a native host rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/published-native"
      - name: Capture one actual component and execute ordinary library paths
        run: python3 -B tools/qualify_dotnet_published_http.py --native "$RUNNER_TEMP/published-native" --tools "$RUNNER_TEMP/published-tools" --output "$RUNNER_TEMP/published-http"
      - name: Retain bounded public original build and library evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-published-http-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/published-native/*.json
            ${{ runner.temp }}/published-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/published-tools/runtime-inputs.json
            ${{ runner.temp }}/published-tools/wasi-sdk.json
            ${{ runner.temp }}/published-tools/logs/**
            ${{ runner.temp }}/published-http/*.json
            ${{ runner.temp }}/published-http/generator-approval-required/*.json
            ${{ runner.temp }}/published-http/generator-approval-required/compiler.*.txt
            ${{ runner.temp }}/published-http/build/*.json
            ${{ runner.temp }}/published-http/build/compiler.*.txt
            ${{ runner.temp }}/published-http/build/component.wasm
            ${{ runner.temp }}/published-http/build/derived-*.dll
            ${{ runner.temp }}/published-http/build/executable-input-outputs/**
            ${{ runner.temp }}/published-http/build/package/**
            ${{ runner.temp }}/published-http/build/logs/**
            ${{ runner.temp }}/published-http/outside/compiler-*/logs/**
            ${{ runner.temp }}/published-http/node/*.json
            ${{ runner.temp }}/published-http/node/controls/*.json
  exact-component:
    if: (github.event_name != 'workflow_dispatch' || !inputs.fresh_component) && !inputs.mixed_content && !inputs.owner_capacity && !inputs.periodic_diagnostic
    name: Original captured Flurl Refit component with corrected progress records
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install the existing locked reader dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Fetch the exact successful native and component build sources
        run: git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b 7e3de703bc7666cee9407ff15205b9d5809a9c20
      - name: Check original origin and archive refusal boundaries
        run: python3 -B -m unittest tools.tests.test_dotnet_published_http_replay tools.tests.test_sdk_native_products_reader -v
      - name: Authenticate the same five native products without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/published-native"
      - name: Execute all original signed library outcomes without recompiling the component
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/replay_dotnet_published_http.py --native "$RUNNER_TEMP/published-native" --output "$RUNNER_TEMP/published-replay"
      - name: Retain public build ancestry and actual signed replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-published-http-replay-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/published-native/*.json
            ${{ runner.temp }}/published-replay/*.json
            ${{ runner.temp }}/published-replay/node/*.json
            ${{ runner.temp }}/published-replay/node/controls/*.json
            ${{ runner.temp }}/published-replay/original/published-http/FAILED.json
            ${{ runner.temp }}/published-replay/original/published-http/catalogue-free-source.json
            ${{ runner.temp }}/published-replay/original/published-http/node/FAILED.json
            ${{ runner.temp }}/published-replay/original/published-http/build/*.json

  owner-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_capacity && !inputs.periodic_diagnostic
    name: Managed Task queue native and individual Timer capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Fetch the immutable native producer source before authentication
        run: git fetch --no-tags --depth=1 origin 6fd19eab2c224fc31481d03de5008de4d3e4429e
      - name: Check exact managed capacity and timer producer boundaries
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_managed_capacity tools.tests.test_dotnet_managed_timers -v
      - name: Execute actual CLR Task state controls with explicit test ports
        run: python3 -B tools/dotnet_managed_work_controls.py --dotnet "$(command -v dotnet)" --output "$RUNNER_TEMP/managed-work-state-controls"
      - name: Execute actual timer ownership CLR state controls with explicit test ports
        run: python3 -B tools/dotnet_managed_work_controls.py --dotnet "$(command -v dotnet)" --timers --output "$RUNNER_TEMP/managed-timer-state-controls"
      - name: Check actual deferred timer source after its creating task returns
        run: python3 -B tools/dotnet_managed_work_controls.py --dotnet "$(command -v dotnet)" --timer-wait-source --output "$RUNNER_TEMP/timer-wait-source-controls"
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare the pinned compiler and current closed-runtime adapters
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/capacity-bindgen"
          export PATH="$RUNNER_TEMP/capacity-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/capacity-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/capacity-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Check the actual private timer driver against the original two queued slots
        run: python3 -B tools/dotnet_managed_work_controls.py --dotnet "$(command -v dotnet)" --timer-driver-tools "$RUNNER_TEMP/capacity-tools" --output "$RUNNER_TEMP/timer-driver-controls"
      - name: Authenticate the exact five historical products and all 134 native materials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/capacity-native"
      - name: Compile one capacity component and execute seventeen strict owner cases
        run: python3 -B tools/qualify_dotnet_managed_capacity.py --native "$RUNNER_TEMP/capacity-native" --tools "$RUNNER_TEMP/capacity-tools" --output "$RUNNER_TEMP/managed-capacity"
      - name: Retain bounded public capacity source build and actual owner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-managed-capacity-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/capacity-native/*.json
            ${{ runner.temp }}/managed-work-state-controls/state-controls.json
            ${{ runner.temp }}/managed-work-state-controls/logs/**
            ${{ runner.temp }}/managed-timer-state-controls/timer-state-controls.json
            ${{ runner.temp }}/managed-timer-state-controls/logs/**
            ${{ runner.temp }}/timer-wait-source-controls/timer-wait-source-controls.json
            ${{ runner.temp }}/timer-wait-source-controls/logs/**
            ${{ runner.temp }}/timer-driver-controls/timer-driver-controls.json
            ${{ runner.temp }}/timer-driver-controls/logs/**
            ${{ runner.temp }}/capacity-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/capacity-tools/runtime-inputs.json
            ${{ runner.temp }}/capacity-tools/wasi-sdk.json
            ${{ runner.temp }}/capacity-tools/logs/**
            ${{ runner.temp }}/managed-capacity/*.json
            ${{ runner.temp }}/managed-capacity/build/*.json
            ${{ runner.temp }}/managed-capacity/build/compiler.*.txt
            ${{ runner.temp }}/managed-capacity/build/component.wasm
            ${{ runner.temp }}/managed-capacity/build/native-aot-raw.wasm
            ${{ runner.temp }}/managed-capacity/build/native-aot-original.wasm
            ${{ runner.temp }}/managed-capacity/build/derived-*.dll
            ${{ runner.temp }}/managed-capacity/build/package/**
            ${{ runner.temp }}/managed-capacity/build/wit/**
            ${{ runner.temp }}/managed-capacity/build/logs/**
            ${{ runner.temp }}/managed-capacity/node/*.json
            ${{ runner.temp }}/managed-capacity/node/native-*/*.json
            ${{ runner.temp }}/managed-capacity/node/native-*/controls/*.json
            ${{ runner.temp }}/managed-capacity/node/native-*/controls/*-partial.stdout
            ${{ runner.temp }}/managed-capacity/node/native-*/controls/*-partial.stderr
  periodic-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.periodic_diagnostic && !inputs.owner_capacity && !inputs.mixed_content && !inputs.fresh_component
    name: Closed periodic TimerHandler diagnostic on native6fd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Fetch immutable original SDK and native source preimages
        run: |
          git fetch --no-tags --depth=1 origin 7d2c0f793cf4a87594eadd2d82d5798f448be34e
          git fetch --no-tags --depth=1 origin 6fd19eab2c224fc31481d03de5008de4d3e4429e
      - name: Check closed source codes exact LOG accounting and bounded stream projection
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_periodic_diagnostic -v
          rustc --edition 2021 --test tools/fixtures/dotnet-periodic-console-control.rs -o "$RUNNER_TEMP/periodic-stream-control"
          "$RUNNER_TEMP/periodic-stream-control" --test-threads=1
      - name: Derive only two diagnostic SDK sources in a separate detached checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          git worktree add --detach "$RUNNER_TEMP/periodic-source" "$GITHUB_SHA"
          python3 -B "$RUNNER_TEMP/periodic-source/tools/dotnet_periodic_diagnostic.py" derive
      - name: Install the normal captured compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libgdbm6t64 libreadline8t64 libsqlite3-0 liblttng-ust1t64 libtcl8.6 libtk8.6
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned tools against the captured diagnostic SDK
        working-directory: ${{ runner.temp }}/periodic-source
        shell: bash
        run: |
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' 87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/periodic-bindgen"
          export PATH="$RUNNER_TEMP/periodic-bindgen:$PATH"
          printf '%s\n' "$RUNNER_TEMP/periodic-bindgen" >> "$GITHUB_PATH"
          python3 tools/dotnet_capsule.py install-tools "$RUNNER_TEMP/periodic-tools" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Authenticate the unchanged five historical products and all 134 native materials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_preparation_cli_native_products.py --output "$RUNNER_TEMP/periodic-native"
      - name: Compile one normal diagnostic AOT and retain the original failed periodic result
        working-directory: ${{ runner.temp }}/periodic-source
        run: python3 -B tools/dotnet_periodic_diagnostic.py qualify --native "$RUNNER_TEMP/periodic-native" --tools "$RUNNER_TEMP/periodic-tools" --output "$RUNNER_TEMP/periodic-diagnostic"
      - name: Verify the original checkout was never modified
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain only bounded public diagnostic records and original failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-periodic-diagnostic-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/periodic-source/PERIODIC-DIAGNOSTIC-SOURCE.json
            ${{ runner.temp }}/periodic-native/*.json
            ${{ runner.temp }}/periodic-tools/INSTALL-COMPLETE.json
            ${{ runner.temp }}/periodic-tools/runtime-inputs.json
            ${{ runner.temp }}/periodic-tools/logs/**
            ${{ runner.temp }}/periodic-diagnostic/*.json
            ${{ runner.temp }}/periodic-diagnostic/handler-controls/*.json
            ${{ runner.temp }}/periodic-diagnostic/handler-controls/logs/**
            ${{ runner.temp }}/periodic-diagnostic/build/*.json
            ${{ runner.temp }}/periodic-diagnostic/build/compiler.*.txt
            ${{ runner.temp }}/periodic-diagnostic/build/component.wasm
            ${{ runner.temp }}/periodic-diagnostic/build/native-aot-raw.wasm
            ${{ runner.temp }}/periodic-diagnostic/build/native-aot-original.wasm
            ${{ runner.temp }}/periodic-diagnostic/build/derived-*.dll
            ${{ runner.temp }}/periodic-diagnostic/build/package/**
            ${{ runner.temp }}/periodic-diagnostic/build/wit/**
            ${{ runner.temp }}/periodic-diagnostic/build/logs/**
            ${{ runner.temp }}/periodic-diagnostic/node/*.json
            ${{ runner.temp }}/periodic-diagnostic/node/controls/*.json
            ${{ runner.temp }}/periodic-diagnostic/node/controls/*-partial.stdout
            ${{ runner.temp }}/periodic-diagnostic/node/controls/*-partial.stderr
