name: Same-node resource tenant isolation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-tenants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tenants:
    name: Retained ${{ matrix.language }} resources across two tenants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, typescript]
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install controller requirements and check closed producer scope
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_resource_tenant_isolation -v
      - name: Authenticate fixed normal native products before executable restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12255531553 > "$RUNNER_TEMP/resource-native-producer.json"
          python3 -B tools/qualify_resource_tenants.py --verify-native-producer "$RUNNER_TEMP/resource-native-producer.json"
      - name: Restore the one successful current normal native producer
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: sdk-native-products-a4f05f3f243889cc7ba7a0404bdc76afec32d3c2
          run-id: 39400186766
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-native
      - name: Authenticate original go resource component producer
        if: matrix.language == 'go'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12250800303 > "$RUNNER_TEMP/resource-original-producer.json"
          python3 -B tools/qualify_resource_tenants.py --language go --verify-original-producer "$RUNNER_TEMP/resource-original-producer.json"
      - name: Restore original go public component and compile records
        if: matrix.language == 'go'
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: go-embedded-resource-reference-ba710b00000d7ea946f85dcf66148a98de19f800
          run-id: 39390308334
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-original
      - name: Authenticate original typescript resource component producer
        if: matrix.language == 'typescript'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12253448936 > "$RUNNER_TEMP/resource-original-producer.json"
          python3 -B tools/qualify_resource_tenants.py --language typescript --verify-original-producer "$RUNNER_TEMP/resource-original-producer.json"
      - name: Restore original typescript public component and compile records
        if: matrix.language == 'typescript'
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: embedded-resource-typescript-192c7b92faa7c8e0d222c62c1cbcf5d0e25cb0b5
          run-id: 39394464486
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-original
      - name: Fresh packaging and signing then trap and reuse both original tenant scopes
        run: |
          python3 -B tools/qualify_resource_tenants.py --language "${{ matrix.language }}" \
            --original "$RUNNER_TEMP/resource-original" --original-producer "$RUNNER_TEMP/resource-original-producer.json" \
            --native "$RUNNER_TEMP/resource-native" --native-producer "$RUNNER_TEMP/resource-native-producer.json" \
            --output "$RUNNER_TEMP/resource-tenants"
      - name: Retain bounded public results and explicit original compile ancestry
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: resource-tenants-${{ matrix.language }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/resource-native-producer.json
            ${{ runner.temp }}/resource-original-producer.json
            ${{ runner.temp }}/resource-tenants-original/resource-original-acquisition.json
            ${{ runner.temp }}/resource-tenants/qualified.json
            ${{ runner.temp }}/resource-tenants/FAILED.json
            ${{ runner.temp }}/resource-tenants/logs/**
            ${{ runner.temp }}/resource-tenants/examples-controls/*.json
            ${{ runner.temp }}/resource-tenants/foreign-controls/*.json
            ${{ runner.temp }}/resource-tenants/signed/my-greeting/build-observation.json
