name: Actual Go closed network reference

on:
  workflow_dispatch:
  push:
    branches: ['fix/go-closed-network-20261020']

permissions:
  contents: read

concurrency:
  group: go-closed-network-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed-network:
    name: Actual upstream fake listeners and closed Unsupported reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - name: Install pinned source controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Reject source drift and preserve original overlay and logging controls
        run: python3 -m unittest tools.tests.test_go_closed_network tools.tests.test_go_runtime_overlay tools.tests.test_go_managed_idle tools.tests.test_go_standard_logging -v
      - name: Authenticate the maintained upstream compiler
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-closed-network-tools"
          test ! -e "$out"
          mkdir "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$out/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $out/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$out/go.tar.gz" -C "$out"
          echo "$out/go/bin" >> "$GITHUB_PATH"
      - name: Compile identical ordinary source and require both real counterfactual outcomes
        run: python3 tools/qualify_go_closed_network.py --output "$RUNNER_TEMP/go-closed-network-reference"
      - name: Retain bounded exact source compiler diagnostics and reference outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-closed-network-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-closed-network-reference/*.json
            ${{ runner.temp }}/go-closed-network-reference/logs/**
            ${{ runner.temp }}/go-closed-network-reference/upstream.wasm
            ${{ runner.temp }}/go-closed-network-reference/corrected.wasm
          if-no-files-found: warn
          retention-days: 7
