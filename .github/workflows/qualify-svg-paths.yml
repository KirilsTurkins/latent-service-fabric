name: Qualify SVG diagnostic paths

on:
  push:
    branches: [fix/svg-diagnostic-paths]
    paths: [.github/workflows/qualify-svg-paths.yml]

permissions:
  contents: read

jobs:
  qualify:
    name: SVG paths (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Install pinned validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Reproduce the original platform-specific failures
        shell: python
        run: |
          import os
          import unittest
          names = [
              "tools.tests.test_validate_repository.SourceTraversalTests.test_documentation_svg_rejects_duplicate_definition_ids",
              "tools.tests.test_validate_repository.SourceTraversalTests.test_documentation_svg_rejects_duplicate_title_and_shape_id",
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 2 and not result.errors and not result.skipped
          expected_failures = 2 if os.name == "nt" else 0
          assert len(result.failures) == expected_failures, result.failures
          print(f"Confirmed original baseline: {expected_failures} expected path assertion failures")
      - name: Apply the focused formatting fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/validate_repository.py")
          source = path.read_bytes()
          old = b'    for path in files_with_suffix(".svg", root):\n        relative = path.relative_to(root)\n'
          new = b'    for path in files_with_suffix(".svg", root):\n        relative = path.relative_to(root).as_posix()\n'
          assert source.count(old) == 1, "SVG formatting baseline changed"
          path.write_bytes(source.replace(old, new))
      - name: Run the two unchanged issue regressions
        run: python -m unittest -v tools.tests.test_validate_repository.SourceTraversalTests.test_documentation_svg_rejects_duplicate_definition_ids tools.tests.test_validate_repository.SourceTraversalTests.test_documentation_svg_rejects_duplicate_title_and_shape_id
      - name: Run source traversal and portable diagnostic regressions
        run: python -m unittest -v tools.tests.test_validate_repository.SourceTraversalTests tools.tests.test_validate_svg_paths
      - name: Run complete repository and documentation test modules
        if: runner.os == 'Linux'
        run: python -m unittest -v tools.tests.test_validate_repository tools.tests.test_validate_docs
      - name: Validate actual repository sources and documentation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python tools/validate_repository.py
          python tools/validate_docs.py
      - name: Record tested file identities
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          for name in ("tools/validate_repository.py", "tools/tests/test_validate_svg_paths.py", "tools/tests/test_validate_repository.py"):
              print(f"{name}: sha256:{hashlib.sha256(Path(name).read_bytes()).hexdigest()}")

  publish:
    name: Commit qualified fix and remove temporary workflow
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Apply the exact qualified one-line change
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/validate_repository.py")
          source = path.read_bytes()
          old = b'    for path in files_with_suffix(".svg", root):\n        relative = path.relative_to(root)\n'
          new = b'    for path in files_with_suffix(".svg", root):\n        relative = path.relative_to(root).as_posix()\n'
          assert source.count(old) == 1, "SVG formatting baseline changed"
          path.write_bytes(source.replace(old, new))
          Path(".github/workflows/qualify-svg-paths.yml").unlink()
      - name: Commit only the qualified fix and temporary workflow removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_repository.py .github/workflows/qualify-svg-paths.yml
          git diff --cached --check
          git commit -m "fix(tooling): normalize SVG diagnostic paths across platforms" -m "Use repository-relative POSIX formatting without changing SVG validation or file I/O. Qualified on Python 3.13.5 on Windows and Linux; remove the temporary qualification workflow. Refs #324."
          git push origin HEAD:refs/heads/fix/svg-diagnostic-paths
