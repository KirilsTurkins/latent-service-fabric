name: TypeScript stacked source recovery

on:
  push:
    branches: ['feat/typescript-runtime-745']
    paths: ['.github/workflows/typescript-stack-source-recovery.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Capture registry inputs from the unchanged lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, tomllib, urllib.request
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'typescript-stack-crates'
          output.mkdir()
          names = {'combine', 'fiat-crypto', 'macro-string', 'prettyplease', 'rustversion',
                   'same-file', 'serde_spanned', 'simd_cesu8', 'simdutf8', 'toml',
                   'toml_datetime', 'toml_parser', 'toml_writer', 'tonic-build',
                   'tonic-prost-build', 'valuable', 'walkdir', 'wasm-encoder',
                   'wasm-metadata', 'webpki-root-certs', 'wit-bindgen',
                   'wit-bindgen-core', 'wit-bindgen-rust', 'wit-bindgen-rust-macro',
                   'wit-component'}
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          rows = []
          for package in lock['package']:
              if package['name'] not in names or not package.get('source', '').startswith('registry+'):
                  continue
              filename = package['name'] + '-' + package['version'] + '.crate'
              url = 'https://static.crates.io/crates/' + package['name'] + '/' + filename
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(16 * 1024 * 1024 + 1)
              assert len(data) <= 16 * 1024 * 1024
              assert hashlib.sha256(data).hexdigest() == package['checksum'], filename
              (output / filename).write_bytes(data)
              rows.append(package['checksum'] + '  ' + filename)
          (output / 'SHA256SUMS').write_text('\n'.join(rows) + '\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: typescript-stack-crates-${{ github.sha }}
          path: ${{ runner.temp }}/typescript-stack-crates/
          if-no-files-found: error
          retention-days: 2
