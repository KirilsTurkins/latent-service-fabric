name: TypeScript verified stack repair

on:
  push:
    branches: ['feat/typescript-runtime-745']
    paths: ['.github/workflows/typescript-stack-source-recovery.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 2
      - name: Apply only locally tested source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4d13ac091fca10256ada681ee8de09ed6063de3e
          python3 - <<'PY'
          from pathlib import Path
          import json
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, path
              p.write_text(text.replace(before, after, 1))
          replace('tools/tests/test_ci_lane_inventory.py',
                  'from tools import qualify_go_write_progress\n',
                  'from tools import qualify_go_write_progress, activation_stack_native_source\n')
          replace('tools/tests/test_ci_lane_inventory.py',
                  '        expected.add(rust_thread_source)\n',
                  '        expected.add(rust_thread_source)\n        # Rust thread products no longer share the C/ordinary-worker origin.\n        # Its independently frozen source still needs the historical object.\n        expected.add(activation_stack_native_source.SOURCE)\n')
          for name in ('c-once-runtime', 'c-timed-runtime'):
              p = Path('.github/workflows/' + name + '.yml')
              rows = p.read_text().splitlines(True)
              at = next(i for i, row in enumerate(rows) if "      - 'tools/c_guest/" in row)
              rows.insert(at, "      - 'tools/c_guest/closed_headers.py'\n")
              p.write_text(''.join(rows))
              # The only structural policy change is the selected source path.
              p = Path('tools/ci/contracts/workflows/' + name + '.yml/workflow.json')
              d = json.loads(p.read_text())
              paths = d['policy']['on']['push']['paths']
              at = next(i for i, path in enumerate(paths) if path.startswith('tools/c_guest/'))
              paths.insert(at, 'tools/c_guest/closed_headers.py')
              p.write_text(json.dumps(d, sort_keys=True, separators=(',', ':')) + '\n')
          replace('tools/tests/test_c_thread_minimal.py',
                  '   self.assertEqual(set(left),set(right));self.assertEqual(len(left),65)',
                  '   # Identity of every path and byte below is stronger than a stale file count.\n   self.assertEqual(set(left),set(right))')
          replace('tools/go_network_deadline_reference.py',
                  "(connection, b'if timeout.is_some_and(|value| value == 0 || value > 10_000)'),",
                  "# Zero is reserved for an immediate readiness observation (direction 2),\n                # not a zero-duration read/write or a renewed operation deadline.\n                (connection, b'if timeout.is_some_and(|value| value > 10_000 || (value == 0 && direction != 2))'),")
          replace('tools/go_network_deadline_reference.py',
                  "(connection, b'deadline = deadline.min(now + Duration::from_millis(u64::from(value)));'),",
                  "(connection, b'let observation = direction == 2 && !socket.host_tls() && !socket.protected_owner();'),\n                (connection, b'let requested = timeout.map(|value| now + Duration::from_millis(u64::from(value)));'),\n                (connection, b'if !observation {\\n            if let Some(requested) = requested {\\n                deadline = deadline.min(requested);\\n            }\\n        }'),")
          replace('tools/tests/test_go_write_progress.py',
                  "(deadline.MATERIALS[3],b'r := raw.ConnectContext(ctx, request)')):",
                  "(deadline.MATERIALS[3],b'r := raw.ConnectContext(ctx, request)'),\n                             (deadline.MATERIALS[2],b'value > 10_000 || (value == 0 && direction != 2)'),\n                             (deadline.MATERIALS[2],b'if !observation {\\n            if let Some(requested) = requested {'),\n                             (deadline.MATERIALS[2],b'deadline = deadline.min(requested);'),\n                             (deadline.MATERIALS[2],b'let mut deadline = self.deadline.min(state.last_progress + self.idle);')):")
          Path('docs/testing/typescript-stack-continuation.md').write_text('''# TypeScript runtime stack continuation

          ## Scope

          Continuation of PR #1852 and stacked PRs #1931 / #1934 on 2026-11-11.
          Source was restored from the exact parent `c480be742b070220a6aee27ebd2d8f9b6d57ce22`,
          ownership `c34ff183a039dab3fd6aadbf9693135a0d5c1ac6`, and engine
          `de25926b54b6d909fa69656d9bc5879ffca66b9e` trees. Raw blob hashes and full tree
          identities were checked, not inferred from filenames or an older archive.

          ## Shared CI blockers corrected

          The historical-source inventory must include both the new frozen Rust-thread
          producer and the still-used C/ordinary-worker producer. The actual workflow
          already fetched both: the test omitted the latter after their identities split.
          The corrected assertion continues to reject duplicate or unrelated revisions.

          The C once and timed workflows now select `tools/c_guest/closed_headers.py`,
          which is already part of their authenticated build recipes. Their reviewed
          workflow contracts include the same path. The minimal C-thread comparison still
          requires exactly the same paths and unchanged bytes outside `src/main.c`; it no
          longer substitutes a stale total file count for those stronger comparisons.

          The Go deadline reference now recognizes the current immediate readiness path:
          zero timeout belongs only to direction 2, while ordinary read/write still takes
          the minimum of the original activation/idle deadline and the requested timeout.
          Mutation controls reject removal of that direction guard, observation boundary,
          or original/minimum deadline. These are source/reference controls, not live
          provider qualification. No runtime limits, grants or success predicates changed.

          ## Executed local validation

          The five failures recorded in CI run 43052513613 were reproduced, corrected,
          and rerun successfully. The engine branch's maintained ownership selection ran
          81 tests successfully under GCC and under Clang ASan/UBSan with leak detection
          and halt-on-error enabled. These counts record runs; they are not required counts.
          The broader C/Go selection also encountered an unavailable historical Git object
          in the offline workspace, so it is not reported as a complete pass.

          ## Remaining qualification boundaries

          Existing Store teardown-panic retention is already present in #1931; it is not
          reimplemented here. Withholding reuse and retaining owners after a destructor
          panic do not establish successful operating-system decommit or retryable cleanup.
          Failed decommit custody and complete original-budget byte attribution still need
          implementation and evidence. Linked SpiderMonkey collection and final combined
          signed-component execution must be established independently; finite doubles
          and sanitizer controls are not that evidence. No issue is closed or API support
          promoted by this continuation.
          ''')
          PY
          git rm .github/workflows/typescript-stack-source-recovery.yml
          git add .github/workflows/c-once-runtime.yml .github/workflows/c-timed-runtime.yml tools/ci/contracts/workflows/c-once-runtime.yml/workflow.json tools/ci/contracts/workflows/c-timed-runtime.yml/workflow.json tools/go_network_deadline_reference.py tools/tests/test_c_thread_minimal.py tools/tests/test_ci_lane_inventory.py tools/tests/test_go_write_progress.py docs/testing/typescript-stack-continuation.md
          test "$(git write-tree)" = 896f742315f37d7c4e24bc3fa580ca499ba71b09
          git diff --cached --check
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: '3.13.5'
      - name: Reproduce the five corrected CI controls before publication
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_once_runtime.OnceRuntimeControls.test_workflow_selects_every_current_receipt_input tools.tests.test_c_thread_minimal.CThreadMinimal.test_only_application_main_changes_and_all_original_limits_profile_wit_remain_exact tools.tests.test_c_timed_current_products.CurrentTimedProducts.test_workflow_keeps_the_original_limits_and_selects_all_current_inputs tools.tests.test_go_write_progress.GoWriteProgressTests.test_protocol_doubles_and_go_cases_are_explicit_and_do_not_claim_guest_or_provider_evidence tools.tests.test_ci_lane_inventory.RepositoryInventoryTests.test_python_preservation_inputs_fetch_only_exact_frozen_source_commits -v
      - name: Publish parent with a normal non-force push
        run: |
          git config user.name 'Kirils Turkins'
          git config user.email 'turkinskirils@gmail.com'
          git commit -m 'fix(ci): reconcile source guards across the TypeScript stack'
          git push origin HEAD:refs/heads/feat/typescript-runtime-745
