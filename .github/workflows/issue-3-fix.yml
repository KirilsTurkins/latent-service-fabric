name: Fix and validate issue 3 implementation

on:
  push:
    branches:
      - feat/issue-3-manifest-codecs

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install repository validation dependencies
        run: python -m pip install --requirement tools/requirements.lock

      - name: Apply compiler fix and remove bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/latent-manifest/src/codec.rs")
          source = path.read_text(encoding="utf-8")
          old = """    AvailabilityPolicy, BindingEndpoint, BindingManifest, BindingMode, CapabilityGrantSpec,
              CapsuleManifest, ContractExport, ContractImport, ExecutionBackendKind, ExecutionRequirements,
          """
          new = """    AvailabilityPolicy, BindingEndpoint, BindingManifest, BindingMode, CapabilityGrantSpec,
              CapsuleManifest, ContractExport, ContractImport, DeploymentManifest, ExecutionBackendKind,
              ExecutionRequirements,
          """
          if old not in source:
              raise SystemExit("codec import block did not match the expected branch source")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/issue-3-fix.yml").unlink()
          PY
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: import deployment manifest in codec"
          git push

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Validate repository contracts
        run: |
          python tools/validate_repository.py
          python -m unittest discover -s tools/tests

      - name: Check minimum supported Rust version
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 check --workspace --all-targets --all-features --locked
