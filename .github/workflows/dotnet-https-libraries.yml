name: Ordinary managed clients over HTTPS
on:
  push:
    branches: ['feat/dotnet-https-libraries-20261020']
    paths: ['.github/workflows/dotnet-https-libraries.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dotnet-https-libraries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-https:
    name: Original Flurl Refit component with real TLS trust and cancellation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install existing locked reader dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Fetch the exact original native and component sources
        run: git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b 7e3de703bc7666cee9407ff15205b9d5809a9c20
      - name: Check original origin archive and TLS process boundaries
        run: python3 -B -m unittest tools.tests.test_dotnet_published_http_replay tools.tests.test_sdk_native_products_reader tools.tests.test_http_tls_peer -v
      - name: Authenticate five original native products without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/https-native"
      - name: Execute fifteen ordinary library outcomes on independent TLS nodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/qualify_dotnet_https_libraries.py --native "$RUNNER_TEMP/https-native" --output "$RUNNER_TEMP/https-libraries"
      - name: Retain public ancestry certificates and actual signed outcomes
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: dotnet-https-libraries-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/https-native/*.json
            ${{ runner.temp }}/https-libraries/*.json
            ${{ runner.temp }}/https-libraries/node/*.json
            ${{ runner.temp }}/https-libraries/node/*/*.json
            ${{ runner.temp }}/https-libraries/node/*/*.der
            ${{ runner.temp }}/https-libraries/node/*/controls/*.json
            ${{ runner.temp }}/https-libraries/original/published-http/FAILED.json
            ${{ runner.temp }}/https-libraries/original/published-http/catalogue-free-source.json
            ${{ runner.temp }}/https-libraries/original/published-http/node/FAILED.json
            ${{ runner.temp }}/https-libraries/original/published-http/build/*.json
