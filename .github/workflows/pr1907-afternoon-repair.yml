name: PR 1907 afternoon repair
on:
  push:
    branches: [ci/pr1907-repair-20261115-afternoon]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: b5e25076abc98c6a57f7078bdc335a5e916c5851
          fetch-depth: 128
          persist-credentials: false
      - name: Apply reviewed reconciliation and unique-owner correction
        env:
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=128 origin 2ad1b0a952642e296c76a95d687962d0dccbf071
          git fetch --no-tags --depth=1 origin "$CONTROL_SHA"
          git config user.name 'PR 1907 repair'
          git config user.email 'noreply@users.noreply.github.com'
          git merge --no-commit --no-ff 2ad1b0a952642e296c76a95d687962d0dccbf071 || test -n "$(git diff --name-only --diff-filter=U)"
          for name in pr1907_reconcile pr1907_owner_fix; do
            git show "$CONTROL_SHA:repair/$name.py" > "$RUNNER_TEMP/$name.py"
            python3 "$RUNNER_TEMP/$name.py"
          done
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - name: Commit and export immutable candidate objects
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git add -u
          git commit -m 'merge: preserve inbox custody and durable payload startup on development'
          git status --porcelain --untracked-files=no
          tree="$(git rev-parse HEAD^{tree})"
          printf 'CANDIDATE_TREE=%s\nCANDIDATE_PARENTS=%s\n' "$tree" "$(git show -s --format=%P HEAD)"
          git diff --stat HEAD^ HEAD
          export GIT_INDEX_FILE="$RUNNER_TEMP/transfer.index"
          git read-tree "$CONTROL_SHA^{tree}"
          git read-tree --prefix=pr1907-merge/ "$tree"
          transfer_tree="$(git write-tree)"
          transfer="$(printf 'data: retain immutable PR 1907 merge candidate\n' | git commit-tree "$transfer_tree" -p "$CONTROL_SHA")"
          echo "TRANSFER_COMMIT=$transfer"
          gh auth setup-git
          git push origin "$transfer:refs/heads/ci/pr1907-reviewed-objects-20261115-v4"
