name: PR 1907 afternoon repair
on:
  push:
    branches: [ci/pr1907-repair-20261115-afternoon]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
      CARGO_TERM_COLOR: never
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: b5e25076abc98c6a57f7078bdc335a5e916c5851
          fetch-depth: 128
          persist-credentials: false
      - name: Apply reviewed reconciliation and unique-owner correction
        env:
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=128 origin 2ad1b0a952642e296c76a95d687962d0dccbf071
          git fetch --no-tags --depth=1 origin "$CONTROL_SHA"
          git config user.name 'PR 1907 repair'
          git config user.email 'noreply@users.noreply.github.com'
          git merge --no-commit --no-ff 2ad1b0a952642e296c76a95d687962d0dccbf071 || test -n "$(git diff --name-only --diff-filter=U)"
          for name in pr1907_reconcile pr1907_owner_fix; do
            git show "$CONTROL_SHA:repair/$name.py" > "$RUNNER_TEMP/$name.py"
            python3 "$RUNNER_TEMP/$name.py"
          done
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt,clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - name: Format and commit the complete merge candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git add -u
          git commit -m 'merge: preserve inbox custody and durable payload startup on current development'
      - name: Validate source and workflow contracts
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/requirements.lock
          python3 -m unittest tools.tests.test_go_write_progress tools.tests.test_go_network_deadline_contract tools.tests.test_go_deadline_provider_contract tools.tests.test_ci_contracts tools.tests.test_cli_wire_transport
      - name: Discover and execute actual startup library tests
        id: startup
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p latentd --all-features --lib standalone::state:: -- --list > "$RUNNER_TEMP/startup-tests.txt"
          grep -E ': test$' "$RUNNER_TEMP/startup-tests.txt"
          cargo test --locked -p latentd --all-features --lib standalone::state::
      - name: Execute atomic inbox regression tests
        id: atomic
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: cargo test --locked -p latent-commit --all-features --lib atomic::tests
      - name: Execute native inbox owner tests
        id: inbox
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: cargo test --locked -p latent-node --all-features --lib transaction_runtime::tests::response::inbox
      - name: Execute the unchanged maintained Clippy recipe
        id: lint
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python3 tools/ci_cargo.py run clippy
      - name: Retain reviewed candidate and exact outcomes without changing a product ref
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          CONTRACTS_RESULT: ${{ steps.contracts.outcome }}
          STARTUP_RESULT: ${{ steps.startup.outcome }}
          ATOMIC_RESULT: ${{ steps.atomic.outcome }}
          INBOX_RESULT: ${{ steps.inbox.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          tree="$(git rev-parse HEAD^{tree})"
          echo "CANDIDATE_TREE=$tree"
          echo "CANDIDATE_PARENTS=$(git show -s --format=%P HEAD)"
          git diff --stat HEAD^ HEAD
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = {
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'parents': subprocess.check_output(['git', 'show', '-s', '--format=%P', 'HEAD'], text=True).split(),
              'results': {name: os.environ[name.upper() + '_RESULT'] for name in ('contracts', 'startup', 'atomic', 'inbox', 'lint')},
              'startupTests': [line for line in (Path(os.environ['RUNNER_TEMP']) / 'startup-tests.txt').read_text().splitlines() if line.endswith(': test')],
          }
          Path(os.environ['RUNNER_TEMP'], 'pr1907-results.json').write_text(json.dumps(data, indent=2) + '\n')
          print(json.dumps(data, indent=2), flush=True)
          PY
          export GIT_INDEX_FILE="$RUNNER_TEMP/transfer.index"
          git read-tree "$CONTROL_SHA^{tree}"
          git read-tree --prefix=pr1907-merge/ "$tree"
          result_blob="$(git hash-object -w "$RUNNER_TEMP/pr1907-results.json")"
          git update-index --add --cacheinfo 100644 "$result_blob" repair/pr1907-results.json
          transfer_tree="$(git write-tree)"
          transfer="$(printf 'data: retain reviewed PR 1907 candidate and actual qualification results\n' | git commit-tree "$transfer_tree" -p "$CONTROL_SHA")"
          gh auth setup-git
          git push origin "$transfer:refs/heads/ci/pr1907-reviewed-objects-20261115-v2"
          echo "TRANSFER_COMMIT=$transfer"
