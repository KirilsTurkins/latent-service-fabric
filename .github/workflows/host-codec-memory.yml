name: Ordinary host shared table and runtime memory diagnostics
on:
  push:
    branches: ['feat/host-codec-memory-736-20261021', 'feat/typescript-table-memory-20261022', 'feat/activation-registry-memory-20261022', 'feat/activation-funcrefs-memory-20261022', 'feat/component-resource-map-memory-20261022', 'feat/linear-memory-notifications-20261022', 'feat/hostcall-future-memory-20261022', 'feat/owned-context-replies-memory-20261022', 'feat/capability-lowering-current-20261022', 'feat/streaming-table-memory-20261022', 'feat/runtime-shared-memory-20261022', 'feat/session-core-memory-20261022']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: host-codec-memory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Original ledger shared tables and runtime memory ownership diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Install existing locked Python dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Refuse missing, ignored or changed control evidence
        run: python3 -B -m unittest tools.tests.test_host_codec_native -v
      - name: Execute one hundred eighty-three source-bound controls with the ordinary native host
        id: own-native-memory
        run: >-
          python3 -B tools/qualify_host_codec_native.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/host-codec-memory"
      - name: Retain exact source, products, outcomes and bounded failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-codec-memory-${{ github.sha }}
          path: ${{ runner.temp }}/host-codec-memory/
          if-no-files-found: warn
          retention-days: 7
