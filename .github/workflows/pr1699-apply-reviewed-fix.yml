name: Apply exact reviewed PR 1699 source delta
on:
  push:
    branches: ['fix/java-string-amplifier-20261106']
    paths: ['tools/ci/pr1699-reviewed-fix.b64']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify exact preimages and publish the reviewed source only
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.request, zlib
          repo = 'KirilsTurkins/latent-service-fabric'
          branch = 'fix/java-string-amplifier-20261106'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          revision = os.environ['REVISION']
          prefix = 'https://api.github.com/repos/' + repo + '/'
          def api(path, data=None, method=None):
              raw = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(prefix + path, data=raw, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = response.read(2 * 1024 * 1024 + 1)
              assert len(result) <= 2 * 1024 * 1024
              return json.loads(result)
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          def read(path):
              item = api('contents/' + path + '?ref=' + revision)
              assert item['type'] == 'file' and item['encoding'] == 'base64'
              return base64.b64decode(item['content'])
          assert api('git/ref/heads/' + branch)['object']['sha'] == revision
          payload = read('tools/ci/pr1699-reviewed-fix.b64')
          assert digest(payload) == '748002ebde66b20cb0cc9edf7b4bfffa2df1f1e41bafb86d5ae67f95cc6e8ff7'
          decoder = zlib.decompressobj()
          raw = decoder.decompress(base64.b64decode(payload, validate=False), 65537)
          assert len(raw) <= 65536 and decoder.eof and not decoder.unused_data
          rows = json.loads(raw)
          expected = {
              'tools/java_guest/coroutine_patch.py',
              'sdk/java-guest/fibers/compiler/dev/latent/guest/runtime/compiler/BoundedMathInitialization.java',
              'sdk/java-guest/fibers/compiler/dev/latent/guest/runtime/compiler/RuntimePlugin.java',
              'sdk/java-guest/fibers/conformance/compiler/WorkerCompilerControl.java',
              'sdk/java-guest/fibers/conformance/compiler/AmplifierSplitLauncher.java',
              'tools/qualify_java_amplifier.py', 'tools/qualify_java_fibers.py'}
          assert len(rows) == len(expected) and {row['path'] for row in rows} == expected
          parent = api('git/commits/' + revision)
          # No repository script, checkout action, guest, or payload is executed.
          # The data describes fixed line edits; both source identities are bound.
          tree = []
          for row in rows:
              if row['before'] is None:
                  try:
                      read(row['path'])
                  except urllib.error.HTTPError as error:
                      assert error.code == 404
                  else:
                      raise AssertionError('new-path-exists')
                  original = b''
              else:
                  original = read(row['path'])
                  assert digest(original) == row['before']
              lines = original.decode('utf-8').splitlines(True)
              prior = -1
              for start, end, value in row['changes']:
                  assert type(start) is int and type(end) is int and isinstance(value, str)
                  assert 0 <= start <= end <= len(lines) and start >= prior
                  prior = end
              for start, end, value in reversed(row['changes']):
                  lines[start:end] = [value]
              content = ''.join(lines)
              assert digest(content.encode()) == row['after'] and len(content) < 300000
              tree.append({'path': row['path'], 'mode': '100644', 'type': 'blob', 'content': content})
              print(row['path'], row['after'])
          result = api('git/trees', {'base_tree': parent['tree']['sha'], 'tree': tree})
          commit = api('git/commits', {'message': 'fix(java): prove metadata reads and descending progress; bound math initialization',
              'tree': result['sha'], 'parents': [revision]})
          assert api('git/ref/heads/' + branch)['object']['sha'] == revision
          api('git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Published exact reviewed source:', commit['sha'])
