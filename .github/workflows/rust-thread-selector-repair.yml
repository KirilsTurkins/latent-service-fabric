name: Review exact Rust integration selector repair
on:
  push:
    branches: ['feat/rust-thread-runtime-20261023']
    paths: ['.github/workflows/rust-thread-selector-repair.yml']
permissions:
  contents: write
jobs:
  reviewed-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
      - name: Fetch only the immutable reviewed preimage
        run: git fetch --no-tags --depth=1 origin 14d8109cc42c1355d764d78ccd52822bef22b0cc
      - name: Store five exact reviewed blobs without changing a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import_not_a_shell_command=unused
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          source = '14d8109cc42c1355d764d78ccd52822bef22b0cc'
          repository = 'KirilsTurkins/latent-service-fabric'
          rows = [
              ('.github/workflows/ci.yml', '786a1d898c90fd0c16353736eb0fa97b323ac1f5', '36bb49d61fad20b0ae865a338f345c58da7aef0c'),
              ('tools/ci/contracts/workflows/ci.yml/jobs/profile.json', '039107931fc68cb8e76248b1ba90cd9ac38208b5', 'eced3fd94a1cd247d270e193563343c11f9b1f56'),
              ('tools/ci/contracts/workflows/ci.yml/jobs/result.json', '4be013d041bfe154b7c65736c3ff2901a765c16e', '56aedb5d2b95dba32ac813ce21742f1835f329d1'),
              ('tools/tests/test_ci_profile.py', '737e227cdd4b3c825772b2467932e0d0c0447898', 'ace617f12723a9eff922c9879447b59c9f0d0348'),
              ('tools/ci/contracts/python/test_ci_profile.py.json', '7a9cc52899c759ef078be4b57f92ecc447b5f0e7', '03ad5b321a056a6ea3d212a709a3df1922661a73'),
          ]
          def identity(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          values = {}
          for name, before, after in rows:
              raw = subprocess.check_output(['git', 'show', source + ':' + name], timeout=30)
              assert len(raw) <= 100000 and identity(raw) == before, name
              values[name] = raw.decode()
          name = rows[0][0]
          for old, new in [
              ('            /tools/ci_suite_inventory.py\n', '            /tools/ci_suite_inventory.py\n            /tools/ci_suite_cases.py\n'),
              ('            /tools/ci/suites.d/\n', '            /tools/ci/suites.d/\n            /tools/ci/suites.cases.d/\n'),
          ]:
              assert values[name].count(old) == 2
              values[name] = values[name].replace(old, new)
          for name, _, _ in rows[1:3]:
              value = json.loads(values[name])
              settings = value['definition']['steps'][0]['with']
              for old, new in [
                  ('/tools/ci_suite_inventory.py\n', '/tools/ci_suite_inventory.py\n/tools/ci_suite_cases.py\n'),
                  ('/tools/ci/suites.d/\n', '/tools/ci/suites.d/\n/tools/ci/suites.cases.d/\n'),
              ]:
                  assert settings['sparse-checkout'].count(old) == 1
                  settings['sparse-checkout'] = settings['sparse-checkout'].replace(old, new)
              value['reviewReason'] = 'Include the existing additive suite-case loader and committed case fragments in sparse CI consumers. Preserve all previous paths, exact commands, triggering conditions and required jobs; no fallback or waived validation.'
              values[name] = json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n'
          method = r'''    def test_workflow_sparse_checkouts_load_the_complete_suite_case_inventory(self) -> None:
                  # Use the actual Git patterns and isolated Python processes: the outer
                  # checkout must not supply an omitted module or additive case fragment.
                  import shutil
                  import sys
                  import yaml

                  root = Path(__file__).resolve().parents[2]
                  workflow = yaml.safe_load((root / ".github/workflows/ci.yml").read_text())
                  source_paths = [Path("tools/ci_profile.py"), Path("tools/ci_result.py"),
                                  Path("tools/ci_suite_inventory.py"), Path("tools/ci_suite_cases.py"),
                                  Path("tools/ci/suites.json")]
                  for directory in ("tools/ci/suites.d", "tools/ci/suites.cases.d"):
                      fragments = sorted((root / directory).glob("*.json"))
                      self.assertTrue(fragments, directory)
                      source_paths.extend(path.relative_to(root) for path in fragments)
                  expected = profile.registry.load()
                  outputs = profile.Decision("full", "manual-dispatch", 0).outputs()
                  required = json.loads(outputs["expected_jobs"])
                  results = {name: {"result": "success" if name in required else "skipped"}
                             for name in profile.registry.ALL_JOBS}
                  results["profile"]["outputs"] = outputs
                  for job in ("profile", "result"):
                      with self.subTest(job=job), tempfile.TemporaryDirectory() as temporary:
                          checkout = workflow["jobs"][job]["steps"][0]["with"]
                          self.assertIs(checkout["sparse-checkout-cone-mode"], False)
                          if job == "profile":
                              self.assertEqual(checkout["fetch-depth"], 0)
                          base = Path(temporary)
                          repo = base / "checkout"
                          repo.mkdir()
                          for name in source_paths:
                              destination = repo / name
                              destination.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copyfile(root / name, destination)
                          # Keep the local Git fixture independent of ambient config,
                          # hooks, credentials, Python paths and network transports.
                          config = base / "gitconfig"
                          config.write_text("")
                          environment = {key: value for key, value in os.environ.items()
                                         if not key.startswith(("GIT_", "GITHUB_"))
                                         and key not in {"PYTHONPATH", "CI_JOB_RESULTS"}}
                          environment.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=str(config),
                                             GIT_TERMINAL_PROMPT="0", GIT_ALLOW_PROTOCOL="file",
                                             PYTHONDONTWRITEBYTECODE="1", CI_JOB_RESULTS=json.dumps(results))

                          def command(*argv: str, stdin: str | None = None) -> subprocess.CompletedProcess:
                              return subprocess.run(argv, cwd=repo, env=environment, input=stdin,
                                                    text=True, stdout=subprocess.PIPE,
                                                    stderr=subprocess.PIPE, timeout=30, check=False)

                          for arguments in (("init", "--quiet"), ("add", "."),
                                            ("-c", "user.name=CI fixture", "-c", "user.email=fixture@example.invalid",
                                             "-c", "commit.gpgsign=false", "commit", "--quiet", "-m", "selector inputs"),
                                            ("sparse-checkout", "set", "--no-cone", "--stdin")):
                              result = command("git", *arguments, stdin=checkout["sparse-checkout"]
                                               if arguments[0] == "sparse-checkout" else None)
                              self.assertEqual(result.returncode, 0, result.stderr)
                          if job == "profile":
                              event, output = base / "event.json", base / "output.txt"
                              event.write_text("{}")
                              result = command(sys.executable, "-I", "-B", "tools/ci_profile.py",
                                               "--event-name", "workflow_dispatch", "--event-path", str(event),
                                               "--repo", str(repo), "--github-output", str(output))
                              self.assertEqual(result.returncode, 0, result.stderr)
                              self.assertIn("profile=full\n", output.read_text())
                          else:
                              result = command(sys.executable, "-I", "-B", "tools/ci_result.py")
                              self.assertEqual(result.returncode, 0, result.stderr)
                              # Retain the aggregate's fail-closed behavior as well.
                              failed = json.loads(json.dumps(results))
                              failed["docs"]["result"] = "failure"
                              environment["CI_JOB_RESULTS"] = json.dumps(failed)
                              result = command(sys.executable, "-I", "-B", "tools/ci_result.py")
                              self.assertEqual(result.returncode, 1, result.stderr)
                              self.assertIn("unexpected-job-result:docs:failure", result.stderr)
                          result = command(sys.executable, "-I", "-B", "-c",
                                           "import json,sys; sys.path.insert(0,'.'); "
                                           "from tools.ci_suite_inventory import load; "
                                           "print(json.dumps(load(),sort_keys=True))")
                          self.assertEqual(result.returncode, 0, result.stderr)
                          # An import-only fix can still silently omit cases: compare
                          # the complete effective inventory with the normal checkout.
                          self.assertEqual(json.loads(result.stdout), expected)

          '''
          # Remove the ten extra indentation columns used by this YAML literal.
          lines = method.splitlines(keepends=True)
          method = lines[0] + ''.join(line[10:] if line.strip() else line for line in lines[1:])
          name = rows[3][0]
          anchor = 'class ClassificationTests(unittest.TestCase):\n'
          assert values[name].count(anchor) == 1
          values[name] = values[name].replace(anchor, anchor + method)
          name = rows[4][0]
          value = json.loads(values[name])
          case = 'ClassificationTests.test_workflow_sparse_checkouts_load_the_complete_suite_case_inventory'
          assert case not in value['guards']
          value['guards'][case] = '68cc5f14a84dbae89dc67a1be5ae28ad31171c5b0870191c17f7a119461d559d'
          value['reviewReason'] = 'Add real sparse-Git checkout and isolated Python regressions for selector and result consumers, requiring complete suite-case inventory equality and failed-job refusal. All 22 prior cases, fixture guards, skip rules and classification checks remain unchanged.'
          values[name] = json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n'
          for name, _, after in rows:
              assert identity(values[name].encode()) == after, (name, identity(values[name].encode()), after)
          # No code from the repository is executed, and no tree/ref is published.
          receipts = []
          for name, before, after in rows:
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/git/blobs',
                  data=json.dumps({'content': values[name], 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read(65536))
              assert result['sha'] == after
              receipts.append({'path': name, 'before': before, 'after': after})
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'selector-review.json'
          output.write_text(json.dumps({'source': source, 'workflowHead': os.environ['GITHUB_SHA'], 'blobs': receipts, 'refsChanged': False}, sort_keys=True))
          print(json.dumps(receipts))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: rust-thread-selector-review-${{ github.sha }}
          path: ${{ runner.temp }}/selector-review.json
          if-no-files-found: error
          retention-days: 3
