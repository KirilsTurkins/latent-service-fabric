name: Issue 23 bootstrap

on:
  push:
    branches:
      - feat/phase-0-spike-harness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-0-spike-harness
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Materialize the implementation bundle
        run: |
          cat .github/issue-23-staging/part-* | base64 --decode > /tmp/issue-23.tar.gz
          tar --extract --gzip --file /tmp/issue-23.tar.gz --directory .
          rm -rf .github/issue-23-staging .github/workflows/issue-23-bootstrap.yml
          cargo fmt --all
          cargo generate-lockfile
      - name: Compile the executable composition root
        run: cargo check -p latentd --all-targets --locked
      - name: Publish the implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: compose the Phase 0 executable spike"
          git push origin HEAD:feat/phase-0-spike-harness
