name: Publication native tombstones
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths: ['.github/workflows/publication-native-workbench.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          cache-workspace-crates: false
          save-if: false
      - name: Verify source-bound patch and publish only exact blobs
        id: source
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile, urllib.request, zlib
          root = pathlib.Path.cwd()
          out = root / 'target/publication-tombstones'
          out.mkdir(parents=True, exist_ok=True)
          repo = 'KirilsTurkins/latent-service-fabric'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          def api(endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint, data=data,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = response.read(2 * 1024 * 1024 + 1)
              assert len(value) <= 2 * 1024 * 1024
              return json.loads(value)
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          parts = ['27bbd261d1e41d12aa92a9e21a50c9de947b1789', '36e459ebbc232d41db29aa183fed8d94be7eba63',
                   'd77b20d721b782ffc581c675aa81f911c2526c55', '0f82b2d9508a30f3176854ea94390ea5b830d458',
                   '60ded8d320ed153990363fa419c5d012c6190e33', '9a17709445170aa604230ed90f5103c31585fb8c',
                   '2965ac320621eb8918a9145795eb9528f0632079']
          buffers = []
          for sha in parts:
              value = api('/git/blobs/' + sha)
              assert value['encoding'] == 'base64'
              data = base64.b64decode(value['content'])
              assert blob_hash(data) == sha and len(data) <= 8000
              buffers.append(data)
          transport = b''.join(buffers)
          assert len(transport) == 29661
          assert hashlib.sha256(transport).hexdigest() == 'e62cca09cc491d5955003c8d09202e588480a91bebf0f58241cf4b390a4af09c'
          decoder = zlib.decompressobj(31)
          raw = decoder.decompress(transport, 262145)
          assert len(raw) <= 262144 and decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          bundle = json.loads(raw)
          assert bundle['schema'] == 'lsf.reviewed-patch.v1'
          assert bundle['base'] == 'ef554c37dbb250816ec6b21146b528d8cd5bcbae'
          subprocess.run(['git', 'merge-base', '--is-ancestor', bundle['base'], 'HEAD'], check=True)
          files = bundle['files']
          names = [entry['path'] for entry in files]
          assert len(files) == 33 and names == sorted(set(names))
          for entry in files:
              path = pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in {'crates', 'tools', 'docs'}
              prior = subprocess.run(['git', 'rev-parse', 'HEAD:' + str(path)], capture_output=True, text=True)
              assert (prior.stdout.strip() if prior.returncode == 0 else None) == entry['before'], str(path)
              assert not (root / path).is_symlink()
          patch = bundle['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', '-'], input=patch, check=True)
          entries = []
          for entry in files:
              data = (root / entry['path']).read_bytes()
              assert blob_hash(data) == entry['after'], entry['path']
              saved = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert saved['sha'] == entry['after']
              entries.append({'path': entry['path'], 'mode': '100644', 'type': 'blob', 'sha': saved['sha']})
          (out / 'tree-entries.json').write_text(json.dumps(entries, indent=2) + '\n')
          (out / 'manifest.json').write_text(json.dumps({'base': bundle['base'], 'files': files}, indent=2) + '\n')
          (out / 'reviewed.patch').write_bytes(patch)
          (out / 'reviewed-patch.json.gz').write_bytes(transport)
          (out / 'qualification-commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          with tarfile.open(out / 'reviewed-source.tar.gz', 'w:gz') as archive:
              for name in names:
                  archive.add(root / name, arcname=name, recursive=False)
          print('Verified and uploaded all 33 exact source blobs; no ref was updated.')
          PY
      - name: Execute every native artifact target
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          set -o pipefail
          cargo test --locked -p latent-artifacts --all-features --all-targets -- --test-threads=1 2>&1 | tee target/publication-tombstones/artifacts.log
      - name: Execute complete native control store including physical gates
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          set -o pipefail
          cargo test --locked -p latent-control-store --all-features --lib -- --nocapture --test-threads=1 2>&1 | tee target/publication-tombstones/control-store.log
      - name: Check default features standalone composition and formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          cargo check --locked -p latent-artifacts -p latent-control-store 2>&1 | tee target/publication-tombstones/default-check.log
          cargo check --locked -p latentd --lib 2>&1 | tee target/publication-tombstones/standalone-check.log
          cargo fmt -p latent-artifacts -p latent-control-store -- --check 2>&1 | tee target/publication-tombstones/format.log
      - name: Apply unchanged owning-package lint policy
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          cargo clippy --locked --no-deps -p latent-artifacts -p latent-control-store --all-targets --all-features --message-format=json 2>&1 | tee target/publication-tombstones/clippy.log
      - name: Verify actual native case discovery and unchanged test inventory
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          cargo test --locked -p latent-control-store --all-features --lib -- --list > target/publication-tombstones/discovery.log
          python3 - <<'PY'
          import json, pathlib
          out = pathlib.Path('target/publication-tombstones')
          fragment = json.loads(pathlib.Path('tools/ci/suites.cases.d/publication-tombstones.json').read_text())
          lines = (out / 'discovery.log').read_text().splitlines()
          actual = sorted(line.removesuffix(': test') for line in lines if '::tombstones::' in line and line.endswith(': test'))
          assert len(actual) == 20 and actual == fragment['expectedCases']
          (out / 'discovered-tombstones.json').write_text(json.dumps(actual, indent=2) + '\n')
          PY
          python3 tools/test.py explain --suite latent-control-store.lib.latent-control-store > target/publication-tombstones/suite-explain.json
      - name: Verify regression controls and final review-tree CI preservation
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -o pipefail
          python3 -m pip install --requirement tools/requirements.lock
          rm .github/workflows/publication-native-workbench.yml
          python3 -m unittest tools.tests.test_ci_suite_cases tools.tests.test_ci_profile_sparse tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_ci_contracts -v 2>&1 | tee target/publication-tombstones/python-controls.log
          python3 tools/ci_coverage.py --receipt target/publication-tombstones/ci-inventory.json 2>&1 | tee target/publication-tombstones/ci-coverage.log
          git diff --check
      - name: Retain exact-source qualification evidence
        if: always()
        run: |
          mkdir -p target/publication-tombstones
          rustc -vV > target/publication-tombstones/rustc.txt
          cargo -vV > target/publication-tombstones/cargo.txt
          sha256sum target/publication-tombstones/*.gz > target/publication-tombstones/SHA256SUMS
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: publication-native-tombstones-${{ github.sha }}
          path: target/publication-tombstones/
          if-no-files-found: error
          retention-days: 7
