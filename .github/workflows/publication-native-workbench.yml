name: Publication native workbench
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths: ['.github/workflows/publication-native-workbench.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          cache-workspace-crates: false
          save-if: false
      - name: Execute source-bound artifact tests
        run: |
          mkdir -p target/publication-workbench
          git rev-parse HEAD > target/publication-workbench/source-commit.txt
          cargo test --locked -p latent-artifacts --all-features --all-targets > target/publication-workbench/tests.log 2>&1
      - name: Retain reproducible offline compiler inputs
        run: |
          set -euo pipefail
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar -C "$toolchain" -czf target/publication-workbench/rust-toolchain.tar.gz .
          tar -C "${CARGO_HOME:-$HOME/.cargo}" -czf target/publication-workbench/cargo-registry.tar.gz registry
          git archive --format=tar.gz HEAD Cargo.toml Cargo.lock rust-toolchain.toml .cargo .gitattributes api wit > target/publication-workbench/source-complement.tar.gz
          rustc -vV > target/publication-workbench/rustc.txt
          cargo -vV > target/publication-workbench/cargo.txt
          sha256sum target/publication-workbench/*.tar.gz > target/publication-workbench/SHA256SUMS
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: publication-native-workbench-${{ github.sha }}
          path: target/publication-workbench/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
