name: Publication native workbench
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths:
      - '.github/workflows/publication-native-workbench.yml'
      - '_qualification/662/**'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          cache-workspace-crates: false
          save-if: false
      - name: Verify exact source-bound continuation
        run: |
          python3 _qualification/662/prepare.py apply
          rustc -vV > target/publication-workbench/rustc.txt
          cargo -vV > target/publication-workbench/cargo.txt
      - name: Upload exact content-addressed blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 _qualification/662/prepare.py publish
      - name: Execute all native artifact tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          cargo test --locked -p latent-artifacts --all-features --all-targets 2>&1 | tee target/publication-workbench/artifact-tests.log
      - name: Execute complete native control-store library including physical gates
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          cargo test --locked -p latent-control-store --all-features --lib 2>&1 | tee target/publication-workbench/control-tests.log
      - name: Check standalone composition and owning-package formatting
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          cargo check --locked -p latentd --lib 2>&1 | tee target/publication-workbench/standalone-check.log
          cargo fmt -p latent-artifacts -p latent-control-store -p latentd -- --check 2>&1 | tee target/publication-workbench/format.log
      - name: Apply unchanged repository lint policy to owning packages
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked --no-deps -p latent-artifacts -p latent-control-store --all-targets --all-features --message-format=json > target/publication-workbench/clippy.jsonl 2> target/publication-workbench/clippy.log
      - name: Verify sparse checkout regressions and additive native inventory
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 -m unittest tools.tests.test_ci_profile_sparse tools.tests.test_ci_profile tools.tests.test_ci_result tools.tests.test_ci_suite_cases -v 2>&1 | tee target/publication-workbench/python-tests.log
          python3 tools/test.py explain --suite latent-artifacts.lib.latent-artifacts > target/publication-workbench/artifact-suite.json
          python3 tools/test.py explain --suite latent-control-store.lib.latent-control-store > target/publication-workbench/control-suite.json
          cargo test --locked -p latent-artifacts -p latent-control-store --all-features --lib -- --list > target/publication-workbench/native-list.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          text = Path('target/publication-workbench/native-list.txt').read_text()
          for name in ('publication-reader-exclusion.json', 'publication-reference-exclusion.json'):
              fragment = json.loads((Path('tools/ci/suites.cases.d') / name).read_text())
              for case in fragment['expectedCases']:
                  assert text.splitlines().count(case + ': test') == 1, case
          print('All 16 new cases exist exactly once in actual native libtest discovery')
          PY
      - name: Check final review-tree CI contracts without temporary workbench
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          set -o pipefail
          rm .github/workflows/publication-native-workbench.yml
          rm -r _qualification/662
          python3 tools/ci_coverage.py --receipt target/ci/publication-continuation-inventory.json 2>&1 | tee target/publication-workbench/coverage.log
      - name: Retain source-matched qualification products
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        with:
          name: publication-native-continuation-${{ github.sha }}
          path: |
            target/publication-workbench/
            target/ci/publication-continuation-inventory.json
          if-no-files-found: error
          retention-days: 7
