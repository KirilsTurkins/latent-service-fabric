name: Publication native reclamation
on:
  push:
    branches: [feat/662-bounded-publication-deletion]
    paths: ['.github/workflows/publication-native-workbench.yml']
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          cache-workspace-crates: false
          save-if: false
      - name: Verify reviewed source and upload exact blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tarfile, urllib.request
          root = pathlib.Path.cwd()
          out = root / 'target/publication-reclamation'
          out.mkdir(parents=True, exist_ok=True)
          api = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def call(path, data=None):
              req = urllib.request.Request(api + path, data=None if data is None else json.dumps(data).encode(), headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          parts = [
              'e41affd4f324ab398656ba39d9acb3199c326111',
              'cf6cb60ae4432d5969c61061f348cf62e9ed2ef3',
              '83d7931cf39e011037ca5d577ded80a644336df0',
              '87dc87b1be7a84554e27f23d5f4082534536f240',
              '6f3856ca9ee39b2f76b3a3bdc32fdd7e36b526e3',
              '4967d03d8b55f5954a33c4c99ced505b69f1f9d0',
              'a6670efedd94efb0227dbc5fee0f36e25a56fe17',
              '34aafe3ca1f8332afcaf3730af7481284a98147f',
              'd6ee1c95e5bf02bd004ca45b4b8919f623fd28e7',
              '3ff33086d1db6a72c22a1c77244bf86e1786617e',
              'ecc40fa2f8270436dd41aad3b13580f7bc1bbece',
              'd2804f6996f0ed60cacbe2def0b7a90946654204',
              'c7fd8921e600f5dbe8900f0aee46b9d5c7b5403b',
              '52efd5f12b7f32e825335596c44eeffaca1f5edc',
          ]
          chunks = []
          for sha in parts:
              row = call('/git/blobs/' + sha)
              raw = base64.b64decode(row['content'])
              assert row['encoding'] == 'base64' and blob(raw) == sha
              chunks.append(raw)
          compressed = b''.join(chunks)
          assert len(compressed) == 30460
          assert hashlib.sha256(compressed).hexdigest() == 'b19c56149e5d22a67b095b5643aeda3597a318785b2741313746343056d4038d'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          decoded = decoder.decompress(compressed, max_length=2 * 1024 * 1024)
          assert decoder.eof and not decoder.unused_data
          payload = json.loads(decoded)
          assert payload['base'] == '41cfd1f928cdda958293d0072f83c1db8f7480bc'
          subprocess.run(['git', 'merge-base', '--is-ancestor', payload['base'], 'HEAD'], check=True)
          rows = payload['files']
          assert len(rows) == 35 and len({row['path'] for row in rows}) == 35
          for row in rows:
              path = pathlib.PurePosixPath(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in {'crates', 'docs', 'tools'}
              target = root / path
              assert not target.is_symlink()
              assert (blob(target.read_bytes()) if target.exists() else None) == row['before'], row['path']
          patch = payload['patch'].encode()
          assert len(patch) == 170046
          (out / 'reviewed.patch').write_bytes(patch)
          (out / 'reviewed.xz').write_bytes(compressed)
          (out / 'files.json').write_text(json.dumps(rows, indent=2) + '\n')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          entries = []
          for row in rows:
              raw = (root / row['path']).read_bytes()
              assert len(raw) == row['size'] and blob(raw) == row['after'], row['path']
              uploaded = call('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(raw).decode()})
              assert uploaded['sha'] == row['after'], row['path']
              entries.append({'path': row['path'], 'mode': row['mode'], 'type': 'blob', 'sha': uploaded['sha']})
          (out / 'tree-entries.json').write_text(json.dumps(entries, indent=2) + '\n')
          with tarfile.open(out / 'qualified-source.tar.gz', 'w:gz') as archive:
              for row in rows:
                  archive.add(root / row['path'], arcname=row['path'], recursive=False)
          (out / 'source-commit.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          workflow = root / '.github/workflows/publication-native-workbench.yml'
          (out / 'qualification-workflow.yml').write_bytes(workflow.read_bytes())
          workflow.unlink()
          print('Verified and uploaded all 35 exact source blobs; no refs updated.')
          PY
      - name: Execute all artifact targets on real native storage
        run: |
          cargo test --locked -p latent-artifacts --all-features --all-targets -- --test-threads=1 > target/publication-reclamation/artifact-tests.log 2>&1
      - name: Execute complete control-store library including physical resource gates
        run: |
          cargo test --locked -p latent-control-store --all-features --lib -- --nocapture --test-threads=1 > target/publication-reclamation/control-tests.log 2>&1
      - name: Check default features and standalone composition
        run: |
          cargo check --locked -p latent-artifacts -p latent-control-store > target/publication-reclamation/default-check.log 2>&1
          cargo check --locked -p latentd --lib > target/publication-reclamation/standalone-check.log 2>&1
      - name: Check formatting and unchanged owning-package lint policy
        run: |
          cargo fmt -p latent-artifacts -p latent-control-store -- --check > target/publication-reclamation/format.log 2>&1
          cargo clippy --locked --no-deps -p latent-artifacts -p latent-control-store --all-targets --all-features --message-format=json > target/publication-reclamation/clippy.jsonl 2> target/publication-reclamation/clippy.log
      - name: Verify exact native test discovery against registered inventory
        run: |
          cargo test --locked -p latent-control-store --all-features --lib -- --list > target/publication-reclamation/discovery.txt 2> target/publication-reclamation/discovery-build.log
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from tools import ci_suite_inventory
          out = Path('target/publication-reclamation')
          suites = ci_suite_inventory.load()['suites']
          owner = next(row for row in suites if row['id'] == 'latent-control-store.lib.latent-control-store')
          names = [line[:-6] for line in (out / 'discovery.txt').read_text().splitlines() if line.endswith(': test')]
          assert Counter(names) == Counter(owner['expectedCases'])
          assert len(names) == 334
          for name, count in [('publication-reclamation-planning', 15), ('publication-payload-reclamation', 19)]:
              fragment = json.loads(Path('tools/ci/suites.cases.d/' + name + '.json').read_text())
              assert len(fragment['expectedCases']) == count
              assert all(names.count(case) == 1 for case in fragment['expectedCases'])
          (out / 'discovery-verification.json').write_text(json.dumps({'cases': len(names), 'assessmentCases': 15, 'cleanupCases': 19, 'status': 'passed'}) + '\n')
          PY
      - name: Validate Python controls and final review-tree CI contracts
        run: |
          python3 -m pip install --requirement tools/requirements.lock > target/publication-reclamation/python-install.log 2>&1
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_ci_profile_sparse tools.tests.test_ci_result tools.tests.test_ci_suite_cases tools.tests.test_ci_contracts > target/publication-reclamation/python-tests.log 2>&1
          python3 tools/ci_coverage.py --receipt target/ci/publication-payload-reclamation.json > target/publication-reclamation/ci-coverage.log 2>&1
          cp target/ci/publication-payload-reclamation.json target/publication-reclamation/ci-inventory.json
          python3 tools/validate_docs.py > target/publication-reclamation/docs.log 2>&1
      - name: Retain reproducible qualification identities
        if: always()
        run: |
          mkdir -p target/publication-reclamation
          rustc -vV > target/publication-reclamation/rustc.txt
          cargo -vV > target/publication-reclamation/cargo.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('target/publication-reclamation')
          rows = [{'path': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size} for p in sorted(root.iterdir()) if p.is_file()]
          (root / 'SHA256SUMS.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16
        if: always()
        with:
          name: publication-native-reclamation-${{ github.sha }}
          path: target/publication-reclamation/
          if-no-files-found: error
          retention-days: 7
