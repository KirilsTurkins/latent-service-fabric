name: TypeScript published Fetch clients
on:
  push:
    branches: ['feat/typescript-published-fetch-20261020']
    paths:
      - '.github/workflows/typescript-published-fetch.yml'
      - 'tools/typescript_published_fetch_fixture.py'
      - 'tools/typescript_fetch_replay_inputs.py'
      - 'tools/qualify_typescript_published_fetch.py'
      - 'tools/typescript_guest/fetch.mjs'
      - 'sdk/typescript-guest/activation/fetch-globals.d.ts'
      - 'tools/tests/test_typescript_published_fetch.py'
      - 'tools/tests/test_typescript_buffered_reader.py'
  workflow_dispatch:
    inputs:
      diagnose-owner-profile:
        description: Collect a distinct bounded owner-profile differential after original failure
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: typescript-published-fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published-fetch:
    name: Signed unchanged clients with explicit bounded owner profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check real bounded reader and original Fetch controls
        run: python3 -B -m unittest tools.tests.test_typescript_buffered_reader tools.tests.test_typescript_fetch tools.tests.test_typescript_published_fetch -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/published-fetch-tools"
      - name: Acquire fixed original import engine compiler and historical ordinary host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_fetch_replay_inputs.py --output "$RUNNER_TEMP/published-fetch-original"
      - name: Capture build sign and execute both changed outside identities
        env:
          DIAGNOSE_OWNER_PROFILE: ${{ inputs.diagnose-owner-profile || false }}
        run: python3 -B tools/qualify_typescript_published_fetch.py --acquired "$RUNNER_TEMP/published-fetch-original" --tools "$RUNNER_TEMP/published-fetch-tools" --output "$RUNNER_TEMP/published-fetch"
      - name: Retain actual source build native outcomes ownership and explicit unsupported results
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-published-fetch-${{ github.sha }}
          path: |
            ${{ runner.temp }}/published-fetch-original/acquisition.json
            ${{ runner.temp }}/published-fetch/*.json
            ${{ runner.temp }}/published-fetch/variant-*/capture.json
            ${{ runner.temp }}/published-fetch/variant-*/build/*.json
            ${{ runner.temp }}/published-fetch/variant-*/build/component.wasm
            ${{ runner.temp }}/published-fetch/variant-*/build/logs/**
            ${{ runner.temp }}/published-fetch/variant-*/node/*.json
            ${{ runner.temp }}/published-fetch/variant-*/node/controls/*.json
            ${{ runner.temp }}/published-fetch/variant-*/diagnostic-owner-profile*/*.json
            ${{ runner.temp }}/published-fetch/variant-*/diagnostic-owner-profile*/controls/*.json
          if-no-files-found: warn
          retention-days: 7
