name: AbortSignal stack source snapshot
on:
  push:
    branches: [ci/1852-stack-reconcile-20261110]
    paths: [.github/workflows/1852-stack-source-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: abort-stack-source-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Fetch public source histories without credentials and record exact identities
        shell: bash
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/lsf-stack.git"
          git -C "$RUNNER_TEMP/lsf-stack.git" fetch --depth=512 https://github.com/KirilsTurkins/latent-service-fabric.git \
            refs/heads/development:refs/heads/development \
            refs/heads/feat/typescript-runtime-745:refs/heads/parent \
            refs/heads/fix/typescript-745-activation-resource-ownership:refs/heads/ownership \
            refs/heads/fix/1852-agent2-abort-engine-audit:refs/heads/abort \
            83c339673b87afabfa06f3a8e818324f46c1ae6f:refs/heads/original-parent \
            0f808bdd3977bf09d90a66bc50bde5d17155d994:refs/heads/original-development
          git -C "$RUNNER_TEMP/lsf-stack.git" show-ref > "$RUNNER_TEMP/lsf-stack-refs.txt"
          git -C "$RUNNER_TEMP/lsf-stack.git" fsck --no-reflogs
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lsf-stack.git.tar.gz" lsf-stack.git
          shasum -a 256 "$RUNNER_TEMP/lsf-stack.git.tar.gz" > "$RUNNER_TEMP/lsf-stack.sha256"
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: abort-stack-exact-histories
          path: |
            ${{ runner.temp }}/lsf-stack.git.tar.gz
            ${{ runner.temp }}/lsf-stack-refs.txt
            ${{ runner.temp }}/lsf-stack.sha256
          if-no-files-found: error
          retention-days: 3
