name: TypeScript networking compiler boundary

on:
  pull_request:
    paths:
      - 'tools/typescript_guest/**'
      - 'tools/typescript_capsule.py'
      - 'tools/typescript_application_dependencies.py'
      - 'tools/tests/test_typescript_network_boundary.py'
      - 'tools/tests/test_typescript_node_net.py'
      - 'tools/tests/fixtures/typescript_node_net_generated.json'
      - 'sdk/typescript-guest/**'
      - 'wit/platform/network/**'
      - 'tools/requirements.lock'
      - '.github/workflows/typescript-network-boundary.yml'
  push:
    branches: [development]
    paths:
      - 'tools/typescript_guest/**'
      - 'tools/typescript_capsule.py'
      - 'tools/typescript_application_dependencies.py'
      - 'tools/tests/test_typescript_network_boundary.py'
      - 'tools/tests/test_typescript_node_net.py'
      - 'tools/tests/fixtures/typescript_node_net_generated.json'
      - 'sdk/typescript-guest/**'
      - 'wit/platform/network/**'
      - 'tools/requirements.lock'
      - '.github/workflows/typescript-network-boundary.yml'

permissions:
  contents: read

concurrency:
  group: typescript-network-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Pinned networking compiler and host controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-node@34275fdec80b5be172c3327cadef76aa2f3b31c6 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: sdk/typescript-guest/tools/package-lock.json
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: '3.13.5'
      - name: Install the normal pinned frontend
        id: install-frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/requirements.lock
          python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/typescript-guest-tools"
      - name: Require networking compiler and socket controls without skips
        id: network-boundary
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/typescript-network-boundary"
          python3 -B -m tools.tests.test_typescript_network_boundary \
            --frontend "$RUNNER_TEMP/typescript-guest-tools" \
            > "$RUNNER_TEMP/typescript-network-boundary/result.json" \
            2> "$RUNNER_TEMP/typescript-network-boundary/controls.log"
      - name: Retain compiler-only observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-network-boundary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/typescript-network-boundary/result.json
            ${{ runner.temp }}/typescript-network-boundary/controls.log
          if-no-files-found: warn
          retention-days: 7
