name: TypeScript late provider completion
on:
  push:
    branches: ['feat/typescript-late-completion-20261020']
    paths:
      - '.github/workflows/typescript-fetch-late.yml'
      - 'sdk/typescript-guest/probes/fetch-late-completion/**'
      - 'tools/typescript_fetch_late.py'
      - 'tools/qualify_typescript_fetch_late.py'
      - 'tools/tests/test_typescript_fetch_late.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-fetch-late-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch-conformance:
    name: Signed late headers and body completion after public abort
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check exact late-completion evidence controls
        run: python3 -B -m unittest tools.tests.test_typescript_fetch_late -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/fetch-late-tools"
      - name: Acquire exact historical import engine and original native tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_fetch_replay_inputs.py --output "$RUNNER_TEMP/fetch-late-original"
      - name: Build sign and execute actual standard Fetch programme
        run: python3 -B tools/qualify_typescript_fetch_late.py --acquired "$RUNNER_TEMP/fetch-late-original" --tools "$RUNNER_TEMP/fetch-late-tools" --output "$RUNNER_TEMP/fetch-late"
      - name: Retain exact source compiler results real contacts and physical ownership
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-fetch-late-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fetch-late-original/acquisition.json
            ${{ runner.temp }}/fetch-late/*.json
            ${{ runner.temp }}/fetch-late/build/*.json
            ${{ runner.temp }}/fetch-late/build/*.wit
            ${{ runner.temp }}/fetch-late/build/component.wasm
            ${{ runner.temp }}/fetch-late/build/package/**
            ${{ runner.temp }}/fetch-late/build/logs/
            ${{ runner.temp }}/fetch-late/node/*.json
            ${{ runner.temp }}/fetch-late/node/controls/
          if-no-files-found: warn
          retention-days: 7
