      - name: Fetch the one exact V7 native producer source before any helper verification
        run: git fetch --no-tags --depth=1 origin 77bf0e3f3b68e17342b6146abd6f2de34a3efa00
      - name: Fetch the exact nominal HTTP native producer source before new helper controls
        run: git fetch --no-tags --depth=1 origin 36eaed79dbd92cac12bad2dd1f52cd5d1acd525f
      - name: Fetch the exact independent-tenant HTTP producer before its helper verification
        run: git fetch --no-tags --depth=1 origin 6f5f180136d140ac670561695260f71514781015
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.0.0
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: Fetch the exact operational-authority native producer before SPI helper controls
        run: git fetch --no-tags --depth=1 origin 8f7780dd0a35e3375524d72e7dfaddf847deaa5c
      - name: Fetch the exact current native producer before optional SPI controls
        run: git fetch --no-tags --depth=1 origin f9192fb5785ca7bed8b33dbb869b3d775b72ab4b
      - name: Check shared strict fixed-tuple acquisition for optional SPI products
        run: python3 -B -m unittest tools.tests.test_sdk_native_products_reader -v
      - name: Check the captured standard socket timeout exception identity
        run: python3 -B -m unittest tools.tests.test_java_timeout_exception -v
      - name: Check exact selected phase emission before optional SPI compilation
        run: python3 -B -m unittest tools.tests.test_java_phase_surface -v
      - name: Fetch exact original workflow baseline before SPI preservation controls
        run: git fetch --no-tags --depth=1 origin aa56bdebad8c12f20acce4ec4ecfeca73cf554be
      - name: Check optional SPI authority, original exception and native receipt controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_http_spi tools.tests.test_http_tenant_native_products -v
      - name: Retrieve exactly the five authenticated V7 products without a native rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wait_runtime_native_products.py --output "$RUNNER_TEMP/java-http-spi-prepared"
