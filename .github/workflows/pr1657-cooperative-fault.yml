name: PR 1657 callback adapter original fault
on:
  push:
    branches: ['diag/pr1657-cooperative-fault-20261107']
permissions:
  contents: read
  actions: read
jobs:
  fault:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce
        with:
          version: 1.254.0
      - name: Retrieve exact successful control and original compiler inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/13568732587/zip > "$RUNNER_TEMP/pump-tested.zip"
          python3 -B tools/rust_combined_http_materials.py --output "$RUNNER_TEMP/rust-combined-original"
      - name: Recompile the unchanged tested adapter and install closed fault observer
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pr1657-cooperative"
          cargo build --locked -p latent-toolchain-smoke --target wasm32-unknown-unknown --example rust-wasi-http-runtime --features rust-wasi-http-cooperative --release
          wasm-tools component new target/wasm32-unknown-unknown/release/examples/rust_wasi_http_runtime.wasm -o "$RUNNER_TEMP/pr1657-cooperative/runtime.wasm"
          PYTHONPATH=. python3 -B .github/pr1657_cooperative_fault.py
          wasm-tools print "$RUNNER_TEMP/pr1657-cooperative/runtime.wasm" > "$RUNNER_TEMP/pr1657-cooperative/runtime.wat"
      - name: Observe the original signed call without changing its gates or budget
        run: python3 -B tools/qualify_rust_thread_http_combined.py --compiler-materials "$RUNNER_TEMP/rust-combined-original" --output "$RUNNER_TEMP/rust-combined-signed" --source-commit "$(git rev-parse HEAD)"
      - name: Print bounded original numeric fault
        if: always()
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'rust-combined-signed/node/cooperative-fault.json'
          if path.is_file():
              assert path.stat().st_size<4096
              print(path.read_text())
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: pr1657-cooperative-fault-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr1657-cooperative/**
            ${{ runner.temp }}/rust-combined-signed/**
            ${{ runner.temp }}/rust-combined-original/retrieval.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
