name: Ordinary C timed waits and sleep

on:
  push:
    branches: ['feat/c-owned-timers-20261022']
    paths:
      - '.github/workflows/c-timed-runtime.yml'
      - 'tools/qualify_c_timed_runtime.py'
      - 'tools/c_timed_runtime_*.py'
      - 'tools/c_timed_source_controls.py'
      - 'tools/tests/fixtures/c-timed-broadcast-source.*'
      - 'tools/fixtures/c-thread-runtime/timing.h'
      - 'sdk/c-guest/runtime/synchronization.c'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c-timed-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-c-threads:
    name: One captured C component and thirty-six signed lifecycle and timer cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Fetch exact frozen source and unchanged reader test models
        run: |
          git fetch --no-tags --depth=1 origin f6251df89851de98cb869784d095ad5cc2e5b385
          git fetch --no-tags --depth=1 origin f244b81f14abad5d4dc4984cb842aaf1d9076e23
          git fetch --no-tags --depth=1 origin 7b6365ee39dea9770591a931b96711965f8a1aaf
          git fetch --no-tags --depth=1 origin 050b9e71ba04a4bdc559f4a7fa48d6bd94c2ff38
          git fetch --no-tags --depth=1 origin 3e4178271b4b7fe75a69c8f0665dbe275b41d7c3
          git fetch --no-tags --depth=1 origin 173ccd9c096e4db643aa9627bd4550cef27fb922
          git fetch --no-tags --depth=1 origin ea118974d93843265a504f5d30571ed7cfe8a7d2
          git fetch --no-tags --depth=1 origin f5351a9331ed954c49ae83f2f4004e0f96d25d0e
          git fetch --no-tags --depth=1 origin ff5aadaecd11874f53aa80e56ffdfff0efda312b
          git fetch --no-tags --depth=1 origin 4ed0db7f07245732d07f867e95ec008a804485e5
          git fetch --no-tags --depth=1 origin cb8ceefc5f6343301871dbde1d8a853d3581cc30
          git fetch --no-tags --depth=1 origin 1d5062ee63c0d5ff202d47e21793f6fb9bb8a21a
          git fetch --no-tags --depth=1 origin 597ef2bc0db168d4aee1c2416c38f9a8b9fef9e8
      - name: Verify source and adverse fixed-product controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_timed_runtime tools.tests.test_c_threading_profile tools.tests.test_host_codec_runtime_shared_native_products -v
      - name: Authenticate five verified native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/host_codec_runtime_shared_native_products.py --output "$RUNNER_TEMP/c-thread-native"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Execute serialized real-C broadcast expiry and new-wave regression
        run: >-
          python3 -B tools/c_timed_source_controls.py
          --zig "$(command -v zig)" --node "$(command -v node)"
          --output "$RUNNER_TEMP/c-timed-source"
      - name: Install only normal captured C compiler prerequisites
        run: |
          python3 -B tools/install_guest_bindgen.py "$RUNNER_TEMP/c-thread-bindgen"
          echo "$RUNNER_TEMP/c-thread-bindgen" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile one ordinary C project and execute original twenty plus sixteen timer cases
        run: python3 -B tools/qualify_c_timed_runtime.py --prepared "$RUNNER_TEMP/c-thread-native" --output "$RUNNER_TEMP/c-thread-runtime"
      - name: Retain bounded public build, invocation and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-timed-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-thread-runtime/*.json
            ${{ runner.temp }}/c-thread-runtime/build/*.json
            ${{ runner.temp }}/c-thread-runtime/build/component.wasm
            ${{ runner.temp }}/c-thread-runtime/application/src/main.c
            ${{ runner.temp }}/c-thread-runtime/application/src/synchronization.h
            ${{ runner.temp }}/c-thread-runtime/application/src/timing.h
            ${{ runner.temp }}/c-thread-runtime/application/wit/**
            ${{ runner.temp }}/c-thread-runtime/build/wit/**
            ${{ runner.temp }}/c-thread-runtime/build/logs/*.txt
            ${{ runner.temp }}/c-thread-runtime/node/*.json
            ${{ runner.temp }}/c-thread-runtime/node/*.stdout
            ${{ runner.temp }}/c-thread-runtime/node/*.stderr
            ${{ runner.temp }}/c-thread-runtime/node/controls/*.json
            ${{ runner.temp }}/c-thread-runtime/node/commands/logs/*.txt
            ${{ runner.temp }}/c-thread-runtime/node/commands/*.json
            ${{ runner.temp }}/c-timed-source/*.json
            ${{ runner.temp }}/c-timed-source/*.wasm
            ${{ runner.temp }}/c-timed-source/logs/*.txt
          retention-days: 7
