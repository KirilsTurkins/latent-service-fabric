permissions:
  contents: read
  actions: read

concurrency:
  group: c-timed-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-c-threads:
    name: One captured C component and thirty-seven signed lifecycle and timer cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Restore compiled Rust dependencies
        uses: KirilsTurkins/lsf-rust-cache@38534d49940bc6c6aef1e8dfd45349a99d37f14e # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Fetch exact frozen source and unchanged reader test models
        run: |
          git fetch --no-tags --depth=1 origin f6251df89851de98cb869784d095ad5cc2e5b385
          git fetch --no-tags --depth=1 origin f244b81f14abad5d4dc4984cb842aaf1d9076e23
          git fetch --no-tags --depth=1 origin 7b6365ee39dea9770591a931b96711965f8a1aaf
          git fetch --no-tags --depth=1 origin 050b9e71ba04a4bdc559f4a7fa48d6bd94c2ff38
          git fetch --no-tags --depth=1 origin 3e4178271b4b7fe75a69c8f0665dbe275b41d7c3
          git fetch --no-tags --depth=1 origin 173ccd9c096e4db643aa9627bd4550cef27fb922
          git fetch --no-tags --depth=1 origin ea118974d93843265a504f5d30571ed7cfe8a7d2
          git fetch --no-tags --depth=1 origin f5351a9331ed954c49ae83f2f4004e0f96d25d0e
          git fetch --no-tags --depth=1 origin ff5aadaecd11874f53aa80e56ffdfff0efda312b
          git fetch --no-tags --depth=1 origin 4ed0db7f07245732d07f867e95ec008a804485e5
          git fetch --no-tags --depth=1 origin cb8ceefc5f6343301871dbde1d8a853d3581cc30
          git fetch --no-tags --depth=1 origin 1d5062ee63c0d5ff202d47e21793f6fb9bb8a21a
          git fetch --no-tags --depth=1 origin 597ef2bc0db168d4aee1c2416c38f9a8b9fef9e8
          git fetch --no-tags --depth=1 origin ce8c04a7d9fdf3be79e16b2f9a26803b97a7e3e1
          git fetch --no-tags --depth=1 origin b606b1402961593dd918722a66fe293bfab9b319
      - name: Verify source and adverse fixed-product controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_timed_runtime tools.tests.test_c_threading_profile tools.tests.test_host_codec_retirement_native_products tools.tests.test_host_codec_native tools.tests.test_c_timed_current_products -v
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        with:
          version: '0.16.0'
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Execute serialized real-C broadcast expiry and new-wave regression
        run: >-
          python3 -B tools/c_timed_source_controls.py
          --zig "$(command -v zig)" --node "$(command -v node)"
          --output "$RUNNER_TEMP/c-timed-source"
      - name: Install only normal captured C compiler prerequisites
        run: |
          python3 -B tools/install_guest_bindgen.py "$RUNNER_TEMP/c-thread-bindgen"
          echo "$RUNNER_TEMP/c-thread-bindgen" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build current native products and execute all thirty-six C lifecycle and timer cases
        run: >-
          python3 -B tools/qualify_c_timed_runtime.py
          --produce-current "$RUNNER_TEMP/c-thread-native" --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/c-thread-runtime"
      - name: Retain bounded public build, invocation and cleanup evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-timed-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-thread-runtime/*.json
            ${{ runner.temp }}/c-thread-runtime/build/*.json
            ${{ runner.temp }}/c-thread-runtime/build/component.wasm
            ${{ runner.temp }}/c-thread-runtime/application/src/main.c
            ${{ runner.temp }}/c-thread-runtime/application/src/synchronization.h
            ${{ runner.temp }}/c-thread-runtime/application/src/timing.h
            ${{ runner.temp }}/c-thread-runtime/application/wit/**
            ${{ runner.temp }}/c-thread-runtime/build/wit/**
            ${{ runner.temp }}/c-thread-runtime/build/logs/*.txt
            ${{ runner.temp }}/c-thread-runtime/node/*.json
            ${{ runner.temp }}/c-thread-runtime/node/*.stdout
            ${{ runner.temp }}/c-thread-runtime/node/*.stderr
            ${{ runner.temp }}/c-thread-runtime/node/controls/*.json
            ${{ runner.temp }}/c-thread-runtime/node/commands/logs/*.txt
            ${{ runner.temp }}/c-thread-runtime/node/commands/*.json
            ${{ runner.temp }}/c-timed-source/*.json
            ${{ runner.temp }}/c-timed-source/*.wasm
            ${{ runner.temp }}/c-timed-source/logs/*.txt
            ${{ runner.temp }}/c-thread-native/*.json
            ${{ runner.temp }}/c-thread-native/logs/*.txt
          retention-days: 7
      - name: Retain the five verified and size-bounded native products
        if: success()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-timed-native-products-${{ github.sha }}
          path: ${{ runner.temp }}/c-thread-native/native-binaries/**
          if-no-files-found: error
          retention-days: 7
