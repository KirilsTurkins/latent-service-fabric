name: Focused canonical outer and sync result backing
on:
  push:
    branches: ['feat/sdk-736-legacy-host-futures-20261026']
    paths:
      - '.github/workflows/canonical-join-state.yml'
      - 'crates/vendor/wasmtime/**'
      - 'crates/latent-wasmtime/src/host.rs'
      - 'crates/latent-wasmtime/src/host/join_state_tests.rs'
      - 'crates/latent-wasmtime/src/host/native_host_future_tests.rs'
      - 'crates/latent-wasmtime/src/host/native_context_reply_tests.rs'
      - 'crates/latent-wasmtime/src/host/native_store_tests.rs'
      - 'tools/qualify_canonical_join_state.py'
      - 'tools/host_codec_wasmtime.py'
permissions:
  contents: read
concurrency:
  group: canonical-outer-sync-result-${{ github.ref }}
  cancel-in-progress: false
jobs:
  join-state:
    name: Four remaining actual host controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v3-contract-profiles
          shared-key: host-contracts
          key: ubuntu-24.04
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/wasm32-wasip2
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Build only one locked host target and execute the exact four remaining controls
        run: >-
          python3 -B tools/qualify_canonical_join_state.py
          --source-commit "${{ github.sha }}"
          --output "$RUNNER_TEMP/canonical-join-state"
      - name: Retain bounded source, exact test observations and failure history
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: canonical-outer-sync-result-${{ github.sha }}
          path: |
            ${{ runner.temp }}/canonical-join-state/receipt.json
            ${{ runner.temp }}/canonical-join-state/FAILED.json
            ${{ runner.temp }}/canonical-join-state/source-inputs.json
            ${{ runner.temp }}/canonical-join-state/commands.json
            ${{ runner.temp }}/canonical-join-state/commands/logs/*.txt
          if-no-files-found: warn
          retention-days: 3
