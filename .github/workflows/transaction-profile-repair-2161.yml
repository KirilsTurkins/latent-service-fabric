name: PR 2161 transaction profile repair preparation

on:
  pull_request:
    branches: [development]
    paths: ['.github/workflows/transaction-profile-repair-2161.yml']

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.number == 2161 && github.head_ref == 'fix/sdk-stack-context-physical-custody-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
      - uses: KirilsTurkins/lsf-setup-go@92a5903f5ff2b45e67c517d23c18501025a55a12
        with:
          go-version: 1.27.4
          cache: false
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Install the verified descriptor generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lsf-buf-1.72.0.tar.gz"
          destination="$RUNNER_TEMP/lsf-buf-1.72.0"
          mkdir "$destination"
          timeout 120s gh api -H 'Accept: application/octet-stream' repos/bufbuild/buf/releases/assets/480772583 | head -c 37851982 > "$archive"
          unset GH_TOKEN
          test "$(stat --format=%s "$archive")" = 37851981
          printf '%s  %s\n' a9c6186cf6fcf062b247345e1b7b12c26f580c1b2a4bbf4d3fe080abf85ceee8 "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$destination" buf/bin/buf
          bindir="$destination/buf/bin"
          test "$(stat --format=%s "$bindir/buf")" = 54050978
          printf '%s  %s\n' 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af "$bindir/buf" | sha256sum --check --strict
          chmod 755 "$bindir/buf"
          test "$("$bindir/buf" --version)" = 1.72.0
          printf '%s\n' "$bindir" >> "$GITHUB_PATH"
      - name: Retain original inputs and regenerate with unchanged owners
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/transaction-profile-repair"
          mkdir "$output"
          git rev-parse HEAD > "$output/source.sha"
          git archive --format=tar.gz --output="$output/original-inputs.tar.gz" HEAD -- api sdk/profile sdk/rust/src/transaction sdk/rust/src/network/transaction sdk/go/transaction sdk/typescript-client/src/transactions.ts sdk/typescript-client/src/node/protocol/transaction-generated.ts sdk/java-client/src/main/java/dev/latent/sdk/Transactions.java sdk/dotnet/Latent.Sdk/Transactions.cs sdk/c/include/latent/transaction.h tools/transaction_client_models.py tools/tests/test_transaction_client_models.py
          python3 tools/transaction_client_models.py --write 2>&1 | tee "$output/generation.log"
          git diff --binary > "$output/generated.patch"
          git diff --name-only > "$output/changed-paths.txt"
          tar -czf "$output/generated-inputs.tar.gz" sdk/profile/transaction-client-contract.json sdk/rust/src/transaction/models.rs sdk/go/transaction/models.go sdk/typescript-client/src/transactions.ts sdk/typescript-client/src/node/protocol/transaction-generated.ts sdk/java-client/src/main/java/dev/latent/sdk/Transactions.java sdk/dotnet/Latent.Sdk/Transactions.cs sdk/c/include/latent/transaction.h
          python3 tools/transaction_client_models.py --check 2>&1 | tee "$output/generation-check.log"
          python3 -m unittest tools.tests.test_transaction_client_models 2>&1 | tee "$output/model-tests.log"
      - name: Execute unchanged real transaction transport regressions on generated candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p latent-sdk --lib network::transaction::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/transaction-profile-repair/rust-tests.log"
      - name: Retain source-bound generated candidate and test results
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: transaction-profile-repair-${{ github.sha }}
          path: ${{ runner.temp }}/transaction-profile-repair/
          retention-days: 7
          if-no-files-found: error
