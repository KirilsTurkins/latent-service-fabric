# Temporary branch-only execution; removed after retaining validation results.
name: Deterministic cycle correction
on:
  push:
    branches: [feat/433-deterministic-test-coordination]
    paths: [.github/workflows/validate-deterministic-cycle.yml]
permissions:
  contents: write
concurrency:
  group: deterministic-cycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'KirilsTurkins/latent-service-fabric'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: /tmp/lsf-cycle-target
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
      - name: Prepare independent permanent CI steps without replacing concurrent checks
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('tools/_ci_cycle_candidate.txt')
          text = path.read_text()
          old = '          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_validate_docs tools.tests.test_deterministic_tests tools.tests.test_testkit_dependencies'
          assert text.count(old) == 1
          text = text.replace(old, '          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_validate_docs')
          marker = '\n  rust:\n'
          assert text.count(marker) == 1
          text = text.replace(marker, '\n      - name: Validate deterministic dependency regressions\n        run: python3 -m unittest tools.tests.test_deterministic_tests tools.tests.test_testkit_dependencies\n' + marker)
          candidate = yaml.safe_load(text)
          original = yaml.safe_load(Path('.github/workflows/ci.yml').read_text())
          for job, name in [('docs', 'Validate deterministic dependency regressions'), ('rust', 'Check deterministic helper dependency boundaries')]:
              steps = candidate['jobs'][job]['steps']
              added = [step for step in steps if step.get('name') == name]
              assert len(added) == 1
              steps.remove(added[0])
          assert candidate == original, 'permanent workflow changed outside two new validation steps'
          path.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/_ci_cycle_candidate.txt
          git commit -m 'ci: retain deterministic checks as independent additive steps'
          git push origin HEAD:feat/433-deterministic-test-coordination
          git rev-parse HEAD
      - name: Run actual repository and dependency regression validators
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_foundation.py
          python3 tools/validate_docs.py
          python3 -m unittest tools.tests.test_deterministic_tests tools.tests.test_testkit_dependencies
          python3 tools/check_testkit_dependencies.py
      - name: Verify relocated helpers and both migrated subsystems
        run: |
          cargo fmt --all --check
          cargo test -p latent-core --features test-support --lib --locked test_support:: -- --test-threads=1
          cargo test -p latent-core --features test-support --lib --locked test_support:: -- --test-threads=4
          cargo test -p latent-core --features test-support --lib --locked
          cargo test -p latent-admission -p latent-scheduler --lib --locked
          cargo test -p latent-testkit --no-default-features --lib --test test_support_compatibility --locked
          cargo run -p latent-testkit --no-default-features --example deadline --locked
          cargo run -p latent-testkit --no-default-features --example cancellation --locked
          cargo test -p latent-testkit --lib --test test_support_compatibility --locked
      - name: Verify lint and default API contracts
        run: |
          cargo clippy -p latent-core --features test-support --all-targets --locked --no-deps
          cargo clippy -p latent-testkit --all-targets --all-features --locked --no-deps -- -D warnings
          cargo clippy -p latent-admission --all-targets --locked --no-deps -- -D warnings
          cargo clippy -p latent-scheduler --tests --locked --no-deps
          cargo test -p latent-core --features test-support --doc --locked
          cargo test -p latent-testkit --doc --locked
          git diff --exit-code
          git rev-parse HEAD
