name: TypeScript ordinary scheduling semantics
on:
  push:
    branches: ['feat/typescript-runtime-semantics-20261020']
    paths:
      - '.github/workflows/typescript-runtime-semantics.yml'
      - 'sdk/typescript-guest/probes/runtime-semantics/**'
      - 'tools/typescript_runtime_semantics.py'
      - 'tools/qualify_typescript_runtime_semantics.py'
      - 'tools/tests/test_typescript_runtime_semantics.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-runtime-semantics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch-conformance:
    name: Signed ordinary thenable microtask timer and CPU semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check scheduling evidence refusal controls
        run: python3 -B -m unittest tools.tests.test_typescript_runtime_semantics -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/runtime-semantics-tools"
      - name: Acquire exact historical import engine and original native tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_fetch_replay_inputs.py --output "$RUNNER_TEMP/runtime-semantics-original"
      - name: Build sign and execute ordinary JavaScript scheduling cases
        run: python3 -B tools/qualify_typescript_runtime_semantics.py --acquired "$RUNNER_TEMP/runtime-semantics-original" --tools "$RUNNER_TEMP/runtime-semantics-tools" --output "$RUNNER_TEMP/runtime-semantics"
      - name: Retain exact source compiler results real contacts and physical ownership
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-runtime-semantics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-semantics-original/acquisition.json
            ${{ runner.temp }}/runtime-semantics/*.json
            ${{ runner.temp }}/runtime-semantics/build/*.json
            ${{ runner.temp }}/runtime-semantics/build/*.wit
            ${{ runner.temp }}/runtime-semantics/build/component.wasm
            ${{ runner.temp }}/runtime-semantics/build/package/**
            ${{ runner.temp }}/runtime-semantics/build/logs/
            ${{ runner.temp }}/runtime-semantics/node/*.json
            ${{ runner.temp }}/runtime-semantics/node/controls/
          if-no-files-found: warn
          retention-days: 7
