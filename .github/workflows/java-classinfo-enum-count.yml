name: Java ClassInfo finite enum-count compiler qualification
on:
  push:
    branches: ['fix/java-classinfo-enum-count-20261105']
permissions:
  contents: read
concurrency:
  group: java-classinfo-enum-count-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-context:
    name: Original and corrected pinned JVM compiler control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0aa7f1b2061a76e0424bd22ac45be035ce42a6e # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@5d910981b146bc2d4fd97fa349210f3e3d454039 # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: One JVM-only compiler probe without guest or native compilation
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B tools/qualify_java_checkpoint_context.py --output "$RUNNER_TEMP/checkpoint-context"
      - name: Retain bounded original and corrected compiler observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-checkpoint-context-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/checkpoint-context/result.json
            ${{ runner.temp }}/checkpoint-context/commands.json
            ${{ runner.temp }}/checkpoint-context/commands/logs/**
  fiber-compiler:
    name: Fixed public fiber compiler and non-identifying refusal
    needs: compiler-context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0aa7f1b2061a76e0424bd22ac45be035ce42a6e # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@5d910981b146bc2d4fd97fa349210f3e3d454039 # v6.1.0 + upstream changes + LSF security fixes
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install the same source-authenticated compiler tools as the authoring job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          curl --fail --location --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          compiler_root=$(mktemp -d /tmp/latent-java-classinfo.XXXXXXXX)
          timeout --signal=TERM --kill-after=5 1195 \
            python3 -B tools/java_guest/compiler_profile_distribution.py stage \
              --root "$compiler_root" --output "$RUNNER_TEMP/java-classinfo-compiler-product.json" \
              > "$RUNNER_TEMP/java-classinfo-compiler-path.txt"
          compiler_sdk=$(cat "$RUNNER_TEMP/java-classinfo-compiler-path.txt")
          test "$compiler_sdk" = "$compiler_root/work/installed/wasi-sdk"
          printf 'LSF_JAVA_CLASSINFO_WASI_SDK=%s\n' "$compiler_sdk" >> "$GITHUB_ENV"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/java-bindgen"
          echo "$RUNNER_TEMP/java-bindgen" >> "$GITHUB_PATH"
      - name: Compile the unchanged public fiber fixture without guest execution
        run: |
          python3 -B tools/qualify_java_fibers.py \
            --output "$RUNNER_TEMP/java-classinfo-fibers" \
            --wasi-sdk "$LSF_JAVA_CLASSINFO_WASI_SDK"
      - name: Retain bounded source-bound compiler diagnostics
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: java-classinfo-fibers-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/java-classinfo-compiler-product.json
            ${{ runner.temp }}/java-classinfo-fibers/FIBERS-COMPILE.json
            ${{ runner.temp }}/java-classinfo-fibers/compiler/*.json
            ${{ runner.temp }}/java-classinfo-fibers/compiler/*-java-to-c.log
            ${{ runner.temp }}/java-classinfo-fibers/build/*.json
