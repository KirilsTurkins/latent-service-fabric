name: Isolated PR2151 merge validation and blob storage
on:
  push:
    branches: ['tmp/pr2151-merge-702bd725-20261123']
    paths: ['.github/workflows/pr2151-merge-prepare.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: f881e760dfb527e341b2b43b60d99f217ad2d8ae
          fetch-depth: 200
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: KirilsTurkins/lsf-setup-node@791d25988f7dc57f537b82342f7af452cd59cd6a
        with:
          node-version: '24.19.0'
      - name: Install declared Python validator dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Resolve exact-parent merge and validate without write credentials
        env:
          READ_TOKEN: ${{ github.token }}
          RESOLUTION_PACKET: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess, sys, zlib
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'pr2151-resolution'
          out.mkdir(exist_ok=True)
          raw = zlib.decompress(base64.b64decode(os.environ['RESOLUTION_PACKET'], validate=True))
          assert len(raw) == 24528 and hashlib.sha256(raw).hexdigest() == '327280226f1befd04f4747db57185cc0fdd68968f2a695ec3c59ded6ddad2461'
          packet = json.loads(raw); m = packet['manifest']
          (out / 'packet.json').write_bytes(raw)
          def git(*args, check=True):
              p = subprocess.run(['git', *args], capture_output=True, timeout=180)
              if check and p.returncode:
                  raise RuntimeError('git operation failed: ' + p.stderr.decode(errors='replace')[-4000:])
              return p

          def text(*args): return git(*args).stdout.decode().strip()
          def blob(data): return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert text('rev-parse', 'HEAD') == m['head']
          assert not text('status', '--porcelain')
          # No credential persists in the repository or enters a test subprocess.
          credential = base64.b64encode(('x-access-token:' + os.environ.pop('READ_TOKEN')).encode()).decode()
          git('-c', 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + credential,
              'fetch', '--no-tags', '--depth=200', 'origin', m['development'])
          del credential
          assert text('merge-base', m['head'], m['development']) == m['commonAncestor']
          merged = git('-c', 'user.name=PR 2151 validation', '-c', 'user.email=validation@localhost',
                       'merge', '--no-commit', '--no-ff', m['development'], check=False)
          (out / 'merge.log').write_bytes(merged.stdout + merged.stderr)
          assert merged.returncode in (0, 1)
          assert text('rev-parse', 'MERGE_HEAD') == m['development']
          conflicts = set(text('diff', '--name-only', '--diff-filter=U').splitlines())
          assert conflicts <= set(m['resolvedConflicts']), sorted(conflicts)
          for item in packet['transport']:
              path = item['path']; target = root / path
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              original = git('show', item['sourceRef'] + ':' + path).stdout
              assert blob(original) == item['sourceBlob'], path
              cursor = 0
              for start, end, value in item['edits']:
                  assert cursor <= start <= end <= len(original)
                  cursor = end
              result = original
              for start, end, value in reversed(item['edits']): result = result[:start] + value.encode() + result[end:]
              assert len(result) == item['bytes'] and hashlib.sha256(result).hexdigest() == item['sha256'] and blob(result) == item['gitBlob'], path
              target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(result)
          git('add', '--', *(x['path'] for x in packet['transport']))
          assert not text('diff', '--name-only', '--diff-filter=U')
          for group, ref in [('preserveOurs', m['head']), ('preserveDevelopment', m['development'])]:
              for path in m[group]: assert (root/path).read_bytes() == git('show', ref+':'+path).stdout, path
          git('diff', '--cached', '--check')
          tree = text('write-tree')
          def stable():
              assert text('rev-parse','HEAD') == m['head'] and text('rev-parse','MERGE_HEAD') == m['development']
              assert text('write-tree') == tree
              git('diff', '--quiet')
              assert not text('ls-files','--others','--exclude-standard')
          stable()
          env = dict(os.environ, PYTHONDONTWRITEBYTECODE='1', LSF_PYTHON_POLICY_BASE=m['development'])
          observations = []
          for number, command in enumerate(m['validationCommands']):
              stable()
              args = [sys.executable if x == '{python}' else x for x in command]
              with (out/f'validation-{number}.log').open('wb') as log:
                  p = subprocess.run(args, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=1200)
              output = (out/f'validation-{number}.log').read_text(errors='replace')
              print(f'validation-{number}: exit={p.returncode}\n'+output[-700:], flush=True)
              assert p.returncode == 0, f'validation-{number}'
              assert not re.search(r'OK \(skipped=', output), f'validation-{number}: unexpected skip'
              observations.append({'command':args,'exit':p.returncode,'summary':output[-300:]})
              stable()
          # These repository-wide validators see the real complete merged checkout.
          for number, args in enumerate([[sys.executable,'-B','tools/validate_repository.py'],
                                        [sys.executable,'-B','tools/ci_coverage.py','--receipt','target/ci/pr2151-inventory.json']], start=6):
              with (out/f'validation-{number}.log').open('wb') as log:
                  p = subprocess.run(args, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=1200)
              output=(out/f'validation-{number}.log').read_text(errors='replace')
              print(f'validation-{number}: exit={p.returncode}\n'+output[-700:],flush=True)
              assert p.returncode == 0, f'validation-{number}'
              observations.append({'command':args,'exit':p.returncode,'summary':output[-300:]})
              stable()
          overlay=[]
          known={x['path']:x['gitBlob'] for x in packet['transport']}
          for path in text('diff','--cached','--name-only','--no-renames',m['development']).splitlines():
              rows=text('ls-files','--stage','--',path).splitlines()
              if not rows:
                  overlay.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
              assert len(rows)==1
              mode,sha,stage=rows[0].split('\t',1)[0].split(); assert stage=='0'
              if known.get(path)!=sha:
                  assert any(sha == blob(p.stdout) for ref in [m['head'],m['development']]
                             if (p:=git('show',ref+':'+path,check=False)).returncode==0), ('unreviewed auto-merge',path)
              overlay.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          for item in packet['transport']:
              target=out/'postimages'/item['path'];target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes((root/item['path']).read_bytes())
          report={'status':'passed','head':m['head'],'development':m['development'],
                  'tree':tree,'baseTree':text('rev-parse',m['development']+'^{tree}'),
                  'conflicts':sorted(conflicts),'overlay':overlay,'validation':observations,
                  'qualification':'Focused tests and source validators only; fresh complete signed CI remains required.'}
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          (out/'merged-vs-development.patch').write_bytes(git('diff','--cached','--binary',m['development']).stdout)
          print(json.dumps({k:report[k] for k in ['status','head','development','tree','conflicts','overlay']},indent=2))
          PY
      - name: Retain bounded merge and validation evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-merge-validated
          path: ${{ runner.temp }}/pr2151-resolution/
          retention-days: 7
          if-no-files-found: error
  store-blobs:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: pr2151-merge-validated
          path: ${{ runner.temp }}/pr2151-resolution/
      - name: Store only the fifteen exact reviewed blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'pr2151-resolution'
          raw=(root/'packet.json').read_bytes()
          assert len(raw)==24528 and hashlib.sha256(raw).hexdigest()=='327280226f1befd04f4747db57185cc0fdd68968f2a695ec3c59ded6ddad2461'
          packet=json.loads(raw)
          report=json.loads((root/'report.json').read_text())
          assert report['status']=='passed'
          assert report['head']==packet['manifest']['head'] and report['development']==packet['manifest']['development']
          results=[]
          for item in packet['transport']:
              path=root/'postimages'/item['path']
              assert not path.is_symlink() and path.resolve().is_relative_to(root)
              data=path.read_bytes()
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['gitBlob']
              request=urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs',
                  data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result['sha']==item['gitBlob']
              results.append({'path':item['path'],'sha':result['sha']})
          (root/'stored-blobs.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          # Deliberately no commit, tree, branch update, checkout or source execution here.
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-merge-publication
          path: |
            ${{ runner.temp }}/pr2151-resolution/stored-blobs.json
            ${{ runner.temp }}/pr2151-resolution/report.json
          retention-days: 7
          if-no-files-found: error
