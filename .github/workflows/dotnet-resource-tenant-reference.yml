name: Retained CLR resource tenant reference

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dotnet-resource-tenants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tenants:
    name: Closed CLR metadata and two resource tenant lifecycles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install controller requirements and verify closed public-input scope
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_dotnet_resource_tenants tools.tests.test_resource_tenant_isolation -v
      - name: Authenticate fixed historical normal native products before executable restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12255531553 > "$RUNNER_TEMP/dotnet-resource-native-producer.json"
          python3 -B tools/qualify_resource_tenants.py --verify-native-producer "$RUNNER_TEMP/dotnet-resource-native-producer.json"
      - name: Restore the exact a4 normal native products
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: sdk-native-products-a4f05f3f243889cc7ba7a0404bdc76afec32d3c2
          run-id: 39400186766
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dotnet-resource-native
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Recompose original cores and require normal signed resource tenant lifecycles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/qualify_dotnet_resource_tenants.py \
            --native "$RUNNER_TEMP/dotnet-resource-native" \
            --native-producer "$RUNNER_TEMP/dotnet-resource-native-producer.json" \
            --output "$RUNNER_TEMP/dotnet-resource-tenants"
      - name: Retain fixed public ancestry derivation and actual node observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: dotnet-resource-tenants-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dotnet-resource-native-producer.json
            ${{ runner.temp }}/dotnet-resource-tenants/qualified.json
            ${{ runner.temp }}/dotnet-resource-tenants/FAILED.json
            ${{ runner.temp }}/dotnet-resource-tenants/originals/acquisition.json
            ${{ runner.temp }}/dotnet-resource-tenants/originals/original/*.json
            ${{ runner.temp }}/dotnet-resource-tenants/originals/original/component.wasm
            ${{ runner.temp }}/dotnet-resource-tenants/public-original/build/*.json
            ${{ runner.temp }}/dotnet-resource-tenants/public-original/build/component.wasm
            ${{ runner.temp }}/dotnet-resource-tenants/public-original/build/wit/**/*.wit
            ${{ runner.temp }}/dotnet-resource-tenants/build-evidence/*.json
            ${{ runner.temp }}/dotnet-resource-tenants/commands/*.json
            ${{ runner.temp }}/dotnet-resource-tenants/commands/*.wac
            ${{ runner.temp }}/dotnet-resource-tenants/commands/logs/**
            ${{ runner.temp }}/dotnet-resource-tenants/coupled/qualified.json
            ${{ runner.temp }}/dotnet-resource-tenants/coupled/FAILED.json
            ${{ runner.temp }}/dotnet-resource-tenants/coupled/logs/**
            ${{ runner.temp }}/dotnet-resource-tenants/coupled/examples-controls/*.json
            ${{ runner.temp }}/dotnet-resource-tenants/coupled/foreign-controls/*.json
            ${{ runner.temp }}/dotnet-resource-tenants/coupled/signed/my-greeting/build-observation.json
