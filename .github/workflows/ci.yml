          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
