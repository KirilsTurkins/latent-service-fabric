  oci-registry:
    name: OCI registry TLS integration
    needs: [profile, contracts]
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - name: Receive bounded observed echo inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase-2-observed-echo-${{ github.sha }}
          path: target/capsules/echo-provenance
      - name: Fetch pinned disposable registry
        run: docker pull ghcr.io/project-zot/zot-minimal-linux-amd64@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - name: Check owned registry prerequisites before building
        id: oci_preflight
        run: python3 tools/run_oci_registry_tests.py --preflight --diagnostic-root "$RUNNER_TEMP/owned-oci"
      - name: Demonstrate live provider startup and injected failure cleanup
        env:
          LSF_REQUIRE_NATIVE_PROCESS_TESTS: '1'
          LSF_LIVE_OCI_DEMO: '1'
          LSF_OWNED_DEMO_DIAGNOSTICS: ${{ runner.temp }}/owned-oci-demo
        run: python3 -m unittest tools.tests.test_owned_runners.NativeRunnerDemonstrations.test_live_provider_normal_and_injected_failure_leave_no_owned_container
      - name: Prepare exact OCI and web admission harnesses
        run: |
          cargo test -p latent-oci --test registry --locked --no-run --message-format=json,json-render-diagnostics > "$RUNNER_TEMP/lsf-oci-tests.jsonl"
          cargo test -p latent-policy --lib --locked --no-run --message-format=json,json-render-diagnostics > "$RUNNER_TEMP/lsf-web-registry-tests.jsonl"
      - name: Check runner ownership and cleanup guards
        run: python3 -m unittest discover -s tools/tests -p test_oci_registry_runner.py
      - name: Validate bounded authenticated OCI distribution
        run: python3 tools/run_oci_registry_tests.py --test-manifest "$RUNNER_TEMP/lsf-oci-tests.jsonl" --state-file "$RUNNER_TEMP/lsf-oci-registry.json" --provenance-input target/capsules/echo-provenance --diagnostic-root "$RUNNER_TEMP/owned-oci"
      - name: Receive bounded public web component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase-3-web-contract-${{ github.sha }}
          path: target/capsules/web-contract
      - name: Validate signed web package registry and catalog round trips
        run: python3 tools/run_oci_registry_tests.py --test-manifest "$RUNNER_TEMP/lsf-web-registry-tests.jsonl" --state-file "$RUNNER_TEMP/lsf-oci-registry.json" --web-admission-component target/capsules/web-contract/component.wasm --diagnostic-root "$RUNNER_TEMP/owned-oci"
      - name: Recover only this job's disposable registry
        if: always()
        run: python3 tools/run_oci_registry_tests.py --cleanup-state "$RUNNER_TEMP/lsf-oci-registry.json" --diagnostic-root "$RUNNER_TEMP/owned-oci"

      - name: Retain attempted registry ownership diagnostics
        if: always() && steps.oci_preflight.outcome != '' && steps.oci_preflight.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-oci-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owned-oci/*.json
            ${{ runner.temp }}/owned-oci-demo/*.json
          if-no-files-found: warn
          retention-days: 7

