name: CI

on:
  pull_request:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      run_catalog_scale:
        description: "Run the heavyweight 100,000-release catalog acceptance probe"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    name: Select CI profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      reason: ${{ steps.select.outputs.reason }}
      changed_files: ${{ steps.select.outputs.changed_files }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify the complete change
        id: select
        run: python3 tools/ci_profile.py

  docs:
    name: Documentation and SVGs
    needs: profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install documentation validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Validate documentation and profile selection
        run: |
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_validate_docs
          python3 tools/validate_docs.py

  rust:
    name: Rust 1.97.1
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Check generated RPC and Component Model bindings
        run: |
          cargo check -p latent-rpc --all-targets --all-features --locked
          cargo check -p latent-component-bindings --locked
          cargo check -p latent-component-bindings --target wasm32-wasip2 --locked
          cargo check -p latent-toolchain-smoke --target wasm32-wasip2 --locked
          cargo check -p latent-toolchain-smoke --example echo-capsule --target wasm32-wasip2 --locked
      - name: Run Clippy
        id: clippy
        env:
          CARGO_TERM_COLOR: never
        run: |
          status=0
          cargo clippy --workspace --all-targets --all-features --locked > "$RUNNER_TEMP/lsf-clippy.log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            cargo clippy -p latent -p latentd -p latent-testkit -p latent-admission --all-targets --all-features --locked --no-deps -- -D warnings >> "$RUNNER_TEMP/lsf-clippy.log" 2>&1 || status=$?
          fi
          tail -n 120 "$RUNNER_TEMP/lsf-clippy.log"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          lines = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "lsf-clippy.log").read_text().splitlines()
          errors = [" ".join(lines[i:i + 4]) for i, line in enumerate(lines) if re.match(r"^error(?:\[.*?\])?:", line)]
          diagnostic = " | ".join(errors)[:1000] or "no compiler errors"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"diagnostic={diagnostic}\n")
          PY
          exit "$status"
      - name: "Clippy diagnostics: ${{ steps.clippy.outputs.diagnostic }}"
        if: failure() && steps.clippy.outcome == 'failure'
        run: tail -n 120 "$RUNNER_TEMP/lsf-clippy.log"
      - name: Run tests
        run: |
          cargo test --workspace --all-targets --all-features --locked
          cargo test -p latent-admission -p latent-scheduler --doc --locked
          cargo test -p latent-signing --lib --locked --features ed25519-dalek/legacy_compatibility crypto::tests

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - name: Fetch the pinned operator workflow registry
        run: docker pull ghcr.io/project-zot/zot-minimal-linux-amd64@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
      - name: Validate bounded Phase 2 delivery and resource workflows
        timeout-minutes: 10
        shell: bash
        run: |
          cargo build -p latent -p latentd --all-features --locked
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/lsf-operator-fixture.XXXXXXXX")"
          mkdir -p "${RUNNER_TEMP}/phase2-gate"
          trap 'rm -rf -- "$fixture_root"' EXIT
          LSF_OPERATOR_FIXTURE_ROOT="${fixture_root}/inputs" cargo test -p latent-policy --lib --all-features --locked export_operator_workflow_fixture -- --ignored --test-threads=1
          python3 -m unittest tools.tests.test_phase2_operator_workflow tools.tests.test_phase2_operator_canary tools.tests.test_phase2_offline_workflow
          python3 tools/run_phase2_operator_workflow.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --fixture-root "${fixture_root}/inputs" --source-commit "${GITHUB_SHA}" > "${RUNNER_TEMP}/phase2-gate/operator-receipt.json"
          cargo build -p latent-wasmtime --bin latent-aot-compiler --all-features --locked
          LSF_OPERATOR_FIXTURE_ROOT="${fixture_root}/inputs" LSF_AOT_COMPILER="${PWD}/target/debug/latent-aot-compiler" cargo test -p latentd --lib --all-features --locked standalone::start::tests::trust_currentness:: -- --ignored --test-threads=1
          python3 tools/run_phase2_offline_workflow.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --fixture-root "${fixture_root}/inputs" --source-commit "${GITHUB_SHA}" > "${RUNNER_TEMP}/phase2-gate/offline-receipt.json"
          LSF_PHASE2_RESOURCE_FIXTURE_ROOT="${fixture_root}/resource-inputs" cargo test -p latent-policy --lib --all-features --locked export_phase2_resource_fixture -- --ignored --test-threads=1
          python3 -m unittest tools.tests.test_phase2_gate_resource
          LSF_GATE_FIXTURE_ROOT="${fixture_root}" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          def digest(path):
              with path.open("rb") as source:
                  return "sha256:" + hashlib.file_digest(source, "sha256").hexdigest()
          identity = {
              "schemaVersion": "latent.phase2.resource-build.v1",
              "sourceRevision": os.environ["GITHUB_SHA"],
              "cargoLockSha256": digest(root / "Cargo.lock"),
              "cliSha256": digest(root / "target/debug/latent"),
              "nodeSha256": digest(root / "target/debug/latentd"),
              "rustcVersion": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "buildProfile": "debug",
          }
          (pathlib.Path(os.environ["LSF_GATE_FIXTURE_ROOT"]) / "build.json").write_text(json.dumps(identity))
          PY
          python3 tools/phase2_gate_resource.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --fixture-root "${fixture_root}/resource-inputs" --build-identity "${fixture_root}/build.json" --output "${RUNNER_TEMP}/phase2-gate/resource-receipt.json"
          python3 tools/phase2_gate_resource.py --validate "${RUNNER_TEMP}/phase2-gate/resource-receipt.json"
      - name: Retain compact Phase 2 gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-gate-${{ github.sha }}
          path: ${{ runner.temp }}/phase2-gate/*.json
          if-no-files-found: warn
          retention-days: 7

  oci-registry:
    name: OCI registry TLS integration
    needs: [profile, contracts]
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - name: Receive bounded observed echo inputs
        uses: actions/download-artifact@v4
        with:
          name: phase-2-observed-echo-${{ github.sha }}
          path: target/capsules/echo-provenance
      - name: Fetch pinned disposable registry
        run: docker pull ghcr.io/project-zot/zot-minimal-linux-amd64@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
      - name: Check runner ownership and cleanup guards
        run: python3 -m unittest discover -s tools/tests -p test_oci_registry_runner.py
      - name: Validate bounded authenticated OCI distribution
        run: python3 tools/run_oci_registry_tests.py --state-file "$RUNNER_TEMP/lsf-oci-registry.json" --provenance-input target/capsules/echo-provenance
      - name: Recover only this job's disposable registry
        if: always()
        run: python3 tools/run_oci_registry_tests.py --cleanup-state "$RUNNER_TEMP/lsf-oci-registry.json"

  catalog:
    name: Durable catalog acceptance
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    # 60m publication + 30m reopen, with build/cleanup/evidence-upload headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - name: Run catalog recovery, routing, and dormancy regressions
        run: cargo test -p latent-artifacts -p latent-control-store --lib --locked -- --nocapture
      - name: Check catalog probe supervision
        run: cargo test -p latentd --test catalog_scale --locked
      - name: Publish and reopen 100,000 dormant releases in isolated processes
        if: github.event_name == 'workflow_dispatch' && inputs.run_catalog_scale
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          LSF_CATALOG_SCALE_LOG_DIR: ${{ github.workspace }}/catalog-scale-logs
        run: |
          set -o pipefail
          cargo test -p latentd --test catalog_scale --locked production_catalog_100k -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee catalog-scale.log
      - name: Retain catalog acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_catalog_scale
        uses: actions/upload-artifact@v4
        with:
          name: catalog-scale-${{ github.sha }}
          path: |
            catalog-scale.log
            catalog-scale-logs/*.log
          if-no-files-found: warn
          retention-days: 14

  msrv:
    name: Rust MSRV 1.94.1
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - name: Check workspace at MSRV
        run: cargo +1.94.1 check --workspace --all-targets --all-features --locked

  contracts:
    name: Repository contracts
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install Python validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v1
          key: ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml') }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - name: Validate contracts, echo component, and generated bindings
        run: |
          unset CARGO_INCREMENTAL
          tools/validate_contracts.sh
      - name: Run executable outcome and recovery matrix
        run: bash tools/run_phase0_outcome_matrix.sh
      - name: Pass bounded observed build inputs to registry verification
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-observed-echo-${{ github.sha }}
          path: target/capsules/echo-provenance/
          if-no-files-found: error
          retention-days: 1
      - name: Retain bounded Phase 1 conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-bounded-conformance-${{ github.sha }}
          path: target/phase1-conformance/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain Phase 1 measurement collector smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-measurement-smoke-${{ github.sha }}
          path: target/phase1-measurements/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate standalone optimization benchmark smoke
        run: |
          unset CARGO_INCREMENTAL
          python3 tools/run_optimization_benchmarks.py --profile smoke
      - name: Retain optimization benchmark smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-optimization-smoke-${{ github.sha }}
          path: target/optimization-benchmarks/
          if-no-files-found: warn
          retention-days: 14
      - name: Record echo capsule build evidence
        run: |
          cat target/capsules/echo/build.json
          cat target/capsules/echo/sha256.txt
      - name: Upload echo capsule build evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-echo-capsule-${{ github.sha }}
          path: |
            target/capsules/echo/echo-capsule.wasm
            target/capsules/echo/capsule.json
            target/capsules/echo/build.json
            target/capsules/echo/interface.json
            target/capsules/echo/interface/
            target/capsules/echo/sha256.txt
          if-no-files-found: error
          retention-days: 14

  sdks:
    name: Cross-language SDK surfaces
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Validate SDK surfaces
        env:
          EXPECTED_TYPESCRIPT_VERSION: 5.8.3
        run: |
          tools/validate_sdks.sh
          test "$(node sdk/typescript-client/node_modules/typescript/bin/tsc --version)" = \
            "Version ${EXPECTED_TYPESCRIPT_VERSION}"

  result:
    name: CI result
    if: always()
    needs: [profile, docs, rust, oci-registry, catalog, msrv, contracts, sdks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected validation job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['CI_JOB_RESULTS'])
          profile = results['profile']['outputs'].get('profile')
          full = {'rust', 'oci-registry', 'catalog', 'msrv', 'contracts', 'sdks'}
          required = {'profile', 'docs'} | (full if profile == 'full' else set())
          failures = [name for name in required if results[name]['result'] != 'success']
          if profile not in {'docs', 'full'}:
              failures.append('unknown CI profile')
          if profile == 'docs':
              failures.extend(name for name in full if results[name]['result'] != 'skipped')
          print('Selected profile:', profile)
          print('Job results:', {name: value['result'] for name, value in results.items()})
          if failures:
              print('CI did not satisfy its selected profile:', ', '.join(failures), file=sys.stderr)
              sys.exit(1)
          PY
