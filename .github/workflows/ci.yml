  sdks:
    name: Cross-language SDK surfaces
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: sdk/go/go.sum
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Exact Temurin runtime 25.0.4.1+1; Adoptium SemVer patch/build encoding.
          java-version: "25.0.4+101.0.LTS"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.425
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Install the checksum-pinned Java-compatible Gradle
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("tools/toolchain.toml", "rb"))["sdk"]["gradle"])')"
          checksum="$(python3 -c 'import tomllib; print(tomllib.load(open("tools/toolchain.toml", "rb"))["sdk"]["gradle_sha256"])')"
          destination="${RUNNER_TEMP}/lsf-gradle"
          mkdir -p "$destination"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 \
            "https://services.gradle.org/distributions/gradle-${version}-bin.zip" -o "$destination/gradle.zip"
          printf '%s  %s\n' "$checksum" "$destination/gradle.zip" | sha256sum --check --strict
          unzip -q "$destination/gradle.zip" -d "$destination"
          echo "$destination/gradle-${version}/bin" >> "$GITHUB_PATH"
      - name: Qualify the Java 25 Gradle build
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-sdk"
          git rev-parse HEAD | tee "$RUNNER_TEMP/java-sdk/gradle.log"
          uname -srm | tee -a "$RUNNER_TEMP/java-sdk/gradle.log"
          python3 sdk/java-client/tools/java_toolchain.py check | tee -a "$RUNNER_TEMP/java-sdk/gradle.log"
          gradle --version | tee -a "$RUNNER_TEMP/java-sdk/gradle.log"
          python3 -m unittest tools.tests.test_check_tool_versions tools.tests.test_java_toolchain 2>&1 | tee -a "$RUNNER_TEMP/java-sdk/gradle.log"
          timeout 540 gradle --no-daemon --console=plain -p sdk/java-client clean check 2>&1 | tee -a "$RUNNER_TEMP/java-sdk/gradle.log"
          echo 'Gradle qualification passed' | tee -a "$RUNNER_TEMP/java-sdk/gradle.log"
      - name: Validate SDK surfaces
        shell: bash
        env:
          EXPECTED_TYPESCRIPT_VERSION: 7.0.2
        run: |
          set -euo pipefail
          tools/validate_sdks.sh 2>&1 | tee "$RUNNER_TEMP/java-sdk/sdk.log"
          sha256sum sdk/java-client/build/latent-java-client.jar | tee "$RUNNER_TEMP/java-sdk/jar.sha256"
          python3 sdk/java-client/tools/java_toolchain.py classes sdk/java-client/build/latent-java-client.jar > "$RUNNER_TEMP/java-sdk/jar-classfile.json"
          test "$(node sdk/typescript-client/node_modules/typescript/bin/tsc --version)" = \
            "Version ${EXPECTED_TYPESCRIPT_VERSION}"
      - name: Retain Java SDK qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-sdk-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/java-sdk/
          if-no-files-found: warn
          retention-days: 14

  result:
    name: CI result
    if: always()
    needs: [profile, docs, website, fast, rust, oci-registry, catalog, msrv, contracts, sdks]

    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected validation job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci_result.py

  website:
    name: Documentation website
    needs: profile
    uses: $/.github/workflows/docs-site.yml
