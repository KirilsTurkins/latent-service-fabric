name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.97.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Check generated guest bindings
        run: cargo check -p latent-toolchain-smoke --target wasm32-wasip2 --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

  msrv:
    name: Rust MSRV 1.94.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Check workspace at MSRV
        run: cargo +1.94.1 check --workspace --all-targets --all-features --locked

  contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install Python validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Validate contracts and generated bindings
        run: tools/validate_contracts.sh

  sdks:
    name: Cross-language SDK surfaces
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: sdk/typescript-client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Validate SDK surfaces
        env:
          EXPECTED_TYPESCRIPT_VERSION: 5.8.3
        run: |
          tools/validate_sdks.sh
          test "$(node sdk/typescript-client/node_modules/typescript/bin/tsc --version)" = \
            "Version ${EXPECTED_TYPESCRIPT_VERSION}"
