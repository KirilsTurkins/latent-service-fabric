name: Wiki source validation
on:
  push:
    branches: [docs/wiki, 'chore/wiki-*']
  pull_request:
    branches: [docs/wiki]
permissions:
  contents: read
jobs:
  wiki:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate immutable workflow action references
        run: |
          python -m pip install --requirement wiki/visuals/workflow-requirements.txt
          python tools/validate_workflow_actions.py
          python -m unittest tools.tests.test_validate_workflow_actions
      - name: Validate all Wiki pages and assets
        run: python wiki/visuals/validate_wiki.py --authority-ref origin/development
