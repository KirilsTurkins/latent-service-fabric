name: Wiki source validation
on:
  push:
    branches: [docs/wiki, 'chore/wiki-*']
  pull_request:
    branches: [docs/wiki]
permissions:
  contents: read
jobs:
  wiki:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate all Wiki pages and assets
        run: python wiki/visuals/validate_wiki.py --authority-ref origin/development
