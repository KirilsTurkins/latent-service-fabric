name: CI

on:
  pull_request:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      cargo_dependency_cache:
        description: "Dependency-cache experiment (baseline remains the default)"
        type: choice
        options: [baseline, recipe]
        default: baseline
      run_catalog_scale:
        description: "Run the heavyweight 100,000-release catalog acceptance probe"
        type: boolean
        default: false
      run_phase3_resources:
        description: "Run the declared bounded provider and actual Angular resource matrix"
        type: boolean
        default: false
      ci_lane_workers:
        description: "Run co-located provider/renderer integrations with one or two bounded workers"
        type: choice
        options:
          - "1"
          - "2"
        default: "2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    name: Select CI profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      reason: ${{ steps.select.outputs.reason }}
      changed_files: ${{ steps.select.outputs.changed_files }}
      renderer: ${{ steps.select.outputs.renderer }}
      fast_packages: ${{ steps.select.outputs.fast_packages }}
      expected_jobs: ${{ steps.select.outputs.expected_jobs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete change
        id: select
        run: python3 tools/ci_profile.py

  docs:
    name: Documentation and SVGs
    needs: profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install documentation validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Validate documentation and profile selection
        run: |
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_validate_docs tools.tests.test_ci_suite_inventory tools.tests.test_ci_suite_discovery tools.tests.test_ci_result tools.tests.test_ci_coverage tools.tests.test_ci_browser_artifacts tools.tests.test_ci_lanes tools.tests.test_ci_lane_inventory tools.tests.test_local_tests tools.tests.test_ci_cargo tools.tests.test_ci_cargo_cache tools.tests.test_ci_cargo_aot_handoff
          python3 tools/ci_coverage.py
          LSF_REQUIRE_NATIVE_PROCESS_TESTS=1 python3 -m unittest tools.tests.test_owned_test_process tools.tests.test_owned_runners tools.tests.test_ci_rust_artifacts tools.tests.test_oci_registry_runner
          python3 tools/validate_docs.py
      - name: Preserve repository source contracts in the host-only profile
        if: needs.profile.outputs.profile == 'fast'
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_foundation.py

      - name: Validate deterministic dependency regressions
        run: python3 -m unittest tools.tests.test_deterministic_tests tools.tests.test_testkit_dependencies

  fast:
    name: Fast host correctness
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    needs: profile
    if: needs.profile.outputs.fast_packages != '' && needs.profile.outputs.fast_packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Run the selected dependency-bounded correctness suites
        env:
          CI_FAST_PACKAGES: ${{ needs.profile.outputs.fast_packages }}
        run: python3 tools/ci_fast.py --packages-json "$CI_FAST_PACKAGES" --output "$RUNNER_TEMP/ci-fast/affected"
      - name: Qualify the genuinely narrow reverse-dependent fixture
        if: needs.profile.outputs.profile == 'full'
        run: |
          packages="$(python3 - <<'PYCODE'
          from tools.ci_profile import classify_paths
          selection = classify_paths(['crates/latent-state/src/lib.rs'])
          assert selection.profile == 'fast'
          print(selection.outputs()['fast_packages'])
          PYCODE
          )"
          python3 tools/ci_fast.py --packages-json "$packages" --output "$RUNNER_TEMP/ci-fast/narrow"
      - name: Retain exact host dependency, discovery and timing receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-host-correctness-${{ github.sha }}
          path: ${{ runner.temp }}/ci-fast/
          if-no-files-found: error
          retention-days: 7


  rust:
    name: Rust 1.97.1
    needs: profile
    if: needs.profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Identify the opt-in dependency-cache recipe
        if: github.event_name == 'workflow_dispatch' && inputs.cargo_dependency_cache == 'recipe'
        id: cargo-cache-identity
        env:
          # Match rust-cache's non-incremental CI default before observing inputs.
          CARGO_INCREMENTAL: "0"
        run: python3 tools/ci_cargo_cache.py --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/lsf-cargo-cache-identity.json"
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ inputs.cargo_dependency_cache == 'recipe' && steps.cargo-cache-identity.outputs.prefix || 'lsf-ci-dependencies-v1' }}
          shared-key: ${{ inputs.cargo_dependency_cache == 'recipe' && 'host-correctness' || '' }}
          key: ${{ inputs.cargo_dependency_cache == 'recipe' && 'ubuntu-24.04-recipe' || format('ubuntu-24.04-{0}', hashFiles('.github/workflows/ci.yml', 'Cargo.toml', '.cargo/config.toml')) }}
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          cache-directories: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
                (github.event_name == 'workflow_dispatch' &&
                 (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release')) }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install pinned validation dependencies
        run: python3 -m pip install --requirement tools/requirements.lock
      - name: Install the real Fish completion test shell
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes fish
      - name: Check selected renderer prerequisites before building
        id: renderer_preflight
        if: needs.profile.outputs.renderer == 'true'
        run: python3 tools/run_angular_renderer_tests.py --preflight --diagnostic-root "$RUNNER_TEMP/owned-renderer"
      - name: Check formatting
        run: python3 tools/ci_cargo.py run format
      - name: Check deterministic helper dependency boundaries
        timeout-minutes: 5
        run: |
          python3 tools/check_testkit_dependencies.py
          python3 tools/ci_cargo.py run deterministic
      - name: Check workspace
        run: python3 tools/ci_cargo.py run workspace-check
      - name: Check generated RPC and Component Model bindings
        run: python3 tools/ci_cargo.py run bindings
      - name: Check independently selected production packages
        run: python3 tools/ci_cargo.py run production
      - name: Run Clippy
        id: clippy
        env:
          CARGO_TERM_COLOR: never
        run: |
          status=0
          python3 tools/ci_cargo.py run clippy > "$RUNNER_TEMP/lsf-clippy.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/lsf-clippy.log"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          lines = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "lsf-clippy.log").read_text().splitlines()
          errors = [" ".join(lines[i:i + 4]) for i, line in enumerate(lines) if re.match(r"^error(?:\[.*?\])?:", line)]
          diagnostic = " | ".join(errors)[:1000] or "no compiler errors"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"diagnostic={diagnostic}\n")
          PY
          exit "$status"
      - name: "Clippy diagnostics: ${{ steps.clippy.outputs.diagnostic }}"
        if: failure() && steps.clippy.outcome == 'failure'
        run: tail -n 120 "$RUNNER_TEMP/lsf-clippy.log"
      - name: Build workspace binaries and test harnesses
        run: python3 tools/ci_cargo.py run prepare --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl"
      - name: Verify complete registered workspace test discovery
        run: python3 tools/ci_suite_discovery.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --receipt "$RUNNER_TEMP/ci-discovery.json"
      - name: Prepare authenticated AOT test inputs
        run: |
          python3 -m unittest tools.tests.test_aot_test_inputs tools.tests.test_run_aot_tests
          python3 tools/aot_test_inputs.py prepare --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --output "$RUNNER_TEMP/lsf-aot-test-inputs"
          # Cargo supplies each harness's runtime environment itself. Export only
          # this recipe's input selectors, not CARGO_MANIFEST_DIR/library paths.
          python3 tools/aot_test_inputs.py environment --manifest "$RUNNER_TEMP/lsf-aot-test-inputs/manifest.json" | grep '^LSF_AOT_' >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -o pipefail
          python3 tools/ci_cargo.py run workspace-tests 2>&1 | tee "$RUNNER_TEMP/ci-workspace-tests.log"
          python3 tools/ci_suite_discovery.py --execution-log "$RUNNER_TEMP/ci-workspace-tests.log"
          python3 tools/ci_cargo.py run doctests 2>&1 | tee "$RUNNER_TEMP/ci-doctests.log"
          python3 tools/ci_suite_discovery.py --recipe explicit-doctests --execution-log "$RUNNER_TEMP/ci-doctests.log"
          python3 tools/ci_cargo.py run signing-compatibility 2>&1 | tee "$RUNNER_TEMP/ci-signing-compatibility.log"
          python3 tools/ci_suite_discovery.py --recipe signing-compatibility --execution-log "$RUNNER_TEMP/ci-signing-compatibility.log"

      - name: Check metadata working-set suite selection and observation validation
        run: python3 -m unittest tools.tests.test_metadata_working_set
      - name: Qualify catalog metadata compilation working set
        id: metadata-working-set
        timeout-minutes: 16
        # Required on every full profile. The exact inventory-owned selection is
        # checked/prepared through the same local/CI entry point before execution.
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test.py check --suite selection.metadata-working-set --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --context ci
          python3 tools/test.py prepare --suite selection.metadata-working-set --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --context ci
          python3 tools/test.py run --suite selection.metadata-working-set --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --context ci 2>&1 | tee "$RUNNER_TEMP/metadata-working-set.log"
      - name: Retain metadata working-set inputs and publication/apply/reopen costs
        if: always() && steps.metadata-working-set.outcome != '' && steps.metadata-working-set.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metadata-working-set-observations
          path: ${{ runner.temp }}/metadata-working-set.log
          if-no-files-found: error

      - name: Qualify the deterministic Phase 3 security matrix
        timeout-minutes: 12
        run: |
          python3 -m unittest tools.tests.test_phase3_security
          mkdir -p target/phase3-security
          python3 tools/phase3_security.py --profile pr --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --source-commit "$GITHUB_SHA" --output target/phase3-security/pr-receipt.json
      - name: Retain the bounded Phase 3 security receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-security-pr-${{ github.sha }}
          path: target/phase3-security/pr-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Set up the qualified Angular build runtime
        if: needs.profile.outputs.renderer == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: examples/renderer-profile/package-lock.json
      - name: Validate small Phase 3 resource regressions
        timeout-minutes: 2
        run: python3 -m unittest tools.tests.test_phase3_resource tools.tests.test_phase3_resource_web
      - name: Set up the pinned component composer
        if: needs.profile.outputs.renderer == 'true'
        uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Prepare immutable browser lane component
        if: needs.profile.outputs.renderer == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/browser-component"
          cargo build --locked -p latent-toolchain-smoke --example web-contract --target wasm32-unknown-unknown --release
          wasm-tools component new target/wasm32-unknown-unknown/release/examples/web_contract.wasm -o "$RUNNER_TEMP/browser-component/application.wasm"
          wasm-tools validate "$RUNNER_TEMP/browser-component/application.wasm"
      - name: Run bounded renderer and provider integration lanes
        id: integration_lanes
        timeout-minutes: 70
        env:
          CI_LANE_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_lane_workers || '2' }}
          CI_LANE_RENDERER: ${{ needs.profile.outputs.renderer }}
        run: |
          # Reviewed delegated owners: tools/ci_lane_worker.py tools/run_s3_blob_tests.py tools/run_vault_secret_tests.py tools/run_nats_event_tests.py
          # tools/run_capability_policy_workflow.py tools/build_angular_renderer.py tools/run_angular_renderer_tests.py tools/check_owned_diagnostics.py
          # tools/build_angular_package.py tools/run_angular_build_tests.py
          python3 tools/run_ci_lanes.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --renderer "$CI_LANE_RENDERER" --workers "$CI_LANE_WORKERS" --output "$RUNNER_TEMP/ci-lanes"
      - name: Retain bounded CI lane timing and completion receipts
        if: always() && steps.integration_lanes.outcome != '' && steps.integration_lanes.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-integration-lanes-${{ github.sha }}
          path: ${{ runner.temp }}/ci-lanes/
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded browser boundary observations
        if: >-
          always() && needs.profile.outputs.renderer == 'true' &&
          steps.integration_lanes.outcome != '' && steps.integration_lanes.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-boundary-observations
          path: |
            ${{ runner.temp }}/browser-boundary/build-receipt.json
            ${{ runner.temp }}/browser-boundary/browser-receipt.json
            ${{ runner.temp }}/browser-boundary/browser-application-receipt.json
          if-no-files-found: error

      - name: Fetch the pinned operator workflow registry
        run: docker pull ghcr.io/project-zot/zot-minimal-linux-amd64@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
      - name: Qualify signed static sites through OCI and actual browsers
        if: needs.profile.outputs.renderer == 'true'
        timeout-minutes: 12
        shell: bash
        run: |
          # Reviewed capture owner: tools/static_site.py
          static_root="${RUNNER_TEMP}/static-site"
          mkdir -p "$static_root" "${RUNNER_TEMP}/phase2-gate"
          objcopy --strip-debug "${PWD}/target/debug/latentd" "${static_root}/latentd"
          python3 tools/build_static_sites.py --cli "$RUNNER_TEMP/lsf-angular-package-assembler" --toolchain examples/renderer-profile --output "${static_root}/builds"
          LSF_STATIC_BUILDS="${static_root}/builds" LSF_STATIC_FIXTURE_ROOT="${static_root}/fixture" python3 tools/ci_rust_artifacts.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --suite static-site-fixture
          python3 tools/run_static_site_workflow.py --cli "$RUNNER_TEMP/lsf-angular-package-assembler" --node "${static_root}/latentd" --fixture "${static_root}/fixture" --toolchain examples/renderer-profile --chrome "$(command -v google-chrome)" > "${RUNNER_TEMP}/phase2-gate/static-site-receipt.json"
      - name: Validate bounded Phase 2 delivery and resource workflows
        timeout-minutes: 10
        shell: bash
        run: |
          python3 -m unittest tools.tests.test_ci_rust_artifacts tools.tests.test_phase2_resource_binaries
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/lsf-operator-fixture.XXXXXXXX")"
          mkdir -p "${RUNNER_TEMP}/phase2-gate"
          trap 'rm -rf -- "$fixture_root"' EXIT
          LSF_OPERATOR_FIXTURE_ROOT="${fixture_root}/inputs" python3 tools/ci_rust_artifacts.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --suite operator-fixture
          python3 -m unittest tools.tests.test_phase2_operator_workflow tools.tests.test_phase2_operator_canary tools.tests.test_phase2_offline_workflow
          python3 tools/run_phase2_operator_workflow.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --fixture-root "${fixture_root}/inputs" --source-commit "${GITHUB_SHA}" > "${RUNNER_TEMP}/phase2-gate/operator-receipt.json"
          # The executable is authenticated and hashed again in the child. Keep
          # debug sections out of this bounded runtime fixture without rebuilding
          # the workspace or modifying Cargo's cached executable.
          objcopy --strip-debug "${PWD}/target/debug/latent-aot-compiler" "${fixture_root}/latent-aot-compiler"
          stat --format='AOT compiler fixture: %s bytes' "${fixture_root}/latent-aot-compiler"
          LSF_OPERATOR_FIXTURE_ROOT="${fixture_root}/inputs" LSF_AOT_COMPILER="${fixture_root}/latent-aot-compiler" python3 tools/ci_rust_artifacts.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --suite trust-currentness
          python3 tools/run_security_profile_workflow.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --compiler "${fixture_root}/latent-aot-compiler" --fixture-root "${fixture_root}/inputs" > "${RUNNER_TEMP}/phase2-gate/security-profile-receipt.json"
          python3 tools/run_phase2_offline_workflow.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --fixture-root "${fixture_root}/inputs" --source-commit "${GITHUB_SHA}" > "${RUNNER_TEMP}/phase2-gate/offline-receipt.json"
          LSF_OPERATOR_FIXTURE_ROOT="${fixture_root}/publication-inputs" python3 tools/ci_rust_artifacts.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --suite publication-fixture
          python3 tools/run_publication_workflow.py --cli "${PWD}/target/debug/latent" --node "${PWD}/target/debug/latentd" --fixture-root "${fixture_root}/publication-inputs" --source-commit "${GITHUB_SHA}" > "${RUNNER_TEMP}/phase2-gate/publication-receipt.json"
          # Keep the frozen 512 MiB executable-hash limit without modifying
          # Cargo's debug artifacts or their hard-linked copies. Hash and run
          # these same runtime-only copies, never the unstripped originals.
          resource_bin="${fixture_root}/resource-bin"
          mkdir "${resource_bin}"
          for binary in latent latentd; do
            objcopy --strip-debug "${PWD}/target/debug/${binary}" "${resource_bin}/${binary}"
            stat --format="Resource ${binary} fixture: %s bytes" "${resource_bin}/${binary}"
          done
          LSF_PHASE2_RESOURCE_FIXTURE_ROOT="${fixture_root}/resource-inputs" python3 tools/ci_rust_artifacts.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --suite resource-fixture
          python3 -m unittest tools.tests.test_phase2_gate_resource tools.tests.test_phase2_resource_clock
          LSF_GATE_FIXTURE_ROOT="${fixture_root}" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          binaries = pathlib.Path(os.environ["LSF_GATE_FIXTURE_ROOT"]) / "resource-bin"
          def digest(path):
              with path.open("rb") as source:
                  return "sha256:" + hashlib.file_digest(source, "sha256").hexdigest()
          identity = {
              "schemaVersion": "latent.phase2.resource-build.v1",
              "sourceRevision": os.environ["GITHUB_SHA"],
              "cargoLockSha256": digest(root / "Cargo.lock"),
              "cliSha256": digest(binaries / "latent"),
              "nodeSha256": digest(binaries / "latentd"),
              "rustcVersion": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "buildProfile": "debug",
          }
          (pathlib.Path(os.environ["LSF_GATE_FIXTURE_ROOT"]) / "build.json").write_text(json.dumps(identity))
          PY
          python3 tools/phase2_gate_resource.py --cli "${resource_bin}/latent" --node "${resource_bin}/latentd" --fixture-root "${fixture_root}/resource-inputs" --build-identity "${fixture_root}/build.json" --output "${RUNNER_TEMP}/phase2-gate/resource-receipt.json"
          python3 tools/phase2_gate_resource.py --validate "${RUNNER_TEMP}/phase2-gate/resource-receipt.json"
      - name: Build the optimized isolated Angular compiler
        if: needs.profile.outputs.renderer == 'true'
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_TARGET_DIR: ${{ runner.temp }}/angular-t1-compiler
        run: cargo build -p latent-wasmtime --bin latent-aot-compiler --release --locked
      - name: Export actual signed Angular T1 fixtures
        if: needs.profile.outputs.renderer == 'true'
        timeout-minutes: 5
        env:
          LSF_ANGULAR_BUILD_DIR: ${{ runner.temp }}/angular-build/actual
          LSF_ANGULAR_T1_FIXTURE_ROOT: ${{ runner.temp }}/angular-t1-fixture
        run: python3 tools/ci_rust_artifacts.py --inventory "$RUNNER_TEMP/lsf-workspace-tests.jsonl" --suite angular-t1-fixture
      - name: Qualify actual Angular on the protected T1 node
        if: needs.profile.outputs.renderer == 'true'
        timeout-minutes: 22
        run: |
          python3 -m unittest tools.tests.test_angular_t1_workflow
          mkdir "$RUNNER_TEMP/angular-t1-bin"
          for binary in latent latentd; do
            objcopy --strip-debug "$PWD/target/debug/$binary" "$RUNNER_TEMP/angular-t1-bin/$binary"
          done
          objcopy --strip-debug "$RUNNER_TEMP/angular-t1-compiler/release/latent-aot-compiler" "$RUNNER_TEMP/angular-t1-bin/latent-aot-compiler"
          python3 tools/run_angular_t1_workflow.py --cli "$RUNNER_TEMP/angular-t1-bin/latent" --node "$RUNNER_TEMP/angular-t1-bin/latentd" --compiler "$RUNNER_TEMP/angular-t1-bin/latent-aot-compiler" --fixture-root "$RUNNER_TEMP/angular-t1-fixture" > "$RUNNER_TEMP/phase2-gate/angular-t1-receipt.json"
      - name: Retain compact Phase 2 gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-2-gate-${{ github.sha }}
          path: ${{ runner.temp }}/phase2-gate/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Set up the bounded resource guest compiler
        if: github.event_name == 'workflow_dispatch' && inputs.run_phase3_resources
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Build fresh resource guest inputs
        if: github.event_name == 'workflow_dispatch' && inputs.run_phase3_resources
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/phase3-resource
          CARGO_BUILD_JOBS: 3
        run: |
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/resource-guest-tools"
          PATH="$RUNNER_TEMP/resource-guest-tools:$PATH" python3 tools/build_guest_capsules.py --output "$PWD/target/phase3-resource-guests"
      - name: Execute the bounded Phase 3 resource matrix
        if: github.event_name == 'workflow_dispatch' && inputs.run_phase3_resources
        timeout-minutes: 70
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/phase3-resource
          CARGO_BUILD_JOBS: 3
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          python3 tools/phase3_resource_campaign.py --matrix
          python3 tools/run_phase3_resource_acceptance.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/phase3-resource-matrix" --guest-capsules "$PWD/target/phase3-resource-guests" --angular-build "$RUNNER_TEMP/angular-build/actual" --compiler "$RUNNER_TEMP/angular-t1-bin/latent-aot-compiler" --host-condition shared-github-runner
      - name: Retain immutable Phase 3 resource attempts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_phase3_resources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-resource-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase3-resource-matrix/*.json
            ${{ runner.temp }}/phase3-resource-matrix/*.sha256
