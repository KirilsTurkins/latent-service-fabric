      - name: Retain the opt-in dependency-cache identity
        if: always() && steps.cargo-cache-identity.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-dependency-cache-identity-${{ github.sha }}
          path: ${{ runner.temp }}/lsf-cargo-cache-identity.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact workspace test discovery and custom-harness execution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-runtime-discovery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-discovery.json
            ${{ runner.temp }}/ci-workspace-tests.log
            ${{ runner.temp }}/ci-doctests.log
            ${{ runner.temp }}/ci-signing-compatibility.log
          if-no-files-found: warn
          retention-days: 7

      - name: Retain attempted renderer ownership diagnostics
        if: always() && steps.renderer_preflight.outcome != '' && steps.renderer_preflight.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-renderer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owned-renderer/*.json
            ${{ runner.temp }}/owned-renderer-fault/*.json
          if-no-files-found: warn
