name: PR 2151 pool observation validation
on:
  push:
    branches: [diag/pr2151-native-pressure-20261121]
    paths: [.github/workflows/pr2151-pool-observation-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: fb0feebc63b302c63c0e37791da735ca476607c8
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          key: ubuntu-24.04
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
      - name: Apply the exact test-only observer repair
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          p=pathlib.Path('crates/latent-streams/src/tests/lifecycle.rs')
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == 'fb0feebc63b302c63c0e37791da735ca476607c8'
          assert blob(p.read_bytes()) == '665bd6698518f06bf3993e5b9b0a2f8ab9d28729'
          text=p.read_text()
          helper='''// Only the test observer waits for the pool's try-lock. Stream operations,
          // drop ownership and the original charge assertions are never retried.
          async fn observe_pool_snapshot<T>(
              mut snapshot: impl FnMut() -> Result<T, latent_core::PlatformError>,
              deadline: Instant,
          ) -> Result<T, latent_core::PlatformError> {
              loop {
                  match snapshot() {
                      Err(error)
                          if error.code == latent_core::PlatformErrorCode::ResourceExhausted
                              && error.message == "capability-busy"
                              && Instant::now() < deadline =>
                      {
                          tokio::task::yield_now().await;
                      }
                      result => return result,
                  }
              }
          }

          #[tokio::test]
          async fn pool_observation_retries_only_contention_within_its_original_deadline() {
              use latent_core::{PlatformError, PlatformErrorCode};
              let busy = PlatformError {
                  code: PlatformErrorCode::ResourceExhausted,
                  message: "capability-busy".into(),
                  retryable: false,
                  details: vec![],
              };
              let mut calls = 0;
              let observed = observe_pool_snapshot(
                  || {
                      calls += 1;
                      if calls < 3 {
                          Err(busy.clone())
                      } else {
                          Ok(42)
                      }
                  },
                  Instant::now() + Duration::from_secs(2),
              )
              .await;
              assert_eq!(observed, Ok(42));
              assert_eq!(calls, 3);

              for (error, deadline) in [
                  (busy.clone(), Instant::now()),
                  (
                      PlatformError {
                          message: "capability-capacity".into(),
                          ..busy.clone()
                      },
                      Instant::now() + Duration::from_secs(2),
                  ),
                  (
                      PlatformError {
                          code: PlatformErrorCode::Internal,
                          ..busy.clone()
                      },
                      Instant::now() + Duration::from_secs(2),
                  ),
              ] {
                  let mut calls = 0;
                  let observed = observe_pool_snapshot(
                      || {
                          calls += 1;
                          Err::<(), _>(error.clone())
                      },
                      deadline,
                  )
                  .await;
                  assert_eq!(observed, Err(error));
                  assert_eq!(calls, 1);
              }
          }

          '''
          anchor='#[derive(Clone, Copy, PartialEq, Eq)]\nenum DrainLockCase'
          assert text.count(anchor)==1
          text=text.replace(anchor,helper+anchor,1)
          start=text.index('async fn last_output_copy_keeps_original_connection_charge_during_retirement()')
          end=text.index('\n#[cfg(unix)]',start)
          body=text[start:end]
          for var in ['metadata_during_tail','metadata_after']:
              old=f'    let {var} = pools.snapshot().unwrap().metadata_bytes;'
              new=f'''    let {var} = observe_pool_snapshot(
                  || pools.snapshot(),
                  Instant::now() + Duration::from_secs(2),
              )
              .await
              .unwrap()
              .metadata_bytes;'''
              assert body.count(old)==1
              body=body.replace(old,new,1)
          text=text[:start]+body+text[end:]
          old='''        let deadline = Instant::now() + Duration::from_secs(2);
                  let snapshot = loop {
                      match pools.snapshot() {
                          Ok(snapshot) => break snapshot,
                          Err(error)
                              if error.code == latent_core::PlatformErrorCode::ResourceExhausted
                                  && error.message == "capability-busy"
                                  && Instant::now() < deadline =>
                          {
                              tokio::task::yield_now().await;
                          }
                          Err(error) => panic!("pool snapshot failed: {error:?}"),
                      }
                  };'''
          new='''        let snapshot = observe_pool_snapshot(
                      || pools.snapshot(),
                      Instant::now() + Duration::from_secs(2),
                  )
                  .await
                  .unwrap();'''
          assert text.count(old)==1
          text=text.replace(old,new,1)
          p.write_text(text)
          assert blob(p.read_bytes()) == '9361d75f2a91ea73947f0a519b4d57ddc6a7a673'
          subprocess.run(['git','diff','--check'],check=True)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() == [str(p)]
          PY
      - name: Require repository formatting and run every original provider unit test
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/latent-streams/src/tests/lifecycle.rs
          cargo test --locked --all-features -p latent-streams --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/pool-observer-tests.log"
          for attempt in 1 2 3 4 5; do
            cargo test --locked --all-features -p latent-streams --lib tests::lifecycle::last_output_copy_keeps_original_connection_charge_during_retirement -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/pool-observer-repeated.log"
          done
          git diff --check
          cp crates/latent-streams/src/tests/lifecycle.rs "$RUNNER_TEMP/pool-observer-lifecycle.rs"
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pool-observer-postimage
          path: ${{ runner.temp }}/pool-observer-lifecycle.rs
          if-no-files-found: error
          retention-days: 3
      - if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pool-observer-logs
          path: ${{ runner.temp }}/pool-observer-*.log
          if-no-files-found: warn
          retention-days: 3
  blob:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: pool-observer-postimage
          path: postimage
          digest-mismatch: error
      - name: Publish the validated test blob without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          p=pathlib.Path('postimage/pool-observer-lifecycle.rs')
          assert p.is_file() and not p.is_symlink()
          raw=p.read_bytes()
          assert len(raw)==77916
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='9361d75f2a91ea73947f0a519b4d57ddc6a7a673'
          request=urllib.request.Request('https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/blobs', data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=30) as response:
              result=json.load(response)
          assert result['sha']==sha
          result={'source':'fb0feebc63b302c63c0e37791da735ca476607c8','path':'crates/latent-streams/src/tests/lifecycle.rs','sha':sha,'refsMoved':False}
          pathlib.Path('pool-observer-blob.json').write_text(json.dumps(result)+'\n')
          print(json.dumps(result))
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pool-observer-published-blob
          path: pool-observer-blob.json
          if-no-files-found: error
          retention-days: 3
