name: C Rust and Java resource tenant reference

on:
  workflow_dispatch:
    inputs:
      rust-only:
        description: Retry only the registered Rust component without repeating successful siblings
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-tenants-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tenants:
    name: Retained ${{ matrix.language }} resources across two tenants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.rust-only && '["rust"]' || '["c","java","rust"]') }}
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install controller requirements and check closed producer scope
        run: |
          python3 -m pip install -r tools/requirements.lock
          python3 -B -m unittest tools.tests.test_resource_tenant_isolation tools.tests.test_resource_tenant_fresh_c -v
      - name: Authenticate fixed normal native products before executable restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12255531553 > "$RUNNER_TEMP/resource-native-producer.json"
          python3 -B tools/qualify_resource_tenants.py --verify-native-producer "$RUNNER_TEMP/resource-native-producer.json"
      - name: Restore the fixed historical a4 normal native products
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: sdk-native-products-a4f05f3f243889cc7ba7a0404bdc76afec32d3c2
          run-id: 39400186766
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-native
      - name: Authenticate original Java39 public component producer
        if: matrix.language == 'java'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12247220241 > "$RUNNER_TEMP/resource-original-producer.json"
          python3 -B tools/qualify_resource_tenants.py --language java --verify-original-producer "$RUNNER_TEMP/resource-original-producer.json"
      - name: Restore original Java39 public component and unchanged compile records
        if: matrix.language == 'java'
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: java-resource-replay-7b5119c5448405b20771e8a020b5e823cc72a0d6
          run-id: 39383037165
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-original
      - name: Authenticate original Rust33 public component producer
        if: matrix.language == 'rust'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KirilsTurkins/latent-service-fabric/actions/artifacts/12257859357 > "$RUNNER_TEMP/resource-original-producer.json"
          python3 -B tools/qualify_resource_tenants.py --language rust --verify-original-producer "$RUNNER_TEMP/resource-original-producer.json"
      - name: Restore original Rust33 public component and unchanged compile records
        if: matrix.language == 'rust'
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: embedded-resource-rust-706880aff3e70b46be97bb2119c8c32dda30e74b
          run-id: 39407973986
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/resource-original
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        if: matrix.language == 'c'
        with:
          version: 0.16.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        if: matrix.language == 'c'
        with:
          version: 1.254.0
      - name: Install only the pinned C guest binding tool and compiler containment
        if: matrix.language == 'c'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/resource-tools"
          echo "$RUNNER_TEMP/resource-tools" >> "$GITHUB_PATH"
      - name: Repackage retained Java39 then require both tenant lifecycles
        if: matrix.language == 'java'
        env:
          RESOURCE_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 -B tools/qualify_resource_tenants.py --language "$RESOURCE_LANGUAGE" \
            --original "$RUNNER_TEMP/resource-original" --original-producer "$RUNNER_TEMP/resource-original-producer.json" \
            --native "$RUNNER_TEMP/resource-native" --native-producer "$RUNNER_TEMP/resource-native-producer.json" \
            --output "$RUNNER_TEMP/resource-tenants"
      - name: Repackage retained Rust33 then require both tenant lifecycles
        if: matrix.language == 'rust'
        env:
          RESOURCE_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 -B tools/qualify_resource_tenants.py --language "$RESOURCE_LANGUAGE" \
            --original "$RUNNER_TEMP/resource-original" --original-producer "$RUNNER_TEMP/resource-original-producer.json" \
            --native "$RUNNER_TEMP/resource-native" --native-producer "$RUNNER_TEMP/resource-native-producer.json" \
            --output "$RUNNER_TEMP/resource-tenants"
      - name: One fresh normal captured C23 greeting then require both tenant lifecycles
        if: matrix.language == 'c'
        run: |
          python3 -B tools/resource_tenant_fresh_c.py --native "$RUNNER_TEMP/resource-native" \
            --native-producer "$RUNNER_TEMP/resource-native-producer.json" --output "$RUNNER_TEMP/resource-C"
      - name: Retain bounded public results and explicit original compile ancestry
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: resource-tenants-extension-${{ matrix.language }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/resource-native-producer.json
            ${{ runner.temp }}/resource-original-producer.json
            ${{ runner.temp }}/resource-tenants-original/resource-original-acquisition.json
            ${{ runner.temp }}/resource-tenants/qualified.json
            ${{ runner.temp }}/resource-tenants/FAILED.json
            ${{ runner.temp }}/resource-tenants/logs/**
            ${{ runner.temp }}/resource-tenants/examples-controls/*.json
            ${{ runner.temp }}/resource-tenants/foreign-controls/*.json
            ${{ runner.temp }}/resource-tenants/signed/my-greeting/build-observation.json
            ${{ runner.temp }}/resource-C/qualified.json
            ${{ runner.temp }}/resource-C/fresh-C/fresh-build.json
            ${{ runner.temp }}/resource-C/fresh-C/build/*.json
            ${{ runner.temp }}/resource-C/fresh-C/build/component.wasm
            ${{ runner.temp }}/resource-C/fresh-C/build/wit/**/*.wit
            ${{ runner.temp }}/resource-C/fresh-C/build/resources/**
            ${{ runner.temp }}/resource-C/fresh-C/build/logs/**
            ${{ runner.temp }}/resource-C/coupled/*.json
            ${{ runner.temp }}/resource-C/coupled/logs/**
            ${{ runner.temp }}/resource-C/coupled/examples-controls/*.json
            ${{ runner.temp }}/resource-C/coupled/foreign-controls/*.json
            ${{ runner.temp }}/resource-C/coupled/signed/my-greeting/build-observation.json
