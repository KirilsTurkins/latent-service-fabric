name: PR 605 inventory correction validation

on:
  push:
    branches: [fix/pr605-ci-inventory-validation]
    paths: [.github/workflows/pr605-ci-inventory-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact PR 605 inventory correction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 19e4d25847395f501c79f2246f39cb1eebd6840e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - name: Install the existing pinned validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - name: Reproduce the inventory failure and register only the reviewed cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path
          import subprocess
          from tools import ci_coverage, ci_suite_inventory
          expected_head = '19e4d25847395f501c79f2246f39cb1eebd6840e'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected_head
          inventory = Path('tools/ci/commands.json')
          assert subprocess.check_output(['git', 'hash-object', str(inventory)], text=True).strip() == '61a07325b9ff59b26bb31ffb2e19c0d46614d452'
          try:
              ci_coverage.validate()
          except ci_suite_inventory.InventoryError as error:
              assert str(error) == 'missing-or-renamed-python-case', str(error)
              print('Reproduced:', error)
          else:
              raise AssertionError('Expected the reported coverage-inventory failure')
          target = 'tools/tests/test_dev_http_fixture.py'
          added = ['HttpDeploymentRecovery.' + name for name in [
              'test_bad_receipt_identity_preconditions_target_and_durability_fail_closed',
              'test_exhausted_transport_reads_keep_pending_and_last_confirmed_deployment',
              'test_existing_pending_operation_blocks_both_new_apply_and_recovery',
              'test_expired_scenario_deadline_does_not_start_mutation_or_recovery',
              'test_healthy_apply_has_no_recovery_read',
              'test_helper_and_scenario_journals_reconcile_the_same_durable_intent',
              'test_lookup_validation_or_cleanup_failure_stops_further_clients',
              'test_lost_after_denial_reply_recovers_original_and_settles_generation_once',
              'test_non_deployment_uncertainty_is_never_adopted',
              'test_plain_journal_still_requires_explicit_recovery_and_never_replays',
              'test_recovery_has_its_own_five_second_cap',
              'test_recovery_uses_remaining_scenario_deadline_for_rpc_and_process',
              'test_rejected_invalid_or_unreaped_apply_is_not_recovered',
              'test_semantic_unknown_and_uncertain_are_not_polled_or_replayed',
              'test_transport_failure_repeats_only_the_original_receipt_read',
          ]]
          raw = inventory.read_text()
          before = json.loads(raw)
          expected = copy.deepcopy(before)
          expected['pythonCases'][target] = sorted(before['pythonCases'][target] + added)
          assert len(added) == 15 and len(set(expected['pythonCases'][target])) == 22
          actual = ci_coverage.python_cases(Path.cwd())
          assert actual == expected['pythonCases'], 'Unexpected inventory differences outside the reviewed 15 additions'
          anchor = '    "tools/tests/test_dev_http_fixture.py": [\n'
          assert raw.count(anchor) == 1
          patched = raw.replace(anchor, anchor + ''.join('      ' + json.dumps(case) + ',\n' for case in sorted(added)), 1)
          assert json.loads(patched) == expected, 'Non-inventory content changed'
          inventory.write_text(patched, encoding='utf-8', newline='\n')
          ci_coverage.validate()
          print('Strict command, workflow, owner, module and case inventory validation passed')
          print('Registered exactly 15 existing regression cases; no tests or guards changed')
          diff = subprocess.check_output(['git', 'diff', '--', str(inventory)])
          (Path(os.environ['RUNNER_TEMP']) / 'pr605-inventory.patch').write_bytes(diff)
          PY
          git diff --check
          git diff --stat
      - name: Validate the entire failed documentation lane test group
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_ci_profile tools.tests.test_validate_docs tools.tests.test_ci_suite_inventory tools.tests.test_ci_suite_discovery tools.tests.test_ci_result tools.tests.test_ci_coverage tools.tests.test_ci_browser_artifacts tools.tests.test_ci_lanes tools.tests.test_ci_lane_inventory tools.tests.test_local_tests tools.tests.test_ci_cargo tools.tests.test_ci_cargo_cache tools.tests.test_ci_cargo_aot_handoff 2>&1 | tee "$RUNNER_TEMP/pr605-documentation-tests.log"
          python3 tools/ci_coverage.py
          LSF_REQUIRE_NATIVE_PROCESS_TESTS=1 python3 -m unittest tools.tests.test_owned_test_process tools.tests.test_owned_runners tools.tests.test_ci_rust_artifacts tools.tests.test_oci_registry_runner 2>&1 | tee "$RUNNER_TEMP/pr605-owned-process-tests.log"
          python3 tools/validate_docs.py
      - name: Validate developer controller and recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools.tests.test_dev_workflow tools.tests.test_dev_contracts tools.tests.test_dev_build_cache tools.tests.test_dev_watch tools.tests.test_dev_tools tools.tests.test_dev_tool_install tools.tests.test_dev_node_policies tools.tests.test_dev_http_fixture tools.tests.test_dev_blob_fixture tools.tests.test_dev_secret_fixture tools.tests.test_dev_metric_fixture tools.tests.test_dev_local_service_fixture tools.tests.test_dev_event_fixture tools.tests.test_dev_fixture_cleanup tools.tests.test_build_process 2>&1 | tee "$RUNNER_TEMP/pr605-controller-tests.log"
      - name: Create the validated inventory-only commit without moving any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          from tools import ci_coverage
          repo = 'KirilsTurkins/latent-service-fabric'
          parent = '19e4d25847395f501c79f2246f39cb1eebd6840e'
          target = 'tools/ci/commands.json'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == parent
          assert subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() == [target]
          assert subprocess.check_output(['git', 'diff', '--numstat'], text=True).strip() == '15\t0\t' + target
          ci_coverage.validate()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          temporary = Path(os.environ['RUNNER_TEMP'])
          def post(endpoint, value):
              request = temporary / 'pr605-api-request.json'
              request.write_text(json.dumps(value), encoding='utf-8')
              response = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/' + repo + '/' + endpoint, '--input', str(request)], text=True)
              request.unlink()
              return json.loads(response)
          tree = post('git/trees', {'base_tree': base_tree, 'tree': [{'path': target, 'mode': '100644', 'type': 'blob', 'content': Path(target).read_text()}]})
          commit = post('git/commits', {'message': 'fix(ci): register deployment recovery regression cases\n\nRegister the 15 HttpDeploymentRecovery cases introduced in 19e4d258 in\nthe reviewed Python case inventory. Preserve every existing run block,\nworkflow identity, script-owner digest and coverage assertion.\n\nReproduced missing-or-renamed-python-case before the edit and validated\nthe strict inventory, documentation lane and controller suites after.\nRefs #605.', 'tree': tree['sha'], 'parents': [parent]})
          receipt = {'parent': parent, 'commit': commit['sha'], 'tree': tree['sha'], 'changedFiles': [target], 'additions': 15, 'deletions': 0, 'validation': 'passed', 'branchUpdated': False}
          (temporary / 'pr605-candidate.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - name: Retain the exact patch and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr605-inventory-correction
          path: |
            ${{ runner.temp }}/pr605-candidate.json
            ${{ runner.temp }}/pr605-inventory.patch
            ${{ runner.temp }}/pr605-documentation-tests.log
            ${{ runner.temp }}/pr605-owned-process-tests.log
            ${{ runner.temp }}/pr605-controller-tests.log
          retention-days: 7
          if-no-files-found: warn
