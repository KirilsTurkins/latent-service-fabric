name: Controlled HTTP TLS fixture
on:
  push:
    branches: ['feat/http-tls-fixture-20261020', 'feat/http-tls-process-peer-20261020']
    paths:
      - '.github/workflows/http-tls-fixture.yml'
      - 'tools/standard_http/tls_peer.py'
      - 'tools/http_tls_peer_reference.py'
      - 'tools/qualify_http_tls_peer.py'
      - 'tools/tests/test_http_tls_peer.py'
      - 'tools/standard_http/process_peer.py'
      - 'tools/http_tls_process_reference.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: http-tls-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture:
    name: TLS transport and owned process controls without a guest or provider build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install the existing locked reference dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check closed TLS readiness and receipt controls
        run: python3 -B -m unittest tools.tests.test_http_tls_peer -v
      - name: Execute actual TLS versions trust hostname and transport retirement
        run: python3 -B tools/qualify_http_tls_peer.py --output "$RUNNER_TEMP/http-tls-peer"
      - name: Retain public certificate and bounded transport receipts
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: http-tls-peer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/http-tls-peer/*.json
            ${{ runner.temp }}/http-tls-peer/certificate.der
          if-no-files-found: warn
          retention-days: 7
