name: PR 605 materialization validation
on:
  push:
    branches: [fix/pr605-materialization-validation]
    paths: [.github/workflows/pr605-materialization-validation.yml]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 797ecfe1eecfac08b8c18b7782aa3305cc0cdb19
          path: validation
          persist-credentials: false
          sparse-checkout: pr605-validation.patch.z64
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cd10d3a0319ce9c158bf0819cabccbce35f385b1
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt,clippy
      - name: Apply the exact reviewed patch and preserve source boundaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr605-evidence"
          exec > >(tee "$RUNNER_TEMP/pr605-evidence/preflight.log") 2>&1
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          raw = zlib.decompress(base64.b64decode(pathlib.Path('../validation/pr605-validation.patch.z64').read_bytes()))
          assert hashlib.sha256(raw).hexdigest() == '04e11a0b3e1bfc9b362f3afdc5d56cfdcbf0828722ed6023df15724a7a301108'
          subprocess.run(['git', 'apply', '--index', '-'], input=raw, check=True)
          PY
          cargo fmt --all
          git diff --check
          python -m pip install -r tools/requirements.lock
          python tools/ci_coverage.py
          python tools/validate_repository.py
      - name: Reproduce the real busy fence against the original synchronous materialization
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr605-evidence'
          ownership = pathlib.Path('crates/latent-wasmtime/src/backend/readiness/ownership.rs')
          backend = pathlib.Path('crates/latent-wasmtime/src/backend.rs')
          original = {p: p.read_bytes() for p in (ownership, backend)}
          try:
              ownership.write_bytes(subprocess.check_output(['git', 'show', 'HEAD:' + str(ownership)]))
              text = backend.read_text()
              start = text.index('    fn materialize_ready_with_wait')
              end = text.index('    fn backend_id', start)
              backend.write_text(text[:start] + text[end:])
              case = 'backend::readiness::tests::materialization::busy_materialization_retains_exact_readiness_and_materializes_once_after_release'
              with (root / 'red.log').open('wb') as log:
                  run = subprocess.run(['cargo', '--config', '.cargo/managed-guest.toml', 'test', '--locked', '-p', 'latent-wasmtime', '--lib', '--all-features', case, '--', '--exact', '--nocapture'], stdout=log, stderr=subprocess.STDOUT, timeout=900)
              output = (root / 'red.log').read_text()
              print(output[-12000:])
              assert run.returncode != 0 and case + ' ... FAILED' in output and 'assertion failed' in output, 'require deterministic assertion failure, not compilation failure'
          finally:
              for path, raw in original.items(): path.write_bytes(raw)
          PY
      - name: Validate Rust lint and all affected host suites
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr605-evidence"
          cargo --config .cargo/managed-guest.toml clippy --locked -p latent-executor -p latent-node -p latent-wasmtime --lib --tests --all-features -- -D warnings 2>&1 | tee "$evidence/clippy.log"
          cargo --config .cargo/managed-guest.toml test --locked -p latent-executor --lib --all-features -- --test-threads=1 2>&1 | tee "$evidence/executor.log"
          cargo --config .cargo/managed-guest.toml test --locked -p latent-node --lib --all-features -- --test-threads=1 2>&1 | tee "$evidence/node-lib.log"
          cargo --config .cargo/managed-guest.toml test --locked -p latent-node --test activation_lifecycle --all-features -- --test-threads=1 2>&1 | tee "$evidence/node-lifecycle.log"
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --lib --all-features -- --test-threads=1 2>&1 | tee "$evidence/wasmtime-lib.log"
      - name: Verify exact Rust discovery and unchanged Python coverage inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          from tools.ci_suite_discovery import validate_cases
          from tools.phase3_security_artifacts import listing
          from tools import ci_suite_inventory
          data = ci_suite_inventory.load()
          selected = {'latent-executor.lib.latent-executor', 'latent-node.lib.latent-node', 'latent-node.test.activation-lifecycle', 'latent-wasmtime.lib.latent-wasmtime'}
          report = {}
          for suite in data['suites']:
              if suite['id'] not in selected: continue
              command = ['cargo', '--config', '.cargo/managed-guest.toml', 'test', '--locked', '-p', suite['package'], '--all-features']
              command += ['--lib'] if suite['kind'] == 'lib' else ['--test', suite['target']]
              available = listing(subprocess.check_output(command + ['--', '--list'], timeout=300))
              ignored = listing(subprocess.check_output(command + ['--', '--ignored', '--list'], timeout=300))
              validate_cases(suite, available, ignored, data['selections'])
              report[suite['id']] = {'cases': len(available), 'ignored': len(ignored)}
          assert set(report) == selected
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr605-evidence', 'discovery.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
          python -m unittest tools.tests.test_ci_coverage tools.tests.test_ci_suite_inventory tools.tests.test_ci_suite_discovery
          python tools/ci_coverage.py
          python tools/validate_docs.py
      - name: Retrieve the exact compiled Go inputs from the failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 36248963899 --repo "$GITHUB_REPOSITORY" --name go-guest-upstream-2445bdecf6055661f5ba17b49757e4151bef3341 --dir "$RUNNER_TEMP/go-inputs"
          test -f "$RUNNER_TEMP/go-inputs/go-capsule-authoring/sdk-guests/SDK-BUILD.json"
      - name: Execute all ten Go SDK tests and repeat nested cold and warm service calls
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr605-evidence"
          export LSF_GUEST_CAPSULES="$RUNNER_TEMP/go-inputs/go-capsule-authoring/sdk-guests"
          export LSF_GUEST_SDK_LANGUAGE=go
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test guest_sdk -- --ignored --test-threads=1 --show-output 2>&1 | tee "$evidence/go-sdk.log"
          for attempt in 1 2 3 4 5 6 7 8; do
            cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test guest_sdk service::typed_service_outcomes_use_node_admission_and_reused_cells -- --ignored --exact --test-threads=1 --show-output 2>&1 | tee "$evidence/go-service-$attempt.log"
          done
      - name: Create a validated source-only commit without moving the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git add crates/latent-executor crates/latent-node crates/latent-wasmtime tools/ci/suites.json
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/pr605-evidence/fix.patch"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          parent = 'cd10d3a0319ce9c158bf0819cabccbce35f385b1'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == parent
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          expected = {'crates/latent-executor/src/lib.rs', 'crates/latent-executor/src/preparation_read_wait/tests.rs', 'crates/latent-node/src/activation_manager/preparation.rs', 'crates/latent-node/src/activation_manager/run.rs', 'crates/latent-node/src/budgeted_execution.rs', 'crates/latent-node/src/budgeted_execution/tests/preparation_wait.rs', 'crates/latent-node/tests/activation_lifecycle/backend.rs', 'crates/latent-node/tests/activation_lifecycle/preparation.rs', 'crates/latent-wasmtime/src/backend.rs', 'crates/latent-wasmtime/src/backend/readiness.rs', 'crates/latent-wasmtime/src/backend/readiness/ownership.rs', 'crates/latent-wasmtime/src/backend/readiness/tests.rs', 'crates/latent-wasmtime/src/backend/readiness/tests/materialization.rs', 'tools/ci/suites.json'}
          assert set(names) == expected, names
          assert not subprocess.check_output(['git', 'diff', '--name-only']).strip()
          base = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/git/'
          def post(endpoint, value):
              request = urllib.request.Request(base + endpoint, data=json.dumps(value).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response: return json.load(response)
          entries, hashes = [], {}
          for name in names:
              raw = pathlib.Path(name).read_bytes()
              blob = post('blobs', {'content': raw.decode(), 'encoding': 'utf-8'})['sha']
              hashes[name] = hashlib.sha256(raw).hexdigest()
              entries.append({'path': name, 'type': 'blob', 'mode': '100644', 'sha': blob})
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = post('trees', {'base_tree': base_tree, 'tree': entries})['sha']
          message = 'fix(runtime): retain readiness across bounded materialization currentness waits\n\nWait only on the final pure currentness observation before consuming the original ready pin once. Preserve synchronous fail-closed callers, original grants, node deadline/cancellation/transport ownership and final activation-start checks.\n\nReproduce the production authority-busy race deterministically, cover pin cleanup and revoked/expired grants, and register all 11 new Rust tests. Validate the complete Go SDK runtime suite and repeated nested service calls using the exact failed-run guest components.\nRefs #605.'
          commit = post('commits', {'message': message, 'tree': tree, 'parents': [parent]})
          receipt = {'commit': commit['sha'], 'parent': parent, 'tree': tree, 'files': hashes, 'validationRun': os.environ['GITHUB_RUN_ID']}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr605-evidence', 'validated-commit.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr605-materialization-validation
          path: ${{ runner.temp }}/pr605-evidence/
          if-no-files-found: error
          retention-days: 7
