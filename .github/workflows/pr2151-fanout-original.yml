name: PR 2151 original fanout diagnostic
on:
  push:
    branches: [diagnostic/pr2151-integration-fanout-20261121]
    paths: [.github/workflows/pr2151-fanout-original.yml]
permissions:
  contents: read
  actions: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 41e3152062e077986283b83e80ab072746f5b5bb
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          artifact-ids: 14579171039
          run-id: 44609932406
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fanout-failure
          merge-multiple: true
          digest-mismatch: error
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          artifact-ids: 14577653153
          run-id: 44609932406
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fanout-native
          merge-multiple: true
          digest-mismatch: error
      - name: Replay only the already-compiled finite diagnostic without any host or guest changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          git fetch --no-tags --depth=1 origin ef843cbed60798d06da904df464a5cf45850c56d
          python3 - <<'PY'
          import importlib.util,json,os,subprocess,yaml,sys
          from pathlib import Path
          raw=subprocess.check_output(['git','show','ef843cbed60798d06da904df464a5cf45850c56d:.github/workflows/pr2151-integration-fanout-diagnostic.yml'])
          model=yaml.safe_load(raw)
          scripts=[s['run'] for s in model['jobs']['fanout-frames']['steps'] if s.get('name')=='Bind the existing numeric observer to this exact retained failure']
          assert len(scripts)==1
          subprocess.run(['bash','-euo','pipefail','-c',scripts[0]],check=True)
          p=Path(os.environ['RUNNER_TEMP'],'diagnose-pr2151-fanout.py')
          source=p.read_text();assert source.count('[31, f"http://')==1
          source=source.replace('[31, f"http://','[32, f"http://')
          p.write_text(source)
          spec=importlib.util.spec_from_file_location('diagnostic',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          root=Path(os.environ['RUNNER_TEMP']);attempt=root/'fanout-failure';native=root/'fanout-native';out=root/'fanout-original';out.mkdir()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m.TESTED
          assert m.digest(m.read_file(attempt/'node/FAILED.json'))==m.FAILED
          before=m.package_materials(attempt/'build');binaries,identity=m.fetch.prepared_native(native)
          m.package(attempt/'build',binaries['package'],out)
          result=m.replay(attempt/'build',binaries,out/'node')
          assert m.package_materials(attempt/'build')==before
          assert m.fetch.prepared_native(native)[1]==identity
          result.update(originalComponentUnchanged=True,originalNativeUnchanged=True,qualification=False,mode=32)
          m.write_json(out/'observation.json',result)
          print(json.dumps(result))
          PY
          git diff --exit-code
      - name: Retain only public diagnostic outcome and source custody
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-fanout-original-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fanout-original/observation.json
            ${{ runner.temp }}/fanout-original/node/observation.json
            ${{ runner.temp }}/fanout-original/node/controls/*.json
          retention-days: 7
          if-no-files-found: warn
