name: Agent 2 pinned AbortSignal link inputs

on:
  push:
    branches: [fix/1852-agent2-abort-engine-audit]
    paths: [.github/workflows/agent2-abort-link-inputs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent2-abort-link-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Select isolated runner directories
        run: |
          echo "INPUTS=$RUNNER_TEMP/agent2-abort-link-inputs" >> "$GITHUB_ENV"
          echo "BUILD=$RUNNER_TEMP/agent2-abort-rust-support" >> "$GITHUB_ENV"
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - name: Acquire and verify the complete pinned upstream link archive
        run: |
          set -euo pipefail
          mkdir -p "$INPUTS" "$BUILD"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 600 \
            https://github.com/bytecodealliance/StarlingMonkey/releases/download/libspidermonkey_FIREFOX_147_0_4_RELEASE_STARLING/spidermonkey-static-release.tar.gz \
            --output "$INPUTS/spidermonkey-static-release.tar.gz"
          test "$(stat -c '%s' "$INPUTS/spidermonkey-static-release.tar.gz")" = 184568633
          printf '%s  %s\n' c57dc83d93dc04198882b44fea49cd3cb01e0b267bf99fae3b058cb158da684b "$INPUTS/spidermonkey-static-release.tar.gz" | sha256sum --check
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://codeload.github.com/bytecodealliance/StarlingMonkey/tar.gz/9dda8ba7fcda2e17c6795d402f0478cf4c1f7f37 \
            --output "$INPUTS/starling.tar.gz"
          test "$(stat -c '%s' "$INPUTS/starling.tar.gz")" = 870167
          printf '%s  %s\n' ce27045db832476faaf752940c9c302d8df1241a6e17ca1eca47fd3054998949 "$INPUTS/starling.tar.gz" | sha256sum --check
      - name: Compile the original locked Rust support closure
        run: |
          set -euo pipefail
          rustc --version | tee "$INPUTS/rustc-version.txt"
          cargo --version | tee "$INPUTS/cargo-version.txt"
          grep -q '^rustc 1.97.1 ' "$INPUTS/rustc-version.txt"
          grep -q '^cargo 1.97.1 ' "$INPUTS/cargo-version.txt"
          python3 - <<'PY'
          import os, pathlib, shutil, tarfile
          out = pathlib.Path(os.environ['BUILD'])
          inputs = pathlib.Path(os.environ['INPUTS'])
          with tarfile.open(inputs / 'starling.tar.gz') as archive:
              archive.extractall(out, filter='data')
          source = out / 'StarlingMonkey-9dda8ba7fcda2e17c6795d402f0478cf4c1f7f37'
          template = source / 'runtime/crates/staticlib-template'
          manifest = (template / 'Cargo.toml.in').read_text()
          module = (template / 'rust-staticlib.rs.in').read_text()
          for name, directory, features in (
              ('rust-encoding', 'rust-encoding', []),
              ('rust-hooks', 'rust-hooks', []),
              ('rust-url', 'rust-url', []),
              ('multipart', 'rust-multipart', ['capi', 'simd']),
          ):
              import json
              manifest += name + ' = { path = ' + json.dumps(str(source / 'crates' / directory)) + ', features = ' + json.dumps(features) + ' }\n'
              module += 'pub use ' + name.replace('-', '_') + ';\n'
          (out / 'Cargo.toml').write_text(manifest)
          (out / 'rust-staticlib.rs').write_text(module)
          shutil.copyfile(template / 'Cargo.lock', out / 'Cargo.lock')
          PY
          cp "$BUILD/Cargo.lock" "$INPUTS/Cargo.lock"
          CARGO_BUILD_JOBS=2 cargo build --manifest-path "$BUILD/Cargo.toml" --locked --release --target wasm32-wasip1 2>&1 | tee "$INPUTS/cargo-build.log"
          cmp "$BUILD/Cargo.lock" "$INPUTS/Cargo.lock"
          cp "$BUILD/target/wasm32-wasip1/release/librust_staticlib.a" "$INPUTS/"
          cp "$BUILD/Cargo.toml" "$BUILD/rust-staticlib.rs" "$INPUTS/"
      - name: Capture the exact source and input identities
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$INPUTS/source-head.txt"
          git show -s --format=raw HEAD > "$INPUTS/source-commit.txt"
          git bundle create "$INPUTS/source.bundle" HEAD
          git bundle verify "$INPUTS/source.bundle"
          printf '%s\n' 'Pinned upstream link support only. This artifact is not a patched-engine, GC, signed-runtime or Store qualification result.' > "$INPUTS/SCOPE.txt"
          (cd "$INPUTS" && sha256sum ./* > SHA256SUMS)
      - name: Retain verified inputs without promoting qualification
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: agent2-pinned-abort-link-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/agent2-abort-link-inputs/
          if-no-files-found: error
          retention-days: 2
