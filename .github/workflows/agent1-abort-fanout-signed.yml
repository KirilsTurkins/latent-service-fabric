name: Agent 1 signed abort fan-out diagnosis

on:
  push:
    branches: ['fix/typescript-abort-fanout-refusal-1852-agent1']
    paths: ['.github/workflows/agent1-abort-fanout-signed.yml']

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 6ab3da5364ac3e7db57c7154f894bc6223ad728b
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: '3.13.5'
      - uses: KirilsTurkins/lsf-setup-node@34275fdec80b5be172c3327cadef76aa2f3b31c6
        with:
          node-version: '24.19.0'
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@1ce6e3461b7d83b4b5a5a6557870b4fdfd4386ce
        with:
          version: '1.254.0'
      - name: Preserve the original isolated compiler boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/agent1-tools"
      - uses: KirilsTurkins/lsf-download-artifact@dd4ebbadbf12ed34441db2712be7a193490b7fc5
        with:
          name: typescript-fetch-native-input-6ab3da5364ac3e7db57c7154f894bc6223ad728b
          run-id: 42516280360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agent1-native
      - uses: KirilsTurkins/lsf-download-artifact@dd4ebbadbf12ed34441db2712be7a193490b7fc5
        with:
          name: typescript-fetch-engine-input-6ab3da5364ac3e7db57c7154f894bc6223ad728b
          run-id: 42516280360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agent1-engine
      - uses: KirilsTurkins/lsf-download-artifact@dd4ebbadbf12ed34441db2712be7a193490b7fc5
        with:
          name: typescript-source-splicer-input-6ab3da5364ac3e7db57c7154f894bc6223ad728b
          run-id: 42516280360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agent1-splicer
      - name: Execute actual signed components with original limits and assertions
        run: |
          chmod u+x "$RUNNER_TEMP/agent1-native/native-binaries/"*
          python3 - <<'PY'
          import json, os, traceback
          from pathlib import Path
          from tools.qualify_typescript_dependencies import prepared_native
          from tools.qualify_typescript_fetch_runtime import project, execute, OWNER_LIMITS
          from tools.typescript_guest.build import build
          from tools.rust_capsule_project import digest
          root = Path(os.environ['RUNNER_TEMP'])
          native, identity = prepared_native(root/'agent1-native')
          cases = root/'agent1-signed-cases'
          cases.mkdir()
          original_body = """      const graph = refusedAbortFanout();
                // Use the ordinary allocation/GC checkpoint, not a fixture-only pump.
                await Promise.resolve();
                graph.source.abort(graph.reason);
                graph.verify();
                return 'abort-fanout:refusal:unchanged:recovered';"""
          diagnosed_body = """      let stage = 'refusal';
                try {
                  const graph = refusedAbortFanout();
                  stage = 'checkpoint';
                  await Promise.resolve();
                  stage = 'retry';
                  graph.source.abort(graph.reason);
                  stage = 'verification';
                  graph.verify();
                  return 'abort-fanout:refusal:unchanged:recovered';
                } catch (error) {
                  const known = ['activation-runtime-promise-native-register-denied:2',
                    'abort-fanout-fill-boundary-missing', 'abort-fanout-refusal-mutated-state',
                    'abort-fanout-publication-or-order', 'abort-fanout-reason-identity'];
                  const detail = error instanceof Error ? known.indexOf(error.message) : -1;
                  return `diagnostic:fanout:${stage}:${detail}`;
                }"""
          variants = {
            'original': original_body,
            'stage-diagnostic': diagnosed_body,
            'entry-checkpoint': '      await Promise.resolve();\n'+diagnosed_body,
            'refusal-prefix': "      const graph = refusedAbortFanout();\n      if (!graph.unchanged()) throw new Error('abort-fanout-refusal-mutated-state');\n      return 'diagnostic:fanout:refused-unchanged';",
            'checkpoint-prefix': "      const graph = refusedAbortFanout();\n      await Promise.resolve();\n      if (!graph.unchanged()) throw new Error('abort-fanout-refusal-mutated-state');\n      return 'diagnostic:fanout:checkpoint-unchanged';",
            'allocation-checkpoint': diagnosed_body.replace('await Promise.resolve();', 'Promise.resolve();'),
          }
          summary = {'scope': 'signed-diagnostic-experiments-not-qualification', 'ownerLimits': OWNER_LIMITS,
                     'nativeInputs': identity, 'cases': {}}
          for name, body in variants.items():
            output = cases/name
            output.mkdir()
            record = {'stage': 'project', 'fullTicketQualification': False}
            try:
              app = project(output/'application')
              source = app/'src/main.ts'
              text = source.read_text()
              assert text.count(original_body) == 1
              source.write_text(text.replace(original_body, body))
              lock_path = app/'sdk-lock.json'
              lock = json.loads(lock_path.read_text())
              lock['template']['sourceDigest'] = digest(source.read_bytes())
              lock_path.write_text(json.dumps(lock, indent=2)+'\n')
              record['stage'] = 'build'
              artifact = build(app, output/'build', native['capsule_contracts'], native['package'],
                'https://github.com/KirilsTurkins/latent-service-fabric', tools=root/'agent1-tools',
                runtime_engine=root/'agent1-engine/engine.wasm',
                runtime_engine_receipt=root/'agent1-engine/engine-input.json',
                runtime_splicer=root/'agent1-splicer/splicer',
                runtime_splicer_receipt=root/'agent1-splicer/splicer-input.json')
              record['stage'] = 'signed-execution'
              record['execution'] = execute(artifact, native, output/'node')
              record['status'] = 'all-original-signed-assertions-passed'
            except Exception as error:
              record['status'] = 'failed'
              record['errorType'] = type(error).__name__
              record['error'] = str(error)
              traceback.print_exc()
            (output/'observation.json').write_text(json.dumps(record, indent=2)+'\n')
            summary['cases'][name] = record
            (cases/'observation.json').write_text(json.dumps(summary, indent=2)+'\n')
            print(name, json.dumps(record), flush=True)
          assert prepared_native(root/'agent1-native')[1] == identity
          PY
      - name: Retain original pinned frontend for isolated reproduction
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/agent1-tools/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/agent1-tools/bin/node"
          cp "$(command -v wasm-tools)" "$RUNNER_TEMP/agent1-tools/bin/wasm-tools"
          tar -czf "$RUNNER_TEMP/agent1-frontend.tar.gz" -C "$RUNNER_TEMP/agent1-tools" .
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: agent1-signed-abort-diagnosis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent1-signed-cases/observation.json
            ${{ runner.temp }}/agent1-signed-cases/*/observation.json
            ${{ runner.temp }}/agent1-signed-cases/*/application/src/main.ts
            ${{ runner.temp }}/agent1-signed-cases/*/build/*.json
            ${{ runner.temp }}/agent1-signed-cases/*/build/logs/**
            ${{ runner.temp }}/agent1-signed-cases/*/build/component.wasm
            ${{ runner.temp }}/agent1-signed-cases/*/node/*.json
            ${{ runner.temp }}/agent1-signed-cases/*/node/controls/*.json
            ${{ runner.temp }}/agent1-frontend.tar.gz
          if-no-files-found: error
          retention-days: 7
