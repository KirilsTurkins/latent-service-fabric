name: PR 1934 exact repair contracts
on:
  push:
    branches: [ci/pr1934-rustup-20261114]
    paths: [.github/workflows/pr1934-final-contracts.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          persist-credentials: false
          ref: 5591107c97a391a919b42d9a29b5f5d89365e621
          fetch-depth: 2
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - name: Validate the exact candidate without suppressed or skipped tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pr1934-final
          python -m pip install -r tools/requirements.lock
          python - <<'PY' | tee target/pr1934-final/preservation.log
          from pathlib import Path
          import copy, json, subprocess
          from tools.ci_python_policy import verify_source_tree
          verify_source_tree(Path.cwd(), '3e2c179cc66cf9bfc13c6ca4a7c16e3b657073c0')
          path = 'tools/ci/contracts/workflows/developer-tools.yml/jobs/linux-portable.json'
          prior = json.loads(subprocess.check_output(['git', 'show', 'HEAD^:' + path]))
          current = json.loads(Path(path).read_text())
          definition = copy.deepcopy(current['definition'])
          removed = definition['steps'].pop(2)
          assert removed['name'] == 'Isolate the Linux portable Rust toolchain'
          assert definition['steps'][2].pop('with') == {'components': 'clippy,rustfmt', 'targets': 'wasm32-wasip2,wasm32-unknown-unknown'}
          assert definition == prior['definition']
          print('Source suppression policy passed; all original execution commands, permissions and timeouts preserved.')
          PY
          python -m unittest tools.tests.test_dev_rust_toolchain tools.tests.test_dev_frontend_native_wheel tools.tests.test_dev_frontend_preflight_packaging tools.tests.test_ci_contracts -v 2>&1 | tee target/pr1934-final/regressions.log
          python tools/ci_coverage.py --receipt target/pr1934-final/observed-inventory.json 2>&1 | tee target/pr1934-final/coverage.log
          git diff --exit-code
          git rev-parse HEAD > target/pr1934-final/commit.txt
          git rev-parse 'HEAD^{tree}' > target/pr1934-final/tree.txt
      - name: Retain exact source-bound validation
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr1934-final-contracts
          path: target/pr1934-final/
          if-no-files-found: error
          retention-days: 7
