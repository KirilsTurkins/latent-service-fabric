name: PR 729 diagnostics
on:
  push:
    branches: [feat/432-cargo-cache-evidence]
    paths: [.github/workflows/pr-729-diagnostics.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture exact source and bounded failure tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr729"
          git archive HEAD | gzip > "$RUNNER_TEMP/pr729/source.tar.gz"
          python3 - <<'PY'
          import os, pathlib, urllib.request
          url = 'https://api.github.com/repos/KirilsTurkins/latent-service-fabric/actions/jobs/109339928600/logs'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read(32 * 1024 * 1024 + 1)
          if len(data) > 32 * 1024 * 1024:
              raise SystemExit('log exceeds bound')
          lines = data.decode('utf-8-sig').splitlines()
          selected = '\n'.join(lines[-1500:])
          if len(selected.encode()) > 1024 * 1024:
              raise SystemExit('tail exceeds bound')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr729/failure-tail.log').write_text(selected)
          PY
      - name: Retain source and diagnostic tail
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr729-source-diagnostics
          path: ${{ runner.temp }}/pr729/
          retention-days: 1
          if-no-files-found: error
