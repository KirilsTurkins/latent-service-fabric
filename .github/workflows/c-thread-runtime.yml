name: Ready-aware ordinary C owned thread lifecycle

on:
  push:
    branches: ['feat/c-thread-runtime-consumer-20261021', 'feat/c-owned-sync-20261022']
    paths:
      - '.github/workflows/c-thread-runtime.yml'
      - 'tools/host_codec_owned_reply_native_products.py'
      - 'tools/host_codec_owned_reply_native_products_reader.py'
      - 'tools/tests/test_host_codec_owned_reply_native_products.py'
      - 'tools/tests/test_host_codec_owned_reply_native_products_reader.py'
      - 'tools/tests/test_c_thread_owned_reply_runtime.py'
      - 'tools/host_codec_linear_memory_native_products.py'
      - 'tools/host_codec_linear_memory_native_products_reader.py'
      - 'tools/tests/test_host_codec_linear_memory_native_products.py'
      - 'tools/tests/test_host_codec_linear_memory_native_products_reader.py'
      - 'tools/tests/test_c_thread_ready_runtime.py'
      - 'tools/tests/test_c_thread_linear_memory_native_source.py'
      - 'tools/c_thread_linear_memory_native_source.py'
      - 'sdk/c-guest/runtime/thread-abi.h'
      - 'tools/qualify_c_thread_runtime.py'
      - 'tools/c_thread_runtime_fixture.py'
      - 'tools/c_thread_runtime_node.py'
      - 'tools/c_thread_native_products.py'
      - 'tools/c_thread_native_source.py'
      - 'tools/activation_stack_native_products.py'
      - 'tools/c_thread_package_native_products.py'
      - 'tools/c_thread_admission_native_products.py'
      - 'tools/host_codec_native_products.py'
      - 'tools/host_codec_native_products_reader.py'
      - 'tools/tests/test_host_codec_native_products_reader.py'
      - 'tools/tests/test_c_thread_admission_native_products.py'
      - 'tools/tests/fixtures/c-thread-admission-f244-records.json'
      - 'tools/activation_stack_native_source.py'
      - 'tools/c_guest/threading.py'
      - 'tools/c_guest/compiler.py'
      - 'tools/c_guest/threading_compatibility.py'
      - 'sdk/c-guest/runtime/tls-keys.c'
      - 'sdk/c-guest/runtime/threads.c'
      - 'sdk/c-guest/runtime/template-copy.c'
      - 'sdk/c-guest/runtime/synchronization.c'
      - 'tools/c_sync_source_controls.py'
      - 'tools/tests/fixtures/c-sync-reference.c'
      - 'tools/tests/fixtures/c-sync-reference.cjs'
      - 'docs/testing/evidence/c-thread-native-rustfmt-2026-10-21.json'
      - 'tools/tests/test_c_threading_profile.py'
      - 'tools/tests/test_c_threading_compatibility.py'
      - 'tools/fixtures/c-thread-runtime/**'
      - 'tools/tests/test_c_thread_runtime.py'
      - 'tools/tests/test_c_thread_native_products.py'
      - 'tools/tests/test_activation_stack_native_products.py'
      - 'tools/tests/test_activation_stack_native_source.py'
      - 'tools/tests/test_sdk_native_products_reader.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: c-thread-ready-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-c-threads:
    name: One captured C component and twenty signed lifecycle and synchronization cases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Fetch exact frozen source and unchanged reader test models
        run: |
          git fetch --no-tags --depth=1 origin f6251df89851de98cb869784d095ad5cc2e5b385
          git fetch --no-tags --depth=1 origin f244b81f14abad5d4dc4984cb842aaf1d9076e23
          git fetch --no-tags --depth=1 origin 7b6365ee39dea9770591a931b96711965f8a1aaf
          git fetch --no-tags --depth=1 origin 050b9e71ba04a4bdc559f4a7fa48d6bd94c2ff38
          git fetch --no-tags --depth=1 origin 3e4178271b4b7fe75a69c8f0665dbe275b41d7c3
          git fetch --no-tags --depth=1 origin 173ccd9c096e4db643aa9627bd4550cef27fb922
          git fetch --no-tags --depth=1 origin ea118974d93843265a504f5d30571ed7cfe8a7d2
          git fetch --no-tags --depth=1 origin f5351a9331ed954c49ae83f2f4004e0f96d25d0e
          git fetch --no-tags --depth=1 origin ff5aadaecd11874f53aa80e56ffdfff0efda312b
          git fetch --no-tags --depth=1 origin 4ed0db7f07245732d07f867e95ec008a804485e5
          git fetch --no-tags --depth=1 origin cb8ceefc5f6343301871dbde1d8a853d3581cc30
      - name: Verify source and adverse fixed-product controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_thread_runtime tools.tests.test_c_thread_native_products tools.tests.test_sdk_native_products_reader tools.tests.test_c_threading_profile tools.tests.test_activation_stack_native_products tools.tests.test_activation_stack_native_source tools.tests.test_c_thread_package_native_products tools.tests.test_c_threading_compatibility tools.tests.test_c_thread_admission_native_products tools.tests.test_host_codec_native_products_reader tools.tests.test_host_codec_linear_memory_native_products_reader tools.tests.test_host_codec_linear_memory_native_products tools.tests.test_c_thread_ready_runtime tools.tests.test_c_thread_linear_memory_native_source tools.tests.test_host_codec_owned_reply_native_products_reader tools.tests.test_host_codec_owned_reply_native_products tools.tests.test_c_thread_owned_reply_runtime -v
      - name: Authenticate five fixed 128-control ready-aware C products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/host_codec_owned_reply_native_products.py --output "$RUNNER_TEMP/c-thread-native"
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        with:
          version: '0.16.0'
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Compile production synchronization source and execute thirteen serialized source controls
        run: >-
          python3 -B tools/c_sync_source_controls.py
          --zig "$(command -v zig)" --node "$(command -v node)"
          --output "$RUNNER_TEMP/c-sync-source"
      - name: Install only normal captured C compiler prerequisites
        run: |
          python3 -B tools/install_guest_bindgen.py "$RUNNER_TEMP/c-thread-bindgen"
          echo "$RUNNER_TEMP/c-thread-bindgen" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile one ordinary C project and execute all seventeen original cases
        run: python3 -B tools/qualify_c_thread_runtime.py --prepared "$RUNNER_TEMP/c-thread-native" --output "$RUNNER_TEMP/c-thread-runtime"
      - name: Retain bounded public build, invocation and cleanup evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-thread-ready-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-thread-runtime/*.json
            ${{ runner.temp }}/c-thread-runtime/build/*.json
            ${{ runner.temp }}/c-thread-runtime/build/component.wasm
            ${{ runner.temp }}/c-thread-runtime/application/src/main.c
            ${{ runner.temp }}/c-thread-runtime/application/src/synchronization.h
            ${{ runner.temp }}/c-thread-runtime/application/wit/**
            ${{ runner.temp }}/c-thread-runtime/build/wit/**
            ${{ runner.temp }}/c-thread-runtime/build/logs/*.txt
            ${{ runner.temp }}/c-thread-runtime/node/*.json
            ${{ runner.temp }}/c-thread-runtime/node/*.stdout
            ${{ runner.temp }}/c-thread-runtime/node/*.stderr
            ${{ runner.temp }}/c-thread-runtime/node/controls/*.json
            ${{ runner.temp }}/c-thread-runtime/node/commands/logs/*.txt
            ${{ runner.temp }}/c-thread-runtime/node/commands/*.json
            ${{ runner.temp }}/c-sync-source/*.json
            ${{ runner.temp }}/c-sync-source/*.txt
            ${{ runner.temp }}/c-sync-source/*.h
            ${{ runner.temp }}/c-sync-source/*.o
            ${{ runner.temp }}/c-sync-source/*.wasm
          retention-days: 7
