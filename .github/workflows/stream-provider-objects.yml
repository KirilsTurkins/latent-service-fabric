name: Protected stream normal C object check
on:
  push:
    branches: ['test/sdk-738-stream-objects-20261026', 'test/sdk-738-classdir-objects-20261026', 'test/sdk-738-classdir-kernfs-objects-20261026', 'test/sdk-738-netdev-directory-objects-20261026', 'test/sdk-738-netdev-layout-objects-20261026', 'test/sdk-738-netdev-post-init-objects-20261026', 'test/sdk-738-constructor-mmio-objects-20261027', 'test/sdk-738-vp-transport-objects-20261027', 'test/sdk-738-msi-context-objects-20261027', 'test/sdk-738-q35-msi-domain-objects-20261027', 'test/sdk-738-msi-descriptor-objects-20261027', 'test/sdk-738-node-bootstrap-custody-20261028', 'test/sdk-738-node-irq-geometry-20261028', 'test/sdk-738-node-native-capacity-20261028']
permissions:
  contents: read
concurrency:
  group: stream-provider-objects-${{ github.ref }}
  cancel-in-progress: false
jobs:
  normal-objects:
    if: github.ref == 'refs/heads/test/sdk-738-stream-objects-20261026'
    name: Eighteen current normal protected C objects without image or boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Capture the original bounded object owner start
        run: |
          python3 -c 'import time; print("STREAM_OBJECT_STARTED=" + str(time.monotonic()))' >> "$GITHUB_ENV"
      - name: Check only the new pure deadline and public-admission controls
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_stream_objects -v
      - name: Compile exactly eighteen current objects through the existing process owner
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-objects"
      - name: Admit the fixed bounded public union before any upload
        id: admission
        if: always()
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py
          --admit --output "$RUNNER_TEMP/stream-provider-objects"
      - name: Retain only admitted object evidence
        if: ${{ always() && steps.admission.outputs.admitted == 'true' }}
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: protected-stream-objects-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stream-provider-objects/receipt.json
            ${{ runner.temp }}/stream-provider-objects/source-inputs.json
            ${{ runner.temp }}/stream-provider-objects/derived-inputs.json
            ${{ runner.temp }}/stream-provider-objects/baseline-inputs.json
            ${{ runner.temp }}/stream-provider-objects/commands.json
            ${{ runner.temp }}/stream-provider-objects/baseline.config
            ${{ runner.temp }}/stream-provider-objects/selected.config
            ${{ runner.temp }}/stream-provider-objects/generated-autoconf.h
            ${{ runner.temp }}/stream-provider-objects/ADMISSION.json
            ${{ runner.temp }}/stream-provider-objects/logs/*.stdout.txt
            ${{ runner.temp }}/stream-provider-objects/logs/*.stderr.txt
            ${{ runner.temp }}/stream-provider-objects/objects/**/*.o
      - name: Retain only the bounded admission-failure receipt
        if: ${{ always() && steps.admission.outputs.fallback == 'true' }}
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: protected-stream-objects-FAILED-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/stream-provider-objects/FAILED.json
  classdir-objects:
    if: github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-netdev-post-init-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-constructor-mmio-objects-20261027' || github.ref == 'refs/heads/test/sdk-738-vp-transport-objects-20261027' || github.ref == 'refs/heads/test/sdk-738-msi-context-objects-20261027' || github.ref == 'refs/heads/test/sdk-738-q35-msi-domain-objects-20261027' || github.ref == 'refs/heads/test/sdk-738-msi-descriptor-objects-20261027' || github.ref == 'refs/heads/test/sdk-738-node-bootstrap-custody-20261028' || github.ref == 'refs/heads/test/sdk-738-node-irq-geometry-20261028' || github.ref == 'refs/heads/test/sdk-738-node-native-capacity-20261028'
    name: Changed class-directory translation units without image or boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Capture the original bounded object owner start
        run: |
          python3 -c 'import time; print("STREAM_OBJECT_STARTED=" + str(time.monotonic()))' >> "$GITHUB_ENV"
      - name: Check only the new fixed classdir source and object-allowlist controls
        if: github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_source_freeze_is_exact_and_preserves_default_source_scope
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_public_gate_refuses_other_original_object_targets -v
      - name: Compile only four changed class-directory translation units
        if: github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only the two new empty-classdir source and nine-target controls
        if: github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_kernfs_freeze_binds_full_projector_and_keeps_historical_modes_closed
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_kernfs_public_gate_keeps_exact_nine_targets_and_current_only_channels -v
      - name: Compile only nine changed empty-classdir translation units
        if: github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir-kernfs
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only two NETDEV directory source and admission controls
        if: github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_netdev_directory_freeze_preserves_all_fifty_two_sources
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_netdev_directory_public_gate_is_closed_to_nine_changed_targets -v
      - name: Compile only nine changed NETDEV own-directory translation units
        if: github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-directory
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only two readonly layout source and ELF controls
        if: github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_layout_source_freeze_preserves_notify_and_all_prior_modes
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_layout_elf_refuses_malformed_tables_and_reports_only_incomplete_lower_bound -v
      - name: Compile eleven fixed allocating and notify translation units with readonly data
        if: github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-layout
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only the new POST_INIT source and eight-target boundary controls
        if: github.ref == 'refs/heads/test/sdk-738-netdev-post-init-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_post_init_projection_keeps_whole_ordinary_body_and_original_unwind
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_post_init_instances_are_bound_before_next_and_both_chains_preflight
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_post_init_owner_keeps_exact_eight_targets_and_denies_size_probe_union -v
      - name: Compile only eight actual changed POST_INIT translation units
        if: github.ref == 'refs/heads/test/sdk-738-netdev-post-init-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-post-init
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only new constructor bundle and closed22-target controls
        if: github.ref == 'refs/heads/test/sdk-738-constructor-mmio-objects-20261027'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_constructor_bundle_physical_sources_and_logical_origins_are_closed
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_constructor_mmio_owner_keeps_only_twenty_two_changed_targets_and_stage_union -v
      - name: Compile only22 changed cumulative constructor and MMIO translation units
        if: github.ref == 'refs/heads/test/sdk-738-constructor-mmio-objects-20261027'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --constructor-mmio
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only the new VP owner cold-source and mode control
        if: github.ref == 'refs/heads/test/sdk-738-vp-transport-objects-20261027'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.VpTransportOwner.test_vp_owner_cold_materials_exact_mode_and_public_stage -v
      - name: Compile exactly22 cumulative VP bookkeeping translation units
        if: github.ref == 'refs/heads/test/sdk-738-vp-transport-objects-20261027'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --vp-transport
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only the new MSI source and six-target owner selector
        if: github.ref == 'refs/heads/test/sdk-738-msi-context-objects-20261027'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.MsiContextOwner.test_msi_owner_has_exact_sources_targets_and_closed_union -v
      - name: Compile exactly six actual MSI context and group translation units
        if: github.ref == 'refs/heads/test/sdk-738-msi-context-objects-20261027'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --msi-context
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only new Q35 source and seven-object owner controls
        if: github.ref == 'refs/heads/test/sdk-738-q35-msi-domain-objects-20261027'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.Q35MsiSource
          tools.tests.test_host_stream_kernel_stream_objects.Q35MsiOwner -v
      - name: Compile seven actual direct-vector domain and MSI-X table objects
        if: github.ref == 'refs/heads/test/sdk-738-q35-msi-domain-objects-20261027'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --q35-msi-domain
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only five new MSI descriptor source and owner controls
        if: github.ref == 'refs/heads/test/sdk-738-msi-descriptor-objects-20261027'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.MsiDescriptorSource.test_captured_inventory_and_native_preload_refusal
          tools.tests.test_host_stream_kernel_stream_objects.MsiDescriptorSource.test_native_node_clones_have_exact_whole_body_inverses
          tools.tests.test_host_stream_kernel_stream_objects.MsiDescriptorSource.test_same_operation_marker_and_current_attempt_cleanup
          tools.tests.test_host_stream_kernel_stream_objects.MsiDescriptorSource.test_aggregate_admission_and_real_irq_cut
          tools.tests.test_host_stream_kernel_stream_objects.MsiDescriptorOwner.test_closed_targets_materials_and_public_union -v
      - name: Compile six actual MSI descriptor and XArray objects
        if: github.ref == 'refs/heads/test/sdk-738-msi-descriptor-objects-20261027'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --msi-descriptor
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Compile the one uninstalled Node custody translation unit
        if: github.ref == 'refs/heads/test/sdk-738-node-bootstrap-custody-20261028'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --node-bootstrap
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only new native-geometry capture and passive ELF controls
        if: github.ref == 'refs/heads/test/sdk-738-node-irq-geometry-20261028'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.ZNodeIrqGeometryOwner.test_complete_capture_and_closed_six_object_scope
          tools.tests.test_host_stream_kernel_stream_objects.ZNodeIrqGeometryOwner.test_passive_geometry_rejects_wrong_role_write_relocations_and_truncation
          tools.tests.test_host_stream_kernel_stream_objects.ZNodeIrqGeometryOwner.test_native_operands_preserve_unfunded_dynamic_and_shared_boundaries -v
      - name: Compile six actual IRQ allocating translation units and read geometry without execution
        if: github.ref == 'refs/heads/test/sdk-738-node-irq-geometry-20261028'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --node-geometry
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit the fixed bounded public union before any upload
        id: admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the nine-target empty-classdir public union
        id: kernfs_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir-kernfs
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the nine-target NETDEV directory public union
        id: directory_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-directory
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the eleven-target readonly-layout public union
        id: layout_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-layout
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the eight-target POST_INIT public union
        id: post_init_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-netdev-post-init-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-post-init
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the22-target constructor MMIO public union
        id: constructor_mmio_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-constructor-mmio-objects-20261027' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --constructor-mmio
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the22-target VP bookkeeping public union
        id: vp_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-vp-transport-objects-20261027' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --vp-transport
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the six-target MSI context public union
        id: msi_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-msi-context-objects-20261027' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --msi-context
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the seven-target Q35 public union
        id: q35_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-q35-msi-domain-objects-20261027' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --q35-msi-domain
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the six-target MSI descriptor public union
        id: msi_descriptor_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-msi-descriptor-objects-20261027' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --msi-descriptor
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the one-object Node custody public union
        id: node_bootstrap_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-node-bootstrap-custody-20261028' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --node-bootstrap
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only six native-geometry objects and bounded receipt data
        id: node_geometry_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-node-irq-geometry-20261028' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --node-geometry
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Compile only changed native Node allocating translation units
        if: github.ref == 'refs/heads/test/sdk-738-node-native-capacity-20261028'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --node-capacity
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the closed native Node object union
        id: node_capacity_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-node-native-capacity-20261028' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --node-capacity
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Retain only admitted object evidence
        if: ${{ always() && (steps.admission.outputs.admitted == 'true' || steps.kernfs_admission.outputs.admitted == 'true' || steps.directory_admission.outputs.admitted == 'true' || steps.layout_admission.outputs.admitted == 'true' || steps.post_init_admission.outputs.admitted == 'true' || steps.constructor_mmio_admission.outputs.admitted == 'true' || steps.vp_admission.outputs.admitted == 'true' || steps.msi_admission.outputs.admitted == 'true' || steps.q35_admission.outputs.admitted == 'true' || steps.msi_descriptor_admission.outputs.admitted == 'true' || steps.node_bootstrap_admission.outputs.admitted == 'true' || steps.node_geometry_admission.outputs.admitted == 'true' || steps.node_capacity_admission.outputs.admitted == 'true') }}
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: protected-stream-classdir-objects-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stream-provider-classdir-objects/receipt.json
            ${{ runner.temp }}/stream-provider-classdir-objects/layout.json
            ${{ runner.temp }}/stream-provider-classdir-objects/source-inputs.json
            ${{ runner.temp }}/stream-provider-classdir-objects/derived-inputs.json
            ${{ runner.temp }}/stream-provider-classdir-objects/baseline-inputs.json
            ${{ runner.temp }}/stream-provider-classdir-objects/commands.json
            ${{ runner.temp }}/stream-provider-classdir-objects/baseline.config
            ${{ runner.temp }}/stream-provider-classdir-objects/selected.config
            ${{ runner.temp }}/stream-provider-classdir-objects/generated-autoconf.h
            ${{ runner.temp }}/stream-provider-classdir-objects/ADMISSION.json
            ${{ runner.temp }}/stream-provider-classdir-objects/logs/*.stdout.txt
