name: Protected stream normal C object check
on:
  push:
    branches: ['test/sdk-738-stream-objects-20261026', 'test/sdk-738-classdir-objects-20261026', 'test/sdk-738-classdir-kernfs-objects-20261026', 'test/sdk-738-netdev-directory-objects-20261026', 'test/sdk-738-netdev-layout-objects-20261026']
permissions:
  contents: read
concurrency:
  group: stream-provider-objects-${{ github.ref }}
  cancel-in-progress: false
jobs:
  normal-objects:
    if: github.ref == 'refs/heads/test/sdk-738-stream-objects-20261026'
    name: Eighteen current normal protected C objects without image or boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Capture the original bounded object owner start
        run: |
          python3 -c 'import time; print("STREAM_OBJECT_STARTED=" + str(time.monotonic()))' >> "$GITHUB_ENV"
      - name: Check only the new pure deadline and public-admission controls
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_stream_objects -v
      - name: Compile exactly eighteen current objects through the existing process owner
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-objects"
      - name: Admit the fixed bounded public union before any upload
        id: admission
        if: always()
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py
          --admit --output "$RUNNER_TEMP/stream-provider-objects"
      - name: Retain only admitted object evidence
        if: ${{ always() && steps.admission.outputs.admitted == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-stream-objects-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stream-provider-objects/receipt.json
            ${{ runner.temp }}/stream-provider-objects/source-inputs.json
            ${{ runner.temp }}/stream-provider-objects/derived-inputs.json
            ${{ runner.temp }}/stream-provider-objects/baseline-inputs.json
            ${{ runner.temp }}/stream-provider-objects/commands.json
            ${{ runner.temp }}/stream-provider-objects/baseline.config
            ${{ runner.temp }}/stream-provider-objects/selected.config
            ${{ runner.temp }}/stream-provider-objects/generated-autoconf.h
            ${{ runner.temp }}/stream-provider-objects/ADMISSION.json
            ${{ runner.temp }}/stream-provider-objects/logs/*.stdout.txt
            ${{ runner.temp }}/stream-provider-objects/logs/*.stderr.txt
            ${{ runner.temp }}/stream-provider-objects/objects/**/*.o
      - name: Retain only the bounded admission-failure receipt
        if: ${{ always() && steps.admission.outputs.fallback == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-stream-objects-FAILED-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/stream-provider-objects/FAILED.json
  classdir-objects:
    if: github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026' || github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026'
    name: Changed class-directory translation units without image or boot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Capture the original bounded object owner start
        run: |
          python3 -c 'import time; print("STREAM_OBJECT_STARTED=" + str(time.monotonic()))' >> "$GITHUB_ENV"
      - name: Check only the new fixed classdir source and object-allowlist controls
        if: github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_source_freeze_is_exact_and_preserves_default_source_scope
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_public_gate_refuses_other_original_object_targets -v
      - name: Compile only four changed class-directory translation units
        if: github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only the two new empty-classdir source and nine-target controls
        if: github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_kernfs_freeze_binds_full_projector_and_keeps_historical_modes_closed
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_classdir_kernfs_public_gate_keeps_exact_nine_targets_and_current_only_channels -v
      - name: Compile only nine changed empty-classdir translation units
        if: github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir-kernfs
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only two NETDEV directory source and admission controls
        if: github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_netdev_directory_freeze_preserves_all_fifty_two_sources
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_netdev_directory_public_gate_is_closed_to_nine_changed_targets -v
      - name: Compile only nine changed NETDEV own-directory translation units
        if: github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-directory
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Check only two readonly layout source and ELF controls
        if: github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026'
        run: >-
          python3 -B -m unittest
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_layout_source_freeze_preserves_notify_and_all_prior_modes
          tools.tests.test_host_stream_kernel_stream_objects.StreamObjectOwner.test_layout_elf_refuses_malformed_tables_and_reports_only_incomplete_lower_bound -v
      - name: Compile eleven fixed allocating and notify translation units with readonly data
        if: github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026'
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-layout
          --source-commit "${{ github.sha }}"
          --started "$STREAM_OBJECT_STARTED"
          --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit the fixed bounded public union before any upload
        id: admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-classdir-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the nine-target empty-classdir public union
        id: kernfs_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-classdir-kernfs-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --classdir-kernfs
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the nine-target NETDEV directory public union
        id: directory_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-netdev-directory-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-directory
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Admit only the eleven-target readonly-layout public union
        id: layout_admission
        if: ${{ always() && github.ref == 'refs/heads/test/sdk-738-netdev-layout-objects-20261026' }}
        run: >-
          python3 -B tools/qualify_host_stream_kernel_stream_objects.py --netdev-layout
          --admit --output "$RUNNER_TEMP/stream-provider-classdir-objects"
      - name: Retain only admitted object evidence
        if: ${{ always() && (steps.admission.outputs.admitted == 'true' || steps.kernfs_admission.outputs.admitted == 'true' || steps.directory_admission.outputs.admitted == 'true' || steps.layout_admission.outputs.admitted == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-stream-classdir-objects-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stream-provider-classdir-objects/receipt.json
            ${{ runner.temp }}/stream-provider-classdir-objects/layout.json
            ${{ runner.temp }}/stream-provider-classdir-objects/source-inputs.json
            ${{ runner.temp }}/stream-provider-classdir-objects/derived-inputs.json
            ${{ runner.temp }}/stream-provider-classdir-objects/baseline-inputs.json
            ${{ runner.temp }}/stream-provider-classdir-objects/commands.json
            ${{ runner.temp }}/stream-provider-classdir-objects/baseline.config
            ${{ runner.temp }}/stream-provider-classdir-objects/selected.config
            ${{ runner.temp }}/stream-provider-classdir-objects/generated-autoconf.h
            ${{ runner.temp }}/stream-provider-classdir-objects/ADMISSION.json
            ${{ runner.temp }}/stream-provider-classdir-objects/logs/*.stdout.txt
            ${{ runner.temp }}/stream-provider-classdir-objects/logs/*.stderr.txt
            ${{ runner.temp }}/stream-provider-classdir-objects/objects/**/*.o
      - name: Retain only the bounded admission-failure receipt
        if: ${{ always() && (steps.admission.outputs.fallback == 'true' || steps.kernfs_admission.outputs.fallback == 'true' || steps.directory_admission.outputs.fallback == 'true' || steps.layout_admission.outputs.fallback == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-stream-classdir-objects-FAILED-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/stream-provider-classdir-objects/FAILED.json
