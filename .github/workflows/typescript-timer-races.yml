name: TypeScript timer and AbortSignal races
on:
  push:
    branches: ['feat/typescript-timer-races-20261020']
    paths:
      - '.github/workflows/typescript-timer-races.yml'
      - 'sdk/typescript-guest/probes/timer-races/**'
      - 'tools/typescript_timer_races.py'
      - 'tools/qualify_typescript_timer_races.py'
      - 'tools/tests/test_typescript_timer_races.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-timer-races-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch-conformance:
    name: Signed ordinary timeout abort clear and interval races
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@c1136b2d97fe79ef645e9508b2048a222f50a170 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check scheduling evidence refusal controls
        run: python3 -B -m unittest tools.tests.test_typescript_timer_races -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/timer-races-tools"
      - name: Acquire exact historical import engine and original native tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_fetch_replay_inputs.py --output "$RUNNER_TEMP/timer-races-original"
      - name: Build sign and execute new ordinary timer and AbortSignal cases
        run: python3 -B tools/qualify_typescript_timer_races.py --acquired "$RUNNER_TEMP/timer-races-original" --tools "$RUNNER_TEMP/timer-races-tools" --output "$RUNNER_TEMP/timer-races"
      - name: Retain exact source compiler results real contacts and physical ownership
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-timer-races-${{ github.sha }}
          path: |
            ${{ runner.temp }}/timer-races-original/acquisition.json
            ${{ runner.temp }}/timer-races/*.json
            ${{ runner.temp }}/timer-races/build/*.json
            ${{ runner.temp }}/timer-races/build/*.wit
            ${{ runner.temp }}/timer-races/build/component.wasm
            ${{ runner.temp }}/timer-races/build/package/**
            ${{ runner.temp }}/timer-races/build/logs/
            ${{ runner.temp }}/timer-races/node/*.json
            ${{ runner.temp }}/timer-races/node/controls/
          if-no-files-found: warn
          retention-days: 7
