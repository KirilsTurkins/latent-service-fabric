name: C guest authoring workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-bootstrap.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - name: Locate shared application contracts and descriptor generation
        run: |
          git grep -n -i -E '(greeting|word.count|shipping)' -- wit tools sdk docs website/docs | head -100 || true
          git ls-files | grep -E '(tutorial|teaching|application_workflow|build_provenance|ci_suite_inventory)' | head -80
      - name: Inspect authoritative parser JSON
        run: |
          mkdir -p target/c-authoring-schema
          cat > target/c-authoring-schema/world.wit <<'WIT'
          package examples:authoring@1.0.0;
          interface api {
            record parcel { id: u64, weight: u32, labels: list<string>, }
            variant error { invalid(string), overflow, }
            quote: func(input: parcel) -> result<u64, error>;
          }
          world component { export api; }
          WIT
          wasm-tools component wit target/c-authoring-schema --json
