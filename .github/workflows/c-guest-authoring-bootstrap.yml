name: C guest authoring workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-bootstrap.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.16.0"
      - name: Install verified guest binding generator
        run: python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
      - name: Compile real C guests
        run: python3 sdk/c-guest/tools/compile.py --output "$RUNNER_TEMP/c-guests"
      - name: Inspect integration registration and source profiles
        if: always()
        run: |
          git grep -n 'fixture.*blob\|C_GUEST_BUILD_TYPE\|c-guest/v1' -- crates/latent-signing schemas tools/tests/test_build_provenance.py | head -100
          sed -n '1,180p' tools/ci_coverage.py
          git grep -n 'guest_sdk\|test_guest\|build_guest_capsules' -- .github/workflows/ci.yml tools/ci* | head -80
