name: C guest authoring workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-bootstrap.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: 1.97.1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - name: Test C authoring input boundaries
        run: python3 -m unittest tools.tests.test_c_guest_authoring
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: c-guest-authoring-runtime
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.16.0"
      - name: Install verified guest binding generator
        run: python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
      - name: Check ownership and all locked teaching projects
        run: python3 -m tools.c_guest.qualify --output "$RUNNER_TEMP/c-projects"
      - name: Build current CLI and node
        run: cargo build -p latent -p latentd --all-features --locked
      - name: Export fresh independently signed authored packages
        env:
          LSF_C_AUTHORING_BUILD_ROOT: ${{ runner.temp }}/c-projects
          LSF_C_AUTHORING_FIXTURE_ROOT: ${{ runner.temp }}/c-fixture
        run: cargo test --locked -p latent-wasmtime --test c_guest_authoring -- --ignored --nocapture
      - name: Run authenticated separate-process newcomer workflow with finite limits
        run: python3 -m tools.c_guest.node --cli "$PWD/target/debug/latent" --node "$PWD/target/debug/latentd" --fixture "$RUNNER_TEMP/c-fixture" --output "$RUNNER_TEMP/c-node"
      - name: Check C integration Rust formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p latent-wasmtime --test c_guest_authoring -- -D warnings
