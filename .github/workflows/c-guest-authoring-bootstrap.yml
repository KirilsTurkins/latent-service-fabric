name: C guest authoring workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-bootstrap.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.16.0"
      - name: Install verified guest binding generator
        run: python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
      - name: Compile real C guests
        run: python3 -m tools.c_guest.compiler --output "$RUNNER_TEMP/c-guests"
      - name: Diagnose repository-source compilation only
        if: failure()
        run: |
          for d in "$RUNNER_TEMP"/c-guests/*; do
            test -f "$d/bindings/probe.h" || continue
            name=$(basename "$d")
            source="sdk/c-guest/examples/$name.c"
            if test "$name" = blob; then source=sdk/c-guest/blob.c; fi
            timeout 120s zig cc -std=c11 -target wasm32-wasi -Wall -Wextra -Werror -fsyntax-only -I "$d/bindings" -I sdk/c-guest/include "$source" "$d/bindings/probe.c" || true
          done
