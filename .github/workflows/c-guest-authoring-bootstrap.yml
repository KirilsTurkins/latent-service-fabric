name: C guest authoring workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-bootstrap.yml]
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTUP_TOOLCHAIN: 1.97.1
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: c-guest-authoring-runtime
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 1.254.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.16.0"
      - name: Apply reviewed C runtime integration on the feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/feat/545-c-capsule-authoring
          if test -f tools/c_guest/_integration_patch.py; then
            python3 tools/c_guest/_integration_patch.py
            rm tools/c_guest/_integration_patch.py
            cargo fmt --all
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/build_guest_capsules.py tools/c_guest/_integration_patch.py crates/latent-wasmtime/tests/guest_sdk.rs crates/latent-wasmtime/tests/guest_sdk crates/latent-signing/src/provenance/validate.rs crates/latent-signing/tests/guest_provenance.rs schemas/build-observation.schema.json schemas/package-provenance-statement.schema.json
            git diff --cached --stat
            git commit -m 'feat(c-guest): integrate signed C capability peers and conformance'
            git push origin HEAD:refs/heads/feat/545-c-capsule-authoring
          fi
      - name: Install verified guest binding generator
        run: python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/guest-tools" >> "$GITHUB_PATH"
      - name: Build signed package inputs for both guest languages
        run: python3 tools/build_guest_capsules.py --output "$PWD/target/guest-capsules"
      - name: Execute real admitted C and Rust guests
        env:
          LSF_GUEST_CAPSULES: ${{ github.workspace }}/target/guest-capsules
        run: cargo test --locked -p latent-wasmtime --test guest_sdk -- --ignored --test-threads=1
      - name: Verify exact guest builder policy profiles
        run: cargo test --locked -p latent-signing --test guest_provenance
      - name: Report compiled component sizes
        if: always()
        run: |
          find target/guest-capsules -maxdepth 2 -name component.wasm -printf '%h %s bytes\n' 2>/dev/null || true
