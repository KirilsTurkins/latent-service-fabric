name: C guest authoring workspace
on:
  push:
    branches: [feat/545-c-capsule-authoring]
    paths: [.github/workflows/c-guest-authoring-bootstrap.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Fetch exact locked dependency sources
        run: cargo fetch --locked
      - name: Capture compiler and dependency cache without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/compiler/rust" "$RUNNER_TEMP/compiler/cargo"
          cp -a "$(rustc --print sysroot)/bin" "$(rustc --print sysroot)/lib" "$RUNNER_TEMP/compiler/rust/"
          cp -a "$HOME/.cargo/registry" "$RUNNER_TEMP/compiler/cargo/"
          find "$RUNNER_TEMP/compiler/cargo" -name .git -type d -prune -exec rm -rf {} +
          tar -czf "$RUNNER_TEMP/c-guest-rust.tar.gz" -C "$RUNNER_TEMP/compiler" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c-guest-authoring-rust
          path: ${{ runner.temp }}/c-guest-rust.tar.gz
          if-no-files-found: error
          retention-days: 1
