name: PR 55 requested-change applicator

on:
  push:
    branches:
      - fix/issue-2-build-foundation
    paths:
      - .github/workflows/pr55-requested-changes.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate requested changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-2-build-foundation
          fetch-depth: 0
      - name: Apply requested changes
        run: python3 tools/apply_pr55_requested_changes.py
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock
      - name: Install Python validator dependencies
        run: python -m pip install --requirement tools/requirements.lock
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Validate the patch
        run: |
          unset CARGO_INCREMENTAL
          cargo fmt --all --check
          cargo check -p latent-wasmtime --all-targets --all-features --locked
          python tools/validate_foundation.py
          python -m unittest discover -s tools/tests
          git diff --check
      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/pr55-requested-changes.yml \
            tools/apply_pr55_requested_changes.py
          git add \
            .github/workflows/ci.yml \
            .github/workflows/issue-22-validation.yml \
            .github/workflows/issue-23-validation.yml \
            .github/workflows/issue-24-validation.yml \
            .github/workflows/issue-25-validation.yml \
            crates/latent-wasmtime/build.rs \
            tools/validate_foundation.py \
            tools/tests/phase0_test_environment.py \
            tools/tests/test_phase0_test_environment.py \
            tools/tests/test_validate_repository.py \
            tools/tests/test_aggregate_phase0_calibration.py \
            tools/tests/test_aggregate_phase0_resource_soak.py \
            tools/tests/test_run_phase0_hot_path_profiles.py
          git commit -m "fix: restore build and Phase 0 environment boundaries"
          git push origin HEAD:fix/issue-2-build-foundation
