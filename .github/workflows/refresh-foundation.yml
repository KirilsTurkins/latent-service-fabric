name: Refresh foundation lockfile

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-2-build-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Refresh locked dependencies and formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit generated foundation state
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml crates tools
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh foundation lockfile and formatting"
          git push origin "HEAD:${HEAD_BRANCH}"
