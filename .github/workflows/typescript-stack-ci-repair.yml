name: TypeScript stack CI repair evidence
on:
  push:
    branches: [ci/typescript-stack-ci-repair-20261113]
    paths: [.github/workflows/typescript-stack-ci-repair.yml]
permissions:
  contents: read
concurrency:
  group: typescript-stack-ci-repair-20261113
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/typescript-stack-ci-repair-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Capture primary release metadata and affected action source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'security-inputs';out.mkdir()
          public={
            'go-releases.json':'https://go.dev/dl/?mode=json&include=all',
            'dotnet-releases.json':'https://builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json',
            'fast-xml-5.12.0.json':'https://registry.npmjs.org/fast-xml-parser/5.12.0'
          }
          for name,url in public.items():
              with urllib.request.urlopen(url,timeout=90) as response:data=response.read(16*1024*1024+1)
              assert len(data)<=16*1024*1024
              json.loads(data);(out/name).write_bytes(data)
          names=['cache','deploy-pages','download-artifact','rust-cache','setup-dotnet','setup-go','setup-java','setup-node','setup-python','setup-zig','upload-artifact']
          def api(path):return json.loads(subprocess.check_output(['gh','api',path],timeout=120))
          policy=json.loads(pathlib.Path('.github/security/actions.json').read_text())['actions']
          found={}
          for short in names:
              name='KirilsTurkins/lsf-'+short
              keys=[k for k in policy if k.startswith(name+'@') or k.startswith(name+'/')]
              pins={k.split('@')[1] for k in keys};assert len(pins)==1
              pin=pins.pop()
              metadata=api('repos/'+name);branch=metadata['default_branch']
              current=api('repos/'+name+'/commits/'+branch)
              found[name]={'pin':pin,'defaultBranch':branch,'current':current}
              target=out/('lsf-'+short);target.mkdir()
              subprocess.run(['git','clone','--quiet','--no-checkout','--filter=blob:none','https://github.com/'+name+'.git',str(target/'repo')],check=True)
              subprocess.run(['git','-C',str(target/'repo'),'fetch','--quiet','--depth=1','origin',pin],check=True)
              for path in ['package.json','package-lock.json','action.yml']:
                  data=subprocess.run(['git','-C',str(target/'repo'),'show',pin+':'+path],capture_output=True,check=False)
                  if data.returncode==0:(target/path).write_bytes(data.stdout)
              with (target/'source.tar.gz').open('wb') as f:
                  subprocess.run(['git','-C',str(target/'repo'),'archive','--format=tar.gz',pin],stdout=f,check=True)
              import shutil;shutil.rmtree(target/'repo')
              (out/'owned-actions.json').write_text(json.dumps(found,indent=2))
          print(json.dumps({k:{'pin':v['pin'],'latest':v['current']['sha']} for k,v in found.items()},indent=2))
          PY
      - name: Retain exact security inputs
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: typescript-security-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/security-inputs/
          retention-days: 7
          if-no-files-found: error
