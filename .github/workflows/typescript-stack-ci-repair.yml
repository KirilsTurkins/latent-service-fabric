name: TypeScript stack CI repair evidence
on:
  push:
    branches: [ci/typescript-stack-ci-repair-20261113]
    paths: [.github/workflows/typescript-stack-ci-repair.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: typescript-stack-ci-repair-20261113
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/typescript-stack-ci-repair-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Capture actual trees, signed Go fixture metadata and owned action revisions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'repair-inputs'
          out.mkdir()
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path], timeout=120))
          repo='repos/KirilsTurkins/latent-service-fabric/'
          heads={'1852':'68bd53e20eeeae109f7816c8e81a1f959158a93b','1931':'c994185a24cdaa1de36b6b1e325d8c1753979254','1934':'5bb73cf78320c3f130d89f47b8ceb48f24abd4ee'}
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',*heads.values()],check=True)
          for name,sha in heads.items():
              (out/(name+'-tree.txt')).write_bytes(subprocess.check_output(['git','ls-tree','-r','--full-tree',sha]))
          artifacts=api(repo+'actions/runs/43309461902/artifacts?per_page=100')
          (out/'go-fixture-artifacts.json').write_text(json.dumps(artifacts,indent=2))
          policy=json.loads(pathlib.Path('.github/security/actions.json').read_text())['actions']
          found={}
          for key in policy:
              name='/'.join(key.split('@')[0].split('/')[:2])
              if name in found or not name.startswith('KirilsTurkins/lsf-'): continue
              metadata=api('repos/'+name)
              branch=metadata['default_branch']
              current=api('repos/'+name+'/commits/'+branch)
              found[name]={'pin':key.split('@')[1],'defaultBranch':branch,'current':current}
              (out/(name.split('/')[1]+'-package.json')).write_bytes(subprocess.check_output(['gh','api','repos/'+name+'/contents/package.json?ref='+current['sha'],'--jq','.content | @base64d'],timeout=120))
          (out/'owned-actions.json').write_text(json.dumps(found,indent=2))
          public={
            'go-releases.json':'https://go.dev/dl/?mode=json&include=all',
            'dotnet-releases.json':'https://builds.dotnet.microsoft.com/dotnet/release-metadata/8.0/releases.json',
            'fast-xml-5.12.0.json':'https://registry.npmjs.org/fast-xml-parser/5.12.0'
          }
          for name,url in public.items():
              with urllib.request.urlopen(url,timeout=90) as response:data=response.read(16*1024*1024+1)
              assert len(data)<=16*1024*1024
              json.loads(data)
              (out/name).write_bytes(data)
          print('Captured exact tree manifests and primary release metadata.')
          PY
      - name: Retain authenticated inspection inputs
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        with:
          name: typescript-ci-repair-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/repair-inputs/
          retention-days: 7
          if-no-files-found: error
