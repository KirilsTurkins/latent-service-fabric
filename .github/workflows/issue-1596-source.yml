name: Issue 1596 implementation support
on:
  push:
    branches: [ci/1596-implementation-support]
    paths: [.github/issue-1596-*.py, .github/workflows/issue-1596-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          path: support
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8
        with:
          persist-credentials: false
          ref: ci/1596-discovery-owned-tests
          path: work
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb
        with:
          python-version: '3.13.5'
      - name: Inspect implementation boundaries
        working-directory: work
        run: PYTHONPATH="$PWD" python ../support/.github/issue-1596-edit.py
