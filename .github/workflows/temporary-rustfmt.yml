name: Apply Issue 22 rustfmt

on:
  push:
    branches:
      - feat/issue-22-containment-runner

permissions:
  contents: write

concurrency:
  group: issue-22-rustfmt
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-containment-runner
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check

          if git diff --quiet; then
            echo "All Rust sources were already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format issue 22 implementation"
          git push origin HEAD:feat/issue-22-containment-runner
