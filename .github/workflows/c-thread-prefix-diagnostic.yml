name: Retained C thread prefix diagnostic

on:
  push:
    branches: ['diag/c-thread-prefix-20261022']
    paths:
      - '.github/workflows/c-thread-prefix-diagnostic.yml'
      - 'tools/c_thread_prefix_inputs.py'
      - 'tools/diagnose_c_thread_prefix.py'
      - 'tools/tests/test_c_thread_prefix.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: c-thread-prefix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retained-prefix:
    name: Three retained C observations without qualification or compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Fetch exact original compilation and native source objects
        run: |
          git fetch --no-tags --depth=1 origin d9283fd957fce5999a8302aeb4dc811921d83622
          git fetch --no-tags --depth=1 origin 7b6365ee39dea9770591a931b96711965f8a1aaf
      - name: Check fixed origin and source-restoration controls
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_c_thread_prefix -v
      - name: Authenticate unchanged native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/host_codec_native_products.py --output "$RUNNER_TEMP/c-prefix-native"
      - name: Restore original C component and observe at most three calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/diagnose_c_thread_prefix.py --prepared "$RUNNER_TEMP/c-prefix-native" --output "$RUNNER_TEMP/c-prefix"
      - name: Retain bounded original bytes and diagnostic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-thread-prefix-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c-prefix/*.json
            ${{ runner.temp }}/c-prefix/*.txt
            ${{ runner.temp }}/c-prefix/controls/*.json
            ${{ runner.temp }}/c-prefix/commands/logs/*.txt
            ${{ runner.temp }}/c-prefix/original/artifact.zip
            ${{ runner.temp }}/c-prefix/original/contents/*.json
            ${{ runner.temp }}/c-prefix/original/contents/build/*.json
            ${{ runner.temp }}/c-prefix/original/contents/build/component.wasm
            ${{ runner.temp }}/c-prefix/original/contents/build/wit/**
            ${{ runner.temp }}/c-prefix/original/contents/node/*.json
          retention-days: 7
