name: PR 2151 exact integration and fanout diagnosis
on:
  push:
    branches: [diagnostic/pr2151-integration-fanout-20261121]
    paths: [.github/workflows/pr2151-integration-fanout-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: pr2151-integration-fanout-diagnostic
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-java@8aaa4ea8191b36cb3f394e91d099da0d31dc02c2
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
      - name: Construct a two-parent tree from exact existing heads only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=96 origin 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76 7c830598ca437279a8eead344aae5945bffb5bcf
          test "$(git merge-base 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76 7c830598ca437279a8eead344aae5945bffb5bcf)" = ce32c865a7f0870b488ea9d8651fddd68adbd1a4
          git merge-tree --write-tree 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76 7c830598ca437279a8eead344aae5945bffb5bcf | tee "$RUNNER_TEMP/pr2151-merge-tree.txt"
          tree="$(head -n 1 "$RUNNER_TEMP/pr2151-merge-tree.txt")"
          git config user.name 'LSF integration validation'
          git config user.email 'lsf-integration@users.noreply.github.com'
          commit="$(git commit-tree "$tree" -p 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76 -p 7c830598ca437279a8eead344aae5945bffb5bcf -m 'Integrate the authenticated Wasmtime 48.0.9 security prerequisite into cached handoff work')"
          git checkout --detach "$commit"
          test ! -e .github/workflows/pr2151-integration-fanout-diagnostic.yml
          printf '%s\n' "$commit" > "$RUNNER_TEMP/pr2151-integrated-commit.txt"
          git diff --check 4a9e488359a7c40e0fc3309260c0d09c4a9d8f76 "$commit"
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          a='4a9e488359a7c40e0fc3309260c0d09c4a9d8f76'; b='7c830598ca437279a8eead344aae5945bffb5bcf'; base='ce32c865a7f0870b488ea9d8651fddd68adbd1a4'
          changed={side:set(git('diff','--name-only',base,side).splitlines()) for side in (a,b)}
          rows=[]
          for name in sorted(changed[a]|changed[b]):
              def blob(ref):
                  r=subprocess.run(['git','rev-parse',ref+':'+name],text=True,capture_output=True)
                  return r.stdout.strip() if r.returncode==0 else None
              original=blob(base); left=blob(a); right=blob(b); combined=blob('HEAD')
              if name not in changed[b]: assert combined==left, name
              if name not in changed[a]: assert combined==right, name
              if left==right: assert combined==left, name
              rows.append({'path':name,'base':original,'java':left,'security':right,'combined':combined})
          record={'parents':[a,b],'mergeBase':base,'commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'conflicts':False,'paths':rows,'validation':'pending','productionBranchUpdated':False}
          Path(os.environ['RUNNER_TEMP'],'pr2151-integration.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Validate combined source controls with pinned JDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          python3 -B -m unittest tools.tests.test_java_compiler_acquisition tools.tests.test_java_dependency_suite tools.tests.test_java_resource_runtime tools.tests.test_java_standard_http_ownership tools.tests.test_java_teavm_failure_trace -v 2>&1 | tee "$RUNNER_TEMP/pr2151-focused.log"
          python3 -B -m unittest discover -s sdk/java-guest/tests -v 2>&1 | tee "$RUNNER_TEMP/pr2151-sdk.log"
          python3 -B tools/validate_repository.py 2>&1 | tee "$RUNNER_TEMP/pr2151-repository.log"
          python3 -B tools/ci_coverage.py --receipt "$RUNNER_TEMP/pr2151-inventory.json"
          git diff --exit-code
      - name: Publish only the validated exact-parent candidate on an isolated ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(cat "$RUNNER_TEMP/pr2151-integrated-commit.txt")"
          test "$(git rev-parse HEAD)" = "$commit"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force-with-lease=refs/heads/diagnostic/pr2151-integrated-tree-20261121: origin "$commit:refs/heads/diagnostic/pr2151-integrated-tree-20261121"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'],'pr2151-integration.json');r=json.loads(p.read_text());r['validation']='passed';r['publishedRef']='diagnostic/pr2151-integrated-tree-20261121';p.write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps({k:v for k,v in r.items() if k!='paths'}))
          PY
      - name: Retain exact integration identities and validation output
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-integration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr2151-merge-tree.txt
            ${{ runner.temp }}/pr2151-integrated-commit.txt
            ${{ runner.temp }}/pr2151-integration.json
            ${{ runner.temp }}/pr2151-focused.log
            ${{ runner.temp }}/pr2151-sdk.log
            ${{ runner.temp }}/pr2151-repository.log
            ${{ runner.temp }}/pr2151-inventory.json
          retention-days: 7
          if-no-files-found: error
  fanout-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 41e3152062e077986283b83e80ab072746f5b5bb
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: false
      - name: Install the existing private observer prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement tools/requirements.lock
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          artifact-ids: 14579171039
          run-id: 44609932406
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fanout-failure
          merge-multiple: true
          digest-mismatch: error
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          artifact-ids: 14577653153
          run-id: 44609932406
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fanout-native
          merge-multiple: true
          digest-mismatch: error
      - name: Bind the existing numeric observer to this exact retained failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path('tools/diagnose_typescript_fetch_failure.py'); raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='10bf399a6f9a45155b8e7c28331427d4ed312dd32d8fe942684b0d476d00a93e'
          source=raw.decode()
          replacements={
            "TESTED = 'ba62bf8f266e589971a03e496b18b8f2cb5e5d85'":"TESTED = '41e3152062e077986283b83e80ab072746f5b5bb'",
            'sha256:1ec1e87b2262e20b2b00139f2e29bf89f2fa922b056cb0b5dc84cc1ef1e2f755':'sha256:82dbecdd8fbc29e4aae92a60927e36ce0e4b11dd8448be543e0ddacf8bee3fd2',
            "'bytes': 12341403":"'bytes': 12431410",
            'sha256:d55a397c3998e283356c0da054037e075194bae60d2dcc8c2830826baf8c1c89':'sha256:7a4c4d5a19954fb7f35342e5a7dcb84e4b994b2d16fdbf25a95a6173ab318083',
            'sha256:d3fe0cc024f4da295af558923ecf547204ee46d36f200a7f47a813d6e369b684':'sha256:a26b6c6b6a00c8e69981d2382030bf3719baee160c732444af345d4530e9da92',
            "'compatibility-report.json', 'typescript-runtime-selection.json', 'package-source.json',":"'compatibility-report.json', 'typescript-runtime-selection.json', 'typescript-entropy-selection.json', 'package-source.json',",
            '[0, f"http://{origin[\'host\']}:{origin[\'port\']}/conformance/json"], \'fetch-json\')':'[31, f"http://{origin[\'host\']}:{origin[\'port\']}/conformance/json"], \'fetch-abort-fanout\')',
          }
          for old,new in replacements.items():
              assert source.count(old)==1,old
              source=source.replace(old,new)
          assert hashlib.sha256(source.encode()).hexdigest()=='dca0455b95966f046d836646239d20ec693c3795212e82db7a810db96001f9fe'
          Path(os.environ['RUNNER_TEMP'],'diagnose-pr2151-fanout.py').write_text(source)
          PY
          chmod u+x "$RUNNER_TEMP/fanout-native/native-binaries/"*
      - name: Prepare the exact ordinary host build before private overlay compilation
        run: cargo --config .cargo/managed-guest.toml build --locked -p latentd --bin latentd
      - name: Observe only numeric frames from the unchanged failed signed component
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/diagnose-pr2151-fanout.py" --attempt "$RUNNER_TEMP/fanout-failure" --native "$RUNNER_TEMP/fanout-native" --output "$RUNNER_TEMP/fanout-frames"
          git diff --exit-code
      - name: Retain only closed observations and original public CLI rows
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pr2151-fanout-frames-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fanout-frames/observation.json
            ${{ runner.temp }}/fanout-frames/node/observation.json
            ${{ runner.temp }}/fanout-frames/node/controls/*.json
          if-no-files-found: warn
          retention-days: 7
