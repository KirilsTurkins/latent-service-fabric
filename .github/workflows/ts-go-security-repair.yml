name: TypeScript stack Go security prerequisite
on:
  push:
    branches: [ci/ts-stack-security-20261113]
    paths: [.github/workflows/ts-go-security-repair.yml]
permissions:
  contents: write
concurrency:
  group: ts-go-security-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/ci/ts-stack-security-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LSF_REQUIRE_COMPILER_ISOLATION: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@164c4cbba5d1b03a046ac8bc25ae695bee0667a8
        with:
          python-version: 3.13.5
      - run: python3 -m pip install -r tools/requirements.lock
      - name: Install required generator containment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Authenticate upstream Go compiler bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 --output "$RUNNER_TEMP/go-security.tar.gz" https://dl.google.com/go/go1.27.4.linux-amd64.tar.gz
          echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  $RUNNER_TEMP/go-security.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/go-distribution"
          tar -xzf "$RUNNER_TEMP/go-security.tar.gz" -C "$RUNNER_TEMP/go-distribution"
      - name: Prepare and validate Go security patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-security-evidence"
          python3 .github/maintenance/go_security_repair.py build 2>&1 | tee "$RUNNER_TEMP/go-security-evidence/validation.log"
      - name: Export verified Git objects without changing existing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/maintenance/go_security_repair.py upload
      - name: Retain exact candidate and diagnostics
        if: always()
        run: python3 .github/maintenance/go_security_repair.py collect
      - uses: KirilsTurkins/lsf-upload-artifact@d74a697ce553b389f4219545e07c97fb8542c64f
        if: always()
        with:
          name: go-security-evidence
          path: ${{ runner.temp }}/go-security-evidence/
          retention-days: 7
          if-no-files-found: error
