name: Rust original-core bounded delta diagnostic
on:
  push:
    branches: ['diag/rust-original-delta-20261105']
    paths:
      - '.github/workflows/rust-original-delta-diagnostic.yml'
      - 'crates/latent-component-threading/src/rust_original_delta.rs'
      - 'crates/latent-component-threading/src/rust_component.rs'
      - 'crates/latent-component-threading/src/rust_catalogue/combined-original-delta.bin'
      - 'tools/rust_original_delta.py'
permissions:
  contents: read
concurrency:
  group: rust-original-delta-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  delta-proof:
    name: Bounded reconstruction and fixed graph source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - name: Recreate the original-core delta and execute bounded Rust controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-original-delta"
          catalog=crates/latent-component-threading/src/rust_catalogue
          python3 -B tools/rust_original_delta.py --original "$catalog/combined-original-core.wasm" --base "$catalog/combined-final-component.wasm" --output "$RUNNER_TEMP/rust-original-delta/reconstructed.bin" | tee "$RUNNER_TEMP/rust-original-delta/generator.log"
          cmp "$RUNNER_TEMP/rust-original-delta/reconstructed.bin" "$catalog/combined-original-delta.bin"
          cargo test --locked -p latent-component-threading --lib --features rust-http-combined-preview-diagnostic rust_original_delta::tests:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/rust-original-delta/tests.log"
          grep -F 'test rust_original_delta::tests::fixed_real_delta_reconstructs_and_still_requires_full_source_proof ... ok' "$RUNNER_TEMP/rust-original-delta/tests.log"
          grep -F 'test rust_original_delta::tests::malformed_ranges_lengths_commands_and_trailing_data_fail_closed ... ok' "$RUNNER_TEMP/rust-original-delta/tests.log"
          grep -F 'test rust_original_delta::tests::fixed_graph_roundtrips_final_section_and_rejects_nonfinal_or_forged_material ... ok' "$RUNNER_TEMP/rust-original-delta/tests.log"
      - name: Retain bounded diagnostic outputs including failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-original-delta-diagnostic-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/rust-original-delta/*.log
