name: Diagnose Issue 22 contract gate

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: issue-22-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-22-containment-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install Python validator dependencies
        run: python -m pip install --requirement tools/requirements.lock

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2,wasm32-unknown-unknown

      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.254.0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0

      - name: Apply the reviewed correction bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/lsf22-correction.part00 \
            .github/lsf22-correction.part01 \
            .github/lsf22-correction.part02 \
            .github/lsf22-correction.part03 \
            .github/lsf22-correction.part04 \
            .github/lsf22-correction.part05 \
            .github/lsf22-correction.part06 \
            > /tmp/issue-22-corrections.b64
          echo "670de04897df755799af1b1882851bc4f969ec23625bb1801d38bf7c61c52ce2  /tmp/issue-22-corrections.b64" | sha256sum --check
          base64 --decode /tmp/issue-22-corrections.b64 | gzip --decompress > /tmp/issue-22-corrections.patch
          git apply --check /tmp/issue-22-corrections.patch
          git apply /tmp/issue-22-corrections.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/latent-node/tests/activation_runner.rs")
          source = path.read_text(encoding="utf-8")
          impossible_prefix = (
              '"engine-detailengine-detailengine-detailengine-detailengine-detail",'
          )
          bounded_prefix = (
              '"engine-detailengine-detailengine-detailengine-detailengine-detai",'
          )
          if source.count(impossible_prefix) != 1:
              raise SystemExit(
                  "expected exactly one 65-byte engine diagnostic prefix assertion"
              )
          path.write_text(
              source.replace(impossible_prefix, bounded_prefix, 1),
              encoding="utf-8",
          )
          PY
          cargo fmt --all
          git diff --check

      - name: Diagnose the real Component Model containment gate
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set +e
          tools/validate_contracts.sh > /tmp/validate-contracts.log 2>&1
          status=$?
          echo "=== VALIDATE_CONTRACTS_EXIT=${status} ==="
          echo "=== FAILURE MARKERS ==="
          grep -nE 'FAILED|failures:|panicked at|assertion failed|error: test failed|error\[' /tmp/validate-contracts.log | tail -n 80 || true
          echo "=== FINAL 220 LINES ==="
          tail -n 220 /tmp/validate-contracts.log
          exit "${status}"
