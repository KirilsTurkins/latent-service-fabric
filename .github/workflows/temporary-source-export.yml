name: Inspect Issue 22 timeout fixtures

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue-22-containment-runner'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply bundle and print timeout-related source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/lsf22-correction.part00 \
            .github/lsf22-correction.part01 \
            .github/lsf22-correction.part02 \
            .github/lsf22-correction.part03 \
            .github/lsf22-correction.part04 \
            .github/lsf22-correction.part05 \
            .github/lsf22-correction.part06 \
            > /tmp/issue-22-corrections.b64
          echo "670de04897df755799af1b1882851bc4f969ec23625bb1801d38bf7c61c52ce2  /tmp/issue-22-corrections.b64" | sha256sum --check
          base64 --decode /tmp/issue-22-corrections.b64 | gzip --decompress > /tmp/issue-22-corrections.patch
          git apply --check /tmp/issue-22-corrections.patch
          git apply /tmp/issue-22-corrections.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/latent-node/tests/activation_runner.rs")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '"engine-detailengine-detailengine-detailengine-detailengine-detail",',
              '"engine-detailengine-detailengine-detailengine-detailengine-detai",',
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
          echo '=== containment_backend 90-190 ==='
          nl -ba crates/latent-wasmtime/tests/containment_backend.rs | sed -n '90,190p'
          echo '=== containment_backend 280-340 ==='
          nl -ba crates/latent-wasmtime/tests/containment_backend.rs | sed -n '280,340p'
          echo '=== containment_backend 500-590 ==='
          nl -ba crates/latent-wasmtime/tests/containment_backend.rs | sed -n '500,590p'
          echo '=== containment_backend 780-840 ==='
          nl -ba crates/latent-wasmtime/tests/containment_backend.rs | sed -n '780,840p'
          echo '=== timeout/fuel references ==='
          grep -nE 'deadline|fuel|INFINITE|infinite|epoch' crates/latent-wasmtime/tests/containment_backend.rs | head -n 180
          echo '=== runner timeout/fuel references ==='
          grep -nE 'deadline|fuel|ResourceExhausted|DeadlineExceeded' crates/latent-node/src/activation_runner.rs | head -n 180
