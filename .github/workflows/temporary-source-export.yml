name: Temporary source export

on:
  push:
    branches:
      - feat/issue-22-containment-runner
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: tar --exclude=.git --exclude=target -czf /tmp/lsf22-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lsf22-source-${{ github.sha }}
          path: /tmp/lsf22-source.tar.gz
          if-no-files-found: error
          retention-days: 1
