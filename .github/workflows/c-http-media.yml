name: C ordinary HTTP exact media type

on:
  workflow_dispatch:
  push:
    branches: ['feat/sdk-690-c-http-media-20261104']
    paths:
      - '.github/workflows/c-http-media.yml'
      - 'tools/c_http_media_node.py'
      - 'tools/c_http_media_peer.py'
      - 'tools/qualify_c_http_media.py'
      - 'tools/tests/test_c_http_media_peer.py'
      - 'tools/wasmtime_48_0_8_678b_native_products.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: c-http-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-media:
    if: github.repository == 'KirilsTurkins/latent-service-fabric' && github.ref == 'refs/heads/feat/sdk-690-c-http-media-20261104' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: One signed original C POST with exact media observation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Make the immutable native producer source available for verification
        run: git fetch --no-tags --depth=1 origin 678b19d42b26a12ac35f3d6de525029b82e169f7
      - name: Check the exact private media observation
        run: python3 -B -m unittest tools.tests.test_c_http_media_peer -v
      - name: Authenticate the fixed native products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/wasmtime_48_0_8_678b_native_products.py --output "$RUNNER_TEMP/c-media-native"
      - name: Re-sign and execute one retained original POST
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: python3 -B tools/qualify_c_http_media.py --native "$RUNNER_TEMP/c-media-native" --output "$RUNNER_TEMP/c-http-media" --expected-head "$EXPECTED_HEAD"
      - name: Retain bounded public observations
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: c-http-media-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c-media-native/*.json
            ${{ runner.temp }}/c-http-media/qualified.json
            ${{ runner.temp }}/c-http-media/FAILED.json
            ${{ runner.temp }}/c-http-media/node/qualified.json
            ${{ runner.temp }}/c-http-media/node/FAILED.json
            ${{ runner.temp }}/c-http-media/node/media-observation.json
            ${{ runner.temp }}/c-http-media/node/invocation-*.json
            ${{ runner.temp }}/c-http-media/node/peer-*.json
            ${{ runner.temp }}/c-http-media/node/retirement-*.json
            ${{ runner.temp }}/c-http-media/node/controls/**
            ${{ runner.temp }}/c-http-media/node/commands/logs/**
