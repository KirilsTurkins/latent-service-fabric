name: Rust combined HTTP and ThreadPool source diagnostic
on:
  push:
    branches: ['feat/rust-http-thread-20261104', 'fix/rust-http-bindgen-20261104', 'fix/rust-http-wac11-20261104', 'fix/rust-http-thread-validation-20261104']
    paths:
      - '.github/workflows/rust-http-thread-composition-diagnostic.yml'
      - 'tools/compile_rust_thread_http_sibling.py'
      - 'tools/rust_thread_http_sibling_*.py'
      - 'tools/tests/test_rust_thread_http_sibling*.py'
      - 'tools/rust_wasi_http_compose.py'
      - 'tools/rust_wasi_http_root.py'
      - 'tools/tests/test_rust_wasi_http_bindgen.py'
      - 'tools/rust_wasi_http_inputs.py'
      - 'tools/rust_owned_thread_component.py'
      - 'tools/toolchain.toml'
      - 'sdk/rust-standard-runtime/**'
permissions:
  contents: read
concurrency:
  group: rust-http-thread-composition-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Capture one unadmitted composed HTTP and ThreadPool graph
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@14de4ddb02861c1e098a1a260a2de7a6b45b68fb # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@fdae00b14e855eb751452bc70c64dde286270415 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: KirilsTurkins/lsf-rust-cache@476b290465f7c84db317df6e6a6e2d3c12ea3477 # v2.9.3 + upstream changes + LSF security fixes
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - uses: KirilsTurkins/lsf-setup-zig@e064b42fa88ad0859d8b54838b44f672ffd5ea7a # v2.2.1 + upstream changes + LSF security fixes
        with:
          version: '0.16.0'
      - name: Prepare the existing bounded compiler namespace and binding tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m pip install --requirement tools/requirements.lock
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/rust-http-thread-tools"
          echo "$RUNNER_TEMP/rust-http-thread-tools" >> "$GITHUB_PATH"
      - name: Check causal gates and the explicit async WIT layout controls
        run: >-
          python3 -B -m unittest tools.tests.test_rust_thread_http_sibling
          tools.tests.test_rust_thread_http_sibling_compiler
          tools.tests.test_rust_thread_http_sibling_retention
          tools.tests.test_rust_wasi_http_bindgen -v
      - name: Acquire the fixed diagnostic-only component composer
        run: |
          mkdir -p "$RUNNER_TEMP/rust-http-thread-composer"
          curl --fail --location --max-time 180 https://github.com/bytecodealliance/wac/releases/download/v0.11.0/wac-cli-x86_64-unknown-linux-musl --output "$RUNNER_TEMP/rust-http-thread-composer/wac"
          printf '%s  %s\n' 83259349b630f79a60490322b068e7ad2dba784720b0d467decccc0aecc743b5 "$RUNNER_TEMP/rust-http-thread-composer/wac" | sha256sum --check --strict
          test "$(stat --format=%s "$RUNNER_TEMP/rust-http-thread-composer/wac")" -eq 22917648
          chmod 0700 "$RUNNER_TEMP/rust-http-thread-composer/wac"
      - name: Acquire only the locked current SDK compiler inputs
        run: cargo fetch --locked --target wasm32-unknown-unknown --target x86_64-unknown-linux-gnu
      - name: Build current owned thread sysroot and context utility
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: >-
          python3 -B tools/compile_rust_owned_thread_inputs.py
          --expected-head "$EXPECTED_HEAD" --rust-bin "$(dirname "$(rustup which rustc)")"
          --output "$RUNNER_TEMP/rust-http-thread-owned"
      - name: Build the current source-bound standard HTTP backend
        run: python3 -B tools/rust_wasi_http_inputs.py --output "$RUNNER_TEMP/rust-http-thread-http"
      - name: Build and identify the current contracts helper
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: >-
          python3 -B tools/rust_thread_http_sibling_contracts.py
          --expected-head "$EXPECTED_HEAD" --rust-bin "$(dirname "$(rustup which rustc)")"
          --output "$RUNNER_TEMP/rust-http-thread-contracts"
      - name: Capture the actual unadmitted composed graph
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: >-
          python3 -B tools/compile_rust_thread_http_sibling.py
          --expected-head "$EXPECTED_HEAD" --rust-bin "$(dirname "$(rustup which rustc)")"
          --owned-sysroot "$RUNNER_TEMP/rust-http-thread-owned/owned-sysroot"
          --context-tool "$RUNNER_TEMP/rust-http-thread-owned/tool/rust-context"
          --owned-report "$RUNNER_TEMP/rust-http-thread-owned/report.json"
          --owned-source "$RUNNER_TEMP/rust-http-thread-owned/source-inputs.json"
          --http-runtime "$RUNNER_TEMP/rust-http-thread-http"
          --diagnostic-composer "$RUNNER_TEMP/rust-http-thread-composer/wac"
          --contracts-tool "$RUNNER_TEMP/rust-http-thread-contracts/capsule_contracts"
          --contracts-receipt "$RUNNER_TEMP/rust-http-thread-contracts/report.json"
          --output "$RUNNER_TEMP/rust-http-thread-combined"
      - name: Admit bounded public source, compiler and failure observations
        if: always()
        run: >-
          python3 -B tools/rust_thread_http_sibling_retention.py
          --root "$RUNNER_TEMP" --output "$RUNNER_TEMP/rust-http-thread-public"
      - name: Retain the bounded public diagnostic artifact
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@5c42799caf30eda69cb2db5da0be2400c47cef16 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: rust-http-thread-composition-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/rust-http-thread-public/**
          if-no-files-found: error
          retention-days: 7
