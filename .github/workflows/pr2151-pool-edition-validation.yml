name: PR 2151 Rust 2021 pool observation validation
on:
  push:
    branches: [diag/pr2151-native-pressure-20261121]
    paths: [.github/workflows/pr2151-pool-edition-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: true
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: true
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 019b8d3d6a4ceae36d680abe2b1c4664eb54cc84
          path: controls
          persist-credentials: false
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: fb0feebc63b302c63c0e37791da735ca476607c8
          path: source
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: KirilsTurkins/lsf-rust-cache@653972653a76770ab9b45cca67e4db8221bed334
        with:
          workspaces: source -> target
          cache-bin: false
          cache-targets: true
          cache-workspace-crates: false
          shared-key: host-correctness
          prefix-key: lsf-ci-dependencies-v2
      - name: Apply immutable repair and verify only Rust 2021 formatting changes
        run: |
          set -euo pipefail
          python3 -m pip install --requirement source/tools/requirements.lock
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, tomllib, yaml
          doc=yaml.safe_load(pathlib.Path('controls/.github/workflows/pr2151-pool-observation-validation.yml').read_text())
          steps=doc['jobs']['validate']['steps']
          apply=next(s['run'] for s in steps if s.get('name')=='Apply the exact test-only observer repair')
          subprocess.run(['bash','-e','-o','pipefail','-c',apply],cwd='source',check=True)
          assert tomllib.loads(pathlib.Path('source/Cargo.toml').read_text())['workspace']['package']['edition']=='2021'
          p=pathlib.Path('source/crates/latent-streams/src/tests/lifecycle.rs')
          before=p.read_bytes()
          subprocess.run(['rustfmt','--edition','2021',str(p)],check=True)
          after=p.read_bytes()
          assert b''.join(before.split())==b''.join(after.split())
          assert len(after)==77927
          assert hashlib.sha1(b'blob '+str(len(after)).encode()+b'\0'+after).hexdigest()=='7c68f3ce945bd0d527ba0f8486681494bfe79834'
          test=next(s['run'] for s in steps if s.get('name')=='Require repository formatting and run every original provider unit test')
          assert test.count('--edition 2024')==1
          test=test.replace('--edition 2024','--edition 2021')
          subprocess.run(['bash','-e','-o','pipefail','-c',test],cwd='source',check=True)
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pool-observer-postimage
          path: ${{ runner.temp }}/pool-observer-lifecycle.rs
          if-no-files-found: error
          retention-days: 3
      - if: always()
        uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pool-observer-logs
          path: ${{ runner.temp }}/pool-observer-*.log
          if-no-files-found: warn
          retention-days: 3
  blob:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 019b8d3d6a4ceae36d680abe2b1c4664eb54cc84
          path: controls
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@e0788870ab0f74690a1d3f187ba206c395748aee
        with:
          python-version: 3.13.5
      - run: python3 -m pip install PyYAML==6.0.3
      - uses: KirilsTurkins/lsf-download-artifact@fc27fb5305d2042f110912a9d6a2924a98084389
        with:
          name: pool-observer-postimage
          path: postimage
          digest-mismatch: error
      - name: Publish exact validated test blob without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, yaml
          doc=yaml.safe_load(pathlib.Path('controls/.github/workflows/pr2151-pool-observation-validation.yml').read_text())
          script=next(s['run'] for s in doc['jobs']['blob']['steps'] if s.get('name')=='Publish the validated test blob without moving a ref')
          for before,after in [('77916','77927'),('9361d75f2a91ea73947f0a519b4d57ddc6a7a673','7c68f3ce945bd0d527ba0f8486681494bfe79834')]:
              assert script.count(before)==1
              script=script.replace(before,after)
          subprocess.run(['bash','-e','-o','pipefail','-c',script],check=True)
          PY
      - uses: KirilsTurkins/lsf-upload-artifact@c37718fd4e24a4c372572ce4f21b3969a72ba8dc
        with:
          name: pool-observer-published-blob
          path: pool-observer-blob.json
          if-no-files-found: error
          retention-days: 3
