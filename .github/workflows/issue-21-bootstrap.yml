name: Issue 21 implementation bootstrap

on:
  push:
    branches:
      - feat/issue-21-wasmtime-echo
  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-21-wasmtime-echo
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Materialize implementation
        shell: bash
        run: |
          cat tools/issue21-payload/part-* | tr -d '\n' | base64 --decode > /tmp/issue-21.tar.gz
          printf '%s  %s\n' \
            'f0f3bcf60a2aa9e9befb8b7a9399abbb111e707dbf52acd82a3381fd438aec52' \
            '/tmp/issue-21.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/issue-21.tar.gz --directory .
      - name: Refresh locked dependency graph
        run: cargo generate-lockfile
      - name: Format implementation
        run: cargo fmt --all
      - name: Check implementation
        run: cargo check -p latent-wasmtime --all-targets --all-features --locked
      - name: Lint implementation
        run: cargo clippy -p latent-wasmtime --all-targets --all-features --locked -- -D warnings
      - name: Test implementation
        run: cargo test -p latent-wasmtime --all-targets --all-features --locked
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/issue-21-bootstrap.yml
          git rm -r -- tools/issue21-payload
          git add -- \
            Cargo.lock \
            .github/workflows/ci.yml \
            crates/latent-wasmtime/Cargo.toml \
            crates/latent-wasmtime/build.rs \
            crates/latent-wasmtime/src/lib.rs \
            crates/latent-wasmtime/src/bindings.rs \
            crates/latent-wasmtime/src/runtime.rs \
            crates/latent-wasmtime/tests/echo_backend.rs \
            docs/architecture/wasmtime-phase-0.md
          git commit -m 'feat: implement the Phase 0 Wasmtime echo backend'
          git push origin HEAD:feat/issue-21-wasmtime-echo
