name: Verify exact security integration postimages
on:
  push:
    branches: [ci/typescript-security-refresh-20261113]
    paths: [.github/workflows/ts-security-integrate-retry.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 68bd53e20eeeae109f7816c8e81a1f959158a93b
          fetch-depth: 1
          persist-credentials: false
      - name: Load immutable reviewed integration steps
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 https://raw.githubusercontent.com/KirilsTurkins/latent-service-fabric/617073e91b14dba06798417c378f30fad2e1d5e8/.github/workflows/ts-security-integrate.yml -o "$RUNNER_TEMP/reviewed.yml"
          python3 - <<'PY'
          import os,pathlib,yaml
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          steps=yaml.safe_load((root/'reviewed.yml').read_text())['jobs']['prepare']['steps']
          for i in (1,2,3):
              script=steps[i]['run']
              if i==2:
                  marker='assert digest==expected,(digest,expected)'
                  assert script.count(marker)==1
                  script=script.replace(marker,"out=pathlib.Path(os.environ['RUNNER_TEMP'])/'integration-receipt';out.mkdir(exist_ok=True)\n(out/'actual-postimages.json').write_text(json.dumps(actual,indent=2)+'\\n')\n"+marker)
              (root/f'step-{i}.sh').write_text(script)
          PY
      - name: Recover authenticated implementation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/step-1.sh"
      - name: Reconstruct and enforce the original postimage guard
        run: bash "$RUNNER_TEMP/step-2.sh"
      - name: Export guarded objects without changing PR refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/step-3.sh"
      - uses: KirilsTurkins/lsf-upload-artifact@06dfe2de8e406c74d8e62730bcd18c498d48549c
        if: always()
        with:
          name: integrated-security-postimages
          path: ${{ runner.temp }}/integration-receipt/
          retention-days: 7
          if-no-files-found: warn
