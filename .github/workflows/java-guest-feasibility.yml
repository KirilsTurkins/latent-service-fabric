name: Java guest authoring

on:
  pull_request:
    branches: [development]
    paths:
      - 'sdk/java-guest/**'
      - 'tools/**'
      - 'apps/**'
      - 'crates/**'
      - 'schemas/**'
      - 'Cargo.*'
      - 'docs/component-development/java-authoring.md'
      - '.github/workflows/java-guest-feasibility.yml'
      - 'wit/platform/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-guest-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-component:
    name: Actual Java sources, SDK ownership and enforced node
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retain the exact checked-out source revision
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/java-feasibility-source.tar.gz" HEAD \
            apps crates sdk/java-guest sdk/rust tools wit/platform schemas examples \
            docs/component-development .cargo Cargo.toml Cargo.lock rust-toolchain.toml LICENSE NOTICE \
            .github/workflows/java-guest-feasibility.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-feasibility-source-${{ github.sha }}
          path: ${{ runner.temp }}/java-feasibility-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Test evidence and process-capture behavior
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -m unittest discover -s sdk/java-guest/tests -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install pinned compiler tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/java-bindgen"
          echo "$RUNNER_TEMP/java-bindgen" >> "$GITHUB_PATH"
      - name: Compile real Java sources and retain the first incompatible stage
        run: python3 sdk/java-guest/tools/feasibility.py --output "$RUNNER_TEMP/java-guest-feasibility" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute Java code, exceptions and GC without claiming node admission
        run: |
          set -o pipefail
          cargo run --locked -p latent-wasmtime --features java-guest-diagnostic --example java_runtime_probe -- "$RUNNER_TEMP/java-guest-feasibility/probe.wasm" 2>&1 | tee "$RUNNER_TEMP/java-guest-feasibility/runtime-probe.log"
      - name: Compile generated typed Java bindings against async capability WIT
        run: python3 tools/qualify_java_bridge.py --output "$RUNNER_TEMP/java-guest-bindings" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute typed Java values and async host suspension
        run: |
          set -o pipefail
          cargo run --locked -p latent-wasmtime --features java-guest-diagnostic --example java_runtime_probe -- "$RUNNER_TEMP/java-guest-bindings/compiled/component.wasm" --typed 2>&1 | tee "$RUNNER_TEMP/java-guest-bindings/runtime-probe.log"
      - name: Qualify standalone Java projects, nine SDK components, signed node and printed guide
        run: |
          set -o pipefail
          python3 tools/qualify_java_capsules.py --output "$RUNNER_TEMP/java-capsule-authoring" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-capsule-authoring.log"
      - name: Retain diagnostics, generated source and component candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-guest-feasibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-guest-feasibility/report.json
            ${{ runner.temp }}/java-guest-feasibility/*.candidate.json
            ${{ runner.temp }}/java-guest-feasibility/*.candidate.xml
            ${{ runner.temp }}/java-guest-feasibility/*.observed.json
            ${{ runner.temp }}/java-guest-feasibility/*.log
            ${{ runner.temp }}/java-guest-feasibility/*.exit.json
            ${{ runner.temp }}/java-guest-feasibility/*.failure.txt
            ${{ runner.temp }}/java-guest-feasibility/project/build/teavm-c/
            ${{ runner.temp }}/java-guest-feasibility/bindings/
            ${{ runner.temp }}/java-guest-feasibility/*.wasm
            ${{ runner.temp }}/java-guest-bindings/report.json
            ${{ runner.temp }}/java-guest-bindings/compiler/*.log
            ${{ runner.temp }}/java-guest-bindings/compiler-inputs.json
            ${{ runner.temp }}/java-guest-bindings/runtime-probe.log
            ${{ runner.temp }}/java-guest-bindings/compiled/bindings/
            ${{ runner.temp }}/java-guest-bindings/compiled/component.wasm
            ${{ runner.temp }}/java-capsule-authoring.log
            ${{ runner.temp }}/java-capsule-authoring/*.json
            ${{ runner.temp }}/java-capsule-authoring/logs/**
            ${{ runner.temp }}/java-capsule-authoring/builds/**
            ${{ runner.temp }}/java-capsule-authoring/sdk-guests/*.json
            ${{ runner.temp }}/java-capsule-authoring/sdk-guests/logs/**
            ${{ runner.temp }}/java-capsule-authoring/sdk-guests/java-*/*.json
            ${{ runner.temp }}/java-capsule-authoring/sdk-guests/java-*/component.wasm
            ${{ runner.temp }}/java-capsule-authoring/sdk-guests/java-*/compiler-logs/**
            ${{ runner.temp }}/java-capsule-authoring/sdk-guests/java-*/logs/**
            ${{ runner.temp }}/java-capsule-authoring/node/**
            ${{ runner.temp }}/java-capsule-authoring/releases/**
            ${{ runner.temp }}/java-capsule-authoring/guide/guide.json
            ${{ runner.temp }}/java-capsule-authoring/guide/guide.sh
            ${{ runner.temp }}/java-capsule-authoring/guide/logs/**
            ${{ runner.temp }}/java-capsule-authoring/guide/projects/results/**
          if-no-files-found: warn
          retention-days: 14
