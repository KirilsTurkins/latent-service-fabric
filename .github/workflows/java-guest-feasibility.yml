name: Java guest authoring

on:
  pull_request:
    branches: [development]
    paths:
      - 'sdk/java-guest/**'
      - 'examples/java-http-request/**'
      - 'examples/java-david-webb/**'
      - 'examples/java-http-composition/**'
      - 'examples/java-transaction-schema/**'
      - 'contracts/state/application-aggregate-*.schema.json'

      - 'sdk/transaction-contract/**'
      - 'tools/**'
      - 'apps/**'
      - 'crates/**'
      - 'schemas/**'
      - 'Cargo.*'
      - 'docs/component-development/java-authoring.md'
      - 'docs/component-development/java-httpserver.md'
      - '.github/workflows/java-guest-feasibility.yml'
      - 'wit/platform/**'
  workflow_dispatch:
    inputs:
      qualify-scratch-refusals:
        description: Run the unchanged normal Java prerequisite and separate filesystem refusal packet
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: java-guest-feasibility-${{ github.ref }}
  cancel-in-progress: true

env:
  # Symbols/incremental state cost disk and links; correctness checks stay on.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

jobs:
  compiler-component:
    name: Actual Java sources, SDK ownership and enforced node
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain the exact checked-out source revision
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/java-feasibility-source.tar.gz" HEAD \
            apps crates sdk/java-guest sdk/rust tools wit/platform schemas examples \
            docs/component-development .cargo Cargo.toml Cargo.lock rust-toolchain.toml LICENSE NOTICE \
            .github/workflows/java-guest-feasibility.yml
      - name: Retain the exact application schemas for the separate diagnostic source
        id: transaction-diagnostic-schema-source
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/java-transaction-diagnostic-schemas.tar.gz" HEAD \
            contracts/state/application-aggregate-v1.schema.json \
            contracts/state/application-aggregate-v2.schema.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-feasibility-source-${{ github.sha }}
          path: ${{ runner.temp }}/java-feasibility-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
      - name: Test evidence and process-capture behavior
        run: |
          python3 -m pip install --requirement tools/requirements.lock
          python3 -m unittest discover -s sdk/java-guest/tests -v
      - name: Check exclusive post-stage diagnostic inputs and retained compiler plans
        id: transaction-diagnostic-source-tests
        run: python3 -m unittest tools.tests.test_java_transaction_diagnostics tools.tests.test_transaction_guest_compilers
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Compare server AST and exchange semantics with the pinned JDK
        run: python3 tools/qualify_java_server_analysis.py --output "$RUNNER_TEMP/java-server-native"
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lsf-ci-dependencies-v2
          shared-key: host-correctness
          key: ubuntu-24.04
          cache-targets: true
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: false
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install pinned compiler tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          curl --fail --location --max-time 180 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          python3 tools/install_guest_bindgen.py "$RUNNER_TEMP/java-bindgen"
          echo "$RUNNER_TEMP/java-bindgen" >> "$GITHUB_PATH"
      - name: Qualify proposed transaction shapes and shared imported owners with the maintained Java compiler
        run: python3 tools/qualify_transaction_contracts.py --language java --output "$RUNNER_TEMP/transaction-contract-java" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Check bounded Java aggregate format vectors without claiming State execution
        id: aggregate-schema-vectors
        run: |
          set -euo pipefail
          javac --version
          java --version
          mkdir "$RUNNER_TEMP/java-aggregate-encoding"
          javac -d "$RUNNER_TEMP/java-aggregate-encoding" \
            examples/java-transaction-schema/AggregateCodec.java \
            examples/java-transaction-schema/EncodingVectors.java
          java -cp "$RUNNER_TEMP/java-aggregate-encoding" dev.latent.app.EncodingVectors \
            | tee "$RUNNER_TEMP/java-aggregate-encoding/vectors.log"
      - name: Compile the authored transaction aggregate and forbidden immediate HTTP variant
        run: python3 tools/compile_transaction_guests.py --language java --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" --output "$RUNNER_TEMP/transaction-guests-java"
      - name: Compile exact state value and forbidden child inputs
        run: python3 tools/compile_transaction_guests.py --language java --java-state-acceptance --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" --output "$RUNNER_TEMP/transaction-guest-acceptance-java"
      - name: Check explicit post-stage diagnostic helpers without claiming transaction execution
        id: transaction-diagnostic-vectors
        shell: bash
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/java-aggregate-encoding" \
            examples/java-transaction-schema/TransactionDiagnostics.java \
            examples/java-transaction-schema/DiagnosticVectors.java
          for vector in ordinary trap reused ordinary; do
            java -cp "$RUNNER_TEMP/java-aggregate-encoding" dev.latent.app.DiagnosticVectors "$vector"
          done | tee "$RUNNER_TEMP/java-aggregate-encoding/diagnostic-vectors.log"
      - name: Compile the separate Java post-stage fault capsule without claiming host execution
        id: transaction-diagnostic-component
        run: python3 tools/compile_transaction_guests.py --language java --java-post-stage-diagnostic --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" --output "$RUNNER_TEMP/transaction-guest-diagnostic-java"
      - name: Compile real Java sources and retain the first incompatible stage
        run: python3 sdk/java-guest/tools/feasibility.py --output "$RUNNER_TEMP/java-guest-feasibility" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Minimize supported Java WIT composition with the actual parser and C ABI
        run: python3 tools/qualify_java_composition_shapes.py --output "$RUNNER_TEMP/java-composition-shapes"
      - name: Execute Java code, exceptions and GC without claiming node admission
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml run --locked -p latent-wasmtime --features java-guest-diagnostic --example java_runtime_probe -- "$RUNNER_TEMP/java-guest-feasibility/probe.wasm" 2>&1 | tee "$RUNNER_TEMP/java-guest-feasibility/runtime-probe.log"
      - name: Compile generated typed Java bindings against async capability WIT
        run: python3 tools/qualify_java_bridge.py --output "$RUNNER_TEMP/java-guest-bindings" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute typed Java values and async host suspension
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml run --locked -p latent-wasmtime --features java-guest-diagnostic --example java_runtime_probe -- "$RUNNER_TEMP/java-guest-bindings/compiled/component.wasm" --typed 2>&1 | tee "$RUNNER_TEMP/java-guest-bindings/runtime-probe.log"
      - name: Prepare the opt-in Java fibers and reference JDK controls
        id: prepare-java-activation-fibers
        run: python3 tools/qualify_java_fibers.py --output "$RUNNER_TEMP/java-activation-fibers" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute signed activation threads with actual physical cleanup
        id: signed-java-activation-fibers
        env:
          LSF_GUEST_SDK_LANGUAGE: java
          LSF_JAVA_FIBER_FIXTURE: ${{ runner.temp }}/java-activation-fibers
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service \
            runtime::signed_java_threads_spin_join_and_thread_local_use_real_activation_fibers -- \
            --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/java-activation-fibers/signed-runtime.log"
      - name: Prepare Java fiber host imports against the original compiler closure
        id: prepare-java-fiber-io
        run: |
          python3 tools/qualify_java_fibers.py --fixture fiber-io \
            --output "$RUNNER_TEMP/java-fiber-io" \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute signed Java pending host imports and overlapping waits
        id: signed-java-fiber-io
        env:
          LSF_GUEST_SDK_LANGUAGE: java
          LSF_JAVA_FIBER_IO_FIXTURE: ${{ runner.temp }}/java-fiber-io
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service \
            runtime::signed_java_host_imports_suspend_only_their_owned_callers -- \
            --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/java-fiber-io/signed-runtime.log"
      - name: Prepare unchanged standard Java timers with reference and ownership controls
        id: prepare-java-standard-timers
        run: |
          python3 tools/qualify_java_fibers.py --fixture timers \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --output "$RUNNER_TEMP/java-standard-timers" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute signed recurring Java timers and physical worker retirement
        id: signed-java-standard-timers
        env:
          LSF_GUEST_SDK_LANGUAGE: java
          LSF_JAVA_TIMER_FIXTURE: ${{ runner.temp }}/java-standard-timers
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service \
            runtime::signed_java_standard_timers_recur_cancel_and_drain_owned_workers -- \
            --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/java-standard-timers/signed-runtime.log"
      - name: Qualify standalone Java projects, nine SDK components, signed node and printed guide
        run: |
          set -o pipefail
          python3 tools/qualify_java_capsules.py --output "$RUNNER_TEMP/java-capsule-authoring" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-capsule-authoring.log"
      - name: Capture and compile unchanged published Java worker libraries
        id: prepare-java-worker-libraries
        run: |
          python3 tools/qualify_java_fibers.py --fixture worker-libraries \
            --output "$RUNNER_TEMP/java-worker-libraries" \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Execute signed published libraries with their default workers
        id: signed-java-worker-libraries
        env:
          LSF_GUEST_SDK_LANGUAGE: java
          LSF_JAVA_WORKER_LIBRARIES_FIXTURE: ${{ runner.temp }}/java-worker-libraries
        run: |
          set -o pipefail
          cargo --config .cargo/managed-guest.toml test --locked -p latent-wasmtime --test local_service \
            runtime::signed_java_published_libraries_use_unchanged_default_workers -- \
            --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/java-worker-libraries/signed-runtime.log"
      - name: Qualify separately signed typed Java domain through ordinary Java HTTP adapter
        run: |
          set -o pipefail
          python3 tools/qualify_java_http_composition.py --output "$RUNNER_TEMP/java-http-composition" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-http-composition.log"
      - name: Qualify original ingress and real revision lifecycle on fresh ordinary default nodes
        run: |
          set -o pipefail
          python3 tools/qualify_java_server_lifecycle_suite.py --output "$RUNNER_TEMP/java-server-lifecycle" --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-server-lifecycle.log"
      - name: Qualify shared-node Java state and credentials in two admitted tenants
        run: |
          set -euo pipefail
          python3 tools/qualify_java_server_tenants.py \
            --output "$RUNNER_TEMP/java-server-tenants" \
            --native-directory "$RUNNER_TEMP/java-server-lifecycle/selected-native" \
            --native-tuple "$RUNNER_TEMP/java-server-lifecycle/native/native-tuple.json" \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-server-tenants.log"
      - name: Qualify exact-approved contained processors and signed generated Java source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 tools/qualify_java_annotation_processors.py \
            --output "$RUNNER_TEMP/java-annotation-processors" \
            --native-directory "$RUNNER_TEMP/java-server-lifecycle/selected-native" \
            --native-tuple "$RUNNER_TEMP/java-server-lifecycle/native/native-tuple.json" \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-annotation-processors.log"
      - name: Qualify captured original JAR native and reflection compiler failures with a signed ordinary entry
        run: |
          set -euo pipefail
          python3 tools/qualify_java_library_failures.py \
            --output "$RUNNER_TEMP/java-library-failures" \
            --native-directory "$RUNNER_TEMP/java-server-lifecycle/selected-native" \
            --native-tuple "$RUNNER_TEMP/java-server-lifecycle/native/native-tuple.json" \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" 2>&1 | tee "$RUNNER_TEMP/java-library-failures.log"
      - name: Test private HTTP JAR capture and exact provider evidence controls
        run: python3 -B -m unittest tools.tests.test_java_private_http -v
      - name: Qualify unknown private HTTP JARs through the shared standard backend
        run: |
          python3 -B tools/qualify_java_private_http.py \
            --output "$RUNNER_TEMP/java-private-http" \
            --native "$RUNNER_TEMP/java-server-lifecycle/selected-native" \
            --native-tuple "$RUNNER_TEMP/java-server-lifecycle/native/native-tuple.json" \
            --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2" \
            --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Test published Java factory capture and replay identity controls
        run: python3 -B -m unittest tools.tests.test_java_published_http tools.tests.test_java_published_replay -v
      - name: Qualify two unchanged published Java clients through the same standard backend
        run: >-
          python3 -B tools/qualify_java_published_http.py
          --output "$RUNNER_TEMP/java-published-http"
          --native "$RUNNER_TEMP/java-server-lifecycle/selected-native"
          --native-tuple "$RUNNER_TEMP/java-server-lifecycle/native/native-tuple.json"
          --read-only-cache "$RUNNER_TEMP/java-activation-fibers/compiler/gradle-home/caches/modules-2"
          --wasi-sdk "$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux"
      - name: Retain diagnostics, generated source and component candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-guest-feasibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-published-http/qualification.json
            ${{ runner.temp }}/java-published-http/FAILED.json
            ${{ runner.temp }}/java-published-http/campaign/qualification.json
            ${{ runner.temp }}/java-published-http/campaign/http-request/qualification.json
            ${{ runner.temp }}/java-published-http/campaign/http-request/build/*.json
            ${{ runner.temp }}/java-published-http/campaign/http-request/provider/qualification.json
            ${{ runner.temp }}/java-published-http/campaign/http-request/provider/after-*.json
            ${{ runner.temp }}/java-published-http/campaign/http-request/provider/controls/standard-*.json
            ${{ runner.temp }}/java-published-http/campaign/webb-build/*.json
            ${{ runner.temp }}/java-published-http/campaign/webb-build/compiler-logs/*-java-to-c.log
            ${{ runner.temp }}/java-published-http/campaign/webb-node/qualification.json
            ${{ runner.temp }}/java-published-http/campaign/webb-node/after-*.json
            ${{ runner.temp }}/java-published-http/campaign/webb-node/controls/standard-*.json
            ${{ runner.temp }}/java-private-http/qualification.json
            ${{ runner.temp }}/java-private-http/FAILED.json
            ${{ runner.temp }}/java-private-http/variant-*/build/BUILD-COMPLETE.json
            ${{ runner.temp }}/java-private-http/variant-*/build/build-observation.json
            ${{ runner.temp }}/java-private-http/variant-*/build/source-inputs.json
            ${{ runner.temp }}/java-private-http/variant-*/build/recipe-inputs.json
            ${{ runner.temp }}/java-private-http/variant-*/build/java-classpath.json
            ${{ runner.temp }}/java-private-http/variant-*/build/http-client-profile.json
            ${{ runner.temp }}/java-private-http/variant-*/node/qualification.json
            ${{ runner.temp }}/java-private-http/variant-*/node/after-*.json
            ${{ runner.temp }}/java-private-http/variant-*/node/controls/standard-*.json
            ${{ runner.temp }}/java-library-failures.log
            ${{ runner.temp }}/java-library-failures/qualification.json
            ${{ runner.temp }}/java-library-failures/FAILED.json
            ${{ runner.temp }}/java-library-failures/capture.json
            ${{ runner.temp }}/java-library-failures/candidate.json
            ${{ runner.temp }}/java-library-failures/logs/**
            ${{ runner.temp }}/java-library-failures/native-method/*.json
            ${{ runner.temp }}/java-library-failures/native-method/compiler-logs/**
            ${{ runner.temp }}/java-library-failures/generic-reflection/*.json
            ${{ runner.temp }}/java-library-failures/generic-reflection/compiler-logs/**
            ${{ runner.temp }}/java-library-failures/ordinary/*.json
            ${{ runner.temp }}/java-library-failures/ordinary/compiler-logs/**
            ${{ runner.temp }}/java-library-failures/ordinary/component.wasm
            ${{ runner.temp }}/java-library-failures/node/**/*.json
            ${{ runner.temp }}/java-annotation-processors.log
            ${{ runner.temp }}/java-annotation-processors/qualification.json
            ${{ runner.temp }}/java-annotation-processors/FAILED.json
            ${{ runner.temp }}/java-annotation-processors/containment.json
            ${{ runner.temp }}/java-annotation-processors/source-ownership-negatives.json
            ${{ runner.temp }}/java-annotation-processors/logs/**
            ${{ runner.temp }}/java-annotation-processors/unapproved/executable-input-approval-request.json
            ${{ runner.temp }}/java-annotation-processors/approved/BUILD-COMPLETE.json
            ${{ runner.temp }}/java-annotation-processors/approved/BUILD-FAILED.json
            ${{ runner.temp }}/java-annotation-processors/approved/source-inputs.json
            ${{ runner.temp }}/java-annotation-processors/approved/recipe-inputs.json
            ${{ runner.temp }}/java-annotation-processors/approved/build-observation.json
            ${{ runner.temp }}/java-annotation-processors/approved/compiler-inputs.json
            ${{ runner.temp }}/java-annotation-processors/approved/java-annotation-processors.json
            ${{ runner.temp }}/java-annotation-processors/approved/java-processor-classpath.json
            ${{ runner.temp }}/java-annotation-processors/approved/compiler-logs/**
            ${{ runner.temp }}/java-annotation-processors/approved/component.wasm
            ${{ runner.temp }}/java-annotation-processors/node/**/*.json
            ${{ runner.temp }}/java-server-lifecycle.log
            ${{ runner.temp }}/java-server-lifecycle/suite.json
            ${{ runner.temp }}/java-server-lifecycle/FAILED.json
            ${{ runner.temp }}/java-server-lifecycle/native/native-tuple.json
            ${{ runner.temp }}/java-server-lifecycle/logs/**
            ${{ runner.temp }}/java-server-lifecycle/build-*/BUILD-COMPLETE.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/BUILD-FAILED.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/source-inputs.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/recipe-inputs.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/server-source.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/server-profile.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/http-client-profile.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/compiler-inputs.json
            ${{ runner.temp }}/java-server-lifecycle/build-*/compiler-logs/**
            ${{ runner.temp }}/java-server-lifecycle/build-*/logs/**
            ${{ runner.temp }}/java-server-lifecycle/build-*/component.wasm
            ${{ runner.temp }}/java-server-lifecycle/execution/**/*.json
            ${{ runner.temp }}/java-server-tenants.log
            ${{ runner.temp }}/java-server-tenants/qualification.json
            ${{ runner.temp }}/java-server-tenants/signed/release-set.json
            ${{ runner.temp }}/java-server-tenants/build/BUILD-COMPLETE.json
            ${{ runner.temp }}/java-server-tenants/build/BUILD-FAILED.json
            ${{ runner.temp }}/java-server-tenants/build/source-inputs.json
            ${{ runner.temp }}/java-server-tenants/build/recipe-inputs.json
            ${{ runner.temp }}/java-server-tenants/build/server-source.json
            ${{ runner.temp }}/java-server-tenants/build/server-profile.json
            ${{ runner.temp }}/java-server-tenants/build/compiler-inputs.json
            ${{ runner.temp }}/java-server-tenants/build/compiler-logs/**
