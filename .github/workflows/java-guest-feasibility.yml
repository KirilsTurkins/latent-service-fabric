name: Java guest feasibility

on:
  pull_request:
    paths:
      - 'sdk/java-guest/**'
      - '.github/workflows/java-guest-feasibility.yml'
      - 'tools/toolchain.toml'
      - 'wit/platform/**'
      - 'crates/latent-wasmtime/src/surface.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-guest-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-component:
    name: Actual Java compiler and component probe (not language qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retain the exact checked-out source revision
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/java-feasibility-source.tar.gz" HEAD \
            sdk/java-guest .github/workflows/java-guest-feasibility.yml \
            tools \
            wit/platform crates/latent-wasmtime/src/surface.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-feasibility-source-${{ github.sha }}
          path: ${{ runner.temp }}/java-feasibility-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - name: Test evidence and process-capture behavior
        run: python3 -m unittest discover -s sdk/java-guest/tests -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install pinned compiler tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          echo "a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.1.0/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check ziglang==0.16.0
          python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent)' >> "$GITHUB_PATH"
          cargo install --locked wit-bindgen-cli --version 0.62.0
          cargo install --locked wasm-tools --version 1.254.0
      - name: Compile real Java sources and retain the first incompatible stage
        run: python3 sdk/java-guest/tools/feasibility.py --output "$RUNNER_TEMP/java-guest-feasibility" --bootstrap-dependencies
      - name: Retain diagnostics, generated source and component candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-guest-feasibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-guest-feasibility/report.json
            ${{ runner.temp }}/java-guest-feasibility/*.candidate.json
            ${{ runner.temp }}/java-guest-feasibility/*.candidate.xml
            ${{ runner.temp }}/java-guest-feasibility/*.observed.json
            ${{ runner.temp }}/java-guest-feasibility/*.log
            ${{ runner.temp }}/java-guest-feasibility/*.exit.json
            ${{ runner.temp }}/java-guest-feasibility/*.failure.txt
            ${{ runner.temp }}/java-guest-feasibility/project/build/teavm-c/
            ${{ runner.temp }}/java-guest-feasibility/bindings/
            ${{ runner.temp }}/java-guest-feasibility/*.wasm
          if-no-files-found: warn
          retention-days: 14
