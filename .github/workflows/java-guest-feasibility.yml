name: Java guest feasibility

on:
  pull_request:
    paths:
      - research/java-capsules/**
      - .github/workflows/java-guest-feasibility.yml
      - tools/toolchain.toml
      - wit/platform/**
      - crates/latent-wasmtime/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-guest-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feasibility:
    name: Java compiler and component qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 1.254.0
      - name: Install checksum-pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("tools/toolchain.toml", "rb"))["sdk"]["gradle"])')"
          checksum="$(python3 -c 'import tomllib; print(tomllib.load(open("tools/toolchain.toml", "rb"))["sdk"]["gradle_sha256"])')"
          destination="${RUNNER_TEMP}/java-guest-gradle"
          mkdir "$destination"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 \
            "https://services.gradle.org/distributions/gradle-${version}-bin.zip" -o "$destination/gradle.zip"
          printf '%s  %s\n' "$checksum" "$destination/gradle.zip" | sha256sum --check --strict
          unzip -q "$destination/gradle.zip" -d "$destination"
          echo "$destination/gradle-${version}/bin" >> "$GITHUB_PATH"
      - name: Capture actual compiler candidates and unresolved boundaries
        id: probe
        run: python3 research/java-capsules/probe.py --capture-dependencies --output "$RUNNER_TEMP/java-guest-attempt"
      - name: Retain failed and successful stages without claiming delivery
        if: always() && steps.probe.outcome != '' && steps.probe.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-guest-feasibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/java-guest-attempt/receipt.json
            ${{ runner.temp }}/java-guest-attempt/source-inputs.json
            ${{ runner.temp }}/java-guest-attempt/phases/
            ${{ runner.temp }}/java-guest-attempt/project/
            ${{ runner.temp }}/java-guest-attempt/build/
          if-no-files-found: error
          retention-days: 14
