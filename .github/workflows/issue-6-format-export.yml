name: Issue 6 format export

on:
  push:
    branches:
      - feat/issue-6-resource-budget-accounting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Apply canonical formatting and remove helper
        run: |
          cargo fmt --all
          rm .github/workflows/issue-6-format-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical Rust formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
