name: Apply Issue 22 runner race coverage

on:
  push:
    branches:
      - feat/issue-22-containment-runner

permissions:
  contents: write

concurrency:
  group: issue-22-runner-race-fix
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-containment-runner
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Materialize deterministic runner race tests
        shell: bash
        run: |
          set -euo pipefail
          echo "8828800fac46f83490c47e2754b9884a0b2b682b84e4246bb05ad8ada5af1736  .github/issue22-race-tests.rs.gz.b64" | sha256sum --check
          base64 --decode .github/issue22-race-tests.rs.gz.b64 | gzip --decompress > crates/latent-node/tests/activation_runner_races.rs
      - name: Refactor the queue selector and add simultaneous-ready tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/latent-node/src/activation_runner.rs")
          source = source_path.read_text(encoding="utf-8")

          old_import = "use std::future::pending;"
          new_import = "use std::future::{pending, Future};"
          if source.count(old_import) != 1:
              raise SystemExit("unexpected activation-runner Future import count")
          source = source.replace(old_import, new_import, 1)

          old_resolution = '''        // The inner scope guarantees that a losing acquisition future is dropped
                  // before cancel_waiting is invoked or the envelope proceeds to execution.
                  let resolution = {
                      let acquire =
                          self.pool
                              .acquire(&activation_id, &tenant, self.config.cell_class, &budget);
                      tokio::pin!(acquire);
                      let deadline_wait = wait_for_deadline(effective_deadline);
                      tokio::pin!(deadline_wait);

                      tokio::select! {
                          biased;
                          () = cancellation.cancelled() => LeaseResolution::Cancelled,
                          () = &mut deadline_wait => LeaseResolution::DeadlineExceeded,
                          result = &mut acquire => LeaseResolution::Acquired(result),
                      }
                  };
          '''
          new_resolution = '''        // The helper owns all three futures so a losing acquisition is dropped
                  // before cancel_waiting is invoked or the envelope proceeds to execution.
                  let resolution = resolve_lease(
                      self.pool
                          .acquire(&activation_id, &tenant, self.config.cell_class, &budget),
                      cancellation.cancelled(),
                      wait_for_deadline(effective_deadline),
                  )
                  .await;
          '''
          if source.count(old_resolution) != 1:
              raise SystemExit("unexpected queue-resolution block count")
          source = source.replace(old_resolution, new_resolution, 1)

          enum_block = '''enum LeaseResolution {
              Acquired(Result<CellLease, PlatformError>),
              Cancelled,
              DeadlineExceeded,
          }
          '''
          helper_block = enum_block + '''
          async fn resolve_lease<Acquire, Cancellation, Deadline>(
              acquire: Acquire,
              cancellation: Cancellation,
              deadline: Deadline,
          ) -> LeaseResolution
          where
              Acquire: Future<Output = Result<CellLease, PlatformError>>,
              Cancellation: Future<Output = ()>,
              Deadline: Future<Output = ()>,
          {
              tokio::pin!(acquire);
              tokio::pin!(cancellation);
              tokio::pin!(deadline);

              tokio::select! {
                  biased;
                  () = &mut cancellation => LeaseResolution::Cancelled,
                  () = &mut deadline => LeaseResolution::DeadlineExceeded,
                  result = &mut acquire => LeaseResolution::Acquired(result),
              }
          }
          '''
          if source.count(enum_block) != 1:
              raise SystemExit("unexpected LeaseResolution enum count")
          source = source.replace(enum_block, helper_block, 1)

          test_marker = "queue_bias_prefers_cancellation_over_deadline_and_cell_grant"
          if test_marker in source:
              raise SystemExit("queue race tests are already present")
          tests = r'''

              #[tokio::test]
              async fn queue_bias_prefers_cancellation_over_deadline_and_cell_grant() {
                  let barrier = Arc::new(tokio::sync::Barrier::new(4));
                  let polled = Arc::new(std::sync::atomic::AtomicUsize::new(0));
                  let resolution = {
                      let acquire_barrier = Arc::clone(&barrier);
                      let acquire_polled = Arc::clone(&polled);
                      let cancellation_barrier = Arc::clone(&barrier);
                      let cancellation_polled = Arc::clone(&polled);
                      let deadline_barrier = Arc::clone(&barrier);
                      let deadline_polled = Arc::clone(&polled);
                      tokio::spawn(async move {
                          resolve_lease(
                              async move {
                                  reach_race_barrier(acquire_barrier, acquire_polled).await;
                                  Err(platform_error(
                                      PlatformErrorCode::Unavailable,
                                      "simultaneous cell grant",
                                      false,
                                  ))
                              },
                              reach_race_barrier(cancellation_barrier, cancellation_polled),
                              reach_race_barrier(deadline_barrier, deadline_polled),
                          )
                          .await
                      })
                  };

                  wait_for_race_branches(&polled, 3).await;
                  assert!(
                      barrier.wait().await.is_leader(),
                      "the test must release all three already-waiting branches"
                  );
                  assert!(matches!(
                      resolution.await.expect("queue race task joins"),
                      LeaseResolution::Cancelled
                  ));
              }

              #[tokio::test]
              async fn queue_bias_prefers_deadline_over_cell_grant_without_cancellation() {
                  let barrier = Arc::new(tokio::sync::Barrier::new(3));
                  let polled = Arc::new(std::sync::atomic::AtomicUsize::new(0));
                  let resolution = {
                      let acquire_barrier = Arc::clone(&barrier);
                      let acquire_polled = Arc::clone(&polled);
                      let deadline_barrier = Arc::clone(&barrier);
                      let deadline_polled = Arc::clone(&polled);
                      tokio::spawn(async move {
                          resolve_lease(
                              async move {
                                  reach_race_barrier(acquire_barrier, acquire_polled).await;
                                  Err(platform_error(
                                      PlatformErrorCode::Unavailable,
                                      "simultaneous cell grant",
                                      false,
                                  ))
                              },
                              pending::<()>(),
                              reach_race_barrier(deadline_barrier, deadline_polled),
                          )
                          .await
                      })
                  };

                  wait_for_race_branches(&polled, 2).await;
                  assert!(
                      barrier.wait().await.is_leader(),
                      "the test must release both already-waiting branches"
                  );
                  assert!(matches!(
                      resolution.await.expect("queue race task joins"),
                      LeaseResolution::DeadlineExceeded
                  ));
              }

              async fn reach_race_barrier(
                  barrier: Arc<tokio::sync::Barrier>,
                  polled: Arc<std::sync::atomic::AtomicUsize>,
              ) {
                  polled.fetch_add(1, Ordering::Release);
                  barrier.wait().await;
              }

              async fn wait_for_race_branches(
                  polled: &std::sync::atomic::AtomicUsize,
                  expected: usize,
              ) {
                  tokio::time::timeout(Duration::from_secs(2), async {
                      while polled.load(Ordering::Acquire) != expected {
                          tokio::task::yield_now().await;
                      }
                  })
                  .await
                  .expect("all queue race branches are polled");
              }
          '''
          module_end = source.rfind("\n}")
          if module_end == -1:
              raise SystemExit("activation-runner test module end not found")
          source = source[:module_end] + tests + source[module_end:]
          source_path.write_text(source, encoding="utf-8")

          docs_path = Path("docs/development/activation-containment.md")
          docs = docs_path.read_text(encoding="utf-8")
          old_docs = (
              "Runner and containment unit tests additionally cover queue bias, "
              "cancellation/deadline versus completion, cancellation/deadline versus fuel "
              "exhaustion, registration removal, disposition failure precedence, "
              "first-stop-cause stickiness, and the memory-before-fuel-before-trap classifier."
          )
          new_docs = (
              "Barrier-controlled runner tests cover the queue's cancellation-before-deadline-"
              "before-grant bias, cancellation and deadline at backend-result handoff for both "
              "completion and fuel exhaustion, cancellation accepted after handoff but before "
              "registration removal, and release/quarantine failure precedence with the mapped "
              "consumption preserved. Containment unit tests cover first-stop-cause stickiness "
              "and the memory-before-fuel-before-trap classifier."
          )
          if docs.count(old_docs) != 1:
              raise SystemExit("unexpected containment test-coverage sentence count")
          docs_path.write_text(docs.replace(old_docs, new_docs, 1), encoding="utf-8")
          PY
      - name: Remove temporary correction-transfer artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/lsf22-correction.patch.gz.b64
          rm -f .github/issue22-race-tests.rs.gz.b64
          rm -f .github/workflows/temporary-issue22-race-fix.yml
      - name: Format and run targeted runner validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test -p latent-node --lib --locked
          cargo test -p latent-node --test activation_runner --locked
          cargo test -p latent-node --test activation_runner_races --locked
          cargo clippy -p latent-node --all-targets --locked
      - name: Commit the validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test: cover activation runner precedence races"
          git push origin HEAD:feat/issue-22-containment-runner
