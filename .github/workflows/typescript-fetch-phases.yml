name: TypeScript phase Fetch execution
on:
  push:
    branches: ['feat/typescript-phase-execution-20261020']
    paths:
      - '.github/workflows/typescript-fetch-phases.yml'
      - 'sdk/typescript-guest/probes/fetch-phases/**'
      - 'tools/typescript_fetch_phase_fixture.py'
      - 'tools/typescript_fetch_tenant_programme.py'
      - 'tools/qualify_typescript_fetch_phases.py'
      - 'tools/java_phase_native_products.py'
      - 'tools/http_phase_native_products.py'
      - 'tools/http_tenant_native_products.py'
      - 'tools/http_phase_wit.py'
      - 'tools/tests/test_typescript_phase_execution.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-fetch-phases-${{ github.ref }}
  cancel-in-progress: false
jobs:
  phases:
    name: Signed default published clients wire reasons and root retirement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - name: Fetch only the authenticated native producer source object
        run: git fetch --no-tags --depth=1 origin 77bf0e3f3b68e17342b6146abd6f2de34a3efa00
      - name: Fetch the immutable nominal phase producer source object
        run: git fetch --no-tags --depth=1 origin 36eaed79dbd92cac12bad2dd1f52cd5d1acd525f
      - name: Fetch the immutable tenant isolation producer source object
        run: git fetch --no-tags --depth=1 origin 6f5f180136d140ac670561695260f71514781015
      - name: Fetch the immutable operational authority producer source object
        run: git fetch --no-tags --depth=1 origin 8f7780dd0a35e3375524d72e7dfaddf847deaa5c
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: KirilsTurkins/lsf-setup-node@c1136b2d97fe79ef645e9508b2048a222f50a170 # v7.1.0 + upstream changes + LSF security fixes
        with:
          node-version: 24.19.0
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Install locked Python controls
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check phase Fetch source and real wire fixture controls
        run: python3 -B -m unittest tools.tests.test_typescript_phase_execution tools.tests.test_java_phase_native_products -v
      - name: Check nominal native producer authentication controls
        run: python3 -B -m unittest tools.tests.test_http_phase_native_products -v
      - name: Check frozen tenant native producer authentication
        run: python3 -B -m unittest tools.tests.test_http_tenant_native_products -v
      - name: Check independent tenant HTTP configuration and captured component boundaries
        run: python3 -B -m unittest tools.tests.test_typescript_fetch_tenants -v
      - name: Install normal compiler isolation boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install normal pinned public compiler tools
        run: python3 tools/typescript_capsule.py install-tools "$RUNNER_TEMP/phase-tools"
      - name: Acquire original import engine and compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/typescript_fetch_replay_inputs.py --output "$RUNNER_TEMP/phase-engine"
      - name: Acquire the exact shared V7 native producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/http_tenant_native_products.py --output "$RUNNER_TEMP/phase-native"
      - name: Build sign and execute actual phase Fetch programme
        run: python3 -B tools/qualify_typescript_fetch_phases.py --acquired "$RUNNER_TEMP/phase-engine" --native "$RUNNER_TEMP/phase-native" --tools "$RUNNER_TEMP/phase-tools" --output "$RUNNER_TEMP/phase-fetch"
      - name: Retain source identities original compiler results real contacts and physical owners
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: typescript-fetch-phases-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase-engine/acquisition.json
            ${{ runner.temp }}/phase-native/*.json
            ${{ runner.temp }}/phase-fetch/*.json
            ${{ runner.temp }}/phase-fetch/build/*.json
            ${{ runner.temp }}/phase-fetch/build/*.wit
            ${{ runner.temp }}/phase-fetch/build/component.wasm
            ${{ runner.temp }}/phase-fetch/build/package/**
            ${{ runner.temp }}/phase-fetch/build/logs/
            ${{ runner.temp }}/phase-fetch/node/*.json
            ${{ runner.temp }}/phase-fetch/node/controls/
            ${{ runner.temp }}/phase-fetch/node/missing-provider/
            ${{ runner.temp }}/phase-fetch/node/tenant-isolation/
          if-no-files-found: warn
          retention-days: 7
