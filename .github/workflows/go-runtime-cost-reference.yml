name: Actual Go live stack and GC reference

on:
  workflow_dispatch:
  push:
    branches: ['feat/go-runtime-costs-20261020']

permissions:
  contents: read
  actions: read

concurrency:
  group: go-runtime-costs-reference-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  live-cost:
    name: Actual Go default baseline and managed live stack GC and heap costs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: KirilsTurkins/lsf-checkout@c3024dfac542bb46ebccc7829ddf1f95e0be8da9 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install pinned repository source controls
        run: python3 -m pip install -r tools/requirements.lock
      - uses: KirilsTurkins/lsf-bytecodealliance-actions/wasm-tools/setup@9244ec9f4725400c84054e3e6ec97514cadddf53 # v1.1.3 + upstream changes + LSF security fixes
        with:
          version: 1.254.0
      - name: Reject fabricated memory observations and changed original products
        run: python3 -m unittest tools.tests.test_go_runtime_costs tools.tests.test_go_node_stop tools.tests.test_sdk_scratch_qualification -v
      - name: Authenticate the completed exact producer before restoring any executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/qualify_go_node_stop.py --record-producer --output "$RUNNER_TEMP/go-runtime-costs-producer.json"
      - name: Restore only the authenticated public normal Go products
        uses: KirilsTurkins/lsf-download-artifact@f073ba9e3801be93f933866d4c9a748e42157e5f # v8.0.2 + upstream changes + LSF security fixes
        with:
          name: go-scratch-prepared-94d0f8b0c1508df50e2830e6d678661c1e76bc36
          run-id: 39373374237
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/go-runtime-costs-normal
      - name: Install the existing network-denied compiler namespace
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the exact maintained Go compiler and generator
        run: |
          set -euo pipefail
          cargo install --git https://github.com/bytecodealliance/componentize-go --rev 148dba505f8c6c64ad84db777cfde5e34e25098b --locked componentize-go
          test "$(wasm-tools --version | cut -d ' ' -f 1,2)" = 'wasm-tools 1.254.0'
          mkdir -p "$RUNNER_TEMP/go-runtime-costs-tools"
          curl --fail --location --max-time 180 --output "$RUNNER_TEMP/go-runtime-costs-tools/go.tar.gz" https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $RUNNER_TEMP/go-runtime-costs-tools/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/go-runtime-costs-tools/go.tar.gz" -C "$RUNNER_TEMP/go-runtime-costs-tools"
          python3 tools/go_guest/runtime.py --prepare-compiler "$RUNNER_TEMP/go-runtime-costs-tools/go" --output "$RUNNER_TEMP/go-runtime-costs-tools/go-async"
          echo "$RUNNER_TEMP/go-runtime-costs-tools/go-async/bin" >> "$GITHUB_PATH"
      - name: Compile identical ordinary source and execute both real signed profiles
        run: python3 tools/qualify_go_runtime_costs.py --normal-qualification "$RUNNER_TEMP/go-runtime-costs-normal" --producer-receipt "$RUNNER_TEMP/go-runtime-costs-producer.json" --output "$RUNNER_TEMP/go-runtime-costs"
      - name: Retain bounded source builds real memory results and physical retirement including failures
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: go-runtime-costs-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-runtime-costs-producer.json
            ${{ runner.temp }}/go-runtime-costs/*.json
            ${{ runner.temp }}/go-runtime-costs/logs/**
            ${{ runner.temp }}/go-runtime-costs/stack-placement/*.json
            ${{ runner.temp }}/go-runtime-costs/stack-placement/logs/**
            ${{ runner.temp }}/go-runtime-costs/profile-*/*.json
            ${{ runner.temp }}/go-runtime-costs/profile-*/logs/**
            ${{ runner.temp }}/go-runtime-costs/profile-*/build/*.json
            ${{ runner.temp }}/go-runtime-costs/profile-*/build/logs/**
            ${{ runner.temp }}/go-runtime-costs/profile-*/build/component.wasm
            ${{ runner.temp }}/go-runtime-costs/profile-*/controls/*.json
          if-no-files-found: warn
          retention-days: 7
