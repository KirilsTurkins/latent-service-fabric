name: Stream maintained cleanup task and guarded stack objects
on:
  push:
    branches: ['feat/stream-kernel-guarded-stack-20261022']
    paths:
      - '.github/workflows/stream-kernel-cleanup-stack.yml'
      - 'tools/qualify_host_stream_kernel_cleanup_stack.py'
      - 'tools/host_stream_kernel_cleanup_task.py'
      - 'tools/host_stream_kernel_guarded_stack.py'
      - 'tools/tests/fixtures/host_stream_kernel_cleanup_task.json'
      - 'tools/tests/fixtures/host_stream_kernel_guarded_stack.json'
      - 'tools/tests/test_host_stream_kernel_cleanup_task.py'
      - 'tools/tests/test_host_stream_kernel_guarded_stack.py'
      - 'tools/tests/test_host_stream_kernel_cleanup_stack_objects.py'
      - 'research/standard-outbound/linux-6.12-lineage/cleanup-task-private.h'
      - 'research/standard-outbound/linux-6.12-lineage/factory-cleanup-task.c'
      - 'research/standard-outbound/linux-6.12-lineage/kernel-cleanup-worker.c'
      - 'research/standard-outbound/linux-6.12-lineage/cleanup-stack-private.h'
      - 'research/standard-outbound/linux-6.12-lineage/factory-cleanup-stack.c'
      - 'research/standard-outbound/linux-6.12-lineage/cleanup-stack-vmap.c'
permissions:
  contents: read
concurrency:
  group: stream-kernel-cleanup-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanup-stack-objects:
    name: Four actual maintained task stack and factory objects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@842365d0a25bf5a868311e4cb89c908bdcab4bb8 # v7.0.1 + upstream changes + LSF security fixes
        with:
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-python@50257733267ef69f611231aad6b77a62adca7140 # v7.1.0 + upstream changes + LSF security fixes
        with:
          python-version: 3.13.5
      - name: Install the existing locked Python recipe dependencies
        run: python3 -m pip install -r tools/requirements.lock
      - name: Check private task guarded stack and fixed four-object source guards
        run: python3 -B -m unittest tools.tests.test_host_stream_kernel_cleanup_task tools.tests.test_host_stream_kernel_guarded_stack tools.tests.test_host_stream_kernel_cleanup_stack_objects -v
      - name: Install only normal upstream Kbuild prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make flex bison bc libelf-dev libssl-dev binutils
      - name: Acquire only the exact maintained official source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.113.tar.xz \
            --output "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          echo "e09b6727e5c521253f0d41694900b9c38fb7604db7d35238a8197aa9f7de2428  $RUNNER_TEMP/linux-6.12.113.tar.xz" | sha256sum --check --strict
      - name: Derive authenticated source preserve security config and compile four changed objects
        run: >-
          python3 -B tools/qualify_host_stream_kernel_cleanup_stack.py
          --archive "$RUNNER_TEMP/linux-6.12.113.tar.xz"
          --output "$RUNNER_TEMP/stream-kernel-cleanup-stack"
      - name: Retain bounded objects measured geometry configuration and failure evidence
        if: always()
        uses: KirilsTurkins/lsf-upload-artifact@01d82cc6ae713563e8d04f36a17af500cf82a6a9 # v7.0.2 + upstream changes + LSF security fixes
        with:
          name: stream-kernel-cleanup-stack-object-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stream-kernel-cleanup-stack/qualification.json
            ${{ runner.temp }}/stream-kernel-cleanup-stack/FAILED.json
            ${{ runner.temp }}/stream-kernel-cleanup-stack/selection.json
            ${{ runner.temp }}/stream-kernel-cleanup-stack/commands.json
            ${{ runner.temp }}/stream-kernel-cleanup-stack/baseline.config
            ${{ runner.temp }}/stream-kernel-cleanup-stack/selected.config
            ${{ runner.temp }}/stream-kernel-cleanup-stack/commands/logs/*.txt
            ${{ runner.temp }}/stream-kernel-cleanup-stack/objects/include/generated/autoconf.h
            ${{ runner.temp }}/stream-kernel-cleanup-stack/objects/net/factory.o
            ${{ runner.temp }}/stream-kernel-cleanup-stack/objects/kernel/fork.o
            ${{ runner.temp }}/stream-kernel-cleanup-stack/objects/kernel/kthread.o
            ${{ runner.temp }}/stream-kernel-cleanup-stack/objects/mm/vmalloc.o
            ${{ runner.temp }}/stream-kernel-cleanup-stack/geometry/*.bin
          if-no-files-found: warn
          retention-days: 3
